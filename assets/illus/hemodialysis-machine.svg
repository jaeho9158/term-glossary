;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.55"/><line x1="60" y1="383" x2="310" y2="383" style="stroke:currentColor;fill:none" stroke-width="2" stroke-dasharray="6 3"/><line x1="60" y1="346" x2="310" y2="346" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="60" y1="420" x2="310" y2="420" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="80" y1="364" x2="290" y2="364" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#hemodialysis-machine-ar-1)"/><line x1="290" y1="402" x2="80" y2="402" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#hemodialysis-machine-ar-2)"/><circle cx="120" cy="356" r="3.5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><circle cx="172" cy="372" r="3.5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><circle cx="226" cy="358" r="3.5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><circle cx="250" cy="374" r="3.5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><circle cx="140" cy="392" r="3.5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><circle cx="200" cy="396" r="3.5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><circle cx="250" cy="394" r="3.5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><line x1="150" y1="369" x2="150" y2="395" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#hemodialysis-machine-ar-3)"/><line x1="210" y1="369" x2="210" y2="395" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#hemodialysis-machine-ar-3)"/><text x="54" y="356" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">혈액</text><text x="54" y="412" text-anchor="end" font-weight="700" style="fill:var(--si-blue-t,#12305c)">투석액</text><text x="180" y="444" text-anchor="middle">혈액과 투석액이 반대 방향으로 흐른다</text><text x="180" y="464" text-anchor="middle">점 = 노폐물·수분이 막을 건너 투석액 쪽으로 이동</text><text x="180" y="484" text-anchor="middle">혈액 입구(전)는 농도 높음, 출구(후)는 낮음</text><line x1="16" y1="502" x2="344" y2="502" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><rect x="16" y="516" width="328" height="100" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.35"/><text x="28" y="542">주 2~3회, 회당 3~4시간 (예: 주 3회, 4시간)</text><g class="si-rich" font-size="13" ><text x="28" y="562">효율 지표: </text><text x="101.7" y="555.8" text-anchor="middle" font-size="10.4">Kt</text><line x1="93.2" y1="557.8" x2="110.1" y2="557.8" style="stroke:currentColor" stroke-width="0.8"/><text x="101.7" y="566.8" text-anchor="middle" font-size="10.4">V</text><text x="111.6" y="562"> (요소 제거율 이용)</text></g><text x="28" y="582">약물 제거율은 투석기 통과 전후</text><text x="28" y="602">혈중 농도 차이로 구한다.</text></svg>
