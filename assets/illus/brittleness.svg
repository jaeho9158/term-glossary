<svg class="si si-illus" viewBox="0 0 360 760" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brittleness-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="brittleness-t">취성: 응력-변형률 곡선과 균열 크기에 따른 파단 응력</title><defs><marker id="brittleness-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="brittleness-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">취성: 곡선과 균열 크기</text><path d="M44 216 L170 76 V216 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.5"/><path d="M44 216 L96 150 C120 122 160 108 210 106 C260 104 292 116 308 140 L322 176 V216 Z" style="stroke:none;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6" fill-opacity="0.45"/><line x1="44" y1="216" x2="340" y2="216" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#brittleness-ar)"/><line x1="44" y1="216" x2="44" y2="54" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#brittleness-ar)"/><text x="52" y="64">응력</text><text x="340" y="238" text-anchor="end">변형률</text><line x1="44" y1="216" x2="170" y2="76" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><line x1="164" y1="70" x2="176" y2="82" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="164" y1="82" x2="176" y2="70" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><path d="M44 216 L96 150 C120 122 160 108 210 106 C260 104 292 116 308 140 L322 176" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.8"/><circle cx="322" cy="176" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="54" y="118" font-weight="700" style="fill:var(--si-blue-t,#12305c)">취성 재료</text><text x="184" y="70" style="fill:var(--si-rose-t,#7d2626)">갑작스런 파단</text><text x="300" y="98" text-anchor="middle" font-weight="700">연성 재료</text><text x="113" y="206" text-anchor="middle">작음</text><text x="222" y="168" text-anchor="middle">큼</text><text x="318" y="204" text-anchor="end">목 줄음(necking)</text><line x1="300" y1="190" x2="312" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="312" cy="150" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="16" y="262">곡선 아래 넓이 = 파단까지 흡수한 에너지</text><text x="16" y="282">취성은 강도와 다른 개념이다.</text><text x="16" y="302">고강도 세라믹도 취성, 약한 납은 연성이다.</text><line x1="16" y1="320" x2="344" y2="320" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="342" text-anchor="middle" font-weight="700">내부 균열이 클수록 약하다</text><rect x="28" y="378" width="120" height="80" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><ellipse cx="88" cy="418" rx="7" ry="2.6" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><line x1="58" y1="378" x2="58" y2="358" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#brittleness-ar-1)"/><line x1="118" y1="458" x2="118" y2="478" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#brittleness-ar-1)"/><text x="66" y="372" font-style="italic" style="fill:var(--si-rose-t,#7d2626)">σ</text><text x="126" y="476" font-style="italic" style="fill:var(--si-rose-t,#7d2626)">σ</text><text x="88" y="502" text-anchor="middle" font-weight="700">a = 1 µm</text><text x="88" y="522" text-anchor="middle">σ<tspan dy="0.217em" font-size="92%">f</tspan><tspan dy="-0.2em"> ≈ 211 MPa</tspan></text><rect x="212" y="378" width="120" height="80" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><ellipse cx="272" cy="418" rx="40" ry="2.6" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><line x1="242" y1="378" x2="242" y2="358" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#brittleness-ar-1)"/><line x1="302" y1="458" x2="302" y2="478" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#brittleness-ar-1)"/><text x="250" y="372" font-style="italic" style="fill:var(--si-rose-t,#7d2626)">σ</text><text x="310" y="476" font-style="italic" style="fill:var(--si-rose-t,#7d2626)">σ</text><text x="272" y="502" text-anchor="middle" font-weight="700">a = 100 µm</text><text x="272" y="522" text-anchor="middle">σ<tspan dy="0.217em" font-size="92%">f</tspan><tspan dy="-0.2em"> ≈ 21 MPa</tspan></text><line x1="272" y1="436" x2="312" y2="436" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#brittleness-ar)" marker-start="url(#brittleness-ar)"/><text x="292" y="451" text-anchor="middle" font-style="italic">a</text><g class="si-rich" font-size="13" ><text x="91.4" y="556">a가 100배 커지면 σ<tspan dy="0.217em" font-size="92%">f</tspan><tspan dy="-0.2em">는 약 </tspan></text><text x="259.1" y="549.8" text-anchor="middle" font-size="10.4">1</text><line x1="251.2" y1="551.8" x2="267.1" y2="551.8" style="stroke:currentColor" stroke-width="0.8"/><text x="259.1" y="560.8" text-anchor="middle" font-size="10.4">10</text></g><g class="si-rich" font-size="15"  font-weight="700"><text x="133.2" y="600">σ<tspan dy="0.217em" font-size="92%">f</tspan><tspan dy="-0.2em"> = √(</tspan></text><text x="202.7" y="592.8" text-anchor="middle" font-size="12">2Eγ</text><line x1="189.5" y1="595.2" x2="216" y2="595.2" style="stroke:currentColor" stroke-width="0.9"/><text x="202.7" y="605.5" text-anchor="middle" font-size="12">πa</text><text x="217.5" y="600">)</text></g><text x="180" y="634" text-anchor="middle">E = 70 GPa, γ = 1 J/m² (설명용 가상 상수)</text><line x1="16" y1="652" x2="344" y2="652" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="674">파단 연신율이 몇 % 이하이면 취성으로 보는</text><text x="16" y="694">관행은 교재마다 다르며 엄밀한 기준이 아니다.</text><text x="16" y="714">천이온도 아래에서는 연성 재료도</text><text x="16" y="734">소성변형을 못 해 급격히 깨진다.</text></svg>
