<svg class="si si-illus" viewBox="0 0 360 444" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="confusion-matrix-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="confusion-matrix-t">혼동행렬: 행·열 방향으로 읽는 지표</title><defs></defs><text x="180" y="22" text-anchor="middle" font-weight="700">혼동행렬: 실제와 예측을 교차한 표</text><text x="86" y="52" text-anchor="middle">예측 양성</text><text x="170" y="52" text-anchor="middle">예측 음성</text><text x="38" y="102" text-anchor="end">실제</text><text x="38" y="122" text-anchor="end">양성</text><text x="38" y="178" text-anchor="end">실제</text><text x="38" y="198" text-anchor="end">음성</text><rect x="44" y="66" width="84" height="76" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="86" y="88" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-green-t,#14543c)">TP</text><text x="86" y="112" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">양성을</text><text x="86" y="132" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">양성으로</text><rect x="128" y="66" width="84" height="76" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="170" y="88" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">FN</text><text x="170" y="112" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">양성을</text><text x="170" y="132" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">음성으로</text><rect x="44" y="142" width="84" height="76" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="86" y="164" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">FP</text><text x="86" y="188" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">음성을</text><text x="86" y="208" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">양성으로</text><rect x="128" y="142" width="84" height="76" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="170" y="164" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-green-t,#14543c)">TN</text><text x="170" y="188" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">음성을</text><text x="170" y="208" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">음성으로</text><polyline points="218,70 224,70 224,138 218,138" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><text x="234" y="90">P = TP+FN</text><text x="234" y="110" font-weight="700" style="fill:var(--si-blue-t,#12305c)">재현율(민감도)</text><text x="234" y="130" style="fill:var(--si-blue-t,#12305c)">= TP/(TP+FN)</text><polyline points="218,146 224,146 224,214 218,214" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><text x="234" y="166">N = FP+TN</text><text x="234" y="186" font-weight="700" style="fill:var(--si-blue-t,#12305c)">특이도</text><text x="234" y="206" style="fill:var(--si-blue-t,#12305c)">= TN/(TN+FP)</text><polyline points="46,226 46,232 126,232 126,226" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8"/><text x="44" y="254" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">정밀도 = TP/(TP+FP)</text><text x="14" y="290" style="fill:var(--si-green-t,#14543c)">초록 칸(대각선)은 맞힌 사례이다.</text><text x="14" y="320" font-weight="700">정확도 = (TP+TN) / 전체</text><text x="14" y="340" font-weight="700">F1 = 2×정밀도×재현율 / (정밀도+재현율)</text><text x="14" y="370">모든 지표는 0~1이다.</text><text x="14" y="404">재현율은 행 방향(파랑)으로,</text><text x="14" y="424">정밀도는 열 방향(주황)으로 센다.</text></svg>
