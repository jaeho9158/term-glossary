<svg class="si si-illus" viewBox="0 0 360 432" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cataplerosis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cataplerosis-t">유출대사반응: 구연산 회로 중간산물의 유출과 보충</title><defs><marker id="cataplerosis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="cataplerosis-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="cataplerosis-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="cataplerosis-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><text x="180" y="18" text-anchor="middle" font-weight="700">유출(cataplerosis)과 보충: 구연산 회로</text><circle cx="180" cy="210" r="80" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="3"/><rect x="83" y="139" width="80" height="28" rx="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="123" y="158" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">시트르산</text><rect x="175" y="139" width="124" height="28" rx="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="237" y="158" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">α-케토글루타르산</text><rect x="189" y="253" width="96" height="28" rx="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:v