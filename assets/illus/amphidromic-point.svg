<svg class="si si-illus" viewBox="0 0 600 330" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amphidromic-point-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="amphidromic-point-t">무조점</title><desc>가운데 점이 조차가 0인 무조점이다. 둘레의 점선 원은 조차가 같은 곳이며 바깥일수록 조차가 크다. 주황 화살표는 북반구에서 조석 파동이 무조점 둘레를 반시계 방향으로 도는 모습이다</desc><defs><marker id="amphidromic-point-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><circle cx="220" cy="170" r="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" stroke-dasharray="4 3"/><circle cx="220" cy="170" r="80" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" stroke-dasharray="4 3"/><circle cx="220" cy="170" r="120" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" stroke-dasharray="4 3"/><circle cx="220" cy="170" r="5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="400" y="60" font-size="12">무조점: 조차 0</text><line x1="400" y1="60" x2="220" y2="170" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="220" cy="170" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><path d="M355,170 C348.5,154 338.5,96.5 316,74 C293.5,51.5 252,35 220,35 C188,35 140,67.5 124,74" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2"/><line x1="130" y1="70" x2="100" y2="110" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#amphidromic-point-ar)"/><text x="400" y="150" font-size="12">조석 파동이 반시계 방향으로</text><text x="400" y="168" font-size="12">한 주기에 한 바퀴 돈다</text><text x="400" y="230" font-size="12">바깥 원일수록 조차가 크다</text><line x1="396" y1="226" x2="340" y2="200" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
