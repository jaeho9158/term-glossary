<svg class="si si-illus" viewBox="0 0 360 482" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="매수·매도호가와 체결가: 호가 스프레드와 유효 스프레드" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="bid-ask-spread-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="140" y="24" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">가격(원)</text><line x1="140" y1="374" x2="140" y2="36" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#bid-ask-spread-ar)"/><line x1="124" y1="50" x2="156" y2="50" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="112" y="55" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">매도호가 10,050</text><line x1="124" y1="200" x2="156" y2="200" style="stroke:currentColor;fill:none" stroke-width="2.4"/><text x="112" y="205" text-anchor="end" font-weight="700">중간가 10,000</text><line x1="124" y1="350" x2="156" y2="350" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><text x="112" y="355" text-anchor="end" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">매수호가 9,950</text><line x1="140" y1="80" x2="215" y2="80" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="140" cy="80" r="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="112" y="85" text-anchor="end" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">체결 10,040</text><line x1="140" y1="200" x2="215" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="2 3"/><line x1="140" y1="320" x2="215" y2="320" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="140" cy="320" r="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="112" y="325" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">대칭 위치</text><polyline points="169,50 175,50 175,350 169,350" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><polyline points="209,80 215,80 215,320 209,320" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2"/><text x="150" y="376" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">호가 스프레드</text><text x="150" y="398" style="fill:var(--si-rose-s,#c97b7b)">100원 = 1.00%</text><text x="228" y="190" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">유효 스프레드</text><text x="228" y="212" style="fill:var(--si-violet-s,#9382bd)">2 × 40 = 80원</text><text x="228" y="234" style="fill:var(--si-violet-s,#9382bd)">= 0.80%</text><line x1="181" y1="50" x2="270" y2="50" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2" stroke-dasharray="2 3"/><line x1="221" y1="80" x2="270" y2="80" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.2" stroke-dasharray="2 3"/><line x1="262" y1="50" x2="262" y2="80" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#bid-ask-spread-ar)" marker-start="url(#bid-ask-spread-ar)"/><text x="288" y="69" text-anchor="middle">10원</text><text x="228" y="112">호가 안쪽에서 체결</text><text x="228" y="136" font-weight="700">실제 비용이</text><text x="228" y="160" font-weight="700">더 작음</text><line x1="6" y1="420" x2="354" y2="420" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="6" y="444">중간가 = (9,950 + 10,050) ÷ 2 = 10,000원</text><text x="6" y="466" style="fill:var(--si-general,#5c6b7f)">가상 종목 예시이며 가격 축은 구간만 확대함</text></svg>
