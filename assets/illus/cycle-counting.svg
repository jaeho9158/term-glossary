<svg class="si si-illus" viewBox="0 0 360 582" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cycle-counting-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cycle-counting-t">순환재고조사: 연간 작업량 비교</title><defs><marker id="cycle-counting-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">연간 작업량: 몰아서 세기 vs 나눠서 세기</text><text x="20" y="50" font-weight="700">연 1회 전수</text><line x1="40" y1="170" x2="345" y2="170" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#cycle-counting-ar)"/><line x1="40" y1="170" x2="40" y2="62" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="40" y="130" width="300" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" stroke-dasharray="5 3" fill-opacity="0.2"/><rect x="296" y="92" width="10" height="78" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.6"/><line x1="290" y1="112" x2="312" y2="106" style="stroke:var(--si-bg,#ffffff);fill:none" stroke-width="5"/><line x1="290" y1="118" x2="312" y2="112" style="stroke:var(--si-bg,#ffffff);fill:none" stroke-width="5"/><text x="292" y="76" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">하루에 1,000건 몰아서</text><text x="48" y="100" style="fill:var(--si-blue-s,#7f9ac0)">고르게 나누면 하루 4건</text><text x="48" y="120" style="fill:var(--si-blue-s,#7f9ac0)">(1,000÷250)</text><text x="40" y="190">1일</text><text x="340" y="190" text-anchor="end">250일(영업일)</text><text x="20" y="212" font-weight="700">순환재고조사</text><text x="340" y="212" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">하루 7.6건씩 1년 내내</text><rect x="40" y="340" width="300" height="20" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.5"/><rect x="40" y="316" width="300" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.5"/><rect x="40" y="284" width="300" height="32" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.5"/><text x="48" y="304.5">A 3.2건/일</text><text x="48" y="332.5">B 2.4건/일</text><text x="48" y="353">C 2.0건/일</text><line x1="40" y1="360" x2="345" y2="360" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#cycle-counting-ar)"/><line x1="40" y1="360" x2="40" y2="280" style="stroke:currentColor;fill:none" stroke-width="1.4"/><circle cx="127.4" cy="272.4" r="6.2" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="131.8" y1="276.8" x2="139.9" y2="284.9" style="stroke:currentColor;fill:none" stroke-width="1.5"/><circle cx="207.4" cy="272.4" r="6.2" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="211.8" y1="276.8" x2="219.9" y2="284.9" style="stroke:currentColor;fill:none" stroke-width="1.5"/><circle cx="287.4" cy="272.4" r="6.2" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="291.8" y1="276.8" x2="299.9" y2="284.9" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="210" y="237" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">실물과 장부를 대조하고 차이가 나면</text><text x="210" y="257" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">원인 조사, 장부 정정</text><text x="40" y="380">1일</text><text x="340" y="380" text-anchor="end">250일</text><text x="180" y="418" text-anchor="middle" font-weight="700">ABC 분석별 연간 계수 횟수</text><rect x="40" y="430" width="14" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.5"/><text x="62" y="442">A 200개 × 연 4회 = 800건</text><rect x="40" y="452" width="14" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.5"/><text x="62" y="464">B 300개 × 연 2회 = 600건</text><rect x="40" y="474" width="14" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.5"/><text x="62" y="486">C 500개 × 연 1회 = 500건</text><text x="180" y="516" text-anchor="middle" font-weight="700">합계 1,900건 ÷ 250일 = 7.6건/일</text><text x="180" y="544" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">빈도는 설명용 가상 값이며</text><text x="180" y="566" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">실제 빈도는 기업마다 다르다.</text></svg>
