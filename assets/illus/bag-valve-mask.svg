<svg class="si si-illus" viewBox="0 0 360 620" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="백밸브마스크의 구성과 사용 절차" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="bag-valve-mask-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="bag-valve-mask-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="bag-valve-mask-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">백밸브마스크: 구성과 공기 흐름</text><path d="M44,110 C51.1,108.8 59.1,111.9 64,114.8 C68.9,117.7 71.7,123.3 73.6,127.6 C75.5,131.9 75.1,136.4 75.2,140.4 C75.3,144.4 72.9,148.1 74.4,151.6 C75.9,155.1 83.9,158.9 84,161.2 C84.1,163.5 76.5,163.5 75.2,165.2 C73.9,166.9 76.4,169.5 76,171.6 C75.6,173.7 73.6,175.5 72.8,178 C72,180.5 73.1,184.8 71.2,186.8 C69.3,188.8 65.2,190.3 61.6,190 C58,189.7 53.2,187.1 49.6,185.2 C46,183.3 44.3,182 40,178.8 C35.7,175.6 28.1,171.5 24,166 C19.9,160.5 15.6,153.3 15.2,146 C14.8,138.7 16.8,128 21.6,122 C26.4,116 36.9,111.2 44,110Z" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><path d="M43.2,148.4 Q52,145.2 51.2,158 Q48,164.4 43.2,162" style="stroke:currentColor;fill:none" stroke-width="1.4400000000000002"/><circle cx="65.6" cy="143.6" r="1.8" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><path d="M80 120 Q124 130 126 150 Q124 170 80 180 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8" fill-opacity="0.85"/><rect x="126" y="138" width="20" height="24" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><line x1="142" y1="150" x2="130" y2="150" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#bag-valve-mask-ar)"/><ellipse cx="205" cy="150" rx="52" ry="40" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="205" y="146" text-anchor="middle">자가팽창 백</text><text x="205" y="164" text-anchor="middle">약 30 cm</text><line x1="257" y1="150" x2="272" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="4"/><ellipse cx="312" cy="150" rx="38" ry="22" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="312" y="120" text-anchor="middle">산소 저장백</text><polyline points="312,238 312,174" style="stroke:currentColor;fill:none" stroke-width="10"/><polyline points="312,238 312,174" style="stroke:var(--si-bg,#ffffff);fill:none" stroke-width="7"/><line x1="312" y1="238" x2="312" y2="174" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#bag-valve-mask-ar-1)"/><text x="300" y="258" text-anchor="middle">산소원(O<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">) 연결</tspan></text><text x="350" y="278" text-anchor="end" font-weight="700">연결하면 산소 거의 100%</text><text x="350" y="298" text-anchor="end">연결하지 않으면 실내 공기 약 21%</text><text x="14" y="92">안면 마스크</text><line x1="86" y1="97" x2="100" y2="124" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="100" cy="124" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="56" y="74">일방향 밸브(역류 방지)</text><line x1="130" y1="79" x2="136" y2="134" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="136" cy="134" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><line x1="198" y1="78" x2="198" y2="104" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#bag-valve-mask-ar-2)"/><line x1="228" y1="78" x2="228" y2="104" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#bag-valve-mask-ar-2)"/><text x="252" y="86" font-weight="700" style="fill:var(--si-blue-t,#12305c)">눌러서 약 1초</text><polygon points="236,210 116.8,210 116.8,216 100,204 116.8,192 116.8,198 236,198" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.35"/><text x="150" y="232" text-anchor="middle">공기가 마스크 쪽으로</text><line x1="16" y1="316" x2="344" y2="316" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="338" text-anchor="middle" font-size="14" font-weight="700">절차</text><circle cx="28" cy="362" r="9" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="28" y="366.5" text-anchor="middle" font-weight="700">1</text><text x="46" y="367">머리와 턱을 기도가 열리는 자세로 둔다</text><circle cx="28" cy="390" r="9" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="28" y="394.5" text-anchor="middle" font-weight="700">2</text><text x="46" y="395">마스크를 코와 입에 밀착한다(EC 클램프)</text><circle cx="28" cy="418" r="9" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="28" y="422.5" text-anchor="middle" font-weight="700">3</text><text x="46" y="423">가슴이 올라오는 정도로 약 1초 불어넣는다</text><circle cx="28" cy="446" r="9" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="28" y="450.5" text-anchor="middle" font-weight="700">4</text><text x="46" y="451">산소원을 연결해 고농도 산소를 공급한다</text><line x1="16" y1="484" x2="344" y2="484" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="508" font-weight="700">한 호흡: 약 500~600 mL(6~7 mL/kg)</text><text x="16" y="527.5">1회 호흡량 조절 장치가 없어 누르는 힘에 따라</text><text x="16" y="547">달라진다.</text><text x="16" y="566.5" font-weight="700">큰 위험: 위 팽창 → 구토·흡인</text><text x="16" y="586">흔한 방식은 2인 조작: 한 명은 양손으로 마스크,</text><text x="16" y="605.5">다른 한 명은 백을 짠다.</text></svg>
