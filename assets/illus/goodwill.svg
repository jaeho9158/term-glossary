<svg class="si si-illus" viewBox="0 0 360 452" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goodwill-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="goodwill-t">영업권: 이전대가가 순자산 공정가치를 넘는 금액</title><defs></defs><line x1="108" y1="262" x2="94" y2="262" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="102" y1="137" x2="94" y2="137" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="135" y="60" text-anchor="middle" font-weight="700">취득 자산·부채</text><text x="231" y="60" text-anchor="middle" font-weight="700">이전대가 20</text><text x="92" y="266" text-anchor="end">매출채권 10</text><text x="135" y="167" text-anchor="middle">재고 5</text><text x="92" y="146" text-anchor="end">매입채무 −6</text><line x1="40" y1="300" x2="330" y2="300" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><rect x="102" y="190" width="66" height="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.3"/><rect x="102" y="135" width="66" height="55" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.3"/><rect x="102" y="135" width="66" height="66" style="stroke:currentColor;fill:none" stroke-width="1.6" stroke-dasharray="4 3" fill-opacity="0"/><rect x="198" y="201" width="66" height="99" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.3"/><rect x="198" y="80" width="66" height="121" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6" fill-opacity="0.4"/><line x1="102" y1="201" x2="272" y2="201" style="stroke:currentColor;fill:none" stroke-width="2" stroke-dasharray="5 3"/><text x="183" y="194" text-anchor="middle" font-weight="700">9</text><text x="231" y="260" text-anchor="middle">순자산 9</text><text x="231" y="140.5" text-anchor="middle" font-weight="700">영업권 11</text><path d="M 272 80 q 8 0 8 8 v 52.5 q 0 6 6 6 q -6 0 -6 6 v 46.5 q 0 8 -8 8" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2"/><text x="288" y="132.8" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">웃돈</text><text x="288" y="152.8" style="fill:var(--si-violet-s,#9382bd)">20 − 9</text><text x="14" y="336" font-weight="700">영업권 = 이전대가 − (자산 − 부채)</text><text x="14" y="358">= 20 − (10 + 5 − 6) = 11</text><text x="14" y="392" style="fill:var(--si-general,#5c6b7f)">공개기업은 상각하지 않고 매년 손상검사를 한다.</text><text x="14" y="414" style="fill:var(--si-general,#5c6b7f)">공정가치가 장부가치보다 낮으면 손상차손을 인식하며,</text><text x="14" y="436" style="fill:var(--si-general,#5c6b7f)">이후 환입하지 않는다.</text></svg>
