si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#law-of-diminishing-marginal-utility-ar)"/><text x="173.2" y="384" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">증가폭이 줄어든다</text><text x="14" y="540" style="fill:var(--si-general,#5c6b7f)">위쪽 노랑 막대의 높이가 아래쪽 막대 높이다.</text><g class="si-rich" font-size="13"  font-weight="700"><text x="14" y="572">효용 극대화: </text><text x="104.2" y="565.8" text-anchor="middle" font-size="10.4">MU<tspan dy="0.217em" font-size="92%">x</tspan></text><line x1="92.2" y1="567.8" x2="116.1" y2="567.8" style="stroke:currentColor" stroke-width="0.8"/><text x="104.2" y="576.8" text-anchor="middle" font-size="10.4">P<tspan dy="0.217em" font-size="92%">x</tspan></text><text x="117.6" y="572"> = </text><text x="146.9" y="565.8" text-anchor="middle" font-size="10.4">MU<tspan dy="0.217em" font-size="92%">y</tspan></text><line x1="135" y1="567.8" x2="158.9" y2="567.8" style="stroke:currentColor" stroke-width="0.8"/><text x="146.9" y="576.8" text-anchor="middle" font-size="10.4">P<tspan dy="0.217em" font-size="92%">y</tspan></text></g><text x="14" y="620" style="fill:var(--si-general,#5c6b7f)">한계효용이 양(+)인 동안 총효용은 계속 는다.</text><text x="14" y="596" style="fill:var(--si-general,#5c6b7f)">지출 한 단위당 한계효용을 재화들 사이에 같게 맞춘다.</text></svg>
