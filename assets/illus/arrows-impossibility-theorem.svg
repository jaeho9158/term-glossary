e-width="2.4" marker-end="url(#arrows-impossibility-theorem-ar)"/><line x1="109.9" y1="315.5" x2="168.1" y2="224.5" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#arrows-impossibility-theorem-ar)"/><text x="240" y="254" style="fill:var(--si-rose-t,#7d2626)">A 대 B → 2:1</text><text x="240" y="274" style="fill:var(--si-rose-t,#7d2626)">A 승</text><text x="180" y="372" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">B 대 C → 2:1, B 승</text><text x="120" y="254" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">C 대 A → 2:1</text><text x="120" y="274" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">C 승</text><text x="180" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">A&gt;B&gt;C&gt;A</text><text x="180" y="302" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">순환</text><text x="20" y="414">무작위 모의실험(후보 3명·유권자 101명·20,000회)</text><text x="20" y="434" font-weight="700">순환이 생긴 비율은 약 8%대였다.</text><text x="20" y="470" font-weight="700">애로우가 정리한 조건 5개</text><rect x="20" y="480" width="102" height="24" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><text x="71" y="497" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">무제한 정의역</text><rect x="130" y="480" width="102" height="24" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.2"/><text x="181" y="497" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">완전성·이행성</text><rect x="240" y="480" width="90" height="24" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2"/><text x="285" y="497" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">파레토 원칙</text><rect x="20" y="510" width="64" height="24" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.2"/><text x="52" y="527" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">비독재성</text><rect x="20" y="540" width="266" height="24" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><text x="153" y="557" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">무관한 대안으로부터의 독립성(IIA)</text><text x="20" y="592">선택지 3개 이상·유권자 2명 이상이면</text><text x="20" y="612" font-weight="700">조건을 모두 만족하는 규칙은 독재 규칙뿐이다.</text></svg>
