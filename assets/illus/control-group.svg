<svg class="si si-illus" viewBox="0 0 360 398" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-group-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="control-group-t">대조군: 처치 없이도 생긴 변화를 빼야 효과가 남는다</title><defs><marker id="control-group-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="10" y="22" font-weight="700">우울 점수의 변화 (가상의 예)</text><line x1="60" y1="230" x2="340" y2="230" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.6"/><text x="30" y="235" style="fill:var(--si-general,#5c6b7f)">0</text><text x="30" y="145" style="fill:var(--si-general,#5c6b7f)">5</text><line x1="60" y1="50" x2="340" y2="50" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/><text x="30" y="55" style="fill:var(--si-general,#5c6b7f)">10</text><line x1="60" y1="40" x2="60" y2="230" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="60" y1="230" x2="340" y2="230" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="90" y="252" text-anchor="middle">사전</text><text x="230" y="252" text-anchor="middle">사후</text><line x1="90" y1="50" x2="230" y2="158" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="90" y1="50" x2="230" y2="104" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3"/><circle cx="90" cy="50" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><circle cx="230" cy="158" r="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><circle cx="230" cy="104" r="5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1"/><text x="262" y="108" font-weight="700" style="fill:var(--si-general,#5c6b7f)">대조군 −3점</text><text x="262" y="164" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">참여군 −6점</text><line x1="246" y1="104" x2="246" y2="158" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#control-group-ar)" marker-start="url(#control-group-ar)"/><text x="262" y="138" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">효과 −3점</text><rect x="10" y="270" width="340" height="52" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.6"/><text x="20" y="292">대조군의 −3점은 시간 경과·외부 요인으로</text><text x="20" y="314">처치 없이도 생긴 변화다</text><text x="10" y="352" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">프로그램 효과 추정 = −6 − (−3) = −3점</text><text x="10" y="380" style="fill:var(--si-general,#5c6b7f)">대조군이 없으면 −6점 전부를 처치 효과로 오해</text></svg>
