<svg class="si si-illus" viewBox="0 0 360 510" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fjord-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="fjord-t">피오르의 종단면과 U자곡이 바닷물에 잠기는 과정</title><defs><marker id="fjord-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">피오르의 종단면 (모식)</text><text x="14" y="44">바다 쪽</text><text x="346" y="44" text-anchor="end">내륙 쪽</text><path d="M14 120 H300 L296 120 H14 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" opacity="0"/><path d="M14 120 H300 V160 L296 160 L284 232 L250 250 L200 256 L150 252 L116 214 L96 150 L74 132 L50 146 L14 150 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><path d="M14 150 L50 146 L74 132 L96 150 L116 214 L150 252 L200 256 L250 250 L284 232 L296 160 L300 90 L346 60 V290 H14 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.5"/><line x1="14" y1="120" x2="299" y2="120" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6"/><text x="26" y="112" style="fill:var(--si-blue-t,#12305c)">해수면</text><path d="M300 90 L346 60" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><line x1="186" y1="122" x2="186" y2="254" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#fjord-ar)" marker-start="url(#fjord-ar)"/><text x="192" y="188" font-weight="700">송네피오르</text><text x="192" y="208" font-weight="700">약 1,300 m</text><text x="84" y="88" style="fill:var(--si-rose-t,#7d2626)">100~200 m</text><text x="84" y="104" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">얕은 문턱(sill)</text><line x1="80" y1="108" x2="74" y2="130" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2"/><circle cx="74" cy="132" r="3.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="232" y="280" text-anchor="middle" font-weight="700">안쪽이 입구보다 깊다</text><text x="290" y="146" text-anchor="end">골짜기 끝:</text><text x="290" y="166" text-anchor="end">갑자기 끝남</text><line x1="290" y1="166" x2="297" y2="170" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="297" cy="170" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="180" y="310" text-anchor="middle">길이 200 km 이상 · 수심은 크게 과장한 모식도</text><text x="180" y="340" text-anchor="middle" font-weight="700">형성 과정 (단면)</text><path d="M26 350 L26 378.6 Q26 402 66 402 Q106 402 106 378.6 L106 350 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" opacity="0.9"/><path d="M26 350 L26 378.6 Q26 402 66 402 Q106 402 106 378.6 L106 350" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4"/><text x="66" y="442" text-anchor="middle" font-weight="700">① 빙하가 판다</text><path d="M140 350 L140 378.6 Q140 402 180 402 Q220 402 220 378.6 L220 350" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4"/><path d="M140 350 L180 396 L220 350" style="stroke:currentColor;fill:none" stroke-width="1.4" stroke-dasharray="4 3"/><text x="180" y="442" text-anchor="middle" font-weight="700">② 빙하 소멸</text><path d="M258 364 L258 384.9 Q258 402 294 402 Q330 402 330 384.9 L330 364 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" opacity="0.9"/><path d="M254 350 L254 378.6 Q254 402 294 402 Q334 402 334 378.6 L334 350" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4"/><text x="294" y="442" text-anchor="middle" font-weight="700">③ 해수면 상승</text><text x="180" y="472" text-anchor="middle">실선 U자: 빙하 침식 · 점선 V자: 하천 침식</text><text x="180" y="492" text-anchor="middle">푸른 면: ①은 빙하, ③은 바닷물</text></svg>
