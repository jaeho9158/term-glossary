<svg class="si si-illus" viewBox="0 0 360 416" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="후건 긍정의 오류: Q 안에 있어도 P 밖일 수 있다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="22" text-anchor="middle" font-weight="700">P이면 Q는 P가 Q 안에 포함된다는 뜻이다</text><circle cx="180" cy="150" r="108" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2.2" fill-opacity="0.2"/><circle cx="145" cy="160" r="50" style="stroke:var(--si-pos,#14543c);fill:var(--si-green-s,#5b9b83)" stroke-width="2.2" fill-opacity="0.3"/><text x="180" y="76" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">Q: 땅이 젖음</text><text x="145" y="146" text-anchor="middle" font-weight="700" style="fill:var(--si-pos,#14543c)">P</text><text x="145" y="166" text-anchor="middle" style="fill:var(--si-pos,#14543c)">비가 옴</text><circle cx="122" cy="194" r="5" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="1"/><text x="134" y="200" font-weight="700" style="fill:var(--si-pos,#14543c)">A</text><circle cx="212" cy="200" r="5" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1"/><text x="224" y="206" font-weight="700" style="fill:var(--si-limit,#7d2626)">B</text><text x="212" y="230" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">스프링클러</text><circle cx="18" cy="284" r="5" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="1"/><text x="30" y="289" font-weight="700" style="fill:var(--si-pos,#14543c)">A: P 안이면 반드시 Q 안이다</text><text x="30" y="309" style="fill:var(--si-pos,#14543c)">전건 긍정 → 타당</text><circle cx="18" cy="339" r="5" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1"/><text x="30" y="344" font-weight="700" style="fill:var(--si-limit,#7d2626)">B: Q 안이어도 P 밖일 수 있다</text><text x="30" y="364" style="fill:var(--si-limit,#7d2626)">후건 긍정 → 부당 (Q−P 고리가 반례의 자리)</text><text x="180" y="400" text-anchor="middle" font-weight="700">P이면 Q,  Q이지만 P라고 할 수 없다</text></svg>
