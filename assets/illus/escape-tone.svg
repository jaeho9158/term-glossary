-s,#d79a2b)">이탈음</text><text x="112" y="136" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">순차 상행</text><text x="294" y="100" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">3도</text><text x="294" y="122" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">아래 도약</text><text x="100" y="168" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">화음음</text><text x="190" y="168" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">약박</text><text x="280" y="168" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">화음음</text><text x="20" y="218" font-weight="700">비교: 앱포지아투라는 정반대</text><line x1="70" y1="258" x2="340" y2="258" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><text x="54" y="262" text-anchor="end" font-weight="700">미</text><line x1="70" y1="294" x2="340" y2="294" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><text x="54" y="298" text-anchor="end" font-weight="700">레</text><line x1="70" y1="330" x2="340" y2="330" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><text x="54" y="334" text-anchor="end" font-weight="700">도</text><line x1="108" y1="324" x2="180" y2="264" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#escape-tone-ar-1)"/><line x1="196" y1="266" x2="272" y2="288" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.6" marker-end="url(#escape-tone-ar)"/><circle cx="100" cy="330" r="8" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="280" cy="294" r="8" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="190" cy="258" r="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="3.2"/><text x="190" y="242" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">앱포지아투라</text><text x="80" y="284" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">도약 진입</text><text x="208" y="322" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">순차 해결</text><text x="20" y="396" font-weight="700">순차로 벗어남 → 반대 방향 도약 → 다음 화음음</text><text x="20" y="424" style="fill:var(--si-general,#5c6b7f)">채운 점 = 화음음, 빈 점 = 화성외음</text></svg>
