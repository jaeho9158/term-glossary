<svg class="si si-illus" viewBox="0 0 600 372" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="refractive-index-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="refractive-index-t">공기에서 물로 들어가는 빛의 굴절</title><desc>입사각 30도로 공기에서 물로 들어간 빛이 경계면에서 법선 쪽으로 꺾여 굴절각 약 22도로 나아간다</desc><defs><marker id="refractive-index-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><rect x="40" y="180" width="520" height="150" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><line x1="40" y1="180" x2="560" y2="180" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="300" y1="40" x2="300" y2="320" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="5 4"/><line x1="225" y1="50.1" x2="300" y2="180" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.2" marker-end="url(#refractive-index-ar)"/><line x1="300" y1="180" x2="356.3" y2="319" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.2" marker-end="url(#refractive-index-ar)"/><path d="M300,130 C297.8,130.3 291.2,130.6 287.1,131.7 C282.9,132.8 277,135.9 275,136.7" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><path d="M300,230 C301.6,229.8 306.4,229.7 309.6,229.1 C312.7,228.5 317.2,226.8 318.8,226.3" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="232" y="124" text-anchor="end" font-size="12">θ<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> = 30°</tspan></text><line x1="236" y1="122" x2="286" y2="132" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="236" y="266" text-anchor="end" font-size="12">θ<tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> ≈ 22°</tspan></text><line x1="240" y1="262" x2="309" y2="229" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="306" y="52" font-size="12">법선</text><text x="556" y="172" text-anchor="end" font-size="12">경계면</text><text x="60" y="90" font-size="12">공기  n<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> = 1.000293</tspan></text><text x="60" y="214" font-size="12">물  n<tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> = 1.333</tspan></text><text x="300" y="356" text-anchor="middle" font-size="14">n<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> sin θ</tspan><tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> = n</tspan><tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> sin θ</tspan><tspan dy="0.278em" font-size="72%">2</tspan></text></svg>
