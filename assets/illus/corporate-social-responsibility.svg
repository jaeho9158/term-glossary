<svg class="si si-illus" viewBox="0 0 360 460" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="corporate-social-responsibility-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="corporate-social-responsibility-t">기업의 사회적 책임: 아래에서 위로 쌓이는 캐롤의 피라미드</title><defs><marker id="corporate-social-responsibility-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="24" font-weight="700">기업의 사회적 책임: 캐롤의 피라미드</text><polygon points="150,60 185,130 115,130" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.5"/><polygon points="115,130 185,130 220,200 80,200" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2.5"/><text x="150" y="170" text-anchor="middle" font-weight="700">윤리적 책임</text><polygon points="80,200 220,200 255,270 45,270" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2.5"/><text x="150" y="240" text-anchor="middle" font-weight="700">법적 책임</text><polygon points="45,270 255,270 290,340 10,340" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.5"/><text x="150" y="310" text-anchor="middle" font-weight="700">경제적 책임</text><text x="150" y="114" text-anchor="middle" font-weight="700">자선적</text><line x1="326" y1="336" x2="326" y2="70" style="stroke:currentColor;fill:none" stroke-width="2.5" marker-end="url(#corporate-social-responsibility-ar)"/><text x="346" y="52" text-anchor="end">가장 재량적</text><text x="346" y="366" text-anchor="end">가장 기초적</text><text x="14" y="372" font-weight="700">이윤 추구 위에 쌓이는 확장된 책임</text><text x="14" y="414" style="fill:var(--si-rose-s,#c97b7b)">Friedman: 주주 자산의 임의 처분이라 비판</text><text x="14" y="438" style="fill:var(--si-gr