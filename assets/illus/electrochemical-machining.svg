<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="electrochemical-machining-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="electrochemical-machining-t">전해가공: 음극 공구와 양극 공작물 사이의 좁은 틈과 전해액</title><defs><marker id="electrochemical-machining-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="electrochemical-machining-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><line x1="258" y1="127" x2="318" y2="107" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><rect x="170" y="40" width="120" height="60" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="2" fill-opacity="0.3"/><polygon points="190,100 270,100 255,122 205,122" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="2" fill-opacity="0.3"/><text x="300" y="64" font-weight="700" style="fill:var(--si-accent,#2454ff)">공구(음극)</text><rect x="110" y="134" width="240" height="70" style="stroke:currentColor;fill:currentColor" stroke-width="2" fill-opacity="0.2"/><text x="360" y="172" font-weight="700">공작물(양극)</text><line x1="230" y1="24" x2="230" y2="48" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#electrochemical-machining-ar)"/><text x="240" y="24" font-size="12">이송</text><line x1="130" y1="128" x2="200" y2="124" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" marker-end="url(#electrochemical-machining-ar-1)"/><line x1="325" y1="128" x2="262" y2="124" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" marker-end="url(#electrochemical-machining-ar-1)"/><text x="60" y="116" font-size="12">전해액</text><text x="320" y="100" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">틈 대개 1 mm 이하</text><text x="60" y="246" font-size="12">금속이 이온으로 녹아 나가고, 전해액이 수산화물 침전물(슬러지)을 씻어 낸다</text><text x="60" y="270" font-size="12" font-weight="700">제거량은 흘린 전하량에 비례해(패러데이 법칙) 단단한 재료도 가공한다</text><text x="60" y="298" font-size="12" style="fill:var(--si-general,#5c6b7f)">공구는 닿지 않아 마모가 거의 없고, 공작물에는 공구 모양이 옮겨진다</text></svg>
