<svg class="si si-illus" viewBox="0 0 360 442" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="back-arc-basin-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="back-arc-basin-t">배호분지: 해구 후퇴로 화산호 뒤 윗판이 벌어진다</title><defs><marker id="back-arc-basin-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="back-arc-basin-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="back-arc-basin-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><polygon points="10,90 350,90 350,332 10,332" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="0" fill-opacity="0.25"/><polygon points="10,60 350,60 350,120 200,120 160,90 10,90" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="0" fill-opacity="0.5"/><polygon points="96,82 130,74 160,76 200,94 222,120 262,112 300,88 350,84 350,160 270,160 242,138 214,160 161,160 96,90" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><polygon points="10,84 84,84 96,90 210,212 230,292 210,296 190,236 80,110 10,108" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><polygon points="110,78 124,52 138,78" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><polygon points="136,78 150,52 164,78" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><polygon points="222,120 242,126 262,112" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><line x1="66" y1="170" x2="22" y2="170" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.2" marker-end="url(#back-arc-basin-ar)"/><text x="14" y="192" font-weight="700" style="fill:var(--si-accent,#2454ff)">해구 후퇴</text><line x1="208" y1="144" x2="178" y2="144" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" marker-end="url(#back-arc-basin-ar-1)"/><line x1="276" y1="144" x2="306" y2="144" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" marker-end="url(#back-arc-basin-ar-1)"/><line x1="242" y1="200" x2="242" y2="142" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#back-arc-basin-ar-2)"/><text x="14" y="46" font-weight="700">해구</text><line x1="34" y1="50" x2="88" y2="86" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="118" y="32" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">화산호</text><text x="206" y="52" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">배호분지</text><line x1="242" y1="58" x2="242" y2="114" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1"/><text x="296" y="108" font-weight="700">윗판</text><text x="18" y="136" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">섭입판</text><text x="250" y="316" style="fill:var(--si-general,#5c6b7f)">맨틀</text><text x="150" y="136" style="fill:var(--si-green-s,#5b9b83)">신장</text><text x="298" y="136" style="fill:var(--si-green-s,#5b9b83)">신장</text><text x="252" y="196" style="fill:var(--si-rose-s,#c97b7b)">맨틀 상승</text><text x="14" y="356" style="fill:var(--si-general,#5c6b7f)">배호분지는 화산호 뒤쪽(윗판 안쪽)에 있다.</text><text x="14" y="376" style="fill:var(--si-general,#5c6b7f)">벌어짐이 크면 새 해양지각이 생긴다(주황 마루).</text><text x="14" y="404" font-weight="700">섭입대는 밀기만 하지 않고 당긴다</text><text x="14" y="424" font-weight="700">→ 화산호 뒤에서 지각이 벌어진다</text></svg>
