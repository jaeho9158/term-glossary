<svg class="si si-illus" viewBox="0 0 560 340" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallax-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="parallax-t">연주시차의 기하</title><desc>태양을 중심으로 지구가 반지름 1 au 원궤도를 돌 때, 가까운 별을 6개월 간격으로 보면 배경별 사이에서 위치가 달라 보이는 모습과, 태양-지구-별이 이루는 직각삼각형에서 시차각 p를 나타낸 모식도</desc><defs></defs><text x="20" y="20" font-size="12" font-weight="700">연주시차: 가까운 별이 배경별 앞에서 움직여 보인다(모식, 비례 아님)</text><line x1="60" y1="70" x2="500" y2="70" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="90" cy="70" r="2.5" style="stroke:none;fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><circle cx="150" cy="70" r="2.5" style="stroke:none;fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><circle cx="210" cy="70" r="2.5" style="stroke:none;fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><circle cx="420" cy="70" r="2.5" style="stroke:none;fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><circle cx="470" cy="70" r="2.5" style="stroke:none;fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><line x1="180" y1="270" x2="305" y2="70" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.4"/><line x1="380" y1="270" x2="255" y2="70" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4"/><circle cx="305" cy="70" r="3.5" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="255" cy="70" r="3.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><path d="M 180 270 A 100 100 0 0 1 380 270" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="280" cy="270" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.8"/><circle cx="180" cy="270" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.8"/><circle cx="380" cy="270" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.8"/><circle cx="280" cy="110" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><line x1="280" y1="270" x2="280" y2="110" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="280" y1="270" x2="380" y2="270" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="280,260 290,260 290,270" style="stroke:currentColor;fill:none" stroke-width="1"/><path d="M280,150 A40,40 0 0 0 301.2,143.9" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="290" y="104" font-size="12">가까운 별</text><text x="276" y="292" text-anchor="end" font-size="12">태양</text><text x="180" y="292" text-anchor="middle" font-size="12">지구(6개월 전)</text><text x="380" y="292" text-anchor="middle" font-size="12">지구(지금)</text><text x="330" y="262" text-anchor="middle" font-size="12">1 au</text><text x="320" y="156" font-size="12" font-weight="700">p</text><text x="288" y="190" font-size="12">거리 d</text><text x="315" y="60" font-size="12" style="fill:var(--si-accent,#2454ff)">6개월 전 위치에서 본 별</text><text x="245" y="60" text-anchor="end" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">지금 위치에서 본 별</text><text x="540" y="86" text-anchor="end" font-size="12" style="fill:var(--si-general,#5c6b7f)">배경별</text><g class="si-rich" font-size="12"  font-weight="700" style="fill:var(--si-accent,#2454ff)"><text x="169.6" y="320">tan p ≈ 1 </text><text x="237.6" y="314.2" text-anchor="middle" font-size="9.6">au</text><line x1="230.2" y1="316.2" x2="245.1" y2="316.2" style="stroke:var(--si-accent,#2454ff)" stroke-width="0.8"/><text x="237.6" y="324.4" text-anchor="middle" font-size="9.6">d</text><text x="246.6" y="320">,   p(각초) = 1 / d(파섹)</text></g></svg>
