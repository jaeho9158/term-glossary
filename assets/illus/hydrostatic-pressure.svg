-pressure-ar)"/><line x1="290" y1="150" x2="290" y2="196" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#hydrostatic-pressure-ar)"/><line x1="335" y1="150" x2="335" y2="196" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#hydrostatic-pressure-ar)"/><line x1="380" y1="150" x2="380" y2="196" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#hydrostatic-pressure-ar)"/><line x1="20" y1="60" x2="20" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#hydrostatic-pressure-ar-1)" marker-start="url(#hydrostatic-pressure-ar-1)"/><text x="14" y="125" text-anchor="middle">h</text><text x="230" y="224" text-anchor="middle">바닥이 받는 압력 p는 세 용기에서 모두 같다</text></svg>
