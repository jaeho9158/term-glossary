" ><text x="14" y="588">필요 시 요골 </text><text x="96.9" y="581.8" text-anchor="middle" font-size="10.4">1</text><line x1="92.2" y1="583.8" x2="101.6" y2="583.8" style="stroke:currentColor" stroke-width="0.8"/><text x="96.9" y="592.8" text-anchor="middle" font-size="10.4">3</text></g><text x="14" y="628" style="fill:var(--si-general,#5c6b7f)">유효선량은 수 μSv 수준이다</text></svg>
