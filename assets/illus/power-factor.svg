<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="power-factor-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="power-factor-t">역률 삼각형: 유효전력 P, 무효전력 Q, 피상전력 S</title><defs><marker id="power-factor-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="power-factor-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="332" y1="132.6" x2="340" y2="123.6" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="70" y1="262" x2="310" y2="262" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="310" y1="262" x2="310" y2="82" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="70" y1="262" x2="310" y2="82" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3" marker-end="url(#power-factor-ar)"/><polyline points="313.1,273.6 324.7,276.7 321.6,265.1" style="stroke:currentColor;fill:none" stroke-width="1"/><line x1="70" y1="262" x2="310" y2="183.1" style="stroke:var(--si-rose-s);fill:none" stroke-width="2" stroke-dasharray="6 4"/><line x1="330" y1="183.1" x2="330" y2="82" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#power-factor-ar-1)" marker-start="url(#power-factor-ar-1)"/><path d="M126,262 A56,56 0 0 0 114.8,228.4" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="144.3" y="253.2" text-anchor="middle">φ<tspan baseline-shift="sub" font-size="72%">1</tspan></text><path d="M166,262 A96,96 0 0 0 161.2,232" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="180.6" y="249.3" text-anchor="middle">φ<tspan baseline-shift="sub" font-size="72%">2</tspan></text><text x="190" y="282" text-anchor="middle" font-size="12">P = 80 kW (유효전력)</text><text x="332" y="172" font-size="12">Q = 60 kvar</text><text x="332" y="193" font-size="12">(무효전력)</text><text x="158" y="150" text-anchor="end" font-size="12" font-weight="700">S = 100 kVA</text><text x="158" y="172" text-anchor="end" font-size="12">(피상전력)</text><text x="342" y="214.1" font-size="12">Q′ = 26.3 kvar</text><text x="342" y="116.6" font-size="12">콘덴서 33.7 kvar</text><text x="124" y="216" text-anchor="end" font-size="12" style="fill:var(--si-rose-t)">S′ = 84.2 kVA</text><text x="260" y="312" text-anchor="middle" font-size="14" font-weight="700">S<tspan baseline-shift="super" font-size="72%">2</tspan> = P<tspan baseline-shift="super" font-size="72%">2</tspan> + Q<tspan baseline-shift="super" font-size="72%">2</tspan>,  PF = P ÷ S = cos φ</text></svg>
