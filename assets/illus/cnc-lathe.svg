<svg class="si si-illus" viewBox="0 0 360 504" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnc-lathe-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cnc-lathe-t">CNC 선반: 공작물은 회전하고 공구는 X·Z 방향으로 이송</title><defs><marker id="cnc-lathe-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><linearGradient id="cnc-lathe-g0" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" style="stop-color:var(--si-blue-f,#dde5f0)"/><stop offset="1" style="stop-color:var(--si-bg,#ffffff)"/></linearGradient><clipPath id="cnc-lathe-clip1"><circle cx="286" cy="396" r="46"/></clipPath></defs><polygon points="8,280 352,280 352,320 8,320" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="180" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">베드</text><rect x="8" y="92" width="72" height="188" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="44" y="190" text-anchor="middle">주축대</text><rect x="80" y="112" width="22" height="86" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.8" fill-opacity="0.55"/><rect x="102" y="112" width="10" height="16" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4"/><rect x="102" y="182" width="10" height="16" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4"/><rect x="112" y="130" width="152" height="50" style="stroke:var(--si-blue-s,#7f9ac0);fill:url(#cnc-lathe-g0)" stroke-width="2.4"/><line x1="112" y1="155" x2="264" y2="155" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" stroke-dasharray="8 3 2 3"/><text x="188" y="172" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">D = 40 mm</text><rect x="300" y="132" width="50" height="148" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="325" y="205" text-anchor="middle">심압대</text><polygon points="300,146 300,164 264,155" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><rect x="150" y="62" width="64" height="28" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="2.2" fill-opacity="0.35"/><polygon points="164,90 184,90 176,128" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.8"/><text x="182" y="56" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">공구대</text><path d="M 134 198 C 160 222, 216 222, 244 198" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><polygon points="244,198 232,198 240,210" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><text x="190" y="240" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">n ≈ 1,194 rpm (회전)</text><line x1="260" y1="40" x2="120" y2="40" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.8" marker-end="url(#cnc-lathe-ar)"/><text x="190" y="30" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">Z (축 방향)</text><line x1="232" y1="92" x2="232" y2="126" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.8" marker-end="url(#cnc-lathe-ar)"/><text x="242" y="116" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">X (지름 방향)</text><line x1="20" y1="336" x2="340" y2="336" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="20" y="358">Vc = 150 m/min</text><text x="20" y="378">n = 1000·Vc / (π·D)</text><text x="20" y="398" style="fill:var(--si-amber-t,#7a5210)">f = 0.2 mm/rev → 239 mm/min</text><text x="20" y="418" font-weight="700">Ra ≈ f²/(32r) ≈ 1.6 μm</text><circle cx="286" cy="396" r="46" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2"/><g clip-path="url(#cnc-lathe-clip1)"><polyline points="240,418 252,430 263,418 275,430 286,418 298,430 309,418 320,430 332,418 332,446 240,446" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.3"/><polygon points="276,350 298,350 291,416 282,416" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.8"/></g><text x="286" y="466" text-anchor="middle" font-weight="700">공구 끝 확대</text><text x="286" y="486" text-anchor="middle">코너 반지름 r = 0.8 mm</text></svg>
