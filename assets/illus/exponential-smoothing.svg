<svg class="si si-illus" viewBox="0 0 360 540" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exponential-smoothing-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="exponential-smoothing-t">지수평활법: 과거 관측값 가중치의 감쇠</title><defs><marker id="exponential-smoothing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="exponential-smoothing-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="46" y1="290" x2="340" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="46" y1="290" x2="46" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#exponential-smoothing-ar)"/><line x1="42" y1="290" x2="46" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="38" y="294" text-anchor="end">0</text><line x1="42" y1="235" x2="46" y2="235" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="38" y="239" text-anchor="end">0.2</text><line x1="42" y1="180" x2="46" y2="180" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="38" y="184" text-anchor="end">0.4</text><line x1="42" y1="125" x2="46" y2="125" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="38" y="129" text-anchor="end">0.6</text><line x1="42" y1="70" x2="46" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="38" y="74" text-anchor="end">0.8</text><text x="14" y="44" font-weight="700">관측값 가중치 α(1−α)<tspan dy="-0.435em" font-size="92%">k</tspan></text><rect x="56" y="70" width="29" height="220" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="86" y="330" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">0.8</text><rect x="87" y="235" width="29" height="55" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="86" y="350" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">0.2</text><text x="86" y="310" text-anchor="middle">k=0</text><rect x="126" y="246" width="29" height="44" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="156" y="330" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">0.16</text><rect x="157" y="246" width="29" height="44" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="156" y="350" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">0.16</text><text x="156" y="310" text-anchor="middle">k=1</text><rect x="196" y="281.2" width="29" height="8.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="226" y="330" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">0.032</text><rect x="227" y="254.8" width="29" height="35.2" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="226" y="350" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">0.128</text><text x="226" y="310" text-anchor="middle">k=2</text><rect x="266" y="288.2" width="29" height="1.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="296" y="330" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">0.0064</text><rect x="297" y="261.8" width="29" height="28.2" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="296" y="350" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">0.1024</text><text x="296" y="310" text-anchor="middle">k=3</text><text x="14" y="330" font-weight="700" style="fill:var(--si-blue-t,#12305c)">α=0.8</text><text x="14" y="350" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">α=0.2</text><text x="130" y="96" font-weight="700">k=0 높이 = α</text><line x1="124" y1="92" x2="90" y2="76" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#exponential-smoothing-ar-1)"/><line x1="140" y1="102" x2="104" y2="230" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#exponential-smoothing-ar-1)"/><text x="340" y="372" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">k기 전 관측값 (k=0은 현재)</text><rect x="20" y="392" width="14" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="42" y="404">α=0.8: 최근 값에 민감</text><rect x="20" y="410" width="14" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><text x="42" y="422">α=0.2: 과거를 오래 반영</text><text x="20" y="462" font-weight="700">k=1에서 두 값이 0.16으로 같고, 그 뒤로</text><text x="20" y="482" font-weight="700">α=0.2가 더 오래 남는다.</text><text x="20" y="520" font-weight="700">s<tspan dy="0.217em" font-size="92%">t</tspan><tspan dy="-0.2em"> = α x</tspan><tspan dy="0.217em" font-size="92%">t</tspan><tspan dy="-0.2em"> + (1−α) s</tspan><tspan dy="0.217em" font-size="92%">t−1</tspan></text></svg>
