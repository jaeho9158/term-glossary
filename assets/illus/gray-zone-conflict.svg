<svg class="si si-illus" viewBox="0 0 360 440" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="회색지대 갈등: 전쟁 문턱 아래에서 작은 조치를 쌓아 현상을 바꾼다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="gray-zone-conflict-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="gray-zone-conflict-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="gray-zone-conflict-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="58" y="120" width="282" height="222" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1" stroke-dasharray="4 4" fill-opacity="0.45"/><line x1="58" y1="350" x2="58" y2="40" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#gray-zone-conflict-ar)"/><line x1="58" y1="350" x2="346" y2="350" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#gray-zone-conflict-ar)"/><text x="6" y="22" font-weight="700">강압 강도</text><text x="32" y="66" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">전면전</text><text x="32" y="346" text-anchor="middle" font-weight="700">평화</text><text x="298" y="372" font-weight="700">시간</text><line x1="58" y1="112" x2="340" y2="112" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" stroke-dasharray="7 4"/><text x="64" y="100" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">전쟁 문턱(군사 대응 명분)</text><text x="64" y="138" font-weight="700" style="fill:var(--si-general,#5c6b7f)">회색지대</text><polyline points="70,340 70,320 118,320 118,280 166,280 166,240 214,240 214,200 262,200 262,160 310,160" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.4"/><line x1="310" y1="160" x2="326" y2="148" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3" marker-end="url(#gray-zone-conflict-ar-1)"/><circle cx="94" cy="320" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="142" cy="280" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="190" cy="240" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="238" cy="200" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="286" cy="160" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="76" y="340">해상민병대</text><text x="124" y="300">사이버</text><text x="172" y="260">경제적 강압</text><text x="220" y="220">정보·여론</text><text x="268" y="180">법률 압박</text><line x1="334" y1="148" x2="334" y2="112" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#gray-zone-conflict-ar-2)" marker-start="url(#gray-zone-conflict-ar-2)"/><text x="130" y="138" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">매번 문턱 바로 아래에서 멈춤</text><text x="66" y="196" font-weight="700">부인 가능성:</text><text x="66" y="218">행위자가 불분명</text><text x="10" y="400" font-weight="700">계단: 작은 조치를 쌓아 현상을 바꿈</text><text x="10" y="424" style="fill:var(--si-general,#5c6b7f)">보편적으로 합의된 정의는 없다</text></svg>
