<svg class="si si-illus" viewBox="0 0 360 664" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="엔탈피: 메탄 연소의 준위도" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="enthalpy-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="enthalpy-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="enthalpy-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="enthalpy-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="enthalpy-ar-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">메탄 연소의 엔탈피 준위도</text><text x="14" y="52" font-weight="700">엔탈피 H (kJ/mol)</text><line x1="22" y1="480" x2="22" y2="66" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#enthalpy-ar)"/><line x1="40" y1="124" x2="200" y2="124" style="stroke:currentColor;fill:none" stroke-width="3"/><text x="40" y="110" font-weight="700">반응물 CH<tspan dy="0.217em" font-size="92%">4</tspan><tspan dy="-0.2em"> + 2O</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><line x1="230" y1="413" x2="300" y2="413" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="230" y1="445" x2="300" y2="445" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><text x="232" y="401" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> + 2H</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O(g)</tspan></text><text x="232" y="471" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> + 2H</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O(l)</tspan></text><line x1="140" y1="413" x2="230" y2="413" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="172" y1="445" x2="230" y2="445" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="140" y1="124" x2="140" y2="413" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#enthalpy-ar-1)"/><line x1="172" y1="124" x2="172" y2="445" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2" marker-end="url(#enthalpy-ar-2)"/><text x="132" y="214" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">ΔH° = −802.3</text><text x="182" y="252" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">ΔH° = −890.3</text><line x1="322" y1="413" x2="322" y2="445" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#enthalpy-ar-3)" marker-start="url(#enthalpy-ar-3)"/><text x="306" y="429" text-anchor="middle">88</text><line x1="22" y1="500" x2="22" y2="516" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#enthalpy-ar-1)"/><text x="36" y="514" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">열 방출: ΔH &lt; 0 (발열)</text><line x1="22" y1="556" x2="22" y2="540" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#enthalpy-ar-4)"/><text x="36" y="554" font-weight="700" style="fill:va