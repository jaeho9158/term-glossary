<svg class="si si-illus" viewBox="0 0 360 542" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="호기성 소화: 공기를 불어 넣어 잉여슬러지의 휘발성 고형물을 줄인다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="aerobic-digestion-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="aerobic-digestion-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><line x1="336" y1="240" x2="336" y2="281.7" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><rect x="100" y="124" width="220" height="146" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.16"/><polyline points="100,116 100,270 320,270 320,116" style="stroke:currentColor;fill:none" stroke-width="2.6"/><text x="14" y="90">농축 잉여</text><text x="14" y="112">슬러지 투입</text><line x1="14" y1="132" x2="114" y2="132" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#aerobic-digestion-ar)"/><polyline points="290,128 290,70 100,70" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="116" y1="70" x2="96" y2="70" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#aerobic-digestion-ar-1)"/><text x="110" y="58" style="fill:var(--si-general,#5c6b7f)">상징수는 처리장 앞단으로 반송</text><ellipse cx="160" cy="174" rx="20" ry="12" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.8" fill-opacity="0.4"/><line x1="186" y1="174" x2="226" y2="174" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#aerobic-digestion-ar)"/><ellipse cx="252"