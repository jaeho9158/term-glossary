<svg class="si si-illus" viewBox="0 0 520 350" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="belt-and-pulley-drive-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="belt-and-pulley-drive-t">벨트 구동: 평행 걸기와 엇갈림 걸기</title><desc>크기가 다른 두 풀리에 벨트를 평행으로 걸면 같은 방향, 엇갈리게 걸면 반대 방향으로 도는 것과 벨트 양쪽 장력 T1, T2를 보인 모식도</desc><defs><marker id="belt-and-pulley-drive-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker></defs><text x="260" y="22" text-anchor="middle" font-size="12" font-weight="700">평행 걸기: 두 풀리가 같은 방향으로 돈다</text><circle cx="130" cy="110" r="40" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.12"/><circle cx="130" cy="110" r="3" style="stroke:currentColor;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><text x="130" y="166" text-anchor="middle" font-size="12">구동 풀리</text><circle cx="370" cy="110" r="26" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.12"/><circle cx="370" cy="110" r="3" style="stroke:currentColor;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><text x="370" y="152" text-anchor="middle" font-size="12">종동 풀리</text><path d="M132.33333333333334,70.0681135487496 L371.51666666666665,84.04427380668724 A26 26 0 0 1 371.51666666666665,135.95572619331276 L132.33333333333334,149.93188645125042 A40 40 0 1 1 132.33333333333334,70.0681135487496Z" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><line x1="74" y1="122" x2="74" y2="98" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" marker-end="url(#belt-and-pulley-drive-ar)"/><line x1="412" y1="98" x2="412" y2="122" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" marker-end="url(#belt-and-pulley-drive-ar)"/><text x="250" y="70" text-anchor="middle" font-style="italic">T<tspan dy="0.278em" font-size="72%">2</tspan></text><text x="250" y="168" text-anchor="middle" font-style="italic">T<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="260" y="214" text-anchor="middle" font-size="12" font-weight="700">엇갈림 걸기: 두 풀리가 반대 방향으로 돈다</text><circle cx="130" cy="285" r="40" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.12"/><circle cx="130" cy="285" r="3" style="stroke:currentColor;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><text x="130" y="341" text-anchor="middle" font-size="12">구동 풀리</text><circle cx="370" cy="285" r="26" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.12"/><circle cx="370" cy="285" r="3" style="stroke:currentColor;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><text x="370" y="327" text-anchor="middle" font-size="12">종동 풀리</text><path d="M141,246.54223095394119 L362.85,309.9975498799382 A26 26 0 1 0 362.85,260.0024501200618 L141,323.45776904605884 A40 40 0 1 1 141,246.54223095394119Z" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><line x1="74" y1="297" x2="74" y2="273" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" marker-end="url(#belt-and-pulley-drive-ar)"/><line x1="412" y1="297" x2="412" y2="273" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" marker-end="url(#belt-and-pulley-drive-ar)"/></svg>
