<svg class="si si-illus" viewBox="0 0 360 626" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DIBL: 드레인 쪽 공핍영역의 확장과 소스-채널 전위 장벽 저하" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="drain-induced-barrier-lowering-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="drain-induced-barrier-lowering-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="drain-induced-barrier-lowering-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">DIBL: 드레인 전압이 소스 쪽 장벽을 낮춘다</text><rect x="20" y="72" width="320" height="108" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6" fill-opacity="0.5"/><polygon points="340,72 165,72 165.7,81.6 167.9,91.1 171.5,100.4 176.4,109.3 182.6,117.8 190.1,125.6 198.7,132.8 208.3,139.2 218.8,144.8 230.1,149.5 242,153.2 254.4,155.8 267.1,157.5 280,158 280,158 340,144" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.22"/><polygon points="280,72 252,72 252.3,75.8 253.4,79.4 255.1,82.9 257.3,86.1 260.2,89 263.5,91.4 267.3,93.4 271.3,94.8 275.6,95.7 280,96 280,96" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" stroke-dasharray="4 3" fill-opacity="0"/><rect x="20" y="72" width="60" height="32" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="50" y="93" text-anchor="middle">소스</text><rect x="280" y="72" wi