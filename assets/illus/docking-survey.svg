<svg class="si si-illus" viewBox="0 0 360 538" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="docking-survey-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="docking-survey-t">입거 검사: 선저의 점검 부위와 5년 증서 기간의 검사 간격</title><defs><marker id="docking-survey-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="docking-survey-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">입거 검사: 물 밖에서 선저를 직접 본다</text><polygon points="24,58 330,58 350,74 304,120 262,132 84,132 42,108 24,98" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><polygon points="24,98 30,108 42,108 84,132 262,132 304,120 319,98" style="stroke:currentColor;fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><line x1="24" y1="98" x2="319" y2="98" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" stroke-dasharray="5 3"/><text x="150" y="114" style="fill:var(--si-blue-s,#7f9ac0)">평소 수면 아래</text><text x="170" y="72" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">선체</text><rect x="10" y="96" width="8" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><line x1="18" y1="106" x2="26" y2="102" style="stroke:currentColor;fill:none" stroke-width="1.8"/><ellipse cx="30" cy="118" rx="4" ry="13" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><rect x="96" y="126" width="16" height="7" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><rect x="130" y="126" width="16" heigh