<svg class="si si-illus" viewBox="0 0 360 526" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="direct-inverse-proportion-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="direct-inverse-proportion-t">정비례는 원점을 지나는 직선, 반비례는 축에 다가가는 곡선</title><defs><marker id="direct-inverse-proportion-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="10" y="24" font-weight="700">정비례</text><text x="70" y="24" font-weight="700" font-style="italic">y = ax  (a≠0)</text><line x1="50" y1="200" x2="335" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#direct-inverse-proportion-ar)"/><line x1="50" y1="200" x2="50" y2="40" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#direct-inverse-proportion-ar)"/><text x="332" y="220" text-anchor="end" font-style="italic">x</text><text x="36" y="48" font-style="italic">y</text><line x1="50" y1="200" x2="300" y2="60" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><polygon points="50,200 120,200 120,160.8" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.12"/><circle cx="120" cy="160.8" r="5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1"/><polygon points="50,200 190,200 190,121.6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.12"/><circle cx="190" cy="121.6" r="5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1"/><text x="50" y="222" style="fill:var(--si-general,#5c6b7f)">원점 지남</text><text x="66" y="64" font-weight="700" style="fill:var(--si-accent,#2454ff)">y/x 일