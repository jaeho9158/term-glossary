<svg class="si si-illus" viewBox="0 0 360 440" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="위협균형론: 가장 강한 나라가 아니라 가장 위협적인 나라에 맞선다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="balance-of-threat-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="10" y="22" font-weight="700">가상 지도: 가장 강한 나라 vs 가장 위협적인 나라</text><rect x="8" y="36" width="344" height="244" rx="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2" fill-opacity="0.45"/><circle cx="285" cy="100" r="48" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="285" y="106" text-anchor="middle" font-size="18" font-weight="700">A</text><circle cx="72" cy="140" r="30" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="72" y="146" text-anchor="middle" font-size="18" font-weight="700">B</text><circle cx="150" cy="222" r="20" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="150" y="228" text-anchor="middle" font-size="16" font-weight="700">C</text><text x="14" y="270" style="fill:var(--si-general,#5c6b7f)">원 크기 = 총합국력</text><polygon points="94.6,165 125.1,191.8 127.8,188.8 133,204 117.2,200.8 119.8,197.8 89.4,171" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.35"/><rect x="14" y="44" width="148" height="26" rx="8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="88" y="62" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">공격적 의도로 인식</text><line x1="72" y1="70" x2="72" y2="110" style="stroke:var(--si-rose-s,#c97b7b)