olor;fill:none" stroke-width="1.1"/><text x="100" y="463" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">15</text><line x1="160" y1="442" x2="160" y2="447" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="160" y="463" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">30</text><line x1="220" y1="442" x2="220" y2="447" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="220" y="463" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">45</text><line x1="280" y1="442" x2="280" y2="447" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="280" y="463" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">60</text><text x="290" y="447" style="fill:var(--si-general,#5c6b7f)">분</text><text x="20" y="492" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">단순 합산 120분 ≠ 실제 60분</text><text x="20" y="530" style="fill:var(--si-general,#5c6b7f)">비교 전에 평균의 분모와</text><text x="20" y="550" style="fill:var(--si-general,#5c6b7f)">동시 수행 처리 방식을 확인한다.</text></svg>
