l,#5c6b7f)">추 1</text><text x="175" y="504" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">추 2</text><text x="265" y="504" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">추 C</text><text x="180" y="530" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">추 무게 = 수송비 비중, 실이 균형 잡힌 매듭 = P</text><text x="10" y="576" font-weight="700">③ 원료지수가 1보다 클 때</text><polygon points="60,620 60,680 300,650" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" stroke-dasharray="5 3" fill-opacity="0.5"/><circle cx="170" cy="650" r="8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-bg,#ffffff)" stroke-width="1.8" stroke-dasharray="3 2"/><line x1="160" y1="645" x2="72" y2="624" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#locational-triangle-ar)"/><circle cx="60" cy="620" r="8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="60" cy="680" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="300" cy="650" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="78" y="616" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">P = M<tspan baseline-shift="sub" font-size="92%">1</tspan></text><text x="20" y="706" font-weight="700">M<tspan baseline-shift="sub" font-size="92%">2</tspan></text><text x="310" y="646" font-weight="700">C</text><text x="108" y="708" style="fill:var(--si-general,#5c6b7f)">처음 P</text><text x="180" y="740" text-anchor="middle" font-weight="700">해가 삼각형 안이 아니라 꼭짓점이 된다</text></svg>
