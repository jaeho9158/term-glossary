<svg class="si si-illus" viewBox="0 0 360 500" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="위기사건 스트레스 디브리핑: 시간축과 7단계" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="critical-incident-stress-debriefing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="critical-incident-stress-debriefing-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="20" y="26" font-weight="700">CISM의 시간 흐름: 디퓨징 → 디브리핑 → 추적</text><path d="M37,109 L25,126.4 L33.4,126.4 L31,139 L43,121 L34.6,121Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="18" y="100" style="fill:var(--si-general,#5c6b7f)">사건 발생</text><line x1="34" y1="170" x2="344" y2="170" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#critical-incident-stress-debriefing-ar)"/><line x1="90" y1="164" x2="90" y2="176" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="90" y="198" text-anchor="middle">당일</text><line x1="170" y1="164" x2="170" y2="176" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="170" y="198" text-anchor="middle">48h</text><line x1="230" y1="164" x2="230" y2="176" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="230" y="198" text-anchor="middle">72h</text><line x1="266" y1="164" x2="266" y2="176" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="266" y="198" text-anchor="middle">다음 날</text><line x1="316" y1="164" x2="316" y2="176" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="316" y="198" text-anchor="middle">다음 주</text><line x1="90" y1="64" x2="230" y2="64" style="stroke: