<svg class="si si-illus" viewBox="0 0 360 438" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="독시 지수: 관광객 증가에 따라 환희에서 적대로 바뀌는 주민 태도 4단계" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="doxey-irridex-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">독시의 주민 태도 단계 모형</text><text x="8" y="52" style="fill:var(--si-general,#5c6b7f)">주민 태도: 긍정</text><rect x="34" y="66" width="80" height="224" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="74" y="88" text-anchor="middle" font-weight="700">환희</text><text x="74" y="108" text-anchor="middle">Euphoria</text><rect x="114" y="120" width="80" height="170" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="154" y="142" text-anchor="middle" font-weight="700">무관심</text><text x="154" y="162" text-anchor="middle">Apathy</text><rect x="194" y="174" width="80" height="116" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="234" y="196" text-anchor="middle" font-weight="700">짜증</text><text x="234" y="216" text-anchor="middle">Annoyance</text><rect x="274" y="220" width="80" height="70" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="314" y="242" text-anchor="middle" font-weight="700">적대</text><text x="314" y="262" text-anchor="middle">Antagonism</text><line x1="34" y1="60" x2="34" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="34" y1="290" x2="360" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#doxey-irridex-ar)"/><text x="8" y="312" style="fill:var(--si-general,#5c6b7f)">주민 태도: 부정</text><text x="350" y="312" text-anchor="end">관광객 수 증가 →</text><text x="180" y="344" text-anchor="middle">관광객 수와 주민·관광객 접촉의 질이</text><text x="180" y="364" text-anchor="middle">단계 전환을 좌우한다고 본다.</text><text x="180" y="394" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">단계가 순서대로 진행된다는 근거는 약하고,</text><text x="180" y="414" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">역전되거나 건너뛰는 사례도 보고된다.</text></svg>
