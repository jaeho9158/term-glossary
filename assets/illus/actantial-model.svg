 3"/><text x="58" y="241" text-anchor="middle" font-weight="700">조력자</text><rect x="136" y="214" width="88" height="44" rx="8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.6" stroke-dasharray="5 3"/><text x="180" y="241" text-anchor="middle" font-weight="700">주체</text><rect x="258" y="214" width="88" height="44" rx="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8" stroke-dasharray="5 3"/><text x="302" y="241" text-anchor="middle" font-weight="700">적대자</text><text x="180" y="48" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">소통의 축</text><line x1="104" y1="92" x2="134" y2="92" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#actantial-model-ar)"/><line x1="226" y1="92" x2="256" y2="92" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#actantial-model-ar)"/><line x1="180" y1="212" x2="180" y2="116" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4.4" marker-end="url(#actantial-model-ar-1)"/><text x="192" y="156" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">욕망의 축</text><line x1="104" y1="236" x2="134" y2="236" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" marker-end="url(#actantial-model-ar-2)"/><line x1="256" y1="236" x2="226" y2="236" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4" marker-end="url(#actantial-model-ar-3)"/><line x1="246" y1="227" x2="246" y2="245" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><text x="180" y="284" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">갈등의 축</text><path d="M58,260 C59,266.3 43.7,289.7 64,298 C84.3,306.3 141.3,310 180,310 C218.7,310 275.7,306.3 296,298 C316.3,289.7 301,266.3 302,260" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" stroke-dasharray="4 3"/><text x="180" y="338" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">한 인물이 두 자리를 겸할 수 있다</text><text x="180" y="362" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">예: 마을 공동체가 조력자와 적대자를 동시에 맡는다</text><line x1="14" y1="372" x2="346" y2="372" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="180" y="396" text-anchor="middle" font-weight="700">점선 칸은 인물이 아니라 자리이다</text><text x="180" y="420" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">인물·사물·집단·추상적 가치가 한 자리를 채운다</text><text x="180" y="442" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">한 자리를 여러 인물이 나눠 맡을 수도 있다</text></svg>
