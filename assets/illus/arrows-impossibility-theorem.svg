<svg class="si si-illus" viewBox="0 0 360 630" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arrows-impossibility-theorem-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="arrows-impossibility-theorem-t">애로우의 불가능성 정리: 다수결 순환과 5개 조건</title><defs><marker id="arrows-impossibility-theorem-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="20" y="24" font-weight="700">유권자 3명의 선호 순위 (가상)</text><text x="81" y="52" text-anchor="middle">유권자 갑</text><rect x="36" y="60" width="90" height="26" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="81" y="78" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">1순위  A</text><rect x="36" y="88" width="90" height="26" rx="5" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="81" y="106" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">2순위  B</text><rect x="36" y="116" width="90" height="26" rx="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="81" y="134" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">3순위  C</text><text x="189" y="52" text-anchor="middle">유권자 을</text><rect x="144" y="60" width="90" height="26" rx="5" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="189" y="78" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">1순위  B</text><rect x="144" y="88" width="90" height="26" rx="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="189" y="106" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">2순위  C</text><rect x="144" y="116" wid