<svg class="si si-illus" viewBox="0 0 360 640" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="푸글-마이어 평가: 운동 점수 구성과 MCID·최소 감지 변화" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="22" text-anchor="middle" font-weight="700">푸글-마이어 평가: 점수 구성과 변화 해석</text><text x="14" y="52" font-weight="700">운동 영역 점수 구성 (만점 100점)</text><rect x="20" y="66" width="211.2" height="44" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="125.6" y="94" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">상지 66점</text><rect x="231.2" y="66" width="108.8" height="44" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="285.6" y="94" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">하지 34점</text><line x1="20" y1="118" x2="340" y2="118" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="20" y1="118" x2="20" y2="123" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="20" y="140" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="100" y1="118" x2="100" y2="123" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="100" y="140" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">25</text><line x1="180" y1="118" x2="180" y2="123" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="180" y="140" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">50</text><line x1="260" y1="118" x2="260" y2="123" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="260" y="140" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">75</text><line x1="340" y1="118" x2="340" y2="123" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="340" y="140" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">100</text><text x="180" y="162" text-anchor="middle">점</text><text x="14" y="186">상지 항목: 반사 → 공동운동 → 분리운동 → 협응</text><text x="14" y="210" style="fill:var(--si-general,#5c6b7f)">반사 제외 시 30항목·60점 판본이 있다</text><text x="14" y="242" font-weight="700">항목별 채점</text><rect x="14" y="254" width="200" height="26" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="24" y="272" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">0점</text><text x="66" y="272">수행 불가</text><rect x="14" y="284" width="200" height="26" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="24" y="302" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">1점</text><text x="66" y="302">부분 수행</text><rect x="14" y="314" width="200" height="26" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="24" y="332" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">2점</text><text x="66" y="332">완전 수행</text><text x="14" y="360" font-weight="700">점수 변화 해석 (확대 눈금, 1칸 = 1점)</text><rect x="20" y="378" width="112" height="28" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="26" y="398" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">MCID 7점</text><rect x="20" y="414" width="192" height="28" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.4"/><text x="26" y="434" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">최소 감지 변화 12점</text><line x1="20" y1="450" x2="340" y2="450" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="20" y1="450" x2="20" y2="455" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="20" y="472" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="84" y1="450" x2="84" y2="455" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="84" y="472" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">4</text><line x1="148" y1="450" x2="148" y2="455" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="148" y="472" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">8</text><line x1="212" y1="450" x2="212" y2="455" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="212" y="472" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">12</text><line x1="276" y1="450" x2="276" y2="455" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="276" y="472" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">16</text><line x1="340" y1="450" x2="340" y2="455" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="340" y="472" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">20</text><text x="180" y="494" text-anchor="middle">점수 변화(점)</text><line x1="212" y1="372" x2="212" y2="450" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" stroke-dasharray="4 3"/><text x="14" y="526" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">12점보다 작은 변화는 측정오차일 수 있다.</text><text x="14" y="566">검사 시간은 약 15~20분이다.</text><text x="14" y="590">손상 수준 척도라서 일상생활 능력은</text><text x="14" y="614">따로 평가해야 한다.</text></svg>
