<svg class="si si-illus" viewBox="0 0 360 468" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inter-rater-reliability-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="inter-rater-reliability-t">평가자간 신뢰도: 카파는 우연 일치를 넘어선 만큼의 비율이다</title><defs></defs><text x="180" y="40" text-anchor="middle" font-weight="700">κ = (p<tspan baseline-shift="sub" font-size="92%">0</tspan> − p<tspan baseline-shift="sub" font-size="92%">e</tspan>) ÷ (1 − p<tspan baseline-shift="sub" font-size="92%">e</tspan>) = 0.2 ÷ 0.5 = 0.4</text><line x1="30" y1="150" x2="330" y2="150" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="30" y1="142" x2="30" y2="158" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="180" y1="142" x2="180" y2="158" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="240" y1="142" x2="240" y2="158" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="330" y1="142" x2="330" y2="158" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="180" y="142" width="60" height="16" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><polyline points="180,126 180,118 330,118 330,126" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><text x="255" y="104" text-anchor="middle" style="fill:var(--si-blue-s,#7f9ac0)">우연을 넘어설 여지 1−p<tspan baseline-shift="sub" font-size="92%">e</tspan></text><text x="124" y="184">p<tspan baseline-shift="sub" font-size="92%">e</tspan> = 0.5</text><text x="234" y="184">p<tspan baseline-shift="sub" font-size="92%">0</tspan> = 0.7</text><text x="30" y="184" text-anchor="middle">0</text><text x="330" y="184" text-anchor="middle">1</text><polyline points="180,202 180,210 240,210 240,202" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.8"/><text x="230" y="232" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">넘어선 만큼 p<tspan baseline-shift="sub" font-size="92%">0</tspan> − p<tspan baseline-shift="sub" font-size="92%">e</tspan> = 0.2</text><text x="14" y="262" style="fill:var(--si-general,#5c6b7f)">관찰 일치율 p<tspan baseline-shift="sub" font-size="92%">0</tspan>, 우연 일치 확률 p<tspan baseline-shift="sub" font-size="92%">e</tspan></text><text x="10" y="300" font-weight="700">κ 해석 (랜디스·코크, 1977)</text><rect x="30" y="352" width="60" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="60" y="371" text-anchor="middle">약간</text><rect x="90" y="352" width="60" height="28" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="120" y="371" text-anchor="middle">보통</text><rect x="150" y="352" width="60" height="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="180" y="371" text-anchor="middle">중등도</text><rect x="210" y="352" width="60" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="240" y="371" text-anchor="middle">상당함</text><rect x="270" y="352" width="60" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="300" y="371" text-anchor="middle">거의 완벽</text><text x="30" y="398" text-anchor="middle">0</text><text x="90" y="398" text-anchor="middle">0.2</text><text x="150" y="398" text-anchor="middle">0.4</text><text x="210" y="398" text-anchor="middle">0.6</text><text x="270" y="398" text-anchor="middle">0.8</text><text x="330" y="398" text-anchor="middle">1</text><polygon points="150,348 142,332 158,332" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4"/><text x="164" y="336" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">κ = 0.4 (보통)</text><text x="10" y="428">κ = 0은 우연 수준, κ = 1은 완전 일치</text><text x="10" y="452" style="fill:var(--si-general,#5c6b7f)">분야·척도에 따라 기준이 다름</text></svg>
