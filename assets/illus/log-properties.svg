<svg class="si si-illus" viewBox="0 0 360 532" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="log-properties-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="log-properties-t">로그의 성질: 곱을 길이의 덧셈으로 보는 로그 눈금</title><defs></defs><text x="20" y="26" font-weight="700">로그 눈금자: 곱셈은 길이의 덧셈</text><line x1="40" y1="100" x2="317.8" y2="100" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="40" y1="100" x2="40" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="115.3" y1="100" x2="115.3" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="159.3" y1="100" x2="159.3" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="190.5" y1="100" x2="190.5" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="214.7" y1="100" x2="214.7" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="234.5" y1="100" x2="234.5" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="251.3" y1="100" x2="251.3" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="265.8" y1="100" x2="265.8" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="278.6" y1="100" x2="278.6" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="290" y1="100" x2="290" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="300.3" y1="100" x2="300.3" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="309.8" y1="100" x2="309.8" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="40" y="80" text-anchor="middle">1</text><text x="115.3" y="80" text-anchor="middle">2</text><text x="159.3" y="80" text-anchor="middle">3</text><text x="190.5" y="80" text-anchor="middle" font-weight="700">4</text><text x="234.5" y="80" text-anchor="middle">6</text><text x="265.8" y="80" text-anchor="middle">8</text><text x="290" y="80" text-anchor="middle">10</text><text x="309.8" y="80" text-anchor="middle" font-weight="700">12</text><rect x="40" y="112" width="75.3" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="77.7" y="129" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">log 2</text><rect x="115.3" y="112" width="75.2" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8" fill-opacity="0.55"/><text x="152.9" y="129" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">log 2</text><rect x="190.5" y="112" width="119.3" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="250.2" y="129" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">log 3</text><circle cx="309.8" cy="100" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="44" y="164" style="fill:var(--si-general,#5c6b7f)">눈금 1의 위치 = 길이 0</text><text x="20" y="199" font-size="14" font-weight="700">2 × 2 × 3 = 12</text><text x="20" y="220" font-size="14">log 2 + log 2 + log 3 = log 12</text><text x="20" y="241" font-size="14">2×0.30103 + 0.47712 = 1.07918</text><text x="20" y="272" style="fill:var(--si-general,#5c6b7f)">log<tspan baseline-shift="sub" font-size="92%">10</tspan> 2 ≈ 0.30103, log<tspan baseline-shift="sub" font-size="92%">10</tspan> 3 ≈ 0.47712</text><line x1="20" y1="298" x2="340" y2="298" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><rect x="24" y="308" width="24" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="48" y="308" width="36" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="112" y="320" font-weight="700">길이를 이어 붙임 = 곱</text><text x="112" y="342">log(xy) = log x + log y</text><rect x="24" y="356" width="20" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="44" y="356" width="20" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="64" y="356" width="20" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="112" y="368" font-weight="700">같은 길이를 n번 = 거듭제곱</text><text x="112" y="390">log(x<tspan baseline-shift="super" font-size="92%">n</tspan>) = n·log x</text><rect x="24" y="404" width="40" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="112" y="416" font-weight="700">길이를 뺌 = 나눗셈</text><text x="112" y="438">log(x/y) = log x − log y</text><circle cx="40" cy="100" r="5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><circle cx="26" cy="459" r="5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="112" y="464" font-weight="700">눈금 1은 길이 0</text><text x="112" y="486">log 1 = 0</text><text x="20" y="512" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">주의: log(x+y)는 log x + log y가 아니다</text></svg>
