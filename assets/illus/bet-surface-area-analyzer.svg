ight="700">② BET 선형 플롯 (가상 계산)</text><text x="20" y="348" style="fill:var(--si-general,#5c6b7f)">y = 1 / [v((P<tspan dy="0.217em" font-size="92%">0</tspan><tspan dy="-0.2em">/P) − 1)]</tspan></text><rect x="96.6" y="394" width="192.8" height="132" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="0" fill-opacity="0.2"/><line x1="58" y1="526" x2="336" y2="526" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#bet-surface-area-analyzer-ar)"/><line x1="58" y1="526" x2="58" y2="390" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="58" y1="526" x2="58" y2="530" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="58" y="548" text-anchor="middle">0</text><line x1="135.1" y1="526" x2="135.1" y2="530" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="135.1" y="548" text-anchor="middle">0.1</text><line x1="212.3" y1="526" x2="212.3" y2="530" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="212.3" y="548" text-anchor="middle">0.2</text><line x1="289.4" y1="526" x2="289.4" y2="530" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="289.4" y="548" text-anchor="middle">0.3</text><text x="173.7" y="570" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">상대압력 P/P<tspan dy="0.217em" font-size="92%">0</tspan></text><line x1="58" y1="522.3" x2="304.9" y2="406.2" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><circle cx="96.6" cy="504.2" r="4.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="135.1" cy="486" r="4.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="173.7" cy="467.9" r="4.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="212.3" cy="449.7" r="4.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="250.9" cy="431.6" r="4.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="289.4" cy="413.4" r="4.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="58" cy="522.3" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="58" y="384" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">기울기 (c−1)/(v<tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em">·c) = 0.0330</tspan></text><text x="50" y="514" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">절편</text><line x1="20" y1="582" x2="340" y2="582" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="20" y="602" style="fill:var(--si-rose-s,#c97b7b)">절편 = 1/(v<tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em">·c)</tspan></text><text x="20" y="624" font-weight="700">v<tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em"> = 1/(기울기+절편)</tspan></text><text x="20" y="646" font-weight="700">≈ 30.0 cm³(STP)/g, c ≈ 100</text><text x="20" y="676">S = (v<tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em">/22,414)·N</tspan><tspan dy="0.217em" font-size="92%">A</tspan><tspan dy="-0.2em">·σ</tspan></text><text x="20" y="698">σ(N₂) = 0.162 nm²</text><text x="20" y="722" font-weight="700" style="fill:var(--si-accent,#2454ff)">→ S ≈ 131 m²/g</text></svg>
