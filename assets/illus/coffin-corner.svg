<svg class="si si-illus" viewBox="0 0 360 534" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="코핀 코너: 실속 경계와 마하 버핏 경계가 만나는 쐐기" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="coffin-corner-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">코핀 코너: 속도-고도 비행 포락선</text><path d="M90 300 C120 240 170 140 214 84 C262 140 300 240 312 300 Z" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6" fill-opacity="0.45"/><line x1="44" y1="300" x2="340" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#coffin-corner-ar)"/><line x1="44" y1="300" x2="44" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#coffin-corner-ar)"/><text x="52" y="66">고도</text><text x="340" y="322" text-anchor="end">속도 (진대기속도, 노트)</text><path d="M90 300 C120 240 170 140 214 84" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><path d="M312 300 C300 240 262 140 214 84" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.8"/><path d="M126 300 C148 250 190 170 211 112" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" stroke-dasharray="6 4"/><circle cx="214" cy="98" r="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4" fill-opacity="0.7"/><text x="214" y="50" text-anchor="middle" font-weight="700">코핀 코너(coffin corner)</text><line x1="214" y1="50" x2="214" y2="82" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="214" cy="82" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="52" y="128" font-weight="700" style="fill:var(--si-blue-t,#12305c)">실속속도</text><text x="52" y="148" style="fill:var(--si-blue-t,#12305c)">경계</text><text x="52" y="168" style="fill:var(--si-blue-t,#12305c)">(저속 쪽)</text><text x="340" y="128" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">임계마하수</text><text x="340" y="148" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">경계</text><text x="340" y="168" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">(마하 버핏)</text><text x="180" y="236" style="fill:var(--si-amber-t,#7a5210)">1.3g 버핏 경계</text><text x="214" y="276" text-anchor="middle">사용 가능한 속도 범위</text><line x1="16" y1="345" x2="344" y2="345" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="366">고고도에서는 1g 실속 버핏과 마하 버핏 사이</text><text x="16" y="386">여유가 U-2에서 5노트까지 작아진다.</text><rect x="16" y="410" width="328" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1" fill-opacity="0.5"/><rect x="16" y="438" width="328" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1"/><text x="24" y="429">선회 뱅크각</text><text x="170" y="429" text-anchor="middle">30°</text><text x="230" y="429" text-anchor="middle">45°</text><text x="290" y="429" text-anchor="middle">60°</text><text x="24" y="457">실속속도 증가</text><text x="170" y="457" text-anchor="middle" font-weight="700">+7%</text><text x="230" y="457" text-anchor="middle" font-weight="700">+19%</text><text x="290" y="457" text-anchor="middle" font-weight="700">+41%</text><text x="16" y="492">실속은 받음각이 임계값(보통 약 15°)을 넘을 때</text><text x="16" y="512">생기며, 선회하면 실속속도가 커진다.</text></svg>
