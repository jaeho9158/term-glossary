<svg class="si si-illus" viewBox="0 0 360 268" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fitzpatrick-skin-type-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="fitzpatrick-skin-type-t">피츠패트릭 피부유형 I~VI형과 햇볕 반응</title><defs></defs><text x="14" y="20" font-size="12" font-weight="700">유형</text><text x="66" y="20" font-size="12" font-weight="700">햇볕에 노출된 뒤 반응</text><text x="300" y="20" text-anchor="middle" font-size="12" font-weight="700">멜라닌</text><rect x="14" y="32" width="40" height="28" rx="5" style="stroke:var(--si-gray-s,#aab6c6);fill:#f6e7dc" stroke-width="1.2"/><text x="34" y="51" text-anchor="middle" font-weight="700" style="fill:#1f2328">I</text><text x="66" y="51" font-size="12">항상 타고, 그을리지 않음</text><rect x="14" y="68" width="40" height="28" rx="5" style="stroke:var(--si-gray-s,#aab6c6);fill:#ecd2b9" stroke-width="1.2"/><text x="34" y="87" text-anchor="middle" font-weight="700" style="fill:#1f2328">II</text><text x="66" y="87" font-size="12">대개 타고, 조금 그을림</text><rect x="14" y="104" width="40" height="28" rx="5" style="stroke:var(--si-gray-s,#aab6c6);fill:#d9b48f" stroke-width="1.2"/><text x="34" y="123" text-anchor="middle" font-weight="700" style="fill:#1f2328">III</text><text x="66" y="123" font-size="12">가끔 타고, 고르게 그을림</text><rect x="14" y="140" width="40" height="28" rx="5" style="stroke:var(--si-gray-s,#aab6c6);fill:#b8875c" stroke-width="1.2"/><text x="34" y="159" text-anchor="middle" font-weight="700" style="fill:#1f2328">IV</text><text x="66" y="159" font-size="12">조금 타고, 잘 그을림</text><rect x="14" y="176" width="40" height="28" rx="5" style="stroke:var(--si-gray-s,#aab6c6);fill:#8a5a36" stroke-width="1.2"/><text x="34" y="195" text-anchor="middle" font-weight="700" style="fill:#ffffff">V</text><text x="66" y="195" font-size="12">드물게 타고, 쉽게 그을림</text><rect x="14" y="212" width="40" height="28" rx="5" style="stroke:var(--si-gray-s,#aab6c6);fill:#4a2c1c" stroke-width="1.2"/><text x="34" y="231" text-anchor="middle" font-weight="700" style="fill:#ffffff">VI</text><text x="66" y="231" font-size="12">타지 않음</text><polygon points="300,34 288,240 312,240" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1" fill-opacity="0.5"/><text x="300" y="258" text-anchor="middle" font-size="12">많음</text><text x="326" y="40" font-size="12">적음</text></svg>
