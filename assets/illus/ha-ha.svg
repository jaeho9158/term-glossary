<svg class="illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--text,#1f2328)" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="하하(ha-ha)의 단면" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title>하하(ha-ha)의 단면</title><defs><marker id="ha-ha-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs><path d="M20,150 L160,150 L160,210 L184,210 L364,150 L500,150 L500,270 L20,270 Z" fill="currentColor" fill-opacity="0.12" stroke="none"/><polyline fill="none" stroke-width="2" stroke="currentColor" points="20,150 160,150 160,210 184,210 364,150 500,150"/><path d="M150,150 h10 v60 h-10 z" style="fill:var(--accent,#2454ff)"/><line x1="80" y1="150" x2="80" y2="86" stroke="currentColor" stroke-width="2"/><circle cx="80" cy="86" r="4" fill="currentColor"/><text x="80" y="76" text-anchor="middle">눈높이 1.6 m</text><line x1="80" y1="86" x2="500" y2="126" stroke="currentColor" stroke-dasharray="5 4" stroke-width="1.2"/><text x="360" y="98" font-size="12">시선: 옹벽이 보이지 않음</text><text x="28" y="170" >정원 쪽</text><text x="424" y="170" >목초지 쪽</text><text x="142" y="184" text-anchor="end">수직 옹벽</text><text x="296" y="230" text-anchor="middle" font-size="12">완만한 경사 (수평 폭 4.5 m)</text><line x1="172" y1="152" x2="172" y2="208" stroke="currentColor" stroke-width="1" marker-start="url(#ha-ha-ar)" marker-end="url(#ha-ha-ar)"/><text x="180" y="176" font-size="12">깊이 1.5 m</text><text x="20" y="318" font-size="12" style="fill:var(--muted,#57606a)">본문 가상 단면 값. 실제 깊이 약 0.6 m(호턴 하우스)~2.7 m(페트워스 하우스)</text></svg>