<svg class="si si-illus" viewBox="0 0 520 366" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exclusive-economic-zone-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="exclusive-economic-zone-t">배타적 경제수역: 기선에서 잰 거리</title><desc>해안의 기선에서 바다 쪽으로 12해리까지가 영해, 200해리까지가 배타적 경제수역, 대륙붕은 최대 350해리까지임을 보이는 단면 모식도</desc><defs><marker id="exclusive-economic-zone-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><polygon points="30,100 100,100 100,250 30,250" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.3"/><rect x="100" y="100" width="400" height="95" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1" fill-opacity="0.22"/><polygon points="100,195 500,236 500,250 100,250" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.3"/><text x="65" y="180" text-anchor="middle" font-size="12">육지</text><line x1="100" y1="76" x2="100" y2="252" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="100" y="66" text-anchor="middle" font-size="12" font-weight="700">기선</text><line x1="165" y1="76" x2="165" y2="252" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="165" y="66" text-anchor="middle" font-size="12" font-weight="700">12해리</text><line x1="330" y1="76" x2="330" y2="252" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="330" y="66" text-anchor="middle" font-size="12" font-weight="700">200해리</text><line x1="460" y1="76" x2="460" y2="252" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="460" y="66" text-anchor="middle" font-size="12" font-weight="700">350해리</text><line x1="100" y1="278" x2="165" y2="278" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#exclusive-economic-zone-ar)" marker-start="url(#exclusive-economic-zone-ar)"/><text x="175" y="282" font-size="12">영해: 기선에서 12해리까지</text><line x1="100" y1="302" x2="330" y2="302" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#exclusive-economic-zone-ar)" marker-start="url(#exclusive-economic-zone-ar)"/><text x="340" y="306" font-size="12">EEZ: 200해리까지</text><line x1="100" y1="326" x2="460" y2="326" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#exclusive-economic-zone-ar)" marker-start="url(#exclusive-economic-zone-ar)"/><text x="100" y="352" font-size="12">확장 대륙붕 한계: 350해리를 넘지 못함</text><text x="300" y="150" text-anchor="middle" font-size="12">수면과 바닷속</text><text x="300" y="232" text-anchor="middle" font-size="12">해저</text></svg>
