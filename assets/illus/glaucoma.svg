<svg class="si si-illus" viewBox="0 0 360 588" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="녹내장: 배출로가 막히면 안압이 올라 시신경이 손상된다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="glaucoma-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.3" markerHeight="6.3" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="glaucoma-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="glaucoma-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="glaucoma-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">눈 단면(옆에서 본 모습)</text><circle cx="215" cy="150" r="78" style="stroke:var(--si-navy,#12305c);fill:var(--si-bg,#ffffff)" stroke-width="3"/><path d="M 147.5 111 A 78 78 0 0 0 147.5 189" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="6"/><path d="M 150 115 A 74 74 0 0 0 150 185 L 170 162 L 170 138 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="0"/><ellipse cx="184" cy="150" rx="10" ry="28" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><line x1="150" y1="114" x2="170" y2="138" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="5"/><line x1="150" y1="186" x2="170" y2="162" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="5"/><ellipse cx="163" cy="106" rx="10" ry="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fd