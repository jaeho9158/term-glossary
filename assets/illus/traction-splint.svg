<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="traction-splint-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="traction-splint-t">견인 부목의 원리(대퇴 간부 골절)</title><defs><marker id="traction-splint-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><polyline points="70,140 250,140" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="12" opacity="0.5"/><polyline points="250,140 400,144" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="8" opacity="0.5"/><line x1="160" y1="128" x2="172" y2="152" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="166" y="112" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">대퇴 간부 골절</text><polygon points="40,112 70,112 70,168 40,168" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.35"/><text x="55" y="100" text-anchor="middle" font-size="11">몸 쪽 고정점</text><line x1="70" y1="210" x2="40" y2="210" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#traction-splint-ar)"/><text x="55" y="230" text-anchor="middle" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">받침</text><rect x="398" y="132" width="22" height="24" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.4"/><text x="409" y="114" text-anchor="middle" font-size="11">발목</text><line x1="420" y1="144" x2="490" y2="144" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#traction-splint-ar)"/><text x="455" y="134" text-anchor="middle" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">견인력(길이 방향)</text><line x1="70" y1="190" x2="490" y2="190" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3"/><text x="235" y="212" text-anchor="middle" font-size="11" style="fill:var(--si-violet-s,#9382bd)">막대(양극식은 두 개, 단극식은 한 개)</text><text x="30" y="268" font-size="11">근육 수축으로 겹친 골편을 길이 방향 견인으로 당겨 다리가 짧아지는 것을 막는다</text><text x="30" y="290" font-size="11">반대쪽 다리 길이와 비교해 견인 정도를 가늠한다</text><line x1="490" y1="148" x2="490" y2="190" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6"/></svg>
