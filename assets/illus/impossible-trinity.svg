<svg class="si si-illus" viewBox="0 0 360 458" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="impossible-trinity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="impossible-trinity-t">국제금융 트릴레마: 세 목표 중 두 가지만 선택</title><defs></defs><polygon points="180,52 56,292 304,292" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2" fill-opacity="0.5"/><line x1="180" y1="52" x2="56" y2="292" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="4.5"/><line x1="180" y1="52" x2="304" y2="292" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="4.5"/><line x1="56" y1="292" x2="304" y2="292" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="4.5"/><circle cx="180" cy="52" r="8" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.2"/><circle cx="56" cy="292" r="8" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.2"/><circle cx="304" cy="292" r="8" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.2"/><text x="180" y="32" text-anchor="middle" font-weight="700">자본 자유이동</text><text x="56" y="318" text-anchor="middle" font-weight="700">고정환율</text><text x="304" y="318" text-anchor="middle" font-weight="700">독자 통화정책</text><text x="108" y="160" text-anchor="end" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">통화정책 포기</text><text x="108" y="180" text-anchor="end" style="fill:var(--si-blue-s,#7f9ac0)">홍콩·유로존</text><text x="252" y="160" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">변동환율</text><text x="252" y="180" style="fill:var(--si-green-s,#5b9b83)">미국</text><text x="180" y="318" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">자본통제</text><circle cx="180" cy="208" r="22" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-bg,#ffffff)" stroke-width="3"/><line x1="164" y1="224" x2="196" y2="192" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="180" y="250" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">셋 동시 불가</text><text x="20" y="364" style="fill:var(--si-general,#5c6b7f)">각 변은 두 목표를 함께 고른 경우이고,</text><text x="20" y="384" style="fill:var(--si-general,#5c6b7f)">변 옆 글은 그에 따른 대가와 사례이다.</text><text x="20" y="420" style="fill:var(--si-general,#5c6b7f)">현실에서는 부분 자본통제나 관리변동환율처럼</text><text x="20" y="440" style="fill:var(--si-general,#5c6b7f)">변 위의 중간 지점을 택하는 경우가 많다.</text></svg>
