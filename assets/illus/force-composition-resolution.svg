<svg class="si si-illus" viewBox="0 0 520 340" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="힘의 합성: 평행사변형 작도와 수직인 두 힘" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>왼쪽은 두 힘 F1, F2를 이웃 변으로 하는 평행사변형의 대각선이 합력 R이 되는 작도이고, 오른쪽은 서로 수직인 두 힘 a, b의 합력 R이 직사각형의 대각선이 되는 그림</desc><defs><marker id="force-composition-resolution-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="force-composition-resolution-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="170" y="40" text-anchor="middle" font-size="12" font-weight="700">평행사변형 작도</text><line x1="210" y1="230" x2="290" y2="120" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="140" y1="140" x2="290" y2="120" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="60" y1="250" x2="210" y2="230" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#force-composition-resolution-ar)"/><line x1="60" y1="250" x2="140" y2="140" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#force-composition-resolution-ar)"/><line x1="60" y1="250" x2="290" y2="120" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.8" marker-end="url(#force-composition-resolution-ar-1)"/><text x="222" y="246" font-size="12" font-style="italic">F<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="128" y="136" text-anchor="end" font-size="12" font-style="italic">F<tspan dy="0.278em" font-size="72%">2</tspan></text><text x="300" y="116" font-size="12" font-weight="700" font-style="italic" style="fill:var(--si-rose-s,#c97b7b)">R</text><circle cx="60" cy="250" r="3.5" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><text x="54" y="270" text-anchor="middle" font-size="12" font-style="italic">O</text><text x="430" y="40" text-anchor="middle" font-size="12" font-weight="700">서로 수직인 두 힘</text><line x1="460" y1="260" x2="460" y2="180" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="350" y1="180" x2="460" y2="180" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="350" y1="260" x2="460" y2="260" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#force-composition-resolution-ar)"/><line x1="350" y1="260" x2="350" y2="180" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#force-composition-resolution-ar)"/><line x1="350" y1="260" x2="460" y2="180" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.8" marker-end="url(#force-composition-resolution-ar-1)"/><polyline points="360,260 360,250 350,250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="405" y="278" text-anchor="middle" font-size="12" font-style="italic">a</text><text x="338" y="222" text-anchor="middle" font-size="12" font-style="italic">b</text><text x="412" y="198" font-size="12" font-weight="700" font-style="italic" style="fill:var(--si-rose-s,#c97b7b)">R</text></svg>
