<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spatial-enclosure-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="spatial-enclosure-t">공간의 위요감: D/H와 올려다보는 각</title><defs></defs><line x1="20" y1="250" x2="500" y2="250" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="452" y="150" width="30" height="100" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.35"/><line x1="452" y1="262" x2="452" y2="150" style="stroke:currentColor;fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0"/><text x="467" y="138" text-anchor="middle" font-size="12">벽(높이 H)</text><circle cx="352" cy="250" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><line x1="352" y1="250" x2="452" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><text x="352" y="272" text-anchor="middle" font-size="11">D/H = 1</text><text x="344" y="246" text-anchor="end" font-size="11" style="fill:var(--si-rose-s,#c97b7b)">45.0°</text><circle cx="252" cy="250" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><line x1="252" y1="250" x2="452" y2="150" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><text x="252" y="272" text-anchor="middle" font-size="11">D/H = 2</text><text x="244" y="246" text-anchor="end" font-size="11" style="fill:var(--si-amber-s,#d79a2b)">26.6°</text><circle cx="152" cy="250" r="4" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><line x1="152" y1="250" x2="452" y2="150" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6"/><text x="152" y="272" text-anchor="middle" font-size="11">D/H = 3</text><text x="144" y="246" text-anchor="end" font-size="11" style="fill:var(--si-violet-s,#9382bd)">18.4°</text><circle cx="52" cy="250" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><line x1="52" y1="250" x2="452" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6"/><text x="52" y="272" text-anchor="middle" font-size="11">D/H = 4</text><text x="44" y="246" text-anchor="end" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">14.0°</text><line x1="352" y1="290" x2="452" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="402" y="306" text-anchor="middle" font-size="11">D = H</text><text x="30" y="40">올려다보는 각 = arctan(H / D)</text><text x="30" y="64" font-size="12">D/H가 1 안팎이면 둘러싸인 느낌이 크게 바뀐다</text></svg>
