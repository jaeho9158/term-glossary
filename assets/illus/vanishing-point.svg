<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vanishing-point-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="vanishing-point-t">일점 투시: 평행선이 소실점으로 모인다</title><desc>그림 아래쪽의 여러 점에서 수평선 위의 소실점으로 선을 그어 화면에 수직인 평행선이 한 점으로 모이는 일점 투시의 모식도</desc><defs></defs><rect x="20" y="20" width="480" height="280" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="20" y1="110" x2="500" y2="110" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="100" y="102" text-anchor="middle" font-size="12">수평선(눈높이)</text><line x1="50" y1="290" x2="260" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.2"/><circle cx="50" cy="290" r="3" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="130" y1="290" x2="260" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.2"/><circle cx="130" cy="290" r="3" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="210" y1="290" x2="260" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.2"/><circle cx="210" cy="290" r="3" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="290" y1="290" x2="260" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.2"/><circle cx="290" cy="290" r="3" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="370" y1="290" x2="260" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.2"/><circle cx="370" cy="290" r="3" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="450" y1="290" x2="260" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.2"/><circle cx="450" cy="290" r="3" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><circle cx="260" cy="110" r="5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="400" y="50" text-anchor="middle" font-size="12">소실점</text><line x1="400" y1="50" x2="260" y2="110" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="260" cy="110" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="260" y="314" text-anchor="middle" font-size="12">화면에 수직인 평행선이 한 점으로 모인다</text></svg>
