<svg class="si si-illus" viewBox="0 0 360 672" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hydrogen-energy-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="hydrogen-energy-t">수소 에너지: 전해조·저장·연료전지와 변환 손실</title><defs><marker id="hydrogen-energy-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker><marker id="hydrogen-energy-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="180" y="26" text-anchor="middle" font-weight="700">수소 = 에너지 운반체 (1차 에너지원 아님)</text><rect x="16" y="48" width="16" height="16" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="40" y="61">회색: 천연가스 수증기 개질</text><rect x="16" y="68.5" width="16" height="16" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="40" y="81.5">청색: 회색 + 탄소 포집·저장</text><rect x="16" y="89" width="16" height="16" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="40" y="102">녹색: 재생 전력으로 물 전기분해</text><text x="40" y="124" style="fill:var(--si-rose-t,#7d2626)">회색은 H₂ 1톤당 CO₂ 6.6~9.3톤 배출</text><rect x="16" y="200" width="92" height="86" rx="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2" fill-opacity="0.7"/><rect x="26" y="224" width="72" height="56" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="0" fill-opacity="0.25"/><line x1="44" y1="194" x2="44" y2="274" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="80" y1="194" x2="80" y2="274" style="stroke:currentColor;fill:none" stroke-width="3"/><circle cx="40" cy="242" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1"/><circle cx="48" cy="232" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1"/><circle cx="42" cy="258" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1"/><circle cx="84" cy="250" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1"/><circle cx="88" cy="236" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1"/><circle cx="86" cy="266" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1"/><text x="44" y="184" text-anchor="middle" font-weight="700">H₂</text><text x="80" y="184" text-anchor="middle" font-weight="700">O₂</text><text x="62" y="310" text-anchor="middle" font-weight="700">전해조</text><rect x="150" y="210" width="64" height="62" rx="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="182" y="248" text-anchor="middle" font-size="16" font-weight="700">H₂</text><text x="182" y="310" text-anchor="middle" font-weight="700">저장탱크</text><rect x="252" y="200" width="92" height="86" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2" fill-opacity="0.7"/><line x1="268" y1="212" x2="268" y2="274" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><line x1="328" y1="212" x2="328" y2="274" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><text x="298" y="248" text-anchor="middle">H₂ + O₂</text><text x="298" y="310" text-anchor="middle" font-weight="700">연료전지</text><line x1="108" y1="243" x2="147" y2="243" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3" marker-end="url(#hydrogen-energy-ar)"/><line x1="214" y1="243" x2="249" y2="243" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3" marker-end="url(#hydrogen-energy-ar)"/><text x="16" y="160" style="fill:var(--si-amber-t,#7a5210)">전력 + 물(H₂O) 투입</text><text x="298" y="160" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">전기 + 물 배출</text><line x1="62" y1="340" x2="298" y2="340" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#hydrogen-energy-ar-1)" marker-start="url(#hydrogen-energy-ar-1)"/><text x="180" y="366" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">연료전지는 전해조의 역반응</text><text x="180" y="396" text-anchor="middle">액화 시 끓는점 20.28 K (≈ −252.87 °C)</text><text x="180" y="416" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">공기 중 4%에서도 점화</text><text x="16" y="454" font-weight="700">에너지 손실 예: 녹색 수소 → 메탄올</text><rect x="30" y="468" width="300" height="30" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="0"/><text x="38" y="489" font-weight="700" style="fill:var(--si-blue-t,#12305c)">100 (투입)</text><rect x="240" y="498" width="90" height="30" style="stroke:none;fill:var(--si-gray-f,#eef1f6)" stroke-width="0"/><text x="246" y="519" style="fill:var(--si-general,#5c6b7f)">손실 30</text><rect x="30" y="528" width="210" height="30" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="0"/><text x="38" y="549" font-weight="700" style="fill:var(--si-green-t,#14543c)">수소 생산 후 70%</text><rect x="177" y="558" width="63" height="30" style="stroke:none;fill:var(--si-gray-f,#eef1f6)" stroke-width="0"/><text x="183" y="579" style="fill:var(--si-general,#5c6b7f)">손실 21</text><rect x="30" y="588" width="147" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.4"/><text x="38" y="612" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">메탄올 후 49%</text><text x="30" y="652" font-weight="700">수소 70% × 메탄올 70% = 49%</text></svg>
