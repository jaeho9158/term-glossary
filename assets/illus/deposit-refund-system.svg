<svg class="si si-illus" viewBox="0 0 360 512" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deposit-refund-system-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="deposit-refund-system-t">예치금 환불제: 반납률과 반납 후 경로</title><defs><marker id="deposit-refund-system-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">예치금 환불제: 가상 예 10,000개 중 82% 반납</text><path d="M22.5,69 L22.5,50.3 Q22.5,45.9 26.6,45.9 L33.4,45.9 Q37.5,45.9 37.5,50.3 L37.5,69Z" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.5"/><circle cx="30" cy="40.4" r="4.8" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.5"/><line x1="30" y1="76" x2="30" y2="136" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4" marker-end="url(#deposit-refund-system-ar)"/><path d="M150,138 Q140,58 62,60" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4"/><path d="M70,52 L58,60 L70,68 Z" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><text x="40" y="112" style="fill:var(--si-amber-s,#d79a2b)">구매 시 예치금</text><rect x="10" y="140" width="60" height="200" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="40" y="230" text-anchor="middle" font-weight="700">판매</text><text x="40" y="254" text-anchor="middle">10,000개</text><path d="M70,140 C150,140 150,140 190,140 L190,304 C150,304 150,304 70,304 Z" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><path d="M70,304 L190,316 L190,340 L70,340 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="94" y="210" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">반납</text><text x="94" y="234">8,200개</text><text x="94" y="258" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">(82%)</text><text x="198" y="334" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">미반납 1,800개</text><polyline points="190,180 250,154" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" stroke-dasharray="5 4"/><polyline points="190,264 250,290" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" stroke-dasharray="5 4"/><rect x="250" y="128" width="100" height="56" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="300" y="146" text-anchor="middle" font-weight="700">재사용</text><text x="300" y="170" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">세척 후</text><rect x="250" y="260" width="100" height="56" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="300" y="282" text-anchor="middle" font-weight="700">재활용</text><text x="300" y="306" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">원료로</text><text x="162" y="100" style="fill:var(--si-amber-s,#d79a2b)">반납 시 환불</text><line x1="201" y1="353" x2="215" y2="367" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><line x1="201" y1="367" x2="215" y2="353" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><text x="222" y="365" style="fill:var(--si-rose-s,#c97b7b)">예치금 환불 안 됨</text><rect x="10" y="380" width="340" height="58" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="180" y="400" text-anchor="middle" font-weight="700">회수율 = 8,200 ÷ 10,000 = 82%</text><text x="180" y="426" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(가상 예시)</text><text x="180" y="468" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">환경 성과는 반납 이후의 분기에서 결정된다</text><text x="180" y="494" text-anchor="middle" style="fill:var(--si-accent,#2454ff)">회수율 ≠ 환경 성과</text></svg>
