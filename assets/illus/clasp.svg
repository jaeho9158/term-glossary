<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clasp-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="clasp-t">클라스프의 접근 방향: 상방형과 하방형</title><defs><marker id="clasp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><line x1="348" y1="76" x2="368" y2="47" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><rect x="100" y="250" width="300" height="60" style="stroke:currentColor;fill:var(--si-general,#5c6b7f)" stroke-width="1" fill-opacity="0.25"/><path d="M200 250 C 190 200, 175 140, 200 90 L 300 90 C 325 140, 310 200, 300 250 Z" style="stroke:currentColor;fill:currentColor" stroke-width="2" fill-opacity="0.08"/><polyline points="348,76 326,120 320,170 316,205" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.5" marker-end="url(#clasp-ar)"/><polyline points="150,300 172,245 177,215 181,200" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.5" marker-end="url(#clasp-ar)"/><text x="250" y="128" text-anchor="middle">치관</text><text x="250" y="285" text-anchor="middle">치은</text><text x="370" y="40" font-size="12">치관 쪽에서 시작</text><text x="370" y="18" font-size="12" font-weight="700">상방형 (suprabulge)</text><text x="20" y="300" font-size="12">치은 쪽에서 접근</text><text x="20" y="279" font-size="12" font-weight="700">하방형 (infrabulge)</text></svg>
