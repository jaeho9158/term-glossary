<svg class="si si-illus" viewBox="0 0 360 444" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="분배적 교섭: 목표점과 저항점이 겹치는 구간이 타결영역이다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="distributive-bargaining-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="distributive-bargaining-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="10" y="22" font-weight="700">임금 인상률 교섭 (가상 값)</text><rect x="97.5" y="88" width="135" height="96" style="stroke:var(--si-pos,#14543c);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.25"/><line x1="300" y1="110" x2="97.5" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.5" marker-end="url(#distributive-bargaining-ar)"/><circle cx="300" cy="110" r="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><text x="300" y="76" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">노조 목표 6.0%</text><text x="97.5" y="76" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">노조 저항 3.0%</text><line x1="30" y1="164" x2="232.5" y2="164" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#distributive-bargaining-ar-1)"/><circle cx="30" cy="164" r="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><text x="10" y="204" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">사용자 목표 2.0%</text><text x="232.5" y="204" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">사용자 저항 5.0%</text><text x="165" y="134"