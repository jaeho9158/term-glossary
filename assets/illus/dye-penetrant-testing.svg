<svg class="si si-illus" viewBox="0 0 360 628" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="침투탐상검사: 균열 단면에서 침투·제거·현상·관찰 네 단계" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="dye-penetrant-testing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="10" y="34" width="158" height="262" rx="6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1"/><text x="89" y="53" text-anchor="middle" font-weight="700">① 침투</text><text x="89" y="74" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">5~30분</text><text x="89" y="94" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">모세관 작용</text><rect x="192" y="34" width="158" height="262" rx="6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1"/><text x="271" y="53" text-anchor="middle" font-weight="700">② 제거</text><text x="271" y="74" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">잉여 침투액을</text><text x="271" y="94" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">닦아냄</text><rect x="10" y="322" width="158" height="262" rx="6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1"/><text x="89" y="341" text-anchor="middle" font-weight="700">③ 현상</text><text x="89" y="362" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">10~30분</text><text x="89" y="382" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">침투액이 올라옴</text><rect x="192" y="322" width="158" height="262" rx="6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1"/><text x="271" y="341" text-anchor="middle" font-weight="700">④ 관찰</text><text x="271" y="362" text-anchor="middle" style="fill:var(--si-general,#5c6b7