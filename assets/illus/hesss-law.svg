<svg class="si si-illus" viewBox="0 0 360 494" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hesss-law-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="hesss-law-t">헤스의 법칙: 반응열은 경로가 달라도 처음과 끝 상태로만 정해진다</title><defs><marker id="hesss-law-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="hesss-law-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="hesss-law-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="hesss-law-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><line x1="44" y1="326.1" x2="44" y2="66" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#hesss-law-ar)"/><text x="44" y="52" text-anchor="middle" font-weight="700" font-style="italic">H</text><line x1="74" y1="80" x2="310" y2="80" style="stroke:currentColor;fill:none" stroke-width="2.6"/><line x1="200" y1="146.3" x2="310" y2="146.3" style="stroke:currentColor;fill:none" stroke-width="2.6"/><line x1="74" y1="316.1" x2="310" y2="316.1" style="stroke:currentColor;fill:none" stroke-width="2.6"/><text x="190" y="63" text-anchor="middle" font-weight="700">C(흑연) + O<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="256" y="170.3" font-weight="700">CO + ½O<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="190" y="340.1" text-anchor="middle" font-weight="700">CO<tspan dy="0.217em" font-size="92%">2</tspan></text><line x1="110" y1="83" x2="110" y2="313.1" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#hesss-law-ar-1)"/><text x="120" y="170" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">ΔH = −393.5</text><text x="120" y="192" style="fill:var(--si-general,#5c6b7f)">(한 단계)</text><line x1="240" y1="83" x2="240" y2="143.3" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#hesss-law-ar-2)"/><text x="256" y="104" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">−110.5</text><line x1="240" y1="149.3" x2="240" y2="313.1" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3" marker-end="url(#hesss-law-ar-3)"/><text x="256" y="235" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">−283.0</text><text x="14" y="376" font-weight="700">−110.5 + (−283.0) = −393.5 (kJ/mol)</text><text x="14" y="402">처음과 끝 상태가 같으면 단계 수와 무관하게</text><text x="14" y="424">ΔH 합이 같다. 중간 단계는 가상 경로여도 된다.</text><text x="14" y="452" style="fill:var(--si-general,#5c6b7f)">반응식을 뒤집으면 ΔH 부호가 바뀌고,</text><text x="14" y="474" style="fill:var(--si-general,#5c6b7f)">계수를 곱하면 ΔH도 같은 수를 곱한다.</text></svg>
