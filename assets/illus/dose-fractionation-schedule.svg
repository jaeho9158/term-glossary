<svg class="si si-illus" viewBox="0 0 360 556" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="분할조사일정: 표준분할·과분할·저분할의 회당 선량 비교" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="dose-fractionation-schedule-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">분할조사일정: 1주 예시</text><text x="14" y="50" font-weight="700">표준분할: 1일 1회, 1.8~2 Gy</text><line x1="64" y1="148" x2="346" y2="148" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="90" y="108" width="16" height="40" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="146" y="108" width="16" height="40" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="202" y="108" width="16" height="40" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="258" y="108" width="16" height="40" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="314" y="108" width="16" height="40" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="14" y="170" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">과분할: 1일 2회 이상, 회당 선량↓</text><line x1="64" y1="268" x2="346" y2="268" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="82" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="102" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="138" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="158" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="194" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="214" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="250" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="270" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="306" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="326" y="248" width="12" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="14" y="290" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">저분할: 회당 선량↑, 전체 횟수↓</text><line x1="64" y1="388" x2="346" y2="388" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="90" y="321.3" width="16" height="66.7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="146" y="321.3" width="16" height="66.7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="202" y="321.3" width="16" height="66.7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="130" y="222">조사 간격</text><line x1="130" y1="222" x2="98" y2="260" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="98" cy="260" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><line x1="84" y1="312" x2="224" y2="312" style="stroke:var(--si-amber-s,#d79a2b);fill:none" s