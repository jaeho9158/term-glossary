<svg class="si si-illus" viewBox="0 0 360 574" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fenton-reaction-water-treatment-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="fenton-reaction-water-treatment-t">펜톤 반응의 철 순환과 최적 pH</title><defs><marker id="fenton-reaction-water-treatment-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="fenton-reaction-water-treatment-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><linearGradient id="fenton-reaction-water-treatment-g0" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" style="stop-color:var(--si-bg,#ffffff)"/><stop offset="1" style="stop-color:var(--si-blue-f,#dde5f0)"/></linearGradient></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">펜톤 반응: 철이 순환하며 ·OH를 만든다</text><text x="180" y="46" text-anchor="middle" font-weight="700">Fe<tspan dy="-0.435em" font-size="92%">2+</tspan><tspan dy="0.4em"> + H</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> → Fe</tspan><tspan dy="-0.435em" font-size="92%">3+</tspan><tspan dy="0.4em"> + ·OH + OH</tspan><tspan dy="-0.435em" font-size="92%">−</tspan></text><path d="M16 66 V346 H344 V66" style="stroke:currentColor;fill:url(#fenton-reaction-water-treatment-g0)" stroke-width="2"/><rect x="18" y="318" width="324" height="26" style="stroke:none;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6" fill-opacity="0.8"/><text x="180" y="336" text-anchor="middle">철 슬러지 침전층 (침전·제거)</text><circle cx="52" cy="190" r="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="52" y="195" text-anchor="middle" font-weight="700">Fe<tspan dy="-0.435em" font-size="92%">2+</tspan></text><circle cx="158" cy="190" r="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="158" y="195" text-anchor="middle" font-weight="700">Fe<tspan dy="-0.435em" font-size="92%">3+</tspan></text><path d="M60,164 C67.5,158 90,128 105,128 C120,128 142.5,158 150,164" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#fenton-reaction-water-treatment-ar)"/><path d="M150,216 C142.5,222 120,252 105,252 C90,252 67.5,222 60,216" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#fenton-reaction-water-treatment-ar)"/><text x="105" y="108" text-anchor="middle">+ H<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><text x="105" y="280" text-anchor="middle">+ H<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> (다시 환원)</tspan></text><line x1="112" y1="130" x2="190" y2="130" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#fenton-reaction-water-treatment-ar-1)"/><text x="160" y="122" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">·OH</text><text x="105" y="302" text-anchor="middle" font-weight="700">철은 소모되지 않고 순환한다</text><text x="268" y="100" text-anchor="middle" font-weight="700">난분해성 유기오염물질</text><line x1="232" y1="150" x2="256" y2="136" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.4"/><line x1="256" y1="136" x2="280" y2="150" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.4" stroke-dasharray="3 4"/><line x1="280" y1="150" x2="304" y2="136" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.4"/><line x1="304" y1="136" x2="328" y2="150" style="stroke:var(--si-