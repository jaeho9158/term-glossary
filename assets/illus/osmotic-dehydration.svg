<svg class="si si-illus" viewBox="0 0 640 384" style="max-width:640px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="osmotic-dehydration-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="osmotic-dehydration-t">삼투건조: 물은 나가고 용질은 들어오는 두 흐름</title><desc>고농도 당용액에 담근 과일 조각에서 물이 용액 쪽으로 빠져나가고 당이 조각 안으로 들어오는 두 흐름을 화살표로 보인 단면 모식도. 100 g이 64 g이 되는 본문의 가상 예 수치를 붙였다.</desc><defs><marker id="osmotic-dehydration-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="osmotic-dehydration-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="190" y1="200" x2="149.8" y2="298.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="430" y1="200" x2="476.2" y2="298.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="24" font-size="12" font-weight="700">삼투건조: 과일 조각과 고농도 당용액(모식)</text><text x="620" y="24" text-anchor="end" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">본문의 가상 예(실측 아님)</text><rect x="110" y="50" width="400" height="230" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6" fill-opacity="0.12"/><text x="122" y="72" font-size="12" style="fill:var(--si-accent,#2454ff)">고농도 당용액</text><rect x="250" y="120" width="120" height="100" rx="14" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.35"/><text x="310" y="160" text-anchor="middle" font-size="12">과일 조각</text><text x="310" y="184" text-anchor="middle" font-size="11.5">100 g → 64 g</text><line x1="246" y1="145" x2="160" y2="145" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#osmotic-dehydration-ar)"/><line x1="246" y1="195" x2="160" y2="195" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#osmotic-dehydration-ar)"/><line x1="460" y1="145" x2="374" y2="145" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#osmotic-dehydration-ar-1)"/><line x1="460" y1="195" x2="374" y2="195" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#osmotic-dehydration-ar-1)"/><text x="110" y="312" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">물이 빠져나감</text><text x="110" y="330" text-anchor="middle" font-size="11.5">WL = 48.32 g/100 g</text><text x="510" y="312" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">당이 들어옴</text><text x="510" y="330" text-anchor="middle" font-size="11.5">SG = 12.32 g/100 g</text><text x="20" y="364" font-size="12" style="fill:var(--si-general,#5c6b7f)">WL / SG = 48.32 / 12.32 ≈ 3.92</text></svg>
