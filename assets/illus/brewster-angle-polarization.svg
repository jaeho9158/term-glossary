<svg class="si si-illus" viewBox="0 0 600 400" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brewster-angle-polarization-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="brewster-angle-polarization-t">브루스터각에서의 반사와 굴절</title><desc>공기에서 유리로 브루스터각으로 들어온 빛이 반사광과 굴절광으로 갈리며, 두 광선이 서로 수직이고 반사광에는 s 편광만 남는 모식도</desc><defs><marker id="brewster-angle-polarization-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="brewster-angle-polarization-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="20" y="200" width="560" height="150" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.12"/><line x1="20" y1="200" x2="580" y2="200" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><line x1="300" y1="60" x2="300" y2="340" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="5 4"/><line x1="176" y1="116" x2="298" y2="199" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#brewster-angle-polarization-ar)"/><line x1="302" y1="199" x2="424" y2="116" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#brewster-angle-polarization-ar-1)"/><line x1="301" y1="201" x2="384" y2="324" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#brewster-angle-polarization-ar)"/><text x="270" y="132" text-anchor="middle" font-size="12">θ<tspan dy="0.278em" font-size="72%">B</tspan></text><text x="316" y="262" text-anchor="middle" font-size="12">θ<tspan dy="0.278em" font-size="72%">2</tspan></text><text x="352" y="222" text-anchor="middle" font-size="12">90°</text><text x="150" y="96" text-anchor="middle" font-size="12">입사광 (p + s)</text><text x="450" y="96" text-anchor="middle" font-size="12">반사광 (s만)</text><text x="440" y="334" text-anchor="middle" font-size="12">굴절광</text><text x="30" y="186" font-size="12">공기 n<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="30" y="226" font-size="12">유리 n<tspan dy="0.278em" font-size="72%">2</tspan></text><g class="si-rich" font-size="12" ><text x="218.5" y="380">tan θ<tspan dy="0.278em" font-size="72%">B</tspan><tspan dy="-0.2em"> = </tspan></text><text x="280.9" y="374.2" text-anchor="middle" font-size="9.6">n<tspan dy="0.278em" font-size="72%">2</tspan></text><line x1="274.3" y1="376.2" x2="287.5" y2="376.2" style="stroke:currentColor" stroke-width="0.8"/><text x="280.9" y="384.4" text-anchor="middle" font-size="9.6">n<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="289" y="380">,   θ<tspan dy="0.278em" font-size="72%">B</tspan><tspan dy="-0.2em"> + θ</tspan><tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> = 90°</tspan></text></g></svg>
