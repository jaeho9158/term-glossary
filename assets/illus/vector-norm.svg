<svg class="si si-illus" viewBox="0 0 600 352" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="벡터 (3, 4)의 유클리드 노름" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>원점에서 점 (3, 4)로 가는 화살표와, 성분 3과 4를 두 변으로 하는 직각삼각형. 빗변인 화살표 길이가 5다</desc><defs><marker id="vector-norm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker><marker id="vector-norm-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><line x1="140" y1="290" x2="400" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" marker-end="url(#vector-norm-ar)"/><line x1="170" y1="315" x2="170" y2="40" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" marker-end="url(#vector-norm-ar)"/><line x1="170" y1="290" x2="320" y2="290" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="320" y1="290" x2="320" y2="90" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="308" y1="290" x2="308" y2="278" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="308" y1="278" x2="320" y2="278" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="170" y1="290" x2="320" y2="90" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#vector-norm-ar-1)"/><circle cx="320" cy="90" r="4" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="245" y="308" text-anchor="middle" font-size="12">3</text><text x="334" y="194" font-size="12">4</text><text x="258" y="200" font-size="12" font-weight="700">v (길이 5)</text><text x="330" y="84" font-size="12">(3, 4)</text><text x="408" y="294" font-size="12" font-style="italic">x</text><text x="178" y="44" font-size="12" font-style="italic">y</text><text x="160" y="306" text-anchor="end" font-size="12">O</text><text x="300" y="340" text-anchor="middle" font-size="12">길이 = √(3<tspan dy="-0.556em" font-size="72%">2</tspan><tspan dy="0.4em"> + 4</tspan><tspan dy="-0.556em" font-size="72%">2</tspan><tspan dy="0.4em">) = √25 = 5</tspan></text></svg>
