<svg class="si si-illus" viewBox="0 0 360 606" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="히스타민 어류 중독: 16 °C 넘으면 세균이 히스타민을 만든다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="histamine-fish-poisoning-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="histamine-fish-poisoning-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="histamine-fish-poisoning-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">히스타민 어류 중독: 온도·반응·시간</text><rect x="150" y="44" width="190" height="76" style="stroke:none;fill:var(--si-amber-f,#fdf0d8)" stroke-width="0.5" opacity="0.35"/><line x1="50" y1="214" x2="50" y2="38" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" marker-end="url(#histamine-fish-poisoning-ar)"/><line x1="50" y1="214" x2="350" y2="214" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" marker-end="url(#histamine-fish-poisoning-ar)"/><text x="8" y="34" font-weight="700">생선 온도</text><text x="195" y="234" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">어획 후 경과 시간</text><line x1="50" y1="120" x2="340" y2="120" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><text x="340" y="138" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">16 °C (60 °F)</text><path d="M50,190 C65,189.3 108.3,187 140,186 C171.7,185 206.7,185 240,184 C273.3,183 323.3,180.7 340,180" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><text x="340" y="172" text-anchor="end" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">냉장 유지</text><path d="M50,186 C58.3,183.3 85,180.7 100,170 C115,159.3 123.3,132.7 140,122 C156.7,111.3 180,111 200,106 C220,101 236.7,96.3 260,92 C283.3,87.7 326.7,82 340,80" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.8"/><text x="54" y="146" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">상온 방치</text><text x="156" y="60" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">세균 증식 → 히스타민 축적</text><text x="8" y="262" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">카복실기(COOH)가 CO₂로 이탈</text><polygon points="34,292 47.3,301.7 42.2,317.3 25.8,317.3 20.7,301.7" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><polyline points="44,311 60,320 76,308" style="stroke:currentColor;fill:none" stroke-width="1.8"/><polyline points="76,308 76,328" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="60" y="346">NH₂</text><polyline points="76,308 92,298" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="88" y="292" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">COOH</text><line x1="100" y1="282" x2="100" y2="270" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#histamine-fish-poisoning-ar-1)"/><line x1="138" y1="310" x2="216" y2="310" style="stroke:currentColor;fill:none" stroke-width="2.6" marker-end="url(#histamine-fish-poisoning-ar-2)"/><text x="177" y="288" text-anchor="middle" font-weight="700">탈탄산효소</text><text x="177" y="334" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(세균 유래)</text><polygon points="244,292 257.3,301.7 252.2,317.3 235.8,317.3 230.7,301.7" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><polyline points="254,311 270,320 286,308 300,320" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="292" y="346">NH₂</text><line x1="300" y1="320" x2="300" y2="334" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="60" y="366" text-anchor="middle" font-weight="700">히스티딘</text><text x="270" y="366" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">히스타민</text><text x="8" y="402" font-weight="700">섭취 후</text><circle cx="70" cy="398" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><rect x="84" y="386" width="102" height="26" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="135" y="404" text-anchor="middle">10~60분 뒤 시작</text><rect x="190" y="386" width="150" height="26" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="265" y="404" text-anchor="middle">보통 10~14시간 지속</text><text x="135" y="432" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(자료에 따라 10~30분)</text><circle cx="30" cy="462" r="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><circle cx="24" cy="458" r="2" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="36" cy="458" r="2" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="21" cy="467" r="3.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="39" cy="467" r="3.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="54" y="458">초기: 얼굴 홍조·두통·메스꺼움</text><text x="54" y="478" style="fill:var(--si-general,#5c6b7f)">심하면: 발진·부종·호흡 곤란</text><rect x="8" y="498" width="344" height="44" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><path d="M34,502 C44,512 46,522 40,530 C37,534 31,534 28,530 C24,524 28,518 32,514 C32,518 35,518 36,514 C36,510 35,506 34,502 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4"/><line x1="29" y1="510" x2="49" y2="530" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="29" y1="530" x2="49" y2="510" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="64" y="514" font-weight="700">조리·훈제·통조림·냉동해도</text><text x="64" y="536" font-weight="700">히스타민은 사라지지 않음</text><text x="8" y="568" style="fill:var(--si-general,#5c6b7f)">체내 분해: DAO(다이아민 산화효소),</text><text x="8" y="588" style="fill:var(--si-general,#5c6b7f)">히스타민 N-메틸전이효소</text></svg>
