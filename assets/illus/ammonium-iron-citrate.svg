<svg class="si si-illus" viewBox="0 0 360 736" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ammonium-iron-citrate-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ammonium-iron-citrate-t">구연산철암모늄 감광: 빛을 받은 곳만 파랗게 남는다</title><defs><marker id="ammonium-iron-citrate-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker><marker id="ammonium-iron-citrate-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="14" y="22" font-weight="700">① 감광액 도포</text><text x="30" y="46" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">감광층: 구연산철암모늄 + 페리시안화칼륨</text><rect x="30" y="56" width="300" height="10" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><rect x="30" y="66" width="300" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><line x1="130" y1="52" x2="130" y2="55.8" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="130" y1="66" x2="130" y2="94" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="230" y1="52" x2="230" y2="55.8" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="230" y1="66" x2="230" y2="94" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><text x="30" y="104" style="fill:var(--si-general,#5c6b7f)">종이</text><text x="14" y="154" font-weight="700">② 노출: 마스크 아래는 빛이 가려진다</text><text x="30" y="182" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">