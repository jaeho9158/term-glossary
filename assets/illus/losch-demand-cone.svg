rrentColor;fill:currentColor" stroke-width="1.6"/><text x="435" y="256" text-anchor="middle" font-size="12">R = 5</text><text x="426" y="206" font-size="12">H = 50</text><text x="400" y="170" text-anchor="middle">가격 p = 5</text><text x="400" y="312" text-anchor="middle" font-size="12">V = πR<tspan baseline-shift="super" font-size="72%">2</tspan>H/3 ≈ 1309</text><text x="20" y="26" font-size="12" style="fill:var(--si-general,#5c6b7f)">q(x) = 10 × (10 − p − x),  운송비 t = 1</text><text x="140" y="280" text-anchor="middle" font-size="11">점포</text></svg>
