<svg class="si si-illus" viewBox="0 0 360 388" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acceptable-daily-intake-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="acceptable-daily-intake-t">일일섭취허용량: 무독성량에서 100배 낮춘 기준과 실제 섭취</title><defs><marker id="acceptable-daily-intake-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="40" y1="50" x2="250" y2="50" style="stroke:currentColor;fill:none" stroke-width="3"/><text x="258" y="56" font-weight="700">무독성량</text><line x1="40" y1="200" x2="250" y2="200" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="4"/><text x="258" y="206" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">ADI</text><polygon points="84,54 84,108 88,108 80,122 72,108 76,108 76,54" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.35"/><polygon points="84,128 84,182 88,182 80,196 72,182 76,182 76,128" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.35"/><text x="104" y="96" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">÷10 종간 차이</text><text x="104" y="172" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">÷10 개인차</text><line x1="230" y1="54" x2="230" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#acceptable-daily-intake-ar)" marker-start="url(#acceptable-daily-intake-ar)"/><text x="204" y="125" text-anchor="middle">100배</text><text x="14" y="28" style="fill:var(--si-general,#5c6b7f)">동물실험 기준</text><rect x="20" y="268" width="320" height="26" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="20" y="268" width="96" height="26" style="stroke:va