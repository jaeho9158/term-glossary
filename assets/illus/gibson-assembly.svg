<svg class="si si-illus" viewBox="0 0 360 684" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gibson-assembly-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="gibson-assembly-t">깁슨 어셈블리: 겹침 서열이 깎이고 맞물려 이어지는 4단계</title><defs><marker id="gibson-assembly-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-pos,#14543c)"/></marker><marker id="gibson-assembly-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><clipPath id="gibson-assembly-clip0"><polygon points="150,44 190,44 190,64 150,64"/></clipPath><clipPath id="gibson-assembly-clip1"><polygon points="150,74 190,74 190,94 150,94"/></clipPath><clipPath id="gibson-assembly-clip2"><polygon points="150,344 190,344 190,364 150,364"/></clipPath></defs><text x="14" y="22" font-weight="700">① 겹침 서열을 가진 두 조각</text><rect x="24" y="46" width="166" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="24" y="55" width="166" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="150" y="76" width="180" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><rect x="150" y="85" width="180" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><path d="M131.3,54L170,15.3M134.8,57.5L173.5,18.8M138.4,61.1L177.1,22.4M141.9,64.6L180.6,25.9M145.4,68.1L184.1,29.4M149,71.7L187.7,33M152.5,75.2L191.2,36.5M156.1,78.7L194.7,40.1M159.6,82.3L198.3,43.6M163.1,85.8L201.8,47.1M166.7,89.4L205.4,50.7" clip-path="url(#gibson-assembly-clip0)" style="stroke:currentColor;fill:none" stroke-width="0.9" opacity="0.7"/><polygon points="150,44 190,44 190,64 150,64" style="stroke:currentColor;fill:none" stroke-width="1.4"/><path d="M131.3,84L170,45.3M134.8,87.5L173.5,48.8M138.4,91.1L177.1,52.4M141.9,94.6L180.6,55.9M145.4,98.1L184.1,59.4M149,101.7L187.7,63M152.5,105.2L191.2,66.5M156.1,108.7L194.7,70.1M159.6,112.3L198.3,73.6M163.1,115.8L201.8,77.1M166.7,119.4L205.4,80.7" clip-path="url(#gibson-assembly-clip1)" style="stroke:currentColor;fill:none" stroke-width="0.9" opacity="0.7"/><polygon points="150,74 190,74 190,94 150,94" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="198" y="58" font-weight="700" style="fill:var(--si-blue-t,#12305c)">A</text><text x="142" y="94" text-anchor="end" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">B</text><text x="4" y="48">5′</text><text x="4" y="70">3′</text><text x="340" y="80">3′</text><text x="340" y="102">5′</text><text x="180" y="118" text-anchor="middle" font-weight="700">겹침 서열(빗금) 약 20~40 bp</text><text x="180" y="138" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">프라이머 5′ 꼬리로 추가</text><text x="14" y="172" font-weight="700">② 엑소뉴클레아제가 5′ 말단을 깎는다</text><rect x="24" y="196" width="166" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="24" y="205" width="116" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="140" y="205" width="50" height="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><rect x="200" y="226" width="130" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><rect x="150" y="226" width="50" height="7" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><rect x="150" y="235" width="180" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><text x="198" y="203" style="fill:var(--si-blue-t,#12305c)">3′ 돌출</text><text x="142" y="244" text-anchor="end" style="fill:var(--si-amber-s,#d79a2b)">3′ 돌출</text><text x="180" y="268" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">점선: 깎여 나간 부분</text><text x="14" y="322" font-weight="700">③ 돌출 가닥이 맞물리고 빈칸이 메워진다</text><rect x="24" y="346" width="166" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="24" y="355" width="116" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="200" y="346" width="130" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><rect x="150" y="355" width="180" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><path d="M131.3,354L170,315.3M134.8,357.5L173.5,318.8M138.4,361.1L177.1,322.4M141.9,364.6L180.6,325.9M145.4,368.1L184.1,329.4M149,371.7L187.7,333M152.5,375.2L191.2,336.5M156.1,378.7L194.7,340.1M159.6,382.3L198.3,343.6M163.1,385.8L201.8,347.1M166.7,389.4L205.4,350.7" clip-path="url(#gibson-assembly-clip2)" style="stroke:currentColor;fill:none" stroke-width="0.9" opacity="0.7"/><polygon points="150,344 190,344 190,364 150,364" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="191" y1="349.5" x2="199" y2="349.5" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="2.4" marker-end="url(#gibson-assembly-ar)"/><line x1="149" y1="358.5" x2="141" y2="358.5" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="2.4" marker-end="url(#gibson-assembly-ar)"/><text x="180" y="398" text-anchor="middle" font-weight="700" style="fill:var(--si-pos,#14543c)">중합효소가 3′ 방향으로 연장(초록)</text><text x="180" y="418" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">맞물린 겹침 구간(빗금)</text><text x="14" y="472" font-weight="700">④ 연결효소가 틈(nick)을 봉합한다</text><rect x="24" y="496" width="176" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="24" y="505" width="121" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="200" y="496" width="130" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><rect x="145" y="505" width="185" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><polygon points="196,484 204,484 200,494" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1"/><polygon points="141,526 149,526 145,516" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1"/><text x="136" y="526" text-anchor="end" font-weight="700" style="fill:var(--si-limit,#7d2626)">틈(nick)</text><line x1="180" y1="532" x2="180" y2="550" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#gibson-assembly-ar-1)"/><rect x="24" y="560" width="176" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="24" y="569" width="121" height="7" rx="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><rect x="200" y="560" width="130" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><rect x="145" y="569" width="185" height="7" rx="1.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><rect x="24" y="569" width="176" height="7" style="stroke:none;fill:none" stroke-width="0"/><text x="4" y="566">5′</text><text x="4" y="588">3′</text><text x="340" y="566">3′</text><text x="340" y="588">5′</text><text x="180" y="610" text-anchor="middle" font-weight="700">이어진 하나의 이중가닥</text><text x="20" y="646" style="fill:var(--si-general,#5c6b7f)">한 튜브, 약 50 °C, 15~60분, 세 효소가 동시에 작용</text><text x="20" y="668" style="fill:var(--si-general,#5c6b7f)">한 단계 5조각 / 두 단계 15조각까지</text></svg>
