<svg class="si si-illus" viewBox="0 0 520 315" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rotary-vane-pump-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="rotary-vane-pump-t">회전 베인 펌프의 단면</title><desc>원통형 하우징 안에서 중심이 아래로 어긋난 로터가 돌고, 로터의 홈에서 미끄러져 나온 베인이 하우징 벽에 닿아 흡입구 쪽에서 넓어지고 배기구 쪽에서 좁아지는 방을 만드는 단면 모식도</desc><defs><marker id="rotary-vane-pump-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="rotary-vane-pump-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><circle cx="260" cy="160" r="110" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.08"/><circle cx="260" cy="192" r="72" style="stroke:var(--si-navy,#12305c);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.3"/><circle cx="260" cy="192" r="5" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="224.4" y1="166.1" x2="158.3" y2="118.1" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><line x1="295.6" y1="166.1" x2="361.7" y2="118.1" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><rect x="106" y="189" width="52" height="22" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><rect x="362" y="189" width="52" height="22" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><line x1="56" y1="200" x2="116" y2="200" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2" marker-end="url(#rotary-vane-pump-ar)"/><line x1="404" y1="200" x2="464" y2="200" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2" marker-end="url(#rotary-vane-pump-ar)"/><text x="56" y="180" font-size="12">흡입구</text><text x="464" y="180" text-anchor="end" font-size="12">배기구</text><path d="M232,192 A28,28 0 1 1 260,220" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><line x1="262" y1="220" x2="256" y2="220" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#rotary-vane-pump-ar-1)"/><text x="80" y="280" font-size="12">하우징</text><line x1="80" y1="280" x2="197" y2="250" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="197" cy="250" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="440" y="250" font-size="12">로터(편심)</text><line x1="440" y1="250" x2="320" y2="215" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="320" cy="215" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="440" y="150" font-size="12">베인</text><line x1="440" y1="150" x2="345" y2="120" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="345" cy="120" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="260" y="300" font-size="12">오일 밀봉</text><line x1="260" y1="300" x2="260" y2="267" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="260" cy="267" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/></svg>
