<svg class="si si-illus" viewBox="0 0 360 580" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ergonomics-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ergonomics-t">NIOSH 들기 방정식: 자세 치수가 권장 무게를 정한다</title><defs><marker id="ergonomics-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="ergonomics-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="14" y="22" font-weight="700">NIOSH 들기 방정식(가상의 예)</text><g class="si-rich" font-size="13" ><text x="14" y="46">HM = </text><text x="58" y="39.8" text-anchor="middle" font-size="10.4">25</text><line x1="50.1" y1="41.8" x2="66" y2="41.8" style="stroke:currentColor" stroke-width="0.8"/><text x="58" y="50.8" text-anchor="middle" font-size="10.4">H</text><text x="67.5" y="46"> = 0.625</text></g><text x="14" y="76">VM = 1 − 0.003|V − 75| = 0.925</text><g class="si-rich" font-size="13" ><text x="14" y="102">DM = 0.82 + </text><text x="103.5" y="95.8" text-anchor="middle" font-size="10.4">4.5</text><line x1="94" y1="97.8" x2="113" y2="97.8" style="stroke:currentColor" stroke-width="0.8"/><text x="103.5" y="106.8" text-anchor="middle" font-size="10.4">D</text><text x="114.5" y="102"> = 0.895</text></g><text x="14" y="128">AM = 1 − 0.0032 A = 1.000</text><line x1="14" y1="400" x2="346" y2="400" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="14" y1="276.3" x2="346" y2="276.3" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="14" y="250.3" style="fill:var(--si-general,#5c6b7f)">기준 높이</text><text x="14" y="270.3" style="fill:var(--si-general,#5c6b7f)">75 cm</text><polyline points="82,396 90,396" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="8"/><polyline points="90,396 112,344 84,288 130,208" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="9"/><circle cx="144" cy="186" r="15" style="stroke:var(--si-navy,#12305c);fill:var(--si-bg,#ffffff)" stroke-width="3"/><polyline points="130,208 152,311.5" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="7"/><rect x="156" y="293.5" width="56" height="52" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.4"/><text x="184" y="321.5" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">15 kg</text><rect x="170" y="194.5" width="56" height="52" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="156" y1="246.5" x2="234" y2="246.5" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3"/><text x="176" y="264.5" style="fill:var(--si-general,#5c6b7f)">선반</text><text x="80" y="191" font-weight="700" style="fill:var(--si-navy,#12305c)">작업자</text><line x1="90" y1="430" x2="156" y2="430" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#ergonomics-ar)" marker-start="url(#ergonomics-ar)"/><text x="123" y="454" text-anchor="middle">H = 40 cm</text><line x1="90" y1="400" x2="90" y2="440" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="156" y1="345.5" x2="156" y2="440" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="286" y1="400" x2="286" y2="317.5" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#ergonomics-ar)" marker-start="url(#ergonomics-ar)"/><text x="218" y="376.8">V = 50 cm</text><line x1="212" y1="317.5" x2="292" y2="317.5" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="240" y1="317.5" x2="240" y2="218.5" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#ergonomics-ar-1)" marker-start="url(#ergonomics-ar-1)"/><text x="248" y="272" style="fill:var(--si-rose-s,#c97b7b)">D = 60 cm</text><line x1="226" y1="218.5" x2="246" y2="218.5" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="6 4"/><rect x="246" y="28" width="102" height="146" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="252" y="48" style="fill:var(--si-general,#5c6b7f)">위에서 본 몸통</text><line x1="290" y1="68" x2="340" y2="68" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="6"/><text x="252" y="73">어깨</text><line x1="290" y1="100" x2="340" y2="100" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="6"/><text x="252" y="105">발</text><text x="252" y="142">A = 0°</text><text x="252" y="162">(비틀림 없음)</text><text x="14" y="486" font-weight="700">RWL = 23 kg × HM × VM × DM × AM × FM × CM</text><text x="14" y="510">FM = CM = 1.0 가정 → RWL ≈ 11.9 kg</text><text x="14" y="538" font-size="14" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">LI = 15 ÷ 11.9 ≈ 1.26</text><text x="14" y="560" style="fill:var(--si-rose-s,#c97b7b)">LI &gt; 1: 위험이 커진다는 신호(선별용)</text></svg>
