<svg class="si si-illus" viewBox="0 0 360 540" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="확증편향: 웨이슨 선택 과제의 카드 4장" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="22" text-anchor="middle" font-weight="700">웨이슨 선택 과제: 어느 카드를 뒤집을까</text><path d="M24,40 H336 Q344,40 344,48 V88 Q344,96 336,96 H190 L180,112 L170,96 H24 Q16,96 16,88 V48 Q16,40 24,40 Z" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="180" y="62" text-anchor="middle" font-weight="700">규칙: 카드 한쪽 면이 모음이면</text><text x="180" y="86" text-anchor="middle" font-weight="700">반대쪽 면은 짝수다</text><rect x="19" y="126" width="70" height="84" rx="8" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.4" opacity="1"/><text x="54" y="180" text-anchor="middle" font-size="36" font-weight="700">E</text><rect x="103" y="126" width="70" height="84" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.4" opacity="0.5"/><text x="138" y="180" text-anchor="middle" font-size="36" font-weight="700" style="fill:var(--si-general,#5c6b7f)">K</text><rect x="187" y="126" width="70" height="84" rx="8" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.4" opacity="1"/><text x="222" y="180" text-anchor="middle" font-size="36" font-weight="700">4</text><rect x="271" y="126" width="70" height="84" rx="8" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.4" opacity="1"/><text x="306" y="180" text-anchor="middle" font-size="36" font-weight="700">7</text><text x="14" y="242" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">흔한 선택</text><circle cx="54" cy="270" r="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.4"/><text x="54" y="276" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">●</text><circle cx="222" cy="270" r="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.4"/><text x="222" y="276" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">●</text><text x="14" y="322" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">논리적 선택</text><circle cx="54" cy="350" r="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.4"/><polyline points="48,350 53,356 62,343" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.8"/><circle cx="306" cy="350" r="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.4"/><polyline points="300,350 305,356 314,343" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.8"/><text x="138" y="276" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">무관</text><text x="14" y="398" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">4: 뒤집어 확인만 한다(긍정 검증)</text><text x="14" y="422" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">7: 뒷면이 모음이면 규칙을 반증한다</text><text x="14" y="446" style="fill:var(--si-general,#5c6b7f)">K: 규칙과 무관하다</text><rect x="14" y="466" width="332" height="52" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="180" y="488" text-anchor="middle" font-weight="700">신념을 반박할 카드(7)보다</text><text x="180" y="510" text-anchor="middle" font-weight="700">확인해 줄 카드(4)를 찾는다</text></svg>
