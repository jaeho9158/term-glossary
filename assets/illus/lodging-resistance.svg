<svg class="si si-illus" viewBox="0 0 560 432" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lodging-resistance-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="lodging-resistance-t">내도복성: 줄기 높이와 이삭 무게가 만드는 휨모멘트</title><defs><marker id="lodging-resistance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="lodging-resistance-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker></defs><line x1="40" y1="300" x2="520" y2="300" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="150" y="34" text-anchor="middle" font-size="12" font-weight="700">일반 품종</text><line x1="150" y1="300" x2="150" y2="140" style="stroke:currentColor;fill:none" stroke-width="3"/><ellipse cx="150" cy="126" rx="9" ry="16" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.3"/><line x1="178" y1="126" x2="178" y2="162" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8" marker-end="url(#lodging-resistance-ar)"/><text x="206" y="142" text-anchor="middle" font-size="12" style="fill:var(--si-accent,#2454ff)">40 g</text><line x1="106" y1="300" x2="106" y2="140" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.8" marker-end="url(#lodging-resistance-ar-1)"/><line x1="106" y1="140" x2="106" y2="300" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.8" marker-end="url(#lodging-resistance-ar-1)"/><text x="80" y="220" text-anchor="middle" font-size="12">80 cm</text><circle cx="150" cy="300" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><text x="150" y="320" text-anchor="middle" font-size="11">기부 꺾임점</text><text x="150" y="340" text-anchor="middle" font-size="12">휨모멘트 80 × 40 = 3,200 g·cm</text><text x="150" y="361" text-anchor="middle" font-size="12" font-weight="700">도복지수 80</text><text x="400" y="34" text-anchor="middle" font-size="12" font-weight="700">반왜성 품종</text><line x1="400" y1="300" x2="400" y2="170" style="stroke:currentColor;fill:none" stroke-width="3"/><ellipse cx="400" cy="156" rx="9" ry="16" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.3"/><line x1="428" y1="156" x2="428" y2="192" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8" marker-end="url(#lodging-resistance-ar)"/><text x="456" y="172" text-anchor="middle" font-size="12" style="fill:var(--si-accent,#2454ff)">38 g</text><line x1="356" y1="300" x2="356" y2="170" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.8" marker-end="url(#lodging-resistance-ar-1)"/><line x1="356" y1="170" x2="356" y2="300" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.8" marker-end="url(#lodging-resistance-ar-1)"/><text x="330" y="235" text-anchor="middle" font-size="12">65 cm</text><circle cx="400" cy="300" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><text x="400" y="320" text-anchor="middle" font-size="11">기부 꺾임점</text><text x="400" y="340" text-anchor="middle" font-size="12">휨모멘트 65 × 38 = 2,470 g·cm</text><text x="400" y="361" text-anchor="middle" font-size="12" font-weight="700">도복지수 61.8</text><text x="280" y="392" text-anchor="middle" font-size="11.5">휨모멘트 = 기부~이삭 높이 × 위쪽 생체중,  도복지수 = 휨모멘트 ÷ 꺾임 모멘트 × 100</text><text x="280" y="414" text-anchor="middle" font-size="11" style="fill:var(--si-general,#5c6b7f)">꺾임 모멘트 4,000 g·cm로 가정</text></svg>
