<svg class="si si-illus" viewBox="0 0 600 360" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="anti-reflection-coating-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="anti-reflection-coating-t">단층 반사 방지 코팅의 광 경로</title><desc>유리 위에 얇은 코팅층을 입히고, 코팅 윗면과 아랫면에서 반사된 두 빛이 반 파장 어긋나 서로 상쇄되는 경로를 그린 단면 모식도</desc><defs><marker id="anti-reflection-coating-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="anti-reflection-coating-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="40" y="150" width="420" height="50" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.18"/><rect x="40" y="200" width="420" height="90" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.18"/><line x1="90" y1="40" x2="180" y2="150" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#anti-reflection-coating-ar)"/><line x1="180" y1="150" x2="270" y2="40" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#anti-reflection-coating-ar-1)"/><line x1="180" y1="150" x2="214" y2="200" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><line x1="214" y1="200" x2="248" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#anti-reflection-coating-ar-1)"/><line x1="248" y1="150" x2="338" y2="40" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#anti-reflection-coating-ar-1)"/><line x1="214" y1="200" x2="244" y2="290" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#anti-reflection-coating-ar)"/><text x="90" y="30" text-anchor="middle" font-size="12">입사광</text><text x="270" y="30" text-anchor="middle" font-size="12">반사광 1</text><text x="350" y="30" text-anchor="middle" font-size="12">반사광 2</text><text x="500" y="100" font-size="12">공기 n<tspan dy="0.278em" font-size="72%">0</tspan></text><text x="500" y="180" font-size="12">코팅 n<tspan dy="0.278em" font-size="72%">1</tspan></text><line x1="496" y1="176" x2="462" y2="176" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="250" font-size="12">유리 n<tspan dy="0.278em" font-size="72%">S</tspan></text><line x1="496" y1="246" x2="462" y2="246" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="310" y="250" text-anchor="middle" font-size="12">투과광</text><line x1="290" y1="250" x2="236" y2="262" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><line x1="30" y1="150" x2="30" y2="200" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="24" y="180" text-anchor="end" font-size="12">d</text><g class="si-rich" font-size="12" ><text x="232.6" y="330">d = </text><text x="265.7" y="324.2" text-anchor="middle" font-size="9.6">λ<tspan dy="0.278em" font-size="72%">0</tspan></text><line x1="256.1" y1="326.2" x2="275.3" y2="326.2" style="stroke:currentColor" stroke-width="0.8"/><text x="265.7" y="334.4" text-anchor="middle" font-size="9.6">4n<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="276.8" y="330">,   n<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> = √(n</tspan><tspan dy="0.278em" font-size="72%">0</tspan><tspan dy="-0.2em">n</tspan><tspan dy="0.278em" font-size="72%">S</tspan><tspan dy="-0.2em">)</tspan></text></g></svg>
