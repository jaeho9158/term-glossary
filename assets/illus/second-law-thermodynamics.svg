<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="second-law-thermodynamics-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="second-law-thermodynamics-t">두 열원 사이의 열기관과 카르노 효율</title><defs><marker id="second-law-thermodynamics-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="150" y="30" width="220" height="54" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.25"/><text x="260" y="52" text-anchor="middle" font-size="14">고온 열원</text><text x="260" y="75" text-anchor="middle">T<tspan baseline-shift="sub" font-size="72%">H</tspan> = 800 K</text><circle cx="260" cy="160" r="38" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.8" fill-opacity="0.22"/><text x="260" y="164" text-anchor="middle" font-size="14">열기관</text><rect x="150" y="236" width="220" height="54" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.25"/><text x="260" y="258" text-anchor="middle" font-size="14">저온 열원</text><text x="260" y="281" text-anchor="middle">T<tspan baseline-shift="sub" font-size="72%">C</tspan> = 300 K</text><line x1="260" y1="86" x2="260" y2="120" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#second-law-thermodynamics-ar)"/><text x="272" y="106" font-size="14">q<tspan baseline-shift="sub" font-size="72%">H</tspan></text><line x1="260" y1="200" x2="260" y2="234" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#second-law-thermodynamics-ar)"/><text x="272" y="218" font-size="14">q<tspan baseline-shift="sub" font-size="72%">C</tspan></text><line x1="300" y1="160" x2="400" y2="160" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#second-law-thermodynamics-ar)"/><text x="410" y="164" font-size="14" font-style="italic">W</text><text x="30" y="124" font-size="12">η<tspan baseline-shift="sub" font-size="72%">max</tspan> = 1 − T<tspan baseline-shift="sub" font-size="72%">C</tspan>/T<tspan baseline-shift="sub" font-size="72%">H</tspan></text><text x="30" y="146" font-size="12">= 1 − 300/800 = 62.5 %</text><text x="384" y="200" font-size="12">실제 효율 40 %</text><text x="384" y="221" font-size="12">→ 이론 한계의 약 64 %</text></svg>
