nt-weight="700" style="fill:var(--si-amber-s,#d79a2b)">입금</text><path d="M148 148 Q 199 66 250 138" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4"/><line x1="240" y1="132" x2="250" y2="142" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#accrued-revenue-ar-1)"/><text x="100" y="342" text-anchor="middle">수익 ○ · 현금 ×</text><text x="270" y="342" text-anchor="middle">현금 ○ · 수익 ×</text><text x="270" y="368" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(수익은 이미 인식)</text><text x="180" y="410" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">발생주의는 현금 수수와 무관하게 번 때 기록한다.</text></svg>
