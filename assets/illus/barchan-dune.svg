<svg class="si si-illus" viewBox="0 0 600 256" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="barchan-dune-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="barchan-dune-t">바르한 사구의 모양</title><desc>위에서 보면 초승달 모양이고 두 뿔이 바람이 불어 가는 쪽으로 뻗는다. 옆에서 보면 바람을 받는 쪽은 완만하고 반대쪽 슬립 페이스는 가파르다</desc><defs><marker id="barchan-dune-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="150" y="30" text-anchor="middle" font-size="12" font-weight="700">위에서 본 모양</text><polygon points="210,60 150,90 115,150 150,210 210,240 170,195 160,150 170,105" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><line x1="30" y1="150" x2="90" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#barchan-dune-ar)"/><text x="60" y="138" text-anchor="middle" font-size="11">바람</text><text x="240" y="70" font-size="11">뿔</text><line x1="236" y1="72" x2="214" y2="62" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="240" y="232" font-size="11">뿔</text><line x1="236" y1="230" x2="214" y2="238" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="240" y="152" font-size="11">슬립 페이스</text><line x1="236" y1="150" x2="163" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="450" y="30" text-anchor="middle" font-size="12" font-weight="700">옆에서 본 단면</text><polygon points="293.4,200 480,150 560,200" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><line x1="280" y1="200" x2="590" y2="200" style="stroke:currentColor;fill:none" stroke-width="1"/><line x1="330" y1="110" x2="390" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#barchan-dune-ar)"/><text x="360" y="98" text-anchor="middle" font-size="11">바람</text><text x="380" y="232" text-anchor="middle" font-size="11">바람받이 사면(약 15°)</text><line x1="395" y1="220" x2="420" y2="182" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="530" y="232" text-anchor="middle" font-size="11">슬립 페이스(약 30~35°)</text><line x1="525" y1="220" x2="500" y2="180" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
