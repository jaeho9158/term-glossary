<svg class="si si-illus" viewBox="0 0 600 410" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cyclone-collector-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cyclone-collector-t">사이클론 집진기의 흐름</title><desc>먼지 섞인 기체가 원통 옆으로 들어가 벽을 따라 소용돌이치며 내려가고, 무거운 입자는 벽에 부딪혀 아래로 떨어지며, 정화된 기체는 가운데로 올라가 위쪽 배출관으로 나간다</desc><defs><marker id="cyclone-collector-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="cyclone-collector-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="cyclone-collector-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><polygon points="180,90 340,90 340,200 278,330 242,330 180,200" style="stroke:currentColor;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="235" y="40" width="50" height="110" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><rect x="100" y="100" width="80" height="36" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><rect x="242" y="330" width="36" height="30" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><line x1="60" y1="118" x2="175" y2="118" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.2" marker-end="url(#cyclone-collector-ar)"/><text x="70" y="90" font-size="12">먼지 섞인 기체</text><path d="M205,165 C225.8,168.3 328.3,176.7 330,185 C331.7,193.3 218.3,205.8 215,215 C211.7,224.2 306.7,231.7 310,240 C313.3,248.3 238.3,256.7 235,265 C231.7,273.3 286.7,282.2 290,290 C293.3,297.8 260.8,308.3 255,312" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="255" y1="312" x2="262" y2="322" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#cyclone-collector-ar)"/><path d="M260,300 C260.3,288.3 262,253.3 262,230 C262,206.7 260.3,171.7 260,160" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2"/><line x1="260" y1="90" x2="260" y2="22" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2" marker-end="url(#cyclone-collector-ar-1)"/><text x="300" y="24" font-size="12">정화된 기체(상단 중앙 배출관)</text><circle cx="334" cy="175" r="3.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="318" cy="232" r="3.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="296" cy="280" r="3.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="360" y="230" font-size="12">무거운 입자는 바깥 벽에 부딪혀 떨어짐</text><line x1="260" y1="362" x2="260" y2="390" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#cyclone-collector-ar-2)"/><text x="290" y="384" font-size="12">먼지 배출(하단 포집부)</text><text x="140" y="185" text-anchor="middle" font-size="12">원통부</text><text x="180" y="280" text-anchor="middle" font-size="12">원뿔부</text></svg>
