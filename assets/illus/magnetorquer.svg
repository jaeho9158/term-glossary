<svg class="si si-illus" viewBox="0 0 560 370" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="magnetorquer-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="magnetorquer-t">자기토커: 자기모멘트 m, 지구 자기장 B, 토크 τ</title><defs><marker id="magnetorquer-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="magnetorquer-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker></defs><ellipse cx="230" cy="220" rx="52" ry="16" transform="rotate(30 230 220)" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2.2" fill-opacity="0.25"/><line x1="230" y1="220" x2="300" y2="99" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.8" marker-end="url(#magnetorquer-ar)"/><text x="316" y="105" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" style="fill:var(--si-accent,#2454ff)">m</text><line x1="230" y1="220" x2="480" y2="220" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.8" marker-end="url(#magnetorquer-ar-1)"/><text x="492" y="226" text-anchor="middle" font-size="15" font-weight="700" font-style="italic">B</text><text x="430" y="244" text-anchor="middle" font-size="11">지구 자기장</text><circle cx="410" cy="90" r="13" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="401" y1="81" x2="419" y2="99" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="419" y1="81" x2="401" y2="99" style="stroke:currentColor;fill:none" stroke-width="2.4"/><text x="436" y="96" font-size="15" font-weight="700" font-style="italic">τ</text><text x="410" y="126" text-anchor="middle" font-size="11">지면 안쪽(m × B 방향)</text><text x="90" y="190" text-anchor="middle" font-size="11">코일</text><line x1="112" y1="194" x2="182" y2="212" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.55"/><text x="90" y="211" text-anchor="middle" font-size="11" style="fill:var(--si-general,#5c6b7f)">N = 200</text><text x="90" y="230" text-anchor="middle" font-size="11" style="fill:var(--si-general,#5c6b7f)">A = 0.01 m²</text><text x="300" y="290" text-anchor="middle" font-size="12">B와 같은 방향 축을 도는 토크는 만들지 못한다</text><text x="300" y="311" text-anchor="middle" font-size="12">→ 한순간에는 3축 완전 제어가 안 된다</text><text x="280" y="346" text-anchor="middle" font-size="14">τ = m × B,  m = N I A</text></svg>
