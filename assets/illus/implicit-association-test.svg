<svg class="si si-illus" viewBox="0 0 360 544" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="implicit-association-test-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="implicit-association-test-t">암묵적 연합검사: 일치·불일치 블록의 반응 시간 차이와 D 점수</title><defs><marker id="implicit-association-test-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="90" y="22" text-anchor="middle" font-weight="700">일치 블록</text><rect x="10" y="30" width="160" height="96" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="20" y="52" font-weight="700">꽃</text><text x="20" y="70">좋음</text><text x="160" y="52" text-anchor="end" font-weight="700">곤충</text><text x="160" y="70" text-anchor="end">나쁨</text><text x="90" y="108" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">자극 단어</text><rect x="10" y="134" width="62" height="22" rx="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="41" y="150" text-anchor="middle">왼쪽 키</text><rect x="108" y="134" width="62" height="22" rx="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="139" y="150" text-anchor="middle">오른쪽 키</text><text x="270" y="22" text-anchor="middle" font-weight="700">불일치 블록</text><rect x="190" y="30" width="160" height="96" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="200" y="52" font-weight="700">꽃</text><text x="200" y="70">나쁨</text><text x="340" y="52" text-anchor="end" font-weight="700">곤충</text><text x="340" y="70" text-anchor="end">좋음</text><text x="270" y="108" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">자극 단어</text><rect x="190" y="134" width="62" height="22" rx="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="221" y="150" text-anchor="middle">왼쪽 키</text><rect x="288" y="134" width="62" height="22" rx="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="319" y="150" text-anchor="middle">오른쪽 키</text><text x="180" y="190" text-anchor="middle" font-weight="700">평균 반응 시간 (가상 예)</text><text x="62" y="213" text-anchor="end">일치</text><rect x="70" y="198" width="207" height="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="283" y="213">690 ms</text><text x="62" y="243" text-anchor="end">불일치</text><rect x="70" y="228" width="225" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="301" y="243">750 ms</text><line x1="277" y1="218" x2="277" y2="228" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="277" y1="248" x2="277" y2="258" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="295" y1="248" x2="295" y2="258" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="277" y1="258" x2="295" y2="258" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="295" y="280" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">차이 60 ms</text><text x="66" y="318" font-size="15" font-weight="700" font-style="italic">D</text><text x="80" y="318" font-size="15" font-weight="700">= (750 − 690) ÷ 108.0 ≈ 0.56</text><text x="180" y="340" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">108.0 ms: 두 블록 20시행 전체 표준편차</text><line x1="40" y1="398" x2="336" y2="398" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#implicit-association-test-ar)"/><line x1="94.4" y1="392" x2="94.4" y2="404" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="94.4" y="420" text-anchor="middle">0.15</text><text x="94.4" y="438" text-anchor="middle" font-weight="700">약함</text><line x1="166.9" y1="392" x2="166.9" y2="404" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="166.9" y="420" text-anchor="middle">0.35</text><text x="166.9" y="438" text-anchor="middle" font-weight="700">중간</text><line x1="275.6" y1="392" x2="275.6" y2="404" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="275.6" y="420" text-anchor="middle">0.65</text><text x="275.6" y="438" text-anchor="middle" font-weight="700">강함</text><circle cx="243" cy="398" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="243" y="376" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">0.56: 중간~강함 사이</text><text x="14" y="470">눈금 0.15·0.35·0.65는 관례이며 판정 기준이 아님</text><text x="14" y="489">10초 초과 시행 제외, 오답 시행에 벌점</text><text x="14" y="508">검사–재검사 신뢰도 약 0.60</text><text x="14" y="527">집단 수준 연구용, 개인 진단 아님</text></svg>
