<svg class="si si-illus" viewBox="0 0 520 340" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="azimuth-thruster-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="azimuth-thruster-t">방위각 추진기: L형, Z형, 전기식 포드</title><desc>선체 아래의 회전 기둥에 프로펠러가 달린 방위각 추진기를, 직각 기어 하나인 L형, 직각 기어 둘인 Z형, 포드 안에 전동기가 든 전기식으로 나란히 보인 단면 모식도</desc><defs></defs><rect x="10" y="0" width="500" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1" fill-opacity="0.2"/><text x="480" y="24" text-anchor="middle" font-size="12">선체</text><rect x="78" y="40" width="24" height="174" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.12"/><line x1="90" y1="10" x2="90" y2="200" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2"/><circle cx="90" cy="200" r="6" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><line x1="90" y1="200" x2="140" y2="200" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2"/><ellipse cx="146" cy="200" rx="5" ry="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.5"/><text x="24" y="110" font-size="12">입력축</text><line x1="24" y1="110" x2="88" y2="110" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="88" cy="110" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="142" y="100" font-size="12">회전 기둥</text><line x1="142" y1="100" x2="102" y2="90" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="102" cy="90" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="126" y="262" font-size="12">프로펠러</text><line x1="126" y1="262" x2="146" y2="224" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="146" cy="224" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="72" y="246" font-size="12">직각 기어</text><line x1="72" y1="246" x2="86" y2="205" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="86" cy="205" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="90" y="300" text-anchor="middle" font-size="12" font-weight="700">L형</text><text x="90" y="320" text-anchor="middle" font-size="12">직각 기어 1개</text><rect x="248" y="40" width="24" height="174" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.12"/><line x1="210" y1="20" x2="260" y2="20" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2"/><circle cx="260" cy="20" r="6" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><line x1="260" y1="20" x2="260" y2="200" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2"/><circle cx="260" cy="200" r="6" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><line x1="260" y1="200" x2="310" y2="200" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2"/><ellipse cx="316" cy="200" rx="5" ry="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.5"/><text x="260" y="300" text-anchor="middle" font-size="12" font-weight="700">Z형</text><text x="260" y="320" text-anchor="middle" font-size="12">직각 기어 2개</text><rect x="418" y="40" width="24" height="72" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.12"/><ellipse cx="430" cy="150" rx="48" ry="24" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.12"/><line x1="430" y1="10" x2="430" y2="112" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2"/><rect x="396" y="138" width="44" height="24" style="stroke:var(--si-navy,#12305c);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><text x="418" y="154" text-anchor="middle" font-size="11">전동기</text><line x1="440" y1="150" x2="478" y2="150" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2"/><ellipse cx="484" cy="150" rx="5" ry="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.5"/><text x="430" y="300" text-anchor="middle" font-size="12" font-weight="700">전기식 포드</text><text x="430" y="320" text-anchor="middle" font-size="12">전동기를 포드 안에 직결</text></svg>
