<svg class="si si-illus" viewBox="0 0 360 550" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="commotio-cordis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="commotio-cordis-t">심장진탕: 같은 충격도 T파 상승 구간에 맞을 때만 심실세동을 일으킨다</title><defs><marker id="commotio-cordis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="24" font-weight="700">A. 충격이 QRS 부근</text><rect x="92" y="90" width="26" height="86" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.22"/><rect x="216" y="90" width="26" height="86" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.22"/><polyline points="20,150 28,142 36,140 44,142 52,150 60,150 64,155 70,106 76,162 80,150 92,150 104,144 112,132 120,126 128,132 136,144 144,150 152,142 160,140 168,142 176,150 184,150 188,155 194,106 200,162 204,150 216,150 228,144 236,132 244,126 252,132 260,144 268,150" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="70" cy="44" r="9" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4"/><line x1="70" y1="54" x2="70" y2="98" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#commotio-cordis-ar)"/><text x="88" y="46" font-weight="700" style="fill:var(--si-pos,#14543c)">영향 없음</text><text x="190" y="46" style="fill:var(--si-general,#5c6b7f)">리듬 유지</text><text x="14" y="214" font-weight="700">B. 충격이 T파 상승 구간</text><rect x="92" y="276" width="26" height="86" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.22"/><polyline points="20,336 28,328 36,326 44,328 52,336 60,336 64,341 70,292 76,348 80,336 92,336 104,330 112,318 123,314 134,366 145,318 156,362 167,302 178,356 189,308 200,370 211,316 222,360 233,306 244,354 254,332 266,336 340,336" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="112" cy="238" r="9" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4"/><line x1="112" y1="250" x2="112" y2="274" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#commotio-cordis-ar)"/><text x="128" y="244" font-weight="700" style="fill:var(--si-limit,#7d2626)">심실세동 유발</text><text x="170" y="394" style="fill:var(--si-limit,#7d2626)">불규칙한 심실세동 파형</text><text x="268" y="324" font-weight="700">심정지</text><text x="14" y="378" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">재분극 취약기</text><text x="14" y="420" style="fill:var(--si-general,#5c6b7f)">붉은 띠는 T파 상승 구간이다.</text><text x="14" y="458" font-weight="700">구조적 손상 없음, 전기적 이상</text><text x="14" y="484">충격 속도 약 시속 64 km(40마일)에서</text><text x="14" y="504">세동 유발 가능성이 가장 높았다(실험)</text><text x="14" y="530" style="fill:var(--si-general,#5c6b7f)">3분 이내 제세동 시 생존율이 높다(등록자료)</text></svg>
