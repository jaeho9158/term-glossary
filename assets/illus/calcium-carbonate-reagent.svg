<svg class="si si-illus" viewBox="0 0 360 410" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calcium-carbonate-reagent-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="calcium-carbonate-reagent-t">탄산칼슘은 물에는 거의 안 녹고 산에서는 거품을 내며 녹는다</title><defs><marker id="calcium-carbonate-reagent-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">물엔 거의 안 녹고, 산에선 CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">를 내며 녹는다</tspan></text><path d="M29 121 V208 Q29 213 35 213 H151 Q157 213 157 208 V121 Z" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="0" fill-opacity="0.28"/><path d="M28 64 V208 Q28 214 34 214 H152 Q158 214 158 208 V64" style="stroke:currentColor;fill:none" stroke-width="2.2"/><path d="M203 121 V208 Q203 213 209 213 H325 Q331 213 331 208 V121 Z" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="0" fill-opacity="0.16"/><path d="M202 64 V208 Q202 214 208 214 H326 Q332 214 332 208 V64" style="stroke:currentColor;fill:none" stroke-width="2.2"/><text x="93" y="52" text-anchor="middle" font-weight="700">물</text><text x="267" y="52" text-anchor="middle" font-weight="700">염산(HCl)</text><polygon points="59,212 65.4,196.8 78.2,193.6 91,204.8 87.8,212" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><polygon points="92,212 97.2,198.9 107.6,196.3 118,205.4 115.4,212" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><polygon points="234,212 239.6,198.2 250.8,195.4 262,205.2 259.2,212" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><polygon points="272,212 276,201 284,199 292,206 290,212" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><circle cx="236" cy="170" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><circle cx="252" cy="148" r="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><circle cx="270" cy="122" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><circle cx="286" cy="150" r="3.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><circle cx="258" cy="102" r="3.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><circle cx="244" cy="128" r="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><line x1="262" y1="92" x2="262" y2="74" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#calcium-carbonate-reagent-ar)"/><text x="300" y="118" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">CO<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="93" y="242" text-anchor="middle">25℃ 용해도</text><text x="93" y="262" text-anchor="middle" font-weight="700">약 13 mg/L</text><text x="93" y="282" text-anchor="middle">(0.013 g/L)</text><text x="267" y="242" text-anchor="middle">기포(CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">)를 내며</tspan></text><text x="267" y="262" text-anchor="middle" font-weight="700">조각이 녹는다</text><text x="180" y="318" text-anchor="middle" font-weight="700">CaCO<tspan dy="0.217em" font-size="92%">3</tspan><tspan dy="-0.2em"> + 2HCl → CaCl</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> + H</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O + CO</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><text x="180" y="344" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">가 녹은 평형 물에서는 47 mg/L</tspan></text><text x="180" y="368" text-anchor="middle">가열하면 CaCO<tspan dy="0.217em" font-size="92%">3</tspan><tspan dy="-0.2em"> → 생석회(CaO) + CO</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><text x="180" y="392" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">몰질량 약 100.09 g/mol</text></svg>
