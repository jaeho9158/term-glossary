<svg class="si si-illus" viewBox="0 0 360 470" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원가하방경직성: 매출 증가와 감소 때 원가 반응의 비대칭" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="cost-stickiness-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="cost-stickiness-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="cost-stickiness-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="14" y="22" font-weight="700">매출 변화에 대한 원가 반응(모식)</text><line x1="14" y1="200" x2="346" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cost-stickiness-ar)"/><line x1="180" y1="330" x2="180" y2="44" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cost-stickiness-ar)"/><text x="346" y="246" text-anchor="end">매출 변화율(log)</text><text x="188" y="52">원가(판매관리비)</text><text x="188" y="72">변화율(log)</text><polygon points="180,200 40,320.4 40,260.2" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="0" fill-opacity="0.9"/><line x1="180" y1="200" x2="320" y2="79.6" style="stroke:currentColor;fill:none" stroke-width="2.8"/><line x1="180" y1="200" x2="40" y2="260.2" style="stroke:currentColor;fill:none" stroke-width="2.8"/><line x1="180" y1="200" x2="40" y2="320.4" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="80" y1="196" x2="80" y2="204" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="280" y1="196" x2="280" y2="204" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="80" y="190" text-anchor="middle">−1%</text><text x="280" y="222" text-anchor="middle">+1%</text><line x1="280" y1="200" x2="280" y2="114" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" marker-end="url(#cost-stickiness-ar-1)"/><line x1="80" y1="200" x2="80" y2="243" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#cost-stickiness-ar-2)"/><text x="288" y="146" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">증가폭</text><text x="14" y="236" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">감소폭</text><text x="172" y="314" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">덜 줄어든 원가</text><line x1="112" y1="302" x2="78" y2="268" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2"/><text x="14" y="358" style="fill:var(--si-general,#5c6b7f)">점선은 증가 때와 같은 비율로 줄어든다고 가정한 선(대칭)</text><text x="14" y="396" font-weight="700">매출이 줄 때 원가가 덜 줄어든다 → 원가하방경직성</text><text x="14" y="420">회귀의 상호작용항 계수가 음수이면 경직성이다</text><text x="14" y="450" style="fill:var(--si-general,#5c6b7f)">Anderson, Banker, Janakiraman(2003)</text></svg>
