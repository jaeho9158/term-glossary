<svg class="si si-illus" viewBox="0 0 360 756" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bisulfite-sequencing-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bisulfite-sequencing-t">바이설파이트 시퀀싱: C가 T로 바뀌어 읽히는 위치로 메틸화를 판정</title><defs><marker id="bisulfite-sequencing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="10" y="22" font-weight="700">가상 서열 5'→3' (모식)</text><rect x="73" y="63" width="26" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1" stroke-dasharray="3 3" fill-opacity="0.5"/><rect x="73" y="157" width="26" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1" stroke-dasharray="3 3" fill-opacity="0.5"/><rect x="73" y="251" width="26" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1" stroke-dasharray="3 3" fill-opacity="0.5"/><rect x="73" y="319" width="26" height="148" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1" stroke-dasharray="3 3" fill-opacity="0.5"/><text x="10" y="54">① 원본: CpG의 C 하나만 메틸화</text><text x="60" y="80" text-anchor="middle" font-weight="700">A</text><text x="86" y="80" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C</text><text x="112" y="80" text-anchor="middle" font-weight="700">G</text><text x="138" y="80" text-anchor="middle" font-weight="700">T</text><text x="164" y="80" text-anchor="middle" font-weight="700">T</text><text x="190" y="80" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">C</text><text x="216" y="80" text-anchor="middle" font-weight="700">G</text><text x="242" y="80" text-anchor="middle" font-weight="700">A</text><text x="268" y="80" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">C</text><text x="294" y="80" text-anchor="middle" font-weight="700">A</text><line x1="86" y1="86" x2="86" y2="91" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><text x="86" y="106" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">5mC</text><line x1="177" y1="94" x2="177" y2="128" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" marker-end="url(#bisulfite-sequencing-ar)"/><text x="187" y="114" style="fill:var(--si-violet-s,#9382bd)">아황산수소나트륨</text><text x="10" y="148">② 처리 후: 비메틸 C가 U로</text><text x="60" y="174" text-anchor="middle" font-weight="700">A</text><text x="86" y="174" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C</text><text x="112" y="174" text-anchor="middle" font-weight="700">G</text><text x="138" y="174" text-anchor="middle" font-weight="700">T</text><text x="164" y="174" text-anchor="middle" font-weight="700">T</text><text x="190" y="174" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">U</text><text x="216" y="174" text-anchor="middle" font-weight="700">G</text><text x="242" y="174" text-anchor="middle" font-weight="700">A</text><text x="268" y="174" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">U</text><text x="294" y="174" text-anchor="middle" font-weight="700">A</text><line x1="177" y1="188" x2="177" y2="222" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" marker-end="url(#bisulfite-sequencing-ar)"/><text x="187" y="210" style="fill:var(--si-violet-s,#9382bd)">PCR 증폭</text><text x="10" y="242">③ PCR 후: U가 T로 읽힘</text><text x="60" y="268" text-anchor="middle" font-weight="700">A</text><text x="86" y="268" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C</text><text x="112" y="268" text-anchor="middle" font-weight="700">G</text><text x="138" y="268" text-anchor="middle" font-weight="700">T</text><text x="164" y="268" text-anchor="middle" font-weight="700">T</text><text x="190" y="268" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">T</text><text x="216" y="268" text-anchor="middle" font-weight="700">G</text><text x="242" y="268" text-anchor="middle" font-weight="700">A</text><text x="268" y="268" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">T</text><text x="294" y="268" text-anchor="middle" font-weight="700">A</text><text x="10" y="312">④ 참조 서열(hg38)에 정렬</text><text x="10" y="336" style="fill:var(--si-general,#5c6b7f)">참조</text><text x="60" y="336" text-anchor="middle" font-weight="700">A</text><text x="86" y="336" text-anchor="middle" font-weight="700">C</text><text x="112" y="336" text-anchor="middle" font-weight="700">G</text><text x="138" y="336" text-anchor="middle" font-weight="700">T</text><text x="164" y="336" text-anchor="middle" font-weight="700">T</text><text x="190" y="336" text-anchor="middle" font-weight="700">C</text><text x="216" y="336" text-anchor="middle" font-weight="700">G</text><text x="242" y="336" text-anchor="middle" font-weight="700">A</text><text x="268" y="336" text-anchor="middle" font-weight="700">C</text><text x="294" y="336" text-anchor="middle" font-weight="700">A</text><rect x="47" y="352" width="260" height="15" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><rect x="75" y="353" width="22" height="13" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="86" y="364" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C</text><rect x="47" y="376" width="260" height="15" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><rect x="75" y="377" width="22" height="13" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="86" y="388" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C</text><rect x="47" y="400" width="260" height="15" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><rect x="75" y="401" width="22" height="13" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="86" y="412" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">T</text><rect x="47" y="424" width="260" height="15" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><rect x="75" y="425" width="22" height="13" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="86" y="436" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C</text><rect x="47" y="448" width="260" height="15" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><rect x="75" y="449" width="22" height="13" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="86" y="460" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C</text><text x="10" y="488" style="fill:var(--si-general,#5c6b7f)">읽기 5개만 그림(파란 띠: 관심 CpG의 C)</text><text x="10" y="514" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C로 읽힘 = 메틸화</text><text x="10" y="538" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">T로 읽힘 = 비메틸화</text><text x="10" y="568" font-weight="700">실제 예: C 38개, T 12개</text><text x="10" y="592">메틸화 비율 = 38 ÷ (38 + 12) = 76%</text><text x="10" y="624">보정: m = (p − e) ÷ (1 − e)</text><text x="10" y="648">p = 0.76, e = 0.003 → m ≈ 0.7593</text><text x="10" y="680" style="fill:var(--si-general,#5c6b7f)">변환율 대조: 5,000개 중 15개만 C</text><text x="10" y="704" style="fill:var(--si-general,#5c6b7f)">→ 변환율 99.7%</text><text x="10" y="736" style="fill:var(--si-rose-s,#c97b7b)">5mC와 5hmC는 이 방법으로 구분 못 함</text></svg>
