<svg class="si si-illus" viewBox="0 0 520 290" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="social-network-analysis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="social-network-analysis-t">다섯 행위자의 연결망(가상 예)</title><defs></defs><line x1="200" y1="112" x2="200" y2="90.5" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="310" y1="112" x2="310" y2="90.5" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="420" y1="150" x2="420" y2="163.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="184.3" y1="121.3" x2="125.7" y2="88.7" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="185" y1="140" x2="125" y2="180" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="218" y1="130" x2="292" y2="130" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="110" y1="98" x2="110" y2="172" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="328" y1="130" x2="402" y2="130" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="200" cy="130" r="18" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.35"/><text x="200" y="135" text-anchor="middle" font-size="15" font-weight="700">A</text><circle cx="110" cy="80" r="18" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.35"/><text x="110" y="85" text-anchor="middle" font-size="15" font-weight="700">B</text><circle cx="110" cy="190" r="18" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.35"/><text x="110" y="195" text-anchor="middle" font-size="15" font-weight="700">C</text><circle cx="310" cy="130" r="18" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.35"/><text x="310" y="135" text-anchor="middle" font-size="15" font-weight="700">D</text><circle cx="420" cy="130" r="18" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.35"/><text x="420" y="135" text-anchor="middle" font-size="15" font-weight="700">E</text><text x="200" y="84" text-anchor="middle" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">연결 3개: 중심</text><text x="310" y="84" text-anchor="middle" font-size="11" style="fill:var(--si-amber-s,#d79a2b)">A와 E를 잇는 다리</text><text x="420" y="176" text-anchor="middle" font-size="11">가장자리 한 명</text><text x="60" y="238" font-size="12">연결 5개, 가능한 연결 5명 × 4 ÷ 2 = 10 → 밀도 5/10 = 0.50</text><text x="60" y="262" font-size="12">연결중심성: A 3, B 2, C 2, D 2, E 1  (A는 3/4 = 0.75)</text></svg>
