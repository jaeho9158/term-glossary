<svg class="si si-illus" viewBox="0 0 360 460" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="충전 중인 축전기의 변위전류" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="displacement-current-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="displacement-current-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="12" y="22" font-weight="700">충전 중인 축전기 단면</text><line x1="20" y1="130" x2="156" y2="130" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="204" y1="130" x2="340" y2="130" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="40" y1="116" x2="84" y2="116" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4" marker-end="url(#displacement-current-ar)"/><text x="62" y="106" text-anchor="middle" font-weight="700" font-style="italic" style="fill:var(--si-amber-t,#7a5210)">I</text><line x1="276" y1="116" x2="320" y2="116" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4" marker-end="url(#displacement-current-ar)"/><rect x="156" y="78" width="8" height="104" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><rect x="196" y="78" width="8" height="104" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><line x1="168" y1="92" x2="192" y2="92" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.2" marker-end="url(#displacement-current-ar-1)"/><line x1="168" y1="112" x2="192" y2="112" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.2" marker-end="url(#displacement-current-ar-1)"/><line x1="168" y1="130" x2="192" y2="130" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.2" marker-end="url(#displacement-current-ar-1)"/><line x1="168" y1="148" x2="192" y2="148" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.2" marker-end="url(#displacement-current-ar-1)"/><line x1="168" y1="168" x2="192" y2="168" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.2" marker-end="url(#displacement-current-ar-1)"/><text x="180" y="64" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">전기장 커지는 중</text><ellipse cx="112" cy="130" rx="12" ry="44" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="6 3"/><ellipse cx="112" cy="130" rx="12" ry="44" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="0" fill-opacity="0.5"/><path d="M112 86 C 150 62, 186 66, 184 130 C 186 194, 150 198, 112 174" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" stroke-dasharray="5 3"/><text x="100" y="196" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">면 1</text><text x="160" y="214" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">면 2</text><text x="298" y="106" text-anchor="middle" font-weight="700" font-style="italic" style="fill:var(--si-amber-t,#7a5210)">I</text><text x="12" y="242" style="fill:var(--si-blue-t,#12305c)">점선 타원: 같은 경계(자기장 고리)</text><text x="12" y="262" style="fill:var(--si-blue-t,#12305c)">면 1(타원 안쪽): 도선 통과,</text><text x="12" y="282" style="fill:var(--si-blue-t,#12305c)">전도전류 I가 지남</text><text x="12" y="308" style="fill:var(--si-violet-t,#3f2f6b)">면 2(보라 점선): 판 사이로 부풀림,</text><text x="12" y="328" style="fill:var(--si-violet-t,#3f2f6b)">전하 이동 없이 전기선속만 변함</text><line x1="12" y1="346" x2="348" y2="346" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="12" y="372" font-weight="700">변위전류 = 전기선속의 변화율에</text><text x="12" y="392" font-weight="700">비례하는 항(자기장을 만듦)</text><text x="12" y="420" style="fill:var(--si-general,#5c6b7f)">어느 면을 잡아도 같은 결과 → 모순 해소</text><text x="12" y="440" style="fill:var(--si-general,#5c6b7f)">이 항 덕분에 전자기파의 존재가 예측됨</text></svg>
