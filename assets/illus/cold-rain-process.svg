<svg class="si si-illus" viewBox="0 0 360 556" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cold-rain-process-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cold-rain-process-t">차가운 비 과정: 어는점 이하 구름에서 빙정이 자라 낙하·융해해 비가 되는 과정</title><defs><marker id="cold-rain-process-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="cold-rain-process-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><clipPath id="cold-rain-process-clip0"><circle cx="118" cy="146" r="54"/></clipPath></defs><text x="20" y="26" font-weight="700">차가운 비 과정: 빙정 성장 → 낙하 → 융해</text><text x="20" y="46" style="fill:var(--si-general,#5c6b7f)">(구름의 수직 단면, 모식)</text><rect x="34" y="262" width="316" height="258" style="stroke:none;fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6" opacity="0.18"/><rect x="34" y="64" width="316" height="182" rx="38" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" opacity="0.8"/><rect x="34" y="250" width="316" height="12" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" opacity="0.9"/><line x1="34" y1="256" x2="350" y2="256" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="22" y1="520" x2="22" y2="72" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#cold-rain-process-ar)"/><text x="16" y="64" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">고도</text><text x="46" y="86" font-weight="700">어는점 이하 구름</text><text x="46" y="286" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">0℃ 경계</text><text x