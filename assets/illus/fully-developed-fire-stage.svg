-ar-3)"/><line x1="100" y1="500" x2="100" y2="548" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4" marker-end="url(#fully-developed-fire-stage-ar-3)"/><line x1="144" y1="500" x2="144" y2="548" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4" marker-end="url(#fully-developed-fire-stage-ar-3)"/><text x="20" y="596" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">바닥 입사 열유속 ≈ 20 kW/m²</text><text x="20" y="640">환기인자 A√H = 3.0 × √1.5 ≈ 3.67 m<tspan dy="-0.435em" font-size="92%">5/2</tspan></text><text x="20" y="666" style="fill:var(--si-rose-t,#7d2626)">R ≈ 0.09 A√H ≈ 0.33 kg/s</text><text x="20" y="692" font-weight="700">열방출률 ≈ 5.6 MW (목재, 연소열 17 MJ/kg 가정)</text><text x="20" y="730" style="fill:var(--si-general,#5c6b7f)">ISO 834: T = 20 + 345 log₁₀(8t + 1)</text><text x="20" y="752">(표준 가열곡선이며 실제 화재 온도가 아님)</text></svg>
