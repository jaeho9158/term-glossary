<svg class="si si-illus" viewBox="0 0 360 336" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="accelerated-life-testing-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="accelerated-life-testing-t">가속수명시험: 높은 스트레스 결과를 정상 사용 조건으로 외삽</title><defs><marker id="accelerated-life-testing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700">스트레스-수명 관계와 외삽</text><line x1="60" y1="270" x2="345" y2="270" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#accelerated-life-testing-ar)"/><line x1="60" y1="270" x2="60" y2="46" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#accelerated-life-testing-ar)"/><text x="66" y="54" style="fill:var(--si-general,#5c6b7f)">수명(로그)</text><text x="345" y="318" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">스트레스(온도) 높음</text><line x1="90" y1="76" x2="308" y2="226" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6" stroke-dasharray="6 4"/><line x1="250" y1="193" x2="308" y2="226" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6"/><line x1="90" y1="76" x2="90" y2="270" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 4"/><circle cx="90" cy="76" r="6" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1.6"/><text x="104" y="80" font-weight="700" style="fill:var(--si-limit,#7d2626)">추정 수명</text><text x="90" y="296" text-anchor="middle">정상 사용 조건</text><line x1="300" y1="220" x2="300" y2="270" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 4"/><circle cx="262" cy="198" r="5" style="stroke:var(--si-blue-s,#7f