<svg class="si si-illus" viewBox="0 0 360 490" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clinical-equipoise-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="clinical-equipoise-t">임상적 평형: 사전에 정한 중단 경계</title><defs><marker id="clinical-equipoise-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">중간분석에서 평형이 깨지는 순간</text><polyline points="100,70 120,74 140,78 160,82 180,86 200,90 220,94 240,98 260,102 280,106 300,110 300,192 280,196 260,200 240,204 220,208 200,212 180,216 160,220 140,224 120,228 100,232" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="0" fill-opacity="0.5"/><polyline points="100,70 120,74 140,78 160,82 180,86 200,90 220,94 240,98 260,102 280,106 300,110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><polyline points="100,232 120,228 140,224 160,220 180,216 200,212 220,208 240,204 260,200 280,196 300,192" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6"/><line x1="50" y1="262" x2="50" y2="50" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="50" y1="250" x2="335" y2="250" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#clinical-equipoise-ar)"/><text x="54" y="46" style="fill:var(--si-general,#5c6b7f)">신약 우세 ↑</text><text x="190" y="300" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">누적 정보량 (중간분석 시점)</text><line x1="100" y1="250" x2="100" y2="256" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="100" y="276" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1차</text><line x1="160" y1="250" x2="160" y2="256" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="160" 