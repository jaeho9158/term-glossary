  <script>
    (function () {
      const raw = new URLSearchParams(location.search).get("cat");
      // 병합·분할로 없어진 옛 코드가 URL에 남아 있을 수 있어 별칭을 먼저 확인한다.
      const alias = raw && window.CATEGORY_ALIASES ? window.CATEGORY_ALIASES[raw] : null;
      const code = raw && window.CATEGORY_LABELS && window.CATEGORY_LABELS[raw]
        ? raw
        : (alias && alias.length === 1 ? alias[0] : null);
      const label = code && window.CATEGORY_LABELS ? window.CATEGORY_LABELS[code] : null;
      if (label) {
        const desc = window.CATEGORY_DESCRIPTIONS ? window.CATEGORY_DESCRIPTIONS[code] : null;
        document.title = `${label} 용어 목록 - 논문용어사전`;
        document.getElementById("category-page-title").textContent = label;
        document.getElementById("category-page-heading").textContent = `${label} 용어`;
        document.getElementById("category-page-subtitle").textContent = desc || `${label} 분야의 논문 학술용어를 모아봅니다.`;
      }
    })();
  </script>
