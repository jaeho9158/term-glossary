<svg class="si si-illus" viewBox="0 0 360 362" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전기화학적 부식: 철판 위 물방울의 양극·음극과 전자·이온 경로" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="corrosion-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="corrosion-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="corrosion-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><polygon points="20,166 150,166 158,182 202,182 210,166 340,166 340,256 20,256" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><path d="M60 166 Q60 56 180 56 Q300 56 300 166 L210 166 L202 182 L158 182 L150 166 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="0" fill-opacity="0.55"/><path d="M60 166 Q60 56 180 56 Q300 56 300 166" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><text x="180" y="78" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">물방울(전해질)</text><text x="230" y="20" text-anchor="middle">공기 중 O<tspan dy="0.217em" font-size="92%">2</tspan></text><line x1="250" y1="30" x2="270" y2="66" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#corrosion-ar)"/><text x="30" y="216" style="fill:var(--si-general,#5c6b7f)">철(Fe) 판</text><text x="180" y="204" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">양극</text><text x="262" y="204" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">음극</text><ellipse cx="180" cy="182" rx="30" ry="5" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><ellipse cx="262" cy="166" rx="34" ry="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><text x="150" y="152" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">Fe<tspan dy="-0.435em" font-size="92%">2+</tspan></text><line x1="168" y1="144" x2="196" y2="118" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#corrosion-ar-1)"/><text x="280" y="152" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">OH<tspan dy="-0.435em" font-size="92%">-</tspan></text><line x1="262" y1="138" x2="234" y2="114" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#corrosion-ar)"/><ellipse cx="214" cy="106" rx="20" ry="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="214" y="130" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">녹</text><line x1="196" y1="224" x2="250" y2="224" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.2" marker-end="url(#corrosion-ar-2)"/><text x="224" y="246" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">e<tspan dy="-0.435em" font-size="92%">-</tspan><tspan dy="0.4em"> (금속 속)</tspan></text><text x="20" y="288" style="fill:var(--si-rose-t,#7d2626)">양극: Fe → Fe<tspan dy="-0.435em" font-size="92%">2+</tspan><tspan dy="0.4em"> + 2e</tspan><tspan dy="-0.435em" font-size="92%">-</tspan></text><text x="20" y="312" style="fill:var(--si-blue-t,#12305c)">음극: O<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> + 2H</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O + 4e</tspan><tspan dy="-0.435em" font-size="92%">-</tspan><tspan dy="0.4em"> → 4OH</tspan><tspan dy="-0.435em" font-size="92%">-</tspan></text><text x="20" y="340" style="fill:var(--si-general,#5c6b7f)">전자는 금속 속, 이