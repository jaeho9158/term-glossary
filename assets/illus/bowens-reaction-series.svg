<svg class="si si-illus" viewBox="0 0 360 546" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bowens-reaction-series-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bowens-reaction-series-t">보웬의 반응계열: 두 계열이 나란히 진행되다 합류한다</title><defs><marker id="bowens-reaction-series-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="bowens-reaction-series-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="bowens-reaction-series-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker><linearGradient id="bowens-reaction-series-g0" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" style="stop-color:var(--si-rose-f,#fbe4e4)"/><stop offset="1" style="stop-color:var(--si-blue-f,#dde5f0)"/></linearGradient></defs><text x="10" y="22" font-size="14" font-weight="700">마그마가 식을 때 광물이 굳는 순서</text><line x1="22" y1="70" x2="22" y2="400" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#bowens-reaction-series-ar)"/><text x="10" y="48" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">고온</text><text x="10" y="424" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">저온</text><text x="32" y="240" style="fill:var(--si-general,#5c6b7f)">냉각</text><text x="32" y="260" style="fill:var(--si-general,#5c6b7f)">방향</text><text x="60" y="54" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">불연속 계열</text><polygon points="72,70 150,70 150,116 72,116" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="111" y="98" text-anchor="middle" font-weight="700">감람석</text><line x1="111" y1="116" x2="119" y2="140" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#bowens-reaction-series-ar-1)"/><line x1="150" y1="93" x2="195" y2="93" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="2 4"/><polygon points="80,140 158,140 158,186 80,186" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="119" y="168" text-anchor="middle" font-weight="700">휘석</text><line x1="119" y1="186" x2="127" y2="210" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#bowens-reaction-series-ar-1)"/><line x1="158" y1="163" x2="195" y2="163" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="2 4"/><polygon points="88,210 166,210 166,256 88,256" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="127" y="238" text-anchor="middle" font-weight="700">각섬석</text><line x1="127" y1="256" x2="135" y2="280" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#bowens-reaction-series-ar-1)"/><line x1="166" y1="233" x2="195" y2="233" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="2 4"/><polygon points="96,280 174,280 174,326 96,326" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="135" y="308" text-anchor="middle" font-weight="700">흑운모</text><line x1="174" y1="303" x2="195" y2="303" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="2 4"/><text x="168" y="54" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">연속 계열</text><rect x="196" y="70" width="34" height="250" rx="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:url(#bowens-reaction-series-g0)" stroke-width="2"/><text x="213" y="200" text-anchor="middle" font-weight="700">사</text><text x="213" y="220" text-anchor="middle" font-weight="700">장</text><text x="213" y="240" text-anchor="middle" font-weight="700">석</text><text x="240" y="92" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">칼슘 많은</text><text x="240" y="112" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">조성</text><text x="240" y="296" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">나트륨 많은</text><text x="240" y="316" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">조성</text><line x1="213" y1="320" x2="190" y2="348" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#bowens-reaction-series-ar)"/><line x1="159" y1="316" x2="150" y2="348" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#bowens-reaction-series-ar)"/><polygon points="72,350 260,350 260,400 72,400" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="166" y="368" text-anchor="middle" font-weight="700">정장석·백운모·석영</text><text x="166" y="390" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(마지막 정출)</text><line x1="336" y1="92" x2="336" y2="396" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.6" marker-end="url(#bowens-reaction-series-ar-2)"/><text x="352" y="38" text-anchor="end" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">잔류 용융체</text><text x="352" y="58" text-anchor="end" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">현무암질</text><text x="352" y="420" text-anchor="end" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">규장질</text><text x="10" y="450">결정이 용융체와 분리되면 반응이 멈추고</text><text x="10" y="470">잔류 용융체 조성이 규장질로 이동 → 분별결정작용</text><text x="10" y="506" style="fill:var(--si-general,#5c6b7f)">같은 높이의 광물은 같은 온도대에서 함께 굳는다.</text><text x="10" y="530" font-weight="700">건조한 현무암질 마그마에 대한 이상화 모형</text></svg>
