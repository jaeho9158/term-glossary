<svg class="si si-illus" viewBox="0 0 360 416" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="difference-in-differences-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="difference-in-differences-t">이중차분법: 처치집단과 반사실의 차이</title><defs><marker id="difference-in-differences-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="110" y1="20" x2="110" y2="208" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4"/><line x1="220" y1="20" x2="220" y2="208" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4"/><line x1="100" y1="208" x2="250" y2="208" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="110" y="230" text-anchor="middle">처치 전</text><text x="220" y="230" text-anchor="middle">처치 후</text><text x="14" y="24" style="fill:var(--si-general,#5c6b7f)">결과 Y</text><polyline points="110,160 220,100" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><polyline points="110,180 220,120" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3"/><polyline points="110,160 220,40" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.2"/><circle cx="110" cy="160" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1"/><circle cx="220" cy="40" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1"/><circle cx="110" cy="180" r="4.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1"/><circle cx="220" cy="120" r="4.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1"/><circle cx="220" cy="100" r