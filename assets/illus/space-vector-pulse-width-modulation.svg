<svg class="si si-illus" viewBox="0 0 520 430" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="space-vector-pulse-width-modulation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="space-vector-pulse-width-modulation-t">공간벡터 PWM의 육각형, 섹터와 기준벡터</title><defs><marker id="space-vector-pulse-width-modulation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="338" y1="100" x2="370" y2="100" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><polygon points="260,150 380,150 320,46.1" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2" fill-opacity="0.12"/><polygon points="380,150 320,46.1 200,46.1 140,150 200,253.9 320,253.9" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.06"/><line x1="260" y1="150" x2="380" y2="150" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.55"/><line x1="260" y1="150" x2="320" y2="46.1" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.55"/><line x1="260" y1="150" x2="200" y2="46.1" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.55"/><line x1="260" y1="150" x2="140" y2="150" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.55"/><line x1="260" y1="150" x2="200" y2="253.9" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.55"/><line x1="260" y1="150" x2="320" y2="253.9" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.55"/><circle cx="260" cy="150" r="103.9" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><circle cx="380" cy="150" r="3.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="397" y="154" text-anchor="middle" font-size="12">V<tspan dy="0.278em" font-size="72%">1</tspan></text><circle cx="320" cy="46.1" r="3.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="328.5" y="35.4" text-anchor="middle" font-size="12">V<tspan dy="0.278em" font-size="72%">2</tspan></text><circle cx="200" cy="46.1" r="3.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="191.5" y="35.4" text-anchor="middle" font-size="12">V<tspan dy="0.278em" font-size="72%">3</tspan></text><circle cx="140" cy="150" r="3.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="123" y="154" text-anchor="middle" font-size="12">V<tspan dy="0.278em" font-size="72%">4</tspan></text><circle cx="200" cy="253.9" r="3.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="191.5" y="272.6" text-anchor="middle" font-size="12">V<tspan dy="0.278em" font-size="72%">5</tspan></text><circle cx="320" cy="253.9" r="3.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="328.5" y="272.6" text-anchor="middle" font-size="12">V<tspan dy="0.278em" font-size="72%">6</tspan></text><circle cx="260" cy="150" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="226" y="174" text-anchor="middle" font-size="11">V<tspan dy="0.278em" font-size="72%">0</tspan><tspan dy="-0.2em">, V</tspan><tspan dy="0.278em" font-size="72%">7</tspan></text><line x1="260" y1="150" x2="344.6" y2="119.2" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#space-vector-pulse-width-modulation-ar)"/><text x="322" y="112" text-anchor="end" style="fill:var(--si-rose-s,#c97b7b)">V<tspan dy="0.278em" font-size="72%">ref</tspan></text><path d="M306,150 A46,46 0 0 0 303.2,134.3" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="318" y="144" font-size="12">θ</text><text x="372" y="102" font-size="11" style="fill:var(--si-rose-s,#c97b7b)">섹터 I</text><text x="30" y="300" font-size="11">섹터 I: V<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em">과 V</tspan><tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> 사이 60° 구간, θ는 V</tspan><tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em">에서 잰 각</tspan></text><text x="30" y="320" font-size="11">T<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> = √3 T</tspan><tspan dy="0.278em" font-size="72%">s</tspan><tspan dy="-0.2em"> (|V</tspan><tspan dy="0.278em" font-size="72%">ref</tspan><tspan dy="-0.2em">|/V</tspan><tspan dy="0.278em" font-size="72%">dc</tspan><tspan dy="-0.2em">) sin(60° − θ),  T</tspan><tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> = √3 T</tspan><tspan dy="0.278em" font-size="72%">s</tspan><tspan dy="-0.2em"> (|V</tspan><tspan dy="0.278em" font-size="72%">ref</tspan><tspan dy="-0.2em">|/V</tspan><tspan dy="0.278em" font-size="72%">dc</tspan><tspan dy="-0.2em">) sin θ</tspan></text><text x="30" y="344" font-size="11">T<tspan dy="0.278em" font-size="72%">0</tspan><tspan dy="-0.2em"> = T</tspan><tspan dy="0.278em" font-size="72%">s</tspan><tspan dy="-0.2em"> − T</tspan><tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> − T</tspan><tspan dy="0.278em" font-size="72%">2</tspan></text><text x="30" y="364" font-size="11">가상 예: V<tspan dy="0.278em" font-size="72%">dc</tspan><tspan dy="-0.2em"> = 600 V, |V</tspan><tspan dy="0.278em" font-size="72%">ref</tspan><tspan dy="-0.2em">| = 300 V, θ = 20°, T</tspan><tspan dy="0.278em" font-size="72%">s</tspan><tspan dy="-0.2em"> = 100 μs</tspan></text><text x="30" y="392" font-size="11">→ T<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> ≈ 55.7 μs, T</tspan><tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> ≈ 29.6 μs, T</tspan><tspan dy="0.278em" font-size="72%">0</tspan><tspan dy="-0.2em"> ≈ 14.7 μs</tspan></text><g class="si-rich" font-size="11"  style="fill:var(--si-violet-s,#9382bd)"><text x="30" y="414">점선 원(선형 변조 범위)의 반지름 </text><text x="213.2" y="408.7" text-anchor="middle" font-size="8.8">V<tspan dy="0.278em" font-size="72%">dc</tspan></text><line x1="204.6" y1="410.5" x2="221.8" y2="410.5" style="stroke:var(--si-violet-s,#9382bd)" stroke-width="0.8"/><text x="213.2" y="418" text-anchor="middle" font-size="8.8">√3</text><text x="223.3" y="414"> ≈ 346 V</text></g></svg>
