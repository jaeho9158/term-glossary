2" y="430" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">원소 황·황산</text><text x="10" y="296" font-weight="700">촉매층(해칭) 반응</text><text x="10" y="318">C–S 절단 → H₂S</text><text x="10" y="338">N → NH₃</text><text x="10" y="358">불포화 → 포화</text><text x="10" y="264" style="fill:var(--si-general,#5c6b7f)">촉매: CoMo·NiMo/알루미나</text><line x1="10" y1="452" x2="350" y2="452" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="10" y="476" font-weight="700">제거율 = (원료 − 제품) ÷ 원료</text><text x="10" y="498">1.0 wt%(10,000 ppm) → 10 ppm : 99.90 %</text><text x="10" y="518">500 ppm → 10 ppm : 98.0 %</text><text x="10" y="544" style="fill:var(--si-rose-s,#c97b7b)">분홍 선: 황이 H₂S를 거쳐 원소 황이 되는 경로</text></svg>
