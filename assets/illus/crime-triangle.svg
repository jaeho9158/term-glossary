<svg class="si si-illus" viewBox="0 0 360 608" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="범죄 삼각형: 안쪽 세 요소와 바깥 통제자" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><polygon points="180,44 35.4,294.5 324.6,294.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.35"/><line x1="180" y1="44" x2="35.4" y2="294.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><line x1="180" y1="124.4" x2="105" y2="254.3" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><line x1="180" y1="44" x2="324.6" y2="294.5" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3.4"/><line x1="180" y1="124.4" x2="255" y2="254.3" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3.4"/><line x1="35.4" y1="294.5" x2="324.6" y2="294.5" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="105" y1="254.3" x2="255" y2="254.3" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><polygon points="180,124.4 105,254.3 255,254.3" style="stroke:none;fill:var(--si-bg,#ffffff)" stroke-width="0" fill-opacity="1"/><line x1="180" y1="124.4" x2="105" y2="254.3" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><line x1="180" y1="124.4" x2="255" y2="254.3" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3.4"/><line x1="105" y1="254.3" x2="255" y2="254.3" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><circle cx="180" cy="211" r="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2" fill-opacity="0.25"/><text x="180" y="216" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">문제</text><text x="103.1" y="222.3" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">가해자</text><text x="256.9" y="222.3" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">대상</text><text x="180" y="279.4" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">장소</text><text x="88" y="150" text-anchor="end" style="fill:var(--si-blue-t,#12305c)">핸들러</text><text x="88" y="170" text-anchor="end" style="fill:var(--si-blue-t,#12305c)">(감독자)</text><text x="262" y="168" style="fill:var(--si-green-t,#14543c)">보호자</text><text x="180" y="322.5" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">관리인</text><text x="180" y="352" text-anchor="middle" font-weight="700">같은 색 변끼리 짝이다</text><text x="180" y="374" text-anchor="middle">가해자–핸들러, 대상–보호자, 장소–관리인</text><text x="180" y="414" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">감시자는 경찰이 아니어도 된다.</text><text x="180" y="434" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">이웃·동료·문지기처럼 존재만으로 억제한다</text><line x1="48" y1="470" x2="20" y2="518" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="48" y1="470" x2="76" y2="518" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><line x1="20" y1="518" x2="36" y2="518" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><line x1="60" y1="518" x2="76" y2="518" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><text x="100" y="484">세 요소가 같은 시간·공간에서 겹치면</text><text x="100" y="504">범죄가 발생하고, 한 변이라도</text><text x="100" y="524">끊기면 예방할 수 있다</text><text x="180" y="572" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">일상활동이론: 코언·펠슨(1979)</text><text x="180" y="592" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1947~1974년 미국 범죄율 변화를 설명</text></svg>
