<svg class="si si-illus" viewBox="0 0 360 532" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="downward-arrow-technique-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="downward-arrow-technique-t">하향 화살표 기법: 답을 다시 질문하며 핵심신념까지 내려가기</title><defs><marker id="downward-arrow-technique-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="downward-arrow-technique-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><linearGradient id="downward-arrow-technique-g0" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" style="stop-color:var(--si-bg,#ffffff)"/><stop offset="1" style="stop-color:var(--si-violet-s,#9382bd)"/></linearGradient></defs><rect x="0" y="8" width="360" height="516" style="stroke:none;fill:url(#downward-arrow-technique-g0)" stroke-width="1.6" fill-opacity="0.28"/><text x="350" y="36" text-anchor="end" font-weight="700" style="fill:var(--si-general,#5c6b7f)">표면</text><text x="350" y="462" text-anchor="end" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">깊은 층</text><rect x="40" y="20" width="130" height="28" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.5"/><text x="105" y="39" text-anchor="middle" font-weight="700">불편감 상황</text><line x1="105" y1="48" x2="105" y2="84" style="stroke:currentColor;fill:none" stroke-width="2.6" marker-end="url(#downward-arrow-technique-ar)"/><rect x="40" y="84" width="130" height="36" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.5"/><text x="105" y="107" text-anchor="middle" font-weight="700">자동적 사고</text><line x1="105" y1="120" x2="105" y2="160" style="stroke:currentColor;fill:none" stroke-width="2.6" marker-end="url(#downward-arrow-technique-ar)"/><text x="120" y="146">그게 사실이라면 어떤 의미인가?</text><rect x="40" y="160" width="130" height="32" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.5"/><text x="105" y="181" text-anchor="middle" font-weight="700">답 1</text><line x1="105" y1="192" x2="105" y2="232" style="stroke:currentColor;fill:none" stroke-width="2.6" marker-end="url(#downward-arrow-technique-ar)"/><text x="120" y="218">가장 고통스러운 부분은 무엇인가?</text><rect x="40" y="232" width="130" height="32" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.5"/><text x="105" y="253" text-anchor="middle" font-weight="700">답 2</text><path d="M40,248 C4,248 4,176 38,176" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#downward-arrow-technique-ar-1)"/><text x="6" y="284" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">새 출발점</text><line x1="105" y1="264" x2="105" y2="322" style="stroke:currentColor;fill:none" stroke-width="2.6" marker-end="url(#downward-arrow-technique-ar)"/><line x1="10" y1="322" x2="350" y2="322" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><text x="120" y="346" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">멈춤 신호: 같은 말이 반복됨</text><text x="120" y="368" style="fill:var(--si-general,#5c6b7f)">자기·타인·세상에 대한 절대적 문장</text><line x1="105" y1="322" x2="105" y2="392" style="stroke:currentColor;fill:none" stroke-width="2.6" marker-end="url(#downward-arrow-technique-ar)"/><rect x="40" y="392" width="130" height="40" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="3.6"/><text x="105" y="417" text-anchor="middle" font-weight="700">핵심신념</text><line x1="105" y1="432" x2="105" y2="478" style="stroke:currentColor;fill:none" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#downward-arr