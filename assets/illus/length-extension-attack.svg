roke-width="1.8"/><text x="192" y="150" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">블록 처리</text><line x1="88" y1="145" x2="160" y2="145" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#length-extension-attack-ar)"/><text x="124" y="137" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">체이닝 값</text><line x1="224" y1="145" x2="288" y2="145" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#length-extension-attack-ar)"/><rect x="288" y="126" width="60" height="38" style="stroke:var(--si-limit,#7d2626);fill:var(--si-rose-f,#fbe4e4)" stroke-width="3"/><text x="318" y="150" text-anchor="middle" font-size="15" font-weight="700">H</text><text x="350" y="118" text-anchor="end" font-weight="700" style="fill:var(--si-limit,#7d2626)">출력 = 내부 상태</text><line x1="318" y1="164" x2="318" y2="214" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2.6"/><line x1="318" y1="214" x2="56" y2="214" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2.6"/><line x1="56" y1="214" x2="56" y2="252" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2.6" marker-end="url(#length-extension-attack-ar-1)"/><text x="187" y="206" text-anchor="middle" font-weight="700">H를 체이닝 값으로 재사용</text><text x="350" y="240" text-anchor="end" font-weight="700">공격자 계산</text><rect x="28" y="252" width="56" height="38" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2"/><text x="56" y="276" text-anchor="middle" font-size="15" font-weight="700">H</text><rect x="160" y="252" width="64" height="38" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><text x="192" y="276" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">블록 처리</text><line x1="84" y1="271" x2="160" y2="271" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#length-extension-attack-ar)"/><rect x="136" y="318" width="112" height="30" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="192" y="338" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">덧붙일 데이터</text><line x1="192" y1="318" x2="192" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#length-extension-attack-ar)"/><line x1="224" y1="271" x2="288" y2="271" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#length-extension-attack-ar)"/><rect x="288" y="252" width="60" height="38" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.4"/><text x="318" y="276" text-anchor="middle" font-size="15" font-weight="700">H′</text><text x="318" y="312" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">검증 통과</text><text x="14" y="376">H′ : 비밀||메시지||패딩||</text><text x="14" y="396">덧붙일 데이터의 해시(원본 길이만 알면 됨)</text><rect x="11" y="416" width="160" height="96" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="91" y="438" text-anchor="middle" font-weight="700">MD5·SHA-1·SHA-2</text><text x="91" y="458" text-anchor="middle">(Merkle-Damgård)</text><text x="91" y="478" text-anchor="middle">상태 전체 노출</text><text x="91" y="498" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">→ 취약</text><rect x="186" y="416" width="160" height="96" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="266" y="438" text-anchor="middle" font-weight="700">SHA-3(스펀지)</text><text x="266" y="458" text-anchor="middle">상태 일부만 출력</text><text x="266" y="478" text-anchor="middle">HMAC: 이중 해시</text><text x="266" y="498" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">→ 확장 불가</text></svg>
