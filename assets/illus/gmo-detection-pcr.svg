,402 C324.7,400 336.3,400.3 340,400" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.8"/><text x="292" y="392" text-anchor="middle">양성 시료</text><text x="300" y="472" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">음성</text><text x="16" y="566">양성 시료</text><line x1="88" y1="562" x2="170" y2="562" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#gmo-detection-pcr-ar-1)"/><text x="178" y="567" font-weight="700">이벤트 특이적 검사</text><text x="16" y="604" style="fill:var(--si-general,#5c6b7f)">35S 프로모터: 콜리플라워모자이크바이러스 유래</text><text x="16" y="624" style="fill:var(--si-general,#5c6b7f)">NOS 터미네이터: 아그로박테리움 유래</text></svg>
