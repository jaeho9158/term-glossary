<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="smalian-formula-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="smalian-formula-t">통나무의 양 끝 단면과 스말리안식</title><defs></defs><polygon points="70,94 410,112 410,188 70,206" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.2"/><ellipse cx="70" cy="150" rx="14" ry="56" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.35"/><ellipse cx="410" cy="150" rx="10" ry="38" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.35"/><ellipse cx="240" cy="150" rx="12" ry="47" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="70" y="80" text-anchor="middle" font-size="12">원구 단면적 A<tspan baseline-shift="sub" font-size="72%">b</tspan></text><text x="410" y="98" text-anchor="middle" font-size="12">말구 단면적 A<tspan baseline-shift="sub" font-size="72%">t</tspan></text><text x="240" y="85" text-anchor="middle" font-size="11" style="fill:var(--si-violet-s,#9382bd)">중앙 단면(후버식)</text><line x1="70" y1="234" x2="410" y2="234" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="70" y1="228" x2="70" y2="240" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="410" y1="228" x2="410" y2="240" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="240" y="254" text-anchor="middle" font-size="12">길이 L</text><text x="260" y="28" text-anchor="middle" font-size="14">V = (A<tspan baseline-shift="sub" font-size="72%">b</tspan> + A<tspan baseline-shift="sub" font-size="72%">t</tspan>) / 2 × L</text><text x="260" y="292" text-anchor="middle" font-size="11">원뿔대(30→20 cm, 6 m): 스말리안식 +2.63 %, 후버식 −1.32 %, 뉴턴식 0 %</text></svg>
