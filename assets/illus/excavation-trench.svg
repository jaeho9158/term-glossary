<svg class="si si-illus" viewBox="0 0 360 676" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="발굴트렌치: 평면 배치와 벽면 단면" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="20" text-anchor="middle" font-weight="700">조사구역을 위에서 본 평면도</text><rect x="20" y="34" width="320" height="206" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="2" fill-opacity="0.35"/><rect x="55" y="52" width="18" height="144" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="64" y="224" text-anchor="middle" font-weight="700">T1</text><rect x="125" y="52" width="18" height="144" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="134" y="224" text-anchor="middle" font-weight="700">T2</text><rect x="195" y="52" width="18" height="144" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="204" y="224" text-anchor="middle" font-weight="700">T3</text><rect x="265" y="52" width="18" height="144" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="274" y="224" text-anchor="middle" font-weight="700">T4</text><rect x="112" y="90" width="46" height="62" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent-soft,#eef4ff)" stroke-width="1.6" stroke-dasharray="5 3" fill-opacity="0.5"/><circle cx="134" cy="121" r="14" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="4 3"/><text x="240" y="112" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">발굴둑</text><rect x="20" y="258" width="18" height="14" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2"/><text x="46" y="270">트렌치 (좁고 긴 구덩이, T1~T4)</text><circle cx="29" cy="292" r="8" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="4 3"/><text x="46" y="297">유구(일부)가 걸쳐 보임</text><rect x="20" y="312" width="18" height="14" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent-soft,#eef4ff)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.5"/><text x="46" y="324">유구 확인 시 확장한 구역</text><text x="20" y="350" style="fill:var(--si-general,#5c6b7f)">유구가 없는 트렌치는 구간 종료</text><text x="180" y="392" text-anchor="middle" font-weight="700">트렌치 한쪽 벽면을 정면에서 본 단면</text><rect x="20" y="404" width="320" height="20" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2" fill-opacity="0.6"/><polygon points="20,424 340,424 340,460 230,474 120,448 20,458" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><polygon points="20,458 120,448 230,474 340,460 340,510 230,530 120,502 20,512" style="stroke:currentColor;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><polygon points="20,512 120,502 230,530 340,510 340,554 20,554" style="stroke:currentColor;fill:var(--si-green-f,#e3f1ea)" stroke-width="1.2"/><text x="28" y="419" font-weight="700">표토 (제거)</text><text x="28" y="444" font-weight="700">층 1</text><text x="28" y="502" font-weight="700">층 2</text><text x="28" y="540" font-weight="700">층 3</text><polyline points="20,458 120,448 230,474 340,460" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.4"/><line x1="20" y1="480" x2="340" y2="480" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" stroke-dasharray="6 4"/><line x1="20" y1="575" x2="48" y2="575" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.4"/><text x="56" y="580">층위를 따라 굴착한 바닥</text><line x1="20" y1="597" x2="48" y2="597" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" stroke-dasharray="6 4"/><text x="56" y="602">일정 깊이로 굴착한 바닥</text><text x="20" y="632" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">층위를 무시하면 층의 선후 관계가 사라짐</text><text x="20" y="656">벽면 단면을 도면·사진으로 기록한다</text></svg>
