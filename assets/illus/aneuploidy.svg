<svg class="si si-illus" viewBox="0 0 360 612" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aneuploidy-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="aneuploidy-t">염색체 수 이상: 비분리에서 삼염색체성·단염색체성까지</title><defs><marker id="aneuploidy-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="24" font-size="14" font-weight="700">염색체 수 이상: 하나 많거나 적다</text><rect x="50" y="42" width="260" height="34" rx="6" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.5"/><text x="180" y="64" text-anchor="middle" font-weight="700">감수분열 중 염색체 비분리</text><line x1="180" y1="78" x2="180" y2="94" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#aneuploidy-ar)"/><rect x="50" y="96" width="260" height="34" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.5"/><text x="180" y="118" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">생식세포의 염색체 수 이상</text><line x1="150" y1="132" x2="176" y2="164" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#aneuploidy-ar)"/><line x1="210" y1="132" x2="284" y2="164" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#aneuploidy-ar)"/><circle cx="70" cy="208" r="38" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="2"/><rect x="56" y="194" width="10" height="28" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="74" y="194" width="10" height="28" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="70" y="264" text-anchor="middle" font-weight="700">정상</text><text x="70" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">염색체 46개</text><circle cx="180" cy="208" r="38" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-bg,#ffffff)" stroke-width="2"/><rect x="157" y="194" width="10" height="28" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="175" y="194" width="10" height="28" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="193" y="194" width="10" height="28" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="180" y="264" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">삼염색체성</text><text x="180" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">하나 많음</text><text x="180" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">예: 다운증후군</text><circle cx="290" cy="208" r="38" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-bg,#ffffff)" stroke-width="2"/><rect x="285" y="194" width="10" height="28" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="290" y="264" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">단염색체성</text><text x="290" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">하나 없음</text><line x1="20" y1="326" x2="340" y2="326" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="350" font-weight="700">검사 방법</text><text x="20" y="374">핵형분석(karyotyping)</text><text x="20" y="394">형광동소보합법(FISH)</text><text x="20" y="414">착상 전 유전검사(PGT-A)</text><line x1="20" y1="434" x2="340" y2="434" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="458" font-weight="700">모자이시즘</text><circle cx="36" cy="484" r="11" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><circle cx="66" cy="484" r="11" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><circle cx="96" cy="484" r="11" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><circle cx="126" cy="484" r="11" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><circle cx="156" cy="484" r="11" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="20" y="520" style="fill:var(--si-general,#5c6b7f)">일부 세포에만 나타날 수 있어</text><text x="20" y="540" style="fill:var(--si-general,#5c6b7f)">검사한 세포 비율에 따라 증상 정도가 다를 수 있다.</text><text x="20" y="574" style="fill:var(--si-general,#5c6b7f)">염색체 수 이상은 대부분 발생 초기에 치명적이어서</text><text x="20" y="594" style="fill:var(--si-general,#5c6b7f)">유산으로 이어지는 경우가 많다.</text></svg>
