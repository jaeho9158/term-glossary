<svg class="si si-illus" viewBox="0 0 360 510" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comorbidity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="comorbidity-t">동반질환: 나이별 유병 비율과 찰슨 지수</title><defs><marker id="comorbidity-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">나이가 들수록 동반질환이 흔하다</text><line x1="48" y1="260" x2="48" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="48" y1="260" x2="43" y2="260" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="39" y="264.6" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="48" y1="212.5" x2="43" y2="212.5" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="39" y="217.1" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">25</text><line x1="48" y1="165" x2="43" y2="165" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="39" y="169.6" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">50</text><line x1="48" y1="117.5" x2="43" y2="117.5" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="39" y="122" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">75</text><line x1="48" y1="70" x2="43" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="39" y="74.5" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">100</text><text x="14" y="52" font-weight="700">유병 비율(%)</text><line x1="48" y1="260" x2="320" y2="260" style="stroke:currentColor;fill:none" stroke-width="1.8"/><rect x="60" y="241" width="36" height="19" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.3"/><text x="78" y="234" text-anchor="middle" font-weight="700">약 10%</text><text x="78" y="280" text-anchor="middle">19세</text><text x="78" y="304" text-anchor="middle">미만</text><rect x="102" y="108" width="36" height="152" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.85"/><text x="120" y="101" text-anchor="middle" font-weight="700">약 80%</text><text x="120" y="280" text-anchor="middle">80세</text><text x="120" y="304" text-anchor="middle">이상</text><rect x="178" y="128.9" width="36" height="131.1" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.3"/><text x="196" y="121.9" text-anchor="middle" font-weight="700">69%</text><text x="196" y="280" text-anchor="middle">젊은</text><text x="196" y="304" text-anchor="middle">성인</text><rect x="220" y="83.3" width="36" height="176.7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.6"/><text x="238" y="76.3" text-anchor="middle" font-weight="700">93%</text><text x="238" y="280" text-anchor="middle">중년</text><rect x="262" y="73.8" width="36" height="186.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.9"/><text x="280" y="66.8" text-anchor="middle" font-weight="700">98%</text><text x="280" y="280" text-anchor="middle">노인</text><text x="100" y="334" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">일반 인구</text><text x="240" y="334" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">가정의학 연구(Fortin)</text><line x1="58" y1="316" x2="140" y2="316" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.6"/><line x1="176" y1="316" x2="300" y2="316" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6"/><text x="14" y="366" font-weight="700">찰슨 동반질환 지수(CCI)</text><text x="14" y="388" style="fill:var(--si-general,#5c6b7f)">상태마다 가중치 1·2·3·6점 중 하나를 준다</text><rect x="14" y="402" width="48" height="36" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="38" y="426" text-anchor="middle" font-weight="700">1점</text><rect x="70" y="402" width="48" height="36" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="94" y="426" text-anchor="middle" font-weight="700">2점</text><rect x="126" y="402" width="48" height="36" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="150" y="426" text-anchor="middle" font-weight="700">3점</text><rect x="182" y="402" width="48" height="36" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="206" y="426" text-anchor="middle" font-weight="700">6점</text><line x1="240" y1="420" x2="262" y2="420" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#comorbidity-ar)"/><rect x="268" y="402" width="78" height="36" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="307" y="424" text-anchor="middle" font-weight="700">합 = CCI</text><text x="14" y="456" style="fill:var(--si-general,#5c6b7f)">있는 상태의 점수를 모두 더한다</text><text x="14" y="486" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">동반 여부만으로 인과관계를 단정할 수 없다</text></svg>
