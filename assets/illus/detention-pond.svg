" style="fill:var(--si-bg,#ffffff)">7</text></g><text x="42" y="423">하류 암거·수로</text><text x="10" y="462" font-weight="700" style="fill:var(--si-accent,#2454ff)">개구부 크기 = 하류 수용 용량 기준</text><rect x="10" y="486" width="108" height="30" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="64" y="506" text-anchor="middle" font-weight="700">① 저장</text><line x1="120" y1="501" x2="124" y2="501" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#detention-pond-ar-2)"/><rect x="126" y="486" width="108" height="30" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="180" y="506" text-anchor="middle" font-weight="700">② 서서히 방류</text><line x1="236" y1="501" x2="240" y2="501" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#detention-pond-ar-2)"/><rect x="242" y="486" width="108" height="30" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="296" y="506" text-anchor="middle" font-weight="700">③ 평상시 복귀</text><text x="10" y="24" style="fill:var(--si-general,#5c6b7f)">평상시: 물 없음(운동장·공원 겸용)</text></svg>
