<svg class="si si-illus" viewBox="0 0 580 372" style="max-width:580px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="total-internal-reflection-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="total-internal-reflection-t">전반사: 입사각에 따른 빛의 갈래</title><desc>물에서 공기로 가는 빛이 입사각이 임계각보다 작을 때는 굴절과 반사, 같을 때는 경계면을 따라 굴절, 클 때는 전부 반사되는 모습을 세 칸으로 나타낸 모식도</desc><defs><marker id="total-internal-reflection-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="total-internal-reflection-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="87" y1="227" x2="74" y2="253.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="139" y1="227" x2="145" y2="253.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="149" y1="123" x2="171" y2="118" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="20" font-size="12" font-weight="700">물에서 공기로 가는 빛(모식)</text><rect x="20" y="175" width="186" height="125" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.1"/><line x1="20" y1="175" x2="206" y2="175" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="113" y1="95" x2="113" y2="285" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="73" y1="244.3" x2="113" y2="175" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#total-internal-reflection-ar)"/><line x1="113" y1="175" x2="153" y2="244.3" style="stroke:var(--si-accent,#2454ff);