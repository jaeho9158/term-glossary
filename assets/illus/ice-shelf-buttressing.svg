:none" stroke-width="2.6" marker-end="url(#ice-shelf-buttressing-ar-1)"/><text x="204" y="252" font-weight="700" style="fill:var(--si-limit,#7d2626)">유속 2~8배</text><text x="96" y="322" style="fill:var(--si-limit,#7d2626)">접지선 후퇴</text><line x1="122" y1="334" x2="92" y2="334" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.8" marker-end="url(#ice-shelf-buttressing-ar-1)"/><text x="268" y="350">빙산 조각</text><text x="16" y="436">라르센 B(2002): 약 3,250 km²,</text><text x="16" y="458">두께 220 m, 3주 이내 붕괴</text><text x="16" y="484">스웨이츠 동부 빙붕은 빙하의 약 1/3 지지,</text><text x="16" y="506">제거 시 해수면 기여 최대 +25%</text><text x="16" y="536" font-weight="700" style="fill:var(--si-pos,#14543c)">빙붕 융해 자체 → 해수면 거의 불변 (이미 떠 있음)</text><text x="16" y="558" font-weight="700" style="fill:var(--si-limit,#7d2626)">빙하 가속 → 해수면 상승</text></svg>
