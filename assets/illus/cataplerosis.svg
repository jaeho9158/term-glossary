iddle">포도당신생합성</text><text x="260" y="346" text-anchor="middle">헴 합성</text><line x1="12" y1="190" x2="98" y2="190" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="4.5" marker-end="url(#cataplerosis-ar-3)"/><text x="8" y="222" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">보충대사반응</text><text x="180" y="392" text-anchor="middle" font-weight="700">유출 &gt; 보충이면 회로가 느려진다</text><text x="180" y="414" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">주황 화살표: 유출 · 초록 화살표: 보충</text></svg>
