<svg class="si si-illus" viewBox="0 0 360 526" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="발효: NAD⁺ 재생 순환과 산물, ATP 비교" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="fermentation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="fermentation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">발효: 산소 없이 NAD<tspan dy="-0.435em" font-size="92%">+</tspan><tspan dy="0.4em">를 되살려 해당과정을 잇는다</tspan></text><rect x="40" y="40" width="140" height="34" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="110" y="60" text-anchor="middle" font-weight="700">포도당 C<tspan dy="0.217em" font-size="92%">6</tspan><tspan dy="-0.2em">H</tspan><tspan dy="0.217em" font-size="92%">12</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">6</tspan></text><line x1="110" y1="74" x2="110" y2="96" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#fermentation-ar)"/><rect x="40" y="96" width="140" height="34" rx="5" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><text x="110" y="118" text-anchor="middle" font-weight="700">해당과정</text><line x1="110" y1="130" x2="110" y2="152" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#fermentation-ar)"/><rect x="40" y="152" width="140" height="34" rx="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="110" y="174" text-anchor="middle" font-weight="700">피루브산</text><text x="192" y="109" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">NAD<tspan dy="-0.435em" font-size="92%">+</tspan><tspan dy="0.4em"> → NADH</tspan></text><polyline points="180,175 268,175 268,126 184,126" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><line x1="196" y1="126" x2="182" y2="126" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4" marker-end="url(#fermentation-ar-1)"/><text x="278" y="142" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">NADH를</text><text x="278" y="162" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">NAD<tspan dy="-0.435em" font-size="92%">+</tspan><tspan dy="0.4em">로</tspan></text><text x="278" y="182" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">재생</text><line x1="80" y1="186" x2="60" y2="222" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#fermentation-ar)"/><line x1="140" y1="186" x2="190" y2="222" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#fermentation-ar)"/><rect x="10" y="224" width="110" height="50" rx="5" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="65" y="246" text-anchor="middle" font-weight="700">젖산</text><text x="65" y="266" text-anchor="middle">(근육)</text><rect x="130" y="224" width="220" height="50" rx="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="210" y="246" text-anchor="middle" font-weight="700">2 에탄올 + 2 CO<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="210" y="266" text-anchor="middle">(효모)</text><circle cx="318" cy="240" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><circle cx="330" cy="252" r="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><circle cx="322" cy="262" r="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><circle cx="338" cy="238" r="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><text x="14" y="312" font-size="14" font-weight="700">C<tspan dy="0.217em" font-size="92%">6</tspan><tspan dy="-0.2em">H</tspan><tspan dy="0.217em" font-size="92%">12</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">6</tspan><tspan dy="-0.2em"> → 2 C</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">H</tspan><tspan dy="0.217em" font-size="92%">5</tspan><tspan dy="-0.2em">OH + 2 CO</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><text x="14" y="338" style="fill:var(--si-general,#5c6b7f)">이론 수율 0.511 g 에탄올/g 포도당</text><text x="14" y="362" font-weight="500" style="fill:var(--si-general,#5c6b7f)">(180.16 → 2×46.07 g/mol)</text><text x="14" y="402" font-weight="700">포도당 1분자당 순 ATP</text><text x="10" y="430" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">발효</text><rect x="60" y="416" width="14" height="18" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="84" y="430" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">2</text><text x="10" y="466" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">호흡</text><rect x="60" y="452" width="210" height="18" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="270" y="452" width="14" height="18" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1" stroke-dasharray="3 2"/><text x="294" y="466" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">30~32</text><text x="14" y="506" font-weight="700">적은 ATP를 얻는 대신 해당과정이 계속 돈다</text></svg>
