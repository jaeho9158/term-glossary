<svg class="si si-illus" viewBox="0 0 360 780" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contact-angle-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="contact-angle-t">접촉각의 크기, Young 식, 거친 표면의 젖음</title><defs><marker id="contact-angle-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="contact-angle-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="contact-angle-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">접촉각: 방울이 표면과 이루는 각</text><rect x="8" y="128" width="104" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><path d="M20 128 A46.2 46.2 0 0 1 100 128 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><line x1="10" y1="145.3" x2="37" y2="98.6" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6"/><path d="M36 126 A16 16 0 0 0 28.7 114.6" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8"/><text x="48.2" y="121.7" text-anchor="middle" font-style="italic">θ</text><text x="60" y="166" text-anchor="middle">90° 미만</text><text x="60" y="184" text-anchor="middle" font-weight="700">친수성</text><rect x="128" y="128" width="104" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><path d="M154 128 A30 30 0 1 1 206 128 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><line x1="164" y1="145.3" x2="137" y2="98.6" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6"/><path d="M170 126 A16 16 0 0 0 146.7 113.7" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8"/><text x="163" y="106" text-anchor="middle" font-style="italic">θ</text><text x="180" y="166" text-anchor="middle">90° 초과</text><text x="180" y="184" text-anchor="middle" font-weight="700">소수성</text><rect x="248" y="128" width="104" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><path d="M286 128 A40.9 40.9 0 1 1 314 128 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><line x1="304.8" y1="134.8" x2="254.1" y2="116.4" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6"/><path d="M302 126 A16 16 0 0 0 271.3 121.7" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8"/><text x="285.2" y="102.5" text-anchor="middle" font-style="italic">θ</text><text x="300" y="166" text-anchor="middle">150° 초과</text><text x="300" y="184" text-anchor="middle" font-weight="700">초소수성</text><text x="180" y="212" text-anchor="middle">물 기준: 플루오린화 저에너지 표면 약 120°,</text><text x="180" y="230" text-anchor="middle">연잎 위 물방울 약 147°</text><line x1="16" y1="258" x2="344" y2="258" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="280" text-anchor="middle" font-size="14" font-weight="700">접촉각과 세 계면 에너지(Young 식)</text><rect x="20" y="392" width="320" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><path d="M128 392 A55.3 55.3 0 0 1 232 392 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><line x1="232" y1="390" x2="288" y2="390" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#contact-angle-ar)"/><line x1="232" y1="390" x2="192" y2="390" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.6" marker-end="url(#contact-angle-ar-1)"/><line x1="232" y1="390" x2="211.6" y2="333.6" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.6" marker-end="url(#contact-angle-ar-2)"/><path d="M210 390 A22 22 0 0 1 224.5 371.3" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8"/><text x="199" y="372" text-anchor="middle" font-style="italic">θ</text><text x="292" y="383" style="fill:var(--si-rose-t,#7d2626)">γ<tspan dy="0.217em" font-size="92%">SV</tspan></text><text x="184" y="430" text-anchor="middle">γ<tspan dy="0.217em" font-size="92%">SL</tspan></text><line x1="186" y1="416" x2="214" y2="391" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="214" cy="391" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="206" y="330" text-anchor="end" style="fill:var(--si-violet-t,#3f2f6b)">γ<tspan dy="0.217em" font-size="92%">LV</tspan></text><g class="si-rich" font-size="14"  font-weight="700"><text x="120.4" y="456">cos θ = </text><text x="208" y="449.3" text-anchor="middle" font-size="11.2">γ<tspan dy="0.217em" font-size="92%">SV</tspan><tspan dy="-0.2em"> − γ</tspan><tspan dy="0.217em" font-size="92%">SL</tspan></text><line x1="177.9" y1="451.5" x2="238.1" y2="451.5" style="stroke:currentColor" stroke-width="0.9"/><text x="208" y="461.2" text-anchor="middle" font-size="11.2">γ<tspan dy="0.217em" font-size="92%">LV</tspan></text></g><text x="180" y="484" text-anchor="middle">예: γ<tspan dy="0.217em" font-size="92%">SV</tspan><tspan dy="-0.2em"> = 30, γ</tspan><tspan dy="0.217em" font-size="92%">SL</tspan><tspan dy="-0.2em"> = 45, γ</tspan><tspan dy="0.217em" font-size="92%">LV</tspan><tspan dy="-0.2em"> = 72 mN/m(가상값)</tspan></text><text x="180" y="504" text-anchor="middle">cos θ = −15/72 ≈ −0.208, θ ≈ 102.0°</text><line x1="16" y1="524" x2="344" y2="524" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="546" text-anchor="middle" font-size="14" font-weight="700">거친 표면의 젖음</text><rect x="46" y="634" width="88" height="16" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="14" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="34" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="54" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="74" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="94" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="114" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="134" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="154" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="8" y="650" width="158" height="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><path d="M46 634 A46.3 46.3 0 1 1 134 634 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="88" y="678" text-anchor="middle" font-weight="700">Wenzel</text><rect x="206" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="226" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="246" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="266" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="286" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="306" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="326" y="634" width="12" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="200" y="650" width="138" height="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><path d="M253 634 A42 42 0 1 1 283 634 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="196" y="618">공기</text><line x1="224" y1="622" x2="262" y2="642" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="262" cy="642" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="268" y="678" text-anchor="middle" font-weight="700">Cassie–Baxter</text><text x="88" y="700" text-anchor="middle">홈을 액체가 채운다</text><text x="268" y="700" text-anchor="middle">아래에 공기가 남는다</text><text x="88" y="724" text-anchor="middle">cos θ* = r·cos θ</text><text x="268" y="724" text-anchor="middle">cos θ* = f·cos θ − (1 − f)</text><text x="100" y="746" text-anchor="middle">r = 1.5 → θ* ≈ 108.2°(가상값)</text><text x="268" y="746" text-anchor="middle">f = 0.1, θ = 110°</text><text x="268" y="764" text-anchor="middle">→ θ* ≈ 159.1°(가상값)</text></svg>
