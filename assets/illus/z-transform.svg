<svg class="si si-illus" viewBox="0 0 520 252" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="z-transform-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="z-transform-t">z 평면의 극점과 단위원</title><defs><marker id="z-transform-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="130" y="22" text-anchor="middle" font-size="12" font-weight="700">극점 0.5: X(z) = z/(z − 0.5)</text><line x1="30" y1="134" x2="235" y2="134" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#z-transform-ar)"/><line x1="130" y1="224" x2="130" y2="42" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#z-transform-ar)"/><text x="234" y="150" text-anchor="end" font-size="11" style="fill:var(--si-general,#5c6b7f)">실수부</text><text x="136" y="50" font-size="11" style="fill:var(--si-general,#5c6b7f)">허수부</text><circle cx="130" cy="134" r="70" style="stroke:currentColor;fill:none" stroke-width="1.8"/><circle cx="130" cy="134" r="35" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.8" stroke-dasharray="6 4"/><text x="180.4" y="82.2" font-size="11">단위원</text><text x="165" y="138" text-anchor="middle" font-size="18" style="fill:var(--si-green-t,#14543c)">×</text><text x="130" y="138" text-anchor="middle">○</text><text x="130" y="232" text-anchor="middle" font-size="12" style="fill:var(--si-green-t,#14543c)">극점이 단위원 안: 안정</text><text x="390" y="22" text-anchor="middle" font-size="12" font-weight="700">극점 1.2: X(z) = z/(z − 1.2)</text><line x1="290" y1="134" x2="495" y2="134" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#z-transform-ar)"/><line x1="390" y1="224" x2="390" y2="42" style="stroke