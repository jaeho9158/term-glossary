<svg class="si si-illus" viewBox="0 0 360 566" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grace-period-insurance-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="grace-period-insurance-t">납입최고기간: 보험료 납입기일 이후 보장과 해지·부활의 흐름</title><defs><marker id="grace-period-insurance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="20" y="24" font-size="14" font-weight="700">납입최고기간: 기일이 지나도 보장은 이어진다</text><rect x="24" y="136" width="180" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.4"/><rect x="204" y="136" width="132" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" stroke-dasharray="5 4" fill-opacity="0.18"/><line x1="24" y1="178" x2="336" y2="178" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#grace-period-insurance-ar)"/><text x="336" y="196" text-anchor="end">시간 →</text><line x1="24" y1="88" x2="24" y2="184" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="204" y1="88" x2="204" y2="184" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="32" y="78" font-weight="700">납입기일</text><text x="32" y="96">보험료 미납,</text><text x="32" y="114">최고(독촉)</text><text x="212" y="78" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">해지(실효)</text><text x="212" y="96">최고기간이 끝난</text><text x="212" y="114">다음 날</text><text x="114" y="155" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">납입최고기간</text><text x="270" y="155" text-anchor="middle" style="fill:var(--si-gray-t,#44546a)">부활 신청</text><text x="24" y="216">표준약관 14일 이상</text><text x="24" y="234">(보험기간 1년 미만 계약은 7일 이상)</text><path d="M43,237 L31,254.4 L39.4,254.4 L37,267 L49,249 L40.6,249Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="64" y="258" font-weight="700">납입최고기간 중 사고</text><rect x="24" y="280" width="312" height="82" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.14"/><text x="36" y="302">보장이 되고 미납 보험료를 보험금에서 뺀다</text><text x="36" y="321" font-weight="700">5,000만 원 − 미납 12만 원</text><text x="36" y="340" font-weight="700">= 49,880,000원 지급</text><rect x="24" y="380" width="312" height="82" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.14"/><text x="36" y="402">해지된 뒤에는 자동으로 유지되지 않는다</text><text x="36" y="421">부활절차를 거쳐야 다시 보장을 받는다</text><text x="36" y="440">부활 시 고지의무가 다시 생기고 거절될 수 있다</text><text x="20" y="494" style="fill:var(--si-gray-t,#44546a)">상법 제650조: 상당한 기간을 정해 최고한 뒤에도</text><text x="20" y="512" style="fill:var(--si-gray-t,#44546a)">지급하지 않으면 계약을 해지할 수 있다.</text><text x="20" y="530" style="fill:var(--si-gray-t,#44546a)">미국 생명보험 실무는 주법에 따라 대체로 30일 또는</text><text x="20" y="548" style="fill:var(--si-gray-t,#44546a)">31일이다(Black &amp; Skipper, 2000).</text></svg>
