<svg class="si si-illus" viewBox="0 0 360 640" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="economic-sanctions-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="economic-sanctions-t">경제제재의 효과 논쟁: 연구별 성공률 추정과 대상국 GDP 영향</title><defs><marker id="economic-sanctions-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700">같은 제재, 다른 평가:</text><text x="180" y="46" text-anchor="middle" font-size="14" font-weight="700">성공 정의에 따라 결론이 갈린다</text><text x="20" y="84" font-weight="700">① 제재 성공률 추정</text><text x="20" y="114">Hufbauer 외(2007)</text><rect x="20" y="122" width="102" height="18" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="130" y="136" font-size="14" font-weight="700">34%</text><text x="20" y="166">표적제재컨소시엄(TSC, 2016)</text><rect x="20" y="174" width="66" height="18" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="94" y="188" font-size="14" font-weight="700">22%</text><text x="20" y="218">Pape(1997)</text><rect x="20" y="226" width="12" height="18" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="40" y="240" font-size="14" font-weight="700">4%</text><text x="20" y="270" style="fill:var(--si-rose-t,#7d2626)">Pape: 성공으로 보고된 40건 중 5건만 효과적</text><line x1="20" y1="284" x2="320" y2="284" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="20" y1="284" x2="20" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="20" y="308">0%</text><line x1="170" y1="284" x2="170" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="170" y="308" text-anchor="middle">50%</text><line x1="320" y1="284" x2="320" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="320" y="308" text-anchor="end">100%</text><line x1="16" y1="324" x2="344" y2="324" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="20" y="350" font-weight="700">② 대상국 GDP 성장률 감소(연, %포인트)</text><text x="20" y="380">유엔 경제제재</text><rect x="135" y="388" width="60" height="18" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="203" y="402" font-size="14" font-weight="700">2.3~3.5</text><text x="20" y="432">포괄적 금수</text><rect x="270" y="440" width="50" height="18" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><line x1="322" y1="449" x2="342" y2="449" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#economic-sanctions-ar)"/><text x="262" y="454" text-anchor="end" font-size="14" font-weight="700">5 초과</text><text x="20" y="484">미국 독자 제재</text><rect x="45" y="492" width="20" height="18" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="73" y="506" font-size="14" font-weight="700">0.5~0.9</text><line x1="20" y1="526" x2="320" y2="526" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="20" y1="526" x2="20" y2="532" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="20" y="550">0</text><line x1="120" y1="526" x2="120" y2="532" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="120" y="550" text-anchor="middle">2</text><line x1="220" y1="526" x2="220" y2="532" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="220" y="550" text-anchor="middle">4</text><line x1="320" y1="526" x2="320" y2="532" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="320" y="550" text-anchor="end">6</text><text x="20" y="578" style="fill:var(--si-gray-t,#44546a)">영향 지속: 유엔 약 10년, 미국 독자 제재 평균 7년</text><text x="20" y="602" style="fill:var(--si-gray-t,#44546a)">GSDB(글로벌 제재 데이터베이스): 1950~2022년</text><text x="20" y="622" style="fill:var(--si-gray-t,#44546a)">1,325건 집계</text></svg>
