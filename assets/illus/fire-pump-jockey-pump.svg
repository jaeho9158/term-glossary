<svg class="si si-illus" viewBox="0 0 360 572" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="충압펌프: 압력 설정 간격에 따른 두 펌프의 역할 분담" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="fire-pump-jockey-pump-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">① 배관 압력의 시간 변화(가상 설정값)</text><line x1="44" y1="252" x2="236" y2="252" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#fire-pump-jockey-pump-ar)"/><line x1="44" y1="252" x2="44" y2="60" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#fire-pump-jockey-pump-ar)"/><text x="236" y="284" text-anchor="end">시간</text><text x="52" y="56">압력(bar)</text><line x1="44" y1="100" x2="240" y2="100" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="246" y="98" font-weight="700">8.0 bar</text><text x="246" y="120" style="fill:var(--si-general,#5c6b7f)">충압펌프 정지</text><line x1="44" y1="150" x2="240" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="246" y="148" font-weight="700">7.5 bar</text><text x="246" y="170" style="fill:var(--si-general,#5c6b7f)">충압펌프 기동</text><line x1="44" y1="200" x2="240" y2="200" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="246" y="198" font-weight="700">7.0 bar</text><text x="246" y="220" style="fill:var(--si-general,#5c6b7f)">주펌프 기동</text><polyline points="44,100 68,150 74,100 98,150 104,100 128,150 134,100 144,100" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="144,100 152,215 236,215" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><text x="140" y="66" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">화재</text><rect x="68" y="258" width="6" height="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><rect x="98" y="258" width="6" height="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><rect x="128" y="258" width="6" height="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><rect x="152" y="258" width="84" height="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><line x1="232" y1="150" x2="232" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#fire-pump-jockey-pump-ar)" marker-start="url(#fire-pump-jockey-pump-ar)"/><text x="228" y="173" text-anchor="end">기동</text><text x="228" y="193" text-anchor="end">압력차</text><line x1="232" y1="100" x2="232" y2="150" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#fire-pump-jockey-pump-ar)" marker-start="url(#fire-pump-jockey-pump-ar)"/><text x="228" y="123" text-anchor="end">기동·정지</text><text x="228" y="143" text-anchor="end">폭</text><rect x="44" y="292" width="14" height="12" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><text x="66" y="305">충압펌프 가동(작은 막대: 압력 회복 구간)</text><rect x="44" y="314" width="14" height="12" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="66" y="325">주펌프 기동(화재)</text><text x="14" y="368" font-weight="700">② 충압펌프가 도는 시간 비율</text><text x="14" y="394">누설 0.5 L/min ÷ 토출 20 L/min = 2.5 %</text><text x="14" y="424" font-weight="700">③ 충압펌프 용량</text><text x="14" y="450">주펌프 유량의 3 %로 잡는다는 설명이 있다</text><text x="14" y="480" font-weight="700">④ 압력 간격의 역할</text><text x="14" y="506">기동 압력 차이: 두 펌프가 간섭하지 않게 한다</text><text x="14" y="526">기동·정지 폭: 잦은 켜짐·꺼짐(단속 운전)을 막는다</text><text x="14" y="556" style="fill:var(--si-general,#5c6b7f)">설정 압력은 모두 개념 예시이다</text></svg>
