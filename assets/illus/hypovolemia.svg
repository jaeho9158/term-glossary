<svg class="si si-illus" viewBox="0 0 360 732" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hypovolemia-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="hypovolemia-t">저혈량증: 출혈 등급과 쇼크지수</title><defs><marker id="hypovolemia-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="hypovolemia-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">① 출혈량 등급(70 kg 성인)</text><text x="14" y="44" style="fill:var(--si-general,#5c6b7f)">혈액량 약 4,900 mL 중 손실</text><rect x="20" y="100" width="80" height="34" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" opacity="1"/><text x="60" y="123" text-anchor="middle" font-weight="700">I</text><rect x="100" y="100" width="80" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6" opacity="1"/><text x="140" y="123" text-anchor="middle" font-weight="700">II</text><rect x="180" y="100" width="53.3" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" opacity="1"/><text x="206.7" y="123" text-anchor="middle" font-weight="700">III</text><rect x="233.3" y="100" width="96.5" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" opacity="1"/><text x="281.6" y="123" text-anchor="middle" font-weight="700">IV</text><rect x="233.3" y="100" width="96.5" height="34" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="0" fill-opacity="0.25"/><line x1="332.9" y1="117" x2="346" y2="117" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#hypovolemia-ar)"/><line x1="100" y1="94" x2="100" y2="140" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="2 2"/><text x="100" y="88" text-anchor="middle" font-weight="700">15%</text><text x="100" y="160" text-anchor="middle">735</text><line x1="180" y1="94" x2="180" y2="140" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="2 2"/><text x="180" y="88" text-anchor="middle" font-weight="700">30%</text><text x="180" y="160" text-anchor="middle">1,470</text><line x1="233.3" y1="94" x2="233.3" y2="140" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="2 2"/><text x="233.3" y="88" text-anchor="middle" font-weight="700">40%</text><text x="233.3" y="160" text-anchor="middle">1,960</text><text x="20" y="88" text-anchor="middle">0</text><text x="20" y="160" text-anchor="middle">0</text><text x="346" y="160" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">mL</text><text x="14" y="190" style="fill:var(--si-general,#5c6b7f)">I &lt;15%(&lt;735 mL) · II 15~30%</text><text x="14" y="206" style="fill:var(--si-general,#5c6b7f)">III 30~40% · IV &gt;40%</text><line x1="20" y1="214" x2="330" y2="214" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#hypovolemia-ar-1)"/><text x="180" y="236" text-anchor="middle">손실이 쌓일수록 위험이 커진다</text><line x1="14" y1="256" x2="346" y2="256" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8" stroke-dasharray="3 3"/><text x="14" y="282" font-weight="700">② 쇼크지수 SI = 심박수 ÷ 수축기 혈압</text><rect x="60" y="450" width="286" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.2"/><rect x="60" y="324" width="286" height="84" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><line x1="60" y1="548" x2="60" y2="318" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#hypovolemia-ar-1)"/><line x1="55" y1="548" x2="60" y2="548" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="50" y="553" text-anchor="end">0</text><line x1="55" y1="478" x2="60" y2="478" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="50" y="483" text-anchor="end">0.5</text><line x1="55" y1="450" x2="60" y2="450" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="50" y="455" text-anchor="end">0.7</text><line x1="55" y1="408" x2="60" y2="408" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="50" y="413" text-anchor="end">1.0</text><line x1="55" y1="338" x2="60" y2="338" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="50" y="343" text-anchor="end">1.5</text><text x="70" y="469" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">정상 0.5~0.7</text><text x="70" y="364" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">1.0 이상: 이상 의심</text><circle cx="268" cy="462.6" r="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="280" y="467.6" font-weight="700">A 0.61</text><circle cx="268" cy="408" r="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="280" y="405" font-weight="700">B 1.00</text><circle cx="268" cy="339.4" r="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="280" y="344.4" font-weight="700">C 1.49</text><text x="14" y="574" style="fill:var(--si-general,#5c6b7f)">가상 환자(심박수÷수축기 혈압)</text><text x="14" y="594" style="fill:var(--si-general,#5c6b7f)">A 78÷128 · B 112÷112 · C 128÷86</text><text x="14" y="626" font-weight="700">A는 정상 범위, B는 경계, C는 뚜렷한 이상이다</text><text x="14" y="646" font-weight="700">정상 혈압이 저혈량을 배제하지 못한다</text><line x1="14" y1="664" x2="346" y2="664" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8" stroke-dasharray="3 3"/><text x="14" y="690">가역적 원인: 출혈 조절과</text><text x="14" y="710">수액·혈액 보충으로 신속히 교정</text></svg>
