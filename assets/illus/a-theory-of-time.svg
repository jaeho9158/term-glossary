<svg class="si si-illus" viewBox="0 0 360 494" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A이론의 세 갈래: 실재하는 시점과 현재의 특권" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="a-theory-of-time-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="a-theory-of-time-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="14" y="24" font-weight="700">A이론: 현재의 존재론적 특권</text><text x="60" y="56" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">과거</text><text x="180" y="56" text-anchor="middle" font-weight="700">지금</text><text x="300" y="56" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">미래</text><text x="14" y="96" font-weight="700">① 현재주의: 현재만 실재</text><line x1="30" y1="130" x2="168" y2="130" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/><line x1="192" y1="130" x2="330" y2="130" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/><circle cx="180" cy="130" r="9" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="180" y1="108" x2="180" y2="118" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="180" y1="142" x2="180" y2="152" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="14" y="186" font-weight="700">② 성장 블록: 과거+현재 실재</text><rect x="30" y="212" width="150" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.55"/><l