<svg class="si si-illus" viewBox="0 0 360 730" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="피브리노겐 검사: Clauss 검량선과 참고 범위" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="fibrinogen-test-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="fibrinogen-test-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="fibrinogen-test-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">피브리노겐 검사: 검량선과 참고 범위</text><text x="14" y="44" font-weight="700">① Clauss법: 검량선에서 농도 읽기</text><line x1="50" y1="270" x2="344" y2="270" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#fibrinogen-test-ar)"/><line x1="50" y1="270" x2="50" y2="64" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#fibrinogen-test-ar)"/><text x="58" y="76" font-weight="700">응고시간</text><path d="M66,96 C71.7,105 87.7,134 100,150 C112.3,166 123.3,179.3 140,192 C156.7,204.7 176.7,216.7 200,226 C223.3,235.3 258.3,243.3 280,248 C301.7,252.7 321.7,253 330,254" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><text x="140" y="108" font-weight="700">희석 혈장 + 고농도 트롬빈</text><text x="140" y="130">→ 응고시간을 측정</text><text x="200" y="206" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">기준 혈장 검량선</text><line x1="50" y1="168" x2="112" y2="168" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="112" y1="168" x2="112" y2="264" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#fibrinogen-test-ar-1)"/><circle cx="112" cy="168" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="56" y="160" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">환자</text><text x="112" y="292" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">농도 읽기</text><text x="344" y="312" text-anchor="end" font-weight="700">피브리노겐 농도 →</text><text x="14" y="354" font-weight="700">② 참고 범위 해석 (단위 mg/dL)</text><rect x="40" y="365" width="36" height="225" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><rect x="40" y="390" width="36" height="125" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="0" fill-opacity="0.3"/><rect x="40" y="490" width="36" height="100" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="0" fill-opacity="0.3"/><rect x="40" y="365" width="36" height="225" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="40" y1="390" x2="84" y2="390" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="40" y1="515" x2="84" y2="515" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="30" y1="490" x2="84" y2="490" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><text x="90" y="394">400</text><text x="90" y="521">150</text><text x="90" y="486" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">200 = 2 g/L</text><text x="130" y="438" font-weight="700" style="fill:var(--si-pos,#14543c)">정상 참고 범위</text><text x="130" y="462">150~400 (1.5~4.0 g/L)</text><line x1="200" y1="410" x2="200" y2="378" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#fibrinogen-test-ar-2)"/><text x="214" y="386" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">염증·조직 손상에서</text><text x="214" y="410">상승</text><line x1="200" y1="540" x2="200" y2="580" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#fibrinogen-test-ar-1)"/><text x="214" y="548" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">소모·분해에서 감소</text><text x="214" y="574">(파종성혈관내응고,</text><text x="214" y="600">대량출혈 등)</text><text x="14" y="634" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">산후출혈: 2 g/L 미만이면 높은 양성예측도</text><text x="14" y="656" style="fill:var(--si-general,#5c6b7f)">(Charbit 외, 2007 보고)</text><text x="14" y="686" font-weight="700" style="fill:var(--si-accent,#2454ff)">위·아래 양방향 해석이 모두 중요함</text><text x="14" y="710" style="fill:var(--si-general,#5c6b7f)">혈중 반감기 약 3~5일</text></svg>
