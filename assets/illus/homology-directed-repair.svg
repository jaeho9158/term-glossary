<svg class="si si-illus" viewBox="0 0 360 492" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="homology-directed-repair-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="homology-directed-repair-t">상동성 지정 복구: 상동 팔이 짝을 이루어 삽입 서열을 넣는다</title><defs><marker id="homology-directed-repair-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="10" y="20" font-weight="700">HDR: 상동성 지정 복구 (주형 있음)</text><text x="10" y="62" style="fill:var(--si-general,#5c6b7f)">공여 주형</text><rect x="100" y="52" width="40" height="10" style="stroke:currentColor;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><rect x="140" y="52" width="80" height="10" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2"/><rect x="220" y="52" width="40" height="10" style="stroke:currentColor;fill:var(--si-green-f,#e3f1ea)" stroke-width="1.2"/><text x="120" y="44" text-anchor="middle" style="fill:var(--si-blue-s,#7f9ac0)">상동 팔</text><text x="240" y="44" text-anchor="middle" style="fill:var(--si-green-s,#5b9b83)">상동 팔</text><text x="180" y="82" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">삽입 서열</text><rect x="20" y="106" width="80" height="12" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><rect x="100" y="106" width="40" height="12" style="stroke:currentColor;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><rect x="220" y="106" width="40" height="12" style="stroke:currentColor;fill:var(--si-green-f,#e3f1ea)" stroke-width="1.2"/><rect x="260" y="106" width="80" height="12" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><line x1="100" y1="64" x2="100" y2="106" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-w