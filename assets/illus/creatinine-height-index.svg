<svg class="si si-illus" viewBox="0 0 360 402" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="creatinine-height-index-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="creatinine-height-index-t">크레아티닌-신장 지수: 실측 대 기대와 판정 구간</title><defs><marker id="creatinine-height-index-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="creatinine-height-index-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">크레아티닌-신장 지수</text><text x="30" y="56" style="fill:var(--si-general,#5c6b7f)">기대 배설량</text><rect x="30" y="64" width="300" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="30" y="114" style="fill:var(--si-blue-s,#7f9ac0)">실측 24시간 배설량</text><rect x="30" y="122" width="210" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="180" y="168" text-anchor="middle">기대 = 이상체중 × (남 약 23, 여 약 18 mg/kg)</text><text x="180" y="192" text-anchor="middle" font-weight="700">지수(%) = 실측 ÷ 기대 × 100</text><rect x="30" y="262" width="180" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2" fill-opacity="0.55"/><rect x="210" y="262" width="60" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.55"/><rect x="270" y="262" width="60" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><line x1="30" y1="296" x2="30" y2="304" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="30" y="320" text-anchor="middle">0</text><line x1="210" y1="296" x2="210" y2="304" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="210" y="320" text-anchor="middle">60</text><line x1="270" y1="296" x2="270" y2="304" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="270" y="320" text-anchor="middle">80</text><line x1="330" y1="296" x2="330" y2="304" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="330" y="320" text-anchor="middle">100%</text><text x="120" y="284" text-anchor="middle" font-weight="700">60% 미만: 중증</text><text x="240" y="284" text-anchor="middle" font-weight="700">중등도</text><text x="300" y="284" text-anchor="middle" font-weight="700">80%↑</text><line x1="240" y1="224" x2="240" y2="258" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#creatinine-height-index-ar)"/><text x="240" y="216" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">예시 70%</text><line x1="220" y1="350" x2="60" y2="350" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#creatinine-height-index-ar-1)"/><text x="226" y="354" style="fill:var(--si-rose-s,#c97b7b)">근육량 감소 신호</text><text x="180" y="386" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">수집이 불완전하거나 신장 기능 이상이면 왜곡된다</text><text x="246" y="134" style="fill:var(--si-blue-s,#7f9ac0)">= 기대의 70%</text></svg>
