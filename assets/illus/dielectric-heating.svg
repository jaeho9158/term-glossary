width="0.8" fill-opacity="0.6"/><rect x="224" y="126" width="88" height="44" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2" fill-opacity="0.9"/><text x="268" y="153" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">늦게 데워짐</text><line x1="268" y1="84" x2="268" y2="98" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#dielectric-heating-ar-1)"/><line x1="268" y1="216" x2="268" y2="202" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#dielectric-heating-ar-1)"/><text x="268" y="78" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">열</text><text x="92" y="242" text-anchor="middle">체적 내부 발열</text><text x="268" y="242" text-anchor="middle">표면 → 내부 전도</text><text x="172" y="216" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">핫스팟</text><text x="14" y="216" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">콜드스팟</text><text x="14" y="266" style="fill:var(--si-general,#5c6b7f)">막대로 이은 두 점: 극성 분자 · 작은 점: 이온</text><text x="14" y="308" font-weight="700">② 단위 부피당 흡수 전력</text><text x="14" y="334" font-size="16" font-weight="700">P = 2π f ε₀ ε″ E²</text><text x="14" y="382">f 주파수, ε₀ 진공 유전율</text><text x="14" y="402">ε″ 유전손실계수, E 전기장 세기</text><text x="14" y="358" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">ε″는 수분·이온에 따라 달라진다</text><text x="14" y="428" font-weight="700">③ 유전가열에 쓰는 주파수</text><line x1="14" y1="472" x2="346" y2="472" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#dielectric-heating-ar-2)"/><line x1="30" y1="466" x2="30" y2="478" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="30" y="498" text-anchor="middle" font-weight="700">13.56</text><text x="30" y="518" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">MHz</text><line x1="86" y1="466" x2="86" y2="478" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="86" y="498" text-anchor="middle" font-weight="700">27.12</text><text x="86" y="518" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">MHz</text><line x1="142" y1="466" x2="142" y2="478" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="142" y="498" text-anchor="middle" font-weight="700">40.68</text><text x="142" y="518" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">MHz</text><line x1="200" y1="466" x2="200" y2="478" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="200" y="498" text-anchor="middle" font-weight="700">915</text><text x="200" y="518" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">MHz</text><line x1="256" y1="466" x2="256" y2="478" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="256" y="498" text-anchor="middle" font-weight="700">2,450</text><text x="256" y="518" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">MHz</text><line x1="314" y1="466" x2="314" y2="478" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="314" y="498" text-anchor="middle" font-weight="700">5.8</text><text x="314" y="518" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">GHz</text><text x="86" y="452" text-anchor="middle" style="fill:var(--si-blue-s,#7f9ac0)">고주파</text><text x="256" y="452" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">마이크로파</text><text x="14" y="550">낮을수록 깊이 침투해 대형 블록 해동에 유리하다</text><text x="14" y="578" style="fill:var(--si-general,#5c6b7f)">눈금 간격은 주파수에 비례하지 않는다</text><g class="si-rich" font-size="13"  font-weight="700"><text x="14" y="608">자유공간 파장 λ = </text><text x="129.9" y="601.8" text-anchor="middle" font-size="10.4">c</text><line x1="125.2" y1="603.8" x2="134.7" y2="603.8" style="stroke:currentColor" stroke-width="0.8"/><text x="129.9" y="612.8" text-anchor="middle" font-size="10.4">f</text><text x="136.2" y="608"> (c는 빛의 속도)</text></g><text x="14" y="630">2,450 MHz ≈ 12.2 cm, 915 MHz ≈ 32.8 cm</text><text x="14" y="650">27.12 MHz ≈ 11.1 m</text></svg>
