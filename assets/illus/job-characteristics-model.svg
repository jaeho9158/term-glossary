<svg class="si si-illus" viewBox="0 0 360 628" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-characteristics-model-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="job-characteristics-model-t">직무특성모형: MPS의 곱셈 구조</title><defs><marker id="job-characteristics-model-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><line x1="70" y1="165" x2="55" y2="165" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="95" y1="100" x2="55" y2="99.5" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">직무특성모형: 부피로 본 MPS</text><polygon points="70,120 120,80 240,80 190,120" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><polygon points="190,120 240,80 240,170 190,210" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><polygon points="70,120 190,120 190,210 70,210" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1.6" fill-opacity="1"/><polygon points="70,120 190,120 190,210 70,210" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.12"/><line x1="190" y1="120" x2="190" y2="210" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="70" y1="120" x2="70" y2="210" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="240" y1="80" x2="240" y2="170" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="70" y1="120" x2="120" y2="80" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><line x1="190" y1="120" x2="240" y2="80" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><line x1="190" y1="210" x2="240" y2="170" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><text x="14" y="168" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">자율성</text><text x="14" y="92" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">피드백</text><line x1="70" y1="226" x2="190" y2="226" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#job-characteristics-model-ar)" marker-start="url(#job-characteristics-model-ar)"/><text x="130" y="252" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">(기술다양성 + 과업정체성</text><text x="130" y="274" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">+ 과업중요성) / 3</text><text x="254" y="100" font-weight="700">부피</text><text x="254" y="124" font-size="14" font-weight="700">= MPS</text><text x="14" y="322" font-weight="700">자율성을 0으로 줄이면</text><polygon points="70,396 120,356 240,356 190,396" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><polygon points="190,396 240,356 240,362 190,402" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><polygon points="70,396 190,396 190,402 70,402" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1.6" fill-opacity="1"/><line x1="190" y1="396" x2="190" y2="402" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="70" y1="396" x2="70" y2="402" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="240" y1="356" x2="240" y2="362" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="70" y1="396" x2="120" y2="356" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><line x1="190" y1="396" x2="240" y2="356" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><line x1="190" y1="402" x2="240" y2="362" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><text x="254" y="360" font-weight="700">부피 = 0</text><text x="254" y="384" font-size="14" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">MPS = 0</text><text x="14" y="438" style="fill:var(--si-general,#5c6b7f)">가로 변을 키워도 자율성이나</text><text x="14" y="460" style="fill:var(--si-general,#5c6b7f)">피드백이 0이면 부피는 0이다</text><text x="14" y="500" font-weight="700">MPS =</text><text x="14" y="524" font-weight="700">(기술다양성 + 과업정체성 + 과업중요성) / 3</text><text x="14" y="548" font-weight="700">× 자율성 × 피드백</text><text x="14" y="584" font-weight="700">자율성·피드백 → 내재적 동기</text><text x="14" y="606" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">β = .35, p &lt; .01</text></svg>
