<svg class="si si-illus" viewBox="0 0 360 552" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="정지마찰에서 운동마찰로: 49.05 N에서 39.24 N으로" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="friction-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="friction-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="friction-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="friction-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="12" y="22" font-size="14" font-weight="700">미끄러지기 전과 후의 마찰력</text><line x1="20" y1="150" x2="340" y2="150" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="130" y="92" width="60" height="58" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="160" y="126" text-anchor="middle" font-weight="700">10 kg</text><line x1="60" y1="112" x2="126" y2="112" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#friction-ar)"/><text x="60" y="102" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">F</text><text x="70" y="128" style="fill:var(--si-rose-s,#c97b7b)">가한 힘</text><line x1="128" y1="164" x2="76" y2="164" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6" marker-end="url(#friction-ar-1)"/><text x="86" y="184" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">f</text><text x="100" y="184" style="fill:var(--si-amber-s,#d79a2b)">마찰</text><line x1="160" y1="90" x2="160" y2="44" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2" marker-end="url(#friction-ar-2)"/><text x="176" y="56" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">N = 98.1 N</text><line x1="160" y1="150" x2="160" y2="196" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#friction-ar-3)"/><text x="176" y="190" font-weight="700">mg</text><line x1="60" y1="440" x2="345" y2="440" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#friction-ar-3)"/><line x1="60" y1="440" x2="60" y2="252" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="60" y="244" style="fill:var(--si-general,#5c6b7f)">↑ 마찰력 f (N)</text><text x="345" y="464" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">가한 힘 F (N) →</text><line x1="60" y1="440" x2="217" y2="283" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><line x1="217" y1="285" x2="217" y2="311" style="stroke:currentColor;fill:none" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#friction-ar-3)"/><line x1="217" y1="314" x2="335" y2="314" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.8"/><circle cx="217" cy="283" r="5" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><line x1="60" y1="283" x2="217" y2="283" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="60" y1="314" x2="217" y2="314" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="217" y1="440" x2="217" y2="316" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="56" y="287" text-anchor="end">49.05</text><text x="56" y="318" text-anchor="end">39.24</text><text x="217" y="460" text-anchor="middle">49.05</text><text x="68" y="352" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">정지: f = F</text><text x="68" y="372" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">≤ μ<tspan dy="0.217em" font-size="92%">s</tspan><tspan dy="-0.2em">N</tspan></text><text x="228" y="270" font-weight="700">미끄러짐 시작</text><text x="228" y="346" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">운동: f = μ<tspan dy="0.217em" font-size="92%">k</tspan><tspan dy="-0.2em">N</tspan></text><text x="228" y="366" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">일정</text><text x="12" y="492">N = mg = 10 × 9.81 = 98.1 N</text><text x="12" y="511">μ<tspan dy="0.217em" font-size="92%">s</tspan><tspan dy="-0.2em"> = 0.5 → 49.05 N, μ</tspan><tspan dy="0.217em" font-size="92%">k</tspan><tspan dy="-0.2em"> = 0.4 → 39.24 N</tspan></text><text x="12" y="530" font-weight="700">μ<tspan dy="0.217em" font-size="92%">k</tspan><tspan dy="-0.2em"> &lt; μ</tspan><tspan dy="0.217em" font-size="92%">s</tspan><tspan dy="-0.2em">: 미끄러지면 마찰이 줄어든다</tspan></text></svg>
