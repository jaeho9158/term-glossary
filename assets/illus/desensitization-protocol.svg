<svg class="si si-illus" viewBox="0 0 360 508" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="desensitization-protocol-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="desensitization-protocol-t">탈감작 프로토콜: 단계마다 2배씩 오르는 12단계 용량 계단</title><defs><marker id="desensitization-protocol-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="desensitization-protocol-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">탈감작 프로토콜: 12단계, 단계마다 2배</text><text x="14" y="54" style="fill:var(--si-general,#5c6b7f)">용량(로그 눈금)</text><rect x="44" y="314" width="22" height="16" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="66" y="298" width="22" height="32" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="88" y="282" width="22" height="48" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="110" y="266" width="22" height="64" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="132" y="250" width="22" height="80" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="154" y="234" width="22" height="96" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="176" y="218" width="22" height="112" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="198" y="202" width="22" height="128" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="220" y="186" width="22" height="144" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="242" y="170" width="22" height="160" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="264" y="154" width="22" height="176" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="286" y="138" width="22" height="192" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="308" y="128" text-anchor="end" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">목표(전체) 용량</text><path d="M 318 160 L 318 96 L 55 96 L 55 300" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="55" y1="296" x2="55" y2="308" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#desensitization-protocol-ar)"/><text x="186" y="86" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">투여 중단 → 내성 소실 → 처음부터 반복</text><line x1="44" y1="338" x2="316" y2="338" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2" marker-end="url(#desensitization-protocol-ar-1)"/><text x="44" y="362" style="fill:var(--si-general,#5c6b7f)">첫 단계는 아주 적은 용량</text><text x="44" y="386">시간: 정해진 간격마다 증량</text><text x="44" y="410" font-weight="700">수액 주머니 3개 · 12단계</text><text x="14" y="440" style="fill:var(--si-general,#5c6b7f)">각 단계는 직전의 2배(로그 눈금에서 같은 간격으로 상승)</text><text x="14" y="466" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">아나필락시스에 대응 가능한 환경에서 시행</text><text x="14" y="490" style="fill:var(--si-general,#5c6b7f)">일시적 내성이며 기전은 아직 규명되지 않음</text></svg>
