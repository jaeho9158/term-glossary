<svg class="si si-illus" viewBox="0 0 360 504" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="accrual-basis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="accrual-basis-t">발생주의: 12월 이익은 400,000, 현금은 0</title><defs><marker id="accrual-basis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="accrual-basis-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="100" y="34" text-anchor="middle" font-size="14" font-weight="700">12월</text><text x="260" y="34" text-anchor="middle" font-size="14" font-weight="700">이후 기간(1월)</text><line x1="180" y1="46" x2="180" y2="300" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="20" y1="80" x2="346" y2="80" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#accrual-basis-ar)"/><circle cx="100" cy="80" r="11" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="100" y="85" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">✓</text><text x="100" y="114" text-anchor="middle" font-weight="700">용역 제공</text><text x="100" y="134" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">12월 20일</text><text x="100" y="154" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">청구 1,000,000</text><circle cx="260" cy="80" r="11" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="260" y="85" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">₩</text><text x="260" y="114" text-anchor="middle" font-weight="700">현금 수령</text><text x="260" y="134" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1월 15일</text><text x="260" y="154" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">수령 1,000,000</text><text x="20" y="184" font-weight="700" style="fill:var(--si-blue-t,#12305c)">발생주의</text><rect x="40" y="192" width="120" height="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="100" y="211" text-anchor="middle" font-weight="700">이익 400,000</text><text x="260" y="211" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><rect x="40" y="224" width="120" height="46" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="100" y="243" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">발생액</text><text x="100" y="263" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">400,000</text><text x="20" y="313" font-weight="700" style="fill:var(--si-gray-t,#44546a)">현금주의</text><text x="100" y="313" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><rect x="200" y="294" width="120" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="260" y="313" text-anchor="middle" font-weight="700">이익 400,000</text><line x1="164" y1="208" x2="198" y2="290" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#accrual-basis-ar-1)"/><text x="206" y="250" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">인식 시점 차이</text><line x1="180" y1="46" x2="180" y2="330" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="180" y="352" text-anchor="middle">수익 1,000,000 − 임금 600,000 = 이익 400,000</text><text x="180" y="372" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(단위: 원)</text><rect x="20" y="386" width="320" height="56" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6"/><text x="180" y="410" text-anchor="middle" font-weight="700">발생액 = 순이익 − 영업활동현금흐름</text><text x="180" y="430" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">= 400,000 − 0 = 400,000</text><text x="180" y="468" text-anchor="middle">12월·1월을 합하면 두 방식 모두 400,000</text><text x="180" y="488" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">장기 누적 이익은 같아진다</text></svg>
