<svg class="si si-illus" viewBox="0 0 360 620" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="탄성계수는 응력-변형률 곡선의 초기 기울기이다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="elastic-modulus-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="elastic-modulus-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="50" y1="300" x2="338" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#elastic-modulus-ar)"/><line x1="50" y1="300" x2="50" y2="40" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#elastic-modulus-ar)"/><text x="338" y="320" text-anchor="end" font-style="italic">ε</text><text x="58" y="40">σ(응력)</text><line x1="50" y1="150" x2="336" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="5 4"/><text x="54" y="144" style="fill:var(--si-general,#5c6b7f)">높이 = 강도</text><polyline points="50,300 130,150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><path d="M130,150 C134.7,147.3 146.3,137.8 158,134 C169.7,130.2 187,128.5 200,127 C213,125.5 230,125.3 236,125" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><polyline points="50,300 279,150" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><path d="M279,150 C283.2,148.2 294.8,141.5 304,139 C313.2,136.5 329,135.7 334,135" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><polygon points="88,228.8 122,228.8 122,165" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.5"/><text x="105" y="245" text-anchor="middle" font-style="italic" style="fill:var(--si-blue-t,#12305c)">Δε</text><text x="128" y="200" font-style="italic" style="fill:var(--si-blue-t,#12305c)">Δσ</text><g class="si-rich" font-size="13"  font-weight="700" font-style="italic" style="fill:var(--si-blue-t,#12305c)"><text x="62" y="84">E = </text><text x="93.4" y="77.8" text-anchor="middle" font-size="10.4">σ</text><line x1="88.7" y1="79.8" x2="98.2" y2="79.8" style="stroke:var(--si-blue-t,#12305c)" stroke-width="0.8"/><text x="93.4" y="88.8" text-anchor="middle" font-size="10.4">ε</text></g><text x="62" y="118" font-weight="700" style="fill:var(--si-blue-t,#12305c)">= 기울기(강성)</text><text x="182" y="106" style="fill:var(--si-blue-t,#12305c)">강철 E ≈ 200 GPa</text><text x="338" y="214" text-anchor="end" style="fill:var(--si-amber-t,#7a5210)">알루미늄 합금</text><text x="338" y="234" text-anchor="end" style="fill:var(--si-amber-t,#7a5210)">E ≈ 70 GPa</text><line x1="296" y1="200" x2="281" y2="155" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.2"/><text x="50" y="346" style="fill:var(--si-general,#5c6b7f)">꺾인 뒤(항복 이후)에는 E를 쓰지 않는다</text><line x1="24" y1="364" x2="336" y2="364" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><rect x="20" y="392" width="12" height="64" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="38" y="384" style="fill:var(--si-blue-t,#12305c)">강철: ΔL = 1.0 mm</text><rect x="32" y="392" width="200" height="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="232" y="392" width="8" height="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" stroke-dasharray="3 2" fill-opacity="0.45"/><line x1="244" y1="402" x2="284" y2="402" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#elastic-modulus-ar-1)"/><text x="290" y="407" style="fill:var(--si-rose-t,#7d2626)">10 kN</text><text x="38" y="428" style="fill:var(--si-amber-t,#7a5210)">알루미늄: ΔL ≈ 2.9 mm</text><rect x="32" y="436" width="200" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="232" y="436" width="23" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6" stroke-dasharray="3 2" fill-opacity="0.45"/><line x1="259" y1="446" x2="299" y2="446" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#elastic-modulus-ar-1)"/><text x="305" y="451" style="fill:var(--si-rose-t,#7d2626)">10 kN</text><text x="32" y="496">막대 길이 2 m, 단면적 100 mm²</text><text x="32" y="516" style="fill:var(--si-general,#5c6b7f)">늘어남은 80배 확대해 그렸다(점선 칸이 늘어난 부분)</text><g class="si-rich" font-size="13"  font-weight="700" font-style="italic"><text x="32" y="546">ΔL = </text><text x="75.8" y="539.8" text-anchor="middle" font-size="10.4">FL</text><line x1="66.8" y1="541.8" x2="84.8" y2="541.8" style="stroke:currentColor" stroke-width="0.8"/><text x="75.8" y="550.8" text-anchor="middle" font-size="10.4">AE</text></g><text x="32" y="582" font-weight="700">E = 2G(1+ν) = 3K(1−2ν)</text><text x="32" y="602">등방성 재료는 둘만 알면 나머지가 정해진다</text></svg>
