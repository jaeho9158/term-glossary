t="400">0</text><line x1="106" y1="340" x2="242" y2="340" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="130" y="357" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><text x="174" y="357" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1</text><text x="218" y="357" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">2</text><line x1="130" y1="264" x2="130" y2="296" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9" stroke-dasharray="2 4"/><line x1="174" y1="264" x2="174" y2="296" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9" stroke-dasharray="2 4"/><line x1="218" y1="264" x2="218" y2="296" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9" stroke-dasharray="2 4"/><text x="238" y="286" font-weight="700" style="fill:var(--si-limit,#7d2626)">n에 따라</text><text x="238" y="306" font-weight="700" style="fill:var(--si-limit,#7d2626)">좌우로 민다</text><line x1="238" y1="322" x2="336" y2="322" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.6" marker-end="url(#convolution-ar-1)" marker-start="url(#convolution-ar-1)"/><rect x="20" y="372" width="320" height="52" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1" fill-opacity="0.3"/><text x="180" y="394" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">n = 2에서 겹친 칸을 곱해 더한다</text><text x="180" y="416" text-anchor="middle" font-size="14" font-weight="700">1×0.5 + 2×1 + 3×0 = 2.5</text><text x="8" y="466" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">(x∗h)[n]</text><text x="64" y="565" text-anchor="middle" font-weight="400">0</text><rect x="95" y="546" width="26" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.55"/><text x="108" y="541" text-anchor="middle" font-weight="400">1</text><rect x="139" y="510" width="26" height="60" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.55"/><text x="152" y="505" text-anchor="middle" font-weight="700">2.5</text><rect x="183" y="474" width="26" height="96" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.55"/><text x="196" y="469" text-anchor="middle" font-weight="400">4</text><rect x="227" y="534" width="26" height="36" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.55"/><text x="240" y="529" text-anchor="middle" font-weight="400">1.5</text><rect x="136" y="488" width="32" height="82" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2" stroke-dasharray="4 3"/><line x1="40" y1="570" x2="264" y2="570" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="64" y="587" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><text x="108" y="587" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1</text><text x="152" y="587" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">2</text><text x="196" y="587" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">3</text><text x="240" y="587" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">4</text><text x="236" y="478" font-weight="700" style="fill:var(--si-limit,#7d2626)">점선 상자</text><text x="236" y="498" font-weight="700" style="fill:var(--si-limit,#7d2626)">= n = 2의 값</text><text x="180" y="614" text-anchor="middle" font-size="14" font-weight="700">출력 길이 = 3 + 3 − 1 = 5</text></svg>
