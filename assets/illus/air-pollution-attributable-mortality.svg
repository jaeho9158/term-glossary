<svg class="si si-illus" viewBox="0 0 360 576" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="대기오염 기인사망: 노출-반응 곡선, 노출 분포, 기저 사망 속 몫" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">대기오염 기인사망은 집단 패턴에서 역산한 몫</text><text x="14" y="46" font-weight="700">상대위험</text><line x1="50" y1="214" x2="340" y2="214" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="50" y1="214" x2="50" y2="54" style="stroke:currentColor;fill:none" stroke-width="1.8"/><path d="M130 214 L130 178 C170 166 210 142 252 118 L290 94 L290 214 Z" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="0" fill-opacity="0.9"/><path d="M50,194 C61.7,192 96.7,189.3 120,182 C143.3,174.7 166.7,161.7 190,150 C213.3,138.3 236.7,125 260,112 C283.3,99 318.3,78.7 330,72" style="stroke:currentColor;fill:none" stroke-width="2.6"/><line x1="130" y1="214" x2="130" y2="58" style="stroke:currentColor;fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="130" y="50" text-anchor="middle" font-weight="700">기준 농도</text><path d="M56 284 C80 284 100 272 126 262 C150 252 170 250 190 258 C212 268 232 282 270 284 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><path d="M130 261 C150 252 170 250 190 258 C212 268 232 282 270 284 L130 284 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><line x1="130" y1="214" x2="130" y2="284" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><text x="14" y="302" style="fill:var(--si-general,#5c6b7f)">인구집단 노출 분포</text><text x="240" y="238" style="fill:var(--si-general,#5c6b7f)">PM2.5 농도</text><text x="136" y="204" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">기준 초과 노출</text><text x="70" y="330" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">노출 분포 × 초과위험</text><text x="70" y="350" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">= 기인분율(PAF)</text><polygon points="233,312 233,344 240,344 226,358 212,344 219,344 219,312" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4" fill-opacity="0.35"/><rect x="40" y="368" width="280" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="226" y="368" width="94" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8" stroke-dasharray="5 3"/><text x="273" y="390" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">기인사망</text><text x="133" y="390" text-anchor="middle" font-weight="700">기저 사망(전체 사망자)</text><text x="14" y="436" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">기인사망 = PAF × 기저 사망</text><text x="14" y="462" style="fill:var(--si-general,#5c6b7f)">점선 띠는 실제 사망자 명단이 아닌</text><text x="14" y="482" style="fill:var(--si-general,#5c6b7f)">통계적 몫이다 (비율은 모식)</text><rect x="14" y="508" width="332" height="52" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="24" y="530" font-weight="700">곡선 형태·기준 농도가 바뀌면</text><text x="24" y="550" font-weight="700">음영(추정치)도 바뀜</text></svg>
