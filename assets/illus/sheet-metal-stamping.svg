<svg class="si si-illus" viewBox="0 0 600 305" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sheet-metal-stamping-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="sheet-metal-stamping-t">딥드로잉 단면</title><desc>딥드로잉 금형 단면. 블랭크 홀더가 다이 위에서 판재 가장자리를 누르고, 펀치가 판재를 다이 구멍 안으로 밀어 넣어 컵 모양을 만든다. 벽은 펀치 모서리에서 가장 얇고 플랜지는 두꺼워진다</desc><defs><marker id="sheet-metal-stamping-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="60" y="180" width="170" height="80" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.15"/><rect x="370" y="180" width="170" height="80" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.15"/><rect x="60" y="146" width="166" height="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.12"/><rect x="374" y="146" width="166" height="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.12"/><rect x="244" y="30" width="112" height="206" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.1"/><polyline points="90,175 232,175 238,181 238,236 244,242 356,242 362,236 362,181 368,175 510,175" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="4"/><text x="300" y="120" text-anchor="middle" font-size="12">펀치</text><text x="145" y="226" text-anchor="middle" font-size="12">다이</text><text x="455" y="226" text-anchor="middle" font-size="12">다이</text><text x="143" y="163" text-anchor="middle" font-size="12">블랭크 홀더</text><text x="457" y="163" text-anchor="middle" font-size="12">블랭크 홀더</text><line x1="300" y1="6" x2="300" y2="26" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#sheet-metal-stamping-ar)"/><text x="312" y="20" font-size="12">누르는 힘</text><text x="40" y="128" font-size="12">플랜지: 두꺼워짐</text><line x1="90" y1="132" x2="110" y2="173" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="140" y="290" font-size="12">벽이 가장 얇은 곳(펀치 모서리)</text><line x1="236" y1="280" x2="241" y2="241" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="400" y="290" font-size="12">블랭크(판재)</text><line x1="430" y1="280" x2="362" y2="220" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
