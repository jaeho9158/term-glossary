<svg class="si si-illus" viewBox="0 0 360 526" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glacier-mass-balance-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="glacier-mass-balance-t">빙하 질량수지: 평형선 위 집적과 아래 소모의 차이이다</title><defs><marker id="glacier-mass-balance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="glacier-mass-balance-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="glacier-mass-balance-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><polygon points="10,140 120,200 240,260 346,300 346,364 10,364" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="150" y="336" style="fill:var(--si-general,#5c6b7f)">기반암</text><polygon points="10,88 120,142 160,164 160,220 120,200 10,140" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><polygon points="160,164 240,214 310,286 240,260 160,220" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><line x1="160" y1="164" x2="160" y2="220" style="stroke:currentColor;fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><text x="176" y="146" font-weight="700">평형선(ELA)</text><text x="112" y="116" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">집적 구역(+)</text><text x="214" y="178" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">소모 구역(−)</text><line x1="40" y1="34" x2="40" y2="88" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#glacier-mass-balance-ar)"/><line x1="90" y1="34" x2="90" y2="114" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#glacier-mass-balance-ar)"/><text x="14" y="24" style="fill:var(--si-blue-s,#7f9ac0)">강설·눈 누적</text><line x1="284" y1="248" x2="284" y2="216" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#glacier-mass-balance-ar-1)"/><text x="284" y="204" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">융해·승화</text><polygon points="322,294 334,290 340,300 328,306" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="346" y="262" text-anchor="end">빙산 분리</text><line x1="200" y1="248" x2="200" y2="232" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#glacier-mass-balance-ar-1)"/><text x="160" y="278" style="fill:var(--si-rose-s,#c97b7b)">바닥 융해</text><line x1="328" y1="174" x2="328" y2="114" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2" marker-end="url(#glacier-mass-balance-ar-2)"/><text x="320" y="140" text-anchor="end" font-weight="700" style="fill:var(--si-accent,#2454ff)">ELA 상승</text><text x="14" y="386" font-weight="700" style="fill:var(--si-accent,#2454ff)">ELA 상승 → 집적 구역 비율 AAR ≤ 0.3</text><text x="14" y="406" style="fill:var(--si-general,#5c6b7f)">(AAR 0.3 이하는 지속 불가능 신호)</text><text x="14" y="434" font-weight="700">질량수지 = 집적 − 소모 (m w.e. 또는 Gt)</text><text x="14" y="454">측지 방법: DEM 차이 × 약 850 kg/m<tspan dy="-0.435em" font-size="92%">3</tspan></text><text x="14" y="488">1961~2016 전 지구 누적 손실 약 9,600 Gt</text><text x="14" y="508">≈ 해수면 약 27 mm 상승</text><line x1="178" y1="151" x2="162" y2="166" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><line x1="322" y1="267" x2="329" y2="288" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/></svg>
