<svg class="si si-illus" viewBox="0 0 360 680" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="핵심-주변 이론: 위계적 종속관계와 프리드먼의 단계 모델" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="core-periphery-theory-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="core-periphery-theory-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="20" y="36" font-weight="700">단계 1: 핵심 하나, 위계적 종속</text><rect x="20" y="48" width="320" height="130" rx="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.6"/><text x="30" y="72" style="fill:var(--si-general,#5c6b7f)">주변지역</text><circle cx="210" cy="114" r="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><text x="210" y="119" text-anchor="middle" font-weight="700">핵심</text><line x1="40" y1="128" x2="176" y2="116" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="6" marker-end="url(#core-periphery-theory-ar)"/><text x="32" y="98" style="fill:var(--si-rose-t,#7d2626)">원자재·노동력</text><line x1="244" y1="108" x2="316" y2="120" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#core-periphery-theory-ar-1)"/><text x="334" y="146" text-anchor="end" style="fill:var(--si-blue-t,#12305c)">혁신·의사결정</text><text x="20" y="206" font-weight="700">단계 2: 하위 핵심이 나타남</text><rect x="20" y="218" width="320" height="130" rx="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.6"/><text x="30" y="242" style="fill:var(--si-general,#5c6b7f)">주변지역</text><circle cx="120" cy="284" r="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><text x="120" y="289" text-anchor="middle" font-weight="700">핵심</text><circle cx="250" cy="270" r="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="270" cy="324" r="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><line x1="36" y1="292" x2="88" y2="284" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4" marker-end="url(#core-periphery-theory-ar)"/><line x1="235" y1="254" x2="147" y2="262" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#core-periphery-theory-ar)"/><line x1="150" y1="282" x2="236" y2="276" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#core-periphery-theory-ar-1)"/><line x1="257" y1="314" x2="148" y2="293" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#core-periphery-theory-ar)"/><line x1="144" y1="306" x2="252" y2="332" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#core-periphery-theory-ar-1)"/><text x="300" y="266" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">하위 핵심</text><text x="20" y="376" font-weight="700">단계 3: 여러 핵심으로 분화, 관계 완화</text><rect x="20" y="388" width="320" height="130" rx="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.6"/><text x="30" y="412" style="fill:var(--si-general,#5c6b7f)">주변지역</text><circle cx="90" cy="456" r="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><text x="90" y="461" text-anchor="middle" font-weight="700">핵심</text><circle cx="190" cy="422" r="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="270" cy="452" r="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="190" cy="494" r="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><line x1="118" y1="448" x2="176" y2="432" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#core-periphery-theory-ar-1)"/><line x1="170" y1="414" x2="112" y2="428" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#core-periphery-theory-ar)"/><line x1="176" y1="478" x2="118" y2="463" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#core-periphery-theory-ar)"/><line x1="112" y1="478" x2="174" y2="500" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#core-periphery-theory-ar-1)"/><line x1="203.7" y1="436.7" x2="250" y2="454.1" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#core-periphery-theory-ar-1)"/><line x1="256.3" y1="437.3" x2="210" y2="419.9" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#core-periphery-theory-ar)"/><text x="296" y="490" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">하위 핵심</text><line x1="20" y1="540" x2="340" y2="540" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><line x1="30" y1="566" x2="60" y2="566" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4" marker-end="url(#core-periphery-theory-ar)"/><text x="68" y="571">주변 → 핵심: 원자재·노동력 공급</text><line x1="30" y1="592" x2="60" y2="592" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#core-periphery-theory-ar-1)"/><text x="68" y="597">핵심 → 주변: 혁신·의사결정 독점</text><text x="20" y="636" style="fill:var(--si-general,#5c6b7f)">국가 간에도 같은 구도: 선진국 = 핵심,</text><text x="20" y="656" style="fill:var(--si-general,#5c6b7f)">개발도상국 = 주변 (반주변부 같은 중간 위치도 고려)</text></svg>
