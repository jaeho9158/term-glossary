<svg class="si si-illus" viewBox="0 0 360 610" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ammonia-as-hydrogen-carrier-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ammonia-as-hydrogen-carrier-t">암모니아 수소 운반체: 합성에서 낸 열을 분해에서 되돌려 넣는다</title><defs><marker id="ammonia-as-hydrogen-carrier-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="ammonia-as-hydrogen-carrier-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="ammonia-as-hydrogen-carrier-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="10" y="26" font-weight="700">엔탈피</text><line x1="24" y1="220" x2="24" y2="40" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#ammonia-as-hydrogen-carrier-ar)"/><line x1="34" y1="80" x2="180" y2="80" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="34" y1="200" x2="180" y2="200" style="stroke:currentColor;fill:none" stroke-width="3"/><text x="36" y="68" font-weight="700">N<tspan baseline-shift="sub" font-size="92%">2</tspan> + 3H<tspan baseline-shift="sub" font-size="92%">2</tspan></text><text x="36" y="224" font-weight="700">2NH<tspan baseline-shift="sub" font-size="92%">3</tspan></text><line x1="70" y1="84" x2="70" y2="196" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4" marker-end="url(#ammonia-as-hydrogen-carrier-ar-1)"/><line x1="140" y1="196" x2="140" y2="84" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4" marker-end="url(#ammonia-as-hydrogen-carrier-ar-2)"/><text x="196" y="100" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">합성(하버-보슈)</text><text x="196" y="122" style="fill:var(--si-rose-s,#c97b7b)">−91.9 kJ/mol</text><text x="196" y="144" style="fill:var(--si-rose-s,#c97b7b)">열을 내놓는다</text><line x1="192" y1="100" x2="76" y2="120" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="196" y="176" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">분해(크래킹)</text><text x="196" y="198" style="fill:var(--si-blue-s,#7f9ac0)">2NH<tspan baseline-shift="sub" font-size="92%">3</tspan> 기준 +91.8 kJ</text><text x="196" y="220" style="fill:var(--si-blue-s,#7f9ac0)">(NH<tspan baseline-shift="sub" font-size="92%">3</tspan> 1 mol당 +45.9 kJ)</text><text x="196" y="244" style="fill:var(--si-blue-s,#7f9ac0)">촉매·고온 필요</text><line x1="192" y1="176" x2="146" y2="160" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><path d="M30,274.4 L30,314 Q30,324 40,324 L90,324 Q100,324 100,314 L100,274.4Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.85"/><line x1="30" y1="274.4" x2="100" y2="274.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2" stroke-dasharray="5 3"/><path d="M30,262 L30,314 Q30,324 40,324 L90,324 Q100,324 100,314 L100,262" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="116" y="282" font-weight="700">액체 암모니아로 저장·운송</text><text x="116" y="304">비교적 낮은 압력에서 액화</text><text x="116" y="326" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">11.5 MJ/L</text><line x1="76" y1="396" x2="38" y2="422" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="76" y1="396" x2="114" y2="422" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="76" y1="396" x2="76" y2="354" style="stroke:currentColor;fill:none" stroke-width="3"/><circle cx="38" cy="422" r="11" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="38" y="427" text-anchor="middle">H</text><circle cx="114" cy="422" r="11" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="114" y="427" text-anchor="middle">H</text><circle cx="76" cy="354" r="11" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="76" y="359" text-anchor="middle">H</text><circle cx="76" cy="396" r="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="76" y="401" text-anchor="middle" font-weight="700">N</text><text x="76" y="462" text-anchor="middle">NH<tspan baseline-shift="sub" font-size="92%">3</tspan> 분자</text><rect x="150" y="380" width="156.3" height="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="306.3" y="380" width="33.7" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="150" y="372">분자량 17.031</text><text x="228.1" y="424" text-anchor="middle" style="fill:var(--si-blue-s,#7f9ac0)">N 약 14.0</text><text x="340" y="450" text-anchor="end" style="fill:var(--si-amber-s,#d79a2b)">H<tspan baseline-shift="sub" font-size="92%">3</tspan> 3×1.008</text><line x1="323.1" y1="408" x2="323.1" y2="438" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.2"/><text x="176" y="478" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">수소 질량비 17.8 wt%</text><text x="10" y="524">분해 시 수소 1 kg당 약 15.2 MJ 필요</text><text x="10" y="546" style="fill:var(--si-general,#5c6b7f)">두 화살표는 길이가 같다: 낸 열 = 들인 열</text><text x="10" y="568" style="fill:var(--si-general,#5c6b7f)">분해 없이 직접 연료로도 쓴다.</text><text x="10" y="590" style="fill:var(--si-general,#5c6b7f)">다만 N<tspan baseline-shift="sub" font-size="92%">2</tspan>O(지구온난화지수 최대 약 300배) 주의</text></svg>
