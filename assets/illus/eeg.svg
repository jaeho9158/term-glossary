xt><circle cx="132" cy="258" r="13" style="stroke:currentColor;fill:currentColor" stroke-width="1.4" fill-opacity="0.04"/><text x="132" y="261" text-anchor="middle" font-size="9">O1</text><circle cx="208" cy="258" r="13" style="stroke:currentColor;fill:currentColor" stroke-width="1.4" fill-opacity="0.04"/><text x="208" y="261" text-anchor="middle" font-size="9">O2</text><text x="40" y="196" text-anchor="middle" font-size="10">A1</text><text x="300" y="196" text-anchor="middle" font-size="10">A2</text><text x="196" y="24" font-size="11" style="fill:var(--si-general,#5c6b7f)">앞(코뿌리)</text><text x="196" y="300" font-size="11" style="fill:var(--si-general,#5c6b7f)">뒤(뒤통수 융기)</text><text x="340" y="100" font-size="12">코뿌리~뒤통수 융기 거리를</text><text x="340" y="121" font-size="12">10 · 20 · 20 · 20 · 20 · 10 %로</text><text x="340" y="142" font-size="12">나누어 정중선 전극을 놓는다</text><text x="340" y="170" font-size="12" font-weight="700">홀수 = 왼쪽, 짝수 = 오른쪽</text><text x="340" y="194" font-size="12" style="fill:var(--si-accent,#2454ff)">예: Pz는 정중선의 마루엽 전극</text></svg>
