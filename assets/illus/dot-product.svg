<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dot-product-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="dot-product-t">내적과 정사영: a = (3, 4), b = (4, 3)</title><defs><marker id="dot-product-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="162.2" y1="223" x2="162.2" y2="223" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="70" y1="270" x2="262" y2="126" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#dot-product-ar)"/><line x1="70" y1="270" x2="214" y2="78" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#dot-product-ar)"/><line x1="70" y1="270" x2="254.3" y2="131.8" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="4"/><line x1="254.3" y1="131.8" x2="214" y2="78" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-dasharray="6 4"/><polyline points="244.7,139 237.5,129.4 247.1,122.2" style="stroke:currentColor;fill:none" stroke-width="1"/><path d="M118,234 A60,60 0 0 0 106,222" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="123.7" y="221.3" text-anchor="middle">θ</text><text x="202" y="72" text-anchor="end" font-size="15" font-weight="700">a</text><text x="270" y="131" font-size="15" font-weight="700">b</text><text x="180.2" y="235.9" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">정사영 길이 4.8</text><text x="330" y="90">a·b = 3×4 + 4×3 = 24</text><text x="330" y="116">|a| = |b| = 5</text><text x="330" y="142">cos θ = 24/25 = 0.96</text><text x="330" y="168">θ ≈ 16.3°</text><text x="20" y="318" font-size="12" style="fill:var(--si-general,#5c6b7f)">a·b = |a||b| cos θ,  정사영 길이 = a·b / |b| = |a| cos θ</text></svg>
