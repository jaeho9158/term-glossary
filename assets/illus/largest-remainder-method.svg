<svg class="si si-illus" viewBox="0 0 360 464" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="largest-remainder-method-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="largest-remainder-method-t">최대잔여방식: 정수 몫을 먼저 주고 남은 의석은 잔여가 큰 순서로</title><defs></defs><text x="10" y="22" font-weight="700">쿼터 = 총 유효 투표수 ÷ 의석 수</text><text x="10" y="46" style="fill:var(--si-general,#5c6b7f)">가상 예: 총 10석, 득표 ÷ 쿼터</text><text x="292" y="46" style="fill:var(--si-general,#5c6b7f)">정수 몫</text><text x="18" y="83" text-anchor="middle" font-weight="700">A</text><rect x="36" y="66" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="90" y="66" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="144" y="66" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="198" y="66" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="252" y="66" width="34.8" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="318" y="83" text-anchor="middle" font-weight="700">4석</text><text x="18" y="115" text-anchor="middle" font-weight="700">B</text><rect x="36" y="98" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="90" y="98" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="144" y="98" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="198" y="98" width="18.6" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="318" y="115" text-anchor="middle" font-weight="700">3석</text><text x="18" y="147" text-anchor="middle" font-weight="700">C</text><rect x="36" y="130" width="51" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><rect x="90" y="130" width="29.4" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="318" y="147" text-anchor="middle" font-weight="700">1석</text><text x="18" y="179" text-anchor="middle" font-weight="700">D</text><rect x="36" y="162" width="13.2" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="318" y="179" text-anchor="middle" font-weight="700">0석</text><text x="268" y="83" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">잔여</text><text x="10" y="214" font-weight="700">남은 2석 → 잔여가 큰 순</text><circle cx="18" cy="244" r="11" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="18" y="249" text-anchor="middle" font-weight="700">1</text><text x="48" y="249" text-anchor="middle" font-weight="700">A</text><rect x="62" y="232" width="140" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.4"/><text x="210" y="249" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">0.7 → +1석</text><circle cx="18" cy="274" r="11" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="18" y="279" text-anchor="middle" font-weight="700">2</text><text x="48" y="279" text-anchor="middle" font-weight="700">C</text><rect x="62" y="262" width="120" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.4"/><text x="190" y="279" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">0.6 → +1석</text><circle cx="18" cy="304" r="11" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><text x="18" y="309" text-anchor="middle" font-weight="700">3</text><text x="48" y="309" text-anchor="middle" font-weight="700">B</text><rect x="62" y="292" width="80" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="1"/><text x="150" y="309" font-weight="400" style="fill:var(--si-general,#5c6b7f)">0.4</text><circle cx="18" cy="334" r="11" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><text x="18" y="339" text-anchor="middle" font-weight="700">4</text><text x="48" y="339" text-anchor="middle" font-weight="700">D</text><rect x="62" y="322" width="60" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="1"/><text x="130" y="339" font-weight="400" style="fill:var(--si-general,#5c6b7f)">0.3</text><text x="10" y="376" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">의석 = A 5, B 3, C 2, D 0 (합계 10석)</text><text x="10" y="412" style="fill:var(--si-general,#5c6b7f)">드룹 쿼터 = 표 ÷ (의석+1) + 1</text><text x="10" y="432" style="fill:var(--si-general,#5c6b7f)">→ 칸 길이가 달라지면 결과도 달라질 수 있다</text></svg>
