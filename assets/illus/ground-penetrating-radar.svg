<svg class="si si-illus" viewBox="0 0 560 346" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="지표 투과 레이더의 원리" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>지표의 송신 안테나가 전자기파를 지하로 보내고, 지층 경계와 매설물에서 반사된 신호를 수신 안테나가 기록하는 단면 모식도</desc><defs><marker id="ground-penetrating-radar-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="ground-penetrating-radar-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><line x1="221" y1="70" x2="207" y2="63" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="319" y1="70" x2="333" y2="63" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="110" y1="190" x2="93.6" y2="185" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="444" y1="246" x2="462" y2="223" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="250" y1="140" x2="207.2" y2="140" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="20" font-size="12" font-weight="700">지표 레이더 탐사 단면(모식, 비례 아님)</text><rect x="20" y="90" width="520" height="210" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.1"/><line x1="20" y1="90" x2="540" y2="90" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="20" y1="190" x2="540" y2="190" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="430" cy="250" r="16" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.8" fill-opacity="0.35"/><rect x="211" y="64" width="48" height="22" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.3"/><rect x="281" y="64" width="48" height="22" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.3"/><line x1="235" y1="90" x2="270" y2="190" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#ground-penetrating-radar-ar)"/><line x1="270" y1="190" x2="305" y2="90" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ground-penetrating-radar-ar-1)"/><line x1="245" y1="90" x2="424" y2="230" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#ground-penetrating-radar-ar)"/><line x1="434" y1="228" x2="315" y2="90" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ground-penetrating-radar-ar-1)"/><text x="205" y="56" text-anchor="end" font-size="12">송신 안테나</text><text x="335" y="56" font-size="12">수신 안테나</text><text x="40" y="178" font-size="12" style="fill:var(--si-general,#5c6b7f)">지층 경계</text><text x="500" y="216" text-anchor="end" font-size="12">매설물</text><text x="90" y="140" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">지하로 보낸 전자기파</text><text x="540" y="56" text-anchor="end" font-size="12">지표</text><text x="20" y="330" font-size="12" style="fill:var(--si-general,#5c6b7f)">주파수 약 10 MHz~2.6 GHz.  투과 깊이: 점토·염분 토양 수 cm, 얼음 수천 m</text></svg>
