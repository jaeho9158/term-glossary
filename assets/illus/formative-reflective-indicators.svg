<svg class="si si-illus" viewBox="0 0 360 684" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="반영지표와 형성지표: 화살표 방향과 VIF" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="formative-reflective-indicators-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="formative-reflective-indicators-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="26" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-blue-t,#12305c)">반영지표: 개념 → 지표</text><ellipse cx="180" cy="78" rx="66" ry="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="180" y="83" text-anchor="middle" font-weight="700">우울</text><rect x="54" y="152" width="92" height="36" rx="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="100" y="175" text-anchor="middle">불면</text><rect x="214" y="152" width="92" height="36" rx="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="260" y="175" text-anchor="middle">의욕 저하</text><line x1="150" y1="99" x2="112" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4" marker-end="url(#formative-reflective-indicators-ar)"/><line x1="210" y1="99" x2="248" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4" marker-end="url(#formative-reflective-indicators-ar)"/><text x="124" y="120" text-anchor="end" style="fill:var(--si-blue-t,#12305c)">적재량</text><text x="236" y="120" style="fill:var(--si-blue-t,#12305c)">적재량</text><text x="180" y="212" text-anchor="middle">지표 간 상관이 높아야 한다</text><text x="180" y="234" text-anchor="middle">지표 하나를 빼도 개념 의미는 거의 그대로</text><line x1="20" y1="256" x2="340" y2="256" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="180" y="286" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">형성지표: 지표 → 개념</text><ellipse cx="180" cy="336" rx="82" ry="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="180" y="341" text-anchor="middle" font-weight="700">사회경제적 지위</text><rect x="14" y="422" width="92" height="36" rx="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="60" y="445" text-anchor="middle">소득</text><rect x="134" y="422" width="92" height="36" rx="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="180" y="445" text-anchor="middle">학력</text><rect x="254" y="422" width="92" height="36" rx="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="300" y="445" text-anchor="middle">직업</text><line x1="72" y1="420" x2="128" y2="358" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4" marker-end="url(#formative-reflective-indicators-ar-1)"/><line x1="180" y1="420" x2="180" y2="364" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4" marker-end="url(#formative-reflective-indicators-ar-1)"/><line x1="288" y1="420" x2="232" y2="358" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4" marker-end="url(#formative-reflective-indicators-ar-1)"/><text x="84" y="374" text-anchor="end" style="fill:var(--si-amber-t,#7a5210)">외부 가중치</text><text x="180" y="484" text-anchor="middle">지표 간 상관은 없어도 된다</text><text x="180" y="506" text-anchor="middle">지표를 빼면 개념 의미가 달라질 수 있다</text><line x1="20" y1="526" x2="340" y2="526" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><rect x="20" y="540" width="320" height="96" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.5"/><text x="32" y="564" font-weight="700">형성지표 점검: VIF = 1 ÷ (1 − R²)</text><text x="32" y="586">R² = .50 → VIF 2</text><text x="32" y="608">R² = .80 → VIF 5 (Hair 등, 2017: 5 이상이면 문제)</text><text x="20" y="662" style="fill:var(--si-general,#5c6b7f)">화살표 방향을 잘못 정하면 신뢰도·타당도 분석이 왜곡된다</text></svg>
