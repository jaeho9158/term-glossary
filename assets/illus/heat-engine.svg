<svg class="si si-illus" viewBox="0 0 520 350" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heat-engine-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="heat-engine-t">열기관의 에너지 흐름: 고온 열원, 열기관, 저온 열침</title><defs><marker id="heat-engine-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="heat-engine-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><rect x="130" y="18" width="260" height="52" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.1"/><text x="260" y="40" text-anchor="middle" font-size="12" font-weight="700">고온 열원 (예시 800 K)</text><text x="260" y="61" text-anchor="middle" font-size="11">T<tspan baseline-shift="sub" font-size="72%">h</tspan> = 800 K</text><rect x="160" y="130" width="200" height="60" style="stroke:currentColor;fill:currentColor" stroke-width="1.8" fill-opacity="0.2"/><text x="260" y="165" text-anchor="middle" font-size="14" font-weight="700">열기관</text><rect x="130" y="250" width="260" height="52" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.1"/><text x="260" y="272" text-anchor="middle" font-size="12" font-weight="700">저온 열침 (예시 300 K)</text><text x="260" y="293" text-anchor="middle" font-size="11">T<tspan baseline-shift="sub" font-size="72%">c</tspan> = 300 K</text><line x1="220" y1="70" x2="220" y2="130" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="4.5" marker-end="url(#heat-engine-ar)"/><line x1="220" y1="190" x2="220" y2="250" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="3" marker-end="url(#heat-engine-ar-1)"/><line x1="360" y1="160" x2="470" y2="160" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.5" marker-end="url(#heat-engine-ar)"/><text x="180" y="104" text-anchor="end" font-size="12" font-style="italic">Q<tspan baseline-shift="sub" font-size="72%">h</tspan></text><text x="180" y="224" text-anchor="end" font-size="12" font-style="italic">Q<tspan baseline-shift="sub" font-size="72%">c</tspan></text><text x="415" y="148" text-anchor="middle" font-size="12" font-style="italic">W</text><text x="260" y="335" text-anchor="middle" font-size="12">효율 η = W/Q<tspan baseline-shift="sub" font-size="72%">h</tspan> = 1 − Q<tspan baseline-shift="sub" font-size="72%">c</tspan>/Q<tspan baseline-shift="sub" font-size="72%">h</tspan>,  카르노 한계 1 − T<tspan baseline-shift="sub" font-size="72%">c</tspan>/T<tspan baseline-shift="sub" font-size="72%">h</tspan></text></svg>
