<svg class="si si-illus" viewBox="0 0 336 796" style="max-width:336px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crosslinking-immunoprecipitation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="crosslinking-immunoprecipitation-t">CLIP: 자외선 가교, 절단, 항체 회수, 역전사 정지로 결합 위치 판독</title><defs><marker id="crosslinking-immunoprecipitation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker><marker id="crosslinking-immunoprecipitation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><text x="20" y="22" font-weight="700">① 자외선 가교</text><path d="M20,128 C30,126.3 60,117.7 80,118 C100,118.3 120,130 140,130 C160,130 180,118 200,118 C220,118 240.7,129.7 260,130 C279.3,130.3 306.7,121.7 316,120" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><ellipse cx="170" cy="96" rx="34" ry="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="170" y="100" text-anchor="middle">단백질</text><path d="M240.6,43 L230.2,58.1 L237.5,58.1 L235.4,69 L245.8,53.4 L238.5,53.4Z" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.5"/><text x="262" y="60" style="fill:var(--si-amber-s,#d79a2b)">자외선</text><line x1="164" y1="115" x2="176" y2="127" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="164" y1="127" x2="176" y2="115" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="40" y="108" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">RNA</text><text x="20" y="160" style="fill:var(--si-rose-s,#c97b7b)">빨간 ×: 공유결합 가교점</text><text x="20" y="204" font-weight="700">② RNA를 짧게 자름</text><path d="M20,284 C28.3,282.7 55,275.7 70,276 C85,276.3 103.3,284.3 110,286" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" stroke-dasharray="4 3" opacity="0.35"/><path d="M232,286 C238.3,284.3 256,276.3 270,276 C284,275.7 308.3,282.7 316,284" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" stroke-dasharray="4 3" opacity="0.35"/><line x1="116" y1="266" x2="126" y2="298" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="226" y1="266" x2="236" y2="298" style="stroke:currentColor;fill:none" stroke-width="1.6"/><path d="M130,289 C137.7,288.3 160.7,285 176,285 C191.3,285 214.3,288.3 222,289" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="4"/><ellipse cx="176" cy="258" rx="34" ry="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><line x1="170" y1="276" x2="182" y2="288" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="170" y1="288" x2="182" y2="276" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="20" y="326" style="fill:var(--si-general,#5c6b7f)">단백질이 보호한 짧은 RNA 조각만 남는다.</text><text x="20" y="360" font-weight="700">③ 항체로 단백질 끌어올림</text><ellipse cx="120" cy="456" rx="34" ry="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><path d="M86,485 C91.7,484.5 108.3,482 120,482 C131.7,482 150,484.5 156,485" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="4"/><line x1="115" y1="474" x2="125" y2="484" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="115" y1="484" x2="125" y2="474" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="120" y1="420" x2="120" y2="398" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><line x1="120" y1="420" x2="106" y2="436" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><line x1="120" y1="420" x2="134" y2="436" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><text x="150" y="420" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">항체</text><circle cx="120" cy="388" r="10" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="138" y="388" style="fill:var(--si-green-s,#5b9b83)">구슬</text><ellipse cx="250" cy="460" rx="22" ry="15" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="274" y1="460" x2="322" y2="460" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#crosslinking-immunoprecipitation-ar)"/><text x="322" y="438" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">비특이 결합물</text><text x="20" y="506" style="fill:var(--si-general,#5c6b7f)">세척·전기영동으로 비특이 결합물을 걸러낸다.</text><text x="20" y="544" font-weight="700">④ 역전사 정지로 위치 판독</text><path d="M100,604 C106.7,603 125,597.7 140,598 C155,598.3 173.3,606 190,606 C206.7,606 223.3,598.3 240,598 C256.7,597.7 281.7,603 290,604" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="4"/><line x1="145" y1="597" x2="155" y2="607" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="145" y1="607" x2="155" y2="597" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="290" y1="624" x2="186" y2="624" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" stroke-dasharray="5 3"/><ellipse cx="150" cy="628" rx="36" ry="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="150" y="632" text-anchor="middle" font-size="12">역전사 효소</text><line x1="260" y1="648" x2="190" y2="648" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.8" marker-end="url(#crosslinking-immunoprecipitation-ar-1)"/><text x="262" y="670" text-anchor="middle" style="fill:var(--si-green-s,#5b9b83)">역전사 진행</text><text x="20" y="694" style="fill:var(--si-general,#5c6b7f)">가교점에서 멈추거나 변이가 생겨</text><text x="20" y="714" style="fill:var(--si-general,#5c6b7f)">결합 위치가 염기 수준으로 좁혀진다.</text><text x="20" y="756" style="fill:var(--si-general,#5c6b7f)">항체 특이성에 좌우되며, 음성이어도</text><text x="20" y="776" style="fill:var(--si-general,#5c6b7f)">결합하지 않는다고 단정할 수 없다.</text></svg>
