<svg class="si si-illus" viewBox="0 0 360 528" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="신용할당: 은행 기대수익이 최대인 금리에서 초과수요가 남는다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="credit-rationing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="credit-rationing-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="18" text-anchor="middle" font-weight="700">① 은행 기대수익은 금리 r*에서 최대</text><line x1="56" y1="40" x2="56" y2="204" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="56" y1="204" x2="332" y2="204" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#credit-rationing-ar)"/><text x="10" y="36" font-weight="700">은행 기대수익</text><text x="332" y="226" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">대출금리</text><path d="M56,200 C62.7,189.3 80.3,155 96,136 C111.7,117 128.2,97.7 150,86 C171.8,74.3 206,65 227,66 C248,67 259.2,76.7 276,92 C292.8,107.3 319.3,147 328,158" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><line x1="227" y1="70" x2="227" y2="204" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="227" y="226" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">r*</text><text x="227" y="50" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">수익 최대</text><text x="235" y="178">안전한 차입자 이탈</text><text x="235" y="196" style="fill:var(--si-general,#5c6b7f)">(역선택)</text><text x="350" y="62" text-anchor="end">위험 사업 증가</text><text x="350" y="80" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">(도덕적 해이)</text><line x1="10" y1="250" x2="350" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><text x="180" y="274" text-anchor="middle" font-weight="700">② r*에서 대출 수요가 공급을 넘는다</text><line x1="56" y1="298" x2="56" y2="446" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="56" y1="446" x2="332" y2="446" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#credit-rationing-ar)"/><text x="10" y="292" font-weight="700">대출량</text><text x="332" y="468" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">대출금리</text><line x1="56" y1="316" x2="324" y2="441" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><text x="64" y="308" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">수요</text><path d="M56,442 C65,441.3 91,439.3 110,438 C129,436.7 150.5,435.2 170,434 C189.5,432.8 207,430.7 227,431 C247,431.3 273.8,434.3 290,436 C306.2,437.7 318.3,440.2 324,441" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><text x="64" y="426" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">공급</text><line x1="227" y1="298" x2="227" y2="446" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="239" y1="399.8" x2="239" y2="428" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#credit-rationing-ar-1)" marker-start="url(#credit-rationing-ar-1)"/><text x="268" y="340" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">초과수요</text><line x1="270" y1="346" x2="239" y2="397.8" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="239" cy="397.8" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="268" y="360" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">= 대출 거절</text><circle cx="324" cy="441" r="5" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2"/><text x="342" y="376" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">이 금리까지</text><text x="342" y="394" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">올리지 않음</text><line x1="326" y1="400" x2="323" y2="434" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><text x="180" y="494" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">금리를 더 올리지 않고 대출 거절로</text><text x="180" y="514" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">배분 (Stiglitz·Weiss 1981)</text></svg>
