<svg class="si si-illus" viewBox="0 0 360 658" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="funding-bias-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="funding-bias-t">연구비 지원이 설계·선별·발표를 거쳐 결과를 기울인다</title><defs><marker id="funding-bias-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="funding-bias-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">연구비 지원 구조가 만드는 쏠림</text><rect x="60" y="34" width="240" height="36" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="180" y="57" text-anchor="middle" font-weight="700">연구비를 지원한 기업·단체</text><polygon points="187,74 187,86.4 194,86.4 180,106 166,86.4 173,86.4 173,74" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4" fill-opacity="0.35"/><rect x="16" y="110" width="328" height="48" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="28" y="130" font-weight="700">① 연구 설계</text><text x="28" y="149">비교 약물의 용량을 불리하게 설정</text><line x1="180" y1="160" x2="180" y2="170" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#funding-bias-ar)"/><rect x="16" y="172" width="328" height="48" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="28" y="192" font-weight="700">② 대상자 선별</text><text x="28" y="211">유리한 특성의 대상자를 선별</text><line x1="180" y1="222" x2="180" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#funding-bias-ar)"/><rect x="16" y="234" width="328" height="48" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="28" y="254" font-weight="700">③ 결과 발표</text><text x="28" y="273">부정적 결과는 발표하지 않음</text><line x1="180" y1="284" x2="180" y2="310" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#funding-bias-ar-1)"/><polygon points="180,360 158,440 202,440" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><line x1="140" y1="440" x2="220" y2="440" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="76" y1="392" x2="284" y2="346" style="stroke:currentColor;fill:none" stroke-width="3"/><circle cx="180" cy="369" r="5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><line x1="76" y1="392" x2="48" y2="420" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><line x1="76" y1="392" x2="104" y2="420" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><path d="M40 420 H112 Q108 436 76 436 Q44 436 40 420 Z" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="64" y="408" width="24" height="12" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.6"/><line x1="284" y1="346" x2="256" y2="374" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><line x1="284" y1="346" x2="312" y2="374" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><path d="M248 374 H320 Q316 390 284 390 Q252 390 248 374 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="274" y="362" width="20" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.5"/><text x="76" y="462" text-anchor="middle" font-weight="700">지원사에 유리한</text><text x="76" y="480" text-anchor="middle" font-weight="700">결과</text><text x="284" y="418" text-anchor="middle">그 밖의 결과</text><text x="180" y="340" text-anchor="middle" font-weight="700">통계적으로 더 자주 보고된다</text><line x1="16" y1="500" x2="344" y2="500" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="524">개별 연구자의 부정행위라기보다 자금 지원 구조가</text><text x="16" y="543.5">만드는 체계적 경향이다.</text><text x="16" y="563">통계적 경향일 뿐, 개별 연구가 반드시 편향된 것은</text><text x="16" y="582.5">아니다.</text><text x="16" y="602">이해상충을 공개해도 funding bias가 사라지지 않는다.</text><text x="16" y="621.5" font-weight="700">대응: 메타분석에서 자금 출처별 하위그룹 분석,</text><text x="16" y="641">이해상충 공개 여부를 함께 코딩해 통제한다.</text></svg>
