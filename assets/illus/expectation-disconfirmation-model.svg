<svg class="si si-illus" viewBox="0 0 360 446" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expectation-disconfirmation-model-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="expectation-disconfirmation-model-t">기대 불일치 모형: 사전 기대 대비 성과의 방향과 크기가 만족을 가른다</title><defs><marker id="expectation-disconfirmation-model-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="expectation-disconfirmation-model-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-pos,#14543c)"/></marker><marker id="expectation-disconfirmation-model-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">기대 불일치 모형: 방향과 크기</text><text x="14" y="46" style="fill:var(--si-general,#5c6b7f)">성과 ≥ 기대 → 만족, 성과 &lt; 기대 → 불만족</text><line x1="70" y1="320" x2="70" y2="66" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#expectation-disconfirmation-model-ar)"/><text x="14" y="82" style="fill:var(--si-general,#5c6b7f)">높음</text><text x="14" y="318" style="fill:var(--si-general,#5c6b7f)">낮음</text><line x1="70" y1="190" x2="300" y2="190" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.2" stroke-dasharray="7 5"/><text x="302" y="195" font-weight="700" style="fill:var(--si-general,#5c6b7f)">사전 기대</text><line x1="110" y1="190" x2="110" y2="124" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="3.4" marker-end="url(#expectation-disconfirmation-model-ar-1)"/><circle cx="110" cy="110" r="6" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="1.6"/><text x="120" y="152" font-weight="700" style="fill:var(--si-pos,#14543c)">긍정적 불일치</text><text x="118" y="105">성과</text><line x1="190" y1="190" x2="190" y2="266" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4" marker-end="url(#expectation-disconfirmation-model-ar-2)"/><circle cx="190" cy="280" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="200" y="244" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">부정적 불일치</text><text x="198" y="300">성과</text><line x1="128" y1="110" x2="250" y2="110" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="2" marker-end="url(#expectation-disconfirmation-model-ar-1)"/><rect x="252" y="94" width="90" height="32" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="0" fill-opacity="0.2"/><text x="297" y="116" text-anchor="middle" font-weight="700" style="fill:var(--si-pos,#14543c)">만족</text><line x1="208" y1="280" x2="250" y2="280" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#expectation-disconfirmation-model-ar-2)"/><rect x="252" y="264" width="90" height="32" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="0" fill-opacity="0.5"/><text x="297" y="285" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">불만족</text><text x="180" y="350" text-anchor="middle" font-weight="700">만족 → 재구매의도 · 구전행동 · 고객충성도</text><text x="14" y="404" font-weight="700" style="fill:var(--si-accent,#2454ff)">화살표의 방향 = 불일치의 방향, 길이 = 크기</text><text x="14" y="428" style="fill:var(--si-general,#5c6b7f)">속성 중요도가 불일치의 방향·크기와 함께 작용</text></svg>
