ight="30" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="180" y="262" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">근육 조직</text><line x1="20" y1="292" x2="340" y2="292" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="20" y="320" font-weight="700">VO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> = 심박출량(중심)</tspan></text><text x="20" y="340" font-weight="700">× C<tspan dy="0.217em" font-size="92%">(a−v)</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">(말초)</tspan></text><text x="20" y="370">가상 예: 25 L/min × 160 mL/L</text><text x="20" y="390">= 4,000 mL/min</text><text x="20" y="420" style="fill:var(--si-general,#5c6b7f)">산소함량 = Hb×1.34×SaO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> + 0.0032×PO</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><text x="20" y="440" style="fill:var(--si-general,#5c6b7f)">Hb는 g/dL, PO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">는 torr</tspan></text></svg>
