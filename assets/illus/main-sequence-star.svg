<svg class="si si-illus" viewBox="0 0 360 436" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="H-R도 위의 주계열: 질량이 위치와 수명을 정한다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="main-sequence-star-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><rect x="50" y="40" width="290" height="300" style="stroke:currentColor;fill:none" stroke-width="1.6"/><polygon points="70,60 110,60 325,270 325,310 290,310 70,95" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.28"/><circle cx="98" cy="82" r="11" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><circle cx="268" cy="255" r="5" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1"/><line x1="200" y1="285" x2="80" y2="168" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#main-sequence-star-ar)"/><text x="60" y="236" font-weight="700" style="fill:var(--si-general,#5c6b7f)">질량 증가</text><text x="162" y="60" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">고질량:</text><text x="162" y="80" style="fill:var(--si-blue-s,#7f9ac0)">주계열 기간 짧음</text><line x1="160" y1="66" x2="109" y2="80" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="0.9"/><text x="150" y="326" font-weight="700" style="fill:var(--si-limit,#7d2626)">저질량:</text><text x="198" y="326" style="fill:var(--si-limit,#7d2626)">주계열 기간 김</text><line x1="258" y1="308" x2="266" y2="262" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="0.9"/><text x="250" y="108" font-size="14" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">주계열</text><text x="250" y="130">중심핵 H→He</text><text x="250" y="150">융합, 안정기</text><line x1="248" y1="126" x2="228" y2="178" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="0.9"/><text x="195" y="366" text-anchor="middle" font-weight="700">표면 온도</text><text x="50" y="366" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">고온</text><text x="340" y="366" text-anchor="end" font-weight="700" style="fill:var(--si-limit,#7d2626)">저온</text><text x="8" y="26" font-weight="700">광도(밝기) ↑ 밝음</text><text x="180" y="392" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">띠 폭은 금속함량·진화 정도에 따라 생긴다</text><text x="180" y="416" text-anchor="middle" font-weight="700">항성 일생의 약 90 %를 주계열에서 보낸다</text></svg>
