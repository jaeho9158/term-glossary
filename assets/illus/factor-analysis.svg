<svg class="si si-illus" viewBox="0 0 360 588" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="factor-analysis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="factor-analysis-t">요인분석: 공통 요인이 문항 사이의 상관을 만든다</title><defs><marker id="factor-analysis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="factor-analysis-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><ellipse cx="62" cy="170" rx="44" ry="30" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2.4"/><text x="62" y="176" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" style="fill:var(--si-violet-s,#9382bd)">f</text><text x="62" y="226" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">공통 요인</text><text x="62" y="250" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(원: 숨은 변수)</text><rect x="164" y="82" width="96" height="44" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.2"/><text x="212" y="109" text-anchor="middle" font-weight="700">문항 1 (x<tspan baseline-shift="sub" font-size="92%">1</tspan>)</text><rect x="164" y="198" width="96" height="44" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.2"/><text x="212" y="225" text-anchor="middle" font-weight="700">문항 2 (x<tspan baseline-shift="sub" font-size="92%">2</tspan>)</text><line x1="103" y1="152" x2="162" y2="114" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4" marker-end="url(#factor-analysis-ar)"/><line x1="103" y1="188" x2="162" y2="212" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4" marker-end="url(#factor-analysis-ar)"/><text x="120" y="120" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">.78</text><text x="120" y="232" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">.72</text><circle cx="212" cy="40" r="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="212" y="45" text-anchor="middle">ε<tspan baseline-shift="sub" font-size="92%">1</tspan></text><line x1="212" y1="56" x2="212" y2="80" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" marker-end="url(#factor-analysis-ar-1)"/><circle cx="212" cy="284" r="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="212" y="289" text-anchor="middle">ε<tspan baseline-shift="sub" font-size="92%">2</tspan></text><line x1="212" y1="268" x2="212" y2="246" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" marker-end="url(#factor-analysis-ar-1)"/><path d="M262 106 C320 112 320 214 262 218" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" stroke-dasharray="5 4"/><text x="310" y="168" font-weight="700" style="fill:var(--si-accent,#2454ff)">.562</text><line x1="14" y1="312" x2="346" y2="312" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="180" y="332" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">예측 상관 = .78 × .72 = .562</text><text x="180" y="358" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">문항끼리는 공통 요인 f를 거쳐서 상관이 생긴다</text><text x="180" y="392" text-anchor="middle" font-size="15" font-weight="700">x = Λf + ε</text><text x="40" y="428" font-weight="700" font-style="italic" style="fill:var(--si-blue-s,#7f9ac0)">x</text><text x="66" y="428">관측 변수 = 사각형</text><text x="40" y="454" font-weight="700" font-style="italic" style="fill:var(--si-violet-s,#9382bd)">f</text><text x="66" y="454">공통 요인 = 큰 원</text><text x="40" y="480" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">Λ</text><text x="66" y="480">적재량 = f에서 x로 가는 화살표</text><text x="40" y="506" font-weight="700" font-style="italic" style="fill:var(--si-gray-s,#aab6c6)">ε</text><text x="66" y="506">고유 오차 = 작은 원</text><text x="14" y="546" style="fill:var(--si-general,#5c6b7f)">요인 수와 이름은 기준·회전에 따른</text><text x="14" y="570" style="fill:var(--si-general,#5c6b7f)">연구자의 판단이다</text></svg>
