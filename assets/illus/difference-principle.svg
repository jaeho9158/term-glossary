<svg class="si si-illus" viewBox="0 0 360 392" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="차등의 원칙: 최소 수혜자의 몫이 가장 큰 사회 구조를 고른다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="14" y="22" font-weight="700">무지의 베일 아래,</text><text x="14" y="42" font-weight="700">최솟값이 가장 큰 구조를 택한다</text><text x="14" y="74" style="fill:var(--si-general,#5c6b7f)">세로: 가장 불리한 집단의 소득(가상 값)</text><line x1="20" y1="300" x2="346" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="54" y="236.7" width="56" height="63.3" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="82" y="258.7" text-anchor="middle" font-weight="700">10,000</text><text x="82" y="322" text-anchor="middle" font-weight="400">구조 A</text><rect x="118" y="224" width="56" height="76" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="146" y="246" text-anchor="middle" font-weight="700">12,000</text><text x="146" y="322" text-anchor="middle" font-weight="400">구조 B</text><rect x="182" y="110" width="56" height="190" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><text x="210" y="132" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">30,000</text><text x="210" y="322" text-anchor="middle" font-weight="700">구조 C</text><rect x="246" y="173.3" width="56" height="126.7" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="274" y="195.3" text-anchor="middle" font-weight="700">20,000</text><text x="274" y="322" text-anchor="middle" font-weight="400">구조 D</text><text x="210" y="170" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">선택</text><line x1="20" y1="110" x2="346" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="20" y="102" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">최소 수혜자 몫의 최댓값(maximin)</text><text x="14" y="350" font-weight="700">불평등은 최소 수혜자에게</text><text x="14" y="370" font-weight="700">최대 이익일 때만 정당화된다</text></svg>
