<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thermal-conductivity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="thermal-conductivity-t">벽을 통한 정상 열전도</title><defs><marker id="thermal-conductivity-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="thermal-conductivity-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="160" y="60" width="120" height="180" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.8" fill-opacity="0.18"/><line x1="160" y1="80" x2="280" y2="215" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><circle cx="160" cy="80" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="280" cy="215" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="150" y="84" text-anchor="end" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">T<tspan baseline-shift="sub" font-size="72%">1</tspan> (고온 면)</text><text x="290" y="219" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">T<tspan baseline-shift="sub" font-size="72%">2</tspan> (저온 면)</text><text x="226" y="120" font-size="11">직선 온도 분포</text><line x1="175" y1="42" x2="265" y2="42" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4" marker-end="url(#thermal-conductivity-ar)"/><text x="220" y="32" text-anchor="middle" font-style="italic" style="fill:var(--si-amber-s,#d79a2b)">q</text><line x1="160" y1="256" x2="280" y2="256" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#thermal-conductivity-ar-1)" marker-start="url(#thermal-conductivity-ar-1)"/><text x="220" y="274" text-anchor="middle" font-size="11">L = 100 mm</text><line x1="160" y1="300" x2="290" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#thermal-conductivity-ar-1)"/><text x="300" y="304" font-size="12" font-style="italic">x</text><text x="330" y="90">q = k ΔT / L</text><text x="330" y="114" font-size="11">콘크리트 k = 1.4, ΔT = 20 K</text><text x="330" y="134" font-size="11">→ q = 1.4 × 20 ÷ 0.1 = 280 W/m²</text><text x="330" y="162" font-size="11">k가 40배 다르면 같은 두께에서</text><text x="330" y="183" font-size="11">열유속도 40배</text></svg>
