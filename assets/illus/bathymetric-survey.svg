<svg class="si si-illus" viewBox="0 0 360 620" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="수심 측량: 다중빔 부채꼴과 수심 계산" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="bathymetric-survey-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="bathymetric-survey-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="bathymetric-survey-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">수심 측량: 다중빔이 해저를 훑는다</text><rect x="14" y="86" width="332" height="190" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="0" fill-opacity="0.3"/><path d="M14 266 L14 266 L30 262 L70 250 L105 244 L140 254 L180 246 L215 250 L250 240 L290 252 L330 262 L346 266 L346 336 L14 336 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><line x1="14" y1="86" x2="346" y2="86" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><path d="M150 68 L210 68 L202 86 L158 86 Z" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2"/><rect x="170" y="54" width="22" height="14" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><rect x="174" y="86" width="12" height="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><line x1="180" y1="98" x2="30" y2="262" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.3"/><circle cx="30" cy="262" r="3" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><line x1="180" y1="98" x2="93.4" y2="246" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.3"/><circle cx="93.4" cy="246" r="3" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><line x1="180" y1="98" x2="266.6" y2="245" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.3"/><circle cx="266.6" cy="245" r="3" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><line x1="180" y1="98" x2="330" y2="262" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.3"/><circle cx="330" cy="262" r="3" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><line x1="174" y1="114" x2="174" y2="244" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#bathymetric-survey-ar)"/><line x1="186" y1="244" x2="186" y2="114" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#bathymetric-survey-ar-1)"/><text x="14" y="126" font-weight="700">빔 약 256개</text><text x="14" y="148" font-weight="700">폭 90~170°</text><g class="si-marker"><circle cx="204" cy="172" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="204" y="176" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">1</text></g><text x="214" y="104" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">트랜스듀서</text><line x1="212" y1="100" x2="190" y2="93" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="20" y="316" font-weight="700">해저</text><line x1="30" y1="268" x2="30" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="330" y1="268" x2="330" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="30" y1="290" x2="330" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#bathymetric-survey-ar-2)" marker-start="url(#bathymetric-survey-ar-2)"/><text x="180" y="316" text-anchor="middle" font-weight="700">측심 폭(스와스)</text><text x="14" y="352" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">원 1 = 중앙 빔, 왕복 0.0160 s</text><text x="14" y="388" font-weight="700">수심 = 음속 × 왕복 시간 ÷ 2</text><text x="14" y="412">= 1,500 m/s × 0.0160 s ÷ 2 = 12.00 m</text><rect x="14" y="428" width="332" height="64" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6" fill-opacity="0.5"/><text x="24" y="452" font-weight="700">실제 음속 1,480 m/s이면</text><text x="24" y="478" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">11.84 m (−0.16 m, 1.3%)</text><text x="14" y="524" font-weight="700">기준면 통일(가정 예시)</text><text x="14" y="548">12.00 + 0.5 − 1.3 = 11.2 m</text><text x="14" y="572" style="fill:var(--si-general,#5c6b7f)">트랜스듀서는 수면 아래 0.5 m, 조위 1.3 m</text><text x="14" y="602" style="fill:var(--si-general,#5c6b7f)">측심 갱신은 초당 0.1~50회</text></svg>
