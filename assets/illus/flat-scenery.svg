<svg class="si si-illus" viewBox="0 0 560 370" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="플랫의 골조" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>무대 플랫을 뒤에서 본 골조. 위아래 레일, 양옆 스타일, 가운데 토글이 사각 틀을 이루고, 모서리는 모서리 블록, 토글과 스타일 이음은 키스톤으로 잡는다</desc><defs></defs><rect x="180" y="40" width="200" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><rect x="180" y="324" width="200" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><rect x="180" y="56" width="16" height="268" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><rect x="364" y="56" width="16" height="268" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><rect x="196" y="140" width="168" height="12" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><rect x="196" y="230" width="168" height="12" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><polygon points="196,56 230,56 196,90" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1" fill-opacity="0.35"/><polygon points="364,56 330,56 364,90" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1" fill-opacity="0.35"/><polygon points="196,324 230,324 196,290" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1" fill-opacity="0.35"/><polygon points="364,324 330,324 364,290" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1" fill-opacity="0.35"/><rect x="190" y="136" width="16" height="20" style="stroke:var