<svg class="si si-illus" viewBox="0 0 600 360" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boiling-water-reactor-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="boiling-water-reactor-t">비등경수로</title><desc>압력용기 안 노심에서 물이 끓어 생긴 증기가 분리기와 건조기를 거쳐 곧바로 터빈을 돌리고, 복수기에서 물로 돌아와 급수로 다시 노심에 들어간다. 제어봉은 아래에서 넣는다</desc><defs><marker id="boiling-water-reactor-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><rect x="70" y="50" width="170" height="250" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.8" fill-opacity="0.08"/><rect x="100" y="195" width="110" height="75" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.35"/><rect x="100" y="80" width="110" height="45" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.15"/><line x1="120" y1="330" x2="120" y2="240" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="155" y1="330" x2="155" y2="240" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="190" y1="330" x2="190" y2="240" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="155" y1="50" x2="155" y2="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><line x1="155" y1="30" x2="400" y2="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#boiling-water-reactor-ar)"/><line x1="400" y1="30" x2="400" y2="62" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><polygon points="370,62 430,62 450,122 350,122" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.25"/><line x1="450" y1="92" x2="480" y2="92" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><circle cx="505" cy="92" r="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.2" fill-opacity="0.2"/><line x1="400" y1="122" x2="400" y2="190" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#boiling-water-reactor-ar)"/><rect x="350" y="190" width="100" height="55" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.1"/><line x1="400" y1="245" x2="400" y2="280" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><line x1="270" y1="280" x2="270" y2="180" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><line x1="270" y1="180" x2="240" y2="180" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#boiling-water-reactor-ar)"/><line x1="400" y1="280" x2="270" y2="280" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><text x="155" y="236" text-anchor="middle">노심</text><text x="155" y="107" text-anchor="middle" font-size="11">증기 분리기·건조기</text><text x="400" y="100" text-anchor="middle" font-size="12">터빈</text><text x="505" y="135" text-anchor="middle" font-size="12">발전기</text><text x="400" y="222" text-anchor="middle" font-size="12">복수기</text><text x="320" y="298" text-anchor="middle" font-size="12">급수</text><text x="280" y="22" text-anchor="middle" font-size="12">증기</text><text x="260" y="345" font-size="12">제어봉(아래에서 삽입)</text><line x1="256" y1="341" x2="192" y2="320" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="300" y="160" font-size="12">압력용기</text><line x1="296" y1="160" x2="242" y2="160" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
