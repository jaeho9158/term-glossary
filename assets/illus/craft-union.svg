tyle="fill:var(--si-rose-s,#c97b7b)">기업별</text><text x="298" y="96" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">산업별</text><text x="120" y="354" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">직업별</text><rect x="10" y="371" width="22" height="16" rx="3" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="42" y="384">직업별 노조: 같은 직종이면 회사·산업 무관</text><rect x="10" y="401" width="22" height="16" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2" stroke-dasharray="6 4"/><text x="42" y="414">기업별 노조: 같은 회사(예: A사) 소속</text><rect x="10" y="431" width="22" height="16" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="42" y="444">산업별 노조: 같은 산업 전체(예: 건설산업)</text><text x="10" y="484" style="fill:var(--si-general,#5c6b7f)">A·B·C사와 직종은 예시이다. 직업별 노조는 목수 열을</text><text x="10" y="506" style="fill:var(--si-general,#5c6b7f)">회사와 산업의 경계를 넘어 세로로 묶는다.</text></svg>
