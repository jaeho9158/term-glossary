"stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="22" y="447" text-anchor="middle" font-weight="700">3</text><text x="40" y="446">자유평면: 내력벽이 없어 칸막이를 마음대로 놓는다</text><circle cx="22" cy="468" r="9" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="22" y="473" text-anchor="middle" font-weight="700">4</text><text x="40" y="472">자유입면: 외벽이 구조에서 풀려 기둥과 무관하다</text><circle cx="22" cy="494" r="9" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="22" y="499" text-anchor="middle" font-weight="700">5</text><text x="40" y="498">수평창: 띠 모양으로 길게 이어진 창</text><rect x="12" y="518" width="18" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="40" y="530" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">기둥·슬래브: 하중을 진다</text><rect x="12" y="544" width="18" height="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="40" y="556" font-weight="700">외벽: 하중에서 해방된다</text><text x="12" y="592" font-weight="700">비교: 조적조·목구조</text><rect x="24" y="622" width="26" height="64" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.2"/><rect x="124" y="622" width="26" height="64" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.2"/><rect x="24" y="610" width="126" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.2"/><line x1="14" y1="686" x2="160" y2="686" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="172" y="648">벽이 하중을 진다</text><text x="172" y="667">→ 다섯 원칙을</text><text x="172" y="686">그대로 적용하기 어렵다</text></svg>
