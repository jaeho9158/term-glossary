<svg class="si si-illus" viewBox="0 0 600 320" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atmospheric-circulation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="atmospheric-circulation-t">대기 대순환의 세 세포</title><desc>북반구 위도 단면. 적도에서 오른 공기가 30도 부근에서 내려오는 해들리 순환, 30~60도의 페렐 순환, 60도 부근에서 오른 공기가 극 쪽에서 내려오는 극 순환을 화살표 고리로 그렸다. 지표에는 해들리 순환 아래 무역풍, 페렐 순환 아래 편서풍이 분다</desc><defs><marker id="atmospheric-circulation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="atmospheric-circulation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="atmospheric-circulation-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><line x1="50" y1="260" x2="550" y2="260" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="60" y1="256" x2="60" y2="264" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="60" y="282" text-anchor="middle" font-size="12">적도 0°</text><line x1="220" y1="256" x2="220" y2="264" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="220" y="282" text-anchor="middle" font-size="12">30°</text><line x1="380" y1="256" x2="380" y2="264" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="380" y="282" text-anchor="middle" font-size="12">60°</text><line x1="540" y1="256" x2="540" y2="264" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="540" y="282" text-anchor="middle" font-size="12">극 90°</text><line x1="72" y1="245" x2="72" y2="110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar)"/><line x1="72" y1="104" x2="208" y2="104" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar)"/><line x1="208" y1="110" x2="208" y2="245" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar)"/><line x1="208" y1="251" x2="72" y2="251" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar)"/><line x1="368" y1="245" x2="368" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-1)"/><line x1="368" y1="104" x2="232" y2="104" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-1)"/><line x1="232" y1="110" x2="232" y2="245" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-1)"/><line x1="232" y1="251" x2="368" y2="251" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-1)"/><line x1="392" y1="245" x2="392" y2="110" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-2)"/><line x1="392" y1="104" x2="528" y2="104" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-2)"/><line x1="528" y1="110" x2="528" y2="245" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-2)"/><line x1="528" y1="251" x2="392" y2="251" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#atmospheric-circulation-ar-2)"/><text x="140" y="180" text-anchor="middle" font-size="12" font-weight="700">해들리 순환</text><text x="300" y="180" text-anchor="middle" font-size="12" font-weight="700">페렐 순환</text><text x="460" y="180" text-anchor="middle" font-size="12" font-weight="700">극 순환</text><text x="140" y="306" text-anchor="middle" font-size="12">무역풍</text><text x="300" y="306" text-anchor="middle" font-size="12">편서풍</text><text x="140" y="80" text-anchor="middle" font-size="11">적도에서 상승</text><text x="460" y="80" text-anchor="middle" font-size="11">60° 부근 상승</text></svg>
