.8"/><rect x="60" y="204" width="16" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.8"/><rect x="80" y="176" width="16" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.8"/><rect x="100" y="148" width="16" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.8"/><rect x="120" y="120" width="16" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.8"/><rect x="140" y="92" width="16" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.8"/><line x1="22" y1="246" x2="150" y2="67" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#broadbanding-ar-1)"/><text x="84" y="352" text-anchor="middle">승진마다 상한 재설정</text><line x1="166" y1="170" x2="194" y2="170" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#broadbanding-ar-2)"/><text x="180" y="158" text-anchor="middle">통합</text><rect x="204" y="190" width="40" height="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.38"/><rect x="256" y="125" width="40" height="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.38"/><rect x="308" y="60" width="40" height="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.38"/><line x1="276" y1="229" x2="276" y2="132" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2" marker-end="url(#broadbanding-ar-1)"/><line x1="236" y1="212" x2="264" y2="212" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#broadbanding-ar-3)"/><text x="274" y="352" text-anchor="middle">밴드 안에서 급여 성장</text><tex