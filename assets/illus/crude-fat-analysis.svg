<circle cx="26" cy="484" r="9" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><text x="26" y="488" text-anchor="middle" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text><text x="42" y="488">응축: 식어서 시료 위로 떨어짐</text><circle cx="26" cy="506" r="9" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><text x="26" y="510" text-anchor="middle" font-weight="700" style="fill:var(--si-bg,#ffffff)">4</text><text x="42" y="510">시료 용기(thimble)</text><circle cx="26" cy="528" r="9" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><text x="26" y="532" text-anchor="middle" font-weight="700" style="fill:var(--si-bg,#ffffff)">5</text><text x="42" y="532">용매가 차며 지방이 녹음</text><circle cx="26" cy="550" r="9" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><text x="26" y="554" text-anchor="middle" font-weight="700" style="fill:var(--si-bg,#ffffff)">6</text><text x="42" y="554">사이펀: 용매를 플라스크로 회수</text><circle cx="26" cy="572" r="9" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1"/><text x="26" y="576" text-anchor="middle" font-weight="700" style="fill:var(--si-bg,#ffffff)">7</text><text x="42" y="576">수위가 꼭대기에 닿으면 한꺼번에 회수</text><text x="14" y="628" font-weight="700">같은 지방 0.400 g, 기준에 따라 비율이 달라짐</text><rect x="20" y="650" width="300" height="22" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><rect x="20" y="650" width="24" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><text x="20" y="690">원물 5.000 g 기준: 0.400 ÷ 5.000 = 8.0%</text><rect x="20" y="714" width="90" height="22" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><rect x="20" y="714" width="24" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><text x="20" y="754">건조물 1.50 g 기준: 0.400 ÷ 1.50 = 26.7%</text><text x="20" y="774" style="fill:var(--si-amber-t,#7a5210)">주황: 지방 0.400 g (수분 70% 시료)</text></svg>
