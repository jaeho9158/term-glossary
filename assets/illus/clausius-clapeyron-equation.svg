<svg class="si si-illus" viewBox="0 0 360 668" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clausius-clapeyron-equation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="clausius-clapeyron-equation-t">클라우지우스-클라페롱 식: 증기압 곡선과 ln P–1/T 직선</title><defs><marker id="clausius-clapeyron-equation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="24" font-weight="700">① 증기압 곡선 P–T</text><line x1="52" y1="210" x2="336" y2="210" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="52" y1="210" x2="52" y2="42" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="52" y1="210" x2="52" y2="215" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="52" y="230" text-anchor="middle">300</text><line x1="194" y1="210" x2="194" y2="215" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="194" y="230" text-anchor="middle">350</text><line x1="336" y1="210" x2="336" y2="215" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="336" y="230" text-anchor="middle">400</text><line x1="48" y1="145.2" x2="52" y2="145.2" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="45" y="149.2" text-anchor="end">100</text><line x1="48" y1="80.4" x2="52" y2="80.4" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="45" y="84.4" text-anchor="end">200</text><text x="336" y="250" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">T (K)</text><text x="60" y="50" style="fill:var(--si-general,#5c6b7f)">P (kPa)</text><path d="M52,207.3 C53.9,207.2 59.6,206.9 63.4,206.7 C67.2,206.5 70.9,206.2 74.7,205.9 C78.5,205.6 82.3,205.3 86.1,205 C89.9,204.7 93.6,204.3 97.4,203.9 C101.2,203.5 105,203.1 108.8,202.6 C112.6,202.1 116.4,201.6 120.2,201 C124,200.4 127.7,199.8 131.5,199.2 C135.3,198.5 139.1,197.9 142.9,197.1 C146.7,196.3 150.4,195.5 154.2,194.6 C158,193.7 161.8,192.7 165.6,191.7 C169.4,190.7 173.2,189.6 177,188.4 C180.8,187.2 184.5,185.9 188.3,184.5 C192.1,183.1 195.9,181.7 199.7,180.1 C203.5,178.5 207.2,176.9 211,175.1 C214.8,173.3 218.6,171.4 222.4,169.3 C226.2,167.3 230,165.1 233.8,162.8 C237.6,160.5 241.3,158 245.1,155.3 C248.9,152.7 252.7,149.9 256.5,146.9 C260.3,143.9 264,140.8 267.8,137.5 C271.6,134.2 275.4,130.6 279.2,126.8 C283,123 286.8,119.1 290.6,114.9 C294.4,110.7 298.1,106.3 301.9,101.6 C305.7,96.9 309.5,92 313.3,86.7 C317.1,81.5 322.7,72.9 324.6,70.1" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><line x1="179.8" y1="209.3" x2="313.3" y2="100.9" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2"/><circle cx="259.7" cy="144.3" r="5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="0"/><text x="334" y="178.3" text-anchor="end" font-weight="700" style="fill:var(--si-accent,#2454ff)">물 100 °C</text><text x="334" y="198.3" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">101.325 kPa</text><text x="62" y="82" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">접선 기울기</text><text x="62" y="104" style="fill:var(--si-amber-t,#7a5210)">dP/dT = ΔH / (T·ΔV)</text><line x1="60" y1="252" x2="60" y2="290" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#clausius-clapeyron-equation-ar)"/><text x="74" y="276" font-weight="700">ln P–1/T로 바꾸면 직선</text><text x="20" y="326" font-weight="700">② ln P–1/T 그래프</text><line x1="52" y1="494" x2="336" y2="494" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="52" y1="494" x2="52" y2="350" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="336" y="516" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">1/T</text><text x="60" y="350" style="fill:var(--si-general,#5c6b7f)">ln P</text><line x1="69" y1="376.6" x2="324.7" y2="477.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><circle cx="96.9" cy="387.6" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="0"/><circle cx="232.8" cy="441.4" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="0"/><text x="104.9" y="379.6">(1/T<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">, ln P</tspan><tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">)</tspan></text><text x="228.8" y="465.4" text-anchor="end">(1/T<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">, ln P</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">)</tspan></text><line x1="96.9" y1="387.6" x2="232.8" y2="387.6" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="232.8" y1="387.6" x2="232.8" y2="441.4" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" stroke-dasharray="5 3"/><text x="240.8" y="418.5" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">기울기 = −ΔH/R</text><text x="20" y="552" font-weight="700">ln(P<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">/P</tspan><tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">) = −(ΔH/R)(1/T</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> − 1/T</tspan><tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">)</tspan></text><text x="20" y="576" style="fill:var(--si-general,#5c6b7f)">ΔH = 40.66 kJ/mol, R = 8.314 J/(mol·K)</text><text x="20" y="602">기울기를 재면 → ΔH를 거꾸로 구한다</text><text x="20" y="626" style="fill:var(--si-general,#5c6b7f)">ΔH를 알면 → 다른 온도의 증기압을 예측한다</text><text x="20" y="652" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">가정: 이상기체, ΔV ≈ V<tspan dy="0.217em" font-size="92%">기체</tspan><tspan dy="-0.2em">, ΔH 일정</tspan></text></svg>
