<svg class="si si-illus" viewBox="0 0 360 454" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="본휴터-퍼거슨 방법: 보고분은 실제값, 미보고분은 사전값" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="14" y="24" font-weight="700">사전 최종손해액 1,500</text><text x="14" y="44" style="fill:var(--si-general,#5c6b7f)">= 경과보험료 2,000 × 예정손해율 75%</text><rect x="30" y="56" width="120" height="36" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><rect x="150" y="56" width="180" height="36" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="90" y="79" text-anchor="middle">보고율 0.4</text><text x="240" y="79" text-anchor="middle" font-weight="700">1,500 × (1 − 0.4)</text><line x1="150" y1="94" x2="110" y2="170" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="330" y1="94" x2="290" y2="170" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4" stroke-dasharray="4 4"/><text x="146" y="122" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">사전값을 그대로 가져옴</text><text x="146" y="164" font-weight="700">BF 최종손해액 1,300</text><rect x="30" y="172" width="80" height="36" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><rect x="110" y="172" width="180" height="36" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="70" y="195" text-anchor="middle" font-weight="700">실제 400</text><text x="200" y="195" text-anchor="middle" font-weight="700">미보고분 (IBNR)</text><line x1="30" y1="232" x2="330" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="30" y1="232" x2="30" y2="237" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="30" y="254" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="130" y1="232" x2="130" y2="237" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="130" y="254" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">500</text><line x1="230" y1="232" x2="230" y2="237" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="230" y="254" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1000</text><line x1="330" y1="232" x2="330" y2="237" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="330" y="254" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1500</text><text x="180" y="270" text-anchor="middle">손해액</text><rect x="14" y="288" width="16" height="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="38" y="300">보고 예상분 (사전값 기준)</text><rect x="14" y="312" width="16" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="38" y="324">실제 누적 손해액으로 교체</text><rect x="14" y="336" width="16" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="38" y="348">미보고분 (사전값 그대로)</text><line x1="14" y1="366" x2="346" y2="366" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="14" y="392" font-weight="700">400 + 1,500 × (1 − 0.4) = 1,300</text><text x="14" y="418" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">예정손해율이 틀리면</text><text x="14" y="438" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">주황 구간이 그대로 틀린다</text></svg>
