" x2="180" y2="279" style="stroke:var(--si-bg,#ffffff);fill:none" stroke-width="2"/><text x="70" y="279" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">양성자(+)</text><text x="16" y="350" font-size="14" font-weight="700">r = mv/(qB) = 2.09 cm</text><text x="16" y="374" font-weight="700">ω = qB/m = 4.79×10⁷ rad/s</text><text x="16" y="398" font-weight="700">T = 131.2 ns</text><text x="16" y="426" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">F가 v에 항상 수직이라 일을 하지 않는다.</text><text x="16" y="448" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">속력과 운동에너지는 그대로, 방향만 바뀐다.</text><rect x="16" y="466" width="200" height="114" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><line x1="64" y1="556" x2="154" y2="556" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.6" marker-end="url(#lorentz-force-ar-2)"/><text x="158" y="561" font-weight="700" font-style="italic" style="fill:var(--si-green-s,#5b9b83)">v</text><line x1="64" y1="556" x2="64" y2="510" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#lorentz-force-ar-3)"/><text x="46" y="512" font-weight="700" font-style="italic" style="fill:var(--si-rose-s,#c97b7b)">F</text><line x1="64" y1="556" x2="114" y2="524" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#lorentz-force-ar-4)"/><text x="118" y="522" font-weight="700" font-style="italic" style="fill:var(--si-blue-s,#7f9ac0)">B</text><text x="24" y="488" style="fill:var(--si-general,#5c6b7f)">오른손 법칙(모식)</text><text x="228" y="500" font-size="14" font-weight="700">F = q v×B</text><text x="228" y="524" style="fill:var(--si-general,#5c6b7f)">v, B, F는 서로</text><text x="228" y="546" style="fill:var(--si-general,#5c6b7f)">수직인 세 방향</text><text x="16" y="610" style="fill:var(--si-general,#5c6b7f)">양성자 q = 1.602×10⁻¹⁹ C, m = 1.673×10⁻²⁷ kg</text><text x="16" y="632" style="fill:var(--si-general,#5c6b7f)">v = 10⁶ m/s, B에 수직으로 입사</text><