<svg class="si si-illus" viewBox="0 0 600 390" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="분별 증류 장치" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>가열한 혼합물의 증기가 분별탑을 오르며 응축과 재증발을 되풀이하고, 끓는점이 낮은 성분이 탑 꼭대기를 지나 냉각기에서 액체로 모인다</desc><defs><marker id="fractional-distillation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="fractional-distillation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><circle cx="150" cy="290" r="46" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="140" y="200" width="20" height="48" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="136" y="70" width="28" height="130" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="136" y1="95" x2="164" y2="95" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="136" y1="113" x2="164" y2="113" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="136" y1="131" x2="164" y2="131" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="136" y1="149" x2="164" y2="149" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="136" y1="167" x2="164" y2="167" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="136" y1="185" x2="164" y2="185" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="150" y1="40" x2="150" y2="78" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><line x1="164" y1="82" x2="380" y2="170" style="stroke:currentColor;fill:none" stroke-width="1.6"/><polygon points="190,