<svg class="si si-illus" viewBox="0 0 360 554" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="허들 모형: 0이 생기는 과정과 양의 값의 크기를 따로 모형화한다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="hurdle-model-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="hurdle-model-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="14" y="84" style="fill:var(--si-general,#5c6b7f)">빈도</text><text x="14" y="30" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">1단계: 0 대 양수</text><text x="14" y="52" style="fill:var(--si-blue-s,#7f9ac0)">이항(로지스틱)</text><text x="180" y="92" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">2단계: 양의 값의 크기</text><text x="180" y="114" style="fill:var(--si-violet-s,#9382bd)">0절단 포아송·음이항</text><line x1="50" y1="60" x2="60" y2="96" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#hurdle-model-ar)"/><line x1="206" y1="124" x2="206" y2="146" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6" marker-end="url(#hurdle-model-ar-1)"/><polyline points="84,156 84,150 328,150 328,156" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6"/><rect x="48" y="100" width="28" height="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="62" y="272" text-anchor="middle">0</text><rect x="84" y="180" width="28" height="70" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="98" y="272" text-anchor="middle">1</text><rect x="120" y="166" width="28" height="84" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="134" y="272" text-anchor="middle">2</text><rect x="156" y="184" width="28" height="66" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="170" y="272" text-anchor="middle">3</text><rect x="192" y="206" width="28" height="44" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="206" y="272" text-anchor="middle">4</text><rect x="228" y="224" width="28" height="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="242" y="272" text-anchor="middle">5</text><rect x="264" y="236" width="28" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="278" y="272" text-anchor="middle">6</text><rect x="300" y="242" width="28" height="8" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="314" y="272" text-anchor="middle">7</text><line x1="40" y1="250" x2="336" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="80" y1="112" x2="80" y2="250" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="4 4"/><text x="88" y="132" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">허들</text><text x="192" y="296" text-anchor="middle" font-weight="700">관측 횟수</text><rect x="14" y="338" width="74" height="30" rx="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="51" y="358" text-anchor="middle">한 관측</text><line x1="88" y1="346" x2="126" y2="326" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#hurdle-model-ar)"/><line x1="88" y1="360" x2="126" y2="384" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" marker-end="url(#hurdle-model-ar-1)"/><text x="134" y="326" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">0 (허들 아래, 여기서 끝)</text><text x="134" y="392" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">허들 통과 → 크기 결정</text><text x="14" y="436" font-weight="700">두 부분의 우도가 분리되어 단계를</text><text x="14" y="458" font-weight="700">따로 적합해도 전체 최대우도와 같다.</text><text x="14" y="486" style="fill:var(--si-general,#5c6b7f)">단계마다 설명변수와 계수가 달라도 된다.</text><text x="14" y="514" style="fill:var(--si-general,#5c6b7f)">영과잉모형은 0을 구조적 0과 우연적 0의</text><text x="14" y="536" style="fill:var(--si-general,#5c6b7f)">혼합으로 보고, 허들은 단일 상태로 본다.</text></svg>
