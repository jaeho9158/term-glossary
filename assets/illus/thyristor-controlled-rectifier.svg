text><line x1="275" y1="170" x2="275" y2="222" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2"/><text x="275" y="242" text-anchor="middle" font-size="14" font-weight="700">G</text><line x1="289" y1="206" x2="289" y2="176" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#thyristor-controlled-rectifier-ar)"/><text x="299" y="200" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">게이트 전류</text><text x="240" y="76" text-anchor="middle" font-size="12" font-weight="700">P-N-P-N 4층 구조</text></svg>
