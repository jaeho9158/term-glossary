rentColor;fill:none" stroke-width="1.6" marker-end="url(#archaeological-context-ar-1)"/><rect x="260" y="374" width="56" height="26" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="288" y="392" text-anchor="middle" font-weight="700">102</text><text x="324" y="316" style="fill:var(--si-general,#5c6b7f)">늦</text><text x="324" y="396" style="fill:var(--si-general,#5c6b7f)">이른</text><text x="20" y="430" font-weight="700">103 유물 연대는 퇴적 시점의 하한</text><text x="20" y="452" style="fill:var(--si-general,#5c6b7f)">(terminus post quem)이다</text><text x="20" y="484" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">같은 토기라도 층위·공반 관계에 따라</text><text x="20" y="506" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">해석이 달라진다. 재퇴적 유물을 원래</text><text x="20" y="528" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">시기로 오인하면 편년이 틀어진다.</text></svg>
