<svg class="si si-illus" viewBox="0 0 360 412" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="드브로이 파장: 운동량이 클수록 짧고, 야구공은 원자 크기에 한참 못 미친다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="de-broglie-wavelength-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="de-broglie-wavelength-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="de-broglie-wavelength-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker></defs><g class="si-rich" font-size="16"  font-weight="700"><text x="20" y="28">λ = </text><text x="56.4" y="20.3" text-anchor="middle" font-size="12.8">h</text><line x1="50.9" y1="22.9" x2="61.9" y2="22.9" style="stroke:currentColor" stroke-width="1"/><text x="56.4" y="33.9" text-anchor="middle" font-size="12.8">p</text></g><line x1="320" y1="56" x2="70" y2="56" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8" marker-end="url(#de-broglie-wavelength-ar)"/><text x="195" y="44" text-anchor="middle" style="fill:var(--si-accent,#2454ff)">운동량 p ↑ → 파장 λ ↓</text><rect x="240" y="218" width="43" height="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><line x1="20" y1="216" x2="345" y2="216" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#de-broglie-wavelength-ar-1)"/><line x1="44" y1="210" x2="50" y2="222" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="50" y1="210" x2="56" y2="222" style="stroke:currentColor;fill:none" stroke-wi