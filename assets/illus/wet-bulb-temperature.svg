<svg class="si si-illus" viewBox="0 0 520 336" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="건구온도계와 습구온도계(슬링 습도계)" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>한 손잡이에 달린 건구온도계와 물에 적신 천으로 감싼 습구온도계를 돌려 공기를 천 위로 흘리는 슬링 습도계의 모식도</desc><defs><marker id="wet-bulb-temperature-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><rect x="150" y="40" width="220" height="14" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.4"/><circle cx="260" cy="47" r="5" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="260" y1="42" x2="260" y2="18" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3"/><rect x="193" y="54" width="14" height="156" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><circle cx="200" cy="226" r="16" style="stroke:var(--si-navy,#12305c);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.5"/><rect x="196" y="95" width="8" height="117" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.6"/><rect x="313" y="54" width="14" height="156" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><circle cx="320" cy="226" r="16" style="stroke:var(--si-navy,#12305c);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.5"/><rect x="316" y="125" width="8" height="87" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.6"/><ellipse cx="320" cy="228" rx="24" ry="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" stroke-dasharray="6 4" fill-opacity="0.25"/><line x1="238" y1="218" x2="290" y2="218" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" marker-end="url(#wet-bulb-temperature-ar)"/><line x1="238" y1="238" x2="290" y2="238" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" marker-end="url(#wet-bulb-temperature-ar)"/><text x="186" y="99" text-anchor="end" font-size="12" font-style="italic">T<tspan dy="0.278em" font-size="72%">d</tspan></text><text x="334" y="129" font-size="12" font-style="italic">T<tspan dy="0.278em" font-size="72%">w</tspan></text><text x="100" y="150" text-anchor="middle" font-size="12">건구온도계</text><line x1="100" y1="150" x2="193" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="193" cy="150" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="430" y="150" text-anchor="middle" font-size="12">습구온도계</text><line x1="430" y1="150" x2="327" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="327" cy="150" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="445" y="238" text-anchor="middle" font-size="12">물에 적신 천</text><line x1="445" y1="238" x2="344" y2="238" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="344" cy="238" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="190" y="285" text-anchor="middle" font-size="12">공기 흐름</text><line x1="190" y1="285" x2="262" y2="242" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="262" cy="242" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="380" y="18" text-anchor="middle" font-size="12">손잡이(돌려서 사용)</text><line x1="380" y1="18" x2="266" y2="24" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="266" cy="24" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"