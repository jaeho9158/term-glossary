<svg class="si si-illus" viewBox="0 0 360 410" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="피로 균열 성장 곡선: 세 영역과 Paris 식 구간" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><rect x="50" y="30" width="75" height="190" style="stroke:none;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.08"/><rect x="255" y="30" width="85" height="190" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.07"/><line x1="125" y1="30" x2="125" y2="220" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="2 4"/><line x1="255" y1="30" x2="255" y2="220" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="2 4"/><line x1="50" y1="220" x2="345" y2="220" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="50" y1="220" x2="50" y2="26" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="90" y1="220" x2="90" y2="150" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="326" y1="30" x2="326" y2="120" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.4" stroke-dasharray="5 3"/><path d="M91,218 C91.5,215 91.8,205.7 94,200 C96.2,194.3 98.8,188.7 104,184 C109.2,179.3 121.5,174 125,172" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.2"/><line x1="125" y1="172" x2="255" y2="86" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="4.5"/><path d="M255,86 C259.8,83 275.2,74 284,68 C292.8,62 301.7,55.7 308,50 C314.3,44.3 319.7,36.7 322,34" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.2"/><path d="M150 155.5 L210 155.5 L210 115.8" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="216" y="140">기울기</text><text x="216" y="158" font-style="italic">m</text><text x="87" y="42" text-anchor="middle">① 문턱 부근</text><text x="87" y="58" text-anchor="middle">매우 느림</text><text x="190" y="42" text-anchor="middle" font-weight="700">② 안정 성장</text><text x="190" y="58" text-anchor="middle">Paris 식</text><text x="298" y="200" text-anchor="middle">③ 급가속</text><text x="298" y="214" text-anchor="middle">파괴 임박</text><text x="94" y="238" text-anchor="middle">ΔK<tspan dy="0.217em" font-size="92%">th</tspan></text><text x="345" y="22" text-anchor="end">K<tspan dy="0.217em" font-size="92%">max</tspan><tspan dy="-0.2em">→K</tspan><tspan dy="0.217em" font-size="92%">c</tspan></text><text x="345" y="252" text-anchor="end">log ΔK</text><g class="si-rich" font-size="13" ><text x="75" y="15.8" text-anchor="middle" font-size="10.4">log da</text><line x1="57.5" y1="17.8" x2="92.5" y2="17.8" style="stroke:currentColor" stroke-width="0.8"/><text x="75" y="26.8" text-anchor="middle" font-size="10.4">dN</text></g><g class="si-rich" font-size="13"  font-weight="700"><text x="30" y="279.8" text-anchor="middle" font-size="10.4">da</text><line x1="21.5" y1="281.8" x2="38.4" y2="281.8" style="stroke:currentColor" stroke-width="0.8"/><text x="30" y="290.8" text-anchor="middle" font-size="10.4">dN</text><text x="39.9" y="286"> = C·(ΔK)<tspan dy="-0.435em" font-size="92%">m</tspan></text></g><text x="20" y="312" font-weight="700">ΔK = Y·Δσ·(πa)<tspan dy="-0.435em" font-size="92%">1/2</tspan></text><text x="20" y="344">예(가상): C = 1×10<tspan dy="-0.435em" font-size="92%">−11</tspan><tspan dy="0.4em">, m = 3, Y = 1.12,</tspan></text><text x="20" y="366">Δσ = 100 MPa, a: 1→10 mm → 약 5.5×10<tspan dy="-0.435em" font-size="92%">5</tspan><tspan dy="0.4em"> 사이클</tspan></text><text x="20" y="394" style="fill:var(--si-limit,#7d2626)">계수는 실험값이라 범위 밖으로 외삽하면 안 된다</text></svg>
