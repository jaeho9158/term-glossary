<svg class="si si-illus" viewBox="0 0 360 554" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="항체 클래스 전환: 불변 영역 유전자의 중간 구간이 잘려 나간다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="antibody-class-switching-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="26" font-weight="700">전환 전: 중쇄 유전자 배열(단순화한 예)</text><rect x="14" y="150" width="62" height="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="45" y="168" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">가변 영역</text><rect x="80" y="150" width="8" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><rect x="88" y="150" width="44" height="26" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="110" y="168" text-anchor="middle" style="fill:var(--si-gray-t,#44546a)">IgM</text><rect x="137" y="150" width="8" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><rect x="145" y="150" width="44" height="26" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="167" y="168" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">IgG</text><rect x="194" y="150" width="8" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><rect x="202" y="150" width="44" height="26" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="224" y="168" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">IgE</text><rect x="251" y="150" width="8" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><rect x="259" y="150" width="44" height="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="281" y="168" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">IgA</text><path d="M86.2,113 L77.4,125.8 L83.6,125.8 L81.8,135 L90.6,121.8 L84.4,121.8Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><path d="M200.2,113 L191.4,125.8 L197.6,125.8 L195.8,135 L204.6,121.8 L198.4,121.8Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="180" y="52" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">AID가 스위치 부위(주황 띠)에</text><text x="180" y="72" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">DNA 손상을 일으킨다</text><path d="M84,150 C85.3,144.3 82.5,123.3 92,116 C101.5,108.7 124.7,106 141,106 C157.3,106 180.5,108.7 190,116 C199.5,123.3 196.7,144.3 198,150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" stroke-dasharray="5 4"/><text x="180" y="204" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">두 손상 지점 사이(IgM·IgG 불변 영역)가 잘려 나간다</text><line x1="180" y1="216" x2="180" y2="248" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#antibody-class-switching-ar)"/><text x="192" y="238" style="fill:var(--si-general,#5c6b7f)">복구하며 이어 붙임</text><text x="14" y="278" font-weight="700">전환 후</text><rect x="14" y="292" width="62" height="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="45" y="310" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">가변 영역</text><rect x="80" y="292" width="8" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><rect x="88" y="292" width="44" height="26" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="110" y="310" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">IgE</text><rect x="137" y="292" width="8" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><rect x="145" y="292" width="44" height="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="167" y="310" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">IgA</text><text x="14" y="344" font-weight="700">가변 영역은 그대로이고 불변 영역만 바뀐다</text><line x1="80" y1="412" x2="80" y2="438" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="6"/><line x1="80" y1="412" x2="62" y2="388" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="6"/><line x1="80" y1="412" x2="98" y2="388" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="6"/><line x1="62" y1="388" x2="58" y2="380" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="6"/><line x1="98" y1="388" x2="102" y2="380" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="6"/><text x="80" y="460" text-anchor="middle" font-weight="700" style="fill:var(--si-gray-t,#44546a)">IgM</text><line x1="280" y1="412" x2="280" y2="438" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="6"/><line x1="280" y1="412" x2="262" y2="388" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="6"/><line x1="280" y1="412" x2="298" y2="388" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="6"/><line x1="262" y1="388" x2="258" y2="380" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="6"/><line x1="298" y1="388" x2="302" y2="380" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="6"/><text x="280" y="460" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">IgE</text><line x1="128" y1="408" x2="232" y2="408" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#antibody-class-switching-ar)"/><text x="180" y="394" text-anchor="middle">클래스 전환</text><text x="180" y="460" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">파랑: 항원 결합부</text><text x="14" y="494" font-weight="700">사이토카인에 따라 방향이 정해진다(경향)</text><text x="14" y="516">IL-4 계열 신호 → IgE·IgG1 쪽</text><text x="14" y="536">TGF-β 신호 → IgA 쪽</text></svg>
