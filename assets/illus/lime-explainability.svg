정</text><rect x="120" y="454" width="70" height="18" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="112" y="468" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">− 부정</text><text x="16" y="434">특성 1</text><text x="16" y="468">특성 2</text><line x1="16" y1="484" x2="344" y2="484" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="506">직선은 설명할 점 주변에서만 맞는 국소 근사다.</text><text x="16" y="526">원 밖에서는 경계와 어긋나므로 모델 전체의</text><text x="16" y="546">행동으로 넓혀 해석하면 안 된다.</text><text x="16" y="566">섭동 방식과 국소 범위에 따라 설명이 달라질 수 있다.</text></svg>
