<svg class="si si-illus" viewBox="0 0 360 504" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="critical-path-method-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="critical-path-method-t">주공정법: 작업 네트워크와 주공정, 여유, D 단축의 효과</title><defs><marker id="critical-path-method-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="critical-path-method-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><text x="20" y="26" font-weight="700">주공정법: 가장 긴 경로가 전체 일정을 정한다</text><text x="20" y="50" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">주공정 A→B→D→F: 3+4+6+2 = 15일, 여유 0</text><line x1="70" y1="162" x2="98" y2="106" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4" marker-end="url(#critical-path-method-ar)"/><line x1="154" y1="106" x2="182" y2="106" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4" marker-end="url(#critical-path-method-ar)"/><line x1="238" y1="106" x2="266" y2="162" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4" marker-end="url(#critical-path-method-ar)"/><line x1="70" y1="162" x2="98" y2="218" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#critical-path-method-ar-1)"/><line x1="154" y1="218" x2="182" y2="218" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#critical-path-method-ar-1)"/><line x1="238" y1="218" x2="266" y2="162" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#critical-path-method-ar-1)"/><rect x="14" y="140" width="56" height="44" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="42" y="159" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">A</text><text x="42" y="177" text-anchor="middle">3일</text><rect x="98" y="84" width="56" height="44" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="126" y="103" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">B</text><text x="126" y="121" text-anchor="middle">4일</text><rect x="98" y="196" width="56" height="44" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="126" y="215" text-anchor="middle" font-size="14" font-weight="700">C</text><text x="126" y="233" text-anchor="middle">2일</text><rect x="182" y="84" width="56" height="44" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="210" y="103" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">D</text><text x="210" y="121" text-anchor="middle">6일</text><rect x="182" y="196" width="56" height="44" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="210" y="215" text-anchor="middle" font-size="14" font-weight="700">E</text><text x="210" y="233" text-anchor="middle">3일</text><rect x="266" y="140" width="56" height="44" rx="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="294" y="159" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">F</text><text x="294" y="177" text-anchor="middle">2일</text><rect x="91" y="246" width="70" height="22" rx="11" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="126" y="262" text-anchor="middle">여유 5일</text>