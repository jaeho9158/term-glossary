<svg class="si si-illus" viewBox="0 0 640 340" style="max-width:640px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oort-cloud-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="oort-cloud-t">오르트구름의 위치: 로그 눈금으로 본 태양계 바깥 영역</title><desc>태양에서의 거리를 로그 눈금(1~100,000 AU)으로 놓고 카이퍼벨트(30~50 AU), 안쪽 오르트구름(2,000~20,000 AU), 바깥 오르트구름(20,000~50,000 AU)의 범위를 띠로 표시한 그림.</desc><defs></defs><line x1="210.2" y1="156" x2="210.2" y2="97" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="429.9" y1="156" x2="415.7" y2="97" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="500" y1="191" x2="500" y2="244.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="26" font-size="12" font-weight="700">태양에서의 거리(AU, 로그 눈금: 10배마다 같은 간격)</text><line x1="50" y1="190" x2="550" y2="190" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="50" y1="184" x2="50" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="50" y="214" text-anchor="middle" font-size="11.5">1</text><line x1="150" y1="184" x2="150" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="150" y="214" text-anchor="middle" font-size="11.5">10</text><line x1="250" y1="184" x2="250" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="250" y="214" text-anchor="middle" font-size="11.5">100</text><line x1="350" y1="184" x2="350" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="350" y="214" text-anchor="middle" font-size="11.5">1,000</text><line x1="450" y1="184" x2="450" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="450" y="214" text-anchor="middle" font-size="11.5">10,000</text><line x1="550" y1="184" x2="550" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="550" y="214" text-anchor="middle" font-size="11.5">100,000</text><rect x="197.7" y="156" width="22.2" height="34" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.45"/><rect x="380.1" y="156" width="100" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.45"/><rect x="480.1" y="156" width="39.8" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.45"/><text x="190.2" y="90" text-anchor="middle" font-size="12">카이퍼벨트</text><text x="190.2" y="110" text-anchor="middle" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">30~50</text><text x="369.9" y="90" text-anchor="middle" font-size="12">안쪽 오르트구름</text><text x="369.9" y="110" text-anchor="middle" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">2,000~20,000</text><text x="490" y="258" text-anchor="middle" font-size="12">바깥 오르트구름(구형)</text><text x="490" y="278" text-anchor="middle" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">20,000~50,000</text><text x="20" y="320" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">해왕성 궤도(약 30 AU) 바깥에서 카이퍼벨트가 시작되고, 오르트구름은 그보다 수천 배 먼 곳에 있다</text></svg>
