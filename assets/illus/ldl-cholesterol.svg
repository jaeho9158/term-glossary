<svg class="si si-illus" viewBox="0 0 360 504" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ldl-cholesterol-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ldl-cholesterol-t">LDL 콜레스테롤: 계산식과 NCEP ATP III 구간</title><defs><marker id="ldl-cholesterol-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="ldl-cholesterol-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="15" font-weight="700">LDL-C = TC − HDL-C − TG/5</text><line x1="30" y1="60" x2="330" y2="60" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#ldl-cholesterol-ar)" marker-start="url(#ldl-cholesterol-ar)"/><text x="180" y="46" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">TC 210 mg/dL</text><rect x="30" y="70" width="64.3" height="56" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.35"/><rect x="94.3" y="70" width="51.4" height="56" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><rect x="145.7" y="70" width="184.3" height="56" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.3"/><text x="62.1" y="93" text-anchor="middle" font-weight="700">HDL-C</text><text x="62.1" y="113" text-anchor="middle">45</text><text x="120" y="93" text-anchor="middle" font-weight="700">TG/5</text><text x="120" y="113" text-anchor="middle">36</text><text x="237.9" y="93" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">LDL-C</text><text x="237.9" y="113" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">129</text><line x1="120" y1="128" x2="120" y2="148" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><text x="30" y="164">TG 180 → 180/5 = 36 (VLDL-C 추정)</text><polygon points="30,196 40,176 50,196" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="40" y="194" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">!</text><text x="60" y="194" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">TG ≥ 400이면 식 적용 불가</text><line x1="14" y1="214" x2="346" y2="214" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="14" y="238" font-size="14" font-weight="700">NCEP ATP III 기준 (mg/dL)</text><rect x="190" y="366" width="60" height="80" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="411" text-anchor="end">&lt;100 적정</text><rect x="190" y="342" width="60" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="359" text-anchor="end">100~129 정상에 가까움</text><rect x="190" y="318" width="60" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="335" text-anchor="end">130~159 경계 상승</text><rect x="190" y="294" width="60" height="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="311" text-anchor="end">160~189 높음</text><rect x="190" y="270" width="60" height="24" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="287" text-anchor="end">≥190 매우 높음</text><line x1="318" y1="126" x2="318" y2="342.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="318" y1="342.8" x2="256" y2="342.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#ldl-cholesterol-ar-1)"/><circle cx="220" cy="342.8" r="5" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2"/><text x="286" y="334.8" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">129</text><text x="14" y="484" style="fill:var(--si-general,#5c6b7f)">mg/dL × 0.02586 = mmol/L (130 → 약 3.36)</text></svg>
