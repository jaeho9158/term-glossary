<svg class="si si-illus" viewBox="0 0 600 345" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WGS 84 타원체의 자오선 단면" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>적도 반지름 a가 극 반지름 b보다 긴 회전 타원체의 단면과 비교용 원을 겹친 모식도. 납작함은 과장했다</desc><defs></defs><ellipse cx="230" cy="170" rx="150" ry="118" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.1"/><circle cx="230" cy="170" r="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/><line x1="230" y1="170" x2="380" y2="170" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8"/><line x1="230" y1="170" x2="230" y2="52" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.8"/><text x="305" y="190" text-anchor="middle" font-size="12">a</text><text x="242" y="115" font-size="12">b</text><text x="470" y="90" text-anchor="middle" font-size="12">극</text><line x1="456" y1="90" x2="236" y2="52" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="470" y="170" text-anchor="middle" font-size="12">적도</text><line x1="452" y1="170" x2="384" y2="170" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="470" y="260" text-anchor="middle" font-size="12">구(비교용)</text><line x1="440" y1="256" x2="336" y2="276" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><g class="si-rich" font-size="12" ><text x="177.9" y="330">b = a(1 − f),  </text><text x="268.6" y="324.2" text-anchor="middle" font-size="9.6">1</text><line x1="264.1" y1="326.2" x2="273.1" y2="326.2" style="stroke:currentColor" stroke-width="0.8"/><text x="268.6" y="334.4" text-anchor="middle" font-size="9.6">f</text><text x="274.6" y="330"> = 298.257223563</text></g></svg>
