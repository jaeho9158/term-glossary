<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ha-ha-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ha-ha-t">하하(ha-ha)의 단면</title><defs><marker id="ha-ha-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><polygon points="20,150 160,150 160,210 184,210 364,150 500,150 500,270 20,270" style="stroke:none;fill:currentColor" stroke-width="1.2" fill-opacity="0.12"/><polyline points="20,150 160,150 160,210 184,210 364,150 500,150" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="150" y="150" width="10" height="60" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><line x1="80" y1="150" x2="80" y2="86" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="80" cy="86" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="80" y="76" text-anchor="middle">눈높이 1.6 m</text><line x1="80" y1="86" x2="500" y2="126" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="5 4"/><text x="360" y="98" font-size="12">시선: 옹벽이 보이지 않음</text><text x="28" y="170">정원 쪽</text><text x="424" y="170">목초지 쪽</text><text x="142" y="184" text-anchor="end">수직 옹벽</text><text x="296" y="230" text-anchor="middle" font-size="12">완만한 경사 (수평 폭 4.5 m)</text><line x1="172" y1="152" x2="172" y2="208" style="stroke:currentColor;fill:none" stroke-width="1" marker-end="url(#ha-ha-ar)" marker-start="url(#ha-ha-ar)"/><text x="180" y="176" font-size="12">깊이 1.5 m</text><text x="20" y="318" font-size="12" style="fill:var(--si-general,#5c6b7f)">본문 가상 단면 값. 실제 깊이 약 0.6 m(호턴 하우스)~2.7 m(페트워스 하우스)</text></svg>
