<svg class="si si-illus" viewBox="0 0 720 300" style="max-width:720px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="수평 안정판과 꼬리 배치" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>왼쪽은 옆에서 본 꼬리로 동체 뒤에 수직 안정판과 수평 안정판, 그 뒤 힌지에 승강타가 붙고, 오른쪽은 뒤에서 본 십자형·T형·V형 꼬리 배치 모식도</desc><defs></defs><polygon points="30,170 260,150 300,160 300,185 30,200" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.3"/><polygon points="220,152 265,60 300,60 290,158" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.2"/><polygon points="215,172 270,166 270,180 215,182" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.45"/><polygon points="270,166 300,170 300,177 270,180" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2" fill-opacity="0.6"/><text x="330" y="50" font-size="12">수직 안정판</text><line x1="326" y1="46" x2="280" y2="90" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="330" y="215" font-size="12">수평 안정판</text><line x1="326" y1="211" x2="245" y2="176" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="330" y="245" font-size="12">승강타(뒤쪽 힌지)</text><line x1="326" y1="241" x2="292" y2="176" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="90" y="240" text-anchor="middle" font-size="12">동체 꼬리</text><line x1="90" y1="228" x2="90" y2="192" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="160" y="30" text-anchor="middle">옆에서 본 꼬리</text><text x="570" y="30" text-anchor="middle">뒤에서 본 배치</text><circle cx="480" cy="220" r="10" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><line x1="480" y1="210" x2="480" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="445" y1="165" x2="515" y2="165" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><text x="480" y="285" text-anchor="middle" font-size="12">십자형</text><circle cx="575" cy="220" r="10" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><line x1="575" y1="210" x2="575" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="540" y1="110" x2="610" y2="110" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><text x="575" y="285" text-anchor="middle" font-size="12">T형</text><circle cx="665" cy="220" r="10" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><line x1="659" y1="212" x2="630" y2="140" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3"/><line x1="671" y1="212" x2="700" y2="140" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3"/><text x="665" y="285" text-anchor="middle" font-size="12">V형</text></svg>
