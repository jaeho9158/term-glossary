<svg class="si si-illus" viewBox="0 0 360 430" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="통합-적응 틀: 두 압력의 강약에 따른 네 가지 전략" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="integration-responsiveness-framework-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="24" font-weight="700">글로벌 통합 압력</text><rect x="50" y="50" width="145" height="135" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.8" fill-opacity="0.16"/><text x="122.5" y="112" text-anchor="middle" font-size="15" font-weight="700">글로벌전략</text><text x="122.5" y="140" text-anchor="middle">통합↑ 적응↓</text><text x="122.5" y="164" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(예: 반도체)</text><rect x="195" y="50" width="145" height="135" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.8" fill-opacity="0.16"/><text x="267.5" y="112" text-anchor="middle" font-size="15" font-weight="700">초국가전략</text><text x="267.5" y="140" text-anchor="middle">통합↑ 적응↑</text><rect x="50" y="185" width="145" height="135" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.8" fill-opacity="0.16"/><text x="122.5" y="247" text-anchor="middle" font-size="15" font-weight="700">국제전략</text><text x="122.5" y="275" text-anchor="middle">통합↓ 적응↓</text><rect x="195" y="185" width="145" height="135" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.8" fill-opacity="0.16"/><text x="267.5" y="247" text-anchor="middle" font-size="15" font-weight="700">다국적전략</text><text x="267.5" y="275" text-anchor="middle">통합↓ 적응↑</text><text x="267.5" y="299" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(예: 식품)</text><line x1="50" y1="328" x2="340" y2="328" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#integration-responsiveness-framework-ar)"/><text x="195" y="354" text-anchor="middle" font-weight="700">현지적응 압력</text><text x="50" y="354" style="fill:var(--si-general,#5c6b7f)">낮음</text><text x="340" y="354" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">높음</text><line x1="42" y1="320" x2="42" y2="50" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#integration-responsiveness-framework-ar)"/><text x="20" y="64" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">높음</text><text x="20" y="314" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">낮음</text><text x="14" y="384">같은 산업 안에서도 기업별 선택은 다르다</text><text x="14" y="408" style="fill:var(--si-general,#5c6b7f)">초국가전략은 이상화되었다는 비판이 있다</text></svg>
