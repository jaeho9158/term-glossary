<svg class="si si-illus" viewBox="0 0 360 666" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cord-cutting-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cord-cutting-t">코드커팅: 유료 TV 가구 감소와 해지·전환 비율</title><defs><marker id="cord-cutting-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="18" text-anchor="middle" font-weight="700">미국 가구 수 (백만)</text><line x1="60" y1="230" x2="348" y2="230" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cord-cutting-ar)"/><line x1="60" y1="230" x2="60" y2="30" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cord-cutting-ar)"/><line x1="60" y1="230" x2="60" y2="236" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="60" y="262" text-anchor="middle">2008</text><line x1="150" y1="230" x2="150" y2="236" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="150" y="262" text-anchor="middle">2011</text><line x1="240" y1="230" x2="240" y2="236" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="240" y="262" text-anchor="middle">2014</text><line x1="330" y1="230" x2="330" y2="236" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="330" y="262" text-anchor="middle">2017</text><line x1="54" y1="230" x2="60" y2="230" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="44" y="235">0</text><line x1="54" y1="148.2" x2="60" y2="148.2" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="36" y="153.2">50</text><line x1="54" y1="66.4" x2="60" y2="66.4" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="28" y="71.4">100</text><line x1="150" y1="64.8" x2="330" y2="75.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" stroke-dasharray="6 4"/><line x1="60" y1="228.5" x2="330" y2="193.7" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" stroke-dasharray="6 4"/><circle cx="150" cy="64.8" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="330" cy="75.4" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="60" cy="228.5" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="330" cy="193.7" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="70" y="40" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">2011년 정점 약 1억 100만</text><text x="150" y="92" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">유료 TV 가구</text><text x="340" y="114" text-anchor="end" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">2017년 9,500만 미만</text><text x="68" y="198" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">2008년 약 90만</text><text x="336" y="184" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">2017년 2,220만</text><text x="124" y="150" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">인터넷으로만</text><text x="124" y="172" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">TV 시청 가구</text><line x1="66" y1="202" x2="61" y2="221" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><line x1="185" y1="178" x2="185" y2="210" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="10" y="290" style="fill:var(--si-general,#5c6b7f)">점은 본문에 나온 연도의 값이다.</text><text x="10" y="312" style="fill:var(--si-general,#5c6b7f)">점 사이 선은 값이 없는 구간을 이은 것이다.</text><text x="180" y="352" text-anchor="middle" font-weight="700">해지율과 OTT 전환 (가상 예)</text><rect x="20" y="368" width="300" height="22" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="170" y="384" text-anchor="middle" font-weight="700">가구 1,000곳</text><line x1="32" y1="394" x2="32" y2="418" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#cord-cutting-ar)"/><rect x="20" y="424" width="24" height="22" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="54" y="436" font-weight="700">해지 80곳</text><text x="54" y="458">80/1,000 = 해지율 8.0%</text><line x1="32" y1="464" x2="32" y2="488" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#cord-cutting-ar)"/><rect x="20" y="494" width="15" height="22" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="54" y="506" font-weight="700">OTT 전환 50곳</text><text x="54" y="528">50/80 = 전환 62.5%</text><text x="10" y="566">나머지 30곳은 OTT 없이 해지하거나</text><text x="10" y="588">무료 방송 등으로 옮겨 감</text><text x="10" y="626" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">요금제를 낮춘 코드셰이빙은 해지율에</text><text x="10" y="648" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">잡히지 않아 이탈이 작게 보일 수 있음</text></svg>
