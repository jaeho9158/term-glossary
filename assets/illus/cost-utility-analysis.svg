<svg class="si si-illus" viewBox="0 0 360 400" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="비용효용분석: ICER와 수용 기준선 비교" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="cost-utility-analysis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="28" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">ICER = Δ비용 ÷ ΔQALY</text><polygon points="50,290 330,110 330,290" style="stroke:none;fill:var(--si-green-s,#5b9b83)" stroke-width="1.2" fill-opacity="0.16"/><text x="296" y="262" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">비용효율적</text><line x1="50" y1="290" x2="344" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cost-utility-analysis-ar)"/><line x1="50" y1="290" x2="50" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cost-utility-analysis-ar)"/><text x="14" y="56" style="fill:var(--si-general,#5c6b7f)">비용 차이(Δ비용)</text><text x="344" y="318" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">건강 결과 차이(ΔQALY)</text><line x1="50" y1="290" x2="330" y2="110" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3" stroke-dasharray="7 4"/><text x="334" y="98" text-anchor="end" font-weight="700" style="fill:var(--si-general,#5c6b7f)">수용 기준선</text><line x1="50" y1="290" x2="250" y2="200" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3.4"/><line x1="250" y1="200" x2="250" y2="290" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.3" stroke-dasharray="3 4"/><line x1="250" y1="200" x2="50" y2="200" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.3" stroke-dasharray="3 4"/><circle cx="250" cy="200" r="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="262" y="196" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">새 개입</text><circle cx="50" cy="290" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="14" y="312" style="fill:var(--si-general,#5c6b7f)">기존 대안</text><text x="14" y="360" style="fill:var(--si-general,#5c6b7f)">건강 결과는 질보정생존년(QALY)으로</text><text x="14" y="382" style="fill:var(--si-general,#5c6b7f)">재며, 금액으로 바꾸지 않는다.</text></svg>
