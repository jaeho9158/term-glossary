<svg class="si si-illus" viewBox="0 0 360 500" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="countervailing-duty-customs-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="countervailing-duty-customs-t">상계관세: 보조금으로 깎인 수입가격을 관세로 되돌리는 구조</title><defs></defs><text x="10" y="22" font-weight="700">수입가격 비교(모식)</text><rect x="30" y="90" width="80" height="210" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><rect x="140" y="150" width="80" height="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><rect x="140" y="90" width="80" height="60" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" stroke-dasharray="5 4"/><text x="180" y="114" text-anchor="middle">외국 정부</text><text x="180" y="134" text-anchor="middle">보조금</text><rect x="250" y="150" width="80" height="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><rect x="250" y="90" width="80" height="60" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2.4" fill-opacity="0.3"/><text x="290" y="125" text-anchor="middle" font-weight="700">상계관세</text><line x1="30" y1="300" x2="330" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="112" y1="90" x2="248" y2="90" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="3 4"/><text x="122" y="80" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">보조금 효과 상쇄</text><text x="70" y="324" text-anchor="middle">① 보조금 없는</text><text x="70" y="344" text-anchor="middle">원래 가격</text><text x="180" y="324" text-anchor="middle">② 보조금 받은</text><text x="180" y="344" text-anchor="middle">수입가격</text><text x="290" y="324" text-anchor="middle">③ 상계관세</text><text x="290" y="344" text-anchor="middle">부과 후 가격</text><text x="10" y="388" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">상계관세 ≤ 보조금 마진(초과 부과 불가)</text><text x="10" y="416" style="fill:var(--si-general,#5c6b7f)">보조금 마진이 수입가격의 1% 미만이면</text><text x="10" y="436" style="fill:var(--si-general,#5c6b7f)">조사 종료(최소허용기준, de minimis)</text><text x="10" y="480" style="fill:var(--si-general,#5c6b7f)">부과 후 5년이 지나면 일몰재심</text></svg>
