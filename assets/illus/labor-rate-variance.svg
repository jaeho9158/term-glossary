<svg class="si si-illus" viewBox="0 0 360 656" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="노무비 차이: 임률차이와 능률차이를 면적으로 나누기" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="labor-rate-variance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="labor-rate-variance-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="10" y="22" font-weight="700">노무비 차이를 면적으로 보기 (가상 수치)</text><rect x="90" y="150" width="198" height="240" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="189" y="262" text-anchor="middle" font-weight="700">표준원가</text><text x="189" y="286" text-anchor="middle">15,000 × 1,100</text><rect x="90" y="134" width="216" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><rect x="288" y="150" width="18" height="240" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><line x1="90" y1="390" x2="350" y2="390" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#labor-rate-variance-ar)"/><line x1="90" y1="390" x2="90" y2="96" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#labor-rate-variance-ar)"/><text x="84" y="138" text-anchor="end">16,000</text><text x="84" y="166" text-anchor="end">15,000</text><line x1="86" y1="134" x2="90" y2="134" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="86" y1="150" x2="90" y2="150" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="10" y="104" style="fill:var(--si-general,#5c6b7f)">원/시간</text><line x1="288" y1="390" x2="288" y2="395" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="306" y1="390" x2="306" y2="395" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="290" y="416" text-anchor="end">1,100</text><text x="314" y="416">1,200</text><text x="90" y="442" style="fill:var(--si-general,#5c6b7f)">노동시간(시간)</text><text x="90" y="52" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">노무임률차이</text><text x="90" y="74" style="fill:var(--si-amber-s,#d79a2b)">1,200,000원 불리</text><line x1="90" y1="124" x2="306" y2="124" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#labor-rate-variance-ar-1)" marker-start="url(#labor-rate-variance-ar-1)"/><text x="198" y="112" text-anchor="middle" style="fill:var(--si-amber-s,#d79a2b)">실제시간 1,200 전체에 걸침</text><text x="215" y="454" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">노무능률차이</text><text x="215" y="476" style="fill:var(--si-violet-s,#9382bd)">1,500,000원 불리</text><line x1="297" y1="442" x2="297" y2="386" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.2"/><text x="10" y="548" font-weight="700">총차이 = 1,200,000 + 1,500,000</text><text x="10" y="572" font-weight="700">= 2,700,000원(불리)</text><text x="10" y="606">임률차이 = (16,000 − 15,000) × 1,200</text><text x="10" y="630">능률차이 = (1,200 − 1,100) × 15,000</text></svg>
