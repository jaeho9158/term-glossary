<svg class="si si-illus" viewBox="0 0 520 300" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dutch-angle-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="dutch-angle-t">더치 앵글: 수평 촬영과 렌즈 축을 기울인 촬영의 화면</title><defs></defs><rect x="45" y="95" width="170" height="110" style="stroke:currentColor;fill:currentColor" stroke-width="2" fill-opacity="0.06"/><line x1="45" y1="150" x2="215" y2="150" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4"/><text x="130" y="231" text-anchor="middle" font-size="12">수평 촬영: 수평선이 화면 가로와 나란함</text><polygon points="294.2,117.2 459.2,76.1 485.8,182.8 320.8,223.9" style="stroke:currentColor;fill:currentColor" stroke-width="2" fill-opacity="0.06"/><line x1="307.5" y1="170.6" x2="472.5" y2="129.4" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4"/><line x1="291" y1="150" x2="489" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="5 4"/><path d="M 468 150 A 78 78 0 0 0 465.7 131.1" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><text x="495" y="136" font-size="15" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">θ</text><text x="390" y="249" text-anchor="middle" font-size="12">더치 앵글: 화면의 수평선이 비스듬함</text><text x="293" y="77" font-size="11" style="fill:var(--si-general,#5c6b7f)">기준 수평(점선)</text><text x="260" y="282" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">기울기가 작으면 은근한 불안감, 크면 강한 혼란</text></svg>
