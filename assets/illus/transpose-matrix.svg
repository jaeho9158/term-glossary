<svg class="si si-illus" viewBox="0 0 600 256" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transpose-matrix-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="transpose-matrix-t">행렬의 전치</title><desc>2 × 3 행렬 A의 행과 열을 맞바꿔 3 × 2 행렬 A^T를 만든다. 1행 2열의 2가 2행 1열로 옮겨 가고, 주대각선 위 원소 1과 5는 그대로다</desc><defs><marker id="transpose-matrix-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><rect x="60" y="80" width="44" height="44" style="stroke:currentColor;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1"/><text x="82" y="107" text-anchor="middle" font-size="14">1</text><rect x="104" y="80" width="44" height="44" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="1"/><text x="126" y="107" text-anchor="middle" font-size="14">2</text><rect x="148" y="80" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="170" y="107" text-anchor="middle" font-size="14">3</text><rect x="60" y="124" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="82" y="151" text-anchor="middle" font-size="14">4</text><rect x="104" y="124" width="44" height="44" style="stroke:currentColor;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1"/><text x="126" y="151" text-anchor="middle" font-size="14">5</text><rect x="148" y="124" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="170" y="151" text-anchor="middle" font-size="14">6</text><rect x="410" y="58" width="44" height="44" style="stroke:currentColor;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1"/><text x="432" y="85" text-anchor="middle" font-size="14">1</text><rect x="454" y="58" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="476" y="85" text-anchor="middle" font-size="14">4</text><rect x="410" y="102" width="44" height="44" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="1"/><text x="432" y="129" text-anchor="middle" font-size="14">2</text><rect x="454" y="102" width="44" height="44" style="stroke:currentColor;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1"/><text x="476" y="129" text-anchor="middle" font-size="14">5</text><rect x="410" y="146" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="432" y="173" text-anchor="middle" font-size="14">3</text><rect x="454" y="146" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="476" y="173" text-anchor="middle" font-size="14">6</text><text x="126" y="62" text-anchor="middle" font-size="12">A (2 × 3)</text><text x="454" y="40" text-anchor="middle" font-size="12">A<tspan dy="-0.556em" font-size="72%">T</tspan><tspan dy="0.4em"> (3 × 2)</tspan></text><line x1="230" y1="124" x2="390" y2="124" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#transpose-matrix-ar)"/><text x="310" y="114" text-anchor="middle" font-size="12">행과 열을 맞바꿈</text><text x="300" y="240" text-anchor="middle" font-size="14">(A<tspan dy="-0.556em" font-size="72%">T</tspan><tspan dy="0.4em">)</tspan><tspan dy="0.278em" font-size="72%">ij</tspan><tspan dy="-0.2em"> = A</tspan><tspan dy="0.278em" font-size="72%">ji</tspan></text></svg>
