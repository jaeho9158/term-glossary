gray-f,#eef1f6)" stroke-width="1.4"/><text x="70" y="760">10 cm²</text><rect x="140" y="747" width="11" height="16" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="159" y="760" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">1.1 mm</text><rect x="20" y="780" width="40" height="40" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="70" y="805">100 cm²</text><rect x="140" y="792" width="1.1" height="16" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="149.1" y="805" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">0.11 mm</text><text x="14" y="852" style="fill:var(--si-rose-s,#c97b7b)">작은 양극일수록 깊게 패인다(침식 깊이)</text><text x="14" y="888" font-weight="700" font-style="italic">m = I·t·M/(n·F)</text><text x="14" y="914" style="fill:var(--si-general,#5c6b7f)">알루미늄 M 26.98 g/mol, n = 3</text></svg>
