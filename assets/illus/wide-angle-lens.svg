<svg class="si si-illus" viewBox="0 0 600 384" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="광각 렌즈와 표준 렌즈의 화각" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>같은 35 mm 풀프레임 센서에서 초점거리 24 mm 광각 렌즈는 대각 화각이 약 84도로 넓고, 50 mm 표준 렌즈는 약 47도로 좁다</desc><defs></defs><line x1="40" y1="105.1" x2="40" y2="234.9" style="stroke:currentColor;fill:none" stroke-width="3"/><polygon points="112,110 119,170 112,230 105,170" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><line x1="40" y1="105.1" x2="245" y2="290" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><line x1="40" y1="234.9" x2="245" y2="50" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><line x1="40" y1="170" x2="245" y2="170" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="4 4"/><text x="165" y="40" text-anchor="middle" font-size="12" font-weight="700">광각 렌즈</text><text x="76" y="256.9" text-anchor="middle" font-size="11">f = 24 mm</text><line x1="40" y1="242.9" x2="112" y2="242.9" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8"/><text x="165" y="318" text-anchor="middle" font-size="12">대각 화각 약 84°</text><line x1="330" y1="105.1" x2="330" y2="234.9" style="stroke:currentColor;fill:none" stroke-width="3"/><polygon points="480,110 487,170 480,230 473,170" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><line x1="330" y1="105.1" x2="580" y2="213.3" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><line x1="330" y1="234.9" x2="580" y2="126.7" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><line x1="330" y1="170" x2="580" y2="170" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="4 4"/><text x="455" y="40" text-anchor="middle" font-size="12" font-weight="700">표준 렌즈</text><text x="405" y="256.9" text-anchor="middle" font-size="11">f = 50 mm</text><line x1="330" y1="242.9" x2="480" y2="242.9" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8"/><text x="455" y="318" text-anchor="middle" font-size="12">대각 화각 약 47°</text><text x="40" y="90" font-size="11">센서</text><g class="si-rich" font-size="14" ><text x="236" y="368">α = 2 arctan(</text><text x="345.4" y="361.3" text-anchor="middle" font-size="11.2">d</text><line x1="336.9" y1="363.5" x2="353.8" y2="363.5" style="stroke:currentColor" stroke-width="0.9"/><text x="345.4" y="373.2" text-anchor="middle" font-size="11.2">2f</text><text x="355.3" y="368">)</text></g></svg>
