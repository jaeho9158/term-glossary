<svg class="si si-illus" viewBox="0 0 360 584" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fraunhofer-diffraction-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="fraunhofer-diffraction-t">프라운호퍼 회절: 단일 슬릿과 스크린의 세기 분포</title><defs><marker id="fraunhofer-diffraction-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="fraunhofer-diffraction-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">단일 슬릿의 프라운호퍼 회절</text><rect x="40" y="50" width="8" height="90" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="40" y="160" width="8" height="90" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><line x1="8" y1="70" x2="36" y2="70" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#fraunhofer-diffraction-ar)"/><line x1="8" y1="110" x2="36" y2="110" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#fraunhofer-diffraction-ar)"/><line x1="8" y1="190" x2="36" y2="190" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#fraunhofer-diffraction-ar)"/><line x1="8" y1="230" x2="36" y2="230" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#fraunhofer-diffraction-ar)"/><line x1="48" y1="150" x2="204" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="48" y1="150" x2="204" y2="110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="48" y1="150" x2="204" y2="190" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M145,174.2 A100,100 0 0 0 148,150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4"/><text x="154" y="170" font-style="italic" style="fill:var(--si-rose-s,#c97b7b)">θ</text><line x1="204" y1="50" x2="204" y2="250" style="stroke:currentColor;fill:none" stroke-width="2.2"/><text x="204" y="270" text-anchor="middle">스크린</text><polyline points="205.7,54 205.6,56 205.4,58 205.1,60 204.8,62 204.5,64 204.2,66 204.1,68 204,70 204.1,72 204.3,74 204.7,76 205.2,78 205.8,80 206.5,82 207.2,84 207.9,86 208.4,88 208.9,90 209.1,92 209,94 208.8,96 208.2,98 207.5,100 206.6,102 205.7,104 204.9,106 204.2,108 204,110 204.3,112 205.3,114 207.1,116 209.9,118 213.7,120 218.6,122 224.6,124 231.5,126 239.3,128 247.8,130 256.7,132 265.9,134 274.9,136 283.6,138 291.5,140 298.5,142 304.2,144 308.5,146 311.1,148 312,150 311.1,152 308.5,154 304.2,156 298.5,158 291.5,160 283.6,162 274.9,164 265.9,166 256.7,168 247.8,170 239.3,172 231.5,174 224.6,176 218.6,178 213.7,180 209.9,182 207.1,184 205.3,186 204.3,188 204,190 204.2,192 204.9,194 205.7,196 206.6,198 207.5,200 208.2,202 208.8,204 209,206 209.1,208 208.9,210 208.4,212 207.9,214 207.2,216 206.5,218 205.8,220 205.2,222 204.7,224 204.3,226 204.1,228 204,230 204.1,232 204.2,234 204.5,236 204.8,238 205.1,240 205.4,242 205.6,244 205.7,246" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2"/><line x1="204" y1="70" x2="224" y2="70" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="230" y="74" style="fill:var(--si-rose-s,#c97b7b)">m = −2</text><line x1="204" y1="110" x2="224" y2="110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="230" y="114" style="fill:var(--si-rose-s,#c97b7b)">m = −1</text><line x1="204" y1="190" x2="224" y2="190" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="230" y="194" style="fill:var(--si-rose-s,#c97b7b)">m = +1</text><line x1="204" y1="230" x2="224" y2="230" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="230" y="234" style="fill:var(--si-rose-s,#c97b7b)">m = +2</text><line x1="30" y1="140" x2="30" y2="160" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#fraunhofer-diffraction-ar-1)" marker-start="url(#fraunhofer-diffraction-ar-1)"/><text x="22" y="154" text-anchor="end" font-style="italic">b</text><line x1="44" y1="292" x2="204" y2="292" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#fraunhofer-diffraction-ar-1)" marker-start="url(#fraunhofer-diffraction-ar-1)"/><text x="124" y="312" text-anchor="middle" font-style="italic">L</text><text x="14" y="350" font-weight="700">극소 위치(붉은 점선): b sinθ = mλ</text><text x="14" y="370" style="fill:var(--si-general,#5c6b7f)">m = ±1, ±2, …   가운데 무늬가 가장 넓고 밝다</text><text x="14" y="408">가상 실험: b = 0.1 mm, λ = 632.8 nm(He-Ne),</text><text x="14" y="428">L = 1 m</text><text x="14" y="448" font-weight="700">첫 극소 θ ≈ λ/b ≈ 6.3 mrad</text><text x="14" y="468" font-weight="700">가운데 무늬 폭 ≈ 2λL/b ≈ 12.7 mm</text><text x="14" y="506">원거리 조건: N<tspan dy="0.217em" font-size="92%">F</tspan><tspan dy="-0.2em"> = a²/(λL) ≪ 1</tspan></text><text x="14" y="526" style="fill:var(--si-general,#5c6b7f)">이 예에서 N<tspan dy="0.217em" font-size="92%">F</tspan><tspan dy="-0.2em"> ≈ 0.004</tspan></text><text x="14" y="564" style="fill:var(--si-general,#5c6b7f)">그림의 각도와 간격은 과장한 모식이다</text></svg>
