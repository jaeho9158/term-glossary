<svg class="si si-illus" viewBox="0 0 360 582" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원심력: 관성 기준틀과 회전 기준틀에서 본 같은 공" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="centrifugal-force-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="centrifugal-force-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="centrifugal-force-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker></defs><text x="14" y="24" font-weight="700">관성 기준틀 (바깥 관찰자)</text><circle cx="90" cy="150" r="70" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="90" y1="150" x2="150" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><circle cx="90" cy="150" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="70" y="155" font-weight="700">O</text><text x="128" y="142" text-anchor="middle" font-style="italic" style="fill:var(--si-general,#5c6b7f)">r</text><path d="M110 142 A22 22 0 0 0 92 128" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="96" y1="128" x2="88" y2="128" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#centrifugal-force-ar)"/><text x="104" y="122" font-style="italic">ω</text><circle cx="160" cy="150" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="1"/><line x1="148" y1="150" x2="104" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.2" marker-end="url(#centrifugal-force-ar-1)"/><line x1="160" y1="138" x2="160" y2="84" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4" marker-end="url(#centrifugal-force-ar-2)"/><text x="172" y="118" font-style="italic" style="fill:var(--si-navy,#12305c)">v</text><line x1="160" y1="84" x2="160" y2="46" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><text x="176" y="58" style="fill:var(--si-navy,#12305c)">줄을 놓으면</text><text x="176" y="78" style="fill:var(--si-navy,#12305c)">접선으로 날아감</text><text x="104" y="176" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">구심력(장력)</text><g class="si-rich" font-size="13"  font-weight="700" style="fill:var(--si-rose-s,#c97b7b)"><text x="104" y="201.8" text-anchor="middle" font-size="10.4">mv²</text><line x1="92.8" y1="203.8" x2="115.2" y2="203.8" style="stroke:var(--si-rose-s,#c97b7b)" stroke-width="0.8"/><text x="104" y="212.8" text-anchor="middle" font-size="10.4">r</text></g><text x="190" y="160" font-weight="700">실제 힘은</text><text x="190" y="180" font-weight="700">구심력뿐</text><text x="14" y="270" font-weight="700">회전 기준틀 (함께 도는 관찰자)</text><circle cx="90" cy="380" r="70" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="90" y1="380" x2="150" y2="380" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><circle cx="90" cy="380" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="70" y="385" font-weight="700">O</text><text x="128" y="372" text-anchor="middle" font-style="italic" style="fill:var(--si-general,#5c6b7f)">r</text><path d="M110 372 A22 22 0 0 0 92 358" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="96" y1="358" x2="88" y2="358" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#centrifugal-force-ar)"/><text x="104" y="352" font-style="italic">ω</text><circle cx="160" cy="380" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="1"/><line x1="148" y1="380" x2="104" y2="380" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.2" marker-end="url(#centrifugal-force-ar-1)"/><line x1="172" y1="380" x2="214" y2="380" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.2" stroke-dasharray="6 4" marker-end="url(#centrifugal-force-ar-2)"/><text x="222" y="338" text-anchor="middle" font-weight="700" style="fill:var(--si-navy,#12305c)">mω²r</text><text x="222" y="358" text-anchor="middle" font-weight="700" style="fill:var(--si-navy,#12305c)">원심력(가상)</text><text x="104" y="414" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">장력</text><text x="104" y="434" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">mω²r</text><text x="228" y="404" font-weight="700">이 기준틀 안에서</text><text x="228" y="424" font-weight="700">장력과 크기가 같음</text><g class="si-rich" font-size="13"  font-weight="700"><text x="14" y="486">F = mω²r = </text><text x="100" y="479.8" text-anchor="middle" font-size="10.4">mv²</text><line x1="88.8" y1="481.8" x2="111.2" y2="481.8" style="stroke:currentColor" stroke-width="0.8"/><text x="100" y="490.8" text-anchor="middle" font-size="10.4">r</text></g><text x="14" y="512">원심분리기: r = 10 cm, 3,000 rpm → 약 1,006 g</text><text x="14" y="544" style="fill:var(--si-general,#5c6b7f)">같은 공을 두 관점에서 본 것이라</text><text x="14" y="564" style="fill:var(--si-general,#5c6b7f)">작용·반작용 쌍이 아니다</text></svg>
