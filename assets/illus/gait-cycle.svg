<svg class="si si-illus" viewBox="0 0 360 428" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gait-cycle-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="gait-cycle-t">보행주기의 입각기·유각기 비율과 양발 지지기</title><defs><marker id="gait-cycle-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="20" y="24" font-size="14" font-weight="700">보행주기: 한쪽 발의 초기 접지에서</text><text x="20" y="41" font-size="14" font-weight="700">다음 초기 접지까지</text><rect x="40" y="100" width="29" height="108" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.22"/><rect x="185" y="100" width="29" height="108" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.22"/><line x1="40" y1="62" x2="330" y2="62" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#gait-cycle-ar)"/><text x="185" y="52" text-anchor="middle" font-weight="700">한 주기(100%)</text><line x1="40" y1="86" x2="40" y2="206" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8"/><text x="40" y="80" text-anchor="middle">0%</text><line x1="69" y1="86" x2="69" y2="206" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8"/><text x="69" y="80" text-anchor="middle">10%</text><line x1="185" y1="86" x2="185" y2="206" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8"/><text x="185" y="80" text-anchor="middle">50%</text><line x1="214" y1="86" x2="214" y2="206" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8"/><text x="214" y="80" text-anchor="middle">60%</text><line x1="330" y1="86" x2="330" y2="206" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8"/><text x="330" y="80" text-anchor="middle">100%</text><text x="75" y="122" font-weight="700">오른발</text><rect x="40" y="128" width="174" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.4"/><rect x="214" y="128" width="116" height="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.35"/><text x="127" y="146" text-anchor="middle" font-weight="700">입각기 약 60%</text><text x="272" y="146" text-anchor="middle" font-weight="700">유각기 약 40%</text><text x="75" y="176" font-weight="700">왼발</text><rect x="40" y="182" width="29" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.4"/><rect x="69" y="182" width="116" height="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.35"/><rect x="185" y="182" width="145" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.4"/><text x="127" y="200" text-anchor="middle" font-weight="700">유각기</text><text x="257.5" y="200" text-anchor="middle" font-weight="700">입각기</text><text x="40" y="228" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">양발 지지 약 10%</text><text x="185" y="228" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">양발 지지 약 10%</text><text x="20" y="266" font-weight="700">오른발 세부 구간</text><rect x="40" y="274" width="29" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.5"/><rect x="69" y="274" width="116" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.28"/><text x="127" y="292" text-anchor="middle">중간~말기 입각</text><rect x="185" y="274" width="29" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.5"/><rect x="214" y="274" width="116" height="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.28"/><text x="272" y="292" text-anchor="middle">초기~말기 유각</text><line x1="54.5" y1="300" x2="54.5" y2="316" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="40" y="332">부하반응 (0~10%)</text><line x1="199.5" y1="300" x2="199.5" y2="316" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="175.5" y="332">전유각기 (50~60%)</text><text x="20" y="372" style="fill:var(--si-gray-t,#44546a)">대칭 걸음에서 반대발 초기 접지는 50%에 온다.</text><text x="20" y="391" style="fill:var(--si-gray-t,#44546a)">60:40은 대략적 값이며 속도와 대상에 따라 달라진다.</text><text x="20" y="410" style="fill:var(--si-gray-t,#44546a)">보행률(cadence)은 분당 걸음 수이다.</text></svg>
