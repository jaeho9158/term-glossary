<svg class="si si-illus" viewBox="0 0 360 550" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="결심고도(DA)와 결심높이(DH)" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="decision-altitude-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="decision-altitude-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker><marker id="decision-altitude-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="12" y="22" font-size="14" font-weight="700">결심고도: 측면 접근 단면</text><polygon points="20,218 325,218 325,380 20,380" style="stroke:none;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><line x1="20" y1="218" x2="250" y2="218" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="250" y1="218" x2="325" y2="218" style="stroke:currentColor;fill:none" stroke-width="4"/><text x="288" y="238" text-anchor="middle" font-weight="700">활주로</text><line x1="20" y1="380" x2="325" y2="380" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="20" y="400" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">평균해수면(MSL)</text><line x1="40" y1="60" x2="250" y2="218" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4"/><polygon points="84,88 112,110 82,100" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><text x="96" y="130" text-anchor="middle">항공기</text><path d="M170,158 C173.3,159.8 183,167.3 190,169 C197,170.7 203.7,171.5 212,168 C220.3,164.5 227.8,158.7 240,148 C252.2,137.3 273.3,117 285,104 C296.7,91 305.8,75.7 310,70" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="176" y="96" style="fill:var(--si-rose-s,#c97b7b)">관성으로</text><text x="176" y="114" style="fill:var(--si-rose-s,#c97b7b)">고도 손실</text><text x="176" y="132" style="fill:var(--si-rose-s,#c97b7b)">(절차 반영)</text><line x1="205" y1="138" x2="205" y2="166" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2"/><text x="250" y="56" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">미확보 → 복행</text><text x="146" y="190" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">확보 →</text><text x="146" y="208" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">착륙 계속</text><circle cx="170" cy="158" r="6" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><line x1="30" y1="158" x2="164" y2="158" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="34" y="150" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">결심 지점</text><line x1="30" y1="380" x2="30" y2="158" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" marker-end="url(#decision-altitude-ar)" marker-start="url(#decision-altitude-ar)"/><text x="36" y="300" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">DA 740 ft</text><text x="36" y="320" style="fill:var(--si-amber-s,#d79a2b)">(MSL 기준)</text><line x1="62" y1="218" x2="62" y2="160" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6" marker-end="url(#decision-altitude-ar-1)" marker-start="url(#decision-altitude-ar-1)"/><text x="70" y="190" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">DH 200 ft</text><text x="70" y="210" style="fill:var(--si-violet-s,#9382bd)">(시단 기준)</text><line x1="140" y1="380" x2="140" y2="220" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#decision-altitude-ar-2)" marker-start="url(#decision-altitude-ar-2)"/><text x="148" y="300" font-weight="700">시단 표고</text><text x="148" y="320" font-weight="700">540 ft</text><text x="354" y="108" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">시단 기준</text><text x="354" y="126" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">높이</text><rect x="330" y="134" width="20" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><rect x="330" y="158" width="20" height="30" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2"/><rect x="330" y="188" width="20" height="30" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><text x="12" y="438" font-weight="700">DA = 시단 표고 + DH = 540 + 200 = 740 ft</text><text x="12" y="458" style="fill:var(--si-general,#5c6b7f)">예시 수치는 가상</text><rect x="12" y="475" width="16" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><text x="36" y="486">CAT I: DH 200 ft(60 m) 이상</text><rect x="12" y="494" width="16" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2"/><text x="36" y="505">CAT II: 100~200 ft(30~60 m)</text><rect x="12" y="513" width="16" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><text x="36" y="524">CAT III: 100 ft(30 m) 미만, 또는 DH 없음</text></svg>
