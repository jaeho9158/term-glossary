<svg class="si si-illus" viewBox="0 0 360 390" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gantt-chart-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="gantt-chart-t">간트차트: 작업별 막대의 길이가 기간이고, 오늘 선이 진행 상황을 가른다</title><defs><marker id="gantt-chart-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="10" y="20" font-weight="700" style="fill:var(--si-accent,#2454ff)">간트차트 예시(작업·기간은 가상)</text><line x1="90" y1="66" x2="336" y2="66" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#gantt-chart-ar)"/><line x1="90" y1="62" x2="90" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="90" y="56" text-anchor="middle">0</text><line x1="130" y1="62" x2="130" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="130" y="56" text-anchor="middle">2</text><line x1="170" y1="62" x2="170" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="170" y="56" text-anchor="middle">4</text><line x1="210" y1="62" x2="210" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="210" y="56" text-anchor="middle">6</text><line x1="250" y1="62" x2="250" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="250" y="56" text-anchor="middle">8</text><line x1="290" y1="62" x2="290" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="290" y="56" text-anchor="middle">10</text><line x1="330" y1="62" x2="330" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="330" y="56" text-anchor="middle">12</text><text x="10" y="60" font-weight="700">주</text><text x="10" y="110" font-weight="700">설계</text><rect x="90" y="92" width="40" height="26" rx="3" style="stroke: