<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skinfold-thickness-measurement-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="skinfold-thickness-measurement-t">피부두겹 두께 측정의 단면</title><desc>피부와 피하지방을 두 겹으로 집어 올리고 캘리퍼 두 팔로 그 두께를 재는 단면 모식도. 근육은 집지 않는다</desc><defs><marker id="skinfold-thickness-measurement-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="40" y="230" width="440" height="60" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.3"/><text x="120" y="265" text-anchor="middle" font-size="12">근육</text><polygon points="40,230 40,172 205,172 228,100 292,100 315,172 480,172 480,230" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.3"/><polyline points="40,172 205,172 228,100 292,100 315,172 480,172" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.5"/><text x="110" y="205" text-anchor="middle" font-size="12">피하지방</text><line x1="150" y1="40" x2="228" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4"/><line x1="370" y1="40" x2="292" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4"/><circle cx="228" cy="110" r="4" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><circle cx="292" cy="110" r="4" style="stroke:none;fill:var(--si-navy,#12305c)" stroke-width="1.6"/><line x1="228" y1="135" x2="292" y2="135" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#skinfold-thickness-measurement-ar)" marker-start="url(#skinfold-thickness-measurement-ar)"/><text x="260" y="127" text-anchor="middle">두께(mm)</text><text x="60" y="100" text-anchor="middle" font-size="12">피부</text><line x1="60" y1="100" x2="120" y2="172" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="120" cy="172" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="440" y="62" text-anchor="middle" font-size="12">캘리퍼</text><line x1="440" y1="62" x2="345" y2="72" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="345" cy="72" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="440" y="150" text-anchor="middle" font-size="12">집은 주름(피부+피하지방)</text><line x1="440" y1="150" x2="300" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="300" cy="150" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/></svg>
