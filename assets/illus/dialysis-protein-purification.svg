eral,#5c6b7f);fill:none" stroke-width="2" marker-end="url(#dialysis-protein-purification-ar-1)"/><line x1="20" y1="462" x2="340" y2="462" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><text x="20" y="478" font-weight="700">재접힘용 순차 투석:</text><text x="20" y="494" font-weight="700">변성제(요소) 농도를 단계적으로 낮춘다</text><path d="M30 500 L40 554 L86 554 L96 500 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8" fill-opacity="1"/><text x="63" y="576" text-anchor="middle">변성제 농도 높음</text><path d="M150 500 L160 554 L206 554 L216 500 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8" fill-opacity="0.55"/><text x="183" y="576" text-anchor="middle">중간</text><path d="M270 500 L280 554 L326 554 L336 500 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8" fill-opacity="0.22"/><text x="303" y="576" text-anchor="middle">낮음</text><line x1="98" y1="526" x2="140" y2="526" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2" marker-end="url(#dialysis-protein-purification-ar-1)"/><line x1="218" y1="526" x2="260" y2="526" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2" marker-end="url(#dialysis-protein-purification-ar-1)"/><text x="20" y="604" style="fill:var(--si-general,#5c6b7f)">효율은 컷오프 · 시간 · 바깥 부피 · 교체 횟수에 좌우된다</text></svg>
