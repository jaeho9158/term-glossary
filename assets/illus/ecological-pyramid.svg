<svg class="si si-illus" viewBox="0 0 360 646" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="생태 피라미드: 단계가 올라갈수록 에너지는 약 10%씩 줄어든다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="ecological-pyramid-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="ecological-pyramid-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="14" y="22" font-weight="700">에너지 피라미드 (정상형)</text><text x="14" y="42" style="fill:var(--si-general,#5c6b7f)">막대 안 숫자: kJ/m²·년 (가상 예)</text><rect x="85" y="64" width="50" height="44" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="110" y="91" text-anchor="middle" font-weight="700">10</text><text x="222" y="81" font-weight="700">3차 소비자</text><text x="222" y="102" style="fill:var(--si-general,#5c6b7f)">최상위 포식자</text><line x1="110" y1="128" x2="110" y2="110" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#ecological-pyramid-ar)"/><text x="118" y="124" font-weight="700" style="fill:var(--si-accent,#2454ff)">약 10%</text><rect x="60" y="130" width="100" height="44" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="110" y="157" text-anchor="middle" font-weight="700">100</text><text x="222" y="147" font-weight="700">2차 소비자</text><text x="222" y="168" style="fill:var(--si-general,#5c6b7f)">육식동물</text><line x1="110" y1="194" x2="110" y2="176" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#ecological-pyramid-ar)"/><text x="118" y="190" font-weight="700" style="fill:var(--si-accent,#2454ff)">약 10%</text><rect x="35" y="196" width="150" height="44" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="110" y="223" text-anchor="middle" font-weight="700">1,000</text><text x="222" y="213" font-weight="700">1차 소비자</text><text x="222" y="234" style="fill:var(--si-general,#5c6b7f)">초식동물</text><line x1="110" y1="260" x2="110" y2="242" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#ecological-pyramid-ar)"/><text x="118" y="256" font-weight="700" style="fill:var(--si-accent,#2454ff)">약 10%</text><rect x="10" y="262" width="200" height="44" rx="3" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="110" y="289" text-anchor="middle" font-weight="700">10,000</text><text x="222" y="279" font-weight="700">생산자</text><text x="222" y="300" style="fill:var(--si-general,#5c6b7f)">식물·광합성</text><text x="14" y="340">단계마다 약 10%만 다음 단계 생물량으로 저장되고,</text><text x="14" y="360">나머지는 성장·호흡·번식 등 대사에 사용.</text><circle cx="34" cy="408" r="6.8" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="34" y1="391" x2="34" y2="397.1" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="34" y1="418.9" x2="34" y2="425" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="17" y1="408" x2="23.1" y2="408" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="44.9" y1="408" x2="51" y2="408" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="22.1" y1="396.1" x2="26.2" y2="400.2" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="41.8" y1="415.8" x2="45.9" y2="419.9" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="22.1" y1="419.9" x2="26.2" y2="415.8" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="41.8" y1="400.2" x2="45.9" y2="396.1" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="60" y1="408" x2="96" y2="408" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#ecological-pyramid-ar-1)"/><text x="104" y="404">태양 에너지 중</text><text x="104" y="424">1~2%만 먹이로 변환</text><line x1="14" y1="450" x2="346" y2="450" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="14" y="474" font-weight="700">생물량 피라미드 (수생태계에서 역전 가능)</text><polygon points="40,492 180,492 180,532 40,532" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><polygon points="80,536 140,536 140,576 80,576" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="110" y="517" text-anchor="middle">소비자</text><text x="110" y="561" text-anchor="middle">생산자</text><text x="196" y="517" style="fill:var(--si-general,#5c6b7f)">생물량 큼</text><text x="196" y="561" style="fill:var(--si-general,#5c6b7f)">생물량 작음</text><text x="14" y="606" style="fill:var(--si-general,#5c6b7f)">에너지 피라미드는 보통 정상형임.</text><text x="14" y="626" style="fill:var(--si-general,#5c6b7f)">막대 폭은 에너지 비율과 다름(단순화).</text></svg>
