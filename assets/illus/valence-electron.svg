<svg class="si si-illus" viewBox="0 0 600 222" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="valence-electron-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="valence-electron-t">나트륨과 염소의 원자가 전자</title><desc>원자가 전자 1개를 가진 나트륨이 그 전자를 원자가 전자 7개인 염소에 넘겨, 나트륨 양이온과 바깥 껍질이 8개로 찬 염화 이온이 되어 이온 결합을 이룬다</desc><defs><marker id="valence-electron-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="valence-electron-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><text x="90" y="120" text-anchor="middle" font-size="22">Na</text><circle cx="118" cy="112" r="4" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="220" y="120" text-anchor="middle" font-size="22">Cl</text><circle cx="212" cy="90" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="228" cy="90" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="212" cy="136" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="228" cy="136" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="248" cy="104" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="248" cy="120" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="192" cy="120" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><line x1="124" y1="104" x2="186" y2="104" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4" marker-end="url(#valence-electron-ar)"/><