<svg class="si si-illus" viewBox="0 0 360 592" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="escape-velocity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="escape-velocity-t">탈출속도는 원궤도 속도의 √2배이며 닫힌 궤도와 열린 궤도의 경계이다</title><defs></defs><circle cx="120" cy="200" r="48" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2" fill-opacity="0.8"/><text x="120" y="205" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">지구</text><path d="M120,136 C124.7,136.8 141,137 148,141 C155,145 159.2,153 162,160 C164.8,167 164.5,179.2 165,183" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.2"/><circle cx="120" cy="200" r="64" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><ellipse cx="120" cy="243" rx="98" ry="107" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="6 4"/><polyline points="120,136 130,136.4 140,137.6 150,139.5 160,142.3 170,145.8 180,150.1 190,155.1 200,161 210,167.6 220,175.1 230,183.3 240,192.3 250,202 260,212.6 270,223.9 280,236 290,248.9 300,262.6 310,277 320,292.3 330,308.3 340,325.1 350,342.6" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><circle cx="120" cy="136" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><text x="120" y="124" text-anchor="middle" font-weight="700">발사 지점</text><circle cx="167" cy="176" r="9" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="167" y="181" text-anchor="middle" font-weight="700">1</text><circle cx="75" cy="245" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="75" y="250" text-anchor="middle" font-weight="700">2</text><circle cx="120" cy="350" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="120" y="355" text-anchor="middle" font-weight="700">3</text><circle cx="320" cy="292" r="9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="320" y="297" text-anchor="middle" font-weight="700">4</text><text x="200" y="52" style="fill:var(--si-blue-t,#12305c)">닫힌 궤도: 원·타원</text><text x="200" y="72" style="fill:var(--si-rose-t,#7d2626)">열린 궤도: 포물선</text><text x="200" y="96" font-weight="700">경계가 탈출속도</text><text x="20" y="392">1번 느린 속도: 지표로 떨어진다</text><text x="20" y="412">2번 7.91 km/s: 원궤도</text><text x="50" y="432" font-style="italic" style="fill:var(--si-blue-t,#12305c)">v<tspan dy="0.217em" font-size="92%">c</tspan><tspan dy="-0.2em"> = √(GM/r)</tspan></text><text x="20" y="452">3번 7.91~11.19 km/s: 타원</text><text x="20" y="472">4번 11.19 km/s: 포물선(탈출)</text><text x="50" y="492" font-weight="700" font-style="italic" style="fill:var(--si-rose-t,#7d2626)">v<tspan dy="0.217em" font-size="92%">esc</tspan><tspan dy="-0.2em"> = √(2GM/r)</tspan></text><text x="20" y="522" font-weight="700" font-style="italic">v<tspan dy="0.217em" font-size="92%">esc</tspan><tspan dy="-0.2em"> = √2 × v</tspan><tspan dy="0.217em" font-size="92%">c</tspan></text><text x="20" y="542" font-weight="700">7.91 × 1.414 ≈ 11.19 km/s</text><text x="20" y="572" style="fill:var(--si-general,#5c6b7f)">고도 400 km에서는 10.85 km/s로 줄어든다</text></svg>
