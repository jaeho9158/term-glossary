<svg class="si si-illus" viewBox="0 0 360 648" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기초학력 보장 정책: 제도 흐름과 고2 기초학력 미달 비율" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="basic-academic-skills-guarantee-policy-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">① 제도의 흐름</text><rect x="30" y="40" width="300" height="50" rx="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="180" y="62" text-anchor="middle" font-weight="700">진단검사</text><text x="180" y="82" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">제7조</text><line x1="180" y1="92" x2="180" y2="112" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#basic-academic-skills-guarantee-policy-ar)"/><rect x="30" y="114" width="300" height="50" rx="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="180" y="136" text-anchor="middle" font-weight="700">학습지원대상학생 선정</text><text x="180" y="156" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">제8조</text><line x1="180" y1="166" x2="180" y2="186" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#basic-academic-skills-guarantee-policy-ar)"/><rect x="30" y="188" width="300" height="50" rx="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="180" y="210" text-anchor="middle" font-weight="700">맞춤 학습지원교육</text><text x="180" y="230" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">보호자 상담·학교 밖 기관 연계·보조인력</text><text x="14" y="274">「기초학력 보장법」: 2021.9.24 제정, 2022.3.25 시행</text><text x="14" y="314" font-weight="700">② 고2 기초학력 미달 비율(국가수준 학업성취도평가)</text><rect x="14" y="330" width="12" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="32" y="341">2019년</text><rect x="100" y="330" width="12" height="12" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><text x="118" y="341">2021년</text><text x="14" y="380" font-weight="700">국어</text><rect x="70" y="362" width="52" height="22" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="128" y="379">4.0%</text><rect x="70" y="388" width="92.3" height="22" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="168.3" y="405" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">7.1%</text><text x="14" y="442" font-weight="700">수학</text><rect x="70" y="424" width="117" height="22" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="193" y="441">9.0%</text><rect x="70" y="450" width="184.6" height="22" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="260.6" y="467" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">14.2%</text><text x="14" y="504" font-weight="700">영어</text><rect x="70" y="486" width="46.8" height="22" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="122.8" y="503">3.6%</text><rect x="70" y="512" width="127.4" height="22" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="203.4" y="529" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">9.8%</text><line x1="70" y1="358" x2="70" y2="544" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="14" y="578">상승폭은 3~6%포인트이다. 영어의 증가폭이</text><text x="14" y="598">가장 크고, 수학의 비율이 가장 높다.</text><text x="14" y="628" style="fill:var(--si-general,#5c6b7f)">비율 변화만으로 정책 효과를 단정할 수 없다.</text></svg>
