<svg class="si si-illus" viewBox="0 0 360 562" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="간접법 현금흐름: 당기순이익에서 가감해 영업활동현금흐름을 구한다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="indirect-method-cash-flow-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="indirect-method-cash-flow-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="14" y="22" font-weight="700">당기순이익에서 영업활동현금흐름으로</text><text x="14" y="42" style="fill:var(--si-general,#5c6b7f)">막대 길이는 크기가 아니라 방향을 보이는 개념도</text><text x="14" y="80" font-weight="700">당기순이익</text><rect x="160" y="66" width="85" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="14" y="136" font-weight="700">+ 비현금 비용</text><text x="14" y="156" style="fill:var(--si-general,#5c6b7f)">(감가상각비 등)</text><rect x="245" y="122" width="45" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="14" y="192" font-weight="700">− 비현금 수익</text><text x="14" y="212" style="fill:var(--si-general,#5c6b7f)">(현금 유입 없는 수익)</text><rect x="270" y="178" width="20" height="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="14" y="248" font-weight="700">± 비영업 손익 제거</text><text x="14" y="268" style="fill:var(--si-general,#5c6b7f)">(유형자산처분손익 등)</text><rect x="250" y="234" width="40" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="270" y1="246" x2="288" y2="246" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#indirect-method-cash-flow-ar)"/><line x1="270" y1="246" x2="252" y2="246" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#indirect-method-cash-flow-ar)"/><text x="14" y="304" font-weight="700">± 운전자본 변동</text><text x="14" y="324" style="fill:var(--si-general,#5c6b7f)">(영업 자산·부채 증감)</text><rect x="250" y="290" width="40" height="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="270" y1="302" x2="288" y2="302" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#indirect-method-cash-flow-ar-1)"/><line x1="270" y1="302" x2="252" y2="302" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#indirect-method-cash-flow-ar-1)"/><text x="14" y="360" font-weight="700">= 영업활동현금흐름</text><rect x="160" y="346" width="110" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><line x1="245" y1="90" x2="245" y2="122" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="290" y1="146" x2="290" y2="178" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="270" y1="202" x2="270" y2="234" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="270" y1="258" x2="270" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="270" y1="314" x2="270" y2="346" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="14" y1="394" x2="346" y2="394" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="14" y="416" font-weight="700">당기순이익 + 비현금 비용 − 비현금 수익</text><text x="14" y="452" font-weight="700">± 비영업 손익 ± 운전자본 변동</text><text x="14" y="488" font-weight="700">= 영업활동현금흐름</text><text x="14" y="524" style="fill:var(--si-general,#5c6b7f)">직접법과 합계는 같고 표시 방식만 다름</text><text x="14" y="544" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">감가상각 가산 ≠ 현금 창출</text></svg>
