<svg class="si si-illus" viewBox="0 0 360 540" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동맥 벽 기저막 배출 경로(IPAD)" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="intramural-periarterial-drainage-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="intramural-periarterial-drainage-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="intramural-periarterial-drainage-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">IPAD: 동맥 벽의 기저막을 따라 배출</text><rect x="0" y="64" width="360" height="266" style="stroke:none;fill:var(--si-gray-s,#aab6c6)" stroke-width="0" fill-opacity="0.18"/><line x1="0" y1="64" x2="360" y2="64" style="stroke:currentColor;fill:none" stroke-width="2"/><polygon points="116,64 150,330 210,330 244,64" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1" fill-opacity="0.5"/><polygon points="140,64 164,330 196,330 220,64" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1"/><polygon points="146,64 167,330 193,330 214,64" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1"/><polygon points="164,64 175,330 185,330 196,64" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><text x="350" y="54" text-anchor="end" font-weight="700">뇌 표면</text><line x1="180" y1="84" x2="180" y2="250" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#intramural-periarterial-drainage-ar)"/><line x1="162" y1="290" x2="146.5" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#intramural-periarterial-drainage-ar-1)"/><line x1="198" y1="290" x2="213.5" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#intramural-periarterial-drainage-ar-1)"/><line x1="128" y1="150" x2="135" y2="260" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#intramural-periarterial-drainage-ar-2)"/><line x1="224" y1="260" x2="232" y2="150" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#intramural-periarterial-drainage-ar-2)"/><ellipse cx="207.1" cy="196" rx="5" ry="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1" fill-opacity="0.8"/><ellipse cx="206" cy="208" rx="5" ry="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1" fill-opacity="0.8"/><ellipse cx="204.8" cy="222" rx="5" ry="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1" fill-opacity="0.8"/><text x="262" y="100" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">기저막</text><text x="262" y="120" style="fill:var(--si-blue-s,#7f9ac0)">(IPAD 경로)</text><line x1="260" y1="112" x2="216.5" y2="112" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><text x="262" y="160">혈관 벽의</text><text x="262" y="180">평활근세포</text><line x1="260" y1="170" x2="205" y2="170" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="262" y="236" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">아밀로이드</text><text x="262" y="256" style="fill:var(--si-rose-s,#c97b7b)">침착</text><line x1="260" y1="244" x2="210.4" y2="222" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="8" y="100" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">혈관 바깥</text><text x="8" y="120" style="fill:var(--si-violet-s,#9382bd)">공간(글림프)</text><line x1="92" y1="114" x2="118" y2="128" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1"/><text x="8" y="230" style="fill:var(--si-general,#5c6b7f)">뇌 조직</text><text x="8" y="250" style="fill:var(--si-general,#5c6b7f)">(간질액·용해성</text><text x="8" y="270" style="fill:var(--si-general,#5c6b7f)">물질)</text><text x="10" y="362" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">빨강 ↓ 혈류</text><text x="10" y="382" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">파랑 ↑ IPAD 배출: 혈류와 반대 방향</text><text x="10" y="402" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">보라 점선: 글림프 경로(뇌척수액 유입·유출)</text><text x="10" y="430">혈관이 굳어 배출로가 막히면 아밀로이드가</text><text x="10" y="450">동맥 벽에 쌓인다. 원동력 후보는 혈관 박동이며</text><text x="10" y="470">기전은 연구 중이다</text><text x="10" y="500" style="fill:var(--si-general,#5c6b7f)">둘 다 검증 중인 가설이다. IPAD는</text><text x="10" y="520" style="fill:var(--si-general,#5c6b7f)">사람 조직에서 직접 확인된 증거가 제한적이다.</text></svg>
