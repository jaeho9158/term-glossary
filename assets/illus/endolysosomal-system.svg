<svg class="si si-illus" viewBox="0 0 360 586" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="endolysosomal-system-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="endolysosomal-system-t">엔도솜-리소좀계: 흡수한 물질이 재활용되거나 분해되는 길</title><defs><marker id="endolysosomal-system-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="endolysosomal-system-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">엔도솜-리소좀계: 세포 단면(모식도)</text><rect x="14" y="40" width="332" height="440" rx="44" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2.4" fill-opacity="0.35"/><text x="26" y="66" font-weight="700">세포막</text><text x="200" y="66" style="fill:var(--si-general,#5c6b7f)">세포질 pH 약 7.2</text><circle cx="52" cy="104" r="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="70" y="109">물질 흡수</text><line x1="52" y1="116" x2="52" y2="154" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#endolysosomal-system-ar)"/><ellipse cx="60" cy="178" rx="28" ry="18" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.8" fill-opacity="0.15"/><path d="M34,170 C33.3,169 31.3,165.2 30,164 C28.7,162.8 26.7,163.2 26,163" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><path d="M34,186 C33.3,187 31.3,190.8 30,192 C28.7,193.2 26.7,192.8 26,193" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><text x="104" y="168" font-weight="700">초기 엔도솜</text><text x="104" y="188">RAB5A · RAB4</