<svg class="si si-illus" viewBox="0 0 360 566" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ICER는 비용효과 평면에서 원점과 새 치료 점을 잇는 직선의 기울기이다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="incremental-cost-effectiveness-ratio-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><polygon points="170,256 330,69 330,256" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="0" fill-opacity="0.7"/><line x1="24" y1="256" x2="342" y2="256" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#incremental-cost-effectiveness-ratio-ar)"/><line x1="170" y1="392" x2="170" y2="30" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#incremental-cost-effectiveness-ratio-ar)"/><text x="158" y="46" text-anchor="end">Δ비용</text><text x="338" y="276" text-anchor="end">Δ효과(ΔQALY)</text><text x="164" y="276" text-anchor="end" font-weight="700">비교 치료</text><circle cx="170" cy="256" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><line x1="170" y1="256" x2="330" y2="69" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2" stroke-dasharray="7 4"/><text x="184" y="36" font-weight="700" style="fill:var(--si-green-t,#14543c)">임계값(지불용의)</text><text x="184" y="56" style="fill:var(--si-green-t,#14543c)">NICE: QALY당</text><text x="184" y="76" style="fill:var(--si-green-t,#14543c)">2만~3만 파운드</text><line x1="274" y1="72" x2="316" y2="86" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.2"/><line x1="170" y1="256" x2="280" y2="180" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><circle cx="280" cy="180" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><text x="292" y="172" font-weight="700" style="fill:var(--si-blue-t,#12305c)">새 치료</text><text x="330" y="214" text-anchor="end" style="fill:var(--si-green-t,#14543c)">비용효과적</text><g class="si-rich" font-size="13"  font-weight="700" style="fill:var(--si-blue-t,#12305c)"><text x="256.8" y="240">ICER = </text><text x="320" y="233.8" text-anchor="middle" font-size="10.4">ΔC</text><line x1="311.6" y1="235.8" x2="328.5" y2="235.8" style="stroke:var(--si-blue-t,#12305c)" stroke-width="0.8"/><text x="320" y="244.8" text-anchor="middle" font-size="10.4">ΔE</text></g><text x="30" y="70" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">열위</text><text x="30" y="90" style="fill:var(--si-rose-t,#7d2626)">더 비싸고</text><text x="30" y="110" style="fill:var(--si-rose-t,#7d2626)">효과 나쁨</text><text x="180" y="306" font-weight="700" style="fill:var(--si-green-t,#14543c)">우위</text><text x="180" y="326" style="fill:var(--si-green-t,#14543c)">더 싸고</text><text x="180" y="346" style="fill:var(--si-green-t,#14543c)">효과 좋음</text><text x="30" y="306" font-weight="700" style="fill:var(--si-general,#5c6b7f)">절충 판단</text><text x="30" y="326" style="fill:var(--si-general,#5c6b7f)">더 싸지만</text><text x="30" y="346" style="fill:var(--si-general,#5c6b7f)">효과 나쁨</text><text x="20" y="428" font-weight="700">ICER = (새 치료 비용 − 비교 치료 비용)</text><text x="20" y="448" font-weight="700">÷ (새 치료 효과 − 비교 치료 효과)</text><text x="20" y="478">예: QALY당 약 3,000만 원</text><text x="20" y="508" style="fill:var(--si-general,#5c6b7f)">실선이 점선보다 완만하면 수용한다</text><text x="20" y="528" style="fill:var(--si-general,#5c6b7f)">우위·열위는 ICER 값이 음수이므로</text><text x="20" y="548" style="fill:var(--si-general,#5c6b7f)">값이 아니라 점의 사분면으로 판단한다</text></svg>
