<main class="wide">
  <h1>논문 뷰어</h1>
  <p class="subtitle">논문 텍스트를 붙여넣으면 등록된 학술용어를 찾아 우측에 보여드립니다.</p>

  <div class="viewer-layout">
    <div class="viewer-input no-pdf" id="viewer-input-pane">
      <div class="search-area">
        <textarea id="paper-text" class="search-input" placeholder="논문 초록이나 본문 일부를 붙여넣어 보세요. 예: 본 연구는 유의확률(p-value)이 0.05 미만인 경우를 통계적으로 유의한 상관관계로 정의하였다."></textarea>
        <div id="viewer-rendered" class="viewer-rendered" hidden></div>
        <div id="pdf-toolbar" class="pdf-toolbar" hidden>
          <div class="pdf-toolbar-group">
            <button type="button" id="pdf-zoom-out" title="축소">−</button>
            <span id="pdf-zoom-label">100%</span>
            <button type="button" id="pdf-zoom-in" title="확대">+</button>
            <button type="button" id="pdf-zoom-fit" title="화면 너비에 맞춤">화면맞춤</button>
          </div>
          <div class="pdf-toolbar-group pdf-search-group">
            <input type="search" id="pdf-search-input" placeholder="PDF 본문 검색" aria-label="PDF 본문 검색">
            <button type="button" id="pdf-search-prev" title="이전 결과">↑</button>
            <button type="button" id="pdf-search-next" title="다음 결과">↓</button>
            <span id="pdf-search-count"></span>
          </div>
        </div>
        <div id="pdf-viewer" class="pdf-viewer"></div>
      </div>
      <div class="viewer-input-actions">
        <button id="find-terms-btn" type="button" disabled>용어 찾기</button>
        <button id="edit-text-btn" type="button" hidden>✏️ 다시 입력</button>
        <label class="pdf-upload-label" for="pdf-upload">📄 PDF 파일 선택</label>
        <input type="file" id="pdf-upload" accept="application/pdf" hidden>
      </div>
      <p id="pdf-status" hidden aria-live="polite"></p>
    </div>
    <aside class="viewer-terms">
      <div class="viewer-tabs" role="tablist">
        <button type="button" class="viewer-tab active" data-tab="terms" role="tab">찾은 용어</button>
        <button type="button" class="viewer-tab" data-tab="notes" role="tab">내 메모 <span id="notes-count-badge" class="tab-badge" hidden>0</span></button>
      </div>
      <div class="viewer-tab-panel" id="tab-panel-terms">
        <input type="search" id="term-filter" placeholder="찾은 용어 내 검색" aria-label="찾은 용어 내 검색" disabled>
        <div class="term-filter-bar" id="term-filter-bar">
          <div class="term-filter-group">
            <select id="category-filter-select" aria-label="분야 필터">
              <option value="">전체 분야</option>
            </select>
            <label class="term-filter-checkbox"><input type="checkbox" id="english-only-filter"> 영어 용어만</label>
            <button type="button" id="show-hidden-terms-btn" class="term-filter-link" hidden></button>
          </div>
        </div>
        <h2 id="matched-count">용어 찾기를 눌러보세요</h2>
        <ul class="term-list" id="matched-terms"></ul>
      </div>
      <div class="viewer-tab-panel" id="tab-panel-notes" hidden>
        <p id="notes-empty-msg" class="notes-empty">PDF 본문을 드래그해서 선택하면 하이라이트하고 메모를 남길 수 있어요.</p>
        <ul class="note-list" id="note-list"></ul>
      </div>
    </aside>
  </div>
</main>

<div id="highlight-toolbar" class="highlight-toolbar" hidden>
  <button type="button" class="hl-color" data-color="yellow" title="노랑" style="--hl-color:#ffe066"></button>
  <button type="button" class="hl-color" data-color="green" title="초록" style="--hl-color:#8ce99a"></button>
  <button type="button" class="hl-color" data-color="pink" title="분홍" style="--hl-color:#ffc9de"></button>
  <button type="button" class="hl-color" data-color="blue" title="파랑" style="--hl-color:#a5d8ff"></button>
</div>
<div id="memo-popover" class="memo-popover" hidden>
  <textarea id="memo-textarea" placeholder="메모를 남겨보세요 (선택)"></textarea>
  <div class="memo-popover-actions">
    <button type="button" id="memo-delete-btn" class="memo-btn memo-btn-danger">삭제</button>
    <button type="button" id="memo-save-btn" class="memo-btn memo-btn-primary">저장</button>
