<svg class="si si-illus" viewBox="0 0 360 460" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="four-arithmetic-operations-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="four-arithmetic-operations-t">사칙연산: 네 연산과 계산 순서</title><defs></defs><text x="20" y="26" font-weight="700">① 네 가지 연산과 결과의 이름</text><rect x="20" y="46" width="30" height="30" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="35" y="67" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-blue-t,#12305c)">+</text><text x="62" y="66" font-size="14" font-weight="700">덧셈</text><text x="130" y="66" font-size="15">2 + 2 = 4</text><text x="240" y="66" font-weight="700" style="fill:var(--si-blue-t,#12305c)">→ 합</text><rect x="20" y="86" width="30" height="30" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="35" y="107" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-blue-t,#12305c)">−</text><text x="62" y="106" font-size="14" font-weight="700">뺄셈</text><text x="130" y="106" font-size="15">14 − 8 = 6</text><text x="240" y="106" font-weight="700" style="fill:var(--si-blue-t,#12305c)">→ 차</text><rect x="20" y="126" width="30" height="30" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="35" y="147" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">×</text><text x="62" y="146" font-size="14" font-weight="700">곱셈</text><text x="130" y="146" font-size="15">2 × 3 = 6</text><text x="240" y="146" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">→ 곱  (2 + 2 + 2)</text><rect x="20" y="166" width="30" height="30" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="35" y="187" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">÷</text><text x="62" y="186" font-size="14" font-weight="700">나눗셈</text><text x="130" y="186" font-size="15">48 ÷ 8 = 6</text><text x="240" y="186" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">→ 몫</text><text x="20" y="222" font-weight="700">② 섞여 있을 때의 계산 순서</text><rect x="20" y="234" width="42" height="26" rx="13" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><text x="41" y="252" text-anchor="middle" font-size="12" font-weight="700">괄호</text><text x="69" y="252" text-anchor="middle" font-size="14" font-weight="700">›</text><rect x="76" y="234" width="68" height="26" rx="13" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="110" y="252" text-anchor="middle" font-size="12" font-weight="700">거듭제곱</text><text x="151" y="252" text-anchor="middle" font-size="14" font-weight="700">›</text><rect x="158" y="234" width="94" height="26" rx="13" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="205" y="252" text-anchor="middle" font-size="12" font-weight="700">곱셈·나눗셈</text><text x="259" y="252" text-anchor="middle" font-size="14" font-weight="700">›</text><rect x="266" y="234" width="81" height="26" rx="13" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="306.5" y="252" text-anchor="middle" font-size="12" font-weight="700">덧셈·뺄셈</text><text x="40" y="292" font-size="15">1 − 2 × 3<tspan dy="-0.556em" font-size="72%">4</tspan></text><text x="40" y="320" font-size="15">= 1 − 2 × 81</text><text x="200" y="320" font-size="12" style="fill:var(--si-gray-t,#44546a)">← 거듭제곱 먼저</text><text x="40" y="348" font-size="15">= 1 − 162</text><text x="200" y="348" font-size="12" style="fill:var(--si-gray-t,#44546a)">← 다음 곱셈</text><text x="40" y="376" font-size="15">= −161</text><text x="200" y="376" font-size="12" style="fill:var(--si-gray-t,#44546a)">← 마지막 뺄셈</text><text x="20" y="420" font-weight="700">1 + 2 × 3 = 7,   (1 + 2) × 3 = 9</text><text x="20" y="442" font-size="12">같은 순위끼리는 왼쪽부터: 10 − 4 + 3 = 9</text></svg>
