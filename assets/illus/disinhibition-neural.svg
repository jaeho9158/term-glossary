<svg class="si si-illus" viewBox="0 0 360 524" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="탈억제 회로: VIP가 SOM을 억제하면 E의 억제가 풀린다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="disinhibition-neural-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="95" y="26" text-anchor="middle" font-weight="700">VIP 꺼짐</text><circle cx="95" cy="72" r="21" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.2" opacity="0.55" fill-opacity="0.25"/><text x="95" y="77" text-anchor="middle" font-weight="400" style="fill:var(--si-general,#5c6b7f)">VIP</text><circle cx="95" cy="142" r="21" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.2" opacity="1" fill-opacity="1"/><text x="95" y="147" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">SOM</text><circle cx="95" cy="212" r="21" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2" opacity="0.55" fill-opacity="0.25"/><text x="95" y="217" text-anchor="middle" font-weight="400" style="fill:var(--si-general,#5c6b7f)">E</text><line x1="95" y1="94" x2="95" y2="119" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="87" y1="119" x2="103" y2="119" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="95" y1="164" x2="95" y2="189" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4"/><line x1="87" y1="189" x2="103" y2="189" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4"/><line x1="18" y1="212" x2="72" y2="212" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#disinhibition-neural-ar)"/><text x="18" y="198" style="fill:var(--si-blue-t,#12305c)">입력 10</text><text x="125" y="147" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">S = 8</text><text x="125" y="217" font-weight="700" style="fill:var(--si-blue-t,#12305c)">E = 2</text><text x="268" y="26" text-anchor="middle" font-weight="700">VIP 켜짐</text><circle cx="268" cy="72" r="21" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2.2" opacity="1" fill-opacity="1"/><text x="268" y="77" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">VIP</text><circle cx="268" cy="142" r="21" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2" opacity="0.55" fill-opacity="0.25"/><text x="268" y="147" text-anchor="middle" font-weight="400" style="fill:var(--si-general,#5c6b7f)">SOM</text><circle cx="268" cy="212" r="21" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.2" opacity="1" fill-opacity="1"/><text x="268" y="217" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">E</text><line x1="268" y1="94" x2="268" y2="119" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.4"/><line x1="260" y1="119" x2="276" y2="119" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.4"/><line x1="268" y1="164" x2="268" y2="189" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="260" y1="189" x2="276" y2="189" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="191" y1="212" x2="245" y2="212" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#disinhibition-neural-ar)"/><text x="191" y="198" style="fill:var(--si-blue-t,#12305c)">입력 10</text><text x="298" y="147" font-weight="700" style="fill:var(--si-general,#5c6b7f)">S = 0</text><text x="298" y="217" font-weight="700" style="fill:var(--si-blue-t