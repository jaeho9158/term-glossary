<svg class="si si-illus" viewBox="0 0 560 320" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="normal-modes-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="normal-modes-t">두 질량과 용수철 세 개의 노멀 모드</title><desc>벽 사이에 같은 용수철 세 개와 같은 질량 두 개를 일직선으로 놓은 모형에서, 두 질량이 같은 방향으로 움직이는 모드와 반대 방향으로 움직이는 모드를 화살표로 나타낸 모식도</desc><defs><marker id="normal-modes-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><line x1="280" y1="254" x2="280" y2="282.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="43" font-size="12" font-weight="700">모드 1: 두 질량이 같은 방향으로 움직인다</text><rect x="25" y="65" width="10" height="60" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.35"/><rect x="525" y="65" width="10" height="60" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.35"/><polyline points="35,95 45,95 54.2,104 72.5,86 90.8,104 109.2,86 127.5,104 145.8,86 155,95 165,95" style="stroke:currentColor;fill:none" stroke-width="1.6"/><polyline points="205,95 215,95 225.8,104 247.5,86 269.2,104 290.8,86 312.5,104 334.2,86 345,95 355,95" style="stroke:currentColor;fill:none" stroke-width="1.6"/><polyline points="395,95 405,95 414.2,104 432.5,86 450.8,104 469.2,86 487.5,104 505.8,86 515,95 525,95" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="165" y="75" width="40" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.25"/><text x="185" y="100" text-anchor="middle" font-size="12">m<tspan dy="0.278em" font-size="72%">1</tspan></text><rect x="355" y="75" width="40" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.25"/><text x="375" y="100" text-anchor="middle" font-size="12">m<tspan dy="0.278em" font-size="72%">2</tspan></text><line x1="185" y1="63" x2="227" y2="63" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#normal-modes-ar)"/><line x1="375" y1="63" x2="417" y2="63" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#normal-modes-ar)"/><text x="540" y="43" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">ω<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> = √(k/m)</tspan></text><text x="20" y="198" font-size="12" font-weight="700">모드 2: 두 질량이 반대 방향으로 움직인다</text><rect x="25" y="220" width="10" height="60" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.35"/><rect x="525" y="220" width="10" height="60" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.35"/><polyline points="35,250 45,250 54.2,259 72.5,241 90.8,259 109.2,241 127.5,259 145.8,241 155,250 165,250" style="stroke:currentColor;fill:none" stroke-width="1.6"/><polyline points="205,250 215,250 225.8,259 247.5,241 269.2,259 290.8,241 312.5,259 334.2,241 345,250 355,250" style="stroke:currentColor;fill:none" stroke-width="1.6"/><polyline points="395,250 405,250 414.2,259 432.5,241 450.8,259 469.2,241 487.5,259 505.8,241 515,250 525,250" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="165" y="230" width="40" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.25"/><text x="185" y="255" text-anchor="middle" font-size="12">m<tspan dy="0.278em" font-size="72%">1</tspan></text><rect x="355" y="230" width="40" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.25"/><text x="375" y="255" text-an