<svg class="si si-illus" viewBox="0 0 360 536" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brix-refractometer-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="brix-refractometer-t">굴절계: 프리즘의 빛 꺾임과 °Bx 계산</title><defs><marker id="brix-refractometer-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="brix-refractometer-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">굴절계: 빛의 꺾임으로 당 농도를 읽는다</text><polygon points="50,130 220,130 250,206 20,206" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="170" y="184" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">프리즘</text><path d="M90 130Q125 86 160 130Z" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><line x1="210" y1="106" x2="154" y2="123" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="206" y="100" font-weight="700">시료 한 방울</text><line x1="125" y1="200" x2="125" y2="46" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="40" y1="232" x2="125" y2="132" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6" marker-end="url(#brix-refractometer-ar)"/><line x1="125" y1="130" x2="196" y2="78" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#brix-refractometer-ar-1)"/><path d="M125 94A36 36 0 0 1 154 108.7" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="136" y="60" font-weight="700">꺾임 각도 → 굴절률</text><text x="14" y="254" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">나트륨 D선 589.3 nm</text><text x="14" y="278" style="fill:var(--si-general,#5c6b7f)">ATC: 20 °C 기준으로 온도 보상</text><line x1="14" y1="296" x2="346" y2="296" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="14" y="324" font-weight="700">12 °Bx = 용액 100 g 속 고형분 12 g</text><rect x="24" y="338" width="37.4" height="36" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="61.4" y="338" width="274.6" height="36" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="198.7" y="362" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">물 88 g</text><line x1="42" y1="374" x2="42" y2="386" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4"/><text x="24" y="406" font-weight="700" style="fill:var(--si-blue-t,#12305c)">용해 고형분 12 g</text><text x="14" y="440" font-weight="700">물 100 g당 환산: 12 ÷ 88 × 100 ≈ 13.6 g</text><text x="14" y="464" style="fill:var(--si-general,#5c6b7f)">12(용액 기준)와 13.6(물 기준)을 혼동하지 말 것</text><text x="14" y="494" style="fill:var(--si-general,#5c6b7f)">10 °Bx 미만: 1 °C 차이 ≈ 0.06 °Bx</text><text x="14" y="516" style="fill:var(--si-general,#5c6b7f)">자당 외 용해 고형분도 포함 (SSC 근사)</text></svg>
