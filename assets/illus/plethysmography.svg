<svg class="si si-illus" viewBox="0 0 560 320" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="체적변동기록법의 장치 구성" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>밀폐 챔버 안에서 마우스피스를 문 사람의 폐 부피를, 챔버 압력의 변화와 보일의 법칙으로 계산하는 장치의 모식도</desc><defs></defs><line x1="128" y1="192" x2="128" y2="248.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="240" y1="118" x2="348" y2="103" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="330" y1="150" x2="348" y2="150" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="20" font-size="12" font-weight="700">전신 체적변동기록기(body box)(모식)</text><rect x="30" y="50" width="300" height="250" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2.4" fill-opacity="0.07"/><circle cx="150" cy="110" r="18" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="150" y1="128" x2="150" y2="215" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="150" y1="215" x2="205" y2="215" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="205" y1="215" x2="205" y2="275" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="150" y1="150" x2="185" y2="185" style="stroke:currentColor;fill:none" stroke-width="2.2"/><ellipse cx="140" cy="170" rx="24" ry="30" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.3"/><rect x="164" y="114" width="20" height="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.6"/><line x1="184" y1="118" x2="330" y2="118" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><text x="36" y="262" font-size="12">폐(기체 부피를 계산)</text><text x="350" y="96" font-size="12" style="fill:var(--si-amber-s,#d79a2b)">마우스피스(정상 날숨 끝에서 닫음)</text><text x="350" y="150" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">밀폐 챔버(전화 부스 크기)</text><circle cx="75" cy="95" r="15" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6"/><line x1="75" y1="95" x2="83" y2="87" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6"/><text x="75" y="76" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">챔버 압력 변화</text><text x="350" y="196" font-size="12" font-weight="700">보일의 법칙을 두 번 적용한다</text><text x="350" y="218" font-size="12">1) 챔버 압력으로 폐 부피를 구한다</text><text x="350" y="240" font-size="12">2) 폐 안 기체 부피(FRC)를 구한다</text><text x="350" y="272" font-size="12" style="fill:var(--si-accent,#2454ff)">FRC, TLC, 기도저항을 잴 수 있다</text></svg>
