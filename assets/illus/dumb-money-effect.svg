<svg class="si si-illus" viewBox="0 0 360 572" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dumb-money-effect-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="dumb-money-effect-t">덤 머니 효과: 펀드 수익률과 투자자 수익률의 격차</title><defs><marker id="dumb-money-effect-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="dumb-money-effect-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="dumb-money-effect-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">가상의 예(투자자 잔액, 단위는 임의)</text><line x1="20" y1="300" x2="340" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="40" y="228" width="60" height="72" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="70" y="220" text-anchor="middle" font-weight="700">100</text><rect x="150" y="206.4" width="60" height="93.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="150" y="112.8" width="60" height="93.6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="180" y="258.2" text-anchor="middle" font-weight="700">130</text><text x="180" y="164.6" text-anchor="middle" font-weight="700">추가 130</text><text x="180" y="104.8" text-anchor="middle" font-weight="700">260</text><rect x="260" y="150.2" width="60" height="149.8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="290" y="142.2" text-anchor="middle" font-weight="700">208</text><text x="70" y="320" text-anchor="middle">첫해 초</text><text x="180" y="320" text-anchor="middle">첫해 말 =</text><text x="180" y="340" text-anchor="middle">둘째 해 초</text><text x="290" y="320" text-anchor="middle">둘째 해 말</text><line x1="70" y1="66" x2="176" y2="66" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" marker-end="url(#dumb-money-effect-ar)"/><text x="123" y="52" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">첫해 +30%</text><line x1="186" y1="66" x2="290" y2="66" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#dumb-money-effect-ar-1)"/><text x="238" y="52" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">둘째 해 −20%</text><text x="10" y="372">펀드 수익률: 1.3×0.8−1</text><line x1="180" y1="384" x2="180" y2="420" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><rect x="180" y="390" width="32" height="16" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="220" y="403" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">두 해 누적 +4%</text><text x="10" y="436">투자자 현금흐름 −100, −130, +208</text><rect x="126" y="444" width="54" height="16" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="188" y="457" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">연 수익률 약 −6.8%</text><line x1="126" y1="480" x2="212" y2="480" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#dumb-money-effect-ar-2)" marker-start="url(#dumb-money-effect-ar-2)"/><text x="169" y="502" text-anchor="middle" font-weight="700">펀드와 투자자의 수익률 격차</text><text x="180" y="532" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">실적이 좋은 뒤에 몰린 큰 돈이</text><text x="180" y="552" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">하락한 해를 맞아 격차가 생김</text></svg>
