<svg class="si si-illus" viewBox="0 0 600 330" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="equation-of-circle-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="equation-of-circle-t">원의 방정식: 중심 (3, −2), 반지름 5</title><defs><marker id="equation-of-circle-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="50" y1="140" x2="300" y2="140" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.6" marker-end="url(#equation-of-circle-ar)"/><line x1="110" y1="300" x2="110" y2="60" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.6" marker-end="url(#equation-of-circle-ar)"/><text x="300" y="156" text-anchor="middle" font-style="italic">x</text><text x="122" y="64" font-style="italic">y</text><circle cx="170" cy="180" r="100" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2.4" fill-opacity="0.1"/><line x1="170" y1="180" x2="270" y2="180" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="170" cy="180" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="130" cy="100" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="160" y="202" text-anchor="end" font-weight="700">중심 (3, −2)</text><text x="220" y="172" text-anchor="middle" font-weight="700">r = 5</text><text x="122" y="92" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">(1, 2)</text><text x="330" y="70" font-weight="700">표준형</text><text x="330" y="92">(x − 3)<tspan baseline-shift="super" font-size="72%">2</tspan> + (y + 2)<tspan baseline-shift="super" font-size="72%">2</tspan> = 25</text><text x="330" y="128" font-weight="700">일반형</text><text x="330" y="150">x<tspan baseline-shift="super" font-size="72%">2</tspan> + y<tspan baseline-shift="super" font-size="72%">2</tspan> − 6x + 4y − 12 = 0</text><text x="330" y="196" style="fill:var(--si-rose-s,#c97b7b)">점 (1, 2)까지 거리의 제곱</text><text x="330" y="218" style="fill:var(--si-rose-s,#c97b7b)">= 2<tspan baseline-shift="super" font-size="72%">2</tspan> + 4<tspan baseline-shift="super" font-size="72%">2</tspan> = 20 &lt; 25</text><text x="330" y="240" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">→ 원의 안쪽</text></svg>
