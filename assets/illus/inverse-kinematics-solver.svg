ke-width="1.8"/><text x="275" y="424" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">관절각 θ<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">, θ</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><text x="20" y="466">같은 목표라도 관절각이 둘 이상일 수 있다.</text><text x="20" y="486" style="fill:var(--si-general,#5c6b7f)">해석적 방법: 닫힌 수식, 빠르나 구조에 따라 제한</text><text x="20" y="506" style="fill:var(--si-general,#5c6b7f)">수치적 방법: 야코비안 전치·유사역행렬로 반복 수렴</text></svg>
