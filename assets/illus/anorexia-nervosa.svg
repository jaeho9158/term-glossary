<svg class="si si-illus" viewBox="0 0 360 344" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="anorexia-nervosa-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="anorexia-nervosa-t">신경성 식욕부진증: BMI에 따른 성인 심각도 구간</title><defs><marker id="anorexia-nervosa-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker><marker id="anorexia-nervosa-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="28" text-anchor="middle" font-weight="700">BMI = 체중(kg) ÷ 키(m)<tspan baseline-shift="super" font-size="92%">2</tspan></text><text x="193" y="58" text-anchor="middle">예: 키 160 cm, 체중 42 kg</text><text x="193" y="80" text-anchor="middle">42 ÷ 1.6<tspan baseline-shift="super" font-size="92%">2</tspan> ≈ 16.4</text><line x1="193" y1="90" x2="193" y2="112" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" marker-end="url(#anorexia-nervosa-ar)"/><rect x="30" y="116" width="68" height="62" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.51"/><text x="64" y="142" text-anchor="middle" font-weight="700">극도</text><text x="64" y="164" text-anchor="middle">15 미만</text><rect x="98" y="116" width="68" height="62" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.36"/><text x="132" y="142" text-anchor="middle" font-weight="700">고도</text><text x="132" y="164" text-anchor="middle">15~15.99</text><rect x="166" y="116" width="68" height="62" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.3"/><text x="200" y="142" text-anchor="middle" font-weight="700">중등도</text><text x="200" y="164" text-anchor="middle">16~16.99</text><rect x="234" y="116" width="102" height="62" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.18"/><text x="285" y="142" text-anchor="middle" font-weight="700">경도</text><text x="285" y="164" text-anchor="middle">17 이상</text><rect x="166" y="116" width="68" height="62" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3"/><line x1="98" y1="178" x2="98" y2="186" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="98" y="204" text-anchor="middle">15</text><line x1="166" y1="178" x2="166" y2="186" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="166" y="204" text-anchor="middle">16</text><line x1="234" y1="178" x2="234" y2="186" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="234" y="204" text-anchor="middle">17</text><line x1="138.8" y1="232" x2="43.6" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#anorexia-nervosa-ar-1)"/><text x="146.8" y="237" style="fill:var(--si-general,#5c6b7f)">BMI가 낮을수록 심각</text><text x="14" y="280" font-weight="700">BMI는 심각도 지표일 뿐이다.</text><text x="14" y="302" style="fill:var(--si-general,#5c6b7f)">진단은 DSM-5 기준 (A)~(C)</text><text x="14" y="324" style="fill:var(--si-general,#5c6b7f)">전체를 확인해야 한다.</text></svg>
