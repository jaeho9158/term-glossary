<svg class="si si-illus" viewBox="0 0 440 270" style="max-width:440px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lift-to-drag-ratio-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="lift-to-drag-ratio-t">활공 경로의 직각삼각형: 양항비 = 수평거리 ÷ 잃은 고도</title><defs><marker id="lift-to-drag-ratio-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><line x1="70" y1="50" x2="70" y2="200" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="70" y1="200" x2="390" y2="200" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="70" y1="50" x2="390" y2="200" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#lift-to-drag-ratio-ar)"/><polyline points="82,200 82,188 70,188" style="stroke:currentColor;fill:none" stroke-width="1"/><path d="M348.3,180.5 A46,46 0 0 0 344,200" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="331.4" y="192" text-anchor="middle">a</text><text x="60" y="128" text-anchor="end" font-style="italic">h</text><text x="230" y="224" text-anchor="middle" font-style="italic">d</text><text x="210" y="100" style="fill:var(--si-accent,#2454ff)">활공 경로</text><text x="20" y="256" style="fill:var(--si-general,#5c6b7f)">L/D = d/h = 1/tan a</text></svg>
