="si-marker"><circle cx="22" cy="366" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="22" y="370" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">1</text></g><text x="42" y="371">태양풍: 태양에서 오는 고에너지 입자</text><g class="si-marker"><circle cx="22" cy="394" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="22" y="398" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">2</text></g><text x="42" y="399">자기권: 입자를 옆으로 비껴 가게 함</text><g class="si-marker"><circle cx="22" cy="422" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="22" y="426" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text></g><text x="42" y="427">지구자기장: 쌍극자 자기력선(푸른 선)</text><g class="si-marker"><circle cx="22" cy="450" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="22" y="454" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">4</text></g><text x="42" y="455">오로라: 극지방에 든 입자가 공기 분자와 충돌</text><g class="si-marker"><circle cx="22" cy="478" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="22" y="482" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">5</text></g><text x="42" y="483">지표 아래 약 3000 km 액체 외핵의 대류</text><text x="10" y="526" font-weight="700" style="fill:var(--si-accent,#2454ff)">대류 → 전류 → 자기장(다이나모)</text><text x="10" y="560" style="fill:var(--si-general,#5c6b7f)">극은 지질 시대에 역전이 반복되었다</text></svg>
