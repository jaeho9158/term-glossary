<svg class="si si-illus" viewBox="0 0 360 370" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="euler-hamiltonian-path-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="euler-hamiltonian-path-t">오일러 경로와 해밀턴 경로: 같은 그래프에서 비교</title><defs></defs><text x="90" y="30" text-anchor="middle" font-size="15" font-weight="700">오일러 경로</text><text x="90" y="52" text-anchor="middle" font-size="12">간선 8개를 한 번씩(번호 순)</text><line x1="40" y1="250" x2="140" y2="250" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="90" cy="250" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="90" y="254" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">4</text></g><line x1="40" y1="250" x2="40" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="40" cy="200" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="40" y="204" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">1</text></g><line x1="140" y1="250" x2="140" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="140" cy="200" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="140" y="204" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">5</text></g><line x1="40" y1="150" x2="140" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="90" cy="150" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="90" y="154" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">2</text></g><line x1="40" y1="150" x2="90" y2="95" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="65" cy="122.5" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="65" y="126.5" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">7</text></g><line x1="140" y1="150" x2="90" y2="95" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="115" cy="122.5" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="115" y="126.5" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">6</text></g><line x1="40" y1="250" x2="140" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="70" cy="220" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="70" y="224" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text></g><line x1="140" y1="250" x2="40" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" opacity="1"/><g class="si-marker"><circle cx="70" cy="180" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="70" y="184" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-bg,#ffffff)">8</text></g><circle cx="40" cy="250" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="2"/><circle cx="140" cy="250" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="2"/><circle cx="40" cy="150" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="2"/><circle cx="140" cy="150" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="2"/><circle cx="90" cy="95" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="2"/><text x="34" y="276" text-anchor="middle" font-size="12" font-weight="700">출발</text><text x="146" y="276" text-anchor="middle" font-size="12" font-weight="700">도착</text><text x="270" y="30" text-anchor="middle" font-size="15" font-weight="700">해밀턴 경로</text><text x="270" y="52" text-anchor="middle" font-size="12">정점 5개를 한 번씩(번호 순)</text><line x1="220" y1="250" x2="320" y2="250" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" opacity="1"/><line x1="220" y1="250" x2="220" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/><line x1="320" y1="250" x2="320" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" opacity="1"/><line x1="220" y1="150" x2="320" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/><line x1="220" y1="150" x2="270" y2="95" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" opacity="1"/><line x1="320" y1="150" x2="270" y2="95" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" opacity="1"/><line x1="220" y1="250" x2="320" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/><line x1="320" y1="250" x2="220" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/><circle cx="220" cy="250" r="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="220" y="254.5" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">1</text><circle cx="320" cy="250" r="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="320" y="254.5" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">2</text><circle cx="220" cy="150" r="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="220" y="154.5" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">5</text><circle cx="320" cy="150" r="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="320" y="154.5" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">3</text><circle cx="270" cy="95" r="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="270" y="99.5" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">4</text><text x="214" y="276" text-anchor="middle" font-size="12" font-weight="700">출발</text><text x="214" y="132" text-anchor="middle" font-size="12" font-weight="700">도착</text><line x1="180" y1="20" x2="180" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/><text x="180" y="318" text-anchor="middle" font-size="12">같은 그래프: 차수가 홀수인 정점은 아래 두 꼭짓점(차수 3)뿐이라</text><text x="180" y="336" text-anchor="middle" font-size="12">오일러 경로는 그 둘 중 하나에서 시작해 다른 하나에서 끝난다</text><text x="180" y="354" text-anchor="middle" font-size="12">점선 간선은 해밀턴 경로에서 쓰지 않은 간선이다</text></svg>
