360" x2="124" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="108" y1="360" x2="132" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="116" y1="360" x2="140" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="124" y1="360" x2="148" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="132" y1="360" x2="156" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="140" y1="360" x2="164" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="148" y1="360" x2="172" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="156" y1="360" x2="180" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="164" y1="360" x2="188" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="172" y1="360" x2="196" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="180" y1="360" x2="204" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="188" y1="360" x2="212" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="196" y1="360" x2="220" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="204" y1="360" x2="228" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="212" y1="360" x2="236" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="220" y1="360" x2="244" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="228" y1="360" x2="252" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="236" y1="360" x2="260" y2="336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="244" y1="360" x2="260" y2="344" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="252" y1="360" x2="260" y2="352" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><line x1="180" y1="304" x2="180" y2="332" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#archimedes-principle-ar-2)"/><text x="164" y="320" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">무게</text><line x1="180" y1="402" x2="180" y2="364" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" marker-end="url(#archimedes-principle-ar-1)"/><text x="190" y="394" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">F = ρ·g·V</text><text x="14" y="356" style="fill:var(--si-blue-s,#7f9ac0)">밀어낸</text><text x="14" y="378" style="fill:var(--si-blue-s,#7f9ac0)">부피 V</text><line x1="64" y1="372" x2="102" y2="350" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2"/><text x="14" y="436" font-weight="700">떠 있으면 부력 = 무게</text><text x="14" y="462">수선면적 120 m²</text><text x="14" y="484" style="fill:var(--si-general,#5c6b7f)">TPC ≈ 1.23 t/cm (해수 1,025 kg/m³)</text><text x="14" y="518" font-weight="700">③ 공기 중과 물속에서 재기</text><line x1="50" y1="532" x2="110" y2="532" style="stroke:currentColor;fill:none" stroke-width="3"/><polyline points="80,532 88,541 72,547 88,553 72,559 88,565 72,571 80,580" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="62" y="580" width="36" height="30" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><rect x="200" y="576" width="120" height="62" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="0" fill-opacity="0.6"/><polyline points="200,564 200,638 320,638 320,564" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="230" y1="532" x2="290" y2="532" style="stroke:currentColor;fill:none" stroke-width="3"/><polyline points="260,532 268,539.7 252,543 268,546.3 252,549.7 268,553 252,556.3 260,564" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="242" y="586" width="36" height="30" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><line x1="260" y1="564" x2="260" y2="586" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="80" y="660" text-anchor="middle" font-weight="700">공기 중 10 N</text><text x="260" y="660" text-anchor="middle" font-weight="700">물속 7 N</text><text x="14" y="696" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">부력 = 10 − 7 = 3 N</text><text x="14" y="722">밀어낸 유체의 무게 =</text><text x="14" y="744">공기 중 무게 − 유체 속 겉보기 무게</text><text x="14" y="778" style="fill:var(--si-general,#5c6b7f)">부력은 크기만 정한다. 자세 안정성은</text><text x="14" y="800" style="fill:var(--si-general,#5c6b7f)">부심과 무게중심으로 따로 판단한다.</text></svg>
