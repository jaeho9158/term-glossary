ue-f,#dde5f0)" stroke-width="1.6"/><g class="si-rich" font-size="13"  font-weight="700"><text x="100.1" y="756">평형: </text><text x="143.6" y="749.8" text-anchor="middle" font-size="10.4">R<tspan dy="0.217em" font-size="92%">x</tspan></text><line x1="135.4" y1="751.8" x2="151.9" y2="751.8" style="stroke:currentColor" stroke-width="0.8"/><text x="143.6" y="760.8" text-anchor="middle" font-size="10.4">R<tspan dy="0.217em" font-size="92%">3</tspan></text><text x="153.4" y="756"> = </text><text x="178.9" y="749.8" text-anchor="middle" font-size="10.4">R<tspan dy="0.217em" font-size="92%">1</tspan></text><line x1="170.7" y1="751.8" x2="187.1" y2="751.8" style="stroke:currentColor" stroke-width="0.8"/><text x="178.9" y="760.8" text-anchor="middle" font-size="10.4">R<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="188.6" y="756"> (G 지침 0)</text></g><text x="14" y="792">예(가상): R<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em"> = 100 Ω, R</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> = 200 Ω,</tspan></text><text x="14" y="816" font-weight="700">R<tspan dy="0.217em" font-size="92%">3</tspan><tspan dy="-0.2em"> = 150 Ω → R</tspan><tspan dy="0.217em" font-size="92%">x</tspan><tspan dy="-0.2em"> = 75 Ω</tspan></text></svg>
