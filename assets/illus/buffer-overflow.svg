roke-width="2.4"/><line x1="340" y1="250" x2="324" y2="250" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#buffer-overflow-ar-1)"/><text x="262" y="102" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">넘친 글자</text><line x1="320" y1="114" x2="320" y2="154" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><text x="232" y="182" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">경계 검사</text><text x="100" y="218" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">변조 → 공격 코드로 점프</text><polyline points="42,270 42,276 66,276 66,270" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><text x="54" y="296" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">카나리</text><polyline points="70,270 70,276 262,276 262,270" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><text x="166" y="296" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">인접 데이터</text><polyline points="266,270 266,276 318,276 318,270" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><text x="292" y="296" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">반환 주소</text><text x="14" y="336" style="fill:var(--si-general,#5c6b7f)">→ 주소가 커지는 방향, 한 줄이 끝나면 다음 줄로 이어진다.</text><text x="14" y="372" font-size="14" font-weight="700">버퍼 10글자 / 입력 20글자</text><text x="14" y="396" font-size="14" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">→ 초과 10글자가 인접 메모리를 덮어쓴다.</text><text x="14" y="432" style="fill:var(--si-general,#5c6b7f)">막는 방법: 경계 검사, 스택 카나리,</text><text x="14" y="454" style="fill:var(--si-general,#5c6b7f)">ASLR(주소 공간 배치 무작위화),</text><text x="14" y="504" style="fill:var(--si-general,#5c6b7f)">C·C++은 경계를 자동으로 검사하지 않는다.</text><text x="14" y="476" style="fill:var(--si-general,#5c6b7f)">DEP/NX(데이터 실행 방지)</text></svg>
