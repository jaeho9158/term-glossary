<svg class="si si-illus" viewBox="0 0 360 430" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기업가치: 시가총액에 순부채를 더해 쌓는 막대" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="enterprise-value-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><line x1="10" y1="230" x2="350" y2="230" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="18" y="80" width="56" height="150" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><rect x="88" y="20" width="56" height="60" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><rect x="158" y="20" width="56" height="30" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><rect x="232" y="80" width="56" height="150" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><rect x="232" y="50" width="56" height="30" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><line x1="74" y1="80" x2="88" y2="80" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="144" y1="20" x2="158" y2="20" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="214" y1="50" x2="232" y2="50" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><text x="46" y="160" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">100억</text><text x="260" y="160" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">100억</text><text x="260" y="70" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">20억</text><text x="260" y="34" text-anchor="middle" font-size="15" font-weight="700">120억</text><text x="46" y="252" text-anchor="middle" font-weight="700">시가총액</text><text x="116" y="252" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">+총차입금</text><text x="186" y="252" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">−현금성</text><text x="186" y="271.5" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">자산</text><text x="260" y="252" text-anchor="middle" font-weight="700">기업가치</text><text x="260" y="271.5" text-anchor="middle" font-weight="700">(EV)</text><line x1="302" y1="50" x2="302" y2="80" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#enterprise-value-ar)" marker-start="url(#enterprise-value-ar)"/><text x="310" y="60" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">순부채</text><text x="310" y="79.5" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">20억</text><text x="180" y="310" text-anchor="middle" font-size="15" font-weight="700">EV = 시가총액 + 순부채</text><text x="180" y="335" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">순부채 = 총차입금 − 현금성자산</text><text x="180" y="360" text-anchor="middle" font-weight="700">100억 + 20억 = 120억</text><text x="180" y="392" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">기업 전체를 인수하는 총비용(자본구조와 무관)</text><text x="180" y="411.5" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">포함 기준은 분석자마다 달라 일관성이 필요</text></svg>
