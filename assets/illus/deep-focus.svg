<svg class="si si-illus" viewBox="0 0 600 420" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deep-focus-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="deep-focus-t">조리개와 딥 포커스</title><desc>같은 렌즈에서 조리개를 넓게 열면 초점을 맞춘 중경만 선명하고, 조리개를 좁게 조이면 피사계심도가 넓어져 전경·중경·후경이 모두 선명해진다</desc><defs></defs><text x="300" y="44" text-anchor="middle" font-size="12" font-weight="700">조리개를 넓게 열었을 때</text><line x1="60" y1="60" x2="60" y2="180" style="stroke:currentColor;fill:none" stroke-width="3"/><polygon points="140,58 148,120 140,182 132,120" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><line x1="140" y1="58" x2="140" y2="74" style="stroke:currentColor;fill:none" stroke-width="4"/><line x1="140" y1="166" x2="140" y2="182" style="stroke:currentColor;fill:none" stroke-width="4"/><line x1="60" y1="120" x2="560" y2="120" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="4 4"/><circle cx="260" cy="96" r="9" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="260" y1="105" x2="260" y2="140" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="260" y="162" text-anchor="middle" font-size="11">전경 흐림</text><circle cx="380" cy="96" r="9" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><line x1="380" y1="105" x2="380" y2="140" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><text x="380" y="162" text-anchor="middle" font-size="11">중경 선명</text><circle cx="500" cy="96" r="9" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="500" y1="105" x2="500" y2="140" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="500" y="162" text-anchor="middle" font-size="11">후경 흐림</text><rect x="345" y="172" width="70" height="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1"/><text x="380" y="196" text-anchor="middle" font-size="11">피사계심도</text><text x="300" y="244" text-anchor="middle" font-size="12" font-weight="700">조리개를 좁게 조였을 때</text><line x1="60" y1="260" x2="60" y2="380" style="stroke:currentColor;fill:none" stroke-width="3"/><polygon points="140,258 148,320 140,382 132,320" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><line x1="140" y1="258" x2="140" y2="306" style="stroke:currentColor;fill:none" stroke-width="4"/><line x1="140" y1="334" x2="140" y2="382" style="stroke:currentColor;fill:none" stroke-width="4"/><line x1="60" y1="320" x2="560" y2="320" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="4 4"/><circle cx="260" cy="296" r="9" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><line x1="260" y1="305" x2="260" y2="340" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><text x="260" y="362" text-anchor="middle" font-size="11">전경 선명</text><circle cx="380" cy="296" r="9" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><line x1="380" y1="305" x2="380" y2="340" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><text x="380" y="362" text-anchor="middle" font-size="11">중경 선명</text><circle cx="500" cy="296" r="9" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><line x1="500" y1="305" x2="500" y2="340" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><text x="500" y="362" text-anchor="middle" font-size="11">후경 선명</text><rect x="230" y="372" width="300" height="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1"/><text x="380" y="396" text-anchor="middle" font-size="11">피사계심도</text><text x="60" y="24" font-size="11">