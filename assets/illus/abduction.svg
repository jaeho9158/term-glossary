<svg class="si si-illus" viewBox="0 0 360 506" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="abduction-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="abduction-t">귀추: 사전 확률과 가능도로 갱신되는 가설 순위</title><defs><marker id="abduction-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="30" font-weight="700">관찰 사실 C를 가장 잘 설명하는 가설은?</text><text x="14" y="70" font-weight="700">비가 왔다</text><rect x="14" y="80" width="44" height="20" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="66" y="96" style="fill:var(--si-general,#5c6b7f)">사전 .20</text><rect x="14" y="114" width="142.1" height="20" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="3"/><text x="164.1" y="130" font-weight="700">사후 .646</text><line x1="286" y1="84" x2="286" y2="128" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#abduction-ar)"/><text x="294" y="112">×.95</text><text x="14" y="174" font-weight="700">스프링클러</text><rect x="14" y="184" width="22" height="20" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="44" y="200" style="fill:var(--si-general,#5c6b7f)">사전 .10</text><rect x="14" y="218" width="67.3" height="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="89.3" y="234" font-weight="700">사후 .306</text><line x1="286" y1="188" x2="286" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#abduction-ar)"/><text x="294" y="216">×.90</text><text x="14" y="278" font-weight="700">그 밖의 원인</text><rect x="14" y="288" width="154" height="20" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="176" y="304" style="fill:var(--si-general,#5c6b7f)">사전 .70</text><rect x="14" y="322" width="10.6" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="3"/><text x="32.6" y="338" font-weight="700">사후 .048</text><line x1="286" y1="292" x2="286" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#abduction-ar)"/><text x="294" y="320">×.02</text><text x="14" y="396" style="fill:var(--si-general,#5c6b7f)">화살표 옆 값은 가능도이다.</text><text x="14" y="424">'그 밖의 원인'은 사전이 가장 크지만</text><text x="14" y="448">사후는 .048로 줄고, 비가 1위가 된다.</text><text x="14" y="478" style="fill:var(--si-general,#5c6b7f)">채택은 잠정적이며 검증이 뒤따라야 한다.</text></svg>
