t x="26" y="449" font-weight="700">GFP</text><text x="100" y="449">위치 영상화</text><text x="332" y="449" text-anchor="end" font-weight="700" style="fill:var(--si-blue-t,#12305c)">★</text><text x="14" y="232">dCas9는 두 변이로 DNA를 자르지 않고</text><text x="14" y="252" font-weight="700">결합만 한다. 이펙터 자리에 붙는 도메인:</text><text x="14" y="486" font-weight="700">DNA 서열은 그대로 두고, 붙이는 도메인만</text><text x="14" y="506" font-weight="700">바꾸면 기능이 바뀐다.</text></svg>
