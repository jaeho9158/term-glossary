<svg class="si si-illus" viewBox="0 0 360 416" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전자친화도: X + e⁻ → X⁻ 에서 방출되는 에너지" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="electron-affinity-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="electron-affinity-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><line x1="16" y1="70" x2="170" y2="70" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="16" y1="251" x2="170" y2="251" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><text x="16" y="60" font-weight="700">Cl + e⁻</text><text x="16" y="273" font-weight="700">Cl⁻</text><line x1="38" y1="72" x2="38" y2="249" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.5" marker-end="url(#electron-affinity-ar)"/><text x="52" y="152.5" font-weight="700">EA = 3.61 eV</text><text x="52" y="174.5">≈ 348.6 kJ/mol</text><line x1="190" y1="70" x2="344" y2="70" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="190" y1="240" x2="344" y2="240" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><text x="190" y="60" font-weight="700">F + e⁻</text><text x="190" y="262" font-weight="700">F⁻</text><line x1="212" y1="72" x2="212" y2="238" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.5" marker-end="url(#electron-affinity-ar-1)"/><text x="226" y="147" font-weight="700">EA = 3.40 eV</text><text x="226" y="169">≈ 328.2 kJ/mol</text><text x="180" y="306" text-anchor="middle">EA(Cl) &gt; EA(F): Cl⁻이 더 안정</text><text x="180" y="342" text-anchor="middle">방출 에너지, 클수록 X⁻가 안정</text><text x="180" y="372" text-anchor="middle" font-weight="700">EA = E(X) − E(X⁻)</text><text x="180" y="396" text-anchor="middle">1 eV = 96.485 kJ/mol</text></svg>
