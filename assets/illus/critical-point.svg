<svg class="si si-illus" viewBox="0 0 360 546" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="임계점: 액체–기체 경계선이 끝나는 점" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="critical-point-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">압력–온도 상평형도와 임계점</text><rect x="230" y="44" width="106" height="76" style="stroke:none;fill:var(--si-amber-f,#fdf0d8)" stroke-width="0" fill-opacity="0.7"/><line x1="50" y1="300" x2="342" y2="300" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#critical-point-ar)"/><line x1="50" y1="300" x2="50" y2="38" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#critical-point-ar)"/><text x="340" y="326" text-anchor="end">온도 T</text><text x="60" y="52">압력 P</text><line x1="230" y1="300" x2="230" y2="126" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="50" y1="120" x2="224" y2="120" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" stroke-dasharray="5 4"/><text x="230" y="320" text-anchor="middle">T<tspan dy="0.217em" font-size="92%">c</tspan></text><text x="46" y="125" text-anchor="end">P<tspan dy="0.217em" font-size="92%">c</tspan></text><path d="M60,290 C68.3,286.3 95,277 110,268 C125,259 136.7,250 150,236 C163.3,222 176.7,203.3 190,184 C203.3,164.7 223.3,130.7 230,120" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.5"/><circle cx="230" cy="120" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="238" y="146" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">임계점</text><text x="100" y="150" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">액