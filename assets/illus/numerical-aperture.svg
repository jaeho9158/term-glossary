<svg class="si si-illus" viewBox="0 0 530 370" style="max-width:530px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="numerical-aperture-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="numerical-aperture-t">개구수: 매질 굴절률이 커지면 같은 반각에서도 NA가 커진다</title><desc>시료 점에서 대물렌즈 전면으로 퍼지는 빛 원뿔의 반각 θ가 같을 때, 공기(n=1.00)보다 액침 오일(n=1.51~1.52)에서 NA = n sin θ가 크다는 모식도</desc><defs><marker id="numerical-aperture-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><text x="20" y="20" font-size="12" font-weight="700">같은 반각 θ, 다른 매질(모식)</text><rect x="23.9" y="120" width="212.3" height="170" style="stroke:none;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.13"/><path d="M19.9,134 C30,132.3 62.6,126.3 80.9,124 C99.3,121.7 113.6,120 130,120 C146.4,120 160.7,121.7 179.1,124 C197.4,126.3 230,132.3 240.1,134" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4"/><line x1="130" y1="290" x2="130" y2="114" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="130" y1="290" x2="31.9" y2="126" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8" marker-end="url(#numerical-aperture-ar)"/><line x1="130" y1="290" x2="228.1" y2="126" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8" marker-end="url(#numerical-aperture-ar)"/><circle cx="130" cy="290" r="4.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><path d="M 130 220 A 70 70 0 0 1 165.0 229.4" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><text x="152" y="206" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">θ</text><text x="130" y="98" text-anchor="middle" font-size="12">대물렌즈 전면</text><text x="130" y="312" text-anchor="middl