<svg class="si si-illus" viewBox="0 0 600 320" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bernoulli-theorem-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bernoulli-theorem-t">피토관으로 유속 구하기</title><defs><marker id="bernoulli-theorem-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><line x1="40" y1="100" x2="110" y2="100" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.3" marker-end="url(#bernoulli-theorem-ar)"/><line x1="40" y1="130" x2="110" y2="130" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.3" marker-end="url(#bernoulli-theorem-ar)"/><line x1="40" y1="160" x2="110" y2="160" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.3" marker-end="url(#bernoulli-theorem-ar)"/><text x="75" y="86" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">유동 속도 v</text><rect x="190" y="106" width="190" height="48" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="150" y="122" width="230" height="16" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="1.6" fill-opacity="0.2"/><text x="270" y="184" text-anchor="middle" font-size="12">측면 구멍</text><line x1="270" y1="170" x2="236" y2="106" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.55"/><text x="120" y="206" text-anchor="middle" font-size="12">정면 개구</text><line x1="135" y1="192" x2="152" y2="132" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.55"/><line x1="380" y1="130" x2="450" y2="130" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="380" y1="114" x2="450" y2="114" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="450" y="96" width="90" height="52" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="495" y="118" text-anchor="middle" font-size="12">압력차</text><text x="495" y="139" text-anchor="middle" font-size="12">p<tspan baseline-shift="sub" font-size="72%">0</tspan> − p</text><g class="si-rich" font-size="13" ><text x="256" y="252">p<tspan baseline-shift="sub" font-size="72%">0</tspan> = p + </text><text x="315.9" y="245.8" text-anchor="middle" font-size="10.4">1</text><line x1="311.1" y1="247.8" x2="320.6" y2="247.8" style="stroke:currentColor" stroke-width="0.8"/><text x="315.9" y="256.8" text-anchor="middle" font-size="10.4">2</text><text x="322.1" y="252">ρv<tspan baseline-shift="super" font-size="72%">2</tspan></text></g><text x="300" y="282" text-anchor="middle">v = √(2(p<tspan baseline-shift="sub" font-size="72%">0</tspan> − p) / ρ)</text></svg>
