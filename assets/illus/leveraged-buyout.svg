<svg class="si si-illus" viewBox="0 0 360 412" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="차입매수: 부채로 자기자본 수익 키우기" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="leveraged-buyout-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="26" font-weight="700">기업가치 (억 원)</text><line x1="40" y1="300" x2="340" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="70" y="198" width="70" height="102" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6" fill-opacity="0.28"/><rect x="70" y="130" width="70" height="68" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.3"/><text x="105" y="245" text-anchor="middle" font-weight="700">부채</text><text x="105" y="265" text-anchor="middle">600</text><text x="105" y="160" text-anchor="middle" font-weight="700">자기자본</text><text x="105" y="180" text-anchor="middle">400</text><text x="105" y="120" text-anchor="middle" font-weight="700">총 1000</text><text x="105" y="322" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">인수 시</text><rect x="230" y="249" width="70" height="51" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6" fill-opacity="0.28"/><rect x="230" y="62" width="70" height="187" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.3"/><text x="265" y="270.5" text-anchor="middle" font-weight="700">부채</text><text x="265" y="290.5" text-anchor="middle">300</text><text x="265" y="151.5" text-anchor="middle" font-weight="700">자기자본</text><text x="265" y="171.5" text-anchor="middle">1100</text><text x="265" y="52" text-anchor="mi