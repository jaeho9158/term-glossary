<svg class="si si-illus" viewBox="0 0 360 458" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="linear-quadratic-regulator-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="linear-quadratic-regulator-t">선형 이차 조절기: Q·R 균형에 따른 폐루프 극의 이동</title><defs><marker id="linear-quadratic-regulator-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="linear-quadratic-regulator-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="20" y="26" font-weight="700">스칼라 예: 폐루프 극이 Q·R에 따라 움직인다</text><text x="20" y="46" style="fill:var(--si-general,#5c6b7f)">(a = b = 1, 가상 계산)</text><rect x="240" y="64" width="100" height="190" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" opacity="0.35"/><text x="334" y="80" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">불안정 영역</text><line x1="20" y1="160" x2="346" y2="160" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="240" y1="64" x2="240" y2="254" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="22" y="182" style="fill:var(--si-general,#5c6b7f)">실수축</text><text x="234" y="78" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">허수축</text><line x1="293" y1="153" x2="307" y2="167" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3"/><line x1="293" y1="167" x2="307" y2="153" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3"/><text x="300" y="192" text-anchor="middle">+1</text><text x="292" y="212" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">개루프 극</text><text x="292" y="230" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(제어 없음)</text><circle cx="177.1" cy="160" r="7" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.4"/><text x="177.1" y="146" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">①</text><circle cx="155.2" cy="160" r="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><text x="155.2" y="146" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-blue-t,#12305c)">②</text><circle cx="41" cy="160" r="7" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.4"/><text x="41" y="146" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--si-green-t,#14543c)">③</text><line x1="145.2" y1="132" x2="51" y2="132" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2" marker-end="url(#linear-quadratic-regulator-ar)"/><text x="37" y="110" font-weight="700" style="fill:var(--si-green-t,#14543c)">Q 키움: 이득 크게, 빠른 수렴</text><line x1="145.2" y1="182" x2="189.1" y2="182" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#linear-quadratic-regulator-ar-1)"/><text x="125.2" y="214" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">R 키움: 이득 작게,</text><text x="125.2" y="234" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">느린 수렴</text><line x1="20" y1="284" x2="340" y2="284" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="20" y="310" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">①</text><text x="42" y="310">Q=1, R=10: K 2.049 · P 20.488 · 극 −1.049</text><text x="20" y="334" font-weight="700" style="fill:var(--si-blue-t,#12305c)">②</text><text x="42" y="334">Q=1, R=1: K 2.414 · P 2.414 · 극 −1.414</text><text x="20" y="358" font-weight="700" style="fill:var(--si-green-t,#14543c)">③</text><text x="42" y="358">Q=10, R=1: K 4.317 · P 4.317 · 극 −3.317</text><text x="20" y="392">dx/dt = x + u, u = −Kx → 폐루프 극 = 1 − K</text><text x="20" y="413" font-size="14">J = ∫(Qx² + Ru²)dt를 최소화한다</text><text x="20" y="436" font-weight="700" style="fill:var(--si-green-t,#14543c)">세 극 모두 왼쪽 반평면: 안정</text></svg>
