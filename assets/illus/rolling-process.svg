<svg class="si si-illus" viewBox="0 0 520 365" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rolling-process-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="rolling-process-t">압연: 작업롤 사이를 지나며 얇아지는 판(4단 밀)</title><desc>위아래 작업롤 두 개 사이로 두께 h0의 판이 들어가 두께 h1로 나오고, 작업롤 바깥에 큰 지지롤이 있는 4단 밀의 모식도</desc><defs><marker id="rolling-process-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="rolling-process-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><polygon points="40,162 235,162 260,174 485,174 485,186 260,186 235,198 40,198" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.3"/><circle cx="260" cy="59" r="55" style="stroke:var(--si-navy,#12305c);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.08"/><circle cx="260" cy="301" r="55" style="stroke:var(--si-navy,#12305c);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.08"/><circle cx="260" cy="144" r="30" style="stroke:var(--si-navy,#12305c);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.3"/><circle cx="260" cy="216" r="30" style="stroke:var(--si-navy,#12305c);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.3"/><line x1="100" y1="162" x2="100" y2="198" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#rolling-process-ar)" marker-start="url(#rolling-process-ar)"/><text x="88" y="175" text-anchor="middle" font-style="italic">h<tspan dy="0.278em" font-size="72%">0</tspan></text><line x1="440" y1="174" x2="440" y2="186" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#rolling-process-ar)" marker-start="url(#rolling-process-ar)"/><text x="462" y="184" text-anchor="middle" font-size="12" font-style="italic">h<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="150" y="224" text-anchor="middle" font-size="12">들어가는 판</text><text x="400" y="214" text-anchor="middle" font-size="12">나오는 판</text><line x1="40" y1="260" x2="170" y2="260" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#rolling-process-ar-1)"/><text x="105" y="280" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">판의 진행 방향</text><text x="430" y="100" font-size="12">작업롤</text><line x1="430" y1="100" x2="288" y2="134" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="288" cy="134" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="430" y="36" font-size="12">지지롤</text><line x1="430" y1="36" x2="312" y2="40" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="312" cy="40" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/></svg>
