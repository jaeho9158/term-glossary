<svg class="si si-illus" viewBox="0 0 600 340" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="열대수렴대와 무역풍" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>위도를 세로로 놓은 모식도. 남북의 무역풍이 적도 부근으로 불어 들어와 열대수렴대에서 만나 상승하고, 위도 약 30도 부근에서는 공기가 내려온다. 북반구 여름에는 띠가 북쪽으로 옮겨 간다</desc><defs><marker id="intertropical-convergence-zone-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="intertropical-convergence-zone-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="60" y1="40" x2="60" y2="330" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="54" y1="64" x2="66" y2="64" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="48" y="68" text-anchor="end" font-size="11">30°N</text><line x1="54" y1="190" x2="66" y2="190" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="48" y="194" text-anchor="end" font-size="11">적도 0°</text><line x1="54" y1="316" x2="66" y2="316" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="48" y="320" text-anchor="end" font-size="11">30°S</text><rect x="70" y="173.2" width="460" height="33.6" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="300" y="195" text-anchor="middle" font-size="12" font-weight="700">열대수렴대(ITCZ): 상승 기류, 구름·비</text><line x1="110" y1="72.4" x2="110" y2="164.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#intertropical-convergence-zone-ar)"/><line x1="110" y1="307.6" x2="110" y2="215.2" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#intertropical-convergence-zone-ar)"/><text x="124" y="114.4" font-size="12">북동 무역풍</text><text x="124" y="265.6" font-size="12">남동 무역풍</text><text x="300" y="57" text-anchor="middle" font-size="11">아열대 하강 기류(건조)</text><text x="300" y="332" text-anchor="middle" font-size="11">아열대 하강 기류(건조)</text><line x1="70" y1="64" x2="530" y2="64" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4"/><line x1="70" y1="316" x2="530" y2="316" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4"/><line x1="480" y1="190" x2="480" y2="139.6" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#intertropical-convergence-zone-ar-1)"/><text x="492" y="152.2" font-size="11">북반구 여름에</text><text x="492" y="167.2" font-size="11">북쪽으로 이동</text></svg>
