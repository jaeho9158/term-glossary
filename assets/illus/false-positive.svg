<svg class="si si-illus" viewBox="0 0 360 694" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="false-positive-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="false-positive-t">위양성: 양성 중 진짜 환자 비율과 반복 검사의 누적 위양성</title><defs><marker id="false-positive-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="24" font-weight="700">위양성: 10,000명을 검사한 가상의 예</text><rect x="20" y="44" width="320" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="20" y="44" width="3" height="28" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="200" y="63" text-anchor="middle" font-weight="700">10,000명</text><text x="16" y="96" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">↑ 질병 있음: 유병률 0.1%</text><text x="20" y="128" font-weight="700">민감도 90% · 특이도 99%</text><text x="20" y="152" style="fill:var(--si-general,#5c6b7f)">위양성률 = 1 − 특이도 = 1%</text><polygon points="41,166 41,178 46,178 36,192 26,178 31,178 31,166" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.35"/><text x="56" y="184" style="fill:var(--si-general,#5c6b7f)">양성으로 나온 사람만 모으면</text><rect x="20" y="206" width="25.2" height="30" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><rect x="45.2" y="206" width="279.7" height="30" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="185.1" y="226" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">위양성 약 99.9명</text><text x="20" y="258" font-weight="700" style="fill:var(--si-green-t,#14543c)">진양성 9명</text><text x="20" y="298" font-size="14" font-weight="700" style="fill:var(--si-accent,#2454ff)">양성 중 진짜 환자 약 8.3%</text><text x="20" y="324" style="fill:var(--si-general,#5c6b7f)">9 ÷ (9 + 99.9)</text><line x1="20" y1="344" x2="340" y2="344" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="368" font-weight="700">검사를 여러 번 하면(특이도 95%, 독립)</text><text x="20" y="394" style="fill:var(--si-general,#5c6b7f)">한 번이라도 위양성일 확률 = 1 − 0.95<tspan dy="-0.435em" font-size="92%">n</tspan></text><line x1="56" y1="548" x2="336" y2="548" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#false-positive-ar)"/><line x1="56" y1="548" x2="56" y2="412" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#false-positive-ar)"/><path d="M56,548 C58.2,546.2 64.9,540.6 69.4,537 C73.9,533.4 78.3,529.9 82.8,526.5 C87.3,523.1 91.7,519.8 96.2,516.6 C100.7,513.4 105.1,510.3 109.6,507.2 C114.1,504.1 118.5,501.1 123,498.2 C127.5,495.3 131.9,492.5 136.4,489.7 C140.9,486.9 145.3,484.2 149.8,481.6 C154.3,479 158.7,476.5 163.2,474 C167.7,471.5 172.1,469.1 176.6,466.7 C181.1,464.3 185.5,462 190,459.7 C194.5,457.4 198.9,455.2 203.4,453.1 C207.9,451 212.3,448.9 216.8,446.9 C221.3,444.9 225.7,442.8 230.2,440.9 C234.7,439 239.1,437.1 243.6,435.3 C248.1,433.5 252.5,431.6 257,429.9 C261.5,428.1 265.9,426.4 270.4,424.8 C274.9,423.2 279.3,421.6 283.8,420 C288.3,418.4 292.7,416.9 297.2,415.4 C301.7,413.9 306.1,412.4 310.6,411 C315.1,409.6 321.8,407.6 324,406.9" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4"/><circle cx="69.4" cy="537" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="69.4" y="568" text-anchor="middle">1</text><line x1="69.4" y1="548" x2="69.4" y2="553" style="stroke:currentColor;fill:none" stroke-width="1.4"/><circle cx="123" cy="498.3" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="123" y="568" text-anchor="middle">5</text><line x1="123" y1="548" x2="123" y2="553" style="stroke:currentColor;fill:none" stroke-width="1.4"/><circle cx="190" cy="459.8" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="190" y="568" text-anchor="middle">10</text><line x1="190" y1="548" x2="190" y2="553" style="stroke:currentColor;fill:none" stroke-width="1.4"/><circle cx="324" cy="406.8" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="324" y="568" text-anchor="middle">20</text><line x1="324" y1="548" x2="324" y2="553" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="60" y="505" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">5.0%</text><text x="133" y="520.3" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">22.6%</text><text x="200" y="481.8" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">40.1%</text><text x="318" y="442" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">64.2%</text><text x="336" y="590" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">검사 횟수 n</text><text x="20" y="620" style="fill:var(--si-general,#5c6b7f)">실제 검사는 독립이 아닐 수 있어 어림값</text><rect x="20" y="640" width="320" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" fill-opacity="0.5"/><text x="180" y="662" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">양성은 확인검사로 재확인이 필요</text></svg>
