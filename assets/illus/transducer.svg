<svg class="si si-illus" viewBox="0 0 600 310" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="초음파 탐촉자" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>탐촉자 안의 압전 소자가 전기 신호를 초음파로 바꿔 젤과 피부를 지나 보내고, 조직 경계에서 반사된 에코를 받아 다시 전기 신호로 바꿔 스캐너로 보내는 모식도</desc><defs><marker id="transducer-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="transducer-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="470" y="20" width="110" height="46" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><text x="525" y="48" text-anchor="middle" font-size="12">스캐너</text><line x1="300" y1="30" x2="300" y2="14" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><line x1="300" y1="14" x2="470" y2="14" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><line x1="470" y1="14" x2="470" y2="30" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><text x="420" y="34" text-anchor="middle" font-size="12">전기 신호</text><rect x="230" y="30" width="140" height="62" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.08"/><rect x="242" y="76" width="116" height="12" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1" fill-opacity="0.5"/><rect x="210" y="92" width="180" height="12" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1" fill-opacity="0.25"/><line x1="40" y1="104" x2="560" y2="104" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><path d="M40,190 C66.7,188.7 140,180.7 200,182 C260,183.3 340,197 400,198 C460,199 533.3,189.7 560,188" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><path d="M40,270 C66.7,268.7 140,261 200,262 C260,263 340,275.3 400,276 C460,276.7 533.3,267.7 560,266" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><line x1="280" y1="108" x2="280" y2="182" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#transducer-ar)"/><line x1="320" y1="190" x2="320" y2="110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#transducer-ar-1)"/><line x1="270" y1="192" x2="270" y2="262" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#transducer-ar)"/><line x1="330" y1="272" x2="330" y2="196" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#transducer-ar-1)"/><text x="150" y="56" text-anchor="middle" font-size="12">탐촉자</text><line x1="176" y1="52" x2="228" y2="52" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="150" y="84" text-anchor="middle" font-size="12">압전 소자</text><line x1="184" y1="80" x2="240" y2="82" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="450" y="98" font-size="12">젤(공기층 제거)</text><line x1="446" y1="96" x2="392" y2="98" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="50" y="98" font-size="12">피부</text><text x="50" y="212" font-size="12">조직 경계 1</text><text x="50" y="292" font-size="12">조직 경계 2</text><text x="262" y="150" text-anchor="end" font-size="12">보내는 초음파</text><text x="338" y="150" font-size="12">돌아오는 에코</text></svg>
