<svg class="si si-illus" viewBox="0 0 360 484" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="life-cycle-hypothesis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="life-cycle-hypothesis-t">생애주기가설: 소득이 끊겨도 소비는 평탄하고 자산이 혹 모양으로 쌓였다 줄어듦</title><defs><marker id="life-cycle-hypothesis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="28" font-weight="700">연간 소득과 소비(만 원/년)</text><rect x="50" y="76" width="193.3" height="33.3" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="0" fill-opacity="0.9"/><rect x="243.3" y="109.3" width="96.7" height="66.7" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="0" fill-opacity="0.9"/><text x="146.7" y="101" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">저축 1,667만 원/년</text><text x="291.7" y="137.3" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">자산 인출</text><text x="291.7" y="157.3" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">3,333만 원/년</text><line x1="50" y1="176" x2="50" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#life-cycle-hypothesis-ar)"/><line x1="50" y1="176" x2="346" y2="176" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#life-cycle-hypothesis-ar)"/><text x="44" y="80" text-anchor="end">5,000</text><text x="44" y="113.3" text-anchor="end">3,333</text><polyline points="50,76 243.3,76 243.3,176 340,176" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><line x1="50" y1="109.3" x2="340" y2="109.3" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><text x="62" y="68" font-weight="700" style="fill:var(--si-blue-t,#12305c)">소득 5,000만 원</text><text x="56" y="131.3" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">소비 3,333만 원</text><line x1="243.3" y1="50" x2="243.3" y2="340" style="stroke:currentColor;fill:none" stroke-width="1.4" stroke-dasharray="5 4"/><text x="243.3" y="46" text-anchor="middle" font-weight="700">은퇴(40년)</text><text x="14" y="200" font-weight="700">누적 자산(만 원)</text><line x1="50" y1="340" x2="50" y2="214" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#life-cycle-hypothesis-ar)"/><line x1="50" y1="340" x2="346" y2="340" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#life-cycle-hypothesis-ar)"/><polygon points="50,340 243.3,230 243.3,340" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.4"/><polygon points="243.3,340 243.3,230 340,340" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.4"/><text x="117.7" y="330" style="fill:var(--si-green-t,#14543c)">쌓임</text><text x="282" y="330" style="fill:var(--si-rose-t,#7d2626)">줄어듦</text><text x="251.3" y="224" font-weight="700">은퇴 직전 최대</text><text x="251.3" y="244" font-weight="700">≈66,667만 원</text><line x1="50" y1="340" x2="50" y2="345" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="50" y="362" text-anchor="middle">0</text><line x1="146.7" y1="340" x2="146.7" y2="345" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="146.7" y="362" text-anchor="middle">20</text><line x1="243.3" y1="340" x2="243.3" y2="345" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="243.3" y="362" text-anchor="middle">40</text><line x1="340" y1="340" x2="340" y2="345" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="340" y="362" text-anchor="middle">60</text><text x="195" y="384" text-anchor="middle" font-weight="700">근로 시작 후 경과 연수(년)</text><text x="14" y="424">평생소득 40×5,000 = 200,000만 원</text><text x="14" y="444">÷ 60년 ≈ 3,333만 원/년</text><text x="14" y="466" style="fill:var(--si-general,#5c6b7f)">검산 40×1,667 ≈ 20×3,333 ≈ 66,667만 원</text></svg>
