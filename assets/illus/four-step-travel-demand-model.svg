<svg class="si si-illus" viewBox="0 0 360 496" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="four-step-travel-demand-model-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="four-step-travel-demand-model-t">4단계 교통수요모형: 통행분포 배분 예(가상값)</title><defs><marker id="four-step-travel-demand-model-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="four-step-travel-demand-model-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="8" y="14" width="78" height="30" rx="5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="47" y="34" text-anchor="middle" font-weight="400">통행발생</text><line x1="88" y1="29" x2="96" y2="29" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#four-step-travel-demand-model-ar)"/><rect x="98" y="14" width="78" height="30" rx="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.6"/><text x="137" y="34" text-anchor="middle" font-weight="700">통행분포</text><line x1="178" y1="29" x2="186" y2="29" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#four-step-travel-demand-model-ar)"/><rect x="188" y="14" width="78" height="30" rx="5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="227" y="34" text-anchor="middle" font-weight="400">수단분담</text><line x1="268" y1="29" x2="276" y2="29" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#four-step-travel-demand-model-ar)"/><rect x="278" y="14" width="78" height="30" rx="5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="317" y="34" text-anchor="middle" font-weight="400">통행배정</text><polyline points="317,46 317,66 137,66" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="137" y1="66" x2="137" y2="48" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#four-step-travel-demand-model-ar-1)"/><text x="227" y="88" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">혼잡 → 통행시간 갱신(피드백)</text><text x="8" y="110" style="fill:var(--si-general,#5c6b7f)">원 크기 = 매력도 · 거리 = 통행시간</text><text x="8" y="130" style="fill:var(--si-general,#5c6b7f)">선 굵기 = 배분 통행량</text><line x1="165" y1="310" x2="205.1" y2="240.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.911111111111111" opacity="0.85"/><circle cx="210" cy="232.1" r="9.9" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><line x1="165" y1="310" x2="70.7" y2="175.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8222222222222222" opacity="0.85"/><circle cx="61.8" cy="162.6" r="15.7" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><line x1="165" y1="310" x2="193.5" y2="326.4" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="17.488888888888887" opacity="0.85"/><circle cx="204" cy="332.5" r="12.1" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><circle cx="165" cy="310" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.4"/><text x="8" y="330" font-weight="700">존 1(출발)</text><text x="8" y="350" style="fill:var(--si-general,#5c6b7f)">발생 1,000통행</text><text x="228" y="224.1">존 2: 매력도 200</text><text x="228" y="244.1" font-weight="700">10분 → 약 131통행</text><text x="85.8" y="154.6">존 3: 매력도 500</text><text x="85.8" y="174.6" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">20분 → 약 82통행</text><text x="224" y="336.5">존 4: 매력도 300</text><text x="224" y="356.5" font-weight="700" style="fill:var(--si-pos,#14543c)">5분 → 약 787통행</text><text x="8" y="402">매력도가 가장 큰 존 3이 가장 적게 받고,</text><text x="8" y="422">가까운 존 4가 대부분을 가져간다.</text><text x="8" y="450" font-weight="700">마찰 = 통행시간<tspan dy="-0.435em" font-size="92%">-2</tspan><tspan dy="0.4em">, 합계 1,000통행</tspan></text><text x="8" y="476" style="fill:var(--si-general,#5c6b7f)">※ 수치는 모두 설명용 가상값</text></svg>
