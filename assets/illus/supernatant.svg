<svg class="si si-illus" viewBox="0 0 520 300" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="supernatant-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="supernatant-t">원심분리 뒤 상등액과 펠릿</title><desc>원심분리 튜브 바닥에 고체 덩어리인 펠릿이 가라앉고 그 위에 상등액이 남은 단면 모식도</desc><defs><marker id="supernatant-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><path d="M200,40 L200,230 Q260,300 320,230 L320,40" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2"/><path d="M202,80 L318,80 L318,215 L202,215 Z" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.18"/><path d="M202,215 L318,215 L318,230 Q260,296 202,230 Z" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.75"/><text x="420" y="140" font-size="12">상등액</text><line x1="420" y1="140" x2="300" y2="140" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="300" cy="140" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="370" y="275" font-size="12">펠릿(가라앉은 고체)</text><line x1="370" y1="275" x2="285" y2="240" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="285" cy="240" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><line x1="110" y1="90" x2="110" y2="240" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#supernatant-ar)"/><text x="110" y="262" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">원심력 방향</text></svg>
