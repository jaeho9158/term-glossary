<svg class="si si-illus" viewBox="0 0 360 560" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hdl-cholesterol-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="hdl-cholesterol-t">HDL 콜레스테롤: 수치 구간과 총콜레스테롤 분할 계산 예</title><defs><clipPath id="hdl-cholesterol-clip0"><polygon points="250,40 325,40 325,64 250,64"/></clipPath><clipPath id="hdl-cholesterol-clip1"><polygon points="300,78 325,78 325,102 300,102"/></clipPath><clipPath id="hdl-cholesterol-clip2"><polygon points="10,192 24,192 24,204 10,204"/></clipPath></defs><text x="180" y="18" text-anchor="middle" font-weight="700">HDL-C 수치 구간 (mg/dL)</text><text x="8" y="57" font-weight="700">남성</text><rect x="50" y="40" width="275" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="50" y="40" width="100" height="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><rect x="200" y="40" width="50" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><rect x="250" y="40" width="75" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><path d="M224.7,52L287.5,-10.8M228.3,55.5L291,-7.2M231.8,59.1L294.6,-3.7M235.4,62.6L298.1,-0.1M238.9,66.1L301.6,3.4M242.4,69.7L305.2,6.9M246,73.2L308.7,10.5M249.5,76.7L312.2,14M253,80.3L315.8,17.5M256.6,83.8L319.3,21.1M260.1,87.4L322.9,24.6M263.6,90.9L326.4,28.1M267.2,94.4L329.9,31.7M270.7,98L333.5,35.2M274.2,101.5L337,38.7M277.8,105L340.5,42.3M281.3,108.6L344.1,45.8M284.9,112.1L347.6,49.4" clip-path="url(#hdl-cholesterol-clip0)" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="0.9"/><polygon points="250,40 325,40 325,64 250,64" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><text x="8" y="95" font-weight="700">여성</text><rect x="50" y="78" width="275" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="50" y="78" width="125" height="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><rect x="200" y="78" width="100" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><rect x="300" y="78" width="25" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><path d="M280.9,90L312.5,58.4M284.5,93.5L316,62M288,97.1L319.6,65.5M291.5,100.6L323.1,69M295.1,104.1L326.6,72.6M298.6,107.7L330.2,76.1M302.1,111.2L333.7,79.6M305.7,114.7L337.2,83.2M309.2,118.3L340.8,86.7" clip-path="url(#hdl-cholesterol-clip1)" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="0.9"/><polygon points="300,78 325,78 325,102 300,102" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><line x1="50" y1="112" x2="325" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="50" y1="112" x2="50" y2="118" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="50" y="134" text-anchor="middle">0</text><line x1="150" y1="112" x2="150" y2="118" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="150" y="134" text-anchor="middle">40</text><line x1="175" y1="112" x2="175" y2="118" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="175" y="134" text-anchor="middle">50</text><line x1="200" y1="112" x2="200" y2="118" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="200" y="134" text-anchor="middle">60</text><line x1="250" y1="112" x2="250" y2="118" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="250" y="134" text-anchor="middle">80</text><line x1="300" y1="112" x2="300" y2="118" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="300" y="134" text-anchor="middle">100</text><rect x="10" y="152" width="14" height="12" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="30" y="163">낮음 · 위험 증가</text><rect x="10" y="172" width="14" height="12" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="30" y="183">높음 · 음의 위험인자</text><rect x="10" y="192" width="14" height="12" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><path d="M-1.7,198L17,179.3M1.1,200.8L19.8,182.1M4,203.7L22.7,185M6.8,206.5L25.5,187.8M9.6,209.3L28.3,190.6M12.4,212.1L31.1,193.4M15.3,215L34,196.3" clip-path="url(#hdl-cholesterol-clip2)" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="0.9"/><polygon points="10,192 24,192 24,204 10,204" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><text x="30" y="203">매우 높음 · 해로울 수 있다는 보고</text><text x="180" y="224" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">mmol/L = mg/dL ÷ 38.67</text><line x1="10" y1="242" x2="350" y2="242" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><text x="180" y="262" text-anchor="middle" font-weight="700">가상 예시: 총콜레스테롤 200, 중성지방 150</text><rect x="50" y="330" width="55" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="77.5" y="349" text-anchor="middle" font-weight="700">50</text><text x="77.5" y="322" text-anchor="middle">HDL-C</text><rect x="105" y="330" width="132" height="28" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="171" y="349" text-anchor="middle" font-weight="700">120</text><text x="171" y="322" text-anchor="middle">LDL-C</text><rect x="237" y="330" width="33" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="253.5" y="349" text-anchor="middle" font-weight="700">30</text><text x="253.5" y="322" text-anchor="middle">TG÷5</text><path d="M50 304 L50 298 L270 298 L270 304" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="160" y="290" text-anchor="middle" font-weight="700">총콜레스테롤 200</text><path d="M105 368 L105 374 L270 374 L270 368" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="187.5" y="394" text-anchor="middle" font-weight="700">비-HDL = 150</text><g class="si-rich" font-size="13" ><text x="10" y="428">LDL = 총콜레스테롤 − HDL − </text><text x="202.2" y="421.8" text-anchor="middle" font-size="10.4">TG</text><line x1="193.2" y1="423.8" x2="211.2" y2="423.8" style="stroke:currentColor" stroke-width="0.8"/><text x="202.2" y="432.8" text-anchor="middle" font-size="10.4">5</text></g><text x="10" y="450" style="fill:var(--si-general,#5c6b7f)">= 200 − 50 − 150/5 = 120 (Friedewald)</text><text x="10" y="472">총콜레스테롤/HDL = 200/50 = 4.0</text><text x="10" y="494" style="fill:var(--si-general,#5c6b7f)">중성지방이 매우 높으면 LDL 계산은 부적합</text><text x="180" y="524" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">위험 표지자이며, 약물로 HDL만 올려도</text><text x="180" y="544" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">사건 감소가 확인되지 않음 (AIM-HIGH 2011)</text></svg>
