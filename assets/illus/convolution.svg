<svg class="si si-illus" viewBox="0 0 360 634" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="convolution-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="convolution-t">합성곱: 뒤집어 밀며 겹친 곳을 곱해 더한다</title><defs><marker id="convolution-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="convolution-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="15" font-weight="700">(x∗h)[n] = Σ<tspan dy="0.217em" font-size="92%">k</tspan><tspan dy="-0.2em"> x[k]·h[n−k]</tspan></text><text x="8" y="64" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">h[k]</text><text x="130" y="95" text-anchor="middle" font-weight="400">0</text><rect x="161" y="76" width="26" height="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.55"/><text x="174" y="71" text-anchor="middle" font-weight="400">1</text><rect x="205" y="88" width="26" height="12" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.55"/><text x="218" y="83" text-anchor="middle" font-weight="400">0.5</text><line x1="106" y1="100" x2="242" y2="100" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="130" y="117" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><text x="174" y="117" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1</text><text x="218" y="117" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">2</text><polyline points="246,92 348,92 348,350 262,350" style="stroke:var(-