<svg class="si si-illus" viewBox="0 0 360 452" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CAP 정리: 네트워크가 분단되면 일관성과 가용성 중 하나를 택한다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="cap-theorem-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="cap-theorem-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="14" y="22" font-weight="700">분단이 생기면 C와 A 중 하나를 고른다</text><path d="M24.3,75 L24.3,60.7 Q24.3,57.3 27.4,57.3 L32.6,57.3 Q35.7,57.3 35.7,60.7 L35.7,75Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><circle cx="30" cy="53.2" r="3.6" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="50" y="66">쓰기: 새 값</text><line x1="30" y1="80" x2="30" y2="104" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#cap-theorem-ar)"/><path d="M324.3,75 L324.3,60.7 Q324.3,57.3 327.4,57.3 L332.6,57.3 Q335.7,57.3 335.7,60.7 L335.7,75Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><circle cx="330" cy="53.2" r="3.6" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="310" y="66" text-anchor="end">읽기</text><line x1="330" y1="80" x2="330" y2="104" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#cap-theorem-ar-1)"/><rect x="14" y="106" width="120" height="56" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="74" y="128" text-anchor="middle" font-weight="700">노드 1</text><text x="74" y="150" text-anchor="middle">값: 새 값</text><rect x="226" y="106" width="120" height="56" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="286" y="128" text-anchor="middle" font-weight="700">노드 2</text><text x="286" y="150" text-anchor="middle">값: 옛 값</text><line x1="134" y1="134" x2="160" y2="134" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="200" y1="134" x2="226" y2="134" style="stroke:currentColor;fill:none" stroke-width="1.8"/><polyline points="160,134 172,120 186,148 200,134" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><text x="180" y="196" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">네트워크 분단</text><line x1="180" y1="184" x2="180" y2="154" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><rect x="14" y="224" width="160" height="118" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="94" y="248" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">C 우선 (CP)</text><text x="94" y="274" text-anchor="middle">노드 2: 응답 보류</text><text x="94" y="294" text-anchor="middle">→ 일관성 유지</text><text x="94" y="314" text-anchor="middle" font-weight="700">→ 가용성 포기</text><rect x="186" y="224" width="160" height="118" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="266" y="248" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">A 우선 (AP)</text><text x="266" y="274" text-anchor="middle">노드 2: 옛 값 응답</text><text x="266" y="294" text-anchor="middle">→ 가용성 유지</text><text x="266" y="314" text-anchor="middle" font-weight="700">→ 일관성 훼손</text><text x="14" y="378">평상시에는 셋 모두 만족할 수 있다.</text><text x="14" y="400" font-weight="700">분단일 때만 C와 A 중 택일한다.</text><text x="14" y="434" style="fill:var(--si-general,#5c6b7f)">노드 값은 개념용 모식이다.</text></svg>
