<svg class="si si-illus" viewBox="0 0 360 772" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kruskal-wallis-test-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="kruskal-wallis-test-t">크루스칼-왈리스 검정: 합쳐서 순위, 순위합, H, χ² 꼬리확률</title><defs><marker id="kruskal-wallis-test-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="20" y="26" font-weight="700">① 전체를 한 줄에 합쳐 순위 매기기 (모식 예)</text><line x1="60" y1="56" x2="340" y2="56" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.5"/><text x="28" y="61" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">A</text><line x1="60" y1="80" x2="340" y2="80" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.5"/><text x="28" y="85" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">B</text><line x1="60" y1="104" x2="340" y2="104" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.5"/><text x="28" y="109" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">C</text><circle cx="72" cy="56" r="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="108" cy="56" r="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="180" cy="56" r="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="144" cy="80" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="180" cy="80" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="216" cy="80" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="252" cy="104" r="7" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><circle cx="288" cy="104" r="7" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><circle cx="324" cy="104" r="7" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><line x1="180" y1="64" x2="180" y2="72" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="72" y="140" text-anchor="middle">1</text><text x="108" y="140" text-anchor="middle">2</text><text x="144" y="140" text-anchor="middle">3</text><text x="180" y="140" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">4.5</text><text x="216" y="140" text-anchor="middle">6</text><text x="252" y="140" text-anchor="middle">7</text><text x="288" y="140" text-anchor="middle">8</text><text x="324" y="140" text-anchor="middle">9</text><text x="28" y="140" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">순위</text><line x1="60" y1="156" x2="340" y2="156" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#kruskal-wallis-test-ar)"/><text x="200" y="176" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">작은 값 → 큰 값</text><text x="180" y="120" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">동점은 평균 순위</text><text x="20" y="212" font-weight="700">② 집단별 순위합 R<tspan baseline-shift="sub" font-size="92%">i</tspan> (모식 예)</text><text x="28" y="250" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">R<tspan baseline-shift="sub" font-size="92%">A</tspan></text><rect x="48" y="232" width="60" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="116" y="250">= 7.5</text><text x="28" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">R<tspan baseline-shift="sub" font-size="92%">B</tspan></text><rect x="48" y="264" width="108" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="164" y="282">= 13.5</text><text x="28" y="314" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">R<tspan baseline-shift="sub" font-size="92%">C</tspan></text><rect x="48" y="296" width="192" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="248" y="314">= 24</text><text x="20" y="346" style="fill:var(--si-general,#5c6b7f)">순위가 한쪽 집단에 몰릴수록 막대 길이가 벌어진다</text><text x="20" y="390" font-weight="700">③ H 통계량</text><text x="20" y="412" font-size="15">H = 12 / [N(N+1)]</text><text x="20" y="442" font-size="15">× Σ (R<tspan baseline-shift="sub" font-size="92%">i</tspan><tspan baseline-shift="super" font-size="92%">2</tspan> / n<tspan baseline-shift="sub" font-size="92%">i</tspan>) − 3(N+1)</text><text x="20" y="466" style="fill:var(--si-general,#5c6b7f)">동점이 있으면 보정 계수로 H를 나눈다</text><text x="20" y="504" font-weight="700">④ χ² 분포 (자유도 2 = k − 1)에서의 꼬리확률</text><polyline points="232,642.2 238,642.4 244,642.6 250,642.7 256,642.9 262,643 268,643.1 274,643.2 280,643.3 286,643.4 292,643.5 298,643.5 304,643.6 310,643.6 316,643.7 322,643.7 328,643.8" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="5"/><polyline points="40,544 46,555.8 52,566.1 58,575.3 64,583.3 70,590.5 76,596.8 82,602.3 88,607.2 94,611.5 100,615.3 106,618.7 112,621.7 118,624.3 124,626.6 130,628.7 136,630.5 142,632.1 148,633.5 154,634.7 160,635.8 166,636.8 172,637.6 178,638.4 184,639 190,639.6 196,640.1 202,640.6 208,641 214,641.3 220,641.6 226,641.9 232,642.2 238,642.4 244,642.6 250,642.7 256,642.9 262,643 268,643.1 274,643.2 280,643.3 286,643.4 292,643.5 298,643.5 304,643.6 310,643.6 316,643.7 322,643.7 328,643.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><line x1="40" y1="644" x2="334" y2="644" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="40" y1="644" x2="40" y2="538" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="40" y1="644" x2="40" y2="649" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="40" y="666" text-anchor="middle">0</text><line x1="88" y1="644" x2="88" y2="649" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="88" y="666" text-anchor="middle">2</text><line x1="136" y1="644" x2="136" y2="649" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="136" y="666" text-anchor="middle">4</text><line x1="184" y1="644" x2="184" y2="649" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="184" y="666" text-anchor="middle">6</text><line x1="232" y1="644" x2="232" y2="649" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="232" y="666" text-anchor="middle">8</text><line x1="280" y1="644" x2="280" y2="649" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="280" y="666" text-anchor="middle">10</text><line x1="328" y1="644" x2="328" y2="649" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="328" y="666" text-anchor="middle">12</text><text x="332" y="684" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">χ²</text><line x1="227.9" y1="644" x2="227.9" y2="570" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8"/><text x="227.9" y="684" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">H = 7.83</text><text x="241.9" y="592" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">p = .020</text><line x1="256" y1="600" x2="256" y2="638" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2"/><text x="20" y="708" font-weight="700">보고 형식 예(가상 값): H(2) = 7.83, p = .020</text><text x="20" y="730">유의하면 Dunn 사후검정(본페로니·홀름 보정)으로</text><text x="20" y="750">어느 집단이 다른지 확인한다</text></svg>
