oke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#glaucoma-ar-2)"/><line x1="246.1" y1="181.1" x2="261.7" y2="196.7" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#glaucoma-ar-2)"/><line x1="230" y1="191.3" x2="237.6" y2="212" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#glaucoma-ar-2)"/><line x1="207.4" y1="193.3" x2="203.5" y2="215" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#glaucoma-ar-2)"/><text x="206" y="156" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">안압 상승</text><line x1="262" y1="122" x2="286" y2="138" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#glaucoma-ar-2)"/><line x1="262" y1="178" x2="286" y2="162" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#glaucoma-ar-2)"/><text x="14" y="100" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">배출로 막힘</text><line x1="96" y1="96" x2="142" y2="110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.1"/><text x="160" y="62" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">방수 생성</text><line x1="190" y1="68" x2="166" y2="100" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.1"/><circle cx="166" cy="100" r="2.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="84" y="160">각막</text><line x1="112" y1="156" x2="136" y2="152" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.1"/><text x="84" y="196">홍채</text><line x1="112" y1="189" x2="159" y2="175" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.1"/><text x="166" y="246">수정체</text><line x1="184" y1="234" x2="184" y2="180" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.1"/><text x="296" y="128">시신경</text><text x="268" y="230" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">압력에 눌려</text><text x="268" y="250" style="fill:var(--si-general,#5c6b7f)">서서히 손상</text><line x1="312" y1="218" x2="312" y2="164" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.1"/><circle cx="312" cy="164" r="2.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="14" y="296" font-weight="700">시야 변화(주변부터 좁아진다)</text><circle cx="62" cy="350" r="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="2"/><ellipse cx="62" cy="350" rx="35" ry="32" style="stroke:none;fill:var(--si-bg,#ffffff)" stroke-width="0"/><text x="62" y="416" text-anchor="middle" font-weight="700">초기</text><circle cx="180" cy="350" r="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="2"/><ellipse cx="185" cy="356" rx="24" ry="17" style="stroke:none;fill:var(--si-bg,#ffffff)" stroke-width="0"/><text x="180" y="416" text-anchor="middle" font-weight="700">진행</text><circle cx="298" cy="350" r="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="2"/><ellipse cx="304" cy="360" rx="11" ry="7" style="stroke:none;fill:var(--si-bg,#ffffff)" stroke-width="0"/><text x="298" y="416" text-anchor="middle" font-weight="700">말기</text><line x1="106" y1="350" x2="134" y2="350" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#glaucoma-ar-3)"/><line x1="224" y1="350" x2="252" y2="350" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#glaucoma-ar-3)"/><text x="14" y="450" style="fill:var(--si-general,#5c6b7f)">회색은 보이지 않는 범위다.</text><text x="14" y="482" style="fill:var(--si-general,#5c6b7f)">좁아지는 모양은 비대칭으로 진행한다.</text><text x="14" y="516">정상안압녹내장: 안압이 정상이어도</text><text x="14" y="536">시신경 손상이 진행한다.</text><text x="14" y="568" font-weight="700">주변 시야 협착은 되돌릴 수 없다.</text></svg>
