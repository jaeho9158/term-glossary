<svg class="si si-illus" viewBox="0 0 520 300" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transfer-function-poles-zeros-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="transfer-function-poles-zeros-t">전달함수의 극점·영점과 s-평면</title><defs><marker id="transfer-function-poles-zeros-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="330" y1="214.1" x2="330" y2="214.1" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><rect x="16" y="30" width="184" height="240" style="stroke:none;fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.12"/><line x1="10" y1="150" x2="292" y2="150" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#transfer-function-poles-zeros-ar)"/><line x1="200" y1="269.6" x2="200" y2="30.4" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#transfer-function-poles-zeros-ar)"/><text x="284" y="166" text-anchor="middle" font-style="italic">σ</text><text x="214" y="34.4">jω</text><line x1="148" y1="52" x2="160" y2="64" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="148" y1="64" x2="160" y2="52" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="148" y1="236" x2="160" y2="248" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="148" y1="248" x2="160" y2="236" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="142" y="50" text-anchor="end" font-size="11" style="fill:var(--si-rose-s,#c97b7b)">극점 −1 + 2j</text><text x="142" y="260" text-anchor="end" font-size="11" style="fill:var(--si-rose-s,#c97b7b)">극점 −1 − 2j</text><circle cx="108" cy="150" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2"/><text x="108" y="172" text-anchor="middle" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">영점 −2</text><text x="20" y="290" font-size="11">왼쪽 반평면: 극점이 모두 여기 있으면 안정</text><text x="330" y="60" font-size="11">오른쪽 반평면: 극점이 있으면 발산</text><text x="330" y="80" font-size="11">허수축: 임계 안정</text><text x="312" y="218">G(s) = (s + 2) / (s² + 2s + 5)</text><text x="330" y="242" font-size="11">ω<tspan baseline-shift="sub" font-size="72%">n</tspan> = √5 ≈ 2.236, ζ ≈ 0.447</text></svg>
