">문헌 간 값이 크게 달라 추정치로 읽는다.</text><line x1="16" y1="576" x2="344" y2="576" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="598" text-anchor="middle" font-size="14" font-weight="700">온도가 낮을수록 착화 지연이 길다</text><line x1="60" y1="712" x2="330" y2="712" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#ignition-point-ar-1)"/><line x1="60" y1="712" x2="60" y2="640" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#ignition-point-ar-1)"/><path d="M70,648 C72,652.7 75.3,668.7 82,676 C88.7,683.3 97,687.7 110,692 C123,696.3 140,699.5 160,702 C180,704.5 205,705.7 230,707 C255,708.3 296.7,709.5 310,710" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><text x="66" y="732">낮은 온도</text><text x="330" y="732" text-anchor="end">높은 온도</text><text x="66" y="628">착화 지연</text><text x="16" y="766">값은 시료 양·형태, 용기 크기, 산소 농도, 압력,</text><text x="16" y="786">가열 방식에 따라 달라지는 시험 조건의 측정값이다.</text></svg>
