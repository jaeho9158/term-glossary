<svg class="si si-illus" viewBox="0 0 360 506" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="측정 수준 네 가지: 눈금자로 비교" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="levels-of-measurement-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="8" y="32" font-weight="700">명목</text><text x="44" y="32" style="fill:var(--si-general,#5c6b7f)">(예: 성별, 등번호)</text><circle cx="120" cy="68" r="15" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="120" y="73" text-anchor="middle" font-weight="700">3</text><circle cx="240" cy="68" r="15" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="240" y="73" text-anchor="middle" font-weight="700">7</text><text x="180" y="106" text-anchor="middle">구분만 (7번이 3번보다 크다는 뜻이 아님)</text><text x="8" y="140" font-weight="700">서열</text><text x="44" y="140" style="fill:var(--si-general,#5c6b7f)">(예: 리커트 1~5점)</text><line x1="20" y1="176" x2="340" y2="176" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#levels-of-measurement-ar)"/><line x1="40" y1="170" x2="40" y2="182" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="40" y="200" text-anchor="middle">1</text><line x1="90" y1="170" x2="90" y2="182" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="90" y="200" text-anchor="middle">2</text><line x1="120" y1="170" x2="120" y2="182" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="120" y="200" text-anchor="middle">3</text><line x1="200" y1="170" x2="200" y2="182" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="200" y="200" text-anchor="middle">4</text><line x1="310" y1="170" x2="310" y2="182" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="310" y="200" text-anchor="middle">5</text><text x="180" y="222" text-anchor="middle">순서만, 간격은 모름</text><text x="8" y="248" font-weight="700">등간</text><text x="44" y="248" style="fill:var(--si-general,#5c6b7f)">(예: 섭씨 온도)</text><line x1="20" y1="286" x2="340" y2="286" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#levels-of-measurement-ar)"/><line x1="40" y1="280" x2="40" y2="292" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="40" y="308" text-anchor="middle">0도</text><line x1="160" y1="280" x2="160" y2="292" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="160" y="308" text-anchor="middle">15도</text><line x1="200" y1="280" x2="200" y2="292" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="200" y="308" text-anchor="middle">20도</text><line x1="280" y1="280" x2="280" y2="292" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="280" y="308" text-anchor="middle">30도</text><line x1="40" y1="266" x2="40" y2="286" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" stroke-dasharray="3 3"/><text x="26" y="264" style="fill:var(--si-general,#5c6b7f)">임의의 0</text><line x1="200" y1="270" x2="280" y2="270" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#levels-of-measurement-ar)" marker-start="url(#levels-of-measurement-ar)"/><text x="240" y="260" text-anchor="middle">차 10도</text><text x="180" y="330" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">30도는 15도의 2배가 아님</text><text x="8" y="356" font-weight="700">비율</text><text x="44" y="356" style="fill:var(--si-general,#5c6b7f)">(예: 체중)</text><line x1="20" y1="394" x2="340" y2="394" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#levels-of-measurement-ar)"/><line x1="40" y1="388" x2="40" y2="400" style="stroke:currentColor;fill:none" stroke-width="4"/><text x="40" y="416" text-anchor="middle">0kg</text><line x1="160" y1="388" x2="160" y2="400" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="160" y="416" text-anchor="middle">30kg</text><line x1="280" y1="388" x2="280" y2="400" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="280" y="416" text-anchor="middle">60kg</text><text x="26" y="374" font-weight="700">절대 0</text><line x1="160" y1="378" x2="280" y2="378" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#levels-of-measurement-ar)"/><text x="220" y="368" text-anchor="middle" font-weight="700">2배</text><text x="180" y="438" text-anchor="middle">0kg은 무게가 없음</text><text x="180" y="468" text-anchor="middle" font-weight="700">명목에서 비율로 갈수록 정보가 많아지고,</text><text x="180" y="490" text-anchor="middle">상위 자료는 하위로 바꿀 수 있지만 반대는 안 됨</text></svg>
