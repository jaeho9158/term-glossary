<svg class="si si-illus" viewBox="0 0 360 458" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="동정맥산소차는 혈액이 모세혈관을 지나며 조직에 내준 산소량이다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="arteriovenous-oxygen-difference-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><linearGradient id="arteriovenous-oxygen-difference-g0" x1="0" y1="0.5" x2="1" y2="0.5"><stop offset="0" style="stop-color:var(--si-rose-f,#fbe4e4)"/><stop offset="1" style="stop-color:var(--si-violet-f,#eae4f4)"/></linearGradient></defs><text x="20" y="40" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">동맥(입구)</text><text x="340" y="40" text-anchor="end" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">정맥(출구)</text><text x="20" y="62">C<tspan dy="0.217em" font-size="92%">a</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> ≈ 200 mL/L</tspan></text><text x="340" y="62" text-anchor="end">C<tspan dy="0.217em" font-size="92%">v</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> ≈ 150 mL/L</tspan></text><text x="340" y="84" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">(포화도 ≈ 75%)</text><text x="180" y="114" text-anchor="middle" font-weight="700">C<tspan dy="0.217em" font-size="92%">(a−v)</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> ≈ 50 mL/L</tspan></text><text x="180" y="134" text-anchor="middle" font-weight="700">= 조직이 추출한 산소</text><path d="M20 158 V147 H340 V158" style="stroke:currentColor;fill:none" stroke-width="1.8"/><rect x="20" y="164" width="320" height="36" rx="18" style="stroke:currentColor;fill:url(#arteriovenous-oxygen-difference-g0)" stroke-width