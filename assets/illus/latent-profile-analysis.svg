 style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="336" y="258" text-anchor="middle">3</text><text x="308" y="122" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">→ 프로파일 2</text><text x="308" y="284" text-anchor="middle">프로파일</text><text x="14" y="296" style="fill:var(--si-general,#5c6b7f)">회색 = 개별 사례, 굵은 점선 = 한 사례</text><text x="14" y="326">소속은 확률로 추정, 가장 높은 막대로 분류</text><text x="14" y="354">프로파일 수는 정보기준(AIC·BIC, 낮을수록 좋음)·</text><text x="14" y="376">엔트로피(구분의 뚜렷함)·해석 가능성으로 정함</text><text x="14" y="408" font-weight="700" style="fill:var(--si-accent,#2454ff)">평균 수준이 아니라 선의 모양이 묶는 기준</text></svg>
