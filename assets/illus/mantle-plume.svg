,270 C103.3,256 104,241.7 104,236" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="7"/><ellipse cx="104" cy="208" rx="60" ry="28" style="stroke:var(--si-amber-s,#d79a2b);fill:url(#mantle-plume-g1)" stroke-width="2.4"/><text x="172" y="212" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">머리</text><text x="118" y="330" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">꼬리</text><polygon points="83.2,150 97.5,111 110.5,111 124.8,150" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><polygon points="144,150 155,120 165,120 176,150" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><polygon points="193.2,150 202,126 210,126 218.8,150" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><polygon points="98,114 104,104 110,114" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><polygon points="252,150 258,141 284,136 310,141 318,150" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="20" y="28" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">활화산</text><line x1="36" y1="36" x2="96" y2="110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1"/><text x="138" y="28" font-weight="700" style="fill:var(--si-general,#5c6b7f)">사화산 열</text><text x="138" y="48" style="fill:var(--si-general,#5c6b7f)">(점점 오래됨)</text><line x1="184" y1="56" x2="170" y2="124" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="250" y="300" font-weight="700" style="fill:var(--si-general,#5c6b7f)">맨틀</text><text x="244" y="28" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">LIP</text><line x1="266" y1="34" x2="274" y2="132" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1"/><line x1="70" y1="166" x2="200" y2="166" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#mantle-plume-ar)"/><text x="210" y="170" font-weight="700">판 이동</text><text x="20" y="534" style="fill:var(--si-general,#5c6b7f)">LIP(거대화성암체): 짧은 기간 막대한 현무암 분출</text><text x="20" y="568" style="fill:var(--si-general,#5c6b7f)">같은 색끼리 대응한다: 머리와 LIP, 꼬리와 화산 열</text><text x="20" y="602" style="fill:var(--si-general,#5c6b7f)">LLSVP(대형저속도상)와의 연관성은 연구 중이다.</text><text x="20" y="636" style="fill:var(--si-general,#5c6b7f)">가설적 구조이며 기원 깊이는 논쟁 중이다.</text><text x="20" y="670" style="fill:var(--si-general,#5c6b7f)">머리가 먼저 올라와 LIP을 만든 뒤 판이 이동한</text><text x="20" y="704" style="fill:var(--si-general,#5c6b7f)">상태까지 한 그림에 겹쳐 그렸다.</text></svg>
