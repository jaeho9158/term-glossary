<svg class="si si-illus" viewBox="0 0 360 566" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jwt-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="jwt-t">JWT: 헤더·페이로드·서명과 DB 없는 서명 검증</title><defs><marker id="jwt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">JWT: 점으로 이어진 세 구간과 서명 검증</text><rect x="10" y="40" width="92" height="60" rx="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="56" y="66" text-anchor="middle" font-weight="700">헤더</text><text x="56" y="90" text-anchor="middle">Header</text><rect x="120" y="40" width="130" height="60" rx="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="185" y="66" text-anchor="middle" font-weight="700">페이로드</text><text x="185" y="90" text-anchor="middle">Payload</text><rect x="268" y="40" width="82" height="60" rx="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="309" y="66" text-anchor="middle" font-weight="700">서명</text><text x="309" y="90" text-anchor="middle">Signature</text><circle cx="111" cy="96" r="3.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="259" cy="96" r="3.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="111" y="124" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">점(.)</text><line x1="185" y1="100" x2="185" y2="140" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><text x="60" y="160">사용자 정보, 만료: 발급 후 1시간</text><ellipse cx="30" cy="204" rx="16" ry="9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-bg,#ffffff)" stro