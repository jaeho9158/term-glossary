<svg class="si si-illus" viewBox="0 0 560 320" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="X형 가새: 횡력에서 인장과 압축을 나누는 대각재" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>기둥 둘과 보 둘로 된 사각 골조에 대각선 가새 둘을 X자로 넣고, 오른쪽 횡력을 받으면 한 대각재는 인장, 다른 대각재는 압축을 받으며 골조가 기울어지려 하는 모식도</desc><defs><marker id="diagonal-bracing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><polygon points="90,250 270,250 320,60 140,60" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="90" y1="60" x2="90" y2="250" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="5"/><line x1="270" y1="60" x2="270" y2="250" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="5"/><line x1="90" y1="60" x2="270" y2="60" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="5"/><line x1="90" y1="250" x2="270" y2="250" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="5"/><line x1="90" y1="250" x2="270" y2="60" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.8"/><line x1="90" y1="60" x2="270" y2="250" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><line x1="20" y1="60" x2="82" y2="60" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#diagonal-bracing-ar)"/><text x="20" y="48" font-size="12" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">횡력</text><text x="180" y="284" text-anchor="middle" font-size="12">가새가 든 골조</text><text x="400" y="90" font-size="12">인장(T)을 받는 대각재</text><line x1="400" y1="90" x2="235" y2="97" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="235" cy="97" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="400" y="200" font-size="12">압축(C)을 받는 대각재</text><line x1="400" y1="200" x2="235" y2="213" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="235" cy="213" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="400" y="150" font-size="12">기울어진 모양(점선)</text><line x1="400" y1="150" x2="307" y2="110" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="307" cy="110" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/></svg>
