<svg class="si si-illus" viewBox="0 0 360 404" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compound-heterozygosity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="compound-heterozygosity-t">복합이형접합: 트랜스와 시스 배치</title><defs></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">같은 유전자의 두 변이: 위치가 진단을 가른다</text><text x="90" y="56" text-anchor="middle" font-size="14" font-weight="700">트랜스 (trans)</text><text x="90" y="76" text-anchor="middle">다른 염색체에 하나씩</text><text x="270" y="56" text-anchor="middle" font-size="14" font-weight="700">시스 (cis)</text><text x="270" y="76" text-anchor="middle">같은 염색체에 함께</text><rect x="47" y="120" width="16" height="130" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="41" y="151" width="28" height="40" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="55" y="112" text-anchor="middle">아버지</text><rect x="117" y="120" width="16" height="130" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="111" y="151" width="28" height="40" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="125" y="112" text-anchor="middle">어머니</text><rect x="227" y="120" width="16" height="130" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="221" y="151" width="28" height="40" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="235" y="112" text-anchor="middle">한 염색체</text><rect x="297" y="120" width="16" height="130" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="291" y="151" width="28" height="40" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="305" y="112" text-anchor="middle">다른 염색체</text><circle cx="55" cy="165" r="9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="55" y="170" text-anchor="middle" font-weight="700">A</text><circle cx="125" cy="165" r="9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="125" y="170" text-anchor="middle" font-weight="700">B</text><circle cx="235" cy="163" r="9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="235" y="168" text-anchor="middle" font-weight="700">A</text><circle cx="235" cy="183" r="9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="235" y="188" text-anchor="middle" font-weight="700">B</text><text x="90" y="280" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">복합이형접합 · 두 사본에 변이</text><text x="90" y="300" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">두 사본 모두 기능을 못 함</text><text x="270" y="280" text-anchor="middle" font-weight="700">변이는 한쪽 사본에만 있고</text><text x="270" y="300" text-anchor="middle" font-weight="700">다른 사본에는 없다</text><text x="180" y="340" text-anchor="middle" font-weight="700">두 경우 모두 변이는 2개 — 다른 것은 위치</text><text x="180" y="368" text-anchor="middle">구분: 삼인가족(trio) 검사</text><text x="180" y="388" text-anchor="middle">롱리드 시퀀싱 위상 분석(phasing)</text></svg>
