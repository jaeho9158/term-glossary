<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="texture-development-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="texture-development-t">압연 판의 축(RD·TD·ND)과 Cube 방위</title><defs><marker id="texture-development-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="texture-development-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="texture-development-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><line x1="300" y1="207" x2="300" y2="238.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><polygon points="150,209 370,209 442,162.2 222,162.2" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.18"/><polygon points="150,230 370,230 370,209 150,209" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.2"/><polygon points="370,230 442,183.2 442,162.2 370,209" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.12"/><line x1="173" y1="203.8" x2="303" y2="203.8" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#texture-development-ar)"/><text x="300" y="252" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">RD (압연 방향)</text><line x1="173" y1="203.8" x2="221" y2="172.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end