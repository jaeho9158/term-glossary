4" cy="140" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><circle cx="138" cy="138" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><circle cx="150" cy="160" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><circle cx="162" cy="150" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><circle cx="172" cy="172" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><circle cx="96" cy="108" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="62" y="232" font-weight="700">체제 A</text><text x="62" y="254">(과거 정책 규칙)</text><text x="62" y="274">추정 관계식</text><line x1="190" y1="150" x2="300" y2="175" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><circle cx="196" cy="146" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="208" cy="158" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="222" cy="150" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="236" cy="162" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="250" cy="160" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="262" cy="170" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="276" cy="168" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="290" cy="178" r="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="196" y="88" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">체제 B</text><text x="196" y="112" style="fill:var(--si-amber-s,#d79a2b)">기대·행동이 바뀌어</text><text x="196" y="132" style="fill:var(--si-amber-s,#d79a2b)">계수가 달라짐</text><line x1="180" y1="170" x2="265.7" y2="225" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4" stroke-dasharray="5 4"/><line x1="274.4" y1="230.5" x2="300" y2="247" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4" stroke-dasharray="5 4"/><line x1="270" y1="170" x2="270" y2="226" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#lucas-critique-ar-1)" marker-start="url(#lucas-critique-ar-1)"/><circle cx="270" cy="228" r="5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="2"/><text x="286" y="196" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">정책 효과</text><text x="286" y="216" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">오판</text><text x="196" y="276" style="fill:var(--si-general,#5c6b7f)">과거 관계식으로 한 예측</text><text x="20" y="352" font-weight="700">축약형 계수는 정책 규칙의 함수(Lucas, 1976)</text><text x="20" y="376" font-weight="700" style="fill:var(--si-accent,#2454ff)">→ 정책에 무관한 깊은 모수에서 출발한 모형 필요</text><text x="20" y="406" style="fill:var(--si-general,#5c6b7f)">체제 전환 시 외삽 주의. 모든 추정이</text><text x="20" y="426" style="fill:var(--si-general,#5c6b7f)">무의미하다는 뜻은 아님.</text></svg>
