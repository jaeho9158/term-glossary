<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="traveling-salesman-problem-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="traveling-salesman-problem-t">다섯 도시의 최단 순회 경로(가상 예)</title><defs></defs><line x1="60" y1="290" x2="160" y2="40" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.8"/><line x1="160" y1="40" x2="260" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.8"/><line x1="260" y1="290" x2="60" y2="140" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.8"/><line x1="60" y1="140" x2="260" y2="140" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.8"/><line x1="260" y1="140" x2="60" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.8"/><line x1="60" y1="290" x2="260" y2="290" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="260" y1="290" x2="260" y2="140" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="260" y1="140" x2="160" y2="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="160" y1="40" x2="60" y2="140" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="60" y1="140" x2="60" y2="290" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><circle cx="60" cy="290" r="11" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.5"/><text x="60" y="295" text-anchor="middle" font-weight="700">A</text><circle cx="260" cy="290" r="11" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.5"/><text x="260" y="295" text-anchor="middle" font-weight="700">B</text><circle cx="260" cy="140" r="11" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.5"/><text x="260" y="145" text-anchor="middle" font-weight="700">C</text><circle cx="60" cy="140" r="11" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.5"/><text x="60" y="145" text-anchor="middle" font-weight="700">D</text><circle cx="160" cy="40" r="11" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.5"/><text x="160" y="45" text-anchor="middle" font-weight="700">E</text><text x="290" y="80" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">최단 순환 A → B → C → E → D → A</text><text x="290" y="103" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">길이 ≈ 15.66</text><text x="290" y="136" font-size="11">최장 순환(점선) A → E → B → D → C → A</text><text x="290" y="156" font-size="11">길이 ≈ 24.77</text><text x="290" y="200" font-size="11">순환 경로 수 (n − 1)! / 2 = 12 (n = 5)</text><text x="278" y="220" font-size="11">n = 10이면 181,440, n = 20이면 약 6.1 × 10<tspan baseline-shift="super" font-size="72%">16</tspan></text></svg>
