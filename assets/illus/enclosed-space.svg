<svg class="si si-illus" viewBox="0 0 520 336" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enclosed-space-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="enclosed-space-t">위요공간: 마주 보는 건물과 시선각</title><defs><marker id="enclosed-space-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="191" y1="182" x2="196" y2="182" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="20" y1="250" x2="500" y2="250" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="100" y="130" width="90" height="120" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.18"/><rect x="324" y="130" width="110" height="120" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.18"/><text x="145" y="190" text-anchor="middle" font-size="12">건물</text><text x="379" y="190" text-anchor="middle" font-size="12">건물</text><line x1="310" y1="250" x2="310" y2="238" style="stroke:currentColor;fill:none" stroke-width="2.4"/><circle cx="310" cy="236" r="3.2" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><line x1="310" y1="234" x2="190" y2="130" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2"/><line x1="310" y1="234" x2="190" y2="234" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="190" y1="234" x2="190" y2="130" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/><path d="M275.2,203.9 A46,46 0 0 0 264,234" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="251.9" y="217.3" text-anchor="middle">θ</text><line x1="84" y1="250" x2="84" y2="130" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#enclosed-space-ar)" marker-start="url(#enclosed-space-ar)"/><text x="78" y="190" text-anchor="end" font-size="12">H = 12 m</text><line x1="190" y1="270" x2="310" y2="270" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#enclosed-space-ar)" marker-start="url(#enclosed-space-ar)"/><text x="250" y="286" text-anchor="middle" font-size="12">D = 12 m</text><text x="198" y="195" font-size="12">H − 1.6 m</text><text x="302" y="262" text-anchor="end" font-size="11">눈높이 1.6 m</text><text x="260" y="322" text-anchor="middle" font-size="14" font-weight="700">θ = atan((H − 1.6) ÷ D),  D/H = 1 → θ ≈ 40.9°</text></svg>
