<svg class="si si-illus" viewBox="0 0 560 330" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="흉고직경: 평지와 경사지의 측정 높이" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>평지에서는 지면에서 1.3 m 높이의 줄기 지름을 재고, 경사지에서는 줄기에 닿는 가장 높은 땅에서 1.3 m 위의 지름을 재는 나무 옆모습 모식도</desc><defs><marker id="diameter-at-breast-height-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="diameter-at-breast-height-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="30" y1="270" x2="250" y2="270" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><rect x="90" y="60" width="40" height="210" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.35"/><line x1="40" y1="140" x2="150" y2="140" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="62" y1="270" x2="62" y2="142" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#diameter-at-breast-height-ar)"/><text x="54" y="206" text-anchor="end" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">1.3 m</text><line x1="90" y1="150" x2="130" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#diameter-at-breast-height-ar-1)"/><line x1="130" y1="150" x2="90" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#diameter-at-breast-height-ar-1)"/><text x="150" y="160" font-size="12" font-weight="700" font-style="italic" style="fill:var(--si-rose-s,#c97b7b)">D</text><text x="140" y="296" text-anchor="middle" font-size="12">평