<svg class="si si-illus" viewBox="0 0 360 556" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grams-iodine-solution-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="grams-iodine-solution-t">그람염색 네 단계와 그람 아이오딘 용액의 역할</title><defs></defs><text x="96" y="22" text-anchor="middle" font-weight="700">그람양성균</text><text x="256" y="22" text-anchor="middle" font-weight="700">그람음성균</text><text x="14" y="54" font-weight="700">1 크리스탈 바이올렛(1차 염색)</text><ellipse cx="96" cy="90" rx="36" ry="18" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="5" fill-opacity="0.55"/><ellipse cx="256" cy="90" rx="36" ry="18" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.55"/><text x="14" y="140" font-weight="700">2 그람 아이오딘액(매염)</text><ellipse cx="96" cy="176" rx="36" ry="18" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="5" fill-opacity="0.85"/><ellipse cx="256" cy="176" rx="36" ry="18" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.85"/><text x="14" y="226" font-weight="700">3 탈색(알코올·아세톤)</text><ellipse cx="96" cy="262" rx="36" ry="18" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="5" fill-opacity="0.85"/><ellipse cx="256" cy="262" rx="36" ry="18" style="stroke:currentColor;fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="14" y="312" font-weight="700">4 사프라닌(대조 염색)</text><ellipse cx="96" cy="348" rx="36" ry="18" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="5" fill-opacity="0.85"/><ellipse cx="256" cy="348" rx="36" ry="18" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.5"/><text x="176" y="382"></text><line x1="14" y1="398" x2="346" y2="398" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="176" y="140" style="fill:var(--si-general,#5c6b7f)">CV-I 복합체 생김</text><text x="14" y="422" font-weight="700">I₂ + I⁻ ⇌ I₃⁻</text><text x="14" y="444" style="fill:var(--si-general,#5c6b7f)">평형상수 약 7×10² (25 °C)</text><text x="14" y="484" style="fill:var(--si-general,#5c6b7f)">두꺼운 테두리: 펩티도글리칸 층</text><text x="14" y="504" style="fill:var(--si-general,#5c6b7f)">(세포 외피 중 양성균 약 50~90%, 음성균 약 10%)</text><text x="14" y="540" style="fill:var(--si-general,#5c6b7f)">점선 테두리: 탈색되어 색이 빠진 세포</text><path d="M266,450.8 L266,472 Q266,482 276,482 L322,482 Q332,482 332,472 L332,450.8Z" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.85"/><line x1="266" y1="450.8" x2="332" y2="450.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2" stroke-dasharray="5 3"/><path d="M266,430 L266,472 Q266,482 276,482 L322,482 Q332,482 332,472 L332,430" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="262" y="422" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">갈색 용액</text></svg>
