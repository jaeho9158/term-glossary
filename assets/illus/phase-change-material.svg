<svg class="si si-illus" viewBox="0 0 420 330" style="max-width:420px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="상변화물질: 녹는 동안 온도가 일정" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="phase-change-material-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="phase-change-material-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><line x1="56" y1="250" x2="404" y2="250" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#phase-change-material-ar)"/><line x1="56" y1="250" x2="56" y2="30" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#phase-change-material-ar)"/><text x="404" y="272" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">넣어 준 열 →</text><text x="48" y="44" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">온도</text><polyline points="56,220 130,150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><polyline points="130,150 300,150" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3"/><polyline points="300,150 380,64" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="56" y1="150" x2="130" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8" stroke-dasharray="3 3"/><text x="48" y="155" text-anchor="end">녹는점</text><text x="92" y="206" style="fill:var(--si-blue-s,#7f9ac0)">고체</text><text x="95" y="222" style="fill:var(--si-blue-s,#7f9ac0)">현열</text><text x="215" y="136" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">녹는 중: 온도 그대로</text><text x="215" y="176" text-anchor="middle" style="fill:var(--si-violet-s,#9382bd)">잠열 흡수(고체 + 액체)</text><text x="350" y="136" style="fill:var(--si-rose-s,#c97b7b)">액체</text><text x="352" y="152" style="fill:var(--si-rose-s,#c97b7b)">현열</text><line x1="130" y1="270" x2="300" y2="270" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.1" marker-end="url(#phase-change-material-ar-1)" marker-start="url(#phase-change-material-ar-1)"/><text x="215" y="292" text-anchor="middle" style="fill:var(--si-violet-s,#9382bd)">이 구간에 저장하는 열 = 잠열</text><text x="215" y="316" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">식으면 같은 온도에서 이 열을 다시 내놓는다</text></svg>
