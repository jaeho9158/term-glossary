<svg class="si si-illus" viewBox="0 0 360 548" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="available-safe-egress-time-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="available-safe-egress-time-t">허용피난시간(ASET)과 필요피난시간(RSET)의 여유</title><defs><marker id="available-safe-egress-time-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">가상 예: 위험 증가와 피난 시간</text><text x="14" y="48" style="fill:var(--si-general,#5c6b7f)">위험 정도</text><line x1="50" y1="196" x2="50" y2="56" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#available-safe-egress-time-ar)"/><line x1="50" y1="196" x2="340" y2="196" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="50" y1="84" x2="340" y2="84" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="64" y="78" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">한계</text><path d="M50,192 C63.3,189.3 105,183 130,176 C155,169 178.3,160.2 200,150 C221.7,139.8 241,126 260,115 C279,104 300.9,91.5 314.2,84 C327.5,76.5 335.7,72.3 340,70" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><path d="M50,194 C66.7,192.7 116.7,191 150,186 C183.3,181 218.3,172.7 250,164 C281.7,155.3 325,139 340,134" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><path d="M50,194 C68.3,193.3 125,193 160,190 C195,187 230,181.3 260,176 C290,170.7 326.7,161 340,158" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3"/><text x="100" y="152" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">가시거리</text><text x="232" y="154" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">온도</text><text x="262" y="190" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">CO</text><circle cx="314.2" cy="84" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="346" y="62" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">허용피난시간(ASET) 410초</text><line x1="314.2" y1="90" x2="314.2" y2="262" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="243.3" y="214" width="70.9" height="44" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="0" fill-opacity="0.6"/><rect x="50" y="224" width="38.7" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><rect x="88.7" y="224" width="19.3" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><rect x="108" y="224" width="77.3" height="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><rect x="185.3" y="224" width="58" height="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="50" y="216" font-weight="700">필요피난시간(RSET) 300초</text><line x1="50" y1="262" x2="340" y2="262" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="50" y1="262" x2="50" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="50" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="82.2" y1="262" x2="82.2" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="82.2" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">50</text><line x1="114.4" y1="262" x2="114.4" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="114.4" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">100</text><line x1="146.7" y1="262" x2="146.7" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="146.7" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">150</text><line x1="178.9" y1="262" x2="178.9" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="178.9" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">200</text><line x1="211.1" y1="262" x2="211.1" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="211.1" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">250</text><line x1="243.3" y1="262" x2="243.3" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="243.3" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">300</text><line x1="275.6" y1="262" x2="275.6" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="275.6" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">350</text><line x1="307.8" y1="262" x2="307.8" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="307.8" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">400</text><line x1="340" y1="262" x2="340" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="340" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">450</text><text x="195" y="306" text-anchor="middle">시간(초)</text><text x="278.8" y="233" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">안전 여유</text><text x="278.8" y="253" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">110초</text><rect x="18" y="324" width="14" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="40" y="336" font-weight="400">감지 60초</text><rect x="18" y="344" width="14" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="40" y="356" font-weight="400">경보 30초</text><rect x="18" y="364" width="14" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="40" y="376" font-weight="700">피난 전 행동 120초</text><rect x="18" y="384" width="14" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="40" y="396" font-weight="400">이동 90초</text><text x="14" y="430" style="fill:var(--si-general,#5c6b7f)">한계 예: 가시거리 10 m, 온도 65 °C,</text><text x="14" y="450" style="fill:var(--si-general,#5c6b7f)">일산화탄소(CO) 1,400 ppm</text><text x="14" y="478" font-weight="700">ASET &gt; RSET이면 안전하며 차이가 안전 여유다</text><text x="14" y="502">독성가스는 분율 유효 용량(FED)으로 합산(1이면</text><text x="14" y="522">평균인의 행동능력 상실, 취약자는 0.3 등)</text></svg>
