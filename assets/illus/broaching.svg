xt-anchor="middle" font-style="italic">λ</text><text x="14" y="112" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">물 입자 궤도</text><text x="150" y="100" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">선미 들림</text><text x="114.7" y="180" font-weight="700" style="fill:var(--si-navy,#12305c)">타</text><text x="14" y="222" style="fill:var(--si-general,#5c6b7f)">마루에서는 물 입자가 배와 같은 방향으로 움직여</text><text x="14" y="242" style="fill:var(--si-general,#5c6b7f)">타로 들어오는 흐름이 줄고 타력이 약해진다.</text><text x="14" y="290" font-weight="700">위에서 본 모습</text><line x1="90" y1="304" x2="90" y2="480" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="190" y1="304" x2="190" y2="480" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="220" y1="316" x2="320" y2="316" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#broaching-ar-2)"/><text x="220" y="304" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">파도 진행(마루선)</text><line x1="60" y1="450" x2="176" y2="450" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#broaching-ar-3)"/><text x="212" y="455" style="fill:var(--si-general,#5c6b7f)">원래 침로</text><polyline points="60,450 67.8,449.7 75.6,448.6 83.3,446.9 90.8,444.6 98,441.6 105,437.9 111.6,433.7 117.9,428.9 123.6,423.6 128.9,417.9 133.7,411.6" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.2"/><text x="16" y="420" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">급선회</text><polygon points="150,326 159,342 159,394 141,394 141,342" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2.2" fill-opacity="0.5"/><line x1="162" y1="408" x2="184" y2="408" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.6" marker-end="url(#broaching-ar-4)"/><path d="M179.6,397.8 A48,48 0 0 0 179.6,322.2" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4" marker-end="url(#broaching-ar-5)"/><text x="212" y="360" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">편요모멘트(큼)</text><text x="212" y="380" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">횡경사↑ 전복 위험</text><text x="212" y="416" font-weight="700" style="fill:var(--si-navy,#12305c)">타력(작음)</text><text x="14" y="518" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">편요모멘트 &gt; 타력이면 침로를 되돌리지 못한다.</text><text x="14" y="552" font-size="14" font-weight="700">파속 c = √(gλ/2π)</text><text x="14" y="576">λ = 50 m → 8.8 m/s (17.2 kn)</text><text x="14" y="596">λ = 100 m → 12.5 m/s (24.3 kn)</text><text x="14" y="616">λ = 200 m → 17.7 m/s (34.3 kn)</text><text x="14" y="650" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">선속 ≈ 파속이면 서핑 상태가 된다.</text><line x1="133.7" y1="411.6" x2="146" y2="394" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.2" marker-end="url(#broaching-ar-6)"/></svg>
