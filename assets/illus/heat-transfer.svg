<svg class="si si-illus" viewBox="0 0 360 610" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heat-transfer-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="heat-transfer-t">열전달: 한 벽에서 전도·대류·복사가 동시에 일어나는 단면</title><defs><marker id="heat-transfer-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="heat-transfer-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="heat-transfer-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="heat-transfer-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><g transform="translate(0 -30)"><text x="56" y="50" text-anchor="middle" font-weight="700">고온 실내</text><text x="130" y="50" text-anchor="middle" font-weight="700">벽</text><text x="250" y="50" text-anchor="middle" font-weight="700">주위 유체</text><rect x="100" y="60" width="60" height="190" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><line x1="100" y1="72" x2="160" y2="104" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><path d="M160,104 C165,106 178.3,112.3 190,116 C201.7,119.7 211.7,123.7 230,126 C248.3,128.3 288.3,129.3 300,130" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><line x1="250" y1="130" x2="346" y2="130" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><text x="346" y="120" text-anchor="end">T<tspan dy="0.217em" font-size="92%">∞</tspan></text><text x="166" y="92">T<tspan dy="0.217em" font-size="92%">s</tspan></text><text x="92" y="116" text-anchor="end">dT/dx</text><line x1="96" y1="110" x2="124" y2="90" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="130" y="172" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">전도</text><line x1="104" y1="186" x2="156" y2="186" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#heat-transfer-ar)"/><path d="M164,196 C168.3,193 180.7,178.3 190,178 C199.3,177.7 210,194 220,194 C230,194 240,178.3 250,178 C260,177.7 269.7,191.7 280,192 C290.3,192.3 306.7,182 312,180" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.6" marker-end="url(#heat-transfer-ar-1)"/><text x="240" y="164" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">대류</text><path d="M162,238 C163,238.8 166,241.5 168,242.5 C170,243.5 172,244.1 174,243.9 C176,243.7 178,242.5 180,241.2 C182,239.9 184,237.8 186,236.3 C188,234.9 190,233.1 192,232.5 C194,231.9 196,231.9 198,232.5 C200,233.1 202,234.8 204,236.3 C206,237.8 208,240 210,241.3 C212,242.6 214,243.7 216,243.9 C218,244.1 220,243.5 222,242.5 C224,241.5 226,239.5 228,238 C230,236.5 232,234.4 234,233.4 C236,232.4 238,231.9 240,232.1 C242,232.3 244,233.5 246,234.8 C248,236.1 250,238.3 252,239.7 C254,241.1 256,242.9 258,243.5 C260,244.1 262,244 264,243.4 C266,242.8 268,241.1 270,239.7 C272,238.3 274,236 276,234.7 C278,233.4 280,232.3 282,232.1 C284,231.9 286,232.5 288,233.5 C290,234.5 292,236.5 294,238 C296,239.5 298,241.6 300,242.6 C302,243.6 304,244.1 306,243.9 C308,243.7 310,242.5 312,241.2 C314,239.9 316,237.8 318,236.3 C320,234.9 322,233.1 324,232.5 C326,231.9 329,232.6 330,232.6" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#heat-transfer-ar-2)"/><text x="255" y="222" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">복사</text><text x="346" y="288" text-anchor="end">T<tspan dy="0.217em" font-size="92%">sur</tspan></text><line x1="100" y1="264" x2="160" y2="264" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#heat-transfer-ar-3)" marker-start="url(#heat-transfer-ar-3)"/><text x="130" y="282" text-anchor="middle">L = 0.2 m</text><line x1="14" y1="318" x2="38" y2="318" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><text x="46" y="322" font-weight="700">전도: q″ = −k·dT/dx</text><line x1="14" y1="344" x2="38" y2="344" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><text x="46" y="348" font-weight="700">대류: q″ = h(T<tspan dy="0.217em" font-size="92%">s</tspan><tspan dy="-0.2em"> − T</tspan><tspan dy="0.217em" font-size="92%">∞</tspan><tspan dy="-0.2em">)</tspan></text><line x1="14" y1="370" x2="38" y2="370" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="46" y="374" font-weight="700">복사: q″ = εσ(T<tspan dy="0.217em" font-size="92%">s</tspan><tspan dy="-0.2em">⁴ − T</tspan><tspan dy="0.217em" font-size="92%">sur</tspan><tspan dy="-0.2em">⁴)</tspan></text><text x="46" y="404" style="fill:var(--si-general,#5c6b7f)">복사의 온도는 절대온도(K)</text><text x="14" y="446" font-weight="700">가상 예(복사 무시, 대류는 실내 쪽)</text><text x="14" y="468" font-weight="700">L = 0.2 m, 온도차 20 K</text><text x="14" y="490">k = 0.8 W/(m·K), h = 10 W/(m²·K)</text><text x="14" y="512">저항: 대류 1/h = 0.10, 벽 L/k = 0.25</text><text x="14" y="534">합 0.35 m²·K/W</text><text x="14" y="556">q″ = 20 ÷ 0.35 ≈ 57.1 W/m²</text><text x="14" y="578" font-weight="700">면적 10 m²이면 약 571 W</text><text x="14" y="600">Bi = hL/k = 2.5</text></g></svg>
