 font-weight="700">(글리코겐)<tspan dy="0.217em" font-size="92%">n</tspan><tspan dy="-0.2em"> + Pi ⇌ (글리코겐)</tspan><tspan dy="0.217em" font-size="92%">n−1</tspan><tspan dy="-0.2em"> + G1P</tspan></text><text x="180" y="270" text-anchor="middle">인산분해로 비환원 말단에서 하나씩 떼어 낸다</text><rect x="18" y="288" width="324" height="116" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="30" y="310" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">조절</text><text x="30" y="330" font-weight="700">b형 → a형: 세린 14번 인산화</text><text x="30" y="350">에피네프린·글루카곤 → cAMP → PKA →</text><text x="30" y="370">인산화효소 키나아제</text><text x="30" y="394" font-weight="700">알로스테릭(근육형 b): AMP(+), ATP·G6P(−)</text><text x="20" y="430">가지점 앞에서 멈추므로 탈분지효소가 필요하다.</text></svg>
