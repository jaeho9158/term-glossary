.3 V: 1,024단계, LSB ≈ 3.223 mV</tspan></text><text x="20" y="462">예: 2.5 V → 코드 776 → 복원 2.5008 V</text><text x="20" y="488">f<tspan dy="0.217em" font-size="92%">s</tspan><tspan dy="-0.2em"> &gt; 2·f</tspan><tspan dy="0.217em" font-size="92%">max</tspan><tspan dy="-0.2em"> (나이퀴스트 조건)</tspan></text><text x="20" y="514">SQNR ≈ 6.02N + 1.76 dB ≈ 62.0 dB (10비트)</text><text x="20" y="540" font-weight="700" style="fill:var(--si-accent,#2454ff)">DAC: 코드 → 전압 복원 (ADC의 반대)</text></svg>
