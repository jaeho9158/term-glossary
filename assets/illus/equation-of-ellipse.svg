<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="equation-of-ellipse-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="equation-of-ellipse-t">타원 x²/25 + y²/9 = 1: 초점과 준선</title><defs><marker id="equation-of-ellipse-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><ellipse cx="200" cy="165" rx="150" ry="90" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2.4" fill-opacity="0.08"/><line x1="20" y1="165" x2="380" y2="165" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.5"/><line x1="200" y1="267" x2="200" y2="63" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.5"/><line x1="387.5" y1="50" x2="387.5" y2="280" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><text x="387.5" y="40" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">준선 x = 6.25</text><line x1="290" y1="93" x2="320" y2="165" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8"/><line x1="290" y1="93" x2="80" y2="165" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8"/><line x1="200" y1="165" x2="350" y2="165" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#equation-of-ellipse-ar)"/><line x1="200" y1="165" x2="200" y2="75" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#equation-of-ellipse-ar)"/><circle cx="320" cy="165" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="80" cy="165" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="290" cy="93" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="320" y="187" text-anchor="middle">F<tspan baseline-shift="sub" font-size="72%">1</tspan>(4, 0)</text><text x="80" y="187" text-anchor="middle">F<tspan baseline-shift="sub" font-size="72%">2</tspan>(−4, 0)</text><text x="298" y="85" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">P(3, 2.4)</text><text x="285" y="157" text-anchor="middle" font-weight="700">a = 5</text><text x="192" y="89" text-anchor="end" font-weight="700">b = 3</text><text x="40" y="300">x<tspan baseline-shift="super" font-size="72%">2</tspan>/25 + y<tspan baseline-shift="super" font-size="72%">2</tspan>/9 = 1,  c<tspan baseline-shift="super" font-size="72%">2</tspan> = a<tspan baseline-shift="super" font-size="72%">2</tspan> − b<tspan baseline-shift="super" font-size="72%">2</tspan> = 16</text><text x="340" y="296" style="fill:var(--si-accent,#2454ff)">PF<tspan baseline-shift="sub" font-size="72%">1</tspan> = 2.6,  PF<tspan baseline-shift="sub" font-size="72%">2</tspan> = 7.4</text><text x="340" y="319" font-weight="700" style="fill:var(--si-accent,#2454ff)">합 = 10 = 2a</text></svg>
