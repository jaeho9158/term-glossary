<svg class="si si-illus" viewBox="0 0 360 446" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="allele-frequency-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="allele-frequency-t">대립유전자 빈도: 사본을 세어 전체 사본 수로 나눈다</title><defs></defs><text x="180" y="18" text-anchor="middle" font-weight="700">유전자형 수 → 대립유전자(사본) 수 (N = 100명)</text><rect x="132" y="50" width="96" height="84" rx="8" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" stroke-dasharray="5 3"/><rect x="44" y="64" width="16" height="44" rx="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="52" y="92" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">A</text><rect x="72" y="64" width="16" height="44" rx="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="80" y="92" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">A</text><text x="66" y="126" text-anchor="middle" font-weight="700">AA 36명</text><text x="66" y="156" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">A 사본</text><text x="66" y="176" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">36 × 2 = 72</text><rect x="158" y="64" width="16" height="44" rx="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="166" y="92" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">A</text><rect x="186" y="64" width="16" height="44" rx="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="194" y="92" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">a</text><text x="180" y="126" text-anchor="middle" font-weight="700">Aa 48명</text><text x="180" y="156" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">A 사본</text><text x="180" y="176" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">48 × 1 = 48</text><rect x="272" y="64" width="16" height="44" rx="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="280" y="92" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">a</text><rect x="300" y="64" width="16" height="44" rx="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="308" y="92" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">a</text><text x="294" y="126" text-anchor="middle" font-weight="700">aa 16명</text><text x="294" y="156" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">A 사본 0</text><text x="180" y="42" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">한 사람 = 사본 2개</text><text x="180" y="210" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">A 사본 합계: 72 + 48 = 120개</text><line x1="10" y1="228" x2="350" y2="228" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><text x="180" y="252" text-anchor="middle" font-weight="700">전체 사본 200개 (2N = 2 × 100)</text><rect x="20" y="264" width="192" height="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><rect x="212" y="264" width="128" height="28" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="116" y="284" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">A 120</text><text x="276" y="284" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">a 80</text><text x="116" y="318" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">p = 120/200 = 0.60</text><text x="276" y="318" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">q = 0.40</text><text x="180" y="350" text-anchor="middle">p + q = 1</text><text x="180" y="380" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">분모는 사람 수 100이 아니라</text><text x="180" y="400" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">사본 수 200 (2N)</text><text x="180" y="430" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">표준오차 √(pq/2N) = 0.0346</text></svg>
