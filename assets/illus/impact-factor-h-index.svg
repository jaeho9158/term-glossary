<svg class="si si-illus" viewBox="0 0 360 560" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="impact-factor-h-index-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="impact-factor-h-index-t">임팩트 팩터(JIF)의 분수 계산과 h-지수의 그래프 정의</title><defs></defs><text x="20" y="24" font-size="14" font-weight="700">학술지 평균(JIF)과 연구자 누적(h-지수)</text><text x="20" y="52" font-weight="700">JIF: 학술지 단위 평균, Nature 2017년</text><rect x="20" y="64" width="320" height="34" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.35"/><text x="180" y="86" text-anchor="middle" font-weight="700">최근 2년 출판물이 받은 인용 74,090</text><line x1="20" y1="112" x2="340" y2="112" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="20" y="122" width="160" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.35"/><rect x="180" y="122" width="160" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.35"/><text x="100" y="144" text-anchor="middle" font-weight="700">902</text><text x="260" y="144" text-anchor="middle" font-weight="700">880</text><text x="20" y="176">그 2년간 인용 가능 항목 수 (902 + 880)</text><text x="20" y="204" font-weight="700" style="fill:var(--si-blue-t,#12305c)">74,090 ÷ (902 + 880) ≈ 41.6</text><line x1="20" y1="226" x2="340" y2="226" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="252" font-weight="700">h-지수: 연구자 한 사람의 논문들</text><rect x="50" y="448" width="72" height="72" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.35"/><rect x="53" y="304" width="18" height="216" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><text x="62" y="299" text-anchor="middle">9</text><text x="62" y="537" text-anchor="middle">1</text><rect x="77" y="352" width="18" height="168" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><text x="86" y="347" text-anchor="middle">7</text><text x="86" y="537" text-anchor="middle">2</text><rect x="101" y="376" width="18" height="144" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.55"/><text x="110" y="371" text-anchor="middle">6</text><text x="110" y="537" text-anchor="middle">3</text><rect x="125" y="472" width="18" height="48" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.2"/><text x="134" y="467" text-anchor="middle">2</text><text x="134" y="537" text-anchor="middle">4</text><rect x="149" y="496" width="18" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.2"/><text x="158" y="491" text-anchor="middle">1</text><text x="158" y="537" text-anchor="middle">5</text><line x1="50" y1="520" x2="174" y2="520" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="50" y1="520" x2="50" y2="284" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="50" y1="520" x2="174" y2="396" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><text x="110" y="556" text-anchor="middle">논문 순위 (인용 많은 순)</text><text x="42" y="276">인용 수</text><text x="184" y="394" style="fill:var(--si-rose-t,#7d2626)">인용 수 = 순위</text><text x="184" y="424" font-size="14" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">h = 3</text><text x="184" y="443">3편이 각각</text><text x="184" y="462">3회 이상 인용</text><text x="184" y="481">4번째 논문</text><text x="184" y="500">2회 &lt; 4 → 제외</text></svg>
