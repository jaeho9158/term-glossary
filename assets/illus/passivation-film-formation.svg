<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="금속 표면의 부동태 산화막 단면" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>모재 금속 위에 매우 얇은 산화막이 있고 그 위에 산소·수분·염화물 이온이 있는 외부 환경이 놓인 단면 모식도. 입계가 산소의 통로가 될 수 있다</desc><defs><marker id="passivation-film-formation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker><marker id="passivation-film-formation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="80" y="40" width="360" height="90" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.12"/><text x="260" y="60" text-anchor="middle" font-size="12" font-weight="700">외부 환경</text><text x="120" y="88" text-anchor="middle" font-size="12">O<tspan dy="0.278em" font-size="72%">2</tspan></text><text x="200" y="112" text-anchor="middle" font-size="12">H<tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em">O</tspan></text><text x="380" y="92" text-anchor="middle" font-size="12">Cl<tspan dy="-0.556em" font-size="72%">-</tspan></text><line x1="120" y1="96" x2="120" y2="128" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4" marker-end="url(#passivation-film-formation-ar)"/><line x1="300" y1="100" x2="300" y2="168" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#passivation-film-formation-ar-1)"/><rect x="80" y="130" width="360" height="40" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2" fill-opacity="0.35"/><text x="200" y="155" text-anchor="middle" font-size="12">산화막(nm 규모)</text><rect x="80" y="170" width="360" height="100" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.3"/><text x="260" y="225" text-anchor="middle" font-size="12" font-weight="700">모재 금속</text><text x="470" y="70" text-anchor="middle" font-size="12">입계</text><line x1="470" y1="70" x2="302" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="302" cy="150" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/></svg>
