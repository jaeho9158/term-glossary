-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="5 4"/><text x="332" y="169" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">공백</text><text x="10" y="256">I = 도입, D = 발전, M = 숙달,</text><text x="10" y="276">· = 해당 없음 (가상 예시)</text><text x="10" y="308" style="fill:var(--si-amber-s,#d79a2b)">주황 테두리: 도입(I)이 반복되는 칸</text><text x="10" y="328" style="fill:var(--si-rose-s,#c97b7b)">빨간 점선: 가르치는 학년이 없는 행</text><text x="10" y="360" style="fill:var(--si-general,#5c6b7f)">과정: 기록 → 모으기 →</text><text x="10" y="380" style="fill:var(--si-general,#5c6b7f)">함께 검토 → 조정 후 재기록</text></svg>
