<svg class="si si-illus" viewBox="0 0 360 476" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carbon-cycle-reservoirs-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="carbon-cycle-reservoirs-t">탄소 저장고와 연간 플럭스</title><defs><marker id="carbon-cycle-reservoirs-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker><marker id="carbon-cycle-reservoirs-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.8" markerHeight="2.8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker><marker id="carbon-cycle-reservoirs-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker><marker id="carbon-cycle-reservoirs-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">탄소 저장고(GtC)와 연간 플럭스(GtC/yr)</text><rect x="10" y="34" width="340" height="50" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.5"/><text x="20" y="64" font-weight="700">대기 약 870</text><text x="340" y="64" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">체류 약 4년</text><rect x="10" y="140" width="115" height="110" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.28"/><text x="18" y="160" font-weight="700">육지</text><text x="18" y="182">식생 450~650</text><text x="18" y="206">토양</text><text x="18" y="226">1,500~2,400</text><rect x="245" y="140" width="105" height="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.8"/><text x="253" y="160" font-weight="700">바다</text><text x="253" y="184">표층 900</text><text x="253" y="208" font-weight="700">중·심층 37,000</text><text x="253" y="232">퇴적물 1,750</text><rect x="10" y="262" width="340" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="20" y="284">암석 화석연료 수천·퇴적암 수천만</text><line x1="40" y1="88" x2="40" y2="136" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" marker-end="url(#carbon-cycle-reservoirs-ar)"/><line x1="62" y1="136" x2="62" y2="88" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" marker-end="url(#carbon-cycle-reservoirs-ar)"/><text x="74" y="108">총일차생산</text><text x="74" y="128">약 120</text><line x1="300" y1="88" x2="300" y2="136" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" marker-end="url(#carbon-cycle-reservoirs-ar)"/><line x1="322" y1="136" x2="322" y2="88" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" marker-end="url(#carbon-cycle-reservoirs-ar)"/><text x="290" y="108" text-anchor="end">해양-대기</text><text x="290" y="128" text-anchor="end">각 80~90</text><line x1="155" y1="160" x2="155" y2="88" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="6" marker-end="url(#carbon-cycle-reservoirs-ar-1)"/><line x1="210" y1="160" x2="210" y2="88" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="3" marker-end="url(#carbon-cycle-reservoirs-ar-2)"/><text x="155" y="180" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">화석연료</text><text x="155" y="200" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">9.5~10</text><text x="210" y="180" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">토지이용</text><text x="210" y="200" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">약 1</text><line x1="182" y1="260" x2="182" y2="240" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" marker-end="url(#carbon-cycle-reservoirs-ar-3)"/><text x="182" y="230" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">화산 0.1</text><text x="180" y="322" text-anchor="middle" font-weight="700">연 배출 약 11의 행방(2013~22)</text><rect x="10" y="332" width="161" height="28" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1.4" fill-opacity="0.45"/><rect x="171" y="332" width="90" height="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="261" y="332" width="89" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.4"/><text x="90" y="351" text-anchor="middle">대기 5.2</text><text x="216" y="351" text-anchor="middle">해양 2.9</text><text x="305" y="351" text-anchor="middle">육상 3.1</text><text x="180" y="382" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">흡수 분율 약 55%</text><text x="180" y="414" text-anchor="middle">체류시간: 대기 약 4년 / 심해 약 1,000년</text><text x="180" y="440" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">화석연료 CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> 펄스의 20~35%는</tspan></text><text x="180" y="460" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">수천 년 뒤에도 대기에 남는다</text></svg>
