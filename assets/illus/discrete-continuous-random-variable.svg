<svg class="si si-illus" viewBox="0 0 360 422" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="discrete-continuous-random-variable-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="discrete-continuous-random-variable-t">이산확률변수는 막대를 더하고 연속확률변수는 넓이를 구한다</title><defs></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">이산: 막대 높이를 더함</text><text x="268" y="50" text-anchor="middle" font-weight="700">P(X ≥ 5)</text><text x="268" y="68" text-anchor="middle">= 1/6 + 1/6 = 0.333</text><path d="M231 90 v-6 H305 v6" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6"/><line x1="40" y1="170" x2="330" y2="170" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="40" y1="170" x2="40" y2="80" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="55" y="98" width="30" height="72" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="70" y="188" text-anchor="middle">1</text><rect x="99" y="98" width="30" height="72" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="114" y="188" text-anchor="middle">2</text><rect x="143" y="98" width="30" height="72" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="158" y="188" text-anchor="middle">3</text><rect x="187" y="98" width="30" height="72" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="202" y="188" text-anchor="middle">4</text><rect x="231" y="98" width="30" height="72" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6" fill-opacity="0.5"/><text x="246" y="188" text-anchor="middle">5</text><rect x="275" y="98" width="30" height="72" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6" fill-opacity="0.5"/><text x="290" y="188" text-anchor="middle">6</text><text x="34" y="103" text-anchor="end">1/6</text><line x1="40" y1="98" x2="52" y2="98" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="185" y="210" text-anchor="middle">주사위 눈 X (값마다 확률 1/6)</text><text x="180" y="252" text-anchor="middle" font-size="14" font-weight="700">연속: 곡선 아래 넓이(적분)</text><text x="160" y="278" text-anchor="middle" font-weight="700">P(0.2 ≤ Y ≤ 0.5) = 0.5 − 0.2 = 0.3</text><rect x="104" y="288" width="81" height="72" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6" fill-opacity="0.4"/><line x1="40" y1="360" x2="330" y2="360" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="50" y1="364" x2="50" y2="292" style="stroke:currentColor;fill:none" stroke-width="1.6"/><path d="M50 360 V288 H320 V360" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6"/><line x1="50" y1="360" x2="50" y2="366" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="50" y="382" text-anchor="middle">0</text><line x1="104" y1="360" x2="104" y2="366" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="104" y="382" text-anchor="middle">0.2</text><line x1="185" y1="360" x2="185" y2="366" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="185" y="382" text-anchor="middle">0.5</text><line x1="320" y1="360" x2="320" y2="366" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="320" y="382" text-anchor="middle">1</text><line x1="131" y1="288" x2="131" y2="360" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="190" y="328">한 점의 확률 = 0</text><line x1="188" y1="324" x2="133" y2="332" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="133" cy="332" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="190" y="346">폭 0 → 넓이 0</text><text x="44" y="293" text-anchor="end">1</text><text x="180" y="406" text-anchor="middle">Y ~ Uniform(0, 1), 곡선의 높이는 밀도</text></svg>
