<svg class="si si-illus" viewBox="0 0 400 370" style="max-width:400px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="force-torque-sensor-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="force-torque-sensor-t">가상의 1.5 kg 그리퍼 무게(14.7 N)를 센서 z축에 분해한 모습(30° 자세)</title><defs><marker id="force-torque-sensor-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="150" y1="40" x2="150" y2="298.5" style="stroke:currentColor;fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.6"/><line x1="150" y1="40" x2="284.8" y2="273.4" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#force-torque-sensor-ar)"/><line x1="150" y1="40" x2="150" y2="271" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#force-torque-sensor-ar)"/><line x1="250" y1="213.3" x2="150" y2="271" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="150" y1="40" x2="250" y2="213.3" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4"/><polyline points="NaN,NaN NaN,NaN NaN,NaN" style="stroke:currentColor;fill:none" stroke-width="1"/><circle cx="150" cy="40" r="4" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><path d="M150,84 A44,44 0 0 0 172,78.1" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="165" y="101" text-anchor="middle">θ</text><text x="294.8" y="275.4" font-weight="700" font-style="italic">z</text><text x="140" y="285" text-anchor="end" font-weight="700">W = 14.7 N</text><text x="218" y="120.6" style="fill:var(--si-accent,#2454ff)">12.7 N</text><text x="192" y="236.1" text-anchor="end" style="fill:var(--si-accent,#2454ff)">7.4 N</text><text x="150" y="331.5" text-anchor="middle">12.7 = 14.7 cosθ,  7.4 ≈ 14.7 sinθ</text></svg>
