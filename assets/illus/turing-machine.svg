<svg class="si si-illus" viewBox="0 0 600 332" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="튜링 기계의 구성" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>칸으로 나뉜 테이프 위에 헤드가 한 칸을 가리키고, 헤드는 상태 레지스터와 명령 표에 연결되어 있다</desc><defs></defs><rect x="58" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><rect x="102" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><rect x="146" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="168" y="98" text-anchor="middle" font-size="15">1</text><rect x="190" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="212" y="98" text-anchor="middle" font-size="15">0</text><rect x="234" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="256" y="98" text-anchor="middle" font-size="15">1</text><rect x="278" y="70" width="44" height="44" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="1"/><text x="300" y="98" text-anchor="middle" font-size="15">1</text><rect x="322" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="344" y="98" text-anchor="middle" font-size="15">0</text><rect x="366" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><rect x="410" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><rect x="454" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><rect x="498" y="70" width="44" height="44" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="36" y="98" text-anchor="middle" font-size="16">…</text><text x="564" y="98" text-anchor="middle" font-size="16">…</text><text x="58" y="58" font-size="12">테이프(칸이 끝없이 이어짐)</text><polygon points="300,118 288,138 312,138" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2"/><rect x="230" y="138" width="140" height="40" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><text x="300" y="163" text-anchor="middle" font-size="12">헤드: 읽기·쓰기·이동</text><rect x="40" y="250" width="210" height="56" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4"/><text x="145" y="274" text-anchor="middle" font-size="12" font-weight="700">상태 레지스터</text><text x="145" y="294" text-anchor="middle" font-size="11">지금 상태 하나를 저장</text><rect x="290" y="236" width="270" height="84" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.4"/><text x="425" y="258" text-anchor="middle" font-size="12" font-weight="700">명령 표</text><text x="425" y="282" text-anchor="middle" font-size="11">(상태, 읽은 기호) →</text><text x="425" y="302" text-anchor="middle" font-size="11">(쓸 기호, 왼쪽/오른쪽 이동, 다음 상태)</text><line x1="300" y1="178" x2="300" y2="220" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="145" y1="220" x2="425" y2="220" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="145" y1="220" x2="145" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><line x1="425" y1="220" x2="425" y2="236" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/></svg>
