<svg class="si si-illus" viewBox="0 0 520 300" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scalar-triple-product-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="scalar-triple-product-t">세 벡터가 이루는 평행육면체와 스칼라 삼중곱</title><defs><marker id="scalar-triple-product-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="282" y1="243" x2="426" y2="243" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><polygon points="150,270 274,270 414,216 290,216" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.18"/><polygon points="238,76 362,76 502,22 378,22" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.12"/><polygon points="150,270 274,270 362,76 238,76" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.08"/><polygon points="274,270 414,216 502,22 362,76" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.08"/><polygon points="290,216 414,216 502,22 378,22" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.08"/><line x1="150" y1="270" x2="274" y2="270" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#scalar-triple-product-ar)"/><line x1="150" y1="270" x2="290" y2="216" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#scalar-triple-product-ar)"/><line x1="150" y1="270" x2="238" y2="76" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#scalar-triple-product-ar)"/><text x="282" y="284" font-size="15" font-style="italic">a</text><text x="276" y="211" font-size="15" font-style="italic">b</text><text x="224" y="72" font-size="15" font-style="italic">c</text><line x1="238" y1="76" x2="238" y2="252" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="244" y="164">높이 4</text><text x="428" y="238">밑면 넓이 6</text><text x="16" y="28" font-size="14">V = |a · (b × c)| = 24</text><text x="16" y="52">밑면 넓이 6 × 높이 4</text><text x="16" y="76">사면체의 부피 = 24 ÷ 6 = 4</text></svg>
