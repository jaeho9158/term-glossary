pan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">를 소비한다</tspan></text><text x="20" y="398" font-weight="700">② 탄산염이 바다 밑에 침전·퇴적한다</text><text x="20" y="430" font-weight="700">③ 섭입대에서 탄산염+실리카</text><text x="20" y="450" font-weight="700">→ 규산칼슘+CO<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="20" y="482" font-weight="700">④ 화산이 CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">를 대기로 돌려보낸다</tspan></text><text x="20" y="522">암석 저장고 99.6% vs 생물권 0.002%</text><text x="20" y="542">석회암 = 지질 저장 탄소의 약 80%</text><text x="20" y="562">풍화 수백만 년 / 해양-대기 교환 수백 년</text><text x="20" y="582" style="fill:var(--si-general,#5c6b7f)">화산 CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">는 화석연료 배출의 1% 미만</tspan></text></svg>
