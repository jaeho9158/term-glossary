<svg class="si si-illus" viewBox="0 0 400 280" style="max-width:400px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="molecular-polarity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="molecular-polarity-t">분자 극성: 굽은 물 분자는 쌍극자가 합쳐지고 직선형 이산화탄소는 상쇄된다</title><defs><marker id="molecular-polarity-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="molecular-polarity-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="20" y="24" font-weight="700">물 (H<tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em">O): 굽은 구조</tspan></text><line x1="75.7" y1="116.6" x2="97.7" y2="99.5" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#molecular-polarity-ar)"/><line x1="144.3" y1="116.6" x2="122.3" y2="99.5" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#molecular-polarity-ar)"/><line x1="61" y1="128" x2="110" y2="90" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.5"/><line x1="159" y1="128" x2="110" y2="90" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.5"/><circle cx="110" cy="90" r="15" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="110" y="95" text-anchor="middle" font-weight="700">O</text><circle cx="61" cy="128" r="15" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="61" y="133" text-anchor="middle" font-weight="700">H</text><circle cx="159" cy="128" r="15" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="159" y="133" text-anchor="middle" font-weight="700">H</text><line x1="210" y1="125" x2="210" y2="70" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.2" marker-end="url(#molecular-polarity-ar-1)"/><text x="222" y="100" style="fill:var(--si-amber-s,#d79a2b)">합 쌍극자 ≠ 0</text><text x="20" y="190" font-weight="700">이산화탄소 (CO<tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em">): 직선형</tspan></text><line x1="50" y1="240" x2="210" y2="240" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.5"/><line x1="118" y1="228" x2="68" y2="228" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#molecular-polarity-ar)"/><line x1="142" y1="228" x2="192" y2="228" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#molecular-polarity-ar)"/><circle cx="130" cy="240" r="15" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="130" y="245" text-anchor="middle" font-weight="700">C</text><circle cx="50" cy="240" r="15" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="50" y="245" text-anchor="middle" font-weight="700">O</text><circle cx="210" cy="240" r="15" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="210" y="245" text-anchor="middle" font-weight="700">O</text><text x="240" y="246" style="fill:var(--si-general,#5c6b7f)">합 쌍극자 = 0</text></svg>
