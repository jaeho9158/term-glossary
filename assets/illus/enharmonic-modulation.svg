5c6b7f)">D♯/E♭</text><circle cx="247.5" cy="189" r="3.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="271.8" y="208" font-weight="400" style="fill:var(--si-general,#5c6b7f)">E</text><circle cx="219" cy="217.5" r="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="233" y="246.8" font-weight="700" style="fill:var(--si-accent,#2454ff)">F</text><circle cx="180" cy="228" r="3.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="180" y="274" text-anchor="middle" font-weight="400" style="fill:var(--si-general,#5c6b7f)">F♯/G♭</text><circle cx="141" cy="217.5" r="3.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="127" y="246.8" text-anchor="end" font-weight="400" style="fill:var(--si-general,#5c6b7f)">G</text><circle cx="112.5" cy="189" r="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="88.2" y="208" text-anchor="end" font-weight="700" style="fill:var(--si-accent,#2454ff)">G♯/A♭</text><circle cx="102" cy="150" r="3.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="74" y="155" text-anchor="end" font-weight="400" style="fill:var(--si-general,#5c6b7f)">A</text><circle cx="112.5" cy="111" r="3.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="88.2" y="102" text-anchor="end" font-weight="400" style="fill:var(--si-general,#5c6b7f)">A♯/B♭</text><circle cx="141" cy="82.5" r="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="127" y="63.2" text-anchor="end" font-weight="700" style="fill:var(--si-accent,#2454ff)">B</text><text x="180" y="306" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">감7화음 예: G♯–B–D–F</text><line x1="24" y1="328" x2="56" y2="328" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6"/><text x="66" y="333">변 = 단3도(반음 3칸)</text><line x1="24" y1="348" x2="56" y2="348" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><text x="66" y="353">대각선 = 증4도(트라이톤)</text><text x="24" y="380">각 꼭짓점을 이끎음으로 읽으면 새로운 조 4곳으로</text><text x="24" y="400">이어진다(단3도·증4도·장6도 떨어진 조).</text><rect x="75" y="454" width="30" height="64" rx="2" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="105" y="454" width="30" height="64" rx="2" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="135" y="454" width="30" height="64" rx="2" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="165" y="454" width="30" height="64" rx="2" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="195" y="454" width="30" height="64" rx="2" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="225" y="454" width="30" height="64" rx="2" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="255" y="454" width="30" height="64" rx="2" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="96" y="454" width="18" height="38" rx="2" style="stroke:currentColor;fill:currentColor" stroke-width="1.2" fill-opacity="1"/><rect x="126" y="454" width="18" height="38" rx="2" style="stroke:currentColor;fill:currentColor" stroke-width="1.2" fill-opacity="1"/><rect x="186" y="454" width="18" height="38" rx="2" style="stroke:currentColor;fill:currentColor" stroke-width="1.2" fill-opacity="1"/><rect x="216" y="454" width="18" height="38" rx="2" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="1.2" fill-opacity="1"/><rect x="246" y="454" width="18" height="38" rx="2" style="stroke:currentColor;fill:currentColor" stroke-width="1.2" fill-opacity="1"/><text x="90" y="512" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">C</text><text x="120" y="512" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">D</text><text x="150" y="512" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">E</text><text x="180" y="512" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">F</text><text x="210" y="512" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">G</text><text x="240" y="512" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">A</text><text x="270" y="512" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">B</text><text x="180" y="434" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">같은 건반, 다른 이름: G♯ = A♭</text><line x1="225" y1="440" x2="225" y2="452" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2" marker-end="url(#enharmonic-modulation-ar)"/><text x="180" y="550" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">12평균율에서는 두 이름이 같은 음높이이다.</text><text x="180" y="570" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">피타고라스 조율에서는 G♯이 A♭보다 약 23.46센트 높다.</text></svg>
