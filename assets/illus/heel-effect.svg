<svg class="si si-illus" viewBox="0 0 360 540" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="힐 효과: 경사진 양극 속 X선 경로 길이의 차이" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="heel-effect-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="heel-effect-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker></defs><path d="M40 55 q6 -8 12 0 q6 8 12 0 q6 -8 12 0" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.4"/><text x="10" y="88" font-weight="700">음극</text><line x1="80" y1="55" x2="214" y2="55" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#heel-effect-ar)"/><text x="105" y="44" style="fill:var(--si-accent,#2454ff)">전자빔</text><polygon points="212,32 330,32 330,120 236,120" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="290" y="84" text-anchor="middle" font-weight="700">양극</text><circle cx="220" cy="55" r="3.6" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1"/><text x="150" y="28" style="fill:var(--si-limit,#7d2626)">초점</text><line x1="172" y1="32" x2="216" y2="52" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><line x1="220" y1="55" x2="220" y2="95" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><path d="M220 77 A22 22 0 0 1 226.4 76.4" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="220" y1="55" x2="148.2" y2="186" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" marker-end="url(#heel-effect-ar)"/><line x1="220" y1="55" x2="191