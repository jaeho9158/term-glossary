<svg class="si si-illus" viewBox="0 0 600 320" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="풍동의 구조" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>덕트 안에서 팬이 공기를 흐르게 하고, 시험부에 고정한 모형에 걸리는 힘과 모멘트를 지지대 아래 저울로 재는 개방형 풍동 모식도</desc><defs><marker id="wind-tunnel-testing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><polygon points="40,80 200,140 360,140 540,110 540,270 360,240 200,240 40,300" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.08"/><rect x="200" y="140" width="160" height="100" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.12"/><ellipse cx="280" cy="180" rx="34" ry="8" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.2" fill-opacity="0.5"/><line x1="280" y1="188" x2="280" y2="238" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><rect x="262" y="240" width="36" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1" fill-opacity="0.5"/><ellipse cx="515" cy="160" rx="8" ry="30" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1" fill-opacity="0.4"/><ellipse cx="515" cy="220" rx="8" ry="30" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1" fill-opacity="0.4"/><circle cx="515" cy="190" r="5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><line x1="60" y1="150" x2="110" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#wind-tunnel-testing-ar)"/><line x1="60" y1="190" x2="110" y2="190" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#wind-tunnel-testing-ar)"/><line x1="60" y1="230" x2="110" y2="230" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#wind-tunnel-testing-ar)"/><text x="85" y="128" text-anchor="middle" font-size="12">기류</text><text x="280" y="118" text-anchor="middle" font-size="12">시험부</text><text x="170" y="196" text-anchor="end" font-size="12">모형</text><line x1="174" y1="192" x2="246" y2="182" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="280" y="292" text-anchor="middle" font-size="12">저울(힘·모멘트 측정)</text><line x1="280" y1="280" x2="280" y2="258" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="560" y="300" text-anchor="end" font-size="12">팬</text><line x1="548" y1="294" x2="520" y2="252" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="450" y="96" text-anchor="middle" font-size="12">덕트</text><line x1="450" y1="104" x2="450" y2="124" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
