<svg class="si si-illus" viewBox="0 0 360 556" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diminished-seventh-chord-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="diminished-seventh-chord-t">감7화음: 12음 원 위의 정사각형</title><defs></defs><circle cx="180" cy="175" r="100" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4"/><polygon points="230,88.4 266.6,225 130,261.6 93.4,125" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.8" stroke-dasharray="6 4" fill-opacity="0.05"/><polygon points="266.6,125 230,261.6 93.4,225 130,88.4" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.8" stroke-dasharray="6 4" fill-opacity="0.05"/><polygon points="180,75 280,175 180,275 80,175" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="3" fill-opacity="0.14"/><circle cx="180" cy="75" r="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="180" y="56" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">C 0</text><circle cx="230" cy="88.4" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="236" y="76.1" font-weight="400">C♯ 1</text><circle cx="266.6" cy="125" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="279.9" y="120" font-weight="400">D 2</text><circle cx="280" cy="175" r="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="296" y="180" font-weight="700" style="fill:var(--si-accent,#2454ff)">E♭ 3</text><circle cx="266.6" cy="225" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="279.9" y="240" font-weight="400">E 4</text><circle cx="230" cy="261.6" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="236" y="283.9" font-weight="400">F 5</text><circle cx="180" cy="275" r="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="180" y="308" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">G♭/F♯ 6</text><circle cx="130" cy="261.6" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="124" y="283.9" text-anchor="end" font-weight="400">G 7</text><circle cx="93.4" cy="225" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="80.1" y="240" text-anchor="end" font-weight="400">A♭ 8</text><circle cx="80" cy="175" r="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="64" y="180" text-anchor="end" font-weight="700" style="fill:var(--si-accent,#2454ff)">A 9</text><circle cx="93.4" cy="125" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="80.1" y="120" text-anchor="end" font-weight="400">B♭ 10</text><circle cx="130" cy="88.4" r="3.5" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="124" y="76.1" text-anchor="end" font-weight="400">B 11</text><circle cx="130" cy="261.6" r="11" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><text x="180" y="169" text-anchor="middle" font-weight="700">각 변 = 단3도</text><text x="180" y="191" text-anchor="middle">(반음 3개)</text><line x1="20" y1="335" x2="52" y2="335" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.5"/><text x="60" y="340">{0,3,6,9} C–E♭–G♭–A = Cdim7</text><line x1="20" y1="359" x2="52" y2="359" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="60" y="364">{2,5,8,11} D–F–A♭–B</text><line x1="20" y1="383" x2="52" y2="383" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="60" y="388">{1,4,7,10} C♯–E–G–B♭</text><text x="10" y="420" font-weight="700">한 칸씩 돌리면 서로 겹침 → 소리는 3종류뿐</text><circle cx="26" cy="454" r="8" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><text x="44" y="459" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">G7♭9 = G + B–D–F–A♭</text><text x="10" y="488">B–D–F–A♭ = {11,2,5,8}, 간격 모두 3반음</text><text x="10" y="514" font-weight="700" style="fill:var(--si-accent,#2454ff)">어느 꼭짓점을 근음으로 잡아도 같은 모양</text><text x="10" y="536" font-weight="700" style="fill:var(--si-accent,#2454ff)">→ 이명동음전조가 가능하다.</text></svg>
