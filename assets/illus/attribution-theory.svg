<svg class="si si-illus" viewBox="0 0 360 556" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="귀인 이론: 원인 소재·안정성·통제 가능성" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="22" text-anchor="middle" font-weight="700">행동의 원인을 어디에 두는가</text><text x="60" y="50" style="fill:var(--si-general,#5c6b7f)">내부</text><text x="195" y="50" text-anchor="middle" font-weight="700">원인 소재</text><text x="330" y="50" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">외부</text><text x="8" y="82" style="fill:var(--si-general,#5c6b7f)">안정</text><text x="8" y="202" font-weight="700">안정성</text><text x="8" y="322" style="fill:var(--si-general,#5c6b7f)">불안정</text><rect x="60" y="60" width="270" height="270" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><line x1="195" y1="60" x2="195" y2="330" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><line x1="60" y1="195" x2="330" y2="195" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><rect x="61" y="196" width="133" height="133" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="0" fill-opacity="0.16"/><circle cx="127" cy="98" r="17" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="2" stroke-dasharray="4 3"/><text x="127" y="144" text-anchor="middle" font-weight="700">능력</text><text x="127" y="168" text-anchor="middle" font-weight="400" style="fill:var(--si-general,#5c6b7f)">통제 불가능</text><circle cx="262" cy="98" r="17" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="2" stroke-dasharray="4 3"/><text x="262" y="144" text-anchor="middle" font-weight="700">과제 난이도</text><text x="262" y="168" text-anchor="middle" font-weight="400" style="fill:var(--si-general,#5c6b7f)">통제 불가능</text><circle cx="127" cy="233" r="17" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2"/><text x="127" y="279" text-anchor="middle" font-weight="700">노력</text><text x="127" y="303" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">통제 가능</text><circle cx="262" cy="233" r="17" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="2" stroke-dasharray="4 3"/><text x="262" y="279" text-anchor="middle" font-weight="700">운</text><text x="262" y="303" text-anchor="middle" font-weight="400" style="fill:var(--si-general,#5c6b7f)">통제 불가능</text><text x="8" y="354" style="fill:var(--si-general,#5c6b7f)">실선 점 = 통제 가능, 점선 점 = 통제 불가능</text><text x="180" y="392" text-anchor="middle" font-weight="700">Kelley(1967) 공변 원리의 세 정보</text><rect x="20" y="404" width="104" height="76" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="72" y="426" text-anchor="middle" font-weight="700">합의성</text><text x="72" y="450" text-anchor="middle">다른 사람도</text><text x="72" y="474" text-anchor="middle">그러는가</text><rect x="132" y="404" width="104" height="76" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="184" y="426" text-anchor="middle" font-weight="700">특이성</text><text x="184" y="450" text-anchor="middle">다른 대상에도</text><text x="184" y="474" text-anchor="middle">그러는가</text><rect x="244" y="404" width="104" height="76" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="296" y="426" text-anchor="middle" font-weight="700">일관성</text><text x="296" y="450" text-anchor="middle">다른 때에도</text><text x="296" y="474" text-anchor="middle">그러는가</text><text x="180" y="514" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">노력 칸만 통제 가능하다. 이 차이가</text><text x="180" y="536" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">이후의 감정과 행동을 바꾼다(Weiner, 1985).</text></svg>
