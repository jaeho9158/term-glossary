<svg class="si si-illus" viewBox="0 0 360 450" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graded-exercise-rehabilitation-protocol-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="graded-exercise-rehabilitation-protocol-t">단계별 운동 재활: 6단계 계단과 증상 시 되돌림</title><defs><marker id="graded-exercise-rehabilitation-protocol-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="graded-exercise-rehabilitation-protocol-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="14" y="24" font-weight="700">운동 강도를 한 계단씩 올림</text><rect x="24" y="260" width="52" height="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.1"/><text x="50" y="252" text-anchor="middle" font-weight="700">휴식</text><text x="50" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">1</text><rect x="76" y="226" width="52" height="64" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.15000000000000002"/><text x="102" y="198" text-anchor="middle" font-weight="700">가벼운</text><text x="102" y="218" text-anchor="middle" font-weight="700">유산소</text><text x="102" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">2</text><rect x="128" y="192" width="52" height="98" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.2"/><text x="154" y="164" text-anchor="middle" font-weight="700">종목별</text><text x="154" y="184" text-anchor="middle" font-weight="700">훈련</text><text x="154" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">3</text><rect x="180" y="158" width="52" height="132" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.25"/><text x="206" y="130" text-anchor="middle" font-weight="700">비접촉</text><text x="206" y="150" text-anchor="middle" font-weight="700">훈련</text><text x="206" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">4</text><rect x="232" y="124" width="52" height="166" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.30000000000000004"/><text x="258" y="76" text-anchor="middle" font-weight="700">전면적</text><text x="258" y="96" text-anchor="middle" font-weight="700">접촉</text><text x="258" y="116" text-anchor="middle" font-weight="700">훈련</text><text x="258" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">5</text><rect x="284" y="90" width="52" height="200" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.8" fill-opacity="0.35"/><text x="310" y="82" text-anchor="middle" font-weight="700">복귀</text><text x="310" y="282" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">6</text><line x1="24" y1="304" x2="344" y2="304" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#graded-exercise-rehabilitation-protocol-ar)"/><text x="336" y="328" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">시간</text><line x1="10" y1="290" x2="10" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#graded-exercise-rehabilitation-protocol-ar)"/><text x="4" y="62" style="fill:var(--si-general,#5c6b7f)">강도</text><line x1="76" y1="350" x2="284" y2="350" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#graded-exercise-rehabilitation-protocol-ar)" marker-start="url(#graded-exercise-rehabilitation-protocol-ar)"/><text x="180" y="372" text-anchor="middle">각 단계 ≥24시간 무증상이면 다음 단계</text><path d="M208.6,165 L198.2,180.1 L205.5,180.1 L203.4,191 L213.8,175.4 L206.5,175.4Z" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.5"/><text x="206" y="208" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">증상</text><text x="206" y="228" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">재발</text><line x1="190" y1="250" x2="158" y2="258" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" marker-end="url(#graded-exercise-rehabilitation-protocol-ar-1)"/><text x="14" y="408" style="fill:var(--si-rose-s,#c97b7b)">증상이 나타나면 즉시 이전 단계로,</text><text x="14" y="428" style="fill:var(--si-rose-s,#c97b7b)">참고 다음 단계로 가지 않는다</text></svg>
