"575.8" text-anchor="middle" font-size="10.4">Pab</text><line x1="160.1" y1="577.8" x2="183.4" y2="577.8" style="stroke:var(--si-amber-s,#d79a2b)" stroke-width="0.8"/><text x="171.8" y="586.8" text-anchor="middle" font-size="10.4">L</text><text x="184.9" y="582">)</text></g><text x="14" y="620" font-weight="700">ΣF = 0 → R<tspan dy="0.217em" font-size="92%">A</tspan><tspan dy="-0.2em"> + R</tspan><tspan dy="0.217em" font-size="92%">B</tspan><tspan dy="-0.2em"> = 10 kN</tspan></text><text x="14" y="652" font-weight="700">ΣM<tspan dy="0.217em" font-size="92%">B</tspan><tspan dy="-0.2em"> = 0 → R</tspan><tspan dy="0.217em" font-size="92%">A</tspan><tspan dy="-0.2em"> × 4 = 10 × 2.5</tspan></text></svg>
