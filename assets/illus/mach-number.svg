<svg class="si si-illus" viewBox="0 0 360 652" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mach-number-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="mach-number-t">마하수: 속도를 그 위치의 음속으로 나눈 값이고, 1을 넘으면 파면이 모여 충격파가 생긴다</title><defs><marker id="mach-number-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="10" y="18" font-weight="700" style="fill:var(--si-accent,#2454ff)">같은 음원이 왼쪽으로 움직일 때의 파면</text><text x="55" y="44" text-anchor="middle" font-weight="700">M = 0.5</text><circle cx="35" cy="88" r="10" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="40" cy="88" r="20" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="45" cy="88" r="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><circle cx="30" cy="88" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><line x1="24" y1="112" x2="8" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#mach-number-ar)"/><text x="175" y="44" text-anchor="middle" font-weight="700">M = 1</text><circle cx="150" cy="88" r="10" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="160" cy="88" r="20" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="170" cy="88" r="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><circle cx="140" cy="88" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><line x1="134" y1="112" x2="118" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#mach-number-ar)"/><text x="295" y="44" text-anchor="middle" font-weight="700">M = 2</text><circle cx="270" cy="88" r="10" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="290" cy="88" r="20" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="310" cy="88" r="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><circle cx="250" cy="88" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><line x1="244" y1="112" x2="228" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#mach-number-ar)"/><line x1="250" y1="88" x2="301.8" y2="58.1" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="250" y1="88" x2="301.8" y2="117.9" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="140" y1="52" x2="140" y2="124" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="55" y="140" text-anchor="middle">겹치지 않음</text><text x="175" y="140" text-anchor="middle">한 점에서 접함</text><text x="175" y="162" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">(충격파 면)</text><text x="295" y="140" text-anchor="middle">원뿔(V자)</text><text x="295" y="162" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">충격파</text><text x="10" y="200" font-weight="700" style="fill:var(--si-accent,#2454ff)">M = 2의 마하각</text><polyline points="30,232 130,232 105,275.3 30,232" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="30" y1="232" x2="105" y2="275.3" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><path d="M59.4,249 A34,34 0 0 0 64,232" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="64" y="247" font-style="italic">μ</text><text x="80" y="222" text-anchor="middle" font-style="italic">vt</text><text x="122" y="256" font-style="italic">at</text><g class="si-rich" font-size="13" ><text x="150" y="226">sin μ = </text><text x="207.3" y="219.8" text-anchor="middle" font-size="10.4">at</text><line x1="199.3" y1="221.8" x2="215.2" y2="221.8" style="stroke:currentColor" stroke-width="0.8"/><text x="207.3" y="230.8" text-anchor="middle" font-size="10.4">vt</text><text x="216.7" y="226"> = </text><text x="239.3" y="219.8" text-anchor="middle" font-size="10.4">1</text><line x1="234.1" y1="221.8" x2="244.6" y2="221.8" style="stroke:currentColor" stroke-width="0.8"/><text x="239.3" y="230.8" text-anchor="middle" font-size="10.4">M</text></g><text x="150" y="252" font-weight="700">M = 2 → μ = 30°</text><text x="150" y="278" style="fill:var(--si-general,#5c6b7f)">(v 속도, a 음속, t 시간)</text><text x="10" y="322" font-weight="700" style="fill:var(--si-accent,#2454ff)">속도 구간(관례값)</text><rect x="20" y="360" width="42.4" height="18" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="62.4" y="360" width="21.2" height="18" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><rect x="83.6" y="360" width="201.4" height="18" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><rect x="285" y="360" width="53" height="18" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><line x1="20" y1="378" x2="338" y2="378" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="20" y1="378" x2="20" y2="383" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="20" y="400" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="73" y1="378" x2="73" y2="383" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="73" y="400" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1</text><line x1="126" y1="378" x2="126" y2="383" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="126" y="400" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">2</text><line x1="179" y1="378" x2="179" y2="383" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="179" y="400" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">3</text><line x1="232" y1="378" x2="232" y2="383" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="232" y="400" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">4</text><line x1="285" y1="378" x2="285" y2="383" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="285" y="400" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">5</text><line x1="338" y1="378" x2="338" y2="383" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="338" y="400" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">6</text><text x="41.2" y="374" text-anchor="middle" font-weight="700">아음속</text><text x="184.3" y="374" text-anchor="middle" font-weight="700">초음속</text><text x="73" y="348" text-anchor="middle" font-weight="700">천음속</text><text x="311.5" y="354" text-anchor="middle" font-weight="700">극초음속</text><text x="346" y="402" font-weight="700" font-style="italic">M</text><text x="10" y="434" style="fill:var(--si-general,#5c6b7f)">경계: 0.3(비압축성 근사), 0.8, 1.2, 5</text><text x="10" y="458" style="fill:var(--si-general,#5c6b7f)">책마다 조금씩 다른 관례값이다</text><text x="10" y="496" font-weight="700" style="fill:var(--si-accent,#2454ff)">같은 250 m/s, 고도가 다르면</text><text x="10" y="522">해면 a ≈ 340.3 m/s (288.15 K)</text><rect x="20" y="530" width="255.2" height="18" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="281.2" y="544" font-weight="700">M ≈ 0.73</text><text x="10" y="578">11 km a ≈ 295.1 m/s (216.65 K)</text><rect x="20" y="586" width="221.3" height="18" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><text x="247.3" y="600" font-weight="700">M ≈ 0.85</text><line x1="207.5" y1="527" x2="207.5" y2="551" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><line x1="207.5" y1="583" x2="207.5" y2="620" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><text x="167.5" y="634" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">v = 250 m/s</text></svg>
