<svg class="si si-illus" viewBox="0 0 600 330" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overbite-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="overbite-t">수직피개교합(overbite): 위 앞니가 아래 앞니를 수직으로 덮는 길이</title><desc>위 중절치가 아래 중절치를 수직으로 3.0 mm 덮고, 아래 중절치 치관 길이는 9.0 mm인 옆모습 모식도. 수평 거리는 overjet으로 따로 표시했다.</desc><defs><marker id="overbite-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker><marker id="overbite-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="158" y1="171" x2="112.2" y2="171" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="312" y1="214" x2="328" y2="214" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="196" y1="170" x2="107" y2="113" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="250" y1="70" x2="328" y2="67" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="240" y1="240" x2="328" y2="240" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="24" font-size="12" font-weight="700">앞니 옆모습(왼쪽이 입술 쪽, 모식)</text><polygon points="205,40 265,40 206,192 192,192" style="stroke:currentColor;fill:currentColor" stroke-width="1.8" fill-opacity="0.14"/><polygon points="224,150 238,150 244,276 214,276" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="1.8" fill-opacity="0.25"/><line x1="150" y1="150" x2="224" y2="150" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/><line x1="150" y1="192" x2="192" y2="192" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/><line x1="214" y1="276" x2="320" y2="276" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/><line x1="248" y1="150" x2="320" y2="150" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/><line x1="160" y1="150" x2="160" y2="192" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4" marker-end="url(#overbite-ar)" marker-start="url(#overbite-ar)"/><text x="14" y="176" font-size="12" font-weight="700">overbite 3.0 mm</text><line x1="310" y1="150" x2="310" y2="276" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4" marker-end="url(#overbite-ar)" marker-start="url(#overbite-ar)"/><text x="330" y="216" font-size="12" font-weight="700">하악 치관 9.0 mm</text><line x1="194" y1="172" x2="222" y2="172" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#overbite-ar-1)" marker-start="url(#overbite-ar-1)"/><text x="14" y="106" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">overjet(수평)</text><text x="330" y="60" font-size="12">상악 중절치</text><text x="330" y="250" font-size="12">하악 중절치</text><text x="20" y="60" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">입술 쪽</text><text x="350" y="104" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">덮은 길이 0 = 절단교합(edge-to-edge)</text><text x="350" y="122" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">윗니와 아랫니가 떠 있으면 음수 = 개방교합</text><text x="20" y="312" font-size="12" style="fill:var(--si-general,#5c6b7f)">overbite (%) = 3.0 ÷ 9.0 × 100 ≈ 33%</text></svg>
