d)" stroke-width="1.2" fill-opacity="0.4"/><rect x="178" y="370" width="44" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.25"/><rect x="222" y="370" width="44" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.75"/><rect x="90" y="400" width="44" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.25"/><rect x="134" y="400" width="44" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-violet-s,#9382bd)" stroke-width="1.2" fill-opacity="0.4"/><rect x="178" y="400" width="44" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.25"/><rect x="222" y="400" width="44" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.25"/><text x="112" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1</text><text x="82" y="330" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">1</text><text x="156" y="304" text-anchor="middle" style="fill:var(--si-violet-s,#9382bd)">2(k)</text><text x="82" y="360" text-anchor="end" style="fill:var(--si-violet-s,#9382bd)">2(k)</text><text x="200" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">3</text><text x="82" y="390" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">3</text><text x="244" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">4</text><text x="82" y="420" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">4</text><text x="156" y="390" text-anchor="middle" font-style="italic" style="fill:var(--si-violet-s,#9382bd)">ik</text><text x="244" y="360" text-anchor="middle" font-style="italic" style="fill:var(--si-violet-s,#9382bd)">kj</text><text x="56" y="390" text-anchor="end" font-style="italic">i</text><text x="244" y="452" t