<svg class="si si-illus" viewBox="0 0 360 468" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ASO 검사: 항체가 곡선과 짝지은 혈청의 4배 상승" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="aso-test-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="24" font-weight="700">ASO 항체가(IU/mL)</text><line x1="150" y1="310" x2="230" y2="310" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="6"/><text x="190" y="84" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">정점 3~6주</text><line x1="50" y1="310" x2="346" y2="310" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#aso-test-ar)"/><line x1="50" y1="310" x2="50" y2="96" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#aso-test-ar)"/><line x1="50" y1="310" x2="50" y2="315" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="50" y="332" text-anchor="middle">0</text><line x1="90" y1="310" x2="90" y2="315" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="90" y="332" text-anchor="middle">1주</text><line x1="150" y1="310" x2="150" y2="315" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="150" y="332" text-anchor="middle">3주</text><line x1="230" y1="310" x2="230" y2="315" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="230" y="332" text-anchor="middle">6주</text><line x1="320" y1="310" x2="320" y2="315" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="320" y="332" text-anchor="middle">수개월</text><text x="200" y="354" text-anchor="middle">감염 후 경과 시간 (눈금 간격은 개략)</text><line x1="50" y1="270" x2="346" y2="270" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharr