<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enclosure-and-scale-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="enclosure-and-scale-t">같은 폭 D, 다른 높이 H: 위요감을 가늠하는 D/H</title><defs><marker id="enclosure-and-scale-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="enclosure-and-scale-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><line x1="20" y1="250" x2="500" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="50" y="190" width="30" height="60" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.25"/><rect x="224" y="190" width="30" height="60" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.25"/><line x1="88" y1="250" x2="88" y2="190" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#enclosure-and-scale-ar)" marker-start="url(#enclosure-and-scale-ar)"/><text x="96" y="224" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">H ≈ 10 m</text><line x1="80" y1="268" x2="224" y2="268" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.4" marker-end="url(#enclosure-and-scale-ar-1)" marker-start="url(#enclosure-and-scale-ar-1)"/><text x="152" y="288" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">D = 24 m</text><text x="152" y="312" text-anchor="middle" font-weight="700">D/H = 2.4</text><text x="152" y="36" text-anchor="middle">3층 건물이 둘러쌀 때</text><rect x="290" y="130" width="30" height="120" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.25"/><rect x="464" y="130" width="30" height="120" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.25"/><line x1="328" y1="250" x2="328" y2="130" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#enclosure-and-scale-ar)" marker-start="url(#enclosure-and-scale-ar)"/><text x="336" y="194" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">H ≈ 20 m</text><line x1="320" y1="268" x2="464" y2="268" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.4" marker-end="url(#enclosure-and-scale-ar-1)" marker-start="url(#enclosure-and-scale-ar-1)"/><text x="392" y="288" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">D = 24 m</text><text x="392" y="312" text-anchor="middle" font-weight="700">D/H = 1.2</text><text x="392" y="36" text-anchor="middle">6층 건물이 둘러쌀 때</text></svg>
