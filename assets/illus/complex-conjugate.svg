<svg class="si si-illus" viewBox="0 0 520 372" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="complex-conjugate-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="complex-conjugate-t">복소평면에서 켤레복소수 1+2i와 1−2i</title><defs><marker id="complex-conjugate-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="complex-conjugate-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><line x1="128" y1="180" x2="416" y2="180" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#complex-conjugate-ar)"/><line x1="200" y1="326" x2="200" y2="6" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#complex-conjugate-ar)"/><text x="416" y="196" text-anchor="end" font-size="12">실수축</text><text x="208" y="15" font-size="12">허수축</text><line x1="260" y1="180" x2="260" y2="60" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/><line x1="260" y1="180" x2="260" y2="300" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/><line x1="200" y1="60" x2="260" y2="60" style="stroke:currentColor;fill:none" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5"/><line x1="200" y1="300" x2="260" y2="300" style="stroke:currentColor;fill:none" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5"/><line x1="200" y1="180" x2="260" y2="60" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2" marker-end="url(#complex-conjugate-ar-1)"/><line x1="200" y1="180" x2="260" y2="300" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2" marker-end="url(#complex-conjugate-ar-1)"/><circle cx="260" cy="60" r="4.5" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="260" cy="300" r="4.5" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="270" y="56" font-size="12">z = 1 + 2i</text><text x="270" y="310" font-size="12">z̄ = 1 − 2i</text><text x="194" y="64" text-anchor="end" font-size="12">2</text><text x="194" y="304" text-anchor="end" font-size="12">−2</text><text x="254" y="196" text-anchor="middle" font-size="12">1</text><text x="260" y="358" text-anchor="middle" font-size="15" font-weight="700">z z̄ = 1² + 2² = 5 = |z|²</text></svg>
