<svg class="si si-illus" viewBox="0 0 360 604" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="의인성: 의료 행위가 원인이며 과실과는 별개" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="iatrogenic-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="14" y="24" font-weight="700">의료 행위가 원인인 해로운 사건</text><rect x="14" y="40" width="332" height="130" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="130" y="84" text-anchor="middle" font-size="15" font-weight="700">전체 입원 100%</text><rect x="284" y="112.1" width="40" height="39.9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.2"/><line x1="284" y1="112.1" x2="14" y2="232" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="324" y1="112.1" x2="346" y2="232" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="14" y="232" width="332" height="90" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.4" fill-opacity="0.45"/><text x="342" y="104.1" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">유해사례 3.7%</text><rect x="14" y="232" width="91.6" height="90" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2.4" fill-opacity="0.7"/><text x="59.8" y="272" text-anchor="middle" font-weight="700">과실</text><text x="62.3" y="294" text-anchor="middle" font-weight="700">27.6%</text><text x="225.8" y="272" text-anchor="middle" font-weight="700">과실 없음</text><text x="227.8" y="294" text-anchor="middle" font-weight="700">약 72.4%</text><text x="14" y="344" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">확대: 유해사례(의인성 손상) 3.7%</text><line x1="296" y1="362" x2="296" y2="326" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#iatrogenic-ar)"/><text x="346" y="384" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">과실이 없어도 의인성</text><line x1="14" y1="440" x2="346" y2="440" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="14" y="464" font-weight="700">예시 계산(가상)</text><rect x="14" y="476" width="332" height="52" rx="8" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2"/><text x="180" y="499" text-anchor="middle" font-size="15" font-weight="700">42 / 800 = 5.25%</text><text x="182" y="520" text-anchor="middle">800명 입원 기록 중 의인성 사건 42건</text><text x="14" y="560" style="fill:var(--si-general,#5c6b7f)">3.7%·27.6% 출처: Brennan 외, 1991</text><text x="16" y="582" style="fill:var(--si-general,#5c6b7f)">분류: ICD-10 의인성 합병증 Y40~Y84</text></svg>
