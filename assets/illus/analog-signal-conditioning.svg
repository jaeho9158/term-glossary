<svg class="si si-illus" viewBox="0 0 360 470" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="증폭 전후 열전대 신호가 ADC 입력 범위를 채우는 정도" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="analog-signal-conditioning-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="24" font-weight="700">신호 경로(예)</text><rect x="20" y="34" width="96" height="42" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="68" y="50" text-anchor="middle">열전대</text><text x="68" y="70" text-anchor="middle">100 °C</text><rect x="136" y="34" width="96" height="42" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="184" y="50" text-anchor="middle">계측 증폭기</text><text x="184" y="70" text-anchor="middle">×1000</text><rect x="252" y="34" width="96" height="42" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="300" y="50" text-anchor="middle">안티앨리어싱</text><text x="300" y="70" text-anchor="middle">LPF</text><rect x="20" y="114" width="96" height="42" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="68" y="140" text-anchor="middle">버퍼</text><rect x="136" y="114" width="96" height="42" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="184" y="140" text-anchor="middle">ADC</text><line x1="118" y1="55" x2="134" y2="55" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#analog-signal-conditioning-ar)"/><line x1="234" y1="55" x2="250" y2="55" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#analog-signal-conditioning-ar)"/><line x1="300" y1="78" x2="300" y2="96" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="300" y1="96" x2="68" y2="96" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="68" y1="96" x2="68" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#analog-signal-conditioning-ar)"/><line x1="118" y1="135" x2="134" y2="135" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#analog-signal-conditioning-ar)"/><text x="20" y="200" font-weight="700">① 증폭 없음</text><rect x="40" y="212" width="1.5" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="52" y="228">4.096 mV ≈ 3.4단계</text><text x="52" y="248" font-weight="700">분해능 약 29.8 °C</text><text x="20" y="288" font-weight="700">② 이득 1000배</text><rect x="40" y="300" width="229.6" height="22" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="48" y="316">4.096 V (범위의 82%)</text><text x="52" y="344" font-weight="700">분해능 약 0.030 °C</text><line x1="40" y1="376" x2="320" y2="376" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="40" y1="372" x2="40" y2="380" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="320" y1="372" x2="320" y2="380" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="40" y="398" text-anchor="middle">0 V</text><text x="320" y="398" text-anchor="middle">5 V</text><text x="180" y="398" text-anchor="middle">ADC 입력 범위</text><text x="20" y="430">12비트 ADC: 1단계 = 1.221 mV</text><text x="20" y="450">K형 열전대 100 °C ≈ 4.096 mV</text></svg>
