ight="700" style="fill:var(--si-rose-s,#c97b7b)">혈류↑ · 산소 농도 변화</text><path d="M20,360 C31.7,358.7 68.3,351.3 90,352 C111.7,352.7 130,364 150,364 C170,364 190,352 210,352 C230,352 248.3,363.3 270,364 C291.7,364.7 328.3,357.3 340,356" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><line x1="20" y1="404" x2="340" y2="404" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><text x="180" y="426" text-anchor="middle" font-weight="700">카메라로 얻은 뇌 표면 영상(위에서 본 모습)</text><ellipse cx="110" cy="490" rx="80" ry="44" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><ellipse cx="128" cy="486" rx="18" ry="14" style="stroke:none;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.55"/><text x="204" y="456">반사율이 달라진 부위</text><line x1="200" y1="452" x2="142" y2="484" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="142" cy="484" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="204" y="478">(어둡게 표시)</text><text x="204" y="508" font-weight="700" style="fill:var(--si-accent,#2454ff)">= 뇌 기능 지도</text><line x1="20" y1="550" x2="340" y2="550" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><text x="180" y="572" text-anchor="middle" font-weight="700">염료 · 유전자 조작 없이 반사율로 지도를 만든다</text><text x="180" y="594" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">혈류를 거친 간접 신호라 시간해상도가 느리다</text></svg>
