tColor;fill:none" stroke-width="2" stroke-dasharray="3 3"/><circle cx="252" cy="209" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><circle cx="284" cy="281" r="9" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><circle cx="220" cy="281" r="9" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><circle cx="218" cy="231" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><circle cx="252" cy="249" r="10" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="252" y="253" text-anchor="middle" font-weight="700">C</text><text x="252" y="315" text-anchor="middle" font-weight="700">(R)형</text><text x="10" y="338" style="fill:var(--si-general,#5c6b7f)">색 원: 서로 다른 네 원자단</text><text x="10" y="360" font-weight="700" style="fill:var(--si-accent,#2454ff)">실제 예: 이부프로펜의 COX-1 억제력</text><rect x="34" y="372" width="260" height="22" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="40" y="388" font-weight="700">(S) 100배 넘게 강함</text><rect x="34" y="404" width="2.6" height="22" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1"/><text x="44" y="420" style="fill:var(--si-general,#5c6b7f)">(R) 기준(1배, 막대는 실제 비율)</text><polyline points="18,472 30,450 42,472 18,472" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="30" y="469" text-anchor="middle" font-weight="700">!</text><text x="52" y="460">먼저 확인: 키랄 반전(체내에서</text><text x="52" y="480">한쪽이 다른 쪽으로 바뀜) 여부</text><text x="52" y="512">연결 시험(bridging study):</text><text x="52" y="532">라세미체와의 비교 자료</text><text x="10" y="566" style="fill:var(--si-general,#5c6b7f)">임상 이득은 사례마다 다르고</text><text x="10" y="586" style="fill:var(--si-general,#5c6b7f)">특허 연장 목적이 섞일 수 있다</text></svg>
