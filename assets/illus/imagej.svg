<svg class="si si-illus" viewBox="0 0 360 514" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ImageJ: 스케일 바, ROI, 배경을 뺀 형광(CTCF)" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="imagej-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><linearGradient id="imagej-g0" x1="0.2" y1="0.1" x2="0.8" y2="0.9"><stop offset="0" style="stop-color:#14532d"/><stop offset="1" style="stop-color:#4ade80"/></linearGradient></defs><rect x="20" y="20" width="320" height="240" style="stroke:var(--si-gray-s,#aab6c6);fill:#0b0f14" stroke-width="1.6"/><ellipse cx="165" cy="125" rx="60" ry="46" style="stroke:none;fill:url(#imagej-g0)" stroke-width="0"/><path d="M96,118 C96,104 101,92.7 110,84 C119,75.3 135.7,67.7 150,66 C164.3,64.3 183,67.7 196,74 C209,80.3 222.3,92.7 228,104 C233.7,115.3 234.7,130 230,142 C225.3,154 213.3,169 200,176 C186.7,183 165,185.3 150,184 C135,182.7 119,179 110,168 C101,157 96,132 96,118Z" style="stroke:#facc15;fill:none" stroke-width="2.2"/><rect x="255" y="42" width="70" height="50" style="stroke:#9ca3af;fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="34" y="46" font-weight="700" style="fill:#facc15">세포 ROI(관심 영역)</text><text x="36" y="66" style="fill:#facc15">2,400 px²</text><text x="290" y="112" text-anchor="middle" style="fill:#d1d5db">배경</text><text x="290" y="132" text-anchor="middle" style="fill:#d1d5db">평균 12.5</text><rect x="224" y="206" width="100" height="6" style="stroke:#ffffff;fill:#ffffff" stroke-width="0.5"/><text x="274" y="198" text-anchor="middle" style="fill:#ffffff">100 µm = 250 px</text><text x="274" y="236" text-anchor="middle" style="fill:#ffffff">1 px = 0.40 µm</text><text x="34" y="246" style="fill:#9ca3af">가상 예시</text><text x="20" y="292">IntDen(적분 밀도) = 면적 × 평균 회색값 = 128,000</text><text x="20" y="311.5">CTCF = IntDen − 면적 × 배경 평균</text><text x="20" y="331">= 128,000 − 2,400 × 12.5 = 98,000</text><rect x="20" y="392" width="60" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="80" y="392" width="196" height="26" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><line x1="20" y1="384" x2="276" y2="384" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#imagej-ar)" marker-start="url(#imagej-ar)"/><text x="148" y="376" text-anchor="middle">IntDen 128,000</text><text x="178" y="410" text-anchor="middle" font-weight="700">CTCF 98,000</text><text x="20" y="444">주황: 배경 몫 2,400 × 12.5 = 30,000</text><text x="20" y="463.5">초록: 실제 신호 CTCF</text><text x="20" y="483">배경을 빼야 실제 신호만 남는다</text></svg>
