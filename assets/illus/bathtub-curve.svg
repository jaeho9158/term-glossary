<svg class="si si-illus" viewBox="0 0 360 500" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bathtub-curve-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bathtub-curve-t">욕조곡선의 세 구간과 와이블 형상모수 k</title><defs><marker id="bathtub-curve-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">욕조곡선: 시간에 따른 고장률</text><text x="60" y="46">번인: 제품을 미리 가동·시험</text><path d="M56 62 v-5 H140 v5" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><path d="M56 70 H140 V250 H56" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" fill-opacity="0.4"/><path d="M140 70 H250 V250 H140" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6" fill-opacity="0.4"/><path d="M250 70 H340 V250 H250" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" fill-opacity="0.4"/><line x1="140" y1="70" x2="140" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="250" y1="70" x2="250" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="56" y1="250" x2="344" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#bathtub-curve-ar)"/><line x1="56" y1="250" x2="56" y2="66" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#bathtub-curve-ar)"/><path d="M58,88 C59.3,94.3 61.7,113.3 66,126 C70.3,138.7 76.7,153.7 84,164 C91.3,174.3 100.7,182.2 110,188 C119.3,193.8 130,196.8 140,199 C150,201.2 156.7,200.7 170,201 C183.3,201.3 206.7,201.3 220,201 C233.3,200.7 240.8,201.2 250,199 C259.2,196.8 266.7,194.5 275,188 C283.3,181.5 292.2,171 300,160 C307.8,149 315.7,133.7 322,122 C328.3,110.3 335.3,95.3 338,90" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><text x="8" y="96">고장률</text><text x="200" y="276" text-anchor="middle">시간 (달력 시간 또는 사용 시간)</text><text x="98" y="312" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">초기 고장기</text><text x="98" y="334" text-anchor="middle">고장률 감소</text><text x="98" y="354" text-anchor="middle">k &lt; 1</text><text x="98" y="374" text-anchor="middle">제조 결함,</text><text x="98" y="394" text-anchor="middle">운송 손상</text><text x="195" y="312" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">우발 고장기</text><text x="195" y="334" text-anchor="middle">고장률 일정</text><text x="195" y="354" text-anchor="middle">k = 1</text><text x="195" y="374" text-anchor="middle">(지수분포)</text><text x="195" y="394" text-anchor="middle">임의 고장</text><text x="297" y="312" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">마모 고장기</text><text x="297" y="334" text-anchor="middle">고장률 증가</text><text x="297" y="354" text-anchor="middle">k &gt; 1</text><text x="297" y="374" text-anchor="middle">마모, 노화</text><line x1="16" y1="424" x2="344" y2="424" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="446">모든 제품이 이 곡선을 따르지는 않는다.</text><text x="16" y="466">평균 고장 간격(MTBF)은 고장률이</text><text x="16" y="485">일정한 구간에서만 정확하다.</text></svg>
