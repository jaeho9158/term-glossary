" text-anchor="middle">취수정</text><path d="M196,225 C205,227.7 232.7,236 250,241 C267.3,246 287.3,252 300,255 C312.7,258 321.7,258.3 326,259" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" stroke-dasharray="5 4"/><line x1="270" y1="227" x2="270" y2="247" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#aquifer-recharge-ar-1)"/><text x="196" y="268" style="fill:var(--si-rose-t,#7d2626)">낮아진 수위</text><text x="20" y="377" font-weight="700">800 − 500 − 200 = 100 mm</text><text x="20" y="401" style="fill:var(--si-general,#5c6b7f)">(가상값, 저장량 변화는 무시)</text><text x="20" y="441">취수량이 함양량을 넘으면</text><text x="20" y="461">지하수면이 내려간다.</text><text x="20" y="501">건조·반건조 지역 평균 함양률:</text><text x="20" y="521">연 0.2~35 mm (Scanlon 등, 2006)</text></svg>
