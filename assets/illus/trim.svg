<svg class="si si-illus" viewBox="0 0 600 270" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="트림" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>옆에서 본 배. 수선 아래 선미 흘수가 6.5 m, 선수 흘수가 6.0 m여서 선미 쪽이 0.5 m 더 잠긴 선미 트림 상태다</desc><defs><marker id="trim-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="0" y="150" width="600" height="110" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.08"/><polygon points="90,80 520,86 500,210 110,215" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.25"/><line x1="20" y1="150" x2="580" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6"/><line x1="110" y1="150" x2="110" y2="215" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#trim-ar)"/><line x1="110" y1="215" x2="110" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#trim-ar)"/><line x1="500" y1="150" x2="500" y2="210" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#trim-ar)"/><line x1="500" y1="210" x2="500" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" marker-end="url(#trim-ar)"/><text x="100" y="70" text-anchor="middle">선미</text><text x="520" y="76" text-anchor="middle">선수</text><text x="560" y="142" text-anchor="end" font-size="12">수선</text><text x="102" y="188" text-anchor="end" font-size="12">선미 흘수 6.5 m</text><text x="510" y="186" font-size="12">선수 흘수 6.0 m</text><text x="300" y="250" text-anchor="middle">트림 = 6.5 m − 6.0 m = 0.5 m (선미 트림)</text></svg>
