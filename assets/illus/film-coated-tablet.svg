<svg class="si si-illus" viewBox="0 0 520 326" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="film-coated-tablet-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="film-coated-tablet-t">필름코팅정과 당의정의 단면 비교(두께는 상대 비교용)</title><defs></defs><text x="140" y="28" text-anchor="middle" font-size="14" font-weight="700">필름코팅정</text><text x="385" y="28" text-anchor="middle" font-size="14" font-weight="700">당의정</text><circle cx="140" cy="160" r="66" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><circle cx="140" cy="160" r="62" style="stroke:currentColor;fill:currentColor" stroke-width="1.4" fill-opacity="0.12"/><text x="140" y="164" text-anchor="middle">정제 핵</text><line x1="198" y1="112" x2="238" y2="84" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.55"/><text x="240" y="80" font-size="12">얇은 필름층</text><circle cx="385" cy="160" r="96" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="1.4" fill-opacity="0.14"/><circle cx="385" cy="160" r="86" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.5"/><circle cx="385" cy="160" r="76" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.5"/><circle cx="385" cy="160" r="66" style="stroke:currentColor;fill:currentColor" stroke-width="1.4" fill-opacity="0.12"/><text x="385" y="164" text-anchor="middle">정제 핵</text><line x1="385" y1="236" x2="385" y2="266" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.55"/><text x="385" y="280" text-anchor="middle" font-size="12">두꺼운 설탕층</text><text x="260" y="310" text-anchor="middle" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">정제 핵 크기는 같고 코팅층 두께만 상대 비교한 모식도</text></svg>
