<svg class="si si-illus" viewBox="0 0 600 290" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="semiconductor-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="semiconductor-t">반도체의 p-n 접합</title><desc>같은 결정 안에서 p형으로 도핑한 영역과 n형으로 도핑한 영역이 맞닿은 경계가 p-n 접합이다</desc><defs></defs><rect x="60" y="80" width="240" height="140" style="stroke:currentColor;fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><rect x="300" y="80" width="240" height="140" style="stroke:currentColor;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><line x1="300" y1="60" x2="300" y2="240" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" stroke-dasharray="5 4"/><text x="100" y="120" text-anchor="middle" font-size="16">+</text><text x="160" y="170" text-anchor="middle" font-size="16">+</text><text x="220" y="120" text-anchor="middle" font-size="16">+</text><text x="130" y="190" text-anchor="middle" font-size="16">+</text><text x="250" y="180" text-anchor="middle" font-size="16">+</text><text x="350" y="120" text-anchor="middle" font-size="16">−</text><text x="410" y="170" text-anchor="middle" font-size="16">−</text><text x="470" y="120" text-anchor="middle" font-size="16">−</text><text x="380" y="195" text-anchor="middle" font-size="16">−</text><text x="510" y="175" text-anchor="middle" font-size="16">−</text><text x="180" y="60" text-anchor="middle" font-size="12">p형 영역(정공 많음)</text><text x="420" y="60" text-anchor="middle" font-size="12">n형 영역(전자 많음)</text><text x="300" y="262" text-anchor="middle" font-size="12" font-weight="700">p-n 접합(경계)</text><line x1="300" y1="250" x2="300" y2="240" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
