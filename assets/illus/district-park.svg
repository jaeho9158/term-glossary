<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="district-park-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="district-park-t">이용권 반경 1 km: 직선거리 원과 격자 보행거리 마름모</title><defs><marker id="district-park-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><circle cx="150" cy="165" r="100" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2" fill-opacity="0.12"/><polygon points="250,165 150,65 50,165 150,265" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2" fill-opacity="0.25"/><line x1="150" y1="165" x2="250" y2="165" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#district-park-ar)"/><circle cx="150" cy="165" r="3.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="200" y="157" text-anchor="middle" font-size="12">1 km</text><text x="300" y="100" font-weight="700" style="fill:var(--si-accent,#2454ff)">직선거리 원: π × 1² ≈ 3.14 km²</text><text x="294" y="128" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">격자 1 km 마름모: 2 × 1² = 2.00 km²</text><text x="300" y="170">마름모 ÷ 원 = 2/π ≈ 64%</text><text x="300" y="198">원 ÷ 마름모 = π/2 ≈ 1.57배</text><text x="300" y="222" font-size="12" style="fill:var(--si-general,#5c6b7f)">(서비스 인구 약 57% 과대 추정)</text><text x="20" y="318" font-size="12" style="fill:var(--si-general,#5c6b7f)">정방형 격자 도로, 인구 균등 분포 가정의 가상 예</text></svg>
