<svg class="si si-illus" viewBox="0 0 540 330" style="max-width:540px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="최대·최소 정리와 열린 끝점 반례" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>왼쪽은 닫힌구간 위의 연속 곡선에서 최댓값 점 c와 최솟값 점 d가 반드시 있는 그림이고, 오른쪽은 열린 끝점 때문에 최댓값에 이르지 못하는 f(x)=1−x의 반례</desc><defs><marker id="extreme-value-theorem-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><text x="150" y="24" text-anchor="middle" font-size="12" font-weight="700">닫힌구간 [a, b]에서 연속</text><line x1="40" y1="260" x2="270" y2="260" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.3" marker-end="url(#extreme-value-theorem-ar)"/><line x1="40" y1="260" x2="40" y2="40" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.3" marker-end="url(#extreme-value-theorem-ar)"/><text x="70" y="282" text-anchor="middle" font-size="12" font-style="italic">a</text><text x="240" y="282" text-anchor="middle" font-size="12" font-style="italic">b</text><line x1="70" y1="260" x2="70" y2="252" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="240" y1="260" x2="240" y2="252" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><path d="M70,170 C75.8,161.7 95,131.7 105,120 C115,108.3 120.8,95 130,100 C139.2,105 149.2,129.2 160,150 C170.8,170.8 185,216.7 195,225 C205,233.3 212.5,212.5 220,200 C227.5,187.5 236.7,158.3 240,150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><circle cx="70" cy="170" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="240" cy="150" r="3.5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="130" cy="100" r="4.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="195" cy="225" r="4.5" style="stroke:none;fill:var(--si-green-s,#5b9b83)" stroke-width="1.6"/><line x1="40" y1="100" x2="130" y2="100" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="130" y1="100" x2="130" y2="260" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="40" y1="225" x2="195" y2="225" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="195" y1="225" x2="195" y2="260" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="130" y="282" text-anchor="middle" font-size="12" font-style="italic" style="fill:var(--si-rose-s,#c97b7b)">c</text><text x="187" y="282" text-anchor="middle" font-size="12" font-style="italic" style="fill:var(--si-green-s,#5b9b83)">d</text><text x="20" y="104" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">f(c)</text><text x="20" y="229" text-anchor="middle" font-size="12" style="fill:var(--si-green-s,#5b9b83)">f(d)</text><text x="150" y="310" text-anchor="middle" font-size="12">최댓값 f(c), 최솟값 f(d)</text><text x="400" y="24" text-anchor="middle" font-size="12" font-weight="700">(0, 1]에서 f(x) = 1 − x</text><line x1="320" y1="260" x2="500" y2="260" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.3" marker-end="url(#extreme-value-theorem-ar)"/><line x1="320" y1="260" x2="320" y2="40" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.3" marker-end="url(#extreme-value-theorem-ar)"/><line x1="320" y1="70" x2="440" y2="250" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><circle cx="320" cy="70" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><circle cx="440" cy="250" r="4.5" style="stroke:none;fill:var(--si-green-s,#5b9b83)" stroke-width="1.6"/><line x1="320" y1="70" x2="440" y2="70" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4"/><text x="440" y="282" text-anchor="middle" font-size="12">1</text><text x="310" y="74" text-anchor="end" font-size="12">1</text><text x="320" y="282" text-anchor="middle" font-size="12">0</text><text x="450" y="74" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">끝점 0 제외</text><text x="410" y="310" text-anchor="middle" font-size="12">최솟값 0은 있지만 최댓값은 없다</text></svg>
