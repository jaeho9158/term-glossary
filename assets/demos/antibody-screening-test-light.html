<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>항체선별검사 실험</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.iso{--as-serum:#e9c46a;--as-rbc:#e5484d;--as-rbc-hi:#ff8a8f;--as-ab:#ffd166;--as-saline:#5aa9ff;--as-ahg:#3fd68a;--as-heat:#ff8a3d;--as-susp-a:.62}
.iso[data-theme="light"]{--as-serum:#d9a520;--as-rbc:#c4161c;--as-rbc-hi:#7a0b10;--as-ab:#b07d00;--as-saline:#1f6fd1;--as-ahg:#13894f;--as-heat:#e0601a;--as-susp-a:.7}
.iso-stage{position:relative}
.as-liq{fill:var(--liqc,var(--as-rbc));fill-opacity:var(--as-susp-a)}
.as-liqtop{fill:var(--liqc,var(--as-rbc));fill-opacity:calc(var(--as-susp-a) + .15)}
.as-rbc{fill:var(--as-rbc);stroke:var(--as-rbc-hi);stroke-width:.35}
.as-rbc.coat{stroke:var(--as-ab);stroke-width:.8}
.as-heat{fill:var(--as-heat);opacity:0;transition:opacity .8s}
.on .as-heat{opacity:.45}
.as-lamp{fill:var(--anatomy-lo)}.on .as-lamp{fill:var(--as-heat)}
.as-ahgband{fill:var(--as-ahg);opacity:.85}
.as-drop{fill:currentColor}
.as-digits{fill:var(--anatomy-lit);font-family:ui-monospace,Consolas,monospace}
.as-chip,.as-tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.as-chip{display:flex;align-items:baseline;gap:5px;padding:1px 8px;border-radius:8px;background:var(--anatomy-card);border:1px solid var(--anatomy-lo);color:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.as-chip small{font-size:13px;color:var(--anatomy-text)}.as-chip b{font:600 15px/1.35 ui-monospace,Consolas,monospace}
.as-chip.pos{border-color:var(--as-rbc);color:var(--as-rbc-hi)}.as-chip.chk{border-color:var(--as-ahg);color:var(--as-ahg)}
.as-tag{font-size:13px;color:var(--anatomy-text);white-space:nowrap}
.as-start{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);white-space:nowrap;font:inherit;font-size:14px;min-height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--as-heat);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer}
.as-start[hidden]{display:none}
.iso-plate-corner[data-corner="readout"]{font-size:14px;color:var(--anatomy-strong)}
.as-controls{padding:4px 16px 8px;display:grid;gap:8px}
.as-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.as-lab{font-size:14px;color:var(--anatomy-text);margin-right:4px}
.as-controls button{font:inherit;font-size:14px;min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--anatomy-lo);background:var(--anatomy-face);color:var(--anatomy-strong);cursor:pointer;touch-action:manipulation}
.as-controls button[aria-pressed="true"]{border-color:var(--as-ab);color:var(--as-ab)}
.as-controls .as-next{border-color:var(--as-heat)}
.as-controls button:disabled{opacity:.4;cursor:default}
.as-controls button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.as-steps{display:flex;flex-wrap:wrap;gap:4px 6px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--anatomy-text);counter-reset:s}
.as-steps li{counter-increment:s;padding:2px 8px;border-radius:10px;border:1px solid var(--anatomy-faint)}
.as-steps li::before{content:counter(s) ". "}
.as-steps li.now{border-color:var(--as-heat);color:var(--anatomy-strong)}.as-steps li.done{opacity:.6}
.as-gramwrap{padding:0 16px 8px}
.as-gram{border-collapse:collapse;margin:0 auto;font-size:14px;color:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.as-gram caption{font-size:13px;color:var(--anatomy-text);padding-bottom:4px}
.as-gram th,.as-gram td{padding:3px 6px;text-align:center;border-bottom:1px solid var(--anatomy-faint)}
.as-gram th{font-weight:500;color:var(--anatomy-text)}
.as-gram .out{opacity:.35;text-decoration:line-through}
.as-gram td.pos{color:var(--as-rbc-hi);font-weight:600}
.as-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:14px;color:var(--anatomy-text);padding:4px 16px 40px}
.as-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;box-sizing:border-box}

const N = 30, NS = "http://www.w3.org/2000/svg";
let rnd = 7; const rand = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;
const tubes = TUBES.map(([x, y], i) => {
  const g = q("cells" + i), dots = [];
  for (let j = 0; j < N; j++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", "1.9"); c.setAttribute("class", "as-rbc"); g.appendChild(c); dots.push({ el: c, s: [rand(), rand(), rand()], p: null, from: null }); }
  return { x, y, dots };
});
const R = TR - 3;
const disperse = (t) => t.dots.map((d) => { const a = d.s[0] * 6.283, r = R * Math.sqrt(d.s[1]); return [t.x + r * Math.cos(a), t.y + r * Math.sin(a), LIQ_Z + 2 + d.s[2] * (LIQ_H - 4)]; });
const button = (t) => t.dots.map((d) => { const a = d.s[0] * 6.283, r = 4.5 * Math.sqrt(d.s[1]); return [t.x + r * Math.cos(a), t.y + r * Math.sin(a), LIQ_Z + 1.2 + d.s[2] * 2.2]; });
// grade -> number of clumps: 4+ one big clump ... 1+ many small ones
function clumps(t, g) {
  const n = { 4: 1, 3: 2, 2: 4, 1: 7 }[g], cs = [];
  for (let c = 0; c < n; c++) { const a = c * 2.4 + 0.5, r = n === 1 ? 0 : R * 0.6; cs.push([t.x + r * Math.cos(a), t.y + r * Math.sin(a), LIQ_Z + 3 + ((c * 37) % 10) * (LIQ_H - 8) / 10]); }
  return t.dots.map((d, j) => { const c = cs[j % n], a = d.s[0] * 6.283, rr = (1.8 + 3.2 / n) * Math.sqrt(d.s[1]); return [c[0] + rr * Math.cos(a), c[1] + rr * Math.sin(a), c[2] + (d.s[2] - 0.5) * 2.4]; });
}
function place(t, pts) { t.dots.forEach((d, j) => { d.p = pts[j]; const s = iso(pts[j], P); d.el.setAttribute("cx", s[0].toFixed(1)); d.el.setAttribute("cy", s[1].toFixed(1)); }); }
const ease = (u) => u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;

let abId = "K", step = 0, queue = [], cur = null, frame = 0, last = 0, visible = true;
function setLiq(i, clear) { const v = clear ? "var(--as-serum)" : "var(--as-rbc)"; q("liq" + i).style.setProperty("--liqc", v); q("top" + i).style.setProperty("--liqc", v); }
// timeline of {d seconds, f(u)}; rAF runs only while busy and on screen
function run(list) { queue.push(...list); kick(); }
function kick() { if (!frame && visible && (cur || queue.length)) { last = 0; frame = requestAnimationFrame(tick); } }
function tick(now) {
  frame = 0;
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60; last = now;
  if (!cur && queue.length) cur = { ...queue.shift(), t: 0 };
  if (cur) { cur.t += dt * (window.__speed || 1); const u = cur.d ? Math.min(cur.t / cur.d, 1) : 1; cur.f(u, cur); if (u >= 1) cur = null; }
  kick();
}
function moveTo(targets, d = 0.8) {
  return { d, f: (u, st) => {
    if (!st.init) { st.init = 1; tubes.forEach((t) => t.dots.forEach((dd) => (dd.from = dd.p))); }
    const e = ease(u); tubes.forEach((t, i) => { if (targets[i]) place(t, t.dots.map((dd, j) => dd.from.map((v, n) => v + (targets[i][j][n] - v) * e))); });
  } };
}
function dropsOf(color, which = [0, 1, 2], d = 0.5) {
  return { d, f: (u) => tubes.forEach((t, i) => { const el = q("drop" + i); if (!which.includes(i)) { el.style.opacity = 0; return; } const z = TOPZ - (TOPZ - LIQ_Z - LIQ_H) * u * u, s = iso([t.x, t.y, z], P); el.setAttribute("cx", s[0].toFixed(1)); el.setAttribute("cy", s[1].toFixed(1)); el.style.color = color; el.style.opacity = u < 1 ? 1 : 0; }) };
}
function flush() { const all = (cur ? [cur] : []).concat(queue); cur = null; queue = []; for (const a of all) a.f(1, a.init ? a : { ...a }); }
const call = (fn) => ({ d: 0, f: fn });
const coat = () => tubes.forEach((t, i) => t.dots.forEach((d) => d.el.classList.toggle("coat", isCoated(abId, i, step))));

function draw() {
  const s = STEPS[step], it = interpret(abId);
  let text = (step + 1) + "/6 " + s.label;
  if (step === 4) text = "5/6 " + (it.pos ? "양성 " + it.read.map(gradeText).join("/") + " · 남은 후보 " + it.left.map((a) => a.replace("Fya", "Fyᵃ").replace("Jka", "Jkᵃ")).join(", ") : "음성 0/0/0 · 확인세포로 확인해요");
  if (step === 5) text = "6/6 " + (it.pos ? "양성 " + it.read.map(gradeText).join("/") + " · 음성 관 확인세포 " + CHECK_GRADE + "+" : "음성 · 확인세포 " + CHECK_GRADE + "+라 유효해요");
  readout.textContent = text;
  document.querySelectorAll(".as-steps li").forEach((li, i) => { li.className = i === step ? "now" : i < step ? "done" : ""; });
  const nb = $('[data-act="next"]'); nb.textContent = step < 5 ? "다음: " + STEPS[step + 1].short : "끝났어요"; nb.disabled = step >= 5;
  tubes.forEach((t, i) => {
    const g = tubeGrade(abId, i, step);
    q("grade" + i).textContent = step >= 4 ? gradeText(g) : "·";
    q("chip" + i).className = "as-chip" + (step >= 4 && g ? (it.read[i] ? " pos" : " chk") : "");
    q("res" + i).textContent = step >= 4 ? gradeText(it.read[i]) : "·";
    q("res" + i).className = step >= 4 && it.read[i] ? "pos" : "";
  });
  document.querySelectorAll(".as-gram [data-ag]").forEach((c) => c.classList.toggle("out", step >= 4 && it.pos && it.ruledOut.includes(c.dataset.ag)));
  q("temp").textContent = step === 1 ? "37.0" : "25.0";
  svgEl.classList.toggle("on", step === 1);
  stage.setAttribute("aria-label", "항체선별검사. 혈청 속 항체 " + ANTIBODIES.find((a) => a.id === abId).label + ". " + text);
}

function next() {
  if (step >= 5) return;
  flush(); // a press during an animation finishes it at once instead of being ignored
  step++; draw(); coat();
  const fast = still.matches;
  if (step === 1) { if (!fast) run([{ d: 1.6, f: (u) => { readout.textContent = "2/6 37 °C 배양 · " + Math.round(u * INCUBATE_MIN) + "분 / " + INCUBATE_MIN + "분"; } }, call(draw)]); }
  else if (step === 2) {
    if (fast) return;
    const list = [];
    for (let w = 0; w < WASHES; w++) list.push(call(() => { readout.textContent = "3/6 세척 " + (w + 1) + "/" + WASHES; }), dropsOf("var(--as-saline)"), moveTo(tubes.map(button), 0.45), moveTo(tubes.map(disperse), 0.45));
    run([...list, call(draw)]);
  } else if (step === 3) { if (!fast) run([dropsOf("var(--as-ahg)", [0, 1, 2], 0.6)]); }
  else if (step === 4) {
    const tg = tubes.map((t, i) => { const g = tubeGrade(abId, i, 4); return g ? clumps(t, g) : disperse(t); });
    const clear = () => tubes.forEach((t, i) => setLiq(i, tubeGrade(abId, i, 4) > 0));
    if (fast) { tubes.forEach((t, i) => place(t, tg[i])); clear(); return; }
    run([call(() => { readout.textContent = "5/6 원심 중"; }), moveTo(tubes.map(button), 0.6), call(clear), moveTo(tg, 0.9), call(draw)]);
  } else if (step === 5) {
    const neg = [0, 1, 2].filter((i) => tubeGrade(abId, i, 4) === 0);
    const tg = tubes.map((t, i) => (neg.includes(i) ? clumps(t, CHECK_GRADE) : null));
    const clear = () => neg.forEach((i) => setLiq(i, true));
    if (fast) { neg.forEach((i) => place(tubes[i], tg[i])); clear(); return; }
    run([dropsOf("var(--as-rbc)", neg, 0.6), moveTo(tg, 0.9), call(clear)]);
  }
}
function reset() {
  queue = []; cur = null; step = 0;
  tubes.forEach((t, i) => { place(t, disperse(t)); setLiq(i, false); q("drop" + i).style.opacity = 0; });
  coat(); draw();
}
function pick(id) { abId = id; document.querySelectorAll("[data-ab]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.ab === id))); reset(); }

// Idle tour: walk all six steps with anti-K, hold, return to the start, repeat. Any press or key stops it for good
// and returns the bench to step 1 so the reader starts clean.
let touched = false, tour = 0;
function tourStep() {
  if (touched) return;
  if (step < 5) { startBtn.hidden = true; next(); tour = setTimeout(tourStep, step === 2 ? 4000 : 2300); }
  else tour = setTimeout(() => { if (touched) return; reset(); startBtn.hidden = false; tour = setTimeout(tourStep, 2400); }, 3200);
}
function takeOver() { if (touched) return; touched = true; clearTimeout(tour); startBtn.hidden = true; if (step > 0) reset(); }
for (const ev of ["pointerdown", "keydown"]) fig.addEventListener(ev, takeOver, true);
new IntersectionObserver((es) => { visible = es[0].isIntersecting; if (visible) kick(); else if (frame) { cancelAnimationFrame(frame); frame = 0; } }).observe(stage);

startBtn.onclick = () => next();
$('[data-act="next"]').onclick = () => next();
$('[data-act="reset"]').onclick = reset;
document.querySelectorAll("[data-ab]").forEach((b) => (b.onclick = () => pick(b.dataset.ab)));
reset();
if (!still.matches && !/[?&]notour/.test(location.search)) tour = setTimeout(tourStep, 1400);
</script></body></html>
