<svg class="si si-illus" viewBox="0 0 560 300" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="euler-polyhedron-formula-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="euler-polyhedron-formula-t">정육면체의 정점·모서리·면과 오일러 다면체 공식</title><defs></defs><line x1="140" y1="120" x2="240" y2="120" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="240" y1="120" x2="240" y2="220" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="240" y1="220" x2="140" y2="220" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="140" y1="220" x2="140" y2="120" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="190" y1="80" x2="290" y2="80" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="290" y1="80" x2="290" y2="180" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="140" y1="120" x2="190" y2="80" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="240" y1="120" x2="290" y2="80" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="240" y1="220" x2="290" y2="180" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="290" y1="180" x2="190" y2="180" style="stroke:currentColor;fill:none" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.7"/><line x1="190" y1="180" x2="190" y2="80" style="stroke:currentColor;fill:none" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.7"/><line x1="140" y1="220" x2="190" y2="180" style="stroke:currentColor;fill:none" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.7"/><circle cx="140" cy="120" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="240" cy="120" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="240" cy="220" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="140" cy="220" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="190" cy="80" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="290" cy="80" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="290" cy="180" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="190" cy="180" r="4.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="330" y="70" font-weight="700" style="fill:var(--si-accent,#2454ff)">정점 V = 8</text><text x="330" y="96" font-weight="700">모서리 E = 12</text><text x="330" y="122" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">면 F = 6</text><text x="330" y="160">V − E + F</text><text x="330" y="184" font-weight="700">= 8 − 12 + 6 = 2</text><text x="330" y="226" style="fill:var(--si-general,#5c6b7f)">정사면체: 4 − 6 + 4 = 2</text><text x="330" y="248" style="fill:var(--si-general,#5c6b7f)">정팔면체: 6 − 12 + 8 = 2</text><text x="184" y="262" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">●: 정점  /  실선·점선: 모서리  /  여섯 개의 사각형: 면</text></svg>
