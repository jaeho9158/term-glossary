<svg class="si si-illus" viewBox="0 0 360 708" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eustatic-sea-level-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="eustatic-sea-level-t">유스타시 해수면: 고정된 지형과 변하는 수위</title><defs><marker id="eustatic-sea-level-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="eustatic-sea-level-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker></defs><line x1="150" y1="190" x2="198" y2="199.7" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="180" y="20" text-anchor="middle" font-weight="700">유스타시: 지형은 고정, 수위만 변한다</text><polygon points="10,100 60,128 95,158 130,182 165,198 185,250 205,340 350,362 350,380 10,380" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.4"/><polygon points="85.7,150 350,150 350,362 205,340 185,250 165,198 130,182 95,158" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0" fill-opacity="0.12"/><path d="M85.7,150 C87.3,151.3 87.6,152.7 95,158 C102.4,163.3 118.3,175.3 130,182 C141.7,188.7 155.8,186.7 165,198 C174.2,209.3 180.3,235.1 185,250 C189.7,264.9 191.9,281.3 193.3,287.5" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="6"/><rect x="74" y="140.1" width="276" height="9.9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0" fill-opacity="0.2"/><line x1="85.7" y1="150" x2="350" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><line x1="193.3" y1="287.5" x2="350" y2="287.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" stroke-dasharray="6 4"/><text x="312" y="132.1" text-anchor="end" style="fill:var(--si-blue-s,#7f9ac0)">간빙기 +6~9 m</text><text x="312" y="170" text-anchor="end" font-weight="700">현재 0 m</text><text x="312" y="307.5" text-anchor="end" style="fill:var(--si-blue-s,#7f9ac0)">빙하기(LGM)</text><text x="312" y="327.5" text-anchor="end" style="fill:var(--si-blue-s,#7f9ac0)">약 −120~134 m</text><text x="200" y="214" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">노출된 대륙붕</text><text x="20" y="84">육지</text><line x1="332" y1="154" x2="332" y2="283.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#eustatic-sea-level-ar)" marker-start="url(#eustatic-sea-level-ar)"/><rect x="10" y="404" width="340" height="144" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="18" y="426" font-weight="700">상대 해수면 변화와 대비</text><rect x="24" y="470" width="76" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.4"/><line x1="62" y1="466" x2="62" y2="444" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2.4" marker-end="url(#eustatic-sea-level-ar-1)"/><text x="76" y="458" style="fill:var(--si-limit,#7d2626)">융기</text><line x1="100" y1="478" x2="166" y2="478" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><line x1="140" y1="458" x2="140" y2="498" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#eustatic-sea-level-ar)" marker-start="url(#eustatic-sea-level-ar)"/><rect x="210" y="490" width="76" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.4"/><line x1="248" y1="448" x2="248" y2="486" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2.4" marker-end="url(#eustatic-sea-level-ar-1)"/><text x="256" y="466" style="fill:var(--si-limit,#7d2626)">침강</text><line x1="286" y1="478" x2="346" y2="478" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><line x1="316" y1="458" x2="316" y2="498" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#eustatic-sea-level-ar)" marker-start="url(#eustatic-sea-level-ar)"/><text x="180" y="540" text-anchor="middle" style="fill:var(--si-blue-s,#7f9ac0)">유스타시: 두 해안 모두 수위 변화 폭이 같다</text><text x="180" y="576" text-anchor="middle">빙하성: 수만 년 주기, 100 m 이상</text><text x="180" y="598" text-anchor="middle">구조성: 수백만 년 이상 주기, 수백 m</text><text x="180" y="620" text-anchor="middle">LGM 추가 빙하 부피 약 50×10<tspan dy="-0.435em" font-size="92%">6</tspan><tspan dy="0.4em"> km</tspan><tspan dy="-0.435em" font-size="92%">3</tspan></text><text x="180" y="642" text-anchor="middle">열적 팽창은 현대 해수면 상승의 약 40%</text><text x="180" y="670" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">지각평형·중력 효과로 지역마다 다르므로</text><text x="180" y="692" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">전 지구 평균 해수면(GMSL)이라 부른다</text></svg>
