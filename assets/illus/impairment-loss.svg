<svg class="si si-illus" viewBox="0 0 360 702" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="손상차손: 장부금액이 회수가능액을 넘는 만큼 비용으로 인식하고 배분한다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="impairment-loss-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="10" y="22" font-weight="700">① 손상차손 측정</text><rect x="20" y="130" width="45" height="100" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="85" y="100" width="45" height="130" style="stroke:var(--si-pos,#14543c);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.5"/><rect x="85" y="80" width="45" height="20" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="230" y="40" width="55" height="190" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="230" y="40" width="55" height="60" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.55"/><line x1="130" y1="100" x2="228" y2="100" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="10" y1="230" x2="350" y2="230" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="42" y="252" text-anchor="middle">순공정가치</text><text x="107" y="252" text-anchor="middle">사용가치</text><text x="257" y="252" text-anchor="middle">장부금액</text><text x="160" y="62" font-weight="700" style="fill:var(--si-pos,#14543c)">회수가능액</text><text x="160" y="82" font-weight="700" style="fill:var(--si-pos,#14543c)">= 큰 쪽</text><text x="292" y="76" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">손상차손</text><text x="10" y="282">회수가능액 = max(순공정가치, 사용가치)</text><text x="10" y="302">손상차손 = 장부금액 − 회수가능액</text><text x="10" y="326" style="fill:var(--si-rose-s,#c97b7b)">→ 당기비용으로 인식</text><text x="10" y="360" style="fill:var(--si-general,#5c6b7f)">점선 띠: 사용가치는 현금흐름 예측·</text><text x="10" y="380" style="fill:var(--si-general,#5c6b7f)">할인율에 따라 변동 → 경영자 재량</text><text x="10" y="420" font-weight="700">② 현금창출단위 배분</text><rect x="30" y="490" width="90" height="120" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="30" y="450" width="90" height="40" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.5"/><text x="75" y="474" text-anchor="middle">영업권</text><text x="75" y="554" text-anchor="middle">나머지 자산</text><text x="75" y="632" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">배분 전</text><rect x="200" y="510" width="90" height="100" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="245" y="564" text-anchor="middle">나머지 자산</text><rect x="200" y="450" width="90" height="60" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" stroke-dasharray="4 3" fill-opacity="0.25"/><text x="245" y="484" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">손상차손</text><text x="245" y="632" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">배분 후</text><line x1="128" y1="520" x2="192" y2="520" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#impairment-loss-ar)"/><text x="10" y="664" style="fill:var(--si-general,#5c6b7f)">영업권을 먼저 지우고, 남은 금액은</text><text x="10" y="684" style="fill:var(--si-general,#5c6b7f)">나머지 자산에 장부금액 비례로 배분한다</text></svg>
