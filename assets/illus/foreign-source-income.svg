<svg class="si si-illus" viewBox="0 0 360 436" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="국외원천소득: 외국납부세액공제 한도" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><clipPath id="foreign-source-income-clip0"><polygon points="340,250 356,250 356,280 340,280"/></clipPath></defs><text x="20" y="22" font-weight="700">전체 소득 1,000</text><text x="340" y="44" text-anchor="end" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">국외원천 200 (20%)</text><rect x="20" y="52" width="256" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="276" y="52" width="64" height="30" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.75"/><text x="148" y="72" text-anchor="middle">국내원천 800</text><line x1="276" y1="82" x2="276" y2="152" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="340" y1="82" x2="340" y2="152" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" stroke-dasharray="4 3"/><text x="20" y="142" font-weight="700">국내 산출세액 200 (세율 20%)</text><rect x="20" y="152" width="256" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="276" y="152" width="64" height="30" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.75"/><text x="148" y="172" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">160</text><text x="308" y="172" text-anchor="middle" font-weight="700">한도 40</text><line x1="276" y1="182" x2="276" y2="250" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="340" y1="182" x2="340" y2="250" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" stroke-dasharray="4 3"/><text x="20" y="240" font-weight="700">외국납부세액 50</text><rect x="276" y="250" width="64" height="30" style="stroke:currentColor;fill:var(--si-pos,#14543c)" stroke-width="1.4" fill-opacity="0.6"/><rect x="340" y="250" width="16" height="30" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1.4" fill-opacity="0.2"/><text x="308" y="270" text-anchor="middle" font-weight="700">공제 40</text><path d="M318.3,265L348,235.3M321.1,267.8L350.8,238.1M324,270.7L353.7,241M326.8,273.5L356.5,243.8M329.6,276.3L359.3,246.6M332.4,279.1L362.1,249.4M335.3,282L365,252.3M338.1,284.8L367.8,255.1M340.9,287.6L370.6,257.9M343.8,290.5L373.5,260.8M346.6,293.3L376.3,263.6" clip-path="url(#foreign-source-income-clip0)" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1"/><polygon points="340,250 356,250 356,280 340,280" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.4"/><text x="356" y="304" text-anchor="end" font-weight="700" style="fill:var(--si-limit,#7d2626)">미공제 10</text><text x="20" y="346" font-weight="700">공제 한도 = 국내 산출세액 × (국외원천 ÷ 전체)</text><text x="20" y="368" font-weight="700" style="fill:var(--si-accent,#2454ff)">= 200 × (200 ÷ 1,000) = 40</text><text x="20" y="398">외국납부 50 중 40만 공제, 10은 그해 공제 못함</text><text x="20" y="420" style="fill:var(--si-general,#5c6b7f)">(가상의 예시 수치)</text></svg>
