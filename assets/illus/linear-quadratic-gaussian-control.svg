<svg class="si si-illus" viewBox="0 0 360 536" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="linear-quadratic-gaussian-control-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="linear-quadratic-gaussian-control-t">선형이차가우시안 제어: 플랜트, 칼만 필터, 상태 되먹임의 블록선도</title><defs><marker id="linear-quadratic-gaussian-control-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="linear-quadratic-gaussian-control-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="28" y="64" width="150" height="56" rx="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="103" y="86" text-anchor="middle" font-weight="700">플랜트</text><text x="103" y="108" text-anchor="middle">dx/dt = Ax + Bu + w</text><line x1="103" y1="22" x2="103" y2="64" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#linear-quadratic-gaussian-control-ar)"/><text x="112" y="40" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">w 공정잡음</text><line x1="178" y1="92" x2="226" y2="92" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#linear-quadratic-gaussian-control-ar-1)"/><circle cx="240" cy="92" r="13" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><line x1="232" y1="92" x2="248" y2="92" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="240" y1="84" x2="240" y2="100" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="240" y1="40" x2="240" y2="79" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#linear-quadratic-gaussian-control-ar)"/><text x="250" y="50" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">v 측정잡음</text><text x="214" y="78" text-anchor="middle">+</text><line x1="253" y1="92" x2="344" y2="92" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="298" y="84" text-anchor="middle" font-weight="700" font-style="italic">y</text><line x1="344" y1="92" x2="344" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="344" y1="232" x2="318" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#linear-quadratic-gaussian-control-ar-1)"/><rect x="144" y="188" width="174" height="88" rx="4" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="231" y="212" text-anchor="middle" font-weight="700">칼만 필터</text><text x="231" y="232" text-anchor="middle">dx̂/dt = Ax̂ + Bu</text><text x="231" y="252" text-anchor="middle">+ L(y − Cx̂)</text><rect x="36" y="200" width="64" height="54" rx="4" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="68" y="232" text-anchor="middle" font-size="16" font-weight="700">−K</text><line x1="144" y1="227" x2="100" y2="227" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#linear-quadratic-gaussian-control-ar-1)"/><text x="127" y="218" text-anchor="middle" font-weight="700" font-style="italic">x̂</text><line x1="68" y1="200" x2="68" y2="160" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="68" y1="160" x2="68" y2="120" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="68" y1="160" x2="68" y2="122" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#linear-quadratic-gaussian-control-ar-1)"/><text x="54" y="146" text-anchor="end" font-weight="700" font-style="italic">u</text><circle cx="68" cy="160" r="3.5" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><line x1="68" y1="160" x2="231" y2="160" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="231" y1="160" x2="231" y2="188" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#linear-quadratic-gaussian-control-ar-1)"/><rect x="24" y="176" width="94" height="104" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="136" y="172" width="198" height="110" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="67" y="302" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">제어기 (K)</text><text x="230" y="302" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">추정기 (L)</text><text x="180" y="334" text-anchor="middle" font-weight="700">분리 원리: 독립 설계</text><text x="180" y="364" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">w, v: 가우시안 백색잡음 가정</text><rect x="16" y="386" width="328" height="100" rx="6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2" fill-opacity="0.5"/><text x="28" y="410" font-weight="700">예: dx/dt = x + u + w, y = x + v</text><text x="28" y="430">Q = R = W = V = 1</text><text x="28" y="450">K = L = 1 + √2 ≈ 2.414</text><text x="28" y="470">폐루프 고유값 −√2 ≈ −1.414</text><text x="16" y="522" style="fill:var(--si-general,#5c6b7f)">강인성은 자동으로 보장되지 않는다.</text></svg>
