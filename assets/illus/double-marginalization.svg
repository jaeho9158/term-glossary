alization-ar-1)" marker-start="url(#double-marginalization-ar-1)"/><line x1="326" y1="185" x2="326" y2="131.5" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" marker-end="url(#double-marginalization-ar-2)" marker-start="url(#double-marginalization-ar-2)"/><g class="si-marker"><circle cx="304" cy="212" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="304" y="216" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">1</text></g><g class="si-marker"><circle cx="304" cy="158.3" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="304" y="162.3" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">2</text></g><g class="si-marker"><circle cx="153" cy="223" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="153" y="227" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text></g><text x="10" y="326">① 제조사 마진 = 도매가 w − 원가 c</text><text x="10" y="350">② 유통사 마진 = 소매가 P − 도매가 w</text><text x="10" y="374" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">③ 채널 전체 이익 감소분</text><line x1="10" y1="390" x2="350" y2="390" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="10" y="414" font-weight="700">마진이 단계마다 붙어 가격 ↑ · 판매량 ↓ · 총이익 ↓</text><text x="10" y="438" style="fill:var(--si-general,#5c6b7f)">해소: 수직통합·이부가격제·수익공유 계약</text></svg>
