<svg class="si si-illus" viewBox="0 0 600 390" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contrapposto-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="contrapposto-t">콘트라포스토의 선</title><desc>체중을 한쪽 다리에 실으면 그쪽 골반이 올라가고 같은 쪽 어깨는 내려가, 어깨선과 골반선이 서로 반대로 기운다</desc><defs></defs><line x1="280" y1="40" x2="280" y2="350" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="5 4"/><circle cx="285" cy="72" r="22" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="235" y1="128" x2="335" y2="108" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><line x1="248" y1="198" x2="318" y2="214" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="285" y1="94" x2="285" y2="116" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="240" y1="128" x2="252" y2="198" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="330" y1="110" x2="314" y2="212" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="252" y1="198" x2="258" y2="336" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="312" y1="214" x2="326" y2="276" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="326" y1="276" x2="322" y2="336" style="stroke:currentColor;fill:none" stroke-width="2.4"/><text x="380" y="100" font-size="12">어깨선: 이쪽이 올라감</text><line x1="378" y1="104" x2="336" y2="108" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="150" y="138" text-anchor="end" font-size="12">어깨선: 이쪽이 내려감</text><line x1="152" y1="134" x2="234" y2="128" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="150" y="192" text-anchor="end" font-size="12">골반: 이쪽이 올라감</text><line x1="152" y1="190" x2="246" y2="198" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="380" y="222" font-size="12">골반: 이쪽이 내려감</text><line x1="378" y1="220" x2="320" y2="214" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="150" y="300" text-anchor="end" font-size="12">지지하는 다리(곧음)</text><line x1="152" y1="298" x2="255" y2="290" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="380" y="290" font-size="12">자유로운 다리(무릎이 굽음)</text><line x1="378" y1="288" x2="326" y2="276" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="296" y="368" font-size="12">몸의 중심선</text></svg>
