<svg class="si si-illus" viewBox="0 0 360 472" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bagging-technique-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bagging-technique-t">배깅 기법: 겉면끼리 맞대어 박은 뒤 뒤집으면 봉제선이 안쪽에 숨는다</title><defs><marker id="bagging-technique-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="10" y="24" font-weight="700">① 겉면끼리 마주 보게 포개기</text><line x1="40" y1="62" x2="250" y2="62" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><line x1="40" y1="70" x2="250" y2="70" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" opacity="0.55"/><line x1="40" y1="98" x2="250" y2="98" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="5"/><line x1="40" y1="90" x2="250" y2="90" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" opacity="0.55"/><text x="262" y="66" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">겉감</text><text x="262" y="102" font-weight="700" style="fill:var(--si-general,#5c6b7f)">안감</text><text x="10" y="128" style="fill:var(--si-general,#5c6b7f)">연한 선 = 겉면 쪽. 둘이 안쪽에서 마주 본다</text><text x="10" y="170" font-weight="700">② 가장자리를 시접 남기고 박기</text><line x1="40" y1="196" x2="270" y2="196" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><line x1="40" y1="204" x2="250" y2="204" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" opacity="0.55"/><line x1="40" y1="232" x2="270" y2="232" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="5"/><line x1="40" y1="224" x2="250" y2="224" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" opacity="0.55"/><line x1="250" y1="188" x2="250" y2="240" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6" stroke-dasharray="5 3"/><text x="268" y="166">박음선</text><line x1="268" y1="166" x2="252" y2="206" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="252" cy="206" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="274" y="262" font-weight="700" style="fill:var(--si-general,#5c6b7f)">시접</text><line x1="284" y1="248" x2="270" y2="236" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#bagging-technique-ar)"/><text x="10" y="262" style="fill:var(--si-general,#5c6b7f)">모서리 시접은 자르거나 노치</text><text x="10" y="316" font-weight="700">③ 뒤집기</text><line x1="40" y1="350" x2="220" y2="350" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><line x1="40" y1="342" x2="220" y2="342" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" opacity="0.55"/><line x1="40" y1="394" x2="220" y2="394" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="5"/><line x1="40" y1="402" x2="220" y2="402" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" opacity="0.55"/><path d="M 220 350 C 256 350 256 394 220 394" style="stroke:currentColor;fill:none" stroke-width="5"/><circle cx="230" cy="372" r="12" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="238" y1="366" x2="226" y2="366" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><line x1="238" y1="378" x2="226" y2="378" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><text x="212" y="377" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">박음선·시접 (안쪽에 숨음)</text><text x="262" y="366">겉면이</text><text x="262" y="386">바깥으로</text><text x="10" y="452" font-weight="700">적용: 옷깃·소맷단·가방 안감</text></svg>
