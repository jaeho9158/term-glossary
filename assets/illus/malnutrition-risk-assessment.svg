<svg class="si si-illus" viewBox="0 0 360 476" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="영양불량위험사정: 선별에서 재평가까지" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="malnutrition-risk-assessment-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">영양불량위험사정의 흐름</text><polygon points="20,40 280,40 256,86 44,86" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8" fill-opacity="1"/><text x="150" y="68" text-anchor="middle" font-weight="700">1 영양선별</text><polygon points="44,94 256,94 232,140 68,140" style="stroke:currentColor;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8" fill-opacity="1"/><text x="150" y="122" text-anchor="middle" font-weight="700">2 위험사정</text><polygon points="68,148 232,148 208,194 92,194" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.8" fill-opacity="0.35"/><text x="150" y="176" text-anchor="middle" font-weight="700">3 정밀평가·협진</text><polygon points="92,202 208,202 184,248 116,248" style="stroke:currentColor;fill:var(--si-green-s,#5b9b83)" stroke-width="1.8" fill-opacity="0.35"/><text x="150" y="230" text-anchor="middle" font-weight="700">4 영양 중재</text><path d="M150,252 C153.3,254.7 146.7,265 170,268 C193.3,271 264,281.3 290,270 C316,258.7 320,226.7 326,200 C332,173.3 330.3,133.3 326,110 C321.7,86.7 307,69.2 300,60 C293,50.8 286.7,55.8 284,55" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.4" marker-end="url(#malnutrition-risk-assessment-ar)"/><text x="322" y="290" text-anchor="end" style="fill:var(--si-violet-s,#9382bd)">5 주기적 재평가</text><text x="322" y="310" text-anchor="end" style="fill:var(--si-violet-s,#9382bd)">입원 기간 중 반복</text><t