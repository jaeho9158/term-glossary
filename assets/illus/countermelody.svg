<svg class="si si-illus" viewBox="0 0 360 566" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="countermelody-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="countermelody-t">대선율은 주선율과 다른 윤곽을 가진다</title><defs></defs><rect x="24" y="34" width="312" height="108" rx="4" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="24" y="26" font-weight="700">① 대선율</text><polyline points="40,110 80,90 120,100 160,80 200,94 240,74 280,90 320,106" style="stroke:currentColor;fill:none" stroke-width="3.2"/><polyline points="40,122 100,122 120,62 210,62 230,114 320,114" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><rect x="24" y="196" width="312" height="108" rx="4" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="24" y="188" font-weight="700">② 병행 화성화</text><polyline points="40,272 80,252 120,262 160,242 200,256 240,236 280,252 320,268" style="stroke:currentColor;fill:none" stroke-width="3.2"/><polyline points="40,294 80,274 120,284 160,264 200,278 240,258 280,274 320,290" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.6"/><rect x="24" y="358" width="312" height="108" rx="4" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="24" y="350" font-weight="700">③ 화음 채움</text><polyline points="40,434 80,414 120,424 160,404 200,418 240,398 280,414 320,430" style="stroke:currentColor;fill:none" stroke-width="3.2"/><rect x="36" y="440" width="60" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1" fill-opacity="0.55"/><rect x="112" y="440" width="60" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1" fill-opacity="0.55"/><rect x="188" y="440" width="60" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1" fill-opacity="0.55"/><rect x="264" y="440" width="60" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1" fill-opacity="0.55"/><text x="110" y="26">굵은 선: 주선율 · 파란 선: 대선율</text><text x="30" y="164" font-weight="700" style="fill:var(--si-limit,#7d2626)">독립된 윤곽과 리듬</text><text x="30" y="326" style="fill:var(--si-general,#5c6b7f)">3도/6도 병행 — 윤곽 동일</text><text x="30" y="488" style="fill:var(--si-violet-s,#9382bd)">화성만 채움, 선율 없음</text><text x="180" y="522" text-anchor="middle" font-weight="700">대선율 = 주선율과 동시에, 자기 윤곽을 가진 부차 선율</text><text x="180" y="546" text-anchor="middle">예: 〈The Stars and Stripes Forever〉 (1896)</text></svg>
