<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rain-gauge-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="rain-gauge-t">표준 우량계와 전도형 우량계</title><desc>왼쪽은 깔때기로 받은 비를 눈금 실린더에 모으고 넘친 물을 바깥 용기에 받는 표준 우량계 단면, 오른쪽은 깔때기 아래 시소 모양 버킷이 정해진 양이 차면 기울며 신호를 보내는 전도형 우량계 모식도</desc><defs></defs><rect x="70" y="110" width="130" height="170" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.08"/><polygon points="70,60 200,60 142,105 128,105" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.2"/><rect x="110" y="112" width="50" height="160" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><rect x="111" y="200" width="48" height="71" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.3"/><line x1="110" y1="130" x2="120" y2="130" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1"/><line x1="110" y1="150" x2="120" y2="150" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1"/><line x1="110" y1="170" x2="120" y2="170" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1"/><line x1="110" y1="190" x2="120" y2="190" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1"/><line x1="110" y1="210" x2="120" y2="210" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1"/><line x1="110" y1="230" x2="120" y2="230" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1"/><line x1="110" y1="250" x2="120" y2="250" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1"/><text x="40" y="30" font-size="12">깔때기</text><line x1="40" y1="30" x2="100" y2="70" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="100" cy="70" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="250" y="140" font-size="12">눈금 실린더</text><line x1="250" y1="140" x2="160" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="160" cy="150" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="250" y="250" font-size="12">바깥 용기</text><line x1="250" y1="250" x2="200" y2="260" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="200" cy="260" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><polygon points="330,60 450,60 395,105 385,105" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.2"/><polygon points="330,170 450,200 450,186 440,183 340,158 330,155" style="stroke:var(--si-navy,#12305c);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.35"/><line x1="390" y1="180" x2="390" y2="235" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6"/><circle cx="390" cy="180" r="4" style="stroke:var(--si-navy,#12305c);fill:var(--si-navy,#12305c)" stroke-width="1.6"/><rect x="360" y="235" width="60" height="18" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.25"/><line x1="420" y1="244" x2="490" y2="244" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><text x="490" y="268" text-anchor="end" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">신호</text><text x="470" y="130" font-size="12">전도 버킷</text><line x1="470" y1="130" x2="440" y2="185" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="440" cy="185" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="390" y="290" text-anchor="middle" font-size="11">기록 장치</text><text x="135" y="300" text-anchor="middle" f