<svg class="illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--text,#1f2328)" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="이면각: 두 평면이 교선을 따라 이루는 각" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title>이면각: 두 평면이 교선을 따라 이루는 각</title><defs><marker id="dihedral-angle-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs><polygon points="100,275 400,195 347.5,54 47.5,134" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/><polygon points="100,275 400,195 535,127.5 235,207.5" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.2"/><line x1="100" y1="275" x2="400" y2="195" stroke="currentColor" stroke-width="2.4"/><line x1="250" y1="235" x2="211.5" y2="131.6" style="stroke:var(--accent,#2454ff)" stroke-width="2.4"/><line x1="250" y1="235" x2="349" y2="185.5" style="stroke:var(--accent,#2454ff)" stroke-width="2.4"/><path d="M236,197.5 A40,40 0 0 1 285.8,217.1" fill="none" style="stroke:var(--accent,#2454ff)" stroke-width="1.6"/><text x="272" y="184.2" text-anchor="middle" font-weight="700" font-size="16">φ</text><text x="88" y="192.2" >평면 1</text><text x="444" y="187" >평면 2</text><text x="394" y="232" text-anchor="end">교선(모서리)</text><text x="246" y="270" text-anchor="end" font-size="12">교선 위의 한 점</text><circle cx="250" cy="235" r="3.5" fill="currentColor"/><text x="20" y="318" font-size="13" style="fill:var(--muted,#57606a)">cos φ = n<tspan baseline-shift="sub" font-size="72%">1</tspan>·n<tspan baseline-shift="sub" font-size="72%">2</tspan> / (|n<tspan baseline-shift="sub" font-size="72%">1</tspan>| |n<tspan baseline-shift="sub" font-size="72%">2</tspan>|)</text></svg>