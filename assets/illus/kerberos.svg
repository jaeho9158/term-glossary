weight="700">3</text><rect x="130" y="95" width="44" height="22" rx="4" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="152" y="111" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">TGT</text><rect x="130" y="166" width="44" height="22" rx="4" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="152" y="182" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">TGT</text><rect x="106" y="257" width="88" height="22" rx="4" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="150" y="273" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">서비스 티켓</text><text x="8" y="296">네트워크에는</text><text x="8" y="314">비밀번호가</text><text x="8" y="332" font-weight="700" style="fill:var(--si-limit,#7d2626)">오가지 않음</text><line x1="4" y1="346" x2="356" y2="346" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="8" y="368">1 AS에서 신원을 확인받고 TGT를 받는다</text><text x="8" y="390">2 TGT를 TGS에 내고 서비스 티켓을 받는다</text><text x="8" y="412">3 서비스 티켓으로 서비스에 접근한다</text><text x="8" y="438" font-weight="700">모든 티켓에 시간 표식이 있어 시계 동기화가 필요하다</text></svg>
