<svg class="si si-illus" viewBox="0 0 360 456" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="압축도시와 휘발유 소비: 도시권별 1인당 소비 배율과 밀도의 반비례 경향" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="compact-city-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="26" font-size="14" font-weight="700">1인당 휘발유 소비(아시아 도시 = 1)</text><text x="6" y="65" font-weight="700">미국</text><rect x="62" y="46" width="240" height="28" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="310" y="65" font-size="14" font-weight="700">10</text><text x="6" y="111" font-weight="700">호주</text><rect x="62" y="92" width="120" height="28" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="190" y="111" font-size="14" font-weight="700">5</text><text x="6" y="157" font-weight="700">유럽</text><rect x="62" y="138" width="60" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="130" y="157" font-size="14" font-weight="700">2.5</text><text x="6" y="203" font-weight="700">아시아</text><rect x="62" y="184" width="24" height="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="94" y="203" font-size="14" font-weight="700">1</text><text x="20" y="248" font-weight="700">미국 ≈ 호주 × 2 ≈ 유럽 × 4 ≈ 아시아 × 10</text><text x="20" y="270">(Newman &amp; Kenworthy, 1989: 세계 32개 도시)</text><text x="20" y="294" style="fill:var(--si-gray-t,#44546a)">가격·소득·차량 효율은 격차의 절반만 설명</text><line x1="40" y1="410" x2="40" y2="330" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#compact-city-ar)"/><line x1="40" y1="410" x2="170" y2="410" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#compact-city-ar)"/><path d="M48,342 C51.3,347.7 59.3,367.7 68,376 C76.7,384.3 86,388 100,392 C114,396 143.3,398.7 152,400" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><text x="34" y="318" font-weight="700">1인당 연료</text><text x="170" y="432" text-anchor="end" font-weight="700">도시 밀도</text><text x="196" y="366">밀도가 높을수록</text><text x="196" y="386">1인당 연료 소비가</text><text x="196" y="406">낮아지는 반비례 경향</text><text x="196" y="430" style="fill:var(--si-gray-t,#44546a)">(도시 간 비교 자료)</text></svg>
