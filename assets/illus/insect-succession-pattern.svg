<svg class="si si-illus" viewBox="0 0 360 446" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="insect-succession-pattern-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="insect-succession-pattern-t">법곤충학 천이 막대도표: 출현 종 조합으로 시점 좁히기</title><defs><marker id="insect-succession-pattern-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">곤충 천이: 종별 출현 구간</text><rect x="60" y="40" width="90" height="26" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="105" y="58" text-anchor="middle">팽창</text><rect x="150" y="40" width="100" height="26" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2"/><text x="200" y="58" text-anchor="middle">활성 부패</text><rect x="250" y="40" width="90" height="26" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="295" y="58" text-anchor="middle">건조</text><line x1="60" y1="74" x2="60" y2="262" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><text x="60" y="284" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">시신 노출</text><text x="130" y="108" font-weight="700">파리류 (검정파리·쉬파리)</text><rect x="62" y="118" width="193" height="28" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="227" y="164" font-weight="700">딱정벌레류 등</text><rect x="215" y="172" width="123" height="28" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8" opacity="0.4"/><line x1="120" y1="74" x2="120" y2="214" style="stroke:currentColor;fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="120" y="230" text-anchor="middle" font-weight="700">조사 시점(예)</text><text x="120" y="252" text-anchor="middle">파리류만 출현</text><line x1="215" y1="208" x2="255" y2="208" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><line x1="215" y1="204" x2="215" y2="212" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><line x1="255" y1="204" x2="255" y2="212" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><text x="262" y="230" text-anchor="middle">두 무리가 겹치는 구간</text><line x1="160" y1="310" x2="300" y2="310" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#insect-succession-pattern-ar)" marker-start="url(#insect-succession-pattern-ar)"/><text x="230" y="332" text-anchor="middle">막대는 지역·계절·매장에 따라 이동</text><rect x="14" y="352" width="332" height="56" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="180" y="376" text-anchor="middle" font-weight="700">출현·미출현 종 조합</text><text x="180" y="398" text-anchor="middle" font-weight="700">→ 사후경과시간 구간 추정</text><text x="180" y="432" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">그림은 개념 모식이며 시간 눈금은 없다</text></svg>
