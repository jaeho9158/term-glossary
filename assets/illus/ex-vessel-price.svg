<svg class="si si-illus" viewBox="0 0 360 632" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ex-vessel-price-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ex-vessel-price-t">위판가격과 어획금액: 어획량과 가격의 면적</title><defs><marker id="ex-vessel-price-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">어획금액 = 어획량 × 가격</text><text x="14" y="56" font-weight="700">생산자가격</text><line x1="60" y1="300" x2="60" y2="74" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#ex-vessel-price-ar)"/><line x1="60" y1="300" x2="320" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#ex-vessel-price-ar)"/><rect x="60" y="110" width="220" height="190" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="2" fill-opacity="0.14"/><rect x="260" y="110" width="20" height="190" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0" fill-opacity="0.45"/><rect x="60" y="100" width="200" height="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0" fill-opacity="0.55"/><rect x="60" y="100" width="200" height="200" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.2"/><text x="160" y="210" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">기준 1.00 × 1.00</text><text x="270" y="214" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">+</text><line x1="260" y1="300" x2="260" y2="305" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="280" y1="300" x2="280" y2="305" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="236" y="320" text-anchor="middle">1.00</text><text x="290" y="320" text-anchor="middle">1.10</text><text x="14" y="104">1.00</text><text x="286" y="108">0.95</text><line x1="54" y1="100" x2="60" y2="100" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="180" y="346" text-anchor="middle" font-weight="700">어획량  (+10%)</text><rect x="14" y="372" width="16" height="12" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0" fill-opacity="0.55"/><text x="38" y="383">가격 5% 하락으로 잃은 면적 (−)</text><rect x="14" y="398" width="16" height="12" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0" fill-opacity="0.45"/><text x="38" y="409">어획량 10% 증가로 얻은 면적 (+)</text><text x="14" y="446" font-weight="700">가격신축성 −0.5이면</text><text x="14" y="468">어획량 +10% → 가격 약 −5%</text><text x="14" y="496" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">1.10 × 0.95 = 1.045배 (약 +4.5%)</text><text x="180" y="540" text-anchor="middle" font-weight="700">소비자가격 = 생산자가격 + 유통마진</text><rect x="14" y="554" width="170" height="34" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="99" y="577" text-anchor="middle">생산자가격</text><rect x="184" y="554" width="162" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="265" y="577" text-anchor="middle">유통마진</text><text x="99" y="612" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">어업인이 받는 가격</text></svg>
