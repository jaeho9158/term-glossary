r" stroke-width="0"/><text x="170" y="66" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">3</text><circle cx="220" cy="80" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="220" y="66" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">4</text><line x1="220" y1="86" x2="280" y2="182" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3" marker-end="url(#lamport-timestamp-ar-1)"/><text x="246" y="102" font-weight="700" style="fill:var(--si-accent,#2454ff)">보낸 값 4</text><circle cx="70" cy="190" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="70" y="176" text-anchor="middle" font-weight="700">1</text><circle cx="280" cy="190" r="7" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="0"/><text x="280" y="220" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">5</text><text x="280" y="240" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">max(1, 4)+1</text><circle cx="330" cy="190" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="330" y="176" text-anchor="middle" font-weight="700">6</text><circle cx="70" cy="300" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="70" y="286" text-anchor="middle" font-weight="700">1</text><circle cx="170" cy="300" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><text x="170" y="286" text-anchor="middle" font-weight="700">2</text><line x1="170" y1="88" x2="170" y2="276" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.6" stroke-dasharray="4 4"/><text x="162" y="226" text-anchor="end" style="fill:var(--si-limit,#7d2626)">2&lt;3이어도</text><text x="162" y="246" text-anchor="end" style="fill:var(--si-limit,#7d2626)">인과 없음(동시)</text><text x="14" y="358">규칙: 사건마다 +1, 수신 시 max(자기, 받은 값)+1</text><text x="14" y="378" style="fill:var(--si-general,#5c6b7f)">같은 값은 노드 ID로