<svg class="si si-illus" viewBox="0 0 360 490" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="구축효과: 민간 투자가 줄어 정부지출의 소득 증가 효과가 상쇄된다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="crowding-out-effect-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="14" y="22" font-weight="700">정부지출 +100, 승수 2 (가상 단순 예)</text><text x="14" y="44" style="fill:var(--si-general,#5c6b7f)">소득 증가</text><line x1="44" y1="58" x2="44" y2="340" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="44" y1="340" x2="346" y2="340" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="60" y="140" width="70" height="200" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="95" y="132" text-anchor="middle" font-weight="700">200</text><rect x="160" y="220" width="70" height="120" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><rect x="160" y="140" width="70" height="80" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6" stroke-dasharray="5 3"/><text x="195" y="284" text-anchor="middle" font-weight="700">120</text><text x="195" y="172" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">구축분 80</text><text x="195" y="192" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">(40%)</text><line x1="260" y1="340" x2="330" y2="340" style="stroke:currentColor;fill:none" stroke-width="2.4" stroke-dasharray="4 3"/><text x="295" y="332" text-anchor="middle" font-weight="700">0</text><text x="95" y="362" text-anchor="middle" font-weight="700">구축 없음</text><text x="95" y="384" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">+100</text><text x="195" y="362" text-anchor="middle" font-weight="700">부분 구축</text><text x="195" y="384" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">100−40=60</text><text x="295" y="362" text-anchor="middle" font-weight="700">완전 구축</text><text x="295" y="384" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">상쇄되어 0</text><text x="240" y="130" style="fill:var(--si-rose-s,#c97b7b)">금리 상승 →</text><text x="240" y="150" style="fill:var(--si-rose-s,#c97b7b)">민간 투자 −40</text><text x="240" y="170" style="fill:var(--si-rose-s,#c97b7b)">(−40 × 승수 2)</text><line x1="262" y1="180" x2="234" y2="200" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#crowding-out-effect-ar)"/><text x="14" y="420" style="fill:var(--si-general,#5c6b7f)">막대 아래 숫자는 순수요로,</text><text x="14" y="440" style="fill:var(--si-general,#5c6b7f)">정부지출 100 − 민간 투자 감소이다.</text><text x="14" y="472" style="fill:var(--si-general,#5c6b7f)">유동성 함정·불황에서는 구축이 약함</text></svg>
