<svg class="si si-illus" viewBox="0 0 360 722" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ammeter-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ammeter-t">전류계: 직렬 연결, 부하 효과, 병렬 션트</title><defs><marker id="ammeter-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.3" markerHeight="6.3" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker><marker id="ammeter-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker><marker id="ammeter-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker><marker id="ammeter-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker><marker id="ammeter-ar-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">측정: 전류계를 측정 가지에 직렬로</text><polyline points="40,70 140,70" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="140,70 145,62 155,78 165,62 175,78 185,62 195,78 205,62 215,78 220,70" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="220,70 320,70 320,114" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="320,146 320,190 40,190 40,138" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="40,122 40,70" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="26" y1="122" x2="54" y2="122" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="32" y1="138" x2="48" y2="138" style="stroke:currentColor;fill:none" stroke-width="3"/><circle cx="320" cy="130" r="16" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.4"/><text x="320" y="135" text-anchor="middle" font-weight="700">A</text><text x="60" y="134" font-weight="700">1 V</text><text x="180" y="52" text-anchor="middle">부하 1 Ω</text><text x="262" y="134" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">전류계</text><line x1="60" y1="70" x2="96" y2="70" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4" marker-end="url(#ammeter-ar)"/><line x1="320" y1="152" x2="320" y2="176" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4" marker-end="url(#ammeter-ar)"/><line x1="200" y1="190" x2="164" y2="190" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4" marker-end="url(#ammeter-ar)"/><text x="180" y="224" text-anchor="middle" font-weight="700">전류  1.000 A → 0.9524 A (약 −4.8%)</text><text x="180" y="246" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">계기 저항 약 0.05 Ω 탓에 전류가 줄어듦(부하 효과)</text><line x1="20" y1="264" x2="340" y2="264" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="180" y="290" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">잘못: 부하와 병렬로 연결</text><polyline points="50,330 50,360 310,360 310,330" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2.2"/><polyline points="50,330 140,330" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="140,330 145,323 155,337 165,323 175,337 185,323 195,337 205,323 215,337 220,330" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="220,330 310,330" style="stroke:currentColor;fill:none" stroke-width="2.2"/><circle cx="180" cy="360" r="15" style="stroke:var(--si-limit,#7d2626);fill:var(--si-bg,#ffffff)" stroke-width="2.4"/><text x="180" y="365" text-anchor="middle" font-weight="700">A</text><line x1="66" y1="360" x2="150" y2="360" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="5" marker-end="url(#ammeter-ar-1)"/><text x="180" y="396" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">저항이 거의 없는 지름길: 거의 단락 → 손상</text><line x1="20" y1="414" x2="340" y2="414" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="180" y="440" text-anchor="middle" font-size="14" font-weight="700">계기 내부: 코일과 션트를 병렬로</text><polyline points="24,532 90,532" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="90,532 90,492 140,492" style="stroke:currentColor;fill:none" stroke-width="2.2"/><rect x="140" y="480" width="80" height="24" rx="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><polyline points="220,492 270,492 270,532" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="90,532 90,572 140,572" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="140,572 145,565 155,579 165,565 175,579 185,565 195,579 205,565 215,579 220,572" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="220,572 270,572 270,532" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polyline points="270,532 336,532" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="40" y1="522" x2="76" y2="522" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2" marker-end="url(#ammeter-ar-2)"/><text x="17.6" y="514" font-style="italic">I</text><text x="31.1" y="514">= 1 A</text><line x1="98" y1="492" x2="128" y2="492" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4" marker-end="url(#ammeter-ar-3)"/><line x1="96" y1="572" x2="132" y2="572" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="4" marker-end="url(#ammeter-ar-4)"/><text x="180" y="466" text-anchor="middle">코일에 0.001 A</text><text x="180" y="524" text-anchor="middle">코일 R<tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em"> = 50 Ω</tspan></text><text x="180" y="544" text-anchor="middle">풀스케일 I<tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em"> = 1 mA</tspan></text><text x="180" y="604" text-anchor="middle">션트 R<tspan dy="0.217em" font-size="92%">sh</tspan><tspan dy="-0.2em">에 0.999 A</tspan></text><text x="180" y="644" text-anchor="middle" font-weight="700">R<tspan dy="0.217em" font-size="92%">sh</tspan><tspan dy="-0.2em"> = I</tspan><tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em">·R</tspan><tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em"> ÷ (I − I</tspan><tspan dy="0.217em" font-size="92%">m</tspan><tspan dy="-0.2em">)</tspan></text><text x="180" y="664" text-anchor="middle" font-weight="700">= 0.001×50 ÷ 0.999 ≈ 0.05005 Ω</text><text x="180" y="700" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">션트 값은 정확도와 부하 효과의 절충</text></svg>
