acity="0.8"/><line x1="380" y1="148" x2="388" y2="220" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1" opacity="0.8"/><line x1="440" y1="148" x2="448" y2="220" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1" opacity="0.8"/><rect x="40" y="220" width="430" height="8" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1" fill-opacity="0.55"/><rect x="40" y="228" width="430" height="52" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.12"/><text x="500" y="52" font-size="12">두개골</text><line x1="496" y1="48" x2="468" y2="60" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="77" font-size="12">경막</text><line x1="496" y1="73" x2="468" y2="90" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="102" font-size="12">정맥동</text><line x1="496" y1="98" x2="444" y2="98" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="127" font-size="12">거미막과립</text><line x1="496" y1="123" x2="415" y2="112" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="152" font-size="12">경막밑공간</text><line x1="496" y1="148" x2="468" y2="133" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="177" font-size="12">거미막</text><line x1="496" y1="173" x2="468" y2="142" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="202" font-size="12">소주</text><line x1="496" y1="198" x2="444" y2="170" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="227" font-size="12">거미막밑공간(뇌척수액)</text><line x1="496" y1="223" x2="468" y2="198" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="500" y="252" font-size="12">연막</text><line