<svg class="si si-illus" viewBox="0 0 360 454" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="double-marginalization-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="double-marginalization-t">이중마진: 마진이 두 번 붙어 가격은 오르고 판매량은 준다</title><defs><marker id="double-marginalization-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="double-marginalization-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="double-marginalization-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><text x="10" y="20" font-weight="700" style="fill:var(--si-accent,#2454ff)">순서: 제조사가 w 결정 → 유통사가 P 결정</text><line x1="50" y1="272" x2="50" y2="52" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#double-marginalization-ar)"/><line x1="50" y1="272" x2="346" y2="272" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#double-marginalization-ar)"/><text x="4" y="46" font-weight="700">P</text><text x="310" y="296" font-weight="700">Q</text><line x1="50" y1="72" x2="330" y2="252" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><text x="334" y="256" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">D</text><line x1="50" y1="72" x2="190" y2="252" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.6"/><text x="196" y="256" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">MR</text><line x1="50" y1="237" x2="346" y2="237" style="stroke:var(--si-gray-s,#aab6c6);fill:no