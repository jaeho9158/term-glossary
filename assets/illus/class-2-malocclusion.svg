<svg class="si si-illus" viewBox="0 0 600 290" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="앵글 1급과 2급 대구치 관계" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>위 제1대구치의 근심협측 교두와 아래 제1대구치의 협측 홈이 맞물리면 1급, 아래 대구치가 상대적으로 뒤에 있어 위 교두가 홈보다 앞에 놓이면 2급이다</desc><defs><marker id="class-2-malocclusion-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><rect x="100" y="90" width="140" height="46" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.15"/><rect x="100" y="140" width="140" height="46" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.15"/><polygon points="128,136 140,148 152,136" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2"/><line x1="140" y1="140" x2="140" y2="186" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="4 3"/><rect x="370" y="90" width="140" height="46" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.15"/><rect x="410" y="140" width="140" height="46" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.15"/><polygon points="398,136 410,148 422,136" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2"/><line x1="450" y1="140" x2="450" y2="186" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="4 3"/><text x="170" y="60" text-anchor="middle" font-size="14">1급(정상 관계)</text><text x="440" y="60" text-anchor="middle" font-size="14">2급</text><text x="170" y="214" text-anchor="middle" font-size="12">위 교두가 아래 홈에 맞물림</text><text x="440" y="214" text-anchor="middle" font-size="12">위 교두가 아래 홈보다 앞에 놓임</text><text x="92" y="113" text-anchor="end" font-size="12">위 제1대구치</text><text x="92" y="163" text-anchor="end" font-size="12">아래 제1대구치</text><line x1="560" y1="250" x2="480" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" marker-end="url(#class-2-malocclusion-ar)"/><text x="520" y="272" text-anchor="middle" font-size="12">앞(입 쪽)</text></svg>
