<svg class="si si-illus" viewBox="0 0 360 576" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PF 대주단: 순위별 회수 순서·위험과 금리, 주선·대리은행의 역할" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="lender-syndicate-pf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">프로젝트 현금흐름</text><polygon points="186,32 186,66 197,66 175,84 153,66 164,66 164,32" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.5"/><rect x="120" y="90" width="110" height="70" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.55"/><text x="175" y="130" text-anchor="middle" font-size="15" font-weight="700">선순위</text><rect x="120" y="160" width="110" height="60" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.32"/><text x="175" y="195" text-anchor="middle" font-size="15" font-weight="700">중순위</text><rect x="120" y="220" width="110" height="60" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.12"/><text x="175" y="255" text-anchor="middle" font-size="15" font-weight="700">후순위</text><text x="4" y="130" font-weight="700">① 먼저 회수</text><text x="4" y="195" font-weight="700">② 그다음</text><text x="4" y="255" font-weight="700">③ 나중에 회수</text><line x1="250" y1="94" x2="250" y2="276" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#lender-syndicate-pf-ar)"/><text x="260" y="106">위험 낮음</text><text x="260" y="126">금리 낮음</text><text x="260" y="252">위험 높음</text><text x="260" y="272">금리 높음</text><text x="120" y="304" style="fill:var(--si-gray-t,#44546a)">금리 = 기준금리 + 가산금리</text><text x="180" y="336" text-anchor="middle" font-size="14" font-weight="700">대주단 구성과 창구</text><rect x="10" y="350" width="72" height="48" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="46" y="379" text-anchor="middle" font-weight="700">차주</text><rect x="144" y="350" width="82" height="48" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="185" y="371" text-anchor="middle" font-weight="700">대리은행</text><text x="185" y="389" text-anchor="middle">(agent)</text><rect x="268" y="350" width="82" height="48" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="309" y="371" text-anchor="middle" font-weight="700">대주단</text><text x="309" y="389" text-anchor="middle">(참여 대주)</text><line x1="84" y1="374" x2="142" y2="374" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#lender-syndicate-pf-ar)" marker-start="url(#lender-syndicate-pf-ar)"/><line x1="228" y1="374" x2="266" y2="374" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#lender-syndicate-pf-ar)" marker-start="url(#lender-syndicate-pf-ar)"/><text x="20" y="428">주선(lead arranger): 대출을 인수해</text><text x="20" y="448">다른 대주에게 배분(신디케이션)한다.</text><text x="20" y="472">대리은행: 차주와 대주 사이의 연락 창구</text><g class="si-rich" font-size="13"  font-weight="700"><text x="20" y="506">의결: 통상 채권액 </text><text x="132.8" y="499.8" text-anchor="middle" font-size="10.4">2</text><line x1="128.1" y1="501.8" x2="137.5" y2="501.8" style="stroke:currentColor" stroke-width="0.8"/><text x="132.8" y="510.8" text-anchor="middle" font-size="10.4">3</text><text x="139" y="506"> 이상</text></g><text x="20" y="526">(다수는 약정액의 50% 또는 75%도 흔함)</text><text x="20" y="556" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">순위가 다르면 부실 시 이해가 엇갈린다.</text></svg>
