<svg class="si si-illus" viewBox="0 0 360 690" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backdraft-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="backdraft-t">백드래프트: 산소가 부족한 밀폐 공간에 산소가 들어올 때의 연소</title><defs><marker id="backdraft-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="backdraft-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><text x="14" y="28" font-weight="700">① 밀폐 공간 화재</text><polyline points="274,64 274,34 14,34 14,144 274,144 274,132" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="14" y1="132" x2="274" y2="132" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="15" y="35" width="258" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="0" fill-opacity="0.9"/><text x="144" y="56" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">연기·가연성 가스 축적</text><polygon points="63,132 61.6,122.2 67.2,126.4 70,111 73.5,123.6 78.4,119.4 77,132" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.85"/><rect x="270" y="64" width="7" height="68" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="262" y="92" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">닫힌 문</text><text x="144" y="126" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">산소 부족</text><text x="14" y="182" font-weight="700">② 문을 열어 산소 유입</text><polyline points="274,218 274,188 14,188 14,298 274,298 274,286" style="stroke:currentColor;fill:non