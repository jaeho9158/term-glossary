<svg class="si si-illus" viewBox="0 0 360 506" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chronic-traumatic-encephalopathy-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="chronic-traumatic-encephalopathy-t">CTE 병리가 확인된 비율: 집단별 막대와 증상 시작까지의 시간</title><defs><marker id="chronic-traumatic-encephalopathy-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="20" y="24" font-weight="700">CTE 병리가 확인된 비율(Mez 등 2017 분석)</text><text x="96" y="59" text-anchor="end">NFL(프로)</text><rect x="104" y="44" width="188.1" height="20" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><rect x="104" y="44" width="188.1" height="20" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" opacity="0.55"/><text x="298.1" y="59" font-weight="700">99%</text><text x="110" y="88" style="fill:var(--si-general,#5c6b7f)">기증 뇌 111명 중 110명</text><text x="96" y="117" text-anchor="end">대학</text><rect x="104" y="102" width="172.9" height="20" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="282.9" y="117" font-weight="700">91%</text><text x="96" y="151" text-anchor="end">CFL</text><rect x="104" y="136" width="167.2" height="20" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="277.2" y="151" font-weight="700">88%</text><text x="96" y="185" text-anchor="end">세미프로</text><rect x="104" y="170" width="121.6" height="20" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="231.6" y="185" font-weight="700">64%</text><text x="96" y="219" text-anchor="end">고교</text><rect x="104" y="204" width="39.9" height="20" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="149.9" y="219" font-weight="700">21%</text><text x="96" y="253" text-anchor="end">일반 인구</text><rect x="105.1" y="238" width="10.3" height="20" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="121.4" y="253" font-weight="700">약 0.6~6%</text><text x="110" y="278" style="fill:var(--si-general,#5c6b7f)">Mez 분석 밖의 추정, 값이 갈림</text><line x1="104" y1="40" x2="104" y2="288" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="20" y="312" font-weight="700">확진은 사후 부검으로만 한다.</text><text x="20" y="354" font-weight="700">증상 시작까지</text><line x1="30" y1="406" x2="330" y2="406" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="40" cy="406" r="5" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><circle cx="130" cy="406" r="5" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="0"/><circle cx="280" cy="406" r="5" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><text x="40" y="394">반복 충격</text><text x="130" y="433" text-anchor="middle">은퇴</text><text x="280" y="394" text-anchor="middle">증상 시작</text><line x1="135" y1="416" x2="275" y2="416" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#chronic-traumatic-encephalopathy-ar)"/><text x="205" y="436" text-anchor="middle">약 8~14.5년</text><text x="20" y="470" style="fill:var(--si-general,#5c6b7f)">※ 기증된 뇌 표본이라 선택 편향이 있다.</text><text x="20" y="490" style="fill:var(--si-general,#5c6b7f)">선수 전체의 유병률로 읽으면 안 된다.</text></svg>
