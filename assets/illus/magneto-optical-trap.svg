<svg class="si si-illus" viewBox="0 0 360 570" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="magneto-optical-trap-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="magneto-optical-trap-t">자기광학 트랩: 여섯 방향 레이저와 자기장 구배가 원자를 모은다</title><defs><marker id="magneto-optical-trap-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="magneto-optical-trap-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">여섯 방향 레이저 + 자기장 구배</text><ellipse cx="180" cy="64" rx="62" ry="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.2"/><ellipse cx="180" cy="236" rx="62" ry="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.2"/><text x="250" y="60" font-weight="700">코일 쌍</text><line x1="14" y1="150" x2="146" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#magneto-optical-trap-ar)"/><line x1="346" y1="150" x2="214" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#magneto-optical-trap-ar)"/><line x1="180" y1="84" x2="180" y2="122" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#magneto-optical-trap-ar)"/><line x1="180" y1="216" x2="180" y2="178" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#magneto-optical-trap-ar)"/><line x1="112" y1="214" x2="154" y2="172" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#magneto-optical-trap-ar)"/><line x1="248" y1="100" x2="206" y2="128" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#magneto-optical-trap-ar)"/><text x="16" y="138" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">레이저 빔</text><text x="260" y="112" style="fill:var(--si-rose-s,#c97b7b)">뒤쪽 빔</text><text x="30" y="230" style="fill:var(--si-rose-s,#c97b7b)">앞쪽 빔</text><circle cx="180" cy="150" r="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.6"/><circle cx="172" cy="144" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="186" cy="140" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="180" cy="152" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="168" cy="158" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="190" cy="156" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="183" cy="164" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="176" cy="136" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="194" cy="148" r="2.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><text x="216" y="186" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">원자 구름</text><text x="14" y="296" font-weight="700">자기장 세기 |B|</text><line x1="40" y1="380" x2="330" y2="380" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#magneto-optical-trap-ar-1)"/><line x1="185" y1="380" x2="185" y2="316" style="stroke:currentColor;fill:none" stroke-width="1.4"/><polyline points="50,326 185,378 320,326" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6"/><text x="330" y="400" text-anchor="end">위치</text><text x="185" y="400" text-anchor="middle">중심(0)</text><text x="14" y="440">중심에서 멀수록 세기가 커져 제이만 효과로</text><text x="14" y="460">준위가 위치마다 갈라지고, 중심 쪽 복원력이 생긴다</text><text x="14" y="494">도플러 효과: 다가오는 빛을 더 흡수해</text><text x="14" y="514">어느 방향으로 움직여도 감속력을 받는다</text><text x="14" y="550" style="fill:var(--si-general,#5c6b7f)">본문 예: 루비듐-87 약 10<tspan dy="-0.435em" font-size="92%">7</tspan><tspan dy="0.4em">개를 약 100 μK로 냉각</tspan></text></svg>
