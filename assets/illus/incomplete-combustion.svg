<svg class="si si-illus" viewBox="0 0 360 652" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="불완전연소: 중간에서 멈추면 열을 덜 낸다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="incomplete-combustion-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="incomplete-combustion-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-pos,#14543c)"/></marker><marker id="incomplete-combustion-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="incomplete-combustion-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">엔탈피(위가 높음)</text><line x1="30" y1="70" x2="330" y2="70" style="stroke:currentColor;fill:none" stroke-width="3"/><text x="30" y="62" font-weight="700">CH<tspan dy="0.217em" font-size="92%">4</tspan><tspan dy="-0.2em"> + 2O</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><line x1="30" y1="246.6" x2="200" y2="246.6" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4"/><line x1="30" y1="342.9" x2="330" y2="342.9" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="3"/><line x1="60" y1="74" x2="60" y2="244.6" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#incomplete-combustion-ar)"/><text x="72" y="128" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">519.5 kJ/mol</text><text x="72" y="148" style="fill:var(--si-rose-s,#c97b7b)">불완전: CO에서 멈춤</text><line x1="330" y1="74" x2="330" y2="340.9" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="3" marker-end="url(#incomplete-combustion-ar-1)"/><text x="322" y="178" text-anchor="end" font-weight="700" style="fill:var(--si-pos,#14543c)">802.5 kJ/mol</text><text x="322" y="198" text-anchor="end" style="fill:var(--si-pos,#14543c)">완전연소</text><text x="30" y="268.6">CO + 2H<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O (+0.5O</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">)</tspan></text><text x="30" y="288.6" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">약 65%만 방출</text><line x1="60" y1="298.6" x2="60" y2="340.9" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#incomplete-combustion-ar-2)"/><text x="72" y="308.6" style="fill:var(--si-general,#5c6b7f)">남은 283 kJ/mol:</text><text x="74" y="328.6" style="fill:var(--si-general,#5c6b7f)">CO에 남아 함께 배출</text><text x="30" y="364.9" font-weight="700">CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> + 2H</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">O</tspan></text><line x1="14" y1="412" x2="346" y2="412" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><text x="14" y="436" font-weight="700">당량비 φ (연료 과잉일수록 오른쪽)</text><line x1="40" y1="545" x2="340" y2="545" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#incomplete-combustion-ar-3)"/><line x1="130" y1="539" x2="130" y2="551" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="250" y1="539" x2="250" y2="551" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="130" y="572" text-anchor="middle" font-weight="700">φ = 1</text><text x="250" y="572" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">φ = 1.2</text><text x="120" y="500" text-anchor="middle">이론 공기연료비</text><text x="122" y="522" text-anchor="middle">17.2 (질량)</text><text x="256" y="478" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">공기 약 14.3</text><text x="258" y="500" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">연료 과잉 →</text><text x="256" y="522" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">불완전연소 쪽</text><text x="14" y="610" style="fill:var(--si-general,#5c6b7f)">원인: 산소 부족 · 불균일 혼합</text><text x="16" y="632" style="fill:var(--si-general,#5c6b7f)">냉각 · 짧은 체류시간</text></svg>
