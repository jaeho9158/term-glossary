-f,#dde5f0)" stroke-width="1.6"/><text x="252.5" y="406" font-weight="700">95%</text><text x="14" y="430">RF</text><rect x="66" y="416" width="161.5" height="18" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="233.5" y="430" font-weight="700">85%</text><text x="14" y="458" font-weight="700" style="fill:var(--si-accent,#2454ff)">특이도는 항CCP가 RF보다 높다</text><text x="14" y="486" style="fill:var(--si-general,#5c6b7f)">기준값은 제품마다 다름</text><text x="14" y="508" style="fill:var(--si-general,#5c6b7f)">음성이어도 류마티스관절염을 배제할 수 없음</text></svg>
