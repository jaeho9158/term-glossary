 y2="305" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.45"/><text x="260" y="324" text-anchor="middle" font-size="12">S 180°</text><line x1="260" y1="195" x2="182.2" y2="272.8" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.45"/><text x="173.7" y="285.3" text-anchor="end" font-size="12">SW 225°</text><line x1="260" y1="195" x2="150" y2="195" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.45"/><text x="138" y="199" text-anchor="end" font-size="12">W 270°</text><line x1="260" y1="195" x2="182.2" y2="117.2" style="stroke:currentColor;fill:none" stroke-width="0.8" opacity="0.45"/><text x="173.7" y="112.7" text-anchor="end" font-size="12">NW 315°</text><line x1="260" y1="195" x2="260" y2="100" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.2" marker-end="url(#compass-directions-ar)"/><line x1="260" y1="195" x2="246.8" y2="100.9" style="stroke:currentColor;fill:none" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#compass-directions-ar-1)"/><path d="M260,125 A70,70 0 0 0 250.3,125.7" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="110" y="45" text-anchor="end" font-size="12">자북(MN)</text><text x="410" y="45" font-size="12">진북(TN)</text><text x="355" y="91" font-size="12">편각 8°</text><text x="260" y="368" text-anchor="middle" font-weight="700">진방위 = 자북방위 + 편각(동편각 +, 서편각 −)   예: 45° − 8° = 37°</text></svg>
