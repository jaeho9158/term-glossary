<svg class="si si-illus" viewBox="0 0 520 340" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="보행에서 압력중심(COP)의 이동" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>발바닥 윤곽 위에서 압력중심이 뒤꿈치 닿기 근처에서 발끝 떼기 근처로 앞쪽으로 옮겨 가는 경로와 두 측정 방향을 위에서 본 모식도</desc><defs><marker id="center-of-pressure-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><polygon points="180,50 215,60 235,110 240,170 228,230 215,285 185,300 150,290 138,250 145,190 150,120 158,70" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.8" fill-opacity="0.2"/><text x="210" y="140" text-anchor="middle" font-size="11" style="fill:var(--si-gray-s,#aab6c6)">발바닥</text><circle cx="185" cy="270" r="5" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="190" cy="75" r="5" style="stroke:none;fill:var(--si-green-s,#5b9b83)" stroke-width="1.6"/><path d="M185,270 C185.5,260 188.2,230 188,210 C187.8,190 183.7,172.5 184,150 C184.3,127.5 189,87.5 190,75" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="130" y="285" text-anchor="end" font-size="12">뒤꿈치 닿기</text><line x1="130" y1="285" x2="178" y2="272" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="178" cy="272" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="150" y="50" text-anchor="end" font-size="12">발끝 떼기</text><line x1="150" y1="50" x2="183" y2="75" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="183" cy="75" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="330" y="170" font-size="12">COP 이동 경로</text><line x1="330" y1="170" x2="188" y2="170" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="188" cy="170" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><line x1="320" y1="300" x2="420" y2="300" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" marker-end="url(#center-of-pressure-ar)"/><text x="370" y="318" text-anchor="middle" font-size="12">안쪽-바깥쪽</text><line x1="320" y1="300" x2="320" y2="230" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" marker-end="url(#center-of-pressure-ar)"/><text x="300" y="230" text-anchor="end" font-size="12">앞뒤</text></svg>
