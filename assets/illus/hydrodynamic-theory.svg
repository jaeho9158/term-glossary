<svg class="si si-illus" viewBox="0 0 360 470" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="유체역학설: 상아세관 안 액체 이동이 신경종말을 자극" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="hydrodynamic-theory-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="hydrodynamic-theory-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="24" font-weight="700">수력학설(유체역학설): 액체 이동 → 신경종말 자극</text><rect x="70" y="60" width="170" height="170" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="240" y="60" width="90" height="170" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="285" y="180" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">치수</text><rect x="70" y="82" width="170" height="16" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><line x1="80" y1="90" x2="228" y2="90" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#hydrodynamic-theory-ar)" marker-start="url(#hydrodynamic-theory-ar)"/><rect x="70" y="137" width="170" height="16" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><line x1="80" y1="145" x2="228" y2="145" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#hydrodynamic-theory-ar)" marker-start="url(#hydrodynamic-theory-ar)"/><rect x="70" y="192" width="170" height="16" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><line x1="80" y1="200" x2="228" y2="200" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#hydrodynamic-theory-ar)" marker-start="url(#hydrodynamic-theory-ar)"/><path d="M240,90 C242.7,89.2 251,84.3 256,85 C261,85.7 264.3,93.2 270,94 C275.7,94.8 286.7,90.7 290,90" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4"/><path d="M240,145 C242.7,144.2 251,139.3 256,140 C261,140.7 264.3,148.2 270,149 C275.7,149.8 286.7,145.7 290,145" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4"/><path d="M240,200 C242.7,199.2 251,194.3 256,195 C261,195.7 264.3,203.2 270,204 C275.7,204.8 286.7,200.7 290,200" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4"/><line x1="20" y1="145" x2="64" y2="145" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#hydrodynamic-theory-ar-1)"/><text x="20" y="126" font-weight="700">자극</text><line x1="240" y1="60" x2="240" y2="230" style="stroke:currentColor;fill:none" stroke-width="2.4" stroke-dasharray="6 4"/><text x="150" y="252" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">상아질(가로줄 = 상아세관)</text><text x="150" y="274" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">파란 화살표: 세관 안 액체 이동</text><text x="20" y="312">점선: 치수-상아질 경계</text><text x="20" y="334" style="fill:var(--si-green-t,#14543c)">초록 곡선: 신경종말(주로 A델타 섬유)</text><text x="20" y="366">냉·온·삼투압·기계적 자극이 액체 흐름을 일으킴</text><text x="20" y="386">냉자극은 액체가 더 빠르게 움직여 통증이 큼</text><text x="20" y="424" font-weight="700">자극 → 액체 이동 → 신경종말 자극 → 통증</text><text x="20" y="452" style="fill:var(--si-gray-t,#44546a)">신경종말 세부 기전은 완전히 규명되지 않음</text></svg>
