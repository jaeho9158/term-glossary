<svg class="si si-illus" viewBox="0 0 360 570" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="환자-대조군 연구: 거슬러 조사하는 방향과 교차비 계산" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="case-control-study-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="case-control-study-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="14" y="22" font-weight="700">① 결과에서 원인으로 거슬러 조사(가상의 예)</text><text x="14" y="52" style="fill:var(--si-general,#5c6b7f)">과거</text><text x="346" y="52" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">현재</text><polygon points="336,83 46,83 46,90 24,76 46,62 46,69 336,69" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.35"/><text x="180" y="106" text-anchor="middle" font-weight="700">거슬러 조사</text><text x="14" y="138" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">노출 40%(100명 중 40명)</text><rect x="14" y="150" width="160" height="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><rect x="14" y="150" width="64" height="24" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><rect x="214" y="136" width="132" height="52" rx="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="280" y="156" text-anchor="middle" font-weight="700">환자군 100명</text><text x="280" y="176" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">질병이 있는 사람</text><line x1="212" y1="162" x2="178" y2="162" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#case-control-study-ar)"/><text x="14" y="210" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">노출 20%(100명 중 20명)</text><rect x="14" y="222" width="160" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="14" y="222" width="32" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><rect x="214" y="208" width="132" height="52" rx="10" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="280" y="228" text-anchor="middle" font-weight="700">대조군 100명</text><text x="280" y="248" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">질병이 없는 사람</text><line x1="212" y1="234" x2="178" y2="234" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#case-control-study-ar-1)"/><text x="14" y="284" style="fill:var(--si-general,#5c6b7f)">채운 부분이 과거에 노출된 사람이다</text><text x="14" y="326" font-weight="700">② 2×2표와 교차비</text><text x="150" y="354" text-anchor="middle" font-weight="700">환자</text><text x="250" y="354" text-anchor="middle" font-weight="700">대조</text><text x="90" y="386" text-anchor="end" font-weight="700">노출</text><text x="90" y="424" text-anchor="end" font-weight="700">비노출</text><rect x="100" y="362" width="100" height="38" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="150" y="386" text-anchor="middle" font-size="16" font-weight="700">40</text><rect x="200" y="362" width="100" height="38" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="250" y="386" text-anchor="middle" font-size="16" font-weight="700">20</text><rect x="100" y="400" width="100" height="38" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="150" y="424" text-anchor="middle" font-size="16" font-weight="700">60</text><rect x="200" y="400" width="100" height="38" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="250" y="424" text-anchor="middle" font-size="16" font-weight="700">80</text><text x="14" y="460" font-weight="700">교차비 = (40 × 80) ÷ (20 × 60) ≈ 2.67</text><text x="14" y="482" style="fill:var(--si-general,#5c6b7f)">노란 두 칸의 곱 ÷ 초록 두 칸의 곱</text><text x="14" y="512">95% 신뢰구간 약 1.42~5.02: 1을 포함하지</text><text x="14" y="532">않아 연관은 말할 수 있다. 그러나 노출이</text><text x="14" y="552">질병을 일으켰다고는 할 수 없다.</text></svg>
