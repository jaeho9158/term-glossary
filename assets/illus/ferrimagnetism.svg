<svg class="si si-illus" viewBox="0 0 360 330" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ferrimagnetism-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ferrimagnetism-t">페리자성: 크기가 다른 두 부격자 모멘트가 반대로 정렬해 순 자화가 남는다</title><defs><marker id="ferrimagnetism-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="ferrimagnetism-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="ferrimagnetism-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="ferrimagnetism-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.3" markerHeight="6.3" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><text x="170" y="24" text-anchor="middle" font-weight="700">반강자성: 이웃 모멘트의 크기가 같다</text><line x1="40" y1="126" x2="40" y2="74" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar)"/><line x1="86" y1="74" x2="86" y2="126" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar-1)"/><line x1="132" y1="126" x2="132" y2="74" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar)"/><line x1="178" y1="74" x2="178" y2="126" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar-1)"/><line x1="224" y1="126" x2="224" y2="74" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar)"/><line x1="270" y1="74" x2="270" y2="126" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar-1)"/><text x="170" y="152" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">서로 상쇄되어 순 자화 0</text><text x="170" y="190" text-anchor="middle" font-weight="700">페리자성: 이웃 모멘트의 크기가 다르다</text><line x1="40" y1="290" x2="40" y2="222" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.2" marker-end="url(#ferrimagnetism-ar-2)"/><line x1="86" y1="236" x2="86" y2="274" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar-1)"/><line x1="132" y1="290" x2="132" y2="222" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.2" marker-end="url(#ferrimagnetism-ar-2)"/><line x1="178" y1="236" x2="178" y2="274" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar-1)"/><line x1="224" y1="290" x2="224" y2="222" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.2" marker-end="url(#ferrimagnetism-ar-2)"/><line x1="270" y1="236" x2="270" y2="274" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2.4" marker-end="url(#ferrimagnetism-ar-1)"/><line x1="20" y1="256" x2="300" y2="256" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8" stroke-dasharray="6 4"/><line x1="322" y1="290" x2="322" y2="256" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="4" marker-end="url(#ferrimagnetism-ar-3)"/><text x="322" y="304" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">순 자화</text><text x="90" y="318" text-anchor="middle" style="fill:var(--si-accent,#2454ff)">큰 모멘트</text><text x="210" y="318" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">작은 모멘트</text></svg>
