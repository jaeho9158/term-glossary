<svg class="si si-illus" viewBox="0 0 360 608" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cooks-distance-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cooks-distance-t">쿡의 거리: 한 점을 빼면 회귀선이 얼마나 움직이는가</title><defs><marker id="cooks-distance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="cooks-distance-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">관측치 하나를 빼면 회귀선이 얼마나 움직이나</text><line x1="44" y1="210" x2="342" y2="210" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#cooks-distance-ar)"/><line x1="44" y1="210" x2="44" y2="34" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="340" y="232" text-anchor="end" font-style="italic">x</text><text x="50" y="40" font-style="italic">y</text><line x1="44" y1="174.7" x2="319.7" y2="87.3" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.2"/><line x1="44" y1="209.8" x2="244.4" y2="31" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><circle cx="57.5" cy="197.4" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="70.9" cy="186.6" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="84.3" cy="172.8" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="97.8" cy="163.2" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="111.3" cy="149.4" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="124.7" cy="136.8" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="138.1" cy="127.2" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="151.6" cy="113.4" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="165.1" cy="102" r="4" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="313" cy="120" r="6" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="0"/><text x="313" y="144" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">x = 20</text><line x1="205.4" y1="123.5" x2="205.4" y2="65.8" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" marker-end="url(#cooks-distance-ar-1)" marker-start="url(#cooks-distance-ar-1)"/><text x="232" y="64" font-weight="700">예측값</text><text x="232" y="84" font-weight="700">변화</text><line x1="200" y1="162" x2="236" y2="162" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.2"/><text x="244" y="166">전체 적합</text><line x1="200" y1="194" x2="236" y2="194" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><text x="244" y="198">x = 20 제외 재적합</text><text x="180" y="264" text-anchor="middle" font-weight="700">관측치별 Cook의 거리 D</text><line x1="50" y1="410" x2="340" y2="410" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="50" y1="410" x2="50" y2="284" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="50" y1="380" x2="290" y2="380" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="50" y1="335" x2="290" y2="335" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="54" y="374" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">4/n = 0.4</text><text x="54" y="329" font-weight="700" style="fill:var(--si-limit,#7d2626)">D = 1</text><rect x="117" y="393.5" width="36" height="16.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.55"/><text x="135" y="454" text-anchor="middle" font-weight="700">0.22</text><text x="135" y="432" text-anchor="middle">x = 1</text><rect x="180" y="408.5" width="36" height="1.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.55"/><text x="198" y="454" text-anchor="middle" font-weight="700">0.002</text><text x="198" y="432" text-anchor="middle">x = 5</text><rect x="243" y="398" width="36" height="12" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.55"/><text x="261" y="454" text-anchor="middle" font-weight="700">0.16</text><text x="261" y="432" text-anchor="middle">x = 9</text><rect x="292" y="300" width="36" height="110" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.55"/><text x="310" y="294" text-anchor="middle" font-weight="700">15.42</text><text x="310" y="432" text-anchor="middle">x = 20</text><rect x="286" y="348" width="48" height="8" style="stroke:none;fill:var(--si-bg,#ffffff)" stroke-width="0"/><line x1="286" y1="358" x2="334" y2="348" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="286" y1="348" x2="334" y2="338" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="180" y="482" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">표에 있는 네 관측치만 표시 (x = 20 막대는 축을 끊음)</text><text x="180" y="518" text-anchor="middle" font-weight="700" font-style="italic">D<tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em"> = e</tspan><tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em">²/(p·s²) × h</tspan><tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em">/(1−h</tspan><tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em">)²</tspan></text><text x="180" y="540" text-anchor="middle">앞 인자: 잔차 e<tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em">, 뒤 인자: 레버리지 h</tspan><tspan dy="0.217em" font-size="92%">i</tspan></text><text x="180" y="568" text-anchor="middle" font-weight="700">잔차와 레버리지가 둘 다 크면 D가 커진다.</text><text x="180" y="588" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">큰 D가 곧 제거 대상은 아니다. 원인을 먼저 확인한다.</text></svg>
