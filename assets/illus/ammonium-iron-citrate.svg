 stroke-dasharray="3 3"/><line x1="230" y1="246" x2="230" y2="249.8" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="230" y1="260" x2="230" y2="288" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><text x="80" y="300" text-anchor="middle">빛 받음</text><text x="180" y="300" text-anchor="middle">가려짐</text><text x="280" y="300" text-anchor="middle">빛 받음</text><text x="30" y="332" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">빛 받은 곳: Fe³⁺ → Fe²⁺ 환원,</text><text x="30" y="352" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">프러시안 블루가 생긴다</text><text x="14" y="412" font-weight="700">③ 마스크를 치우고 물로 헹굼</text><path d="M150,434 C157.2,443.6 159.1,448.4 159.1,450.8 C159.1,455.6 154.8,458 150,458 C145.2,458 140.9,455.6 140.9,450.8 C140.9,448.4 142.8,443.6 150,434Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><path d="M180,434 C187.2,443.6 189.1,448.4 189.1,450.8 C189.1,455.6 184.8,458 180,458 C175.2,458 170.9,455.6 170.9,450.8 C170.9,448.4 172.8,443.6 180,434Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><path d="M210,434 C217.2,443.6 219.1,448.4 219.1,450.8 C219.1,455.6 214.8,458 210,458 C205.2,458 200.9,455.6 200.9,450.8 C200.9,448.4 202.8,443.6 210,434Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="150" y1="462" x2="150" y2="482" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#ammonium-iron-citrate-ar-1)"/><line x1="180" y1="462" x2="180" y2="482" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#ammonium-iron-citrate-ar-1)"/><line x1="210" y1="462" x2="210" y2="482" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#ammonium-iron-citrate-ar-1)"/><rect x="30" y="490" width="100" height="10" style="stroke:#1d3b78;fill:#1d3b78" stroke-width="1.4"/><rect x="130" y="490" width="100" height="10" style="stroke:v