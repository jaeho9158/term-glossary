<svg class="si si-illus" viewBox="0 0 660 346" style="max-width:660px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="organelle-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="organelle-t">세포소기관: 진핵세포의 막성 소기관과 막 없는 리보솜</title><desc>진핵세포 단면에 핵, 미토콘드리아, 소포체, 리소좀을 닫힌 윤곽(막으로 둘러싸임)으로, 리보솜을 점(막 없음)으로 배치한 모식도.</desc><defs></defs><line x1="236" y1="152" x2="110" y2="152" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="204" y1="250" x2="110" y2="250" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="452" y1="240" x2="536" y2="262.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="400" y1="136" x2="536" y2="107" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="457" y1="152" x2="536" y2="176.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="480" y1="92" x2="536" y2="55" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="24" font-size="12" font-weight="700">진핵세포 단면(모식)</text><ellipse cx="320" cy="172" rx="200" ry="136" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.1"/><circle cx="290" cy="155" r="56" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="2.2" fill-opacity="0.22"/><circle cx="290" cy="155" r="12" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.2" fill-opacity="0.45"/><path d="M368,112 Q402,120 392,148 Q382,176 410,188" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><path d="M375,112 Q409,120 399,148 Q389,176 417,188" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><ellipse cx="420" cy="232" rx="40" ry="