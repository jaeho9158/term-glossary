<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>단계 희석</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>
:root{--sd-liq:#e8a93a;--sd-water:#5aa9e6;--sd-col:#f3d27a;--sd-acc:#ff8a3d;--sd-glow:rgba(255,170,70,.55)}
body[data-theme="light"]{--sd-liq:#b8740f;--sd-water:#2f7fc1;--sd-col:#a8650a;--sd-acc:#d2551a;--sd-glow:rgba(210,110,20,.4)}
.liq{fill:var(--sd-liq);stroke:none}
.liq.water{fill:var(--sd-water)}
[data-load]{}
.bub{fill:var(--sd-water);fill-opacity:.35;stroke:var(--anatomy-strong);stroke-width:.7}
.tag{font:600 12px system-ui,sans-serif;fill:var(--sd-acc);paint-order:stroke;stroke:var(--anatomy-card);stroke-width:3px}
[data-readout]{font-size:14px!important;color:var(--sd-acc)!important}
.sd-phase{margin:6px 10px 0;text-align:center;font:600 14px/1.4 system-ui,sans-serif;color:var(--sd-acc);min-height:1.4em}
.sd-ctl #sd-move.go{border-color:var(--sd-acc);box-shadow:0 0 0 0 var(--sd-glow);animation:sdpulse 1.6s ease-out infinite}
.iso-key:nth-child(1) svg *{fill:var(--sd-liq);stroke:var(--sd-liq)}.iso-key:nth-child(2) svg *{fill:var(--sd-water);stroke:var(--sd-water)}.iso-key:nth-child(3) svg *{fill:var(--sd-col);stroke:var(--sd-col)}.iso-key{font-size:13px}
@keyframes sdpulse{to{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.sd-ctl #sd-move.go{animation:none}}
.sd-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;margin:6px 10px 0;font:13px/1.35 var(--anatomy-mono);text-align:center;color:var(--anatomy-muted)}
.sd-row b{display:block;color:var(--sd-liq);font-weight:600}
.sd-ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 10px 4px}
.sd-ctl button{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--anatomy-lo);background:var(--anatomy-card);color:var(--anatomy-strong);font:13px system-ui,sans-serif;cursor:pointer}
.sd-ctl button[aria-pressed="true"]{border-color:var(--anatomy-strong)}
.sd-ctl button:disabled{opacity:.35;cursor:default}
.sd-ctl button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.sd-res{margin:4px 10px 8px;font:14px/1.5 system-ui,sans-serif;text-align:center;color:var(--anatomy-text);min-height:2.6em}
@media (max-width:520px){.iso-plate-corner[data-corner="hint"]{display:none}.sd-row{grid-template-columns:repeat(4,1fr);margin:4px 0 0}}

// 단계 희석 순수 모델. DOM 없음. build.mjs가 이 파일 본문을 페이지에 그대로 넣는다.
const STOCK = 1.5e9;      // 원액 농도 CFU/mL (시연용 가정값)
const DILUENT = 900;      // 튜브마다 희석액 µL
const STOCK_VOL = 1000;   // 원액 튜브 µL
const TUBES = 6;
const PLATED = 100;       // 도말 부피 µL (0.1 mL)
const COUNTABLE = [30, 300];
const SEED = 20261112;

const transferOf = (f) => DILUENT / (f - 1);   // 1:f가 되는 이동량
function rng(seed) {      // mulberry32
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function poisson(lambda, rand) {
  if (lambda > 500) { // shortcut: 정규 근사, 큰 평균에서만
    const g = Math.sqrt(-2 * Math.log(rand() || 1e-12)) * Math.cos(2 * Math.PI * rand());
    return Math.max(0, Math.round(lambda + Math.sqrt(lambda) * g));
  }
  const L = Math.exp(-lambda); let k = 0, p = 1;
  do { k++; p *= rand(); } while (p > L);
  return k - 1;
}
// step: 끝난 옮기기 횟수(0..6). 튜브 0은 원액.
function stateOf(f, step) {
  const v = transferOf(f);
  const tubes = [{ vol: STOCK_VOL - (step > 0 ? v : 0), conc: STOCK, factor: 1, power: 0 }];
  for (let i = 1; i <= TUBES; i++) {
    const filled = i <= step;
    const vol = DILUENT + (filled ? v : 0) - (i < step ? v : 0);
    tubes.push({ vol, conc: filled ? STOCK / f ** i : 0, factor: f ** -i, power: i, filled });
  }
  return { f, step, transfer: v, tubes };
}
function plateOf(f) {
  const lambda = (STOCK / f ** TUBES) * (PLATED / 1000);
  const count = poisson(lambda, rng(SEED + f));
  const countable = count >= COUNTABLE[0] && count <= COUNTABLE[1];
  const estimate = countable ? count / (f ** -TUBES * PLATED / 1000) : null;
  return { lambda, count, countable, estimate };
}

const P = {"origin":[292.80929373252377,284.91758866723137],"scale":1.2262406036555376,"azimuth":68,"elevation":30}, XS = [-128,-91,-54,-17,20,57,94], DISH = [140,2], DISH_R = 22;
const TUBE_R = 6, TUBE_Z = 40, LIQ_PER_UL = 0.01888888888888889, REST_Z = 100, DIP_Z = 46;
function liqPath(x, y, r, z0, h, P) {
  const v = towardViewer(P), face = Math.atan2(v[1], v[0]), pts = [];
  for (let s = 0; s <= 24; s++) { const a = face - Math.PI / 2 + (s / 24) * Math.PI; pts.push(iso([x + r * Math.cos(a), y + r * Math.sin(a), z0], P)); }
  for (let s = 0; s <= 24; s++) { const a = face + Math.PI / 2 + (s / 24) * Math.PI; pts.push(iso([x + r * Math.cos(a), y + r * Math.sin(a), z0 + h], P)); }
  return pathOf(pts, true);
}
const liq = (x, h) => liqPath(x, 0, TUBE_R - 0.9, TUBE_Z + 0.8, h, P);
const $ = (s) => document.querySelector(s);
const svg = $(".iso-stage svg"), pip = svg.querySelector('[data-part="pipette"]'), load = svg.querySelector("[data-load]"), plunger = svg.querySelector("[data-plunger]");
const tag = svg.querySelector("[data-tag]"), bubG = svg.querySelector("[data-bubbles]"), phase = $(".sd-phase");
const readout = $("[data-readout]"), res = $(".sd-res"), row = $(".sd-row");
const bMove = $("#sd-move"), bPlate = $("#sd-plate"), bReset = $("#sd-reset"), bRatio = [...document.querySelectorAll("[data-ratio]")];
const still = matchMedia("(prefers-reduced-motion: reduce)");
let f = 10, step = 0, plated = false, busy = false, pos = { x: XS[0], z: REST_Z };
const sup = (n) => String(n).replace(/-/g, "⁻").replace(/\d/g, (d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
const sci = (v) => { if (!v) return "0"; const e = Math.floor(Math.log10(v)), m = v / 10 ** e; return m.toFixed(1) + "×10" + sup(e); };
const shade = (c) => c ? Math.max(0.06, Math.min(1, 0.06 + 0.94 * (Math.log10(c) - 2) / (Math.log10(STOCK) - 2))) * 0.85 : 0.05;
function paint() {
  const s = stateOf(f, step);
  s.tubes.forEach((t, i) => { const el = svg.querySelector('[data-liq="' + i + '"]'); el.setAttribute("d", liq(XS[i], t.vol * LIQ_PER_UL)); el.classList.toggle("water", !t.conc); el.style.opacity = String(t.conc ? shade(t.conc) : 0.3); });
  row.innerHTML = s.tubes.map((t, i) => "<span>" + (i ? i + "번" : "원액") + "<b>" + (i ? f + sup(-i) : "1") + "</b>" + (t.conc ? sci(t.conc) : "희석액") + "</span>").join("");
  bMove.disabled = busy || step >= TUBES; bPlate.disabled = busy || step < TUBES || plated; bReset.disabled = busy;
  bRatio.forEach((b) => { b.disabled = busy; b.setAttribute("aria-pressed", String(+b.dataset.ratio === f)); });
  readout.textContent = plated ? "집락 " + plateOf(f).count.toLocaleString("ko-KR") + "개" : step ? step + "번 튜브 · " + f + sup(-step) : "1:" + f + " · " + transferOf(f) + " µL씩";
}
function result() {
  const p = plateOf(f);
  res.textContent = p.countable
    ? "집락 " + p.count + "개 ÷ (" + f + sup(-TUBES) + " × 0.1 mL) = 원액 " + sci(p.estimate) + " CFU/mL (모델 값 " + sci(STOCK) + ")"
    : "집락 약 " + sci(p.count) + "개: " + COUNTABLE[0] + "~" + COUNTABLE[1] + "개 범위를 넘어 셀 수 없다. 희석이 부족하다.";
}
function drawColonies(n) {
  const p = plateOf(f), shown = Math.min(p.count, 400), r = rng(SEED * 3 + f), pts = [];
  for (let i = 0; i < shown; i++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * (DISH_R - 3); pts.push(iso([DISH[0] + d * Math.cos(a), DISH[1] + d * Math.sin(a), 5], P)); }
  const m = Math.round(shown * n);
  svg.querySelector("[data-colonies]").innerHTML = pts.slice(0, m).map(([x, y]) => '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="0.9" fill="var(--sd-col)"/>').join("")
    + (!p.countable && n > 0.5 ? '<path class="liq" style="opacity:' + ((n - 0.5) * 0.5).toFixed(2) + '" d="' + liqPath(DISH[0], DISH[1], DISH_R - 1.5, 5, 0.01, P) + '"/>' : "");
}
function place() { pip.setAttribute("transform", translateAlong(P, [pos.x, 0, pos.z])); }
const ease = (t) => t * t * (3 - 2 * t);
let gen = 0, touring = false, tourT = 0; // gen: 진행 중 애니메이션을 끊을 때 올린다
function run(keys, done) {
  busy = true; paint(); const g = gen;
  let i = 0, from = { ...pos }, t0 = 0;
  const frame = (now) => {
    if (g !== gen) return;
    const key = keys[i], dur = still.matches ? 0 : key.d;
    if (!t0) t0 = now;
    const u = dur ? Math.min(1, (now - t0) / 1000 / dur) : 1, e = ease(u);
    pos = { x: from.x + ((key.x ?? from.x) - from.x) * e, z: from.z + ((key.z ?? from.z) - from.z) * e };
    if (key.press != null) plunger.setAttribute("transform", translateAlong(P, [0, 0, -key.press * Math.sin(Math.PI * u)]));
    if (key.tick) key.tick(u);
    place();
    if (u >= 1) { key.then && key.then(); i++; from = { ...pos }; t0 = 0; if (i >= keys.length) { busy = false; paint(); done && done(); return; } }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
let carry = 0; // 지금 피펫에 든 액체 농도
const fill = (on) => () => { load.style.opacity = on ? String(Math.max(0.45, shade(carry))) : "0"; };
function label(txt, ph) { if (ph != null) phase.textContent = ph; if (!txt) { tag.textContent = ""; return; } const [x, y] = iso([pos.x, 0, pos.z + 80], P); tag.setAttribute("x", x.toFixed(1)); tag.setAttribute("y", y.toFixed(1)); tag.textContent = txt; }
function bubbles(x, u) { // 배출 뒤 섞기: 튜브 안 기포가 올라간다
  if (still.matches || u >= 1) { bubG.innerHTML = ""; return; }
  bubG.innerHTML = [0, 1, 2, 3].map((j) => { const k2 = (u * 2 + j / 4) % 1, [cx, cy] = iso([x + (j - 1.5) * 1.6, 0, TUBE_Z + 3 + k2 * 16], P); return '<circle class="bub" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (1 + j * 0.3).toFixed(2) + '" opacity="' + (1 - k2).toFixed(2) + '"/>'; }).join("");
}
const say = (txt, ph) => () => label(txt, ph);
function transfer() {
  if (busy || step >= TUBES) return;
  const a = XS[step], b = XS[step + 1], v = transferOf(f), src = step ? step + "번" : "원액", dst = (step + 1) + "번";
  carry = stateOf(f, step).tubes[step].conc;
  const T = v + " µL";
  run([{ x: a, z: REST_Z, d: 0.8, tick: say(T, "1 빨기: " + src + " 튜브에서 " + T) }, { z: DIP_Z, d: 0.8, tick: say(T) }, { z: DIP_Z, d: 0.8, press: 3, tick: say(T), then: fill(true) }, { z: REST_Z, d: 0.8, tick: say(T) },
       { x: b, d: 1.2, tick: say(T, "2 옮기기: " + T + "를 " + dst + " 튜브로") }, { z: DIP_Z, d: 0.8, tick: say(T) }, { z: DIP_Z, d: 0.8, press: 3, tick: say(T, "3 배출: " + dst + " 튜브에 넣고 섞기"), then: () => { fill(false)(); step++; paint(); } },
       { z: DIP_Z + 8, d: 1.4, tick: (u) => { say("섞기")(); bubbles(b, u); } }, { z: REST_Z, d: 0.6, tick: say(""), then: () => { bubbles(b, 1); label("", dst + " 튜브: " + (f ** step).toLocaleString("ko-KR") + "배 희석") } }]);
}
function spread() {
  if (busy || step < TUBES || plated) return;
  carry = stateOf(f, TUBES).tubes[TUBES].conc;
  const T = PLATED + " µL";
  run([{ x: XS[TUBES], z: REST_Z, d: 0.8, tick: say(T, "1 빨기: 6번 튜브에서 " + T) }, { z: DIP_Z, d: 0.8, tick: say(T) }, { z: DIP_Z, d: 0.8, press: 3, tick: say(T), then: fill(true) }, { z: REST_Z, d: 0.8, tick: say(T) },
       { x: DISH[0], d: 1.2, tick: say(T, "2 옮기기: 평판으로") }, { z: 9, d: 0.8, tick: say(T) }, { z: 9, d: 0.8, press: 3, tick: say(T, "3 배출: 평판에 펴 바르기"), then: () => { fill(false)(); plated = true; } }, { z: REST_Z, d: 0.6, tick: say("", "집락이 자라요") },
       { d: 1.4, tick: (u) => drawColonies(u), then: result }]);
}
function reset(nf, quiet) { if (busy) return; if (nf) f = nf; step = 0; plated = false; pos = { x: XS[0], z: REST_Z }; place(); fill(false)(); drawColonies(0); res.textContent = "‘옮기기’를 눌러 " + transferOf(f) + " µL를 다음 튜브로 옮겨요."; paint(); if (!quiet) hint(); }
function hint() { tag.textContent = ""; bubG.innerHTML = ""; phase.textContent = "눌러서 시작해요 ↓"; bMove.classList.add("go"); }
const begun = () => { bMove.classList.remove("go"); if (phase.textContent.startsWith("눌러서")) phase.textContent = ""; };
function stopTour() { // 조작하면 시연을 즉시 끊고 처음 상태로
  clearTimeout(tourT); if (!touring) return;
  touring = false; gen++; busy = false; plunger.removeAttribute("transform"); reset();
}
["pointerdown", "keydown"].forEach((t) => document.addEventListener(t, stopTour, true));
function tour() { // 가만히 두면 한 번 옮기기를 보여 주고 처음으로 돌아온다
  touring = true; begun(); phase.textContent = "";
  transfer(); const g = gen;
  const back = () => { if (g !== gen) return; if (busy) return requestAnimationFrame(back); tourT = setTimeout(() => { if (g === gen) { touring = false; reset(); } }, 1600); };
  requestAnimationFrame(back);
}
bMove.onclick = () => { begun(); transfer(); }; bPlate.onclick = () => { begun(); spread(); }; bReset.onclick = () => reset();
bRatio.forEach((b) => (b.onclick = () => reset(+b.dataset.ratio)));
const q = new URLSearchParams(location.search); // 캡처용: ?ratio=2&step=3&plated=1&auto=1
if (q.get("ratio")) f = +q.get("ratio");
reset();
if (q.get("step") || q.get("plated")) begun();
else if (!still.matches && !q.get("auto") && !q.get("notour")) tourT = setTimeout(tour, 1400);
if (q.get("step")) { step = +q.get("step"); paint(); }
if (q.get("auto")) bMove.onclick();
if (q.get("plated")) { plated = true; drawColonies(1); result(); paint(); }
</script></body></html>
