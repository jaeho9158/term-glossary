<svg class="si si-illus" viewBox="0 0 360 604" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="미분가능성: 매끄러운 점과 뾰족한 점" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="differentiability-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">미분가능성: 접선이 하나로 정해지는가</text><text x="14" y="46" font-weight="700">① 매끄러운 곡선</text><line x1="40" y1="172" x2="340" y2="172" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#differentiability-ar)"/><line x1="40" y1="172" x2="40" y2="58" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#differentiability-ar)"/><path d="M70,118 C73.3,115.6 83.3,107.8 90,103.3 C96.7,98.9 103.3,94.9 110,91.3 C116.7,87.8 123.3,84.7 130,82 C136.7,79.3 143.3,77.1 150,75.3 C156.7,73.6 163.3,72.2 170,71.3 C176.7,70.4 183.3,70 190,70 C196.7,70 203.3,70.4 210,71.3 C216.7,72.2 223.3,73.6 230,75.3 C236.7,77.1 243.3,79.3 250,82 C256.7,84.7 263.3,87.8 270,91.3 C276.7,94.9 283.3,98.9 290,103.3 C296.7,107.8 306.7,115.6 310,118" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><line x1="195" y1="62" x2="305" y2="106" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="2.6"/><circle cx="250" cy="84" r="4.5" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="1.6"/><text x="262" y="142" font-weight="700" style="fill:var(--si-pos,#14543c)">접선 1개</text><text x="52" y="80" font-weight="700" style="fill:var(--si-pos,#14543c)">미분가능</text><text x="14" y="214" font-weight="700">② 뾰족점: 연속이지만 미분불가</text><line x1="40" y1="334" x2="340" y2="334" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#differentiability-ar)"/><line x1="40" y1="334" x2="40" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#differentiability-ar)"/><polyline points="105,228 190,305 275,228" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><line x1="160" y1="332" x2="190" y2="305" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" stroke-dasharray="5 4"/><line x1="190" y1="305" x2="220" y2="332" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" stroke-dasharray="5 4"/><circle cx="190" cy="305" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="52" y="262" font-weight="700">y = |x|</text><text x="14" y="362">뾰족점 0에서 왼쪽·오른쪽 직선이 달라서</text><text x="14" y="384" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">접선이 하나로 정해지지 않음</text><text x="14" y="424" font-weight="700">③ ReLU도 꺾인 점에서 미분불가</text><line x1="40" y1="510" x2="340" y2="510" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#differentiability-ar)"/><line x1="40" y1="510" x2="40" y2="442" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#differentiability-ar)"/><polyline points="70,510 190,510 290,450" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.8"/><circle cx="190" cy="510" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="150" y="538" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">꺾인 점: 미분불가</text><text x="212" y="466" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">ReLU</text><line x1="14" y1="560" x2="346" y2="560" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="180" y="584" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">미분가능 ⇒ 연속, 역은 성립하지 않음</text></svg>
