<svg class="si si-illus" viewBox="0 0 366 330" style="max-width:366px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="행간걸침과 행말정지" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="enjambment-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="6" y="22" font-size="14" font-weight="700">행간걸침(enjambment): 밀턴 『실낙원』 1권</text><text x="352" y="46" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">행 끝</text><line x1="360" y1="52" x2="360" y2="156" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" stroke-dasharray="4 4"/><text x="6" y="74">Of Man's first disobedience, and the fruit</text><text x="6" y="114">Of that forbidden tree whose mortal taste</text><text x="6" y="154">Brought death into the world, and all our woe,</text><polyline points="254,80 254,89 12,89 12,98" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#enjambment-ar)"/><polyline points="260,120 260,129 12,129 12,138" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#enjambment-ar)"/><text x="6" y="176" style="fill:var(--si-amber-s,#d79a2b)">문장이 행 끝을 넘어 다음 행으로 이어진다</text><line x1="6" y1="196" x2="360" y2="196" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="6" y="220" font-size="14" font-weight="700">행말정지(end-stopped line): 모식</text><line x1="360" y1="232" x2="360" y2="296" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="6" y="243" width="334" height="14" rx="7" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><circle cx="348" cy="250" r="3.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><rect x="6" y="273" width="334" height="14" rx="7" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><circle cx="348" cy="280" r="3.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><text x="6" y="314" style="fill:var(--si-general,#5c6b7f)">막대는 한 행, 점은 문법 단위의 끝이다</text></svg>
