<svg class="si si-illus" viewBox="0 0 560 290" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chlorophyll-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="chlorophyll-t">엽록소: 파랑·빨강은 흡수하고 초록은 반사한다</title><defs><marker id="chlorophyll-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="chlorophyll-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><line x1="30" y1="80" x2="130" y2="80" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="3" marker-end="url(#chlorophyll-ar)"/><text x="30" y="60" font-size="12">백색광</text><ellipse cx="200" cy="80" rx="70" ry="42" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8" fill-opacity="0.5"/><text x="200" y="84" text-anchor="middle" font-size="12">잎(엽록소)</text><line x1="270" y1="95" x2="400" y2="150" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.4" marker-end="url(#chlorophyll-ar-1)"/><text x="340" y="108" font-size="12">초록은 반사</text><text x="290" y="40" font-size="12">파랑·빨강은 주로 흡수</text><line x1="60" y1="230" x2="510" y2="230" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="60" y1="230" x2="60" y2="236" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="60" y="252" text-anchor="middle" font-size="10">400</text><line x1="120" y1="230" x2="120" y2="236" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="120" y="252" text-anchor="middle" font-size="10">450</text><line x1="180" y1="230" x2="180" y2="236" style="stroke:currentColor;fill:none" stroke-width="1"/><text x="180" y="252" text-anchor=