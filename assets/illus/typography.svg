<svg class="si si-illus" viewBox="0 0 600 290" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="typography-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="typography-t">행간·자간·커닝</title><desc>두 줄 글의 기준선 사이 행간, 글자 전체 간격인 자간, 특정 글자쌍 간격인 커닝을 보인 모식도</desc><defs><marker id="typography-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="60" y1="110" x2="420" y2="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" stroke-dasharray="4 3"/><line x1="60" y1="180" x2="420" y2="180" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" stroke-dasharray="4 3"/><text x="70" y="108" font-size="40">Typography</text><text x="70" y="178" font-size="40">Typography</text><line x1="52" y1="110" x2="52" y2="180" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#typography-ar)" marker-start="url(#typography-ar)"/><text x="46" y="150" text-anchor="end" font-size="12">행간</text><text x="530" y="108" text-anchor="middle" font-size="40">A V</text><text x="530" y="178" text-anchor="middle" font-size="40">AV</text><text x="500" y="212" text-anchor="middle" font-size="11">커닝: 특정 글자쌍 간격 조정</text><text x="530" y="60" text-anchor="middle" font-size="11">커닝 전</text><text x="530" y="140" text-anchor="middle" font-size="11">커닝 후</text><text x="230" y="240" text-anchor="middle" font-size="22">T y p o g r a p h y</text><text x="230" y="270" text-anchor="middle" font-size="11">자간: 모든 글자 사이 간격을 고르게 넓힘</text><text x="420" y="134" text-anchor="end" font-size="11">기준선</text><line x1="410" y1="124" x2="405" y2="111" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
