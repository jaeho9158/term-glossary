<svg class="si si-illus" viewBox="0 0 600 320" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="odontogenic-infection-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="odontogenic-infection-t">치성감염의 확산: 하악 관상 단면의 악설골근과 설하·악하 공간</title><desc>아래 어금니 치근단의 농양이 악설골근 아래의 악하 공간으로 퍼지는 모습을 보인 하악 관상 단면 모식도. 악설골근 위가 설하 공간, 아래가 악하 공간이다.</desc><defs><marker id="odontogenic-infection-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="168" y1="80" x2="124.5" y2="80" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="186" y1="194" x2="85.6" y2="236.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="142" y1="180" x2="98" y2="180" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="405" y1="203" x2="448" y2="203" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="24" font-size="12" font-weight="700">하악 관상 단면(아래 어금니 부위, 모식)</text><polygon points="250,115 430,115 430,205 250,145" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="0.16"/><polygon points="248,168 430,225 430,288 248,288" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="0.16"/><ellipse cx="345" cy="82" rx="80" ry="34" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.3"/><text x="345" y="86" text-anchor="middle" font-size="12">혀</text><path d="M140,100 L248,100 L248,235 Q248,258 225,258 L165,258 Q140,258 140,235 Z" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.32"/><path d="M168,60 L222,60 L226,100 L218,150 L196,180 L182,150 L166,100 Z" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.14"/><polygon points="248,145 430,205 430,225 248,168" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.45"/><line x1="430" y1="50" x2="430" y2="290" style="stroke:currentColor;fill:none" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/><text x="430" y="42" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">정중선</text><line x1="140" y1="290" x2="430" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.4"/><circle cx="196" cy="190" r="10" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.55"/><line x1="206" y1="196" x2="300" y2="244" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#odontogenic-infection-ar)"/><text x="20" y="76" font-size="12">치아(아래 어금니)</text><text x="20" y="250" font-size="12">치근단 농양</text><text x="60" y="180" font-size="12">하악골</text><text x="340" y="150" text-anchor="middle" font-size="12">설하 공간</text><text x="340" y="268" text-anchor="middle" font-size="12">악하 공간</text><text x="450" y="196" font-size="12">악설골근</text><text x="308" y="238" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">확산 방향</text><text x="450" y="100" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">루드비히 앙기나</text><text x="450" y="120" font-size="11.5" style="fill:var(--si-accent,#2454ff)">악하·설하·이하 공간이</text><text x="450" y="140" font-size="11.5" style="fill:var(--si-accent,#2454ff)">함께 침범된 경우</text></svg>
