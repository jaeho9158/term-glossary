<svg class="si si-illus" viewBox="0 0 360 696" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="자유에너지 지형의 골짜기·봉우리와 접힘 깔때기" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="free-energy-landscape-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="free-energy-landscape-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">자유에너지 지형: 단면과 접힘 깔때기</text><line x1="40" y1="250" x2="346" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#free-energy-landscape-ar)"/><line x1="40" y1="250" x2="40" y2="74" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#free-energy-landscape-ar)"/><text x="14" y="66">자유에너지</text><path d="M40 122 C62 156 82 176 100 178 C124 178 146 98 170 98 C194 98 222 220 252 220 C292 220 318 160 338 122 L338 250 L40 250 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.22"/><path d="M40 122 C62 156 82 176 100 178 C124 178 146 98 170 98 C194 98 222 220 252 220 C292 220 318 160 338 122" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><circle cx="100" cy="168" r="8" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4"/><line x1="100" y1="180" x2="100" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="252" y1="222" x2="252" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><text x="170" y="76" text-anchor="middle" font-weight="700">전이 상태(안장점)</text><line x1="170" y1="80" x2="170" y2="98" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="170" cy="98" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="170" y="58" text-anchor="middle">높은 봉우리: 불안정</text><text x="100" y="270" text-anchor="middle" font-weight="700">준안정 상태</text><text x="100" y="290" text-anchor="middle">(얕은 골짜기에 갇힘)</text><text x="252" y="270" text-anchor="middle" font-weight="700">안정한 상태</text><text x="252" y="290" text-anchor="middle">(낮은 골짜기)</text><text x="193" y="318" text-anchor="middle">반응 좌표(집단변수) →</text><line x1="16" y1="336" x2="344" y2="336" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="358" text-anchor="middle" font-size="14" font-weight="700">접힘 깔때기</text><path d="M40 378 C56 450 120 494 148 530 L212 530 C240 494 304 450 320 378" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><ellipse cx="180" cy="378" rx="140" ry="10" style="stroke:var(--si-accent,#2454ff);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8" fill-opacity="0.35"/><path d="M84,394 C113.7,394.3 254.7,390 262,396 C269.3,402 133,420 128,430 C123,440 228,445.7 232,456 C236,466.3 159.7,481.3 152,492 C144.3,502.7 180.3,515.3 186,520" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#free-energy-landscape-ar-1)"/><text x="180" y="556" text-anchor="middle" font-weight="700">천연 상태</text><text x="16" y="584">위쪽: 풀린 사슬, 가능한 구조가 매우 많다</text><line x1="16" y1="598" x2="344" y2="598" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="620">기울기가 0인 점이 정류점이다. 에너지 극소는 안정한</text><text x="16" y="639.5">화학종이고, 안장점은 반응 좌표를 따라서는 극대,</text><text x="16" y="659">수직인 방향으로는 극소이다.</text><text x="16" y="678.5">물 분자의 극소: O–H 0.0958 nm, H–O–H 104.5°</text></svg>
