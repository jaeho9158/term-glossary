<svg class="si si-illus" viewBox="0 0 360 514" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="η², η²p, ω²: 변동 분할과 분모의 차이" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="eta-squared-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">η²: 전체 변동 중 집단간 몫</text><line x1="20" y1="56" x2="340" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#eta-squared-ar)" marker-start="url(#eta-squared-ar)"/><text x="180" y="48" text-anchor="middle">SS 전체 = 200</text><rect x="20" y="70" width="64" height="34" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><rect x="84" y="70" width="256" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="52" y="93" text-anchor="middle" font-weight="700">40</text><text x="212" y="93" text-anchor="middle" font-weight="700">160</text><text x="88" y="93" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">ω²</text><line x1="74.4" y1="64" x2="74.4" y2="110" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" stroke-dasharray="4 3"/><text x="20" y="130" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">SS 집단간</text><text x="170" y="130" font-weight="700" style="fill:var(--si-general,#5c6b7f)">SS 집단내 (오차)</text><text x="20" y="154" font-weight="700">η² = 40/200 = .20</text><text x="20" y="178" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">ω² ≈ .17 (편향 보정, 더 작다)</text><line x1="14" y1="198" x2="346" y2="198" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="14" y="214" font-weight="700">요인이 여럿일 때 (비율은 모식)</tex