<svg class="si si-illus" viewBox="0 0 360 600" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="성장 블록 우주: 과거·현재만 실재" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="growing-block-universe-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker><marker id="growing-block-universe-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><text x="14" y="24" font-weight="700">현재주의</text><rect x="44" y="34" width="170" height="78" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><line x1="24" y1="106" x2="24" y2="40" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2" marker-end="url(#growing-block-universe-ar)"/><rect x="44" y="70" width="170" height="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><text x="236" y="80" font-weight="700">현재만 실재</text><text x="14" y="142" font-weight="700">성장 블록</text><rect x="38" y="244" width="182" height="116" style="stroke:var(--si-accent,#2454ff);fill:var(--si-bg,#ffffff)" stroke-width="3"/><rect x="44" y="164" width="170" height="76" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="44" y="250" width="170" height="100" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><line x1="44" y1="250" x2="214" y2="250" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="4"/><line x1="44" y1="268" x2="214" y2="268" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" opacity="0.6"/><line x1="44" y1="284" x2="214" y2="284" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" opacity="0.6"/><line x1="44" y1="300" x2="214" y2="300" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1" opacity="0.6"/><text x="130" y="332" text-anchor="middle">과거: 이미 지난 층</text><text x="52" y="192" style="fill:var(--si-general,#5c6b7f)">미래:</text><text x="52" y="212" style="fill:var(--si-general,#5c6b7f)">아직 존재하지 않음</text><line x1="196" y1="243" x2="196" y2="180" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="4" marker-end="url(#growing-block-universe-ar-1)"/><text x="236" y="196">시간이 흐르며</text><text x="236" y="216">새 현재가 더해짐</text><text x="236" y="256" font-weight="700">현재 =</text><text x="236" y="276" font-weight="700">실재의 가장자리</text><line x1="24" y1="350" x2="24" y2="160" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2" marker-end="url(#growing-block-universe-ar)"/><text x="16" y="365" text-anchor="middle" font-weight="700">시간</text><text x="14" y="388" font-weight="700">영원주의</text><rect x="44" y="398" width="170" height="96" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><line x1="24" y1="490" x2="24" y2="402" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2" marker-end="url(#growing-block-universe-ar)"/><text x="236" y="440" font-weight="700">과거·현재·</text><text x="236" y="460" font-weight="700">미래 모두 실재</text><text x="180" y="530" text-anchor="middle" font-weight="700">C. D. 브로드, 1923년 Scientific Thought</text><text x="180" y="558" text-anchor="middle">동시성의 상대성과의 결합 문제</text><text x="180" y="578" text-anchor="middle">'지금'이 가장자리인지 알 수 없는 문제</text></svg>
