<svg class="si si-illus" viewBox="0 0 360 672" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="역홀-페치 효과: 항복강도 대 결정립 크기" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="inverse-hall-petch-effect-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="inverse-hall-petch-effect-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">역홀-페치 효과: 강도 상승이 꺾이는 지점</text><text x="70" y="46" font-weight="700">σ<tspan dy="0.217em" font-size="92%">y</tspan><tspan dy="-0.2em"> (MPa)</tspan></text><line x1="56" y1="56" x2="56" y2="326" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="56" y1="326" x2="336" y2="326" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="51" y1="236" x2="56" y2="236" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="48" y="241" text-anchor="end">500</text><line x1="51" y1="146" x2="56" y2="146" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="48" y="151" text-anchor="end">1000</text><line x1="51" y1="56" x2="56" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="48" y="61" text-anchor="end">1500</text><line x1="77.1" y1="326" x2="77.1" y2="331" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="87.1" y="350" text-anchor="end" font-weight="700">1 μm</text><line x1="122.6" y1="326" x2="122.6" y2="331" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="116.6" y="350" font-weight="700">100 nm</text><line x1="266.8" y1="326" x2="266.8" y2="331" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="266.8" y="350" text-anchor="middle" font-weight="700">10 nm</text><text x="60" y="374">결정립 작아짐 →  d<tspan dy="-0.435em" font-size="92%">-1/2</tspan></text><polyline points="266.8,123.5 330,64.1" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2" stroke-dasharray="5 4"/><polyline points="56,321.5 266.8,123.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><path d="M266.8,123.5 C269,123.9 275.5,124.3 280,126 C284.5,127.8 289.3,129.7 294,134 C298.7,138.3 303.3,144.3 308,152 C312.7,159.7 319.7,175.3 322,180" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="266.8" y1="56" x2="266.8" y2="326" style="stroke:currentColor;fill:none" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="77.1" cy="301.7" r="4.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="122.6" cy="258.9" r="4.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="266.8" cy="123.5" r="4.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="85.1" y="319.7" font-weight="700">135</text><text x="114.6" y="250.9" text-anchor="end" font-weight="700">373</text><text x="222" y="113.5" font-weight="700">1125</text><text x="64" y="70" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">σ<tspan dy="0.217em" font-size="92%">y</tspan><tspan dy="-0.2em"> = σ</tspan><tspan dy="0.217em" font-size="92%">0</tspan><tspan dy="-0.2em"> + k·d</tspan><tspan dy="-0.435em" font-size="92%">-1/2</tspan></text><text x="64" y="94" style="fill:var(--si-general,#5c6b7f)">(수치는 이해용 가정값)</text><text x="274" y="214" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">역홀-페치</text><text x="274" y="256" font-weight="700">임계 크기</text><text x="274" y="280" font-weight="700">≈ 10 nm</text><text x="14" y="410" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">큰 결정립: 전위 퇴적</text><path d="M122,480 L96,434.968 L44,434.968 L18,480 L44,525.032 L96,525.032 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><path d="M90,458 H102 M96,458 V445" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><path d="M90,476 H102 M96,476 V463" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><path d="M90,494 H102 M96,494 V481" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><path d="M90,512 H102 M96,512 V499" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="18" y1="480" x2="48" y2="480" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#inverse-hall-petch-effect-ar)"/><text x="14" y="560">입계에 전위가 쌓인다</text><text x="190" y="410" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">작은 결정립: 입계 미끄러짐</text><path d="M258,458 L247,438.948 L225,438.948 L214,458 L225,477.052 L247,477.052 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><path d="M258,496 L247,476.948 L225,476.948 L214,496 L225,515.052 L247,515.052 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><path d="M291,477 L280,457.948 L258,457.948 L247,477 L258,496.052 L280,496.052 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><path d="M324,458 L313,438.948 L291,438.948 L280,458 L291,477.052 L313,477.052 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><path d="M324,496 L313,476.948 L291,476.948 L280,496 L291,515.052 L313,515.052 Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><line x1="224" y1="477" x2="250" y2="477" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#inverse-hall-petch-effect-ar-1)"/><line x1="316" y1="477" x2="290" y2="477" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#inverse-hall-petch-effect-ar-1)"/><text x="190" y="560">입계를 따라 미끄러진다</text><text x="14" y="596" font-weight="700">10 nm 부근을 넘어 더 작아지면</text><text x="14" y="620" font-weight="700">강도가 오르지 않고 낮아진다.</text><text x="14" y="646" style="fill:var(--si-general,#5c6b7f)">임계 크기는 재료·조건에 따라 다르다.</text></svg>
