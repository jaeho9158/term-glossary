<svg class="si si-illus" viewBox="0 0 360 632" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cognitive-restructuring-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cognitive-restructuring-t">인지재구조화: 사고기록지 네 단계와 감정 강도의 변화</title><defs><marker id="cognitive-restructuring-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">사고기록지(가상의 예)</text><rect x="14" y="36" width="332" height="64" rx="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="26" y="58" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">① 상황과 감정</text><text x="26" y="82">발표에서 실수한 직후 · 불안 80</text><line x1="180" y1="102" x2="180" y2="116" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#cognitive-restructuring-ar)"/><rect x="14" y="118" width="332" height="88" rx="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="26" y="140" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">② 자동적 사고</text><text x="26" y="164">“나는 또 실수했어.</text><text x="26" y="184">다들 나를 무능하다고 볼 거야.”</text><line x1="180" y1="208" x2="180" y2="222" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#cognitive-restructuring-ar)"/><rect x="14" y="224" width="332" height="134" rx="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="26" y="246" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">③ 근거 따져 보기(소크라테스식 질문)</text><rect x="26" y="258" width="148" height="64" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="100" y="280" text-anchor="middle" font-weight="700">지지 증거: 발표에서</text><text x="100" y="300" text-anchor="middle" font-weight="700">실수했다</text><rect x="186" y="258" width="148" height="64" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-bg,#ffffff)" stroke-width="2.4"/><text x="260" y="280" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">반증: 지난 발표는</text><text x="260" y="300" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">잘 되었다</text><text x="26" y="346" font-weight="700">긍정 강요가 아니라 증거 대조</text><line x1="180" y1="360" x2="180" y2="374" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#cognitive-restructuring-ar)"/><rect x="14" y="376" width="332" height="108" rx="8" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><text x="26" y="398" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">④ 대안적 생각과 재평가</text><text x="26" y="422">한 번 실수했다고 무능한 것은 아니다.</text><text x="26" y="442">지난 발표는 잘 되었다.</text><text x="26" y="468" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">불안 45</text><text x="14" y="520" font-weight="700">감정 강도 0–100</text><line x1="24" y1="582" x2="336" y2="582" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="24" y1="577" x2="24" y2="587" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="24" y="606" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="336" y1="577" x2="336" y2="587" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="336" y="606" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">100</text><circle cx="273.6" cy="582" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4"/><circle cx="164.4" cy="582" r="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4"/><text x="273.6" y="606" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">80</text><text x="164.4" y="606" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">45</text><line x1="265.6" y1="566" x2="172.4" y2="566" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#cognitive-restructuring-ar)"/><text x="219" y="552" text-anchor="middle" font-weight="700">−35</text></svg>
