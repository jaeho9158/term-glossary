<svg class="si si-illus" viewBox="0 0 360 628" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="congruence-and-similarity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="congruence-and-similarity-t">합동과 닮음: 닮음비 k이면 넓이비는 k²</title><defs></defs><text x="14" y="24" font-weight="700">① 합동: 닮음비 1</text><polygon points="30,100 94,100 30,52" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><polygon points="190,52 126,52 190,100" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="62" y="118" text-anchor="middle">4</text><text x="18" y="80" text-anchor="end">3</text><text x="66" y="72">5</text><text x="158" y="44" text-anchor="middle">4</text><text x="202" y="80">3</text><text x="114" y="90" text-anchor="end">5</text><text x="214" y="58" style="fill:var(--si-accent,#2454ff)">이동·회전하면</text><text x="214" y="84" style="fill:var(--si-accent,#2454ff)">완전히 겹침</text><text x="14" y="152" font-weight="700">② 닮음: 닮음비 2</text><polygon points="30,246 94,246 30,198" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><polygon points="150,270 278,270 150,174" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><text x="62" y="264" text-anchor="middle">4</text><text x="18" y="226" text-anchor="end">3</text><text x="70" y="212">5</text><text x="214" y="288" text-anchor="middle">8</text><text x="138" y="226" text-anchor="end">6</text><text x="220" y="212">10</text><path d="M80.0 246.0 A14 14 0 0 1 82.8 237.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4"/><path d="M39.6 205.2 A12 12 0 0 1 30.0 210.0" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4"/><path d="M43.6 208.2 A17 17 0 0 1 30.0 215.0" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4"/><path d="M258.0 270.0 A20 20 0 0 1 262.0 258.0" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.4"/><path d="M162.8 183.6 A16 16 0 0 1 150.0 190.0" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.4"/><path d="M167.6 187.2 A22 22 0 0 1 150.0 196.0" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.4"/><polyline points="39,246 39,237 30,237" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2"/><polyline points="159,270 159,261 150,261" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.2"/><text x="180" y="312" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">같은 호 표시 = 같은 각 → 모양이 같다</text><text x="14" y="350" font-weight="700">③ 넓이비: 2² = 4</text><polygon points="30,470 94,470 30,422" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><polygon points="94,470 158,470 94,422" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><polygon points="30,422 94,422 30,374" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><polygon points="94,470 94,422 30,422" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="46" y="461" text-anchor="middle">1</text><text x="126" y="461" text-anchor="middle">2</text><text x="46" y="412" text-anchor="middle">3</text><text x="83" y="442" text-anchor="middle" font-weight="700">4</text><text x="176" y="392">6-8-10 삼각형 안에</text><text x="176" y="416">3-4-5 삼각형이</text><text x="176" y="440" font-weight="700">4개 들어간다</text><text x="176" y="468" font-weight="700" style="fill:var(--si-accent,#2454ff)">넓이 6 × 4 = 24</text><text x="176" y="492" style="fill:var(--si-general,#5c6b7f)">(길이 2배 → 넓이 4배)</text><line x1="14" y1="512" x2="346" y2="512" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="14" y="532" font-weight="700">합동 조건: SSS · SAS · ASA</text><text x="14" y="558" font-weight="700">닮음 조건: AA · SAS · SSS</text><text x="14" y="588">1:50 모형: 길이 1/50, 넓이 1/2,500,</text><text x="14" y="612">부피 1/125,000 (비 k, k², k³)</text></svg>
