<svg class="si si-illus" viewBox="0 0 360 508" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="consumer-well-being-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="consumer-well-being-t">소비자 웰빙: 소득에 따른 삶에 대한 평가와 정서적 웰빙</title><defs><marker id="consumer-well-being-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">소득과 두 가지 웰빙 지표</text><line x1="40" y1="50" x2="40" y2="270" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="40" y1="270" x2="342" y2="270" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#consumer-well-being-ar)"/><text x="46" y="54" style="fill:var(--si-general,#5c6b7f)">웰빙 수준(상대)</text><text x="342" y="292" text-anchor="end">연소득 (로그 눈금) →</text><path d="M40,236 C53.3,229.3 93.3,208.7 120,196 C146.7,183.3 173.3,171.7 200,160 C226.7,148.3 257.3,135.7 280,126 C302.7,116.3 326.7,106 336,102" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><path d="M40,244 C48.3,237.7 71.7,218 90,206 C108.3,194 131.7,181 150,172 C168.3,163 181.7,156.3 200,152 C218.3,147.7 237.3,147.3 260,146 C282.7,144.7 323.3,144.3 336,144" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6"/><line x1="200" y1="270" x2="200" y2="118" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><text x="200" y="106" text-anchor="middle" font-weight="700">약 7만 5천 달러</text><text x="336" y="88" text-anchor="end" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">삶에 대한 평가</text><text x="336" y="172" text-anchor="end" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">정서적 웰빙</text><text x="336" y="192" text-anchor="end" style="fill:var(--si-amber-s,#d79a2b)">(정체)</text><text x="8" y="314" style="fill:var(--si-blue-s,#7f9ac0)">삶에 대한 평가: 소득·교육과 더 밀접</text><text x="8" y="336" style="fill:var(--si-amber-s,#d79a2b)">정서적 웰빙: 건강·돌봄·외로움이</text><text x="8" y="356" style="fill:var(--si-amber-s,#d79a2b)">더 잘 예측</text><text x="8" y="388" style="fill:var(--si-general,#5c6b7f)">Kahneman &amp; Deaton(2010): 미국 Gallup-</text><text x="8" y="408" style="fill:var(--si-general,#5c6b7f)">Healthways 45만 건 이상 응답, 한 시기 조사</text><text x="8" y="448" style="fill:var(--si-general,#5c6b7f)">반론: Killingsworth(2021)는 행복이 로그 소득과</text><text x="8" y="468" style="fill:var(--si-general,#5c6b7f)">함께 계속 오른다고 보고했고, 2023년 재분석은</text><text x="8" y="488" style="fill:var(--si-general,#5c6b7f)">정체가 가장 덜 행복한 사람들에게만 나타난다고 봤다.</text></svg>
