>2</text><circle cx="180" cy="150" r="8.5" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="180" y="155" text-anchor="middle">3</text><circle cx="284" cy="150" r="8.5" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="284" y="155" text-anchor="middle">4</text><text x="180" y="388" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">규정 거리 이상 이격</text><text x="14" y="424">① 이중선체(바깥·안쪽 선체 겹선)</text><text x="14" y="444">② 탱크마다 독립 배관·펌프(톱니 기호)</text><text x="14" y="464">③ 붉은 탱크: 고위험 화물(파랑: 그 밖의 화물)</text><text x="14" y="484">④ 탱크 내벽: 스테인리스강(316L·듀플렉스)</text><text x="34" y="504">또는 에폭시 계열 코팅</text><text x="14" y="552" font-weight="700">선형 구분(위험이 클수록 요건이 엄격)</text><text x="14" y="572">1형: 가장 큰 위험</text><text x="14" y="592">2형: 상당한 위험</text><text x="14" y="612">3형: 그보다 가벼운 위험(중간 수준 격납)</text><text x="14" y="660">원양 케미컬탱커 약 5,000~35,000 dwt</text><text x="14" y="680" style="fill:var(--si-general,#5c6b7f)">화물을 바꿀 때는 탱크 세정·적합성 확인이 필요하다</text></svg>
