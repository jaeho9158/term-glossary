<svg class="si si-illus" viewBox="0 0 360 588" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composite-reliability-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="composite-reliability-t">합성신뢰도: 적재량을 설명 부분과 오차 부분으로 나누어 계산</title><defs></defs><rect x="14" y="12" width="12" height="12" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><text x="32" y="23">개념이 설명하는 부분 λ²</text><rect x="14" y="32" width="12" height="12" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="32" y="43">오차분산 1 − λ²</text><text x="8" y="78">문항 1</text><text x="92" y="78" text-anchor="end" font-weight="700">λ=.82</text><rect x="96" y="64" width="147.9" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><rect x="243.9" y="64" width="72.1" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="8" y="108">문항 2</text><text x="92" y="108" text-anchor="end" font-weight="700">λ=.78</text><rect x="96" y="94" width="133.8" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><rect x="229.8" y="94" width="86.2" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="8" y="138">문항 3</text><text x="92" y="138" text-anchor="end" font-weight="700">λ=.74</text><rect x="96" y="124" width="120.5" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><rect x="216.5" y="124" width="99.5" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="8" y="168">문항 4</text><text x="92" y="168" text-anchor="end" font-weight="700">λ=.69</text><rect x="96" y="154" width="104.7" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><rect x="200.7" y="154" width="115.3" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="8" y="198">문항 5</text><text x="92" y="198" text-anchor="end" font-weight="700">λ=.55</text><rect x="96" y="184" width="66.6" height="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2.4"/><rect x="162.6" y="184" width="153.4" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2.4"/><text x="96" y="226" style="fill:var(--si-general,#5c6b7f)">문항 5(.55)는 오차 부분이 가장 길다</text><text x="16" y="254">Σλ = 3.58, Σλ² = 2.607, Σ(1 − λ²) = 2.393</text><rect x="56" y="278" width="185.4" height="18" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><rect x="241.4" y="278" width="34.6" height="18" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="56" y="318" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">(Σλ)² = 12.816</text><text x="296" y="318" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">Σ(1 − λ²) = 2.393</text><text x="180" y="346" text-anchor="middle" font-weight="700">ρ<tspan dy="0.217em" font-size="92%">c</tspan><tspan dy="-0.2em"> = 12.816 ÷ (12.816 + 2.393) = .843</tspan></text><text x="14" y="402" font-weight="700">ρ<tspan dy="0.217em" font-size="92%">c</tspan></text><rect x="90" y="390" width="210" height="14" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><rect x="90" y="390" width="177" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><line x1="237" y1="384" x2="237" y2="410" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="237" y="378" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">기준 .70</text><text x="90" y="426" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><text x="300" y="426" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1</text><text x="240" y="422" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">.843</text><text x="14" y="470" font-weight="700">AVE</text><rect x="90" y="458" width="210" height="14" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><rect x="90" y="458" width="109.4" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><line x1="195" y1="452" x2="195" y2="478" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="195" y="446" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">기준 .50</text><text x="90" y="494" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><text x="300" y="494" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">1</text><text x="198" y="490" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">.521</text><text x="16" y="518" style="fill:var(--si-general,#5c6b7f)">AVE는 기준 .50을 겨우 넘는다.</text><text x="16" y="546">ρ<tspan dy="0.217em" font-size="92%">c</tspan><tspan dy="-0.2em"> = (Σλ)² ÷ [(Σλ)² + Σ(1 − λ²)]</tspan></text><text x="16" y="566">AVE = Σλ² ÷ 문항 수</text></svg>
