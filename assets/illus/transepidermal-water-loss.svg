<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transepidermal-water-loss-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="transepidermal-water-loss-t">경피수분손실(TEWL) 측정의 원리</title><defs><marker id="transepidermal-water-loss-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><rect x="60" y="210" width="280" height="22" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.3"/><text x="200" y="224" text-anchor="middle" font-size="12">각질층</text><rect x="60" y="232" width="280" height="50" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.15"/><text x="200" y="262" text-anchor="middle" font-size="12">표피·진피</text><rect x="150" y="90" width="100" height="120" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.1"/><text x="200" y="76" text-anchor="middle" font-size="12">원통 챔버(개방)</text><rect x="160" y="184" width="80" height="12" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.2" fill-opacity="0.35"/><text x="262" y="194" font-size="11">센서 쌍 ①(낮은 위치)</text><rect x="160" y="124" width="80" height="12" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.2" fill-opacity="0.35"/><text x="262" y="134" font-size="11">센서 쌍 ②(높은 위치)</text><line x1="175" y1="206" x2="175" y2="100" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#transepidermal-water-loss-ar)"/><line x1="200" y1="206" x2="200" y2="100" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#transepidermal-water-loss-ar)"/><line x1="225" y1="206" x2="225" y2="100" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#transepidermal-water-loss-ar)"/><text x="95" y="170" text-anchor="middle" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">수증기 확산</text><text x="30" y="40" font-size="12">두 높이의 수증기 압력 기울기로 수분 손실을 구한다</text><text x="30" y="302" font-size="11">단위 g/(m²·h): 정상 피부 약 2.3~44, 중증 화상은 50을 넘고 때로 100을 넘음</text></svg>
