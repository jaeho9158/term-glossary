<svg class="si si-illus" viewBox="0 0 360 468" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="asymmetric-catalysis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="asymmetric-catalysis-t">비대칭 촉매의 활성화 에너지 차와 선택성</title><defs><marker id="asymmetric-catalysis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-size="14" font-weight="700">비대칭 촉매: 두 경로의 활성화 에너지 차</text><line x1="40" y1="240" x2="40" y2="40" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#asymmetric-catalysis-ar)"/><line x1="40" y1="240" x2="340" y2="240" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#asymmetric-catalysis-ar)"/><text x="14" y="36">자유에너지</text><text x="340" y="260" text-anchor="end">반응 진행</text><line x1="46" y1="190" x2="92" y2="190" style="stroke:currentColor;fill:none" stroke-width="2.2"/><path d="M92,190 C96.7,186.3 110.3,181.3 120,168 C129.7,154.7 140.3,110 150,110 C159.7,110 168.7,151 178,168 C187.3,185 194,203 206,212 C218,221 242.7,220.3 250,222" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.8"/><path d="M92,190 C96.7,183.3 110.3,171 120,150 C129.7,129 140.3,64 150,64 C159.7,64 168.7,126.5 178,150 C187.3,173.5 194,193 206,205 C218,217 242.7,219.2 250,222" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="250" y1="222" x2="330" y2="222" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="150" y1="64" x2="236" y2="64" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1" stroke-dasharray="2 3"/><line x1="150" y1="110" x2="236" y2="110" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1" stroke-dasharray="2 3"/><line x1="226" y1="66" x2="226" y2="108" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#asymmetric-catalysis-ar)" marker-start="url(#asymmetric-catalysis-ar)"/><text x="234" y="92" font-size="14" font-weight="700">ΔΔG‡</text><text x="46" y="214">프로키랄 기질</text><text x="46" y="230">+ 키랄 촉매</text><text x="138" y="58" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">높은 장벽</text><text x="138" y="76" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">(느림, 점선)</text><text x="214" y="146" font-weight="700" style="fill:var(--si-green-t,#14543c)">낮은 장벽:</text><text x="214" y="164" font-weight="700" style="fill:var(--si-green-t,#14543c)">더 빨리 생김</text><text x="346" y="196" text-anchor="end">거울상 이성질체</text><text x="346" y="212" text-anchor="end">한 쌍 (에너지 같음)</text><text x="180" y="292" text-anchor="middle" font-weight="700">생성물 R : S 비율 → 선택성 ee</text><rect x="20" y="304" width="171" height="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="191" y="304" width="19" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="24" y="319" font-weight="700">90:10</text><text x="220" y="319" font-weight="700">ee 80%</text><rect x="20" y="338" width="180.5" height="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="200.5" y="338" width="9.5" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="24" y="353" font-weight="700">95:5</text><text x="220" y="353" font-weight="700">ee 90%</text><rect x="20" y="372" width="188.1" height="20" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><rect x="208.1" y="372" width="1.9" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="24" y="387" font-weight="700">99:1</text><text x="220" y="387" font-weight="700">ee 98%</text><text x="180" y="424" text-anchor="middle">ee = |R − S| / (R + S) × 100 (%)</text><text x="180" y="452" text-anchor="middle" font-weight="700">선택성은 ΔΔG‡와 온도로 정해진다</text></svg>
