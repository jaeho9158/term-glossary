:var(--si-general,#5c6b7f)">5</text><text x="195" y="416" text-anchor="middle">시간 (ms)</text><line x1="60" y1="36" x2="330" y2="36" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 4"/><line x1="60" y1="348" x2="330" y2="348" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 4"/><line x1="60" y1="310" x2="330" y2="310" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="60" y1="280" x2="330" y2="280" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="200" y="29" style="fill:var(--si-general,#5c6b7f)">E<tspan baseline-shift="sub" font-size="72%">Na</tspan> ≈ +67 mV</text><text x="200" y="367" style="fill:var(--si-general,#5c6b7f)">E<tspan baseline-shift="sub" font-size="72%">K</tspan> ≈ −89 mV</text><text x="6" y="315">−70</text><text x="6" y="285" style="fill:var(--si-rose-s,#c97b7b)">−55</text><path d="M60,310 C65,310 82.5,315 89.7,310 C96.9,305 99.2,303.3 103.2,280 C107.3,256.7 110.4,200 114,170 C117.6,140 123,111.7 124.8,100" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><path d="M124.8,100 C127,105 133.8,108.3 138.3,130 C142.8,151.7 146.9,200.7 151.8,230 C156.8,259.3 165.3,293.3 168,306" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3.4"/><path d="M168,306 C171.6,310 181.5,325.3 189.6,330 C197.7,334.7 204.9,335.3 216.6,334 C228.3,332.7 240.9,326 259.8,322 C278.7,318 318.3,312 330,310" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><circle cx="103.2" cy="280" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="138.8" y="104">정점 +30~+40 mV</text><text x="180" y="190" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">탈분극:</text><text x="180" y="214" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">Na⁺ 유입</text><line x1="176" y1="206" x2="112.4" y2="220" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><text x="175" y="130" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">재분극: Na⁺ 불활성화,</text><text x="175" y="154" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">K⁺ 유출</text><line x1="172" y1="144" x2="143.7" y2="160" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1"/><text x="205" y="240" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">과분극:</text><text x="205" y="264" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">K⁺ 통로 늦게 닫힘</text><line x1="245" y1="270" x2="216.6" y2="330" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1"/><line x1="103.2" y1="66" x2="168" y2="66" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#action-potential-ar)" marker-start="url(#action-potential-ar)"/><text x="135.6" y="60" text-anchor="middle">1~2 ms</text><text x="180" y="452" text-anchor="middle" font-weight="700">전부 아니면 전무: 크기 일정, 강한 자극은 횟수 증가</text><text x="6" y="502" style="fill:var(--si-general,#5c6b7f)">약한 자극</text><text x="6" y="550" style="fill:var(--si-general,#5c6b7f)">강한 자극</text><line x1="100" y1="506" x2="335" y2="506" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><line x1="100" y1="554" x2="335" y2="554" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><polyline points="130,506 135,506 139,480 143,506 149,509 154,506" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><polyline points="250,506 255,506 259,480 263,506 269,509 274,506" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><polyline points="110,554 115,554 119,528 123,554 129,557 134,554" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><polyline points="150,554 155,554 159,528 163,554 169,557 174,554" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><polyline points="190,554 195,554 199,528 203,554 209,557 214,554" style="stroke:var(--si-blue-s,#