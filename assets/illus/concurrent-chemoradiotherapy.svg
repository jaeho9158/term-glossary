<svg class="si si-illus" viewBox="0 0 360 722" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concurrent-chemoradiotherapy-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="concurrent-chemoradiotherapy-t">동시 항암방사선치료의 사망 위험비와 병용 시점 비교</title><defs></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">동시 항암방사선치료: 효과와 병용 방식</text><text x="250" y="50" text-anchor="end" style="fill:var(--si-green-t,#14543c)">← 병용 유리</text><text x="260" y="50">단독 유리 →</text><line x1="255" y1="92" x2="255" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.3" stroke-dasharray="4 3"/><text x="16" y="84">MACH-NC 2000 (95% 신뢰구간 0.85~0.94)</text><text x="344" y="84" text-anchor="end" font-weight="700">HR 0.90</text><line x1="142.5" y1="100" x2="210" y2="100" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="142.5" y1="95" x2="142.5" y2="105" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="210" y1="95" x2="210" y2="105" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="175" y="95" width="10" height="10" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2"/><text x="16" y="128">MACH-NC 2009 갱신</text><text x="344" y="128" text-anchor="end" font-weight="700">HR 0.88</text><rect x="160" y="139" width="10" height="10" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2"/><text x="16" y="172" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">동시 병용 시험 50편</text><text x="344" y="172" text-anchor="end" font-weight="700">HR 0.81</text><rect x="107.5" y="183" width="10" height="10" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.2"/><text x="16" y="216">자궁경부암 메타분석</text><text x="344" y="216" text-anchor="end" font-weight="700">HR 0.81</text><text x="126.5" y="237">5년 생존율 +6%</text><rect x="107.5" y="227" width="10" height="10" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2"/><line x1="30" y1="256" x2="330" y2="256" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="30" y1="251" x2="30" y2="261" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="30" y="280" text-anchor="middle">0.7</text><line x1="105" y1="251" x2="105" y2="261" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="105" y="280" text-anchor="middle">0.8</text><line x1="180" y1="251" x2="180" y2="261" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="180" y="280" text-anchor="middle">0.9</text><line x1="255" y1="251" x2="255" y2="261" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="255" y="280" text-anchor="middle">1.0</text><line x1="330" y1="251" x2="330" y2="261" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="330" y="280" text-anchor="middle">1.1</text><text x="180" y="302" text-anchor="middle">사망 위험비 (HR, 1보다 작을수록 병용 유리)</text><line x1="16" y1="318" x2="344" y2="318" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="342" text-anchor="middle" font-weight="700">병용 시점 비교 (모식, 길이는 비례하지 않음)</text><rect x="60" y="354" width="14" height="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="80" y="366">방사선</text><rect x="150" y="354" width="14" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.2"/><text x="170" y="366">항암화학요법</text><text x="16" y="396" font-weight="700">동시(concomitant)</text><rect x="90" y="404" width="220" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="90" y="424" width="220" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><rect x="86" y="400" width="228" height="50" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" stroke-dasharray="4 3"/><text x="16" y="474" font-weight="700" style="fill:var(--si-green-t,#14543c)">겹치는 구간: 방사선증감 효과</text><text x="16" y="494" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">대가: 급성 독성↑(점막염·골수억제 등)</text><text x="16" y="528" font-weight="700">유도(induction): 항암 → 방사선</text><rect x="200" y="536" width="120" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="40" y="556" width="140" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="16" y="596" font-weight="700">보조(adjuvant): 방사선 → 항암</text><rect x="40" y="604" width="140" height="16" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="200" y="624" width="120" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><line x1="16" y1="658" x2="344" y2="658" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="680">종양의 저산소 세포는 방사선에 2~3배 더 저항할 수 있다.</text><text x="16" y="700">항암제의 방사선증감 효과로 국소제어율을 높인다.</text></svg>
