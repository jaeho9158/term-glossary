:var(--si-general,#5c6b7f)">음이온 중간체</text><text x="222" y="418" style="fill:var(--si-general,#5c6b7f)">이소시아네이트</text><text x="20" y="592" font-weight="700">탄소 하나가 줄고 1차 아민이 생긴다.</text><text x="20" y="614" style="fill:var(--si-general,#5c6b7f)">R의 입체 배열은 보존된다 (쿠르티우스 자리옮김과 유사).</text><text x="20" y="633" style="fill:var(--si-general,#5c6b7f)">이소시아네이트를 분리해 쓰기도 한다.</text></svg>
