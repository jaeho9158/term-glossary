tyle="fill:var(--si-general,#5c6b7f)">대상을 포획</text><text x="146" y="214" font-weight="700">3. 자가포식소체 형성</text><text x="146" y="236" style="fill:var(--si-general,#5c6b7f)">LC3-I → LC3-II 전환</text><text x="146" y="284" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">4. 리소좀 융합</text><text x="146" y="306" style="fill:var(--si-general,#5c6b7f)">내용물을 리소좀으로 운반</text><text x="146" y="354" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">5. 분해·재활용</text><text x="146" y="376" style="fill:var(--si-general,#5c6b7f)">아미노산·지방산 재사용</text><line x1="20" y1="414" x2="340" y2="414" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="438" font-weight="700">분해가 진행되는지 보는 표지</text><text x="20" y="462">LC3-I이 LC3-II로 바뀜: 소체 형성</text><text x="20" y="482">p62(SQSTM1) 감소: 분해 진행</text><text x="20" y="516" style="fill:var(--si-general,#5c6b7f)">자가포식 유입(flux): 리소좀까지 도달해</text><text x="20" y="536" style="fill:var(--si-general,#5c6b7f)">분해되는 전체 흐름</text><text x="20" y="570" style="fill:var(--si-general,#5c6b7f)">조절: mTOR, AMPK 등 영양·에너지 감지 경로</text></svg>
