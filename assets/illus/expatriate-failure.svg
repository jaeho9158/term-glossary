<svg class="si si-illus" viewBox="0 0 360 556" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expatriate-failure-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="expatriate-failure-t">주재원 실패: 정의 범위별 비율과 비용</title><defs><marker id="expatriate-failure-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">주재원 실패: 정의에 따라 범위가 달라진다</text><circle cx="180" cy="195" r="150" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.4" stroke-dasharray="7 5" fill-opacity="0.5"/><circle cx="180" cy="240" r="105" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="180" cy="290" r="55" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.6"/><text x="180" y="98" text-anchor="middle">파견 직후 이직까지 포함</text><text x="180" y="164" text-anchor="middle">+ 임기는 채웠으나</text><text x="180" y="186" text-anchor="middle">기대 성과 미달</text><text x="180" y="274" text-anchor="middle">조기 귀임</text><text x="180" y="300" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">약 7%</text><text x="180" y="366" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">약 7%: Mayrhofer 등(2012)의 인용값</text><text x="180" y="386" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">임기 중 저성과·퇴사는 포함하지 않음</text><text x="180" y="408" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">흔히 인용되는 25~40%는</text><text x="180" y="428" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">근거 빈약 (Harzing 1995)</text><line x1="14" y1="440" x2="346" y2="440" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="180" y="464" text-anchor="middle" font-weight="700">실패의 대가: 주재원 한 명의 비용</text><text x="10" y="498">현지 직원</text><rect x="86" y="480" width="56" height="26" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="114" y="498" text-anchor="middle" font-weight="700">1</text><text x="10" y="534">주재원</text><rect x="86" y="516" width="168" height="26" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="170" y="534" text-anchor="middle" font-weight="700">3배 이상</text><line x1="254" y1="529" x2="286" y2="529" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#expatriate-failure-ar)"/></svg>
