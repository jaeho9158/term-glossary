<svg class="si si-illus" viewBox="0 0 360 410" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="이화: 떨어진 두 같은 음 중 한쪽이 바뀌는 음소 배열" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="dissimilation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">이화: 같은 소리가 떨어져 있으면 한쪽이 바뀐다</text><text x="14" y="52" font-weight="700">라틴어 -alis → -aris</text><rect x="40" y="100" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="58" y="121" text-anchor="middle" font-weight="400">l</text><rect x="80" y="100" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="98" y="121" text-anchor="middle" font-weight="400">u</text><rect x="120" y="100" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="138" y="121" text-anchor="middle" font-weight="400">n</text><rect x="160" y="100" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="178" y="121" text-anchor="middle" font-weight="400">a</text><rect x="200" y="100" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="218" y="121" text-anchor="middle" font-weight="400">l</text><rect x="240" y="100" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="258" y="121" text-anchor="middle" font-weight="400">i</text><rect x="280" y="100" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="298" y="121" text-anchor="middle" font-weight="400">s</text><path d="M 58 98 C 58 52, 218 52, 218 98" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><text x="138" y="80" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">같은 l 반복</text><line x1="218" y1="134" x2="218" y2="154" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#dissimilation-ar)"/><rect x="40" y="160" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="58" y="181" text-anchor="middle" font-weight="400">l</text><rect x="80" y="160" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="98" y="181" text-anchor="middle" font-weight="400">u</text><rect x="120" y="160" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="138" y="181" text-anchor="middle" font-weight="400">n</text><rect x="160" y="160" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="178" y="181" text-anchor="middle" font-weight="400">a</text><rect x="200" y="160" width="36" height="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2.4"/><text x="218" y="181" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">r</text><rect x="240" y="160" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="258" y="181" text-anchor="middle" font-weight="400">i</text><rect x="280" y="160" width="36" height="30" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="298" y="181" text-anchor="middle" font-weight="400">s</text><text x="180" y="214" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">어간에 l이 있으면 접미사의 l이 r로 (lunaris)</text><text x="14" y="256" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">인접하지 않아도 작용한다 = 원격 이화</text><text x="14" y="300" font-weight="700" style="fill:var(--si-general,#5c6b7f)">동화</text><text x="66" y="300" style="fill:var(--si-general,#5c6b7f)">A B → A A</text><text x="14" y="326" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">이화</text><text x="66" y="326" style="fill:var(--si-blue-s,#7f9ac0)">A A → A B</text><text x="14" y="364" style="fill:var(--si-general,#5c6b7f)">동화는 조음적 편의</text><text x="14" y="390" font-weight="500" style="fill:var(--si-general,#5c6b7f)">이화는 지각적 오분석 설명이 많다</text></svg>
