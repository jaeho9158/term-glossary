entColor" stroke-width="1" fill-opacity="0.85"/><text x="58.8" y="73.6" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">F</text><ellipse cx="266" cy="110" rx="9.1" ry="6.3" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="285.6" y="115.6" style="fill:var(--si-general,#5c6b7f)">G</text><ellipse cx="266" cy="89" rx="9.1" ry="6.3" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="285.6" y="94.6" style="fill:var(--si-general,#5c6b7f)">C</text><ellipse cx="266" cy="75" rx="9.1" ry="6.3" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="285.6" y="80.6" style="fill:var(--si-general,#5c6b7f)">E</text><line x1="98" y1="96" x2="233.8" y2="90.8" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8" marker-end="url(#dominant-chord-ar)"/><line x1="98" y1="68" x2="233.8" y2="73.2" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#dominant-chord-ar-1)"/><line x1="98" y1="110" x2="240.8" y2="110" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/><text x="175" y="40" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">F → E: 7음이 한 단계 하행</text><text x="175" y="150" text-anchor="middle" font-size="12" style="fill:var(--si-accent,#2454ff)">B → C: 이끔음이 반음 상행</text><text x="110" y="184" text-anchor="middle" font-weight="700">V₇ 딸림7화음</text><text x="240" y="184" text-anchor="middle" font-weight="700">I 으뜸화음</text><text x="40" y="226" font-size="12" style="fill:var(--si-general,#5c6b7f)">다장조(C major) 예: 높은음자리표 기준</text><text x="40" y="250" font-size="12">B–F: 3음과 7음 사이 6반음(트라이톤)</text></svg>
