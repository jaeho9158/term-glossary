<svg class="si si-illus" viewBox="0 0 360 544" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bubble-diagram-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bubble-diagram-t">버블 다이어그램: 원 지름은 면적의 제곱근에 비례</title><defs></defs><text x="20" y="24" font-weight="700">올바른 버블: 지름이 면적의 제곱근에 비례</text><circle cx="100" cy="120" r="70" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="100" y="116" text-anchor="middle" font-weight="700">거실</text><text x="100" y="136" text-anchor="middle">36 m²</text><circle cx="235" cy="115" r="40" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="235" y="111" text-anchor="middle">주방</text><text x="235" y="131" text-anchor="middle">12 m²</text><circle cx="285" cy="190" r="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="285" y="186" text-anchor="middle">욕실</text><text x="285" y="206" text-anchor="middle">6 m²</text><line x1="169" y1="115" x2="195" y2="115" style="stroke:currentColor;fill:none" stroke-width="2.4"/><line x1="140" y1="178" x2="262" y2="185" style="stroke:currentColor;fill:none" stroke-width="2.4"/><text x="20" y="236" style="fill:var(--si-gray-t,#44546a)">원 크기 = 필요 면적(대략), 선 = 공간 사이의 연결</text><text x="20" y="274" font-weight="700">잘못: 지름을 면적에 정비례(점선 원)</text><circle cx="110" cy="332" r="23" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="210" cy="332" r="12" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="110" y="372" text-anchor="middle">주방 33%</text><text x="210" y="372" text-anchor="middle">욕실 17%</text><text x="20" y="414">거실 지름 = 100% 기준</text><text x="20" y="434">주방 58% (정비례면 33%)</text><text x="20" y="454">욕실 41% (정비례면 17%)</text><text x="20" y="494" font-size="18" font-weight="700">지름 ∝ √(면적)</text><text x="20" y="524" style="fill:var(--si-gray-t,#44546a)">버블 → 인접 매트릭스 → 블록 플랜 → 평면</text></svg>
