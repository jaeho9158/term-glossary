<svg class="si si-illus" viewBox="0 0 360 600" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cross-product-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cross-product-t">외적: 평행사변형과 수직 벡터</title><defs><marker id="cross-product-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="cross-product-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker><marker id="cross-product-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="cross-product-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><text x="20" y="22" font-weight="700">외적 a×b: 두 벡터에 수직인 벡터</text><g transform="translate(0,-26)"><polygon points="80,300 230,300 310,240 160,240" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2" fill-opacity="0.2"/><line x1="80" y1="300" x2="80" y2="90" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4"/><line x1="80" y1="110" x2="80" y2="86" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.4" marker-end="url(#cross-product-ar)"/><line x1="80" y1="300" x2="80" y2="350" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4" stroke-dasharray="6 4"/><line x1="80" y1="334" x2="80" y2="354" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4" marker-end="url(#cross-product-ar-1)"/><line x1="80" y1="300" x2="230" y2="300" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#cross-product-ar-2)"/><line x1="80" y1="300" x2="160" y2="240" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3" marker-end="url(#cross-product-ar-3)"/><polyline points="92,300 92,288 80,288" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6"/><path d="M 110 300 A 30 30 0 0 0 104 282" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="120" y="292" font-style="italic">θ</text><text x="236" y="322" font-weight="700" font-style="italic" style="fill:var(--si-blue-s,#7f9ac0)">a</text><text x="146" y="230" font-weight="700" font-style="italic" style="fill:var(--si-green-s,#5b9b83)">b</text><text x="92" y="84" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">a×b</text><text x="92" y="362" font-weight="700" style="fill:var(--si-general,#5c6b7f)">b×a = −(a×b)</text><text x="200" y="120" font-weight="700" style="fill:var(--si-accent,#2454ff)">평행사변형 넓이</text><text x="200" y="144" font-weight="700" style="fill:var(--si-accent,#2454ff)">= |a||b| sinθ</text><text x="200" y="168" font-weight="700" style="fill:var(--si-accent,#2454ff)">= |a×b|</text><path d="M 40 190 A 40 14 0 0 0 120 190" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><line x1="112" y1="197" x2="121" y2="190" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#cross-product-ar)"/><text x="128" y="196" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">오른손</text><text x="20" y="396" font-weight="700">오른손 법칙: 네 손가락을 a에서 b로</text><text x="20" y="420" font-weight="700">감으면 엄지가 a×b 방향이다.</text><text x="20" y="456" font-weight="700">순서를 바꾸면 방향이 반대가 된다.</text><rect x="14" y="480" width="332" height="128" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="24" y="504">a=(1,2,3), b=(4,5,6)</text><text x="24" y="528">a×b = (−3, 6, −3), |a×b| = √54 ≈ 7.348</text><text x="24" y="556">토크: r=(0.3,0,0) m, F=(0,20,0) N</text><text x="24" y="582" font-weight="700" style="fill:var(--si-accent,#2454ff)">τ = r×F = (0,0,6) N·m (z축 방향)</text></g></svg>
