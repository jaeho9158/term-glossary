<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sliding-window-technique-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="sliding-window-technique-t">슬라이딩 윈도우: 길이 3 창의 구간합</title><defs></defs><rect x="40" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="67.5" y="178" text-anchor="middle" font-size="15">2</text><text x="67.5" y="210" text-anchor="middle" font-size="10">0</text><rect x="95" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="122.5" y="178" text-anchor="middle" font-size="15">1</text><text x="122.5" y="210" text-anchor="middle" font-size="10">1</text><rect x="150" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="177.5" y="178" text-anchor="middle" font-size="15">5</text><text x="177.5" y="210" text-anchor="middle" font-size="10">2</text><rect x="205" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="232.5" y="178" text-anchor="middle" font-size="15">1</text><text x="232.5" y="210" text-anchor="middle" font-size="10">3</text><rect x="260" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="287.5" y="178" text-anchor="middle" font-size="15">3</text><text x="287.5" y="210" text-anchor="middle" font-size="10">4</text><rect x="315" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="342.5" y="178" text-anchor="middle" font-size="15">2</text><text x="342.5" y="210" text-anchor="middle" font-size="10">5</text><rect x="370" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="397.5" y="178" text-anchor="middle" font-size="15">9</text><text x="397.5" y="210" text-anchor="middle" font-size="10">6</text><rect x="425" y="150" width="55" height="44" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.1"/><text x="452.5" y="178" text-anchor="middle" font-size="15">4</text><text x="452.5" y="210" text-anchor="middle" font-size="10">7</text><rect x="313" y="142" width="169" height="55" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2.4" fill-opacity="0.12"/><rect x="258" y="126" width="169" height="92" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="400" y="238" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">창 [5..7]: 2+9+4 = 15 (최대)</text><text x="205" y="112" text-anchor="middle" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">이전 창 [4..6]: 3+2+9 = 14</text><text x="40" y="64" font-weight="700">고정 크기 창(길이 3): 한 칸씩 오른쪽으로</text><text x="40" y="90" font-size="12">새 합 = 이전 합 + 들어오는 원소 − 빠지는 원소</text><text x="40" y="262" font-size="11">창 합: [0..2]=8, [1..3]=7, [2..4]=9, [3..5]=6, [4..6]=14, [5..7]=15</text><text x="40" y="284" font-size="11">매번 다시 더하면 O(nk), 창 방식은 O(n)</text></svg>
