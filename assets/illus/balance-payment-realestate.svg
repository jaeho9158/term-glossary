<svg class="si si-illus" viewBox="0 0 360 524" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="balance-payment-realestate-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="balance-payment-realestate-t">부동산 잔금: 금액 구성과 동시이행</title><defs><marker id="balance-payment-realestate-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="balance-payment-realestate-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="balance-payment-realestate-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><line x1="36" y1="66" x2="36" y2="63.5" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="100" y1="100" x2="100" y2="109.7" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="8" y="24" font-weight="700">매매대금 5억 원 (가상 사례)</text><text x="20" y="56" style="fill:var(--si-general,#5c6b7f)">계약금 5,000만 원 (10%)</text><rect x="20" y="66" width="32" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><rect x="52" y="66" width="96" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><rect x="148" y="66" width="192" height="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="3" fill-opacity="0.38"/><text x="244" y="87" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">잔금 3억 원 (60%)</text><text x="52" y="124" style="fill:var(--si-general,#5c6b7f)">중도금 1억 5,000만 원 (30%)</text><line x1="8" y1="148" x2="352" y2="148" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.5"/><text x="8" y="172" font-weight="700">지급 순서 (시간)</text><line x1="20" y1="206" x2="340" y2="206" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#balance-payment-realestate-ar)"/><circle cx="70" cy="206" r="7" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="70" y="236" text-anchor="middle" font-weight="400">계약일</text><circle cx="180" cy="206" r="7" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="180" y="236" text-anchor="middle" font-weight="400">중도금일</text><circle cx="290" cy="206" r="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="290" y="236" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">잔금일</text><text x="8" y="268" style="fill:var(--si-general,#5c6b7f)">계약금: 이행 착수 전까지 해제 가능(제565조)</text><line x1="8" y1="296" x2="352" y2="296" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.5"/><text x="8" y="320" font-weight="700" style="fill:var(--si-blue-t,#12305c)">잔금일: 동시이행 (제568조 제2항)</text><path d="M36.3,398 L36.3,373.8 Q36.3,368.1 41.6,368.1 L50.4,368.1 Q55.7,368.1 55.7,373.8 L55.7,398Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><circle cx="46" cy="361" r="6.2" style="stroke:currentColor;fill:none" stroke-width="1.5"/><path d="M304.3,398 L304.3,373.8 Q304.3,368.1 309.6,368.1 L318.4,368.1 Q323.7,368.1 323.7,373.8 L323.7,398Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><circle cx="314" cy="361" r="6.2" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="46" y="422" text-anchor="middle">매수인</text><text x="314" y="422" text-anchor="middle">매도인</text><text x="180" y="350" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">잔금 3억 원</text><line x1="82" y1="362" x2="278" y2="362" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8" marker-end="url(#balance-payment-realestate-ar-1)"/><line x1="278" y1="394" x2="82" y2="394" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.8" marker-end="url(#balance-payment-realestate-ar-2)"/><text x="180" y="416" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">등기서류·열쇠(인도)</text><text x="8" y="466" font-weight="700">잔금 = 매매대금 − 계약금 − 중도금</text><text x="8" y="504">= 5억 − 5,000만 − 1억 5,000만 = 3억 원</text></svg>
