<svg class="si si-illus" viewBox="0 0 360 712" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drug-discrimination-test-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="drug-discrimination-test-t">약물 변별 검사: 두 레버와 용량-반응</title><defs><marker id="drug-discrimination-test-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="12" y="26" font-weight="700">① 훈련 상자 (옆에서 본 모습)</text><rect x="10" y="38" width="340" height="150" rx="4" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2.2"/><ellipse cx="70" cy="150" rx="30" ry="14" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.8" fill-opacity="0.6"/><circle cx="108" cy="138" r="11" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.8" fill-opacity="0.6"/><ellipse cx="120" cy="141" rx="8" ry="5" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.6"/><circle cx="105" cy="126" r="4.5" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4"/><circle cx="111" cy="136" r="1.6" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><path d="M40,152 C37.3,153.3 28,160.7 24,160 C20,159.3 17.3,150 16,148" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="58" y1="164" x2="58" y2="176" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="86" y1="164" x2="86" y2="176" style="stroke:currentColor;fill:none" stroke-width="2.2"/><ellipse cx="66" cy="82" rx="52" ry="20" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-bg,#ffffff)" stroke-width="1.8"/><circle cx="96" cy="112" r="3.5" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><circle cx="102" cy="122" r="2.2" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><text x="66" y="87" text-anchor="middle">내적 느낌이 단서</text><rect x="332" y="64" width="18" height="12" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4"/><line x1="332" y1="70" x2="300" y2="78" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="5"/><text x="292" y="74" text-anchor="end" font-weight="700">약물 레버</text><rect x="332" y="144" width="18" height="12" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4"/><line x1="332" y1="150" x2="300" y2="158" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><text x="292" y="154" text-anchor="end" font-weight="700">식염수 레버</text><path d="M 336 98 A 14 14 0 0 0 336 126" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="292" y="116" text-anchor="end">먹이컵</text><text x="12" y="216" font-weight="700">② 훈련: 주사 종류로 레버를 정함</text><circle cx="20" cy="238" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4"/><text x="34" y="243">실로시빈 주사 → 약물 레버 = 먹이</text><circle cx="20" cy="264" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4"/><text x="34" y="269">식염수 주사 → 식염수 레버 = 먹이</text><text x="12" y="304" font-weight="700">③ 시험: 용량과 레버 선택</text><text x="12" y="330" style="fill:var(--si-general,#5c6b7f)">약물 레버 선택 비율(%) ↑</text><rect x="40" y="340" width="300" height="160" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><line x1="40" y1="500" x2="346" y2="500" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#drug-discrimination-test-ar)"/><line x1="40" y1="500" x2="40" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#drug-discrimination-test-ar)"/><path d="M48,484 C60,483 98,483.7 120,478 C142,472.3 160,466.3 180,450 C200,433.7 220,395.3 240,380 C260,364.7 284.3,362.3 300,358 C315.7,353.7 328.3,354.7 334,354" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.2"/><path d="M48,486 C63.3,485.7 108,484.7 140,484 C172,483.3 207.7,482.7 240,482 C272.3,481.3 318.3,480.3 334,480" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" stroke-dasharray="6 4"/><text x="60" y="420">일반화</text><line x1="60" y1="420" x2="210" y2="430" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="210" cy="430" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="330" y="472" text-anchor="end" style="fill:var(--si-blue-t,#12305c)">길항제 전처치</text><text x="330" y="520" text-anchor="end">시험 약물 용량 (낮음 → 높음)</text><text x="12" y="552">길항제로 변별이 막히면 그 효과를</text><text x="12" y="578">매개하는 수용체를 추론할 수 있다</text><text x="12" y="612" font-weight="700">전체 반응률</text><text x="278" y="609">정상</text><rect x="100" y="598" width="170" height="12" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.2"/><rect x="100" y="616" width="70" height="12" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.2"/><text x="176" y="638">낮으면 선택 비율 해석 주의</text><text x="12" y="664">동물 수준의 자극 유사성일 뿐 사람의 경험과</text><text x="12" y="690">같다고 단정할 수 없다</text></svg>
