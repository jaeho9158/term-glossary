<svg class="si si-illus" viewBox="0 0 360 300" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dominant-chord-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="dominant-chord-t">딸림7화음에서 으뜸화음으로: 이끔음 상행, 7음 하행</title><defs><marker id="dominant-chord-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="dominant-chord-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="40" y1="100" x2="320" y2="100" style="stroke:currentColor;fill:none" stroke-width="1"/><line x1="40" y1="110" x2="320" y2="110" style="stroke:currentColor;fill:none" stroke-width="1"/><line x1="40" y1="120" x2="320" y2="120" style="stroke:currentColor;fill:none" stroke-width="1"/><line x1="40" y1="130" x2="320" y2="130" style="stroke:currentColor;fill:none" stroke-width="1"/><line x1="40" y1="140" x2="320" y2="140" style="stroke:currentColor;fill:none" stroke-width="1"/><ellipse cx="110" cy="130" rx="6.5" ry="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="96" y="134" text-anchor="end" font-size="11" style="fill:var(--si-general,#5c6b7f)">G</text><ellipse cx="110" cy="120" rx="6.5" ry="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="82" y="124" text-anchor="end" font-size="11" style="fill:var(--si-general,#5c6b7f)">B</text><ellipse cx="110" cy="110" rx="6.5" ry="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="96" y="114" text-anchor="end" font-size="11" style="fill:var(--si-general,#5c6b7f)">D</text><ellipse cx="110" cy="100" rx="6.5" ry="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="82" y="104" text-anchor="end" font-size="11" style="fill:var(--si-general,#5c6b7f)">F</text><ellipse cx="240" cy="130" rx="6.5" ry="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="254" y="134" font-size="11" style="fill:var(--si-general,#5c6b7f)">G</text><ellipse cx="240" cy="115" rx="6.5" ry="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="254" y="119" font-size="11" style="fill:var(--si-general,#5c6b7f)">C</text><ellipse cx="240" cy="105" rx="6.5" ry="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.85"/><text x="268" y="109" font-size="11" style="fill:var(--si-general,#5c6b7f)">E</text><line x1="120" y1="120" x2="230" y2="116" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8" marker-end="url(#dominant-chord-ar)"/><line x1="120" y1="100" x2="230" y2="104" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#dominant-chord-ar-1)"/><line x1="120" y1="130" x2="230" y2="130" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/><text x="175" y="72" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">F → E: 7음이 한 단계 하행</text><text x="175" y="166" text-anchor="middle" font-size="12" style="fill:var(--si-accent,#2454ff)">B → C: 이끔음이 반음 상행</text><text x="110" y="196" text-anchor="middle" font-weight="700">V<tspan baseline-shift="sub" font-size="72%">7</tspan> 딸림7화음</text><text x="240" y="196" text-anchor="middle" font-weight="700">I 으뜸화음</text><text x="40" y="240" font-size="12" style="fill:var(--si-general,#5c6b7f)">다장조(C major) 예: 높은음자리표 기준</text><text x="40" y="264" font-size="12">B–F: 3음과 7음 사이 6반음(트라이톤)</text></svg>
