si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><line x1="320" y1="266" x2="320" y2="284" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6"/><line x1="220" y1="284" x2="320" y2="284" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><polygon points="220,291 134,291 134,298 116,284 134,270 134,277 220,277" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.35"/><text x="150" y="312" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">각 현금흐름을 할인한 값의 합</text><rect x="14" y="346" width="14" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="36" y="358">부채: 유효이자율법 상각후원가로 측정</text><rect x="14" y="380" width="14" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><text x="36" y="392">자본: 최초 인식 후 재측정하지 않음</text><text x="14" y="430" font-weight="700">순서: ① 부채 요소의 공정가치를 먼저 측정</text><text x="14" y="454" font-weight="700">② 발행금액에서 뺀 잔액을 자본으로 인식</text><text x="14" y="484" style="fill:var(--si-general,#5c6b7f)">전환 조건이 고정 수량 교환 요건을 못 채우면</text><text x="14" y="506" style="fill:var(--si-general,#5c6b7f)">전환권이 파생상품 부채로 분류될 수 있음</text></svg>
