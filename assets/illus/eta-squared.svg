25</text><line x1="244" y1="394" x2="244" y2="406" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="244" y="424" text-anchor="middle">.14</text><text x="244" y="446" text-anchor="middle" font-weight="700">큰</text><text x="244" y="468" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">f .40</text><circle cx="340" cy="400" r="5" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="340" y="384" text-anchor="end" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">예시 .20</text><text x="180" y="496" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">분자는 같은 보라 칸, 분모(보정)만 다르다</text></svg>
