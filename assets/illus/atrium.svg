<svg class="si si-illus" viewBox="0 0 560 346" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="아트리움: 현대 건물과 로마 주택" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>층 슬래브가 둘러싼 여러 층 높이의 빈 공간 위에 유리 지붕을 얹어 햇빛을 들이는 현대 아트리움과, 하늘로 열린 중정 바닥에 빗물 연못이 있는 로마 주택의 아트리움을 나란히 나타낸 단면 모식도</desc><defs><marker id="atrium-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><line x1="300" y1="86" x2="348" y2="77" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="300" y1="181" x2="348" y2="167" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="340" y1="250" x2="348" y2="250" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="20" font-size="12" font-weight="700">아트리움 단면(모식)</text><rect x="20" y="100" width="40" height="200" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><rect x="300" y="100" width="40" height="200" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><rect x="60" y="140" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="255" y="140" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="60" y="180" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="255" y="180" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="60" y="220" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="255" y="220" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="60" y="260" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="255" y="260" width="45" height="7" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.7"/><line x1="20" y1="300" x2="340" y2="300" style="stroke:currentColor;fill:none" stroke-width="2.2"/><polygon points="20,100 180,60 340,100 340,106 180,66 20,106" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.35"/><line x1="124" y1="40" x2="110" y2="74" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#atrium-ar)"/><line x1="194" y1="40" x2="180" y2="64" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#atrium-ar)"/><line x1="264" y1="40" x2="250" y2="74" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#atrium-ar)"/><text x="120" y="203" font-size="12" font-weight="700">보이드(여러 층에 걸친 빈 공간)</text><text x="350" y="70" font-size="12" style="fill:var(--si-blue-s,#7f9ac0)">유리 지붕·천창</text><text x="350" y="110" font-size="12" style="fill:var(--si-amber-s,#d79a2b)">바깥 햇빛</text><text x="350" y="160" font-size="12">층 슬래브</text><text x="350" y="250" font-size="12">건물 벽</text><rect x="440" y="190" width="14" height="110" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><rect x="530" y="190" width="14" height="110" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><line x1="440" y1="300" x2="544" y2="300" style="stroke:currentColor;fill:none" stroke-width="2.2"/><ellipse cx="492" cy="296" rx="28" ry="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.4"/><line x1="492" y1="140" x2="492" y2="18