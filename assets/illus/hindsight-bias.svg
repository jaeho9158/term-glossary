<svg class="si si-illus" viewBox="0 0 360 596" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hindsight-bias-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="hindsight-bias-t">사후확신편향: 회상값의 끌림</title><defs><marker id="hindsight-bias-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">사후확신편향: 결과를 알면 회상이 끌려간다</text><text x="20" y="68" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">실험 집단: 결과를 알려 준 뒤 회상</text><line x1="30" y1="130" x2="330" y2="130" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="30" y1="130" x2="30" y2="136" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="90" y1="130" x2="90" y2="136" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="150" y1="130" x2="150" y2="136" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="210" y1="130" x2="210" y2="136" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="270" y1="130" x2="270" y2="136" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="330" y1="130" x2="330" y2="136" style="stroke:currentColor;fill:none" stroke-width="1.2"/><circle cx="90" cy="130" r="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.2"/><circle cx="270" cy="130" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="100" y="106" text-anchor="end">사전 예측 30%</text><text x="286" y="106" text-anchor="end" style="fill:var(--si-rose-s,#c97b7b)">회상 45%</text><line x1="99" y1="130" x2="261" y2="130" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#hindsight-bias-ar)"/><text x="180" y="154" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">+15%p</text><line x1="114" y1="174" x2="270" y2="174" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><line x1="114" y1="168" x2="114" y2="180" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><line x1="270" y1="168" x2="270" y2="180" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><text x="192" y="202" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">결과 인지의 영향 ≈ 13%p</text><text x="20" y="268" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">통제 집단: 결과를 모른 채 회상</text><line x1="30" y1="330" x2="330" y2="330" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="30" y1="330" x2="30" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="30" y="356" text-anchor="middle">25</text><line x1="90" y1="330" x2="90" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="90" y="356" text-anchor="middle">30</text><line x1="150" y1="330" x2="150" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="150" y="356" text-anchor="middle">35</text><line x1="210" y1="330" x2="210" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="210" y="356" text-anchor="middle">40</text><line x1="270" y1="330" x2="270" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="270" y="356" text-anchor="middle">45</text><line x1="330" y1="330" x2="330" y2="336" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="330" y="356" text-anchor="middle">50</text><circle cx="90" cy="330" r="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.2"/><circle cx="114" cy="330" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><text x="86" y="306" text-anchor="end">사전 30%</text><text x="120" y="306" style="fill:var(--si-blue-s,#7f9ac0)">회상 32%</text><text x="90" y="388" style="fill:var(--si-blue-s,#7f9ac0)">+2%p (단순 기억 오차)</text><text x="344" y="388" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">예측 확률 (%)</text><text x="180" y="410" text-anchor="middle" font-weight="700">15 − 2 = 13%p</text><text x="20" y="468" font-weight="700">모차르트 출생연도 예</text><line x1="30" y1="520" x2="330" y2="520" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="30" y1="520" x2="30" y2="526" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="30" y="546" text-anchor="middle">1700</text><line x1="130" y1="520" x2="130" y2="526" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="130" y="546" text-anchor="middle">1720</text><line x1="230" y1="520" x2="230" y2="526" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="230" y="546" text-anchor="middle">1740</text><line x1="330" y1="520" x2="330" y2="526" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="330" y="546" text-anchor="middle">1760</text><circle cx="80" cy="520" r="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.2"/><circle cx="310" cy="520" r="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0"/><circle cx="230" cy="520" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="80" y="500" text-anchor="middle">추정 1710</text><text x="324" y="500" text-anchor="end" style="fill:var(--si-amber-s,#d79a2b)">제시 1756</text><line x1="89" y1="520" x2="221" y2="520" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#hindsight-bias-ar)"/><text x="230" y="574" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">회상 1740</text></svg>
