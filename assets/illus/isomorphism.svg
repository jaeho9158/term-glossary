)"/><line x1="211" y1="84" x2="233" y2="84" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#isomorphism-ar-1)"/><line x1="263" y1="84" x2="285" y2="84" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#isomorphism-ar-1)"/><path d="M300 70 V54 H40 V68" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="40" y1="60" x2="40" y2="69" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#isomorphism-ar-1)"/><text x="170" y="46" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">+1 (6이 되면 0으로)</text><circle cx="40" cy="84" r="13" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="40" y="89" text-anchor="middle" font-weight="700">0</text><circle cx="92" cy="84" r="13" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="92" y="89" text-anchor="middle" font-weight="700">1</text><circle cx="144" cy="84" r="13" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="144" y="89" text-anchor="middle" font-weight="700">2</text><circle cx="196" cy="84" r="13" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><text x="196" y="89" text-anchor="middle" font-weight="700">3</text><circle cx="248" cy="84" r="13" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="248" y="89" text-anchor="middle" font-weight="700">4</text><circle cx="300" cy="84" r="13" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="300" y="89" text-anchor="middle" font-weight="700">5</text><text x="20" y="166" font-weight="700">Z<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">×Z</tspan><tspan dy="0.217em" font-size="92%">3</tspan></text><circle cx="110" cy="200" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1"/><text x="98" y="205" text-anchor="end">(0,0)</text><circle cx="180" cy="200" r="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1"/><text x="190" y="205">(0,1)</text><circle cx="250" cy="200" r="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><text x="274" y="205">(0,2)</text><circle cx="110" cy="260" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="120" y="265">(1,0)</text><circle cx="180" cy="260" r="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1"/><text x="190" y="265">(1,1)</text><circle cx="250" cy="260" r="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1"/><text x="260" y="265">(1,2)</text><line x1="116" y1="205" x2="173" y2="254" style="stroke:currentColor;fill:none" stroke-width="3" marker-end="url(#isomorphism-ar)"/><line x1="184" y1="250" x2="243" y2="206" style="stroke:currentColor;fill:none" stroke-width="3" marker-end="url(#isomorphism-ar)"/><text x="110" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">b = 0</text><text x="180" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">b = 1</text><text x="250" y="304" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">b = 2</text><text x="14" y="205" style="fill:var(--si-general,#5c6b7f)">a = 0</text><text x="14" y="265" style="fill:var(--si-general,#5c6b7f)">a = 1</text><line x1="20" y1="322" x2="340" y2="322" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="20" y="348" font-weight="700">f(x) = (x mod 2, x mod 3)</text><text x="20" y="368" font-style="italic">f(a·b) = f(a)·f(b)</text><text x="20" y="388">역사상: (a, b) ↦ (3a + 4b) mod 6</text><text x="20" y="420" font-weight="700">6개 점선이 서로 다른 점으로 1:1 이어진다</text><text x="20" y="440" style="fill:var(--si-general,#5c6b7f)">굵은 화살표: +1 한 걸음의 상이다</text><text x="20" y="460" style="fill:var(--si-general,#5c6b7f)">위상공간에서는 역함수도 연속이어야 한다</text></svg>
