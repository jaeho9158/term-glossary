<svg class="si si-illus" viewBox="0 0 360 420" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="in-medias-res-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="in-medias-res-t">인 메디아스 레스: 사건 순서와 서술 순서가 어긋나는 구조</title><defs><marker id="in-medias-res-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="24" text-anchor="middle" font-weight="700">사건이 일어난 실제 순서 →</text><rect x="14" y="40" width="100" height="52" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8" stroke-dasharray="6 4"/><text x="64" y="62" text-anchor="middle" font-weight="700">발단</text><text x="64" y="82" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(배경)</text><rect x="114" y="40" width="130" height="52" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="179" y="71" text-anchor="middle" font-weight="700">갈등 진행 중</text><rect x="244" y="40" width="102" height="52" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="295" y="71" text-anchor="middle" font-weight="700">이후 전개</text><line x1="79" y1="242" x2="179" y2="92" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2"/><line x1="295" y1="242" x2="295" y2="92" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2.2"/><line x1="194" y1="242" x2="64" y2="92" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="4"/><text x="152" y="174" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">배경을 나중에 보충</text><rect x="14" y="242" width="130" height="52" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="79" y="264" text-anchor="middle" font-weight="700">① 갈등 진행 중</text><text x="79" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">서사 시작점</text><rect x="144" y="242" width="100" height="52" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><text x="194" y="264" text-anchor="middle" font-weight="700">② 플래시백</text><text x="194" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">또는 대사</text><rect x="244" y="242" width="102" height="52" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="295" y="273" text-anchor="middle" font-weight="700">③ 이후 전개</text><text x="180" y="326" text-anchor="middle" font-weight="700">관객에게 보이는 서술 순서 →</text><line x1="79" y1="346" x2="79" y2="304" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#in-medias-res-ar)"/><text x="79" y="366" text-anchor="middle" font-weight="700">여기서 시작</text><text x="180" y="402" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">서술 순서가 사건 순서와 어긋나는 곳이 ②이다.</text></svg>
