<svg class="si si-illus" viewBox="0 0 360 526" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fuel-cell-technology-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="fuel-cell-technology-t">연료전지 단위 전지: 전자와 양성자의 두 경로</title><defs><marker id="fuel-cell-technology-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="fuel-cell-technology-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="fuel-cell-technology-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><text x="228" y="40" style="fill:var(--si-general,#5c6b7f)">이론 기전력</text><text x="228" y="62" font-weight="700">E° ≈ 1.229 V</text><rect x="70" y="100" width="30" height="200" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><rect x="100" y="100" width="100" height="200" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6" stroke-dasharray="5 3"/><rect x="200" y="100" width="30" height="200" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><polyline points="85,100 85,60 137,60" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><polyline points="163,60 215,60 215,100" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><path d="M146.1,65.2 L146.1,70.4 L153.9,70.4 L153.9,65.2" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.5"/><circle cx="150" cy="57.4" r="7.8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.5"/><line x1="92" y1="60" x2="124" y2="60" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#fuel-cell-technology-ar)"/><text x="98" y="46" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">e⁻</text><text x="150" y="90" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">부하(전구)</text><line x1="108" y1="128" x2="192" y2="128" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#fuel-cell-technology-ar-1)"/><line x1="108" y1="160" x2="192" y2="160" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#fuel-cell-technology-ar-1)"/><line x1="108" y1="192" x2="192" y2="192" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#fuel-cell-technology-ar-1)"/><text x="130" y="118" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">H⁺</text><text x="150" y="238" text-anchor="middle" font-weight="700">전해질막</text><text x="150" y="262" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">전자 차단</text><text x="150" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">양성자만 통과</text><line x1="10" y1="220" x2="68" y2="220" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#fuel-cell-technology-ar)"/><text x="10" y="206" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">H₂</text><line x1="350" y1="220" x2="232" y2="220" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#fuel-cell-technology-ar-1)"/><text x="350" y="206" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">O₂(공기)</text><line x1="234" y1="276" x2="300" y2="276" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3" marker-end="url(#fuel-cell-technology-ar-2)"/><text x="240" y="262" font-weight="700" style="fill:var(--si-general,#5c6b7f)">H₂O + 열</text><text x="85" y="322" text-anchor="middle" font-weight="700">연료극</text><text x="215" y="322" text-anchor="middle" font-weight="700">공기극</text><text x="14" y="356" style="fill:var(--si-blue-s,#7f9ac0)">연료극: H₂ → 2H⁺ + 2e⁻</text><text x="14" y="382" style="fill:var(--si-rose-s,#c97b7b)">공기극: 1/2 O₂ + 2H⁺ + 2e⁻ → H₂O</text><text x="14" y="424" font-weight="700">전자는 외부 회로를 돌고, 양성자는 막을 지난다.</text><text x="14" y="448" font-weight="700" style="fill:var(--si-accent,#2454ff)">외부 회로의 전자 흐름이 곧 전기 출력이다.</text><text x="14" y="482" style="fill:var(--si-general,#5c6b7f)">이론효율 ΔG/ΔH: HHV 약 83%, LHV 약 94.5%</text><text x="14" y="506" style="fill:var(--si-general,#5c6b7f)">PEMFC 60~80 °C 기준</text></svg>
