<svg class="si si-illus" viewBox="0 0 360 812" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grade-determination-committee-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="grade-determination-committee-t">등급판정위원회: 인정점수 구간과 판정 흐름</title><defs><marker id="grade-determination-committee-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="grade-determination-committee-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="grade-determination-committee-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="112" y="280" width="28" height="180" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="150" y="375" font-weight="700" style="fill:var(--si-gray-t,#44546a)">인지지원등급  45 미만</text><rect x="112" y="256" width="28" height="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="150" y="273" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">5등급  45~51</text><rect x="112" y="220" width="28" height="36" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="150" y="243" font-weight="700" style="fill:var(--si-blue-t,#12305c)">4등급  51~60</text><rect x="112" y="160" width="28" height="60" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="150" y="195" font-weight="700" style="fill:var(--si-green-t,#14543c)">3등급  60~75</text><rect x="112" y="80" width="28" height="80" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="150" y="125" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">2등급  75~95</text><rect x="112" y="60" width="28" height="20" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="150" y="75" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">1등급  95 이상</text><line x1="107" y1="460" x2="112" y2="460" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="104" y="464" text-anchor="end">0</text><line x1="107" y1="280" x2="112" y2="280" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="104" y="284" text-anchor="end">45</text><line x1="107" y1="256" x2="112" y2="256" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="104" y="260" text-anchor="end">51</text><line x1="107" y1="220" x2="112" y2="220" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="104" y="224" text-anchor="end">60</text><line x1="107" y1="160" x2="112" y2="160" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="104" y="164" text-anchor="end">75</text><line x1="107" y1="80" x2="112" y2="80" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="104" y="84" text-anchor="end">95</text><line x1="107" y1="60" x2="112" y2="60" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="104" y="64" text-anchor="end">100</text><text x="126" y="44" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">점수</text><path d="M346,460 L352,460 L352,256 L346,256" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="340" y="400" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">치매</text><text x="340" y="420" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">환자만</text><circle cx="126" cy="188" r="6" style="stroke:var(--si-bg,#ffffff);fill:currentColor" stroke-width="1.5"/><text x="8" y="186" style="fill:var(--si-general,#5c6b7f)">컴퓨터</text><text x="8" y="204" font-weight="700">1차 점수</text><line x1="62" y1="196" x2="118" y2="188" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#grade-determination-committee-ar)"/><rect x="20" y="492" width="320" height="34" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="180" y="514" text-anchor="middle" font-weight="700">방문 인정조사 → 컴퓨터 1차 점수</text><line x1="180" y1="526" x2="180" y2="548" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#grade-determination-committee-ar-1)"/><rect x="20" y="550" width="320" height="86" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="180" y="572" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">등급판정위원회 심의 (위원 15명)</text><text x="180" y="594" text-anchor="middle">시·군·구청장 추천 7명, 의사 또는 한의사 1명 이상</text><text x="180" y="613" text-anchor="middle">조사 결과 + 의사소견서 + 특이사항</text><line x1="180" y1="636" x2="180" y2="658" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#grade-determination-committee-ar-1)"/><rect x="20" y="660" width="320" height="34" rx="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="180" y="682" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">최종 등급 → 인정서 통보</text><path d="M20,509 L10,509 L10,586" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M10,614 L10,677 L20,677" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#grade-determination-committee-ar-2)"/><text x="10" y="605" text-anchor="middle" font-size="18" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">×</text><text x="340" y="716" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">× 점선: 1차 점수가 등급을 자동 확정하지 않는다.</text><text x="20" y="748" font-weight="700">신청서 제출일부터 30일 이내 판정 (부득이하면 연장)</text><text x="20" y="767" font-weight="700">위원 임기 3년</text><text x="20" y="794" style="fill:var(--si-general,#5c6b7f)">구간은 법령 개정으로 바뀔 수 있어 기준 시점을 확인한다.</text></svg>
