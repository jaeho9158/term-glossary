<svg class="si si-illus" viewBox="0 0 360 558" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="혈중 암모니아: 농도 구간과 검체 지연의 영향" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="blood-ammonia-test-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="28" font-weight="700">혈중 암모니아 농도 (μmol/L)</text><rect x="32.8" y="72" width="19.2" height="26" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><rect x="52" y="72" width="96" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><rect x="148" y="72" width="128" height="26" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><rect x="276" y="72" width="64" height="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><line x1="20" y1="98" x2="20" y2="104" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="20" y="122" text-anchor="middle">0</text><line x1="52" y1="98" x2="52" y2="104" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="52" y="122" text-anchor="middle">50</text><line x1="84" y1="98" x2="84" y2="104" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="84" y="122" text-anchor="middle">100</text><line x1="148" y1="98" x2="148" y2="104" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="148" y="122" text-anchor="middle">200</text><line x1="276" y1="98" x2="276" y2="104" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="276" y="122" text-anchor="middle">400</text><line x1="340" y1="98" x2="340" y2="104" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="340" y="122" text-anchor="middle">500</text><line x1="84" y1="62" x2="84" y2="98" style="stroke:currentColor;fill:none" stroke-width="1.6" stroke-dasharray="4 3"/><text x="84" y="54" text-anchor="middle">신생아 기준 100</text><rect x="20" y="144" width="14" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="42" y="156">20~50 정상 (기준에 따라 26~30 미만)</text><rect x="20" y="168" width="14" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="42" y="180">50 초과: 성인 고암모니아혈증</text><rect x="20" y="192" width="14" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="42" y="204">200 초과: 발작·뇌병증·혼수·사망 가능</text><rect x="20" y="216" width="14" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><text x="42" y="228">400~500 초과: 비가역 뇌손상 위험 5~10배</text><text x="20" y="276" font-weight="700">채혈 후 보관 시간에 따른 측정값</text><line x1="50" y1="400" x2="50" y2="296" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#blood-ammonia-test-ar)"/><line x1="50" y1="400" x2="330" y2="400" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#blood-ammonia-test-ar)"/><text x="188" y="438" text-anchor="middle">채혈 후 경과 시간(분)</text><text x="62" y="306">측정 농도</text><line x1="50" y1="372" x2="290" y2="322" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><line x1="290" y1="322" x2="320" y2="316" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="4 3"/><line x1="290" y1="400" x2="290" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.4" stroke-dasharray="4 3"/><text x="50" y="420" text-anchor="middle">0</text><text x="290" y="420" text-anchor="middle">120(2시간)</text><text x="56" y="392" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">상온: 분당 0.09 μmol/L씩 상승</text><text x="180" y="472" text-anchor="middle" font-weight="700">채혈 후 2시간 이내 도착 검체만 수용 제안</text><text x="180" y="494" text-anchor="middle">얼음 보관 효과는 연구마다 엇갈림</text><text x="180" y="522" text-anchor="middle">수치만으로 진단·배제하지 않고</text><text x="180" y="544" text-anchor="middle">기준 범위와 임상 증상을 함께 해석</text></svg>
