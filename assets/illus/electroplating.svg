<svg class="si si-illus" viewBox="0 0 360 608" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전기도금: 장치와 석출 원리" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="electroplating-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">전기도금: 이온이 음극에 금속 피막으로</text><polyline points="100,134 100,76 160,76" style="stroke:currentColor;fill:none" stroke-width="2"/><polyline points="272,134 272,76 200,76" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="162" y1="76" x2="176.4" y2="76" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="176.4" y1="65.2" x2="176.4" y2="86.8" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="181.8" y1="69.5" x2="181.8" y2="82.5" style="stroke:currentColor;fill:none" stroke-width="1.5"/><line x1="181.8" y1="76" x2="198" y2="76" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="180" y="112" text-anchor="middle" font-weight="700">외부 전원</text><text x="84" y="100" font-size="15" font-weight="700">+</text><text x="280" y="100" font-size="15" font-weight="700">−</text><rect x="30" y="130" width="300" height="170" rx="10" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2.4"/><rect x="32" y="170" width="296" height="128" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="0" fill-opacity="0.3"/><line x1="32" y1="170" x2="328" y2="170" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="90" y="134" width="20" height="140" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2" fill-opacity="0.8"/><rect x="262" y="134" width="20" height="140" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.6"/><rect x="254" y="172" width="8" height="102" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0" fill-opacity="0.9"/><rect x="282" y="172" width="8" height="102" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0" fill-opacity="0.9"/><text x="180" y="196" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">금속 이온 이동</text><circle cx="128" cy="222" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><line x1="142" y1="222" x2="236" y2="222" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#electroplating-ar)"/><circle cx="128" cy="248" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><line x1="142" y1="248" x2="236" y2="248" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#electroplating-ar)"/><circle cx="128" cy="274" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><line x1="142" y1="274" x2="236" y2="274" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#electroplating-ar)"/><text x="258" y="294" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">금속 피막</text><text x="14" y="326" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">양극(도금 금속)</text><text x="14" y="350">금속이 양이온으로 용해</text><text x="190" y="326" font-weight="700">음극(도금할 물체)</text><text x="190" y="350">전자를 얻어 금속으로</text><circle cx="22" cy="386" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="36" y="391">금속 이온(양이온)</text><text x="14" y="430" font-weight="700">석출량은 흐른 전하량에 비례 (패러데이 법칙)</text><rect x="14" y="448" width="332" height="92" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="0.3"/><text x="24" y="472">가상의 예: 니켈, 2 A/dm², 30분,</text><text x="24" y="496">전류 효율 95%라고 가정하면</text><text x="24" y="520" font-weight="700" style="fill:var(--si-accent,#2454ff)">두께 약 11.7 μm (이론값 12.3 μm)</text><text x="14" y="566" style="fill:var(--si-general,#5c6b7f)">이 계산은 평균 두께만 줌: 모서리·홈에서</text><text x="14" y="588" style="fill:var(--si-general,#5c6b7f)">전류가 몰려 생기는 불균일은 설명 못 함</text></svg>
