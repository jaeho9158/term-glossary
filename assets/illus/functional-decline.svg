<svg class="si si-illus" viewBox="0 0 360 616" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="functional-decline-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="functional-decline-t">기능저하: 입원 전후의 변화와 평가</title><defs><marker id="functional-decline-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">기능저하: 입원 전후 일상 기능의 변화</text><text x="58" y="50" font-weight="700">일상생활 수행 기능</text><line x1="50" y1="290" x2="346" y2="290" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#functional-decline-ar)"/><line x1="50" y1="290" x2="50" y2="60" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#functional-decline-ar)"/><line x1="50" y1="110" x2="346" y2="110" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="200" y="100" style="fill:var(--si-general,#5c6b7f)">입원 전 기능 수준</text><polyline points="80,110 190,230 300,246" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><polyline points="80,110 190,158 300,162" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="3"/><line x1="80" y1="284" x2="80" y2="296" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="190" y1="284" x2="190" y2="296" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="300" y1="284" x2="300" y2="296" style="stroke:currentColor;fill:none" stroke-width="1.4"/><circle cx="80" cy="110" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="190" cy="230" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="300" cy="246" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="190" cy="158" r="5" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="1.6"/><circle cx="300" cy="162" r="5" style="stroke:var(--si-pos,#14543c);fill:var(--si-pos,#14543c)" stroke-width="1.6"/><circle cx="80" cy="110" r="5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="200" y="144" font-weight="700" style="fill:var(--si-pos,#14543c)">조기 재활: 저하 최소화</text><text x="210" y="270" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">재활 없음: 저하가 큼</text><text x="80" y="316" text-anchor="middle">입원 전</text><text x="190" y="316" text-anchor="middle">퇴원 시</text><text x="300" y="316" text-anchor="middle">추적</text><text x="300" y="338" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(퇴원 후 1~3개월)</text><text x="14" y="368" font-weight="700" style="fill:var(--si-accent,#2454ff)">기능저하 = 이전 수준 대비 감소</text><text x="14" y="408" font-weight="700">입원연관 장애의 요인</text><rect x="14" y="420" width="76" height="30" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="52" y="440" text-anchor="middle" font-weight="700">와상</text><rect x="98" y="420" width="76" height="30" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="136" y="440" text-anchor="middle" font-weight="700">영양</text><rect x="182" y="420" width="76" height="30" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="220" y="440" text-anchor="middle" font-weight="700">섬망</text><rect x="266" y="420" width="76" height="30" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="304" y="440" text-anchor="middle" font-weight="700">약물</text><text x="14" y="478" style="fill:var(--si-general,#5c6b7f)">급성 질환 자체와 병원 환경 요인이 함께 작용</text><text x="14" y="518" font-weight="700">기능 평가 도구</text><text x="14" y="544">기본 일상생활동작(ADL): Katz 지수 (1963)</text><text x="14" y="570">도구적 ADL: Lawton·Brody 척도 (1969)</text><text x="14" y="596">수행 검사: 보행 속도, 간이 신체수행 검사(SPPB)</text></svg>
