<svg class="si si-illus" viewBox="0 0 360 560" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="long-shot-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="long-shot-t">롱숏: 카메라 거리와 초점거리가 인물 크기와 공간 맥락을 정한다</title><defs><marker id="long-shot-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><line x1="184" y1="406" x2="202" y2="425.7" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="152" y1="372" x2="104.9" y2="371.5" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="22" font-weight="700">롱숏과 익스트림 롱숏</text><rect x="20" y="40" width="150" height="90" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="20" y1="112" x2="170" y2="112" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><rect x="28" y="64" width="34" height="48" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><rect x="130" y="72" width="32" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><circle cx="95" cy="83.1" r="4.1" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.8"/><line x1="95" y1="87.2" x2="95" y2="101.8" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2"/><line x1="95" y1="101.8" x2="89.9" y2="112" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2"/><line x1="95" y1="101.8" x2="100.1" y2="112" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2"/><line x1="88.2" y1="93.3" x2="101.8" y2="93.3" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2"/><text x="20" y="152" font-weight="700">롱숏</text><rect x="190" y="40" width="150" height="90" style="stroke:currentColor;fill:none" stroke-width="1.8"/><polygon points="190,112 230,82 258,100 290,70 340,112" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><circle cx="265" cy="112" r="2.6" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="0"/><text x="190" y="152" font-weight="700">익스트림 롱숏</text><text x="20" y="184" style="fill:var(--si-general,#5c6b7f)">롱숏은 전신과 주변 환경이 함께 보이고,</text><text x="20" y="204" style="fill:var(--si-general,#5c6b7f)">익스트림 롱숏은 인물이 점처럼 작다</text><text x="20" y="246" font-weight="700">위에서 본 배치</text><polygon points="180,420 168,438 192,438" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><line x1="180" y1="420" x2="83" y2="270" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><line x1="180" y1="420" x2="277" y2="270" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><line x1="180" y1="420" x2="138" y2="270" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8"/><line x1="180" y1="420" x2="222" y2="270" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8"/><circle cx="180" cy="280" r="5" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="0"/><line x1="180" y1="404" x2="180" y2="292" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" marker-end="url(#long-shot-ar)" marker-start="url(#long-shot-ar)"/><text x="204" y="440" style="fill:var(--si-general,#5c6b7f)">카메라–피사체 거리</text><text x="180" y="264" text-anchor="middle" style="fill:var(--si-limit,#7d2626)">인물</text><text x="20" y="364" style="fill:var(--si-blue-t,#12305c)">광각 약 25 mm</text><text x="20" y="384" style="fill:var(--si-blue-t,#12305c)">(35 mm 기준)</text><text x="266" y="310" style="fill:var(--si-amber-s,#d79a2b)">초점거리 ↑</text><text x="266" y="330" style="fill:var(--si-amber-s,#d79a2b)">화각 ↓</text><text x="20" y="470" style="fill:var(--si-general,#5c6b7f)">초점거리가 짧을수록 화각이 넓다</text><text x="20" y="508" font-weight="700" style="fill:var(--si-accent,#2454ff)">숏 크기는 거리와 초점거리로 정해진다</text><text x="20" y="544" style="fill:var(--si-limit,#7d2626)">롱테이크(촬영 시간)와는 다른 개념</text></svg>
