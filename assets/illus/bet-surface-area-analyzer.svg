<svg class="si si-illus" viewBox="0 0 360 740" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bet-surface-area-analyzer-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bet-surface-area-analyzer-t">BET 표면적 분석: 흡착 등온선의 0.05~0.30 구간을 선형화해 단분자층량 v_m과 비표면적을 구한다</title><defs><marker id="bet-surface-area-analyzer-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="bet-surface-area-analyzer-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="20" y="22" font-weight="700">① 77 K 질소 흡착 등온선</text><text x="20" y="44" style="fill:var(--si-general,#5c6b7f)">흡착량 v (cm³(STP)/g)</text><rect x="71.5" y="80" width="67.5" height="128" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="0" fill-opacity="0.2"/><text x="105.3" y="72" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">0.05~0.30</text><line x1="58" y1="208" x2="336" y2="208" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#bet-surface-area-analyzer-ar)"/><line x1="58" y1="208" x2="58" y2="76" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="58" y1="208" x2="58" y2="212" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="58" y="230" text-anchor="middle">0</text><line x1="193" y1="208" x2="193" y2="212" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="193" y="230" text-anchor="middle">0.5</text><line x1="328" y1="208" x2="328" y2="212" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="328" y="230" text-anchor="middle">1</text><text x="193" y="252" text-anchor="middle" style="fi