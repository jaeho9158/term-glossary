<div id="reader" class="rd" hidden>
  <div id="rd-toolbar" class="rd-toolbar" role="toolbar" aria-label="리더 도구">

    <span id="rd-title" class="rd-title"></span>

    <div class="rd-group rd-pagebox">
      <input type="number" id="rd-page-input" class="rd-page-input" min="1" step="1" inputmode="numeric" aria-label="쪽 번호" title="쪽 번호를 입력하고 Enter (← → 로 쪽 이동)">
      <span id="rd-page-total" class="rd-page-total">/ 0</span>
    </div>

    <div class="rd-group rd-search">
      <input type="search" id="rd-search-input" class="rd-search-input" placeholder="본문 검색" aria-label="본문 검색" title="본문 검색 (Ctrl F)" autocomplete="off" disabled>
      <button type="button" id="rd-search-prev" class="rd-btn rd-icon-btn" title="이전 결과" aria-label="이전 결과" disabled>

      </button>
      <button type="button" id="rd-search-next" class="rd-btn rd-icon-btn" title="다음 결과" aria-label="다음 결과" disabled>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="rd-search-count" class="rd-search-count" aria-live="polite"></span>
      <button type="button" id="rd-search-close" class="rd-btn rd-search-close" aria-label="검색 닫기">닫기</button>
    </div>

    <div class="rd-spacer"></div>

    <div id="rd-extra" class="rd-extra" role="group" aria-label="더보기 메뉴">
      <div class="rd-group rd-zoom">
        <button type="button" id="rd-zoom-out" class="rd-btn rd-icon-btn" title="축소 (Ctrl −)" aria-label="축소">−</button>
        <span id="rd-zoom-label" class="rd-zoom-label" aria-live="polite">100%</span>
        <button type="button" id="rd-zoom-in" class="rd-btn rd-icon-btn" title="확대 (Ctrl +)" aria-label="확대">+</button>

<script>
  // 형광펜·메모 저장 계층(ES module)을 클래식 스크립트가 쓸 수 있게 window.ReaderStore 로 넘긴다. 못 불러오면 null.
  window.ReaderStoreReady = import("./assets/pdf-annotations.js?v=7041e19e23").then(function (m) {
    window.ReaderStore = {
      loadAnnotations: m.loadAnnotations,
      createAnnotation: m.createAnnotation,
      updateAnnotationNote: m.updateAnnotationNote,
      updateAnnotationAnchor: m.updateAnnotationAnchor,
      deleteAnnotation: m.deleteAnnotation,
    };
    return window.ReaderStore;
  }).catch(function (err) { console.error("[reader] 저장 계층을 불러오지 못했습니다", err); return null; });
</script>
