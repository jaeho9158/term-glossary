<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tracking-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="tracking-t">트래킹: 글자 사이 간격을 전체에 같게 조정</title><defs></defs><text x="60" y="100" font-size="24">T</text><text x="76" y="100" font-size="24">r</text><text x="92" y="100" font-size="24">a</text><text x="108" y="100" font-size="24">c</text><text x="124" y="100" font-size="24">k</text><text x="140" y="100" font-size="24">i</text><text x="156" y="100" font-size="24">n</text><text x="172" y="100" font-size="24">g</text><text x="30" y="67" font-size="12" font-weight="700">트래킹 0</text><text x="60" y="190" font-size="24">T</text><text x="79.6" y="190" font-size="24">r</text><text x="99.2" y="190" font-size="24">a</text><text x="118.8" y="190" font-size="24">c</text><text x="138.4" y="190" font-size="24">k</text><text x="158" y="190" font-size="24">i</text><text x="177.6" y="190" font-size="24">n</text><text x="197.2" y="190" font-size="24">g</text><text x="30" y="157" font-size="12" font-weight="700">트래킹 +50(0.05 em, 여기서는 3배로 과장)</text><text x="30" y="240" font-size="12">간격 증가량 = (트래킹 값 / 1000) × 글자 크기</text><text x="30" y="262" font-size="12">16 px 글자에서 +50 → 0.05 × 16 = 0.80 px</text><text x="30" y="284" font-size="12">10글자 단어는 간격 9곳 → 0.80 × 9 = 7.2 px 길어진다</text></svg>
