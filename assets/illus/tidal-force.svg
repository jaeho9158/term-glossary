<svg class="si si-illus" viewBox="0 0 600 310" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="조석력과 두 팽창부" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>달이 지구의 가까운 쪽을 중심보다 세게, 먼 쪽을 중심보다 약하게 당겨 지구의 물이 달 쪽과 반대쪽 두 곳으로 부푼다</desc><defs><marker id="tidal-force-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><ellipse cx="210" cy="170" rx="92" ry="66" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.15"/><circle cx="210" cy="170" r="60" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.25"/><circle cx="540" cy="170" r="18" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.4"/><line x1="302" y1="170" x2="352" y2="170" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#tidal-force-ar)"/><line x1="210" y1="170" x2="244" y2="170" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#tidal-force-ar)"/><line x1="118" y1="170" x2="140" y2="170" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#tidal-force-ar)"/><text x="210" y="214" text-anchor="middle">지구</text><text x="540" y="206" text-anchor="middle">달</text><text x="330" y="80" text-anchor="middle" font-size="12">달 쪽 팽창부</text><line x1="326" y1="88" x2="296" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="90" y="80" text-anchor="middle" font-size="12">반대쪽 팽창부</text><line x1="94" y1="88" x2="122" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="300" y="290" text-anchor="middle" font-size="12">화살표: 달이 각 지점을 당기는 힘(가까울수록 큼)</text></svg>
