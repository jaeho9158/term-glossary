" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6"/><text x="334" y="428" text-anchor="end">시간</text><text x="210" y="358">압력</text><text x="180" y="458" text-anchor="middle">프리드랜더 파형 (모식)</text><line x1="16" y1="474" x2="344" y2="474" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="496">거리가 멀수록 피크가 낮고 완만해진다.</text><text x="16" y="516">벽 앞에서는 반사파가 겹쳐 압력이 순간적으로 더 커진다.</text><text x="16" y="536">개활지를 가정한 이론 곡선이며, 반사·회절이</text><text x="16" y="556">있으면 실제 분포는 크게 달라진다.</text></svg>
