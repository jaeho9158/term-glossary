<svg class="si si-illus" viewBox="0 0 360 566" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="country-programmable-aid-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="country-programmable-aid-t">국가계획가능원조(CPA): 총 ODA에서 제외 항목을 뺀 몫</title><defs></defs><text x="10" y="22" font-weight="700">총 ODA 100에서 제외 항목을 빼 CPA 구하기</text><line x1="20" y1="330" x2="350" y2="330" style="stroke:currentColor;fill:none" stroke-width="1.6"/><rect x="27" y="70" width="34" height="260" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><rect x="27" y="148" width="34" height="182" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="44" y="62" text-anchor="middle" font-weight="700">100</text><line x1="61" y1="148" x2="297" y2="148" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.6" stroke-dasharray="5 3"/><rect x="81" y="70" width="34" height="26" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><line x1="61" y1="70" x2="81" y2="70" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="98" y="113" text-anchor="middle" font-weight="700">−10</text><rect x="135" y="96" width="34" height="13" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><line x1="115" y1="96" x2="135" y2="96" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="152" y="126" text-anchor="middle" font-weight="700">−5</text><rect x="189" y="109" width="34" height="18.2" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><line x1="169" y1="109" x2="189" y2="109" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="206" y="144.2" text-anchor="middle" font-weight="700">−7</text><rect x="243" y="127.2" width="34" height="20.8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><line x1="223" y1="127.2" x2="243" y2="127.2" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="260" y="165" text-anchor="middle" font-weight="700">−8</text><rect x="297" y="148" width="34" height="182" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2.4"/><text x="314" y="188" text-anchor="middle" font-weight="700">70</text><text x="314" y="140" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">CPA</text><text x="44" y="350" text-anchor="middle">총 ODA</text><text x="98" y="350" text-anchor="middle">인도적</text><text x="98" y="370" text-anchor="middle">지원</text><text x="152" y="350" text-anchor="middle">부채</text><text x="152" y="370" text-anchor="middle">탕감</text><text x="206" y="350" text-anchor="middle">행정</text><text x="206" y="370" text-anchor="middle">비용</text><text x="260" y="350" text-anchor="middle">학생</text><text x="260" y="370" text-anchor="middle">비용 등</text><text x="314" y="350" text-anchor="middle">CPA</text><rect x="10" y="394" width="14" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="32" y="406">변동이 커 예측 어려움</text><rect x="10" y="420" width="14" height="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="32" y="432">수원국으로 국경을 넘지 않음</text><text x="10" y="466" font-weight="700">CPA = 100 − (10 + 5 + 7 + 8) = 70</text><text x="10" y="490">CPA 비중 = 70 ÷ 100 = 70%</text><text x="10" y="510">0 ≤ CPA ≤ 총 ODA, 제외 항목 순서는 무관</text><text x="10" y="546" style="fill:var(--si-general,#5c6b7f)">가상 예이며 공여국 관점의 값이다</text></svg>
