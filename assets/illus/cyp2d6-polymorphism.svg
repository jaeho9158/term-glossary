<svg class="si si-illus" viewBox="0 0 360 646" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CYP2D6 다형성: 대립유전자 점수 합산과 대사형" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="cyp2d6-polymorphism-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><linearGradient id="cyp2d6-polymorphism-g0" x1="0" y1="0.5" x2="1" y2="0.5"><stop offset="0" style="stop-color:var(--si-rose-f,#fbe4e4)"/><stop offset="1" style="stop-color:var(--si-violet-f,#eae4f4)"/></linearGradient></defs><text x="14" y="24" font-weight="700">대립유전자 활성 점수</text><rect x="14" y="37" width="16" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="36" y="48">기능 소실 0 (*4)</text><rect x="186" y="37" width="16" height="14" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="208" y="48">감소 0.5 (*10·*41)</text><rect x="14" y="57" width="16" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><text x="36" y="68">정상 1 (*1·*2)</text><rect x="186" y="57" width="16" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.4"/><text x="208" y="68">복제 (*1x2) = 1×2</text><text x="14" y="90" style="fill:var(--si-general,#5c6b7f)">*10은 이후 지침에서 0.25로 조정</text><text x="24" y="126" font-weight="700">*1/*4 : 1 + 0 = 1</text><rect x="24" y="132" width="100" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="74" y="151" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">*1</text><text x="132" y="151" style="fill:var(--si-general,#5c6b7f)">*4 (점수 0)</text><text x="24" y="184" font-weight="700">*1/*1 : 1 + 1 = 2</text><rect x="24" y="190" width="100" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="74" y="209" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">*1</text><rect x="124" y="190" width="100" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="174" y="209" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">*1</text><text x="24" y="242" font-weight="700">*1/*1x2 : 1 + (1×2) = 3</text><rect x="24" y="248" width="100" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="74" y="267" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">*1</text><rect x="124" y="248" width="200" height="28" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><text x="224" y="267" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">*1 ×2</text><line x1="24" y1="296" x2="332" y2="296" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cyp2d6-polymorphism-ar)"/><line x1="24" y1="296" x2="24" y2="302" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="24" y="320" text-anchor="middle">0</text><line x1="124" y1="296" x2="124" y2="302" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="124" y="320" text-anchor="middle">1</text><line x1="224" y1="296" x2="224" y2="302" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="224" y="320" text-anchor="middle">2</text><line x1="324" y1="296" x2="324" y2="302" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="324" y="320" text-anchor="middle">3</text><text x="174" y="342" text-anchor="middle" font-weight="700">합계 점수</text><text x="24" y="380" style="fill:var(--si-general,#5c6b7f)">활성 낮음</text><text x="324" y="380" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">높음</text><rect x="24" y="388" width="300" height="14" style="stroke:var(--si-general,#5c6b7f);fill:url(#cyp2d6-polymorphism-g0)" stroke-width="1.2"/><line x1="61" y1="402" x2="61" y2="403" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><text x="61" y="418" text-anchor="middle" font-weight="700">저대사형</text><line x1="211" y1="402" x2="211" y2="403" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><text x="211" y="418" text-anchor="middle" font-weight="700">정상대사형</text><line x1="136" y1="402" x2="136" y2="425" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><text x="136" y="440" text-anchor="middle" font-weight="700">중간대사형</text><line x1="286" y1="402" x2="286" y2="425" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><text x="286" y="440" text-anchor="middle" font-weight="700">초고속대사형</text><text x="180" y="474" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">순서만 표시, 위 점수 눈금과 대응하지 않는다</text><text x="180" y="494" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">점수 구간은 CPIC/DPWG 합의로 정한다</text><text x="14" y="530">저대사형: 유럽계 약 5~10%, 동아시아는 드묾</text><text x="14" y="550">초고속대사형: 에티오피아 약 30% 보고</text><text x="14" y="586" font-weight="700">유전형만으로 활성을 완벽히 예측하기 어렵다</text><text x="14" y="606">강한 억제제를 함께 쓰면 일시적으로</text><text x="14" y="626">저대사형처럼 행동한다(표현형 전환)</text></svg>
