<svg class="si si-illus" viewBox="0 0 520 392" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-moment-gyroscope-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="control-moment-gyroscope-t">제어 모멘트 자이로: 로터 각운동량 h, 짐벌 각속도 δ̇, 출력 토크 τ</title><defs><marker id="control-moment-gyroscope-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="control-moment-gyroscope-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="control-moment-gyroscope-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-limit,#7d2626)"/></marker></defs><line x1="190" y1="296" x2="152" y2="296" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="168" y1="200" x2="132" y2="200" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="190" y1="70" x2="190" y2="330" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="178" y="68" width="24" height="12" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.5"/><rect x="178" y="320" width="24" height="12" style="stroke:currentColor;fill:currentColor" stroke-width="1" fill-opacity="0.5"/><ellipse cx="190" cy="200" rx="22" ry="70" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="2.2" fill-opacity="0.18"/><line x1="190" y1="200" x2="340" y2="200" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6" marker-end="url(#control-moment-gyroscope-ar)"/><line x1="190" y1="200" x2="190" y2="40" style="stroke:currentColor;fill:none" stroke-width="2.6" marker-end="url(#control-moment-gyroscope-ar-1)"/><line x1="190" y1="200" x2="270" y2="140" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="2.6" marker-end="url(#control-moment-gyroscope-ar-2)"/><text x="350" y="204" font-size="15" font-weight="700" font-style="italic">h</text><text x="190" y="28" text-anchor="middle" font-size="15" font-weight="700" font-style="italic">δ̇</text><text x="280" y="134" font-size="15" font-weight="700" font-style="italic">τ</text><text x="150" y="296" text-anchor="end" font-size="12">짐벌 축</text><text x="130" y="200" text-anchor="end" font-size="12">로터</text><text x="40" y="352" font-size="11.5">예: h = 50 N·m·s, δ̇ = 0.5 rad/s일 때</text><text x="40" y="374" font-size="11.5">τ = 50 × 0.5 = 25 N·m</text></svg>
