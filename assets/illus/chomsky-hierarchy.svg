<svg class="si si-illus" viewBox="0 0 360 414" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="촘스키 위계: 문법의 4단계와 대응 기계" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="chomsky-hierarchy-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><rect x="10" y="10" width="340" height="252" rx="22" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.8" fill-opacity="0.34"/><text x="180" y="32" text-anchor="middle" font-weight="700">0형 재귀 열거 가능 언어</text><text x="180" y="52" text-anchor="middle">튜링 기계</text><rect x="24" y="58" width="312" height="192" rx="22" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.8" fill-opacity="0.26"/><text x="180" y="80" text-anchor="middle" font-weight="700">1형 문맥 의존 언어</text><text x="180" y="100" text-anchor="middle">제한된 튜링 기계</text><rect x="38" y="106" width="284" height="132" rx="22" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.8" fill-opacity="0.18"/><text x="180" y="128" text-anchor="middle" font-weight="700">2형 문맥 자유 언어</text><text x="180" y="148" text-anchor="middle">푸시다운 오토마타 (스택 1개)</text><rect x="52" y="154" width="256" height="72" rx="22" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.8" fill-opacity="0.1"/><text x="180" y="176" text-anchor="middle" font-weight="700">3형 정규 언어</text><text x="180" y="196" text-anchor="middle">유한 오토마타</text><text x="180" y="292" text-anchor="middle" font-weight="700">표현력, 필요한 계산 모델의 힘 증가</text><line x1="60" y1="312" x2="300" y2="312" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#chomsky-hierarchy-ar)"/><text x="14" y="336" style="fill:va