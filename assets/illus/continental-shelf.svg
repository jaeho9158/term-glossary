<svg class="si si-illus" viewBox="0 0 360 476" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="continental-shelf-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="continental-shelf-t">대륙붕: 육지에서 심해로 이어지는 해저 지형 단면</title><defs><marker id="continental-shelf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><polygon points="40,70 350,70 350,300 350,300 310,294 282,280 252,260 200,100 160,96 120,90 80,81 40,70" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.3"/><polygon points="0,30 22,32 40,70 80,81 120,90 160,96 200,100 252,260 282,280 310,294 350,300 350,380 0,380" style="stroke:none;fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.3"/><polyline points="0,30 22,32 40,70" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="40" y1="70" x2="350" y2="70" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2"/><polyline points="40,70 80,81 120,90 160,96 200,100" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.6"/><polyline points="200,100 252,260" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3.6"/><polyline points="252,260 282,280 310,294" style="stroke:var(--si-gray-t,#44546a);fill:none" stroke-width="3.6"/><polyline points="310,294 350,300" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3.6"/><line x1="40" y1="90" x2="350" y2="90" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="200" cy="100" r="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="8" y="22" font-weight="700" style="fill:var(--si-general,#5c6b7f)">육지</text><text x="296" y="60" font-weight="700" style="fill:var(--si-blue-t,#12305c)">해수면</text><text x="262" y="112" style="fill:var(--si-general,#5c6b7f)">수심 100 m</text><line x1="205" y1="106" x2="230" y2="124" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><text x="232" y="132" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">대륙붕단</text><text x="232" y="154" style="fill:var(--si-general,#5c6b7f)">수심 약 140 m</text><text x="266" y="216" font-weight="700">대륙사면</text><line x1="266" y1="216" x2="227" y2="182" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="227" cy="182" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="266" y="238" style="fill:var(--si-general,#5c6b7f)">평균 3°</text><text x="290" y="272" font-weight="700" style="fill:var(--si-gray-t,#44546a)">대륙대</text><text x="352" y="324" text-anchor="end" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">심해저 평원</text><text x="118" y="126" font-weight="700">대륙붕</text><line x1="118" y1="126" x2="100" y2="87" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="100" cy="87" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="60" y="150" font-weight="700" style="fill:var(--si-blue-t,#12305c)">경사 약 0.5°</text><text x="60" y="172" style="fill:var(--si-general,#5c6b7f)">(1° 미만)</text><line x1="40" y1="222" x2="200" y2="222" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#continental-shelf-ar)" marker-start="url(#continental-shelf-ar)"/><text x="120" y="246" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">대륙붕 폭</text><text x="10" y="370" style="fill:var(--si-general,#5c6b7f)">수직 과장됨(수심 축은 실제 비율이 아님)</text><text x="10" y="406">폭: 수 km~1,000 km 이상, 평균 약 80 km</text><text x="10" y="428" style="fill:var(--si-general,#5c6b7f)">시베리아 대륙붕은 약 1,500 km로 가장 넓음</text><text x="10" y="456" font-weight="700">세