<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="distance-between-two-points-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="distance-between-two-points-t">두 점 사이 거리: 유클리드·맨해튼·체비쇼프</title><defs></defs><line x1="130" y1="190" x2="250" y2="190" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="250" y1="190" x2="250" y2="30" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="130" y1="190" x2="250" y2="30" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.8"/><polyline points="238,190 238,178 250,178" style="stroke:currentColor;fill:none" stroke-width="1"/><circle cx="130" cy="190" r="3.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="250" cy="30" r="3.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="124" y="194" text-anchor="end">A(1, 2)</text><text x="258" y="34">B(4, 6)</text><text x="190" y="210" text-anchor="middle" style="fill:var(--si-rose-s,#c97b7b)">Δx = 3</text><text x="260" y="110" style="fill:var(--si-rose-s,#c97b7b)">Δy = 4</text><text x="300" y="87" font-weight="700" style="fill:var(--si-accent,#2454ff)">유클리드 d<tspan baseline-shift="sub" font-size="72%">2</tspan> = 5</text><text x="306" y="118" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">맨해튼 d<tspan baseline-shift="sub" font-size="72%">1</tspan> = 3 + 4 = 7</text><text x="300" y="146" font-weight="700">체비쇼프 d<tspan baseline-shift="sub" font-size="72%">∞</tspan> = max(3, 4) = 4</text><text x="20" y="308" font-size="12" style="fill:var(--si-general,#5c6b7f)">d<tspan baseline-shift="sub" font-size="72%">2</tspan> = √(Δx<tspan baseline-shift="super" font-size="72%">2</tspan> + Δy<tspan baseline-shift="super" font-size="72%">2</tspan>),  d<tspan baseline-shift="sub" font-size="72%">1</tspan> = |Δx| + |Δy|,  d<tspan baseline-shift="sub" font-size="72%">∞</tspan> = max(|Δx|, |Δy|)</text></svg>
