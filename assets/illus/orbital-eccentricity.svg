<svg class="si si-illus" viewBox="0 0 560 473" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orbital-eccentricity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="orbital-eccentricity-t">타원 궤도의 긴반지름·근점·원점</title><desc>중심 천체가 한 초점에 있는 타원에서 긴반지름 a, 초점 거리 c = ae, 근점 거리 r_p = a(1 − e), 원점 거리 r_a = a(1 + e)를 치수선으로 나타낸 모식도</desc><defs><marker id="orbital-eccentricity-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker><marker id="orbital-eccentricity-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="385" y1="169" x2="380" y2="156" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="172" y1="170" x2="172" y2="164" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="462" y1="178" x2="468" y2="183.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="98" y1="178" x2="92" y2="183.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="20" font-size="12" font-weight="700">타원 궤도의 크기와 모양(e = 0.6인 예, 모식)</text><ellipse cx="280" cy="175" rx="180" ry="144" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.06"/><line x1="86" y1="175" x2="474" y2="175" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><circle cx="280" cy="175" r="3" style="stroke:none;fill:currentColor" stroke-width="1.6"/><circle cx="388" cy="175" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="172" cy="175" r="4" style="stroke:currentColor;fill:none" stroke-width="1.4"/><circle cx="460" cy="175" r="3.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="100" cy="175" r="3.5" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="378" y="149" text-anchor="end" font-size="12">중심 천체(초점)</text><text x="172" y="157" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">빈 초점</text><text x="470" y="197" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">근점</text><text x="90" y="197" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">원점</text><text x="286" y="193" font-size="12">중심</text><line x1="280" y1="349" x2="460" y2="349" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" marker-end="url(#orbital-eccentricity-ar)" marker-start="url(#orbital-eccentricity-ar)"/><line x1="280" y1="175" x2="280" y2="353" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><line x1="460" y1="175" x2="460" y2="353" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><text x="468" y="353" font-size="12">a</text><line x1="280" y1="377" x2="388" y2="377" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" marker-end="url(#orbital-eccentricity-ar)" marker-start="url(#orbital-eccentricity-ar)"/><line x1="280" y1="175" x2="280" y2="381" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><line x1="388" y1="175" x2="388" y2="381" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><text x="396" y="381" font-size="12">c = ae</text><line x1="388" y1="405" x2="460" y2="405" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#orbital-eccentricity-ar-1)" marker-start="url(#orbital-eccentricity-ar-1)"/><line x1="388" y1="175" x2="388" y2="409" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><line x1="460" y1="175" x2="460" y2="409" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><text x="468" y="409" font-size="12">r<tspan dy="0.278em" font-size="72%">p</tspan><tspan dy="-0.2em"> = a(1 − e)</tspan></text><line x1="100" y1="433" x2="388" y2="433" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#orbital-eccentricity-ar-1)" marker-start="url(#orbital-eccentricity-ar-1)"/><line x1="100" y1="175" x2="100" y2="437" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><line x1="388" y1="175" x2="388" y2="437" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/><text x="396" y="437" font-size="12">r<tspan dy="0.278em" font-size="72%">a</tspan><tspan dy="-0.2em"> = a(1 + e)</tspan></text></svg>
