<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soil-dressing-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="soil-dressing-t">객토 뒤 혼합층의 점토 함량(가상 예)</title><defs><marker id="soil-dressing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="60" y="80" width="170" height="40" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.3"/><text x="145" y="104" text-anchor="middle" font-size="11">객토층 5 cm (점토 40 %)</text><rect x="60" y="120" width="170" height="120" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.25"/><text x="145" y="180" text-anchor="middle" font-size="11">기존 작토층 15 cm (점토 10 %)</text><text x="145" y="50" text-anchor="middle" font-weight="700">객토 직후</text><line x1="250" y1="190" x2="300" y2="190" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#soil-dressing-ar)"/><text x="275" y="176" text-anchor="middle" font-size="11">갈이로 혼합</text><rect x="320" y="80" width="170" height="160" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.3"/><text x="405" y="170" text-anchor="middle" font-size="11">혼합층 20 cm</text><text x="405" y="190" text-anchor="middle" font-size="11">점토 17.5 %</text><text x="405" y="50" text-anchor="middle" font-weight="700">혼합 후</text><text x="60" y="290" font-size="12">혼합 점토 함량 = (15 × 10 + 5 × 40) ÷ 20 = 17.5 %</text><text x="60" y="312" font-size="12">1,000 m² × 0.05 m = 50 m³(용적밀도 1.3 t/m³ 가정 시 약 65 t)</text></svg>
