<svg class="si si-illus" viewBox="0 0 360 436" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concentration-polarization-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="concentration-polarization-t">농도분극: 막 앞 경계층의 농도 분포</title><defs><marker id="concentration-polarization-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="concentration-polarization-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="concentration-polarization-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="concentration-polarization-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><rect x="200" y="70" width="60" height="180" style="stroke:none;fill:var(--si-amber-f,#fdf0d8)" stroke-width="0" fill-opacity="0.55"/><rect x="260" y="70" width="16" height="180" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><line x1="40" y1="250" x2="340" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#concentration-polarization-ar)"/><line x1="40" y1="250" x2="40" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#concentration-polarization-ar)"/><polyline points="40,230 200,230 207.5,224.3 215,217 222.5,207.7 230,195.6 237.5,180.2 245,160.4 252.5,134.9 260,102.2" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><polyline points="40,230 200,230 207.5,229.5 215,229 222.5,228.5 230,227.9 237.5,227.4 245,226.8 252.5,226.2 260,225.6" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><line x1="276" y1="248" x2="330" y2="248" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" stroke-dasharray="5 4"/><circle cx="260" cy="102.2" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><circle cx="260" cy="225.6" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><line x1="204" y1="90" x2="254" y2="90" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2" marker-end="url(#concentration-polarization-ar-1)"/><line x1="254" y1="114" x2="204" y2="114" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#concentration-polarization-ar-2)"/><line x1="248" y1="176" x2="296" y2="176" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2" marker-end="url(#concentration-polarization-ar-3)"/><line x1="44" y1="18" x2="70" y2="18" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="76" y="23" style="fill:var(--si-rose-s,#c97b7b)">J<tspan baseline-shift="sub" font-size="72%">v</tspan>/k = 2.0  →  C<tspan baseline-shift="sub" font-size="72%">m</tspan>/C<tspan baseline-shift="sub" font-size="72%">b</tspan> = 7.39</text><line x1="44" y1="40" x2="70" y2="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><text x="76" y="45" style="fill:var(--si-blue-s,#7f9ac0)">J<tspan baseline-shift="sub" font-size="72%">v</tspan>/k = 0.2  →  C<tspan baseline-shift="sub" font-size="72%">m</tspan>/C<tspan baseline-shift="sub" font-size="72%">b</tspan> = 1.22</text><text x="196" y="94" text-anchor="end" style="fill:var(--si-accent,#2454ff)">대류 유입 J<tspan baseline-shift="sub" font-size="72%">v</tspan></text><text x="196" y="118" text-anchor="end" style="fill:var(--si-amber-s,#d79a2b)">확산 역류</text><text x="284" y="160" style="fill:var(--si-green-s,#5b9b83)">용매만</text><text x="284" y="196" style="fill:var(--si-green-s,#5b9b83)">통과</text><text x="284" y="108" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">C<tspan baseline-shift="sub" font-size="72%">m</tspan></text><text x="46" y="224" font-weight="700">C<tspan baseline-shift="sub" font-size="72%">b</tspan></text><text x="334" y="238" text-anchor="end" style="fill:var(--si-violet-s,#9382bd)">C<tspan baseline-shift="sub" font-size="72%">p</tspan> ≈ 0</text><text x="120" y="272">벌크</text><text x="230" y="272" text-anchor="middle">경계층</text><text x="268" y="272" text-anchor="middle">막</text><text x="310" y="272" text-anchor="middle">투과측</text><text x="334" y="296" text-anchor="end">거리 →</text><text x="48" y="76">농도 C</text><text x="20" y="334" font-weight="700">C<tspan baseline-shift="sub" font-size="72%">m</tspan>/C<tspan baseline-shift="sub" font-size="72%">b</tspan> = exp(J<tspan baseline-shift="sub" font-size="72%">v</tspan>/k)  (C<tspan baseline-shift="sub" font-size="72%">p</tspan> = 0일 때)</text><text x="20" y="362">J<tspan baseline-shift="sub" font-size="72%">v</tspan>/k가 클수록 막 표면이 지수적으로 짙어진다.</text><text x="20" y="386">가역적 농도 기울기라서 막오염과 구별한다.</text><text x="20" y="418" style="fill:var(--si-general,#5c6b7f)">경계층을 균일하다고 본 단순 모델이다</text></svg>
