10 10 0 0 0 24.6 352.6" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2.4"/><polygon points="22.2,359.2 19.9,350.9 29.3,354.3" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1"/><text x="56" y="362" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">복원 토크: 스프링이 되돌림</text><text x="14" y="392" style="fill:var(--si-general,#5c6b7f)">두 토크가 같아지는 각도에서 지침이 멈춘다</text><text x="14" y="416" font-weight="700">가상 사양: I<tspan dy="0.217em" font-size="92%">g</tspan><tspan dy="-0.2em"> = 1 mA, R</tspan><tspan dy="0.217em" font-size="92%">g</tspan><tspan dy="-0.2em"> = 50 Ω, I</tspan><tspan dy="0.217em" font-size="92%">g</tspan><tspan dy="-0.2em">R</tspan><tspan dy="0.217em" font-size="92%">g</tspan><tspan dy="-0.2em"> = 50 mV</tspan></text><text x="14" y="462" font-weight="700">② 휘트스톤 브리지의 영점 검출</text><polyline points="180,502 145.2,529 136.9,527.9 135,544.5 118.3,542.3 116.4,558.9 99.8,556.7 98.8,565 64,592" style="stroke:currentColor;fill:none" stroke-width="2"/><polyline points="64,592 98.8,619 99.8,627.3 116.4,625.1 118.3,641.7 135,639.5 136.9,656.1 145.2,655 180,682" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><polyline points="180,502 214.8,529 215.8,537.3 232.4,535.1 234.3,551.7 251,549.5 252.9,566.1 261.2,565 296,592" style="stroke:currentColor;fill:none" stroke-width="2"/><polyline points="296,592 261.2,619 252.9,617.9 251,634.5 234.3,632.3 232.4,648.9 215.8,646.7 214.8,655 180,682" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="119" y1="618" x2="125" y2="656" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#galvanometer-lab-ar-1)"/><circle cx="180" cy="502" r="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="64" cy="592" r="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><circle cx="296" cy="592" r="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><c