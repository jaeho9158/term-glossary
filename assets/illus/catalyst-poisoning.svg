ine x1="269" y1="124" x2="257" y2="187" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><text x="153" y="148" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">피독물(S)</text><line x1="151" y1="152" x2="147" y2="167" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1"/><text x="20" y="290" style="fill:var(--si-general,#5c6b7f)">활성점 10개 중 1개(10%)를 S가 덮은 예시</text><text x="90" y="322" text-anchor="middle" font-weight="700">가역</text><text x="270" y="322" text-anchor="middle" font-weight="700">비가역</text><circle cx="70" cy="360" r="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><circle cx="100" cy="352" r="10" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2" stroke-dasharray="4 3"/><text x="100" y="356" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">S</text><line x1="114" y1="346" x2="140" y2="332" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#catalyst-poisoning-ar-1)"/><text x="14" y="404" style="fill:var(--si-general,#5c6b7f)">약한 결합이라 승온 시</text><text x="14" y="424" style="fill:var(--si-general,#5c6b7f)">S가 떨어져 활성 회복</text><ellipse cx="270" cy="360" rx="22" ry="12" transform="rotate(25 270 360)" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><circle cx="298" cy="356" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="298" y="360" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">S</text><text x="190" y="404" style="fill:var(--si-general,#5c6b7f)">활성점 구조가 변해</text><text x="190" y="424" style="fill:var(--si-general,#5c6b7f)">회복이 어렵다</text><text x="20" y="466" font-weight="700">Pt 1 wt%, 분산도 50% → 표면 Pt ≈ 2.56×10⁻⁵ mol/g</text><text x="20" y="488">전부 덮는 S ≈ 0.82 mg, 10%만 덮는 S ≈ 0.082 mg</text><text x="20" y="514" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">S 1 ppm 원료 약 82 g이 촉매 1 g을 지나면</text><text x="20" y="534" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">활성점 10%가 덮인다</text><text x="20" y="560" style="fill:var(--si-general,#5c6b7f)">가정: 1:1 흡착, 전량 흡착, 균일 피독(상한)</text></svg>
