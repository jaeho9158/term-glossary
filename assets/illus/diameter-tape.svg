<svg class="si si-illus" viewBox="0 0 520 330" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diameter-tape-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="diameter-tape-t">흉고직경측정기: 줄기 둘레 C를 재어 지름 d로 환산</title><defs><marker id="diameter-tape-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="224.6" y1="94.9" x2="282" y2="83.5" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><circle cx="170" cy="160" r="80" style="stroke:currentColor;fill:currentColor" stroke-width="1.6" fill-opacity="0.08"/><circle cx="170" cy="160" r="85" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><line x1="90" y1="160" x2="250" y2="160" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#diameter-tape-ar)" marker-start="url(#diameter-tape-ar)"/><circle cx="170" cy="160" r="2.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="284" y="76" font-weight="700" style="fill:var(--si-accent,#2454ff)">둘레 C(테이프)</text><text x="170" y="180" text-anchor="middle" font-weight="700">d</text><text x="170" y="274" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">줄기 단면(원으로 가정)</text><text x="330" y="170">예: C = 94.2 cm</text><text x="330" y="194" font-weight="700">d = 94.2 ÷ π ≈ 30.0 cm</text><text x="20" y="318" font-size="12" style="fill:var(--si-general,#5c6b7f)">d = C ÷ π</text></svg>
