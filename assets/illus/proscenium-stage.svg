<svg class="si si-illus" viewBox="0 0 600 330" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="프로시니엄 무대 단면" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>옆에서 자른 단면. 객석과 무대 사이에 프로시니엄 아치가 서 있고, 아치 개구부에 무대와 객석을 나누는 가상의 수직면이 있다</desc><defs></defs><line x1="40" y1="300" x2="330" y2="300" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><rect x="70" y="256" width="24" height="44" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="0.8" fill-opacity="0.35"/><rect x="112" y="262" width="24" height="38" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="0.8" fill-opacity="0.35"/><rect x="154" y="268" width="24" height="32" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="0.8" fill-opacity="0.35"/><rect x="196" y="274" width="24" height="26" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="0.8" fill-opacity="0.35"/><rect x="238" y="280" width="24" height="20" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="0.8" fill-opacity="0.35"/><rect x="280" y="286" width="24" height="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="0.8" fill-opacity="0.35"/><rect x="326" y="50" width="14" height="110" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.5"/><rect x="340" y="262" width="230" height="38" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.25"/><line x1="333" y1="160" x2="333" y2="262" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="180" y="250" text-anchor="middle" font-size="14">객석</text><text x="455" y="248" text-anchor="middle" font-size="14">무