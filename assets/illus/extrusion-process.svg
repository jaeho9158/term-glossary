<svg class="si si-illus" viewBox="0 0 600 280" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="extrusion-process-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="extrusion-process-t">직접 압출의 구조</title><desc>램이 더미 블록을 거쳐 컨테이너 안의 빌릿을 밀면, 빌릿이 고정된 다이 구멍을 지나며 다이 단면 모양으로 뽑혀 나온다</desc><defs><marker id="extrusion-process-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="80" y="90" width="300" height="20" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><rect x="80" y="210" width="300" height="20" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><rect x="40" y="125" width="60" height="70" style="stroke:currentColor;fill:none" stroke-width="1.2"/><rect x="100" y="140" width="30" height="40" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><rect x="130" y="110" width="220" height="100" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><rect x="350" y="90" width="30" height="50" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><rect x="350" y="180" width="30" height="50" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2"/><rect x="380" y="140" width="170" height="40" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><line x1="20" y1="160" x2="38" y2="160" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#extrusion-process-ar)"/><line x1="480" y1="160" x2="560" y2="160" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#extrusion-process-ar)"/><text x="70" y="250" text-anchor="middle" font-size="12">램</text><line x1="70" y1="240" x2="70" y2="196" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="115" y="58" text-anchor="middle" font-size="12">더미 블록</text><line x1="115" y1="64" x2="115" y2="139" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="240" y="165" text-anchor="middle" font-size="12" font-weight="700">빌릿</text><text x="230" y="78" text-anchor="middle" font-size="12">컨테이너</text><line x1="230" y1="84" x2="230" y2="90" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="365" y="262" text-anchor="middle" font-size="12">다이</text><line x1="365" y1="250" x2="365" y2="231" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="465" y="128" text-anchor="middle" font-size="12">압출재(다이 단면 모양)</text></svg>
