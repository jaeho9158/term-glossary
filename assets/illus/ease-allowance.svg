<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ease-allowance-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ease-allowance-t">여유량: 인체 둘레와 의복 둘레의 차</title><defs></defs><line x1="243" y1="72" x2="308" y2="38" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><circle cx="160" cy="155" r="117" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2.4" fill-opacity="0.18"/><circle cx="160" cy="155" r="110" style="stroke:currentColor;fill:currentColor" stroke-width="2" fill-opacity="0.12"/><text x="160" y="159" text-anchor="middle" font-weight="700">인체 단면</text><text x="160" y="182" text-anchor="middle" font-size="12">가슴둘레 88 cm</text><text x="310" y="31" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">의복 둘레 94 cm(바깥 고리)</text><text x="300" y="150" font-weight="700">여유량 = 의복 치수 − 인체 치수</text><text x="300" y="174" font-weight="700" style="fill:var(--si-accent,#2454ff)">94 − 88 = 6 cm</text><text x="300" y="208" font-size="12">반쪽 패턴의 가슴 너비</text><text x="300" y="231" font-size="12">(88 + 6) ÷ 2 = 47 cm</text><text x="300" y="262" font-size="12" style="fill:var(--si-general,#5c6b7f)">여유량 = 동작 여유량 + 디자인 여유량</text><text x="260" y="298" text-anchor="middle" font-size="10" style="fill:var(--si-general,#5c6b7f)">가상의 값. 두 원의 반지름은 둘레 비율 94/88에 맞췄다</text></svg>
