<svg class="si si-illus" viewBox="0 0 600 285" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thermal-transmittance-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="thermal-transmittance-t">벽의 열관류율</title><desc>실내에서 실외로 열이 지나는 다층 벽 단면. 실내 표면 저항, 세 재료층의 저항, 실외 표면 저항이 직렬로 이어지고, 이를 모두 더한 값의 역수가 열관류율 U다</desc><defs><marker id="thermal-transmittance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="180" y="40" width="14" height="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="406" y="40" width="14" height="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="194" y="40" width="30" height="150" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.2"/><rect x="224" y="40" width="110" height="150" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.15"/><rect x="334" y="40" width="72" height="150" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.3"/><text x="279" y="120" text-anchor="middle" font-size="12">단열재</text><text x="100" y="110" text-anchor="middle" font-size="12">실내 T<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="500" y="110" text-anchor="middle" font-size="12">실외 T<tspan dy="0.278em" font-size="72%">2</tspan></text><line x1="60" y1="210" x2="540" y2="210" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#thermal-transmittance-ar)"/><text x="300" y="232" text-anchor="middle" font-size="12">열류(T<tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> &gt; T</tspan><tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em">)</tspan></text><text x="150" y="24" text-anchor="middle" font-size="12">R<tspan dy="0.278em" font-size="72%">si</tspan></text><line x1="160" y1="28" x2="187" y2="42" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="450" y="24" text-anchor="middle" font-size="12">R<tspan dy="0.278em" font-size="72%">se</tspan></text><line x1="440" y1="28" x2="413" y2="42" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="209" y="32" text-anchor="middle" font-size="12">R<tspan dy="0.278em" font-size="72%">1</tspan></text><text x="279" y="32" text-anchor="middle" font-size="12">R<tspan dy="0.278em" font-size="72%">2</tspan></text><text x="370" y="32" text-anchor="middle" font-size="12">R<tspan dy="0.278em" font-size="72%">3</tspan></text><g class="si-rich" font-size="12" ><text x="230.8" y="268">U = </text><text x="311.6" y="262.2" text-anchor="middle" font-size="9.6">1</text><line x1="255.5" y1="264.2" x2="367.7" y2="264.2" style="stroke:currentColor" stroke-width="0.8"/><text x="311.6" y="272.4" text-anchor="middle" font-size="9.6">R<tspan dy="0.278em" font-size="72%">si</tspan><tspan dy="-0.2em"> + R</tspan><tspan dy="0.278em" font-size="72%">1</tspan><tspan dy="-0.2em"> + R</tspan><tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em"> + R</tspan><tspan dy="0.278em" font-size="72%">3</tspan><tspan dy="-0.2em"> + R</tspan><tspan dy="0.278em" font-size="72%">se</tspan></text></g></svg>
