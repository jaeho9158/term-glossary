<svg class="si si-illus" viewBox="0 0 520 300" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tangential-flow-filtration-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="tangential-flow-filtration-t">접선 흐름 여과의 흐름과 압력</title><defs><marker id="tangential-flow-filtration-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="tangential-flow-filtration-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><line x1="420" y1="134.7" x2="420" y2="146.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><rect x="110" y="75" width="300" height="70" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="2" fill-opacity="0.12"/><line x1="110" y1="137" x2="410" y2="137" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" stroke-dasharray="6 3"/><rect x="110" y="145" width="300" height="50" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="2" fill-opacity="0.12"/><line x1="40" y1="110" x2="110" y2="110" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#tangential-flow-filtration-ar)"/><text x="60" y="88" text-anchor="middle" font-size="12">공급액</text><line x1="410" y1="110" x2="480" y2="110" style="stroke:currentColor;fill:none" stroke-width="2.4" marker-end="url(#tangential-flow-filtration-ar)"/><text x="450" y="88" text-anchor="middle" font-size="12">보유액 출구</text><line x1="170" y1="133" x2="170" y2="175" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6" marker-end="url(#tangential-flow-filtration-ar-1)"/><line x1="260" y1="133" x2="260" y2="175" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6" marker-end="url(#tangential-flow-filtration-ar-1)"/><line x1="350" y1="133" x2="350" y2="175" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6" marker-end="url(#tangential-flow-filtration-ar-1)"/><text x="215" y="184" text-anchor="middle" font-size="12" style="fill:var(--si-violet-s,#9382bd)">투과액</text><line x1="180" y1="106" x2="350" y2="106" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#tangential-flow-filtration-ar)"/><text x="265" y="124" text-anchor="middle" font-size="11">막 표면과 평행하게 순환</text><text x="440" y="137" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">막</text><text x="40" y="136" font-size="11">P<tspan baseline-shift="sub" font-size="72%">F</tspan> = 3.0 bar</text><text x="420" y="159" font-size="11">P<tspan baseline-shift="sub" font-size="72%">R</tspan> = 1.0 bar</text><text x="420" y="195" font-size="11">P<tspan baseline-shift="sub" font-size="72%">P</tspan> = 0 bar</text><text x="260" y="250" text-anchor="middle" font-size="12">TMP = (P<tspan baseline-shift="sub" font-size="72%">F</tspan> + P<tspan baseline-shift="sub" font-size="72%">R</tspan>) / 2 − P<tspan baseline-shift="sub" font-size="72%">P</tspan> = (3.0 + 1.0) / 2 − 0 = 2.0 bar</text><text x="260" y="274" text-anchor="middle" font-size="11">100 L를 10 L로 농축하면 부피 농축 배수 VCF = 10</text></svg>
