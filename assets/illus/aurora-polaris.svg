<svg class="si si-illus" viewBox="0 0 600 360" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aurora-polaris-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="aurora-polaris-t">오로라 오벌</title><desc>지자기 극을 중심으로 본 위도 지도. 지자기 위도 약 67도에 폭 약 6도의 오로라 띠가 있고, 자기폭풍 때 띠가 저위도로 넓어진다</desc><defs><marker id="aurora-polaris-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><circle cx="300" cy="180" r="92" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="24" opacity="0.45"/><circle cx="300" cy="180" r="40" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><circle cx="300" cy="180" r="80" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><circle cx="300" cy="180" r="120" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><circle cx="300" cy="180" r="160" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><circle cx="300" cy="180" r="4" style="stroke:none;fill:currentColor" stroke-width="1.6"/><text x="300" y="200" text-anchor="middle" font-size="12">지자기 극</text><text x="300" y="136" text-anchor="middle" font-size="11">80°</text><text x="300" y="56" text-anchor="middle" font-size="11">60°</text><text x="300" y="16" text-anchor="middle" font-size="11">50°</text><text x="470" y="60" font-size="12">오로라 오벌</text><line x1="470" y1="60" x2="365" y2="115" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="365" cy="115" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="470" y="76" font-size="11">약 67°, 폭 약 6°</text><line x1="406" y1="180" x2="452" y2="180" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#aurora-polaris-ar)"/><text x="472" y="214" font-size="12">자기폭풍 때</text><text x="472" y="230" font-size="12">저위도로 넓어짐</text></svg>
