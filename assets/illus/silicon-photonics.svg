<svg class="si si-illus" viewBox="0 0 620 340" style="max-width:620px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="silicon-photonics-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="silicon-photonics-t">SOI 실리콘 도파로 단면</title><desc>실리콘 기판 위 실리카에 실리콘 코어가 둘러싸여 있고 빛의 모드가 코어 주변에 갇힌 단면 모식도</desc><defs></defs><rect x="40" y="250" width="360" height="50" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.35"/><rect x="40" y="110" width="360" height="140" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1" fill-opacity="0.07"/><rect x="180" y="160" width="80" height="30" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.7"/><ellipse cx="220" cy="175" rx="58" ry="30" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" stroke-dasharray="5 3"/><text x="430" y="70" font-size="12">실리카(SiO<tspan dy="0.278em" font-size="72%">2</tspan><tspan dy="-0.2em">) n ≈ 1.44</tspan></text><line x1="426" y1="66" x2="300" y2="125" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="430" y="130" font-size="12">실리콘 코어 n ≈ 3.5</text><line x1="426" y1="126" x2="250" y2="172" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="430" y="185" font-size="12">빛이 갇힌 모드</text><line x1="426" y1="181" x2="274" y2="182" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="430" y="280" font-size="12">실리콘 기판</text><line x1="426" y1="276" x2="398" y2="280" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="220" y="322" text-anchor="middle" font-size="12">실리카 층 위에 실리콘 층을 올린 구조(SOI)</text></svg>
