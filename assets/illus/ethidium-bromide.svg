<svg class="si si-illus" viewBox="0 0 540 300" style="max-width:540px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ethidium-bromide-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ethidium-bromide-t">에티듐 브로마이드의 DNA 삽입(intercalation)</title><defs></defs><line x1="130" y1="86" x2="104" y2="86" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="110" y1="50" x2="110" y2="260" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><line x1="250" y1="50" x2="250" y2="260" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><line x1="110" y1="60" x2="250" y2="60" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.7"/><line x1="110" y1="86" x2="250" y2="86" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.7"/><line x1="110" y1="112" x2="250" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.7"/><line x1="110" y1="138" x2="250" y2="138" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.7"/><line x1="110" y1="196" x2="250" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.7"/><line x1="110" y1="222" x2="250" y2="222" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.7"/><line x1="110" y1="248" x2="250" y2="248" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.7"/><rect x="135" y="164" width="90" height="8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.5" fill-opacity="0.8"/><text x="180" y="40" text-anchor="middle" font-weight="700">DNA 이중나선(펼친 모식)</text><text x="102" y="86" text-anchor="end">염기쌍</text><text x="102" y="168" text-anchor="end" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">삽입</text><text x="180" y="282" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">붉은 판 = 염기쌍 사이에 끼어든 에티듐 브로마이드</text><text x="300" y="100">자외선을 쬐면</text><text x="300" y="122" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">주황~붉은 형광(약 605 nm)</text><text x="300" y="166">DNA에 결합하면 형광이</text><text x="300" y="188" font-weight="700">약 20배 가까이 세진다</text></svg>
