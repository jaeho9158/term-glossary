<svg class="si si-illus" viewBox="0 0 520 356" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mid-upper-arm-circumference-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="mid-upper-arm-circumference-t">위팔 중간 둘레(MUAC)와 팔 근육 둘레(AMC)</title><desc>견봉과 주두의 중간점에서 위팔 둘레를 재고, 피하지방 두께를 빼 근육 둘레를 구하는 위치와 단면을 보인다.</desc><defs></defs><line x1="40" y1="88" x2="40" y2="128.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="300" y1="88" x2="300" y2="128.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="170" y1="112" x2="170" y2="128.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="177.5" y1="205.1" x2="288" y2="195" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="181.2" y1="231.3" x2="288" y2="225" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="172.5" y1="256.4" x2="288" y2="255" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="153" y1="264.3" x2="288" y2="264.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="132.5" y1="249.3" x2="288" y2="294.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="260" y="24" text-anchor="middle" font-size="12" font-weight="700">위팔 둘레(MUAC)를 재는 위치</text><rect x="40" y="62" width="260" height="44" rx="20" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="1.6" fill-opacity="0.07"/><circle cx="40" cy="84" r="4.5" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="300" cy="84" r="4.5" style="stroke:none;fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><ellipse cx="170" cy="84" rx="6" ry="26" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2"/><text x="40" y="142" text-anchor="middle" font-size="12">견봉(어깨)</text><text x="300" y="142" text-anchor="middle" font-size="12">주두(팔꿈치)</text><text x="170" y="142" text-anchor="middle" font-size="12">중간점: 줄자를 두르는 곳</text><text x="130" y="178" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">중간점 단면(모식)</text><circle cx="130" cy="245" r="62" style="stroke:currentColor;fill:var(--si-amber-s,#d79a2b)" stroke-width="2" fill-opacity="0.35"/><circle cx="130" cy="245" r="44" style="stroke:currentColor;fill:var(--si-limit,#7d2626)" stroke-width="1.6" fill-opacity="0.3"/><circle cx="130" cy="245" r="14" style="stroke:currentColor;fill:currentColor" stroke-width="1.2" fill-opacity="0.45"/><text x="290" y="188" font-size="12">MUAC: 바깥 둘레 26.0 cm</text><text x="290" y="218" font-size="12">피하지방층</text><text x="290" y="248" font-size="12">AMC: 근육 둘레 22.2 cm</text><text x="290" y="278" font-size="12">근육</text><text x="290" y="308" font-size="12">뼈</text><text x="260" y="342" text-anchor="middle">AMC = MUAC − π × TSF = 26.0 − π × 1.2 ≈ 22.2 cm</text></svg>
