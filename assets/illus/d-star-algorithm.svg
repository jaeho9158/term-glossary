hor="middle" font-weight="700">G</text><circle cx="112" cy="197" r="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><line x1="16" y1="312" x2="46" y2="312" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4" stroke-dasharray="6 4"/><text x="54" y="316">초기 경로(목표에서 거꾸로 계산)</text><line x1="16" y1="338" x2="46" y2="338" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.2"/><text x="54" y="342">지나온 경로</text><line x1="16" y1="364" x2="46" y2="364" style="stroke:var(--si-pos,#14543c);fill:none" stroke-width="3.2"/><text x="54" y="368">다시 계산한 새 경로</text><rect x="16" y="382" width="30" height="18" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4" stroke-dasharray="5 3" fill-opacity="0.45"/><text x="54" y="394">값이 바뀌어 갱신되는 주변 노드</text><rect x="24" y="408" width="14" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="54" y="420">새로 발견한 장애물</text><circle cx="31" cy="444" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="54" y="448">로봇의 현재 위치</text><text x="14" y="478">S: 출발 위치, G: 목표 노드</text><text x="14" y="510" font-weight="700">이동하며 탐색 → 새 장애물 발견 →</text><text x="14" y="534" font-weight="700">주변 노드 갱신 → 다시 이동하며 탐색</text><text x="14" y="564" style="fill:var(--si-general,#5c6b7f)">전체 지도를 처음부터 다시 탐색하지 않고</text><text x="14" y="586" style="fill:var(--si-general,#5c6b7f)">비용이 바뀐 주변만 우선순위 큐로 전파</text></svg>
