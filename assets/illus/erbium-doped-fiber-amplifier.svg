<svg class="si si-illus" viewBox="0 0 540 290" style="max-width:540px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erbium-doped-fiber-amplifier-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="erbium-doped-fiber-amplifier-t">어븀첨가 광섬유증폭기(EDFA)의 구성</title><defs><marker id="erbium-doped-fiber-amplifier-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="erbium-doped-fiber-amplifier-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="170" y="130" width="200" height="60" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2.4" fill-opacity="0.15"/><text x="270" y="165" text-anchor="middle" font-weight="700">어븀 첨가 광섬유(EDF)</text><rect x="210" y="36" width="120" height="40" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2" fill-opacity="0.15"/><text x="270" y="61" text-anchor="middle" font-weight="700">펌프 레이저</text><line x1="270" y1="76" x2="270" y2="130" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#erbium-doped-fiber-amplifier-ar)"/><text x="282" y="108" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">펌프광 980 nm 또는 1480 nm</text><line x1="30" y1="160" x2="170" y2="160" style="stroke:currentColor;fill:none" stroke-width="2.2" marker-end="url(#erbium-doped-fiber-amplifier-ar-1)"/><text x="100" y="142" text-anchor="middle">신호광</text><text x="100" y="182" text-anchor="middle" font-size="12">1550 nm 부근</text><line x1="370" y1="160" x2="500" y2="160" style="stroke:currentColor;fill:none" stroke-width="3.6" marker-end="url(#erbium-doped-fiber-amplifier-ar-1)"/><text x="435" y="142" text-anchor="middle" font-weight="700">증폭된 신호광</text><text x="435" y="182" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">+ ASE 잡음</text><text x="270" y="226" text-anchor="middle">어븀 이온(Er<tspan baseline-shift="super" font-size="72%">3+</tspan>)이 펌프광으로 들뜨고, 지나가는 신호광이 유도방출을 일으켜 증폭된다</text><text x="270" y="250" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">전기 신호로 바꾸지 않고 빛 그대로 증폭하며, 증폭할수록 ASE 잡음이 쌓인다</text></svg>
