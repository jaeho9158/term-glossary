x2="62" y2="618" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#glucose-alanine-cycle-ar)"/><text x="14" y="640" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">요소회로 → 요소 배설</text><text x="14" y="672">질소(파랑)는 간에서 빠져나가고</text><text x="14" y="692">탄소(주황)만 고리를 돈다.</text><text x="14" y="722" style="fill:var(--si-general,#5c6b7f)">순 포도당 생성이 아니며</text><text x="14" y="742" style="fill:var(--si-general,#5c6b7f)">혈당 기여는 제한적이다.</text><text x="14" y="762" style="fill:var(--si-general,#5c6b7f)">코리회로(젖산)와 나란히 작동한다.</text></svg>
