<svg class="si si-illus" viewBox="0 0 520 290" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="벤젠 고리와 비편재화한 π 전자" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>정육각형 탄소 고리 안쪽에 원을 그려 π 전자가 고리 전체에 퍼진 모습을 나타낸 골격식. 각 C-C 결합의 결합 차수는 1.5</desc><defs></defs><polygon points="260,80 199.4,115 199.4,185 260,220 320.6,185 320.6,115" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.4"/><circle cx="260" cy="150" r="40" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><text x="220" y="84.7" text-anchor="middle" font-size="11">1.5</text><text x="180" y="154" text-anchor="middle" font-size="11">1.5</text><text x="220" y="223.3" text-anchor="middle" font-size="11">1.5</text><text x="300" y="223.3" text-anchor="middle" font-size="11">1.5</text><text x="340" y="154" text-anchor="middle" font-size="11">1.5</text><text x="300" y="84.7" text-anchor="middle" font-size="11">1.5</text><text x="440" y="60" text-anchor="middle" font-size="12">고리 전체에 퍼진 π 전자</text><line x1="440" y1="60" x2="294.6" y2="130" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="294.6" cy="130" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="260" y="265" text-anchor="middle" font-size="12">벤젠(탄소 6개 고리, 수소는 생략)</text></svg>
