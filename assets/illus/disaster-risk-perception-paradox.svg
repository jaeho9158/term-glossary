<svg class="si si-illus" viewBox="0 0 360 456" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="disaster-risk-perception-paradox-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="disaster-risk-perception-paradox-t">위험인식이 같아도 대처 평가에 따라 대비 행동이 갈린다</title><defs><marker id="disaster-risk-perception-paradox-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="38" y1="250" x2="38" y2="84" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="34" y1="250" x2="38" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="30" y="254" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">0%</text><line x1="34" y1="170" x2="38" y2="170" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="30" y="174" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">25%</text><line x1="34" y1="90" x2="38" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="30" y="94" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">50%</text><line x1="38" y1="250" x2="160" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="210" y1="250" x2="336" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="14" y="66" style="fill:var(--si-general,#5c6b7f)">대비 비율</text><text x="105" y="40" text-anchor="middle" font-weight="700">위험인식 기준</text><text x="263" y="40" text-anchor="middle" font-weight="700">대처 평가 기준</text><rect x="60" y="170" width="36" height="80" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="78" y="162" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">15/60</text><text x="78" y="142" text-anchor="middle" font-weight="700">25%</text><rect x="114" y="170" width="36" height="80" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="132" y="162" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">10/40</text><text x="132" y="142" text-anchor="middle" font-weight="700">25%</text><rect x="220" y="122" width="36" height="128" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="238" y="114" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">12/30</text><text x="238" y="94" text-anchor="middle" font-weight="700">40%</text><rect x="270" y="218" width="36" height="32" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="288" y="210" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">3/30</text><text x="288" y="190" text-anchor="middle" font-weight="700">10%</text><text x="78" y="270" text-anchor="middle">높음</text><text x="132" y="270" text-anchor="middle">낮음</text><text x="238" y="270" text-anchor="middle">높음</text><text x="288" y="270" text-anchor="middle">낮음</text><text x="105" y="112" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">차이 없음</text><line x1="256" y1="122" x2="322" y2="122" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="322" y1="124" x2="322" y2="216" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#disaster-risk-perception-paradox-ar)" marker-start="url(#disaster-risk-perception-paradox-ar)"/><text x="329" y="176" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">4배</text><text x="14" y="312">위험인식 기준 오즈비 = (15/45) ÷ (10/30) = 1.0</text><text x="14" y="338">대처 평가 높음은 낮음의 4배 (40% 대 10%)</text><text x="14" y="364" style="fill:var(--si-general,#5c6b7f)">오른쪽은 위험인식 높음 60가구를 나눈 것</text><text x="14" y="390" style="fill:var(--si-general,#5c6b7f)">가상 예시 수치이며 실제 조사 결과가 아니다</text><text x="14" y="416" font-weight="700">인식이 높아도 대처 평가가 낮으면 행동으로</text><text x="14" y="438" font-weight="700">잘 이어지지 않는다</text></svg>
