<svg class="si si-illus" viewBox="0 0 360 536" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capital-gains-tax-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="capital-gains-tax-t">양도소득세 계산 폭포 도해</title><defs><marker id="capital-gains-tax-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="12" y="22" font-size="14" font-weight="700">양도소득세: 금액이 깎여 나가는 순서</text><rect x="122" y="44" width="220" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="8" y="61" font-weight="700">양도가액</text><rect x="218" y="80" width="124" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="8" y="97">− 취득가액</text><rect x="196" y="116" width="22" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="8" y="133">− 필요경비</text><rect x="122" y="152" width="74" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="8" y="169" font-weight="700">양도차익</text><rect x="168" y="188" width="28" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="8" y="205">− 장기보유특별공제</text><rect x="158" y="224" width="10" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="8" y="241">− 기본공제</text><rect x="122" y="260" width="36" height="24" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><text x="8" y="277" font-weight="700">과세표준</text><text x="204" y="205" style="fill:var(--si-amber-s,#d79a2b)">보유·거주 기간별</text><line x1="218" y1="68" x2="218" y2="80" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="196" y1="104" x2="196" y2="116" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="196" y1="140" x2="196" y2="152" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="168" y1="176" x2="168" y2="188" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="158" y1="212" x2="158" y2="224" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="158" y1="248" x2="158" y2="260" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="122" y="296" width="74" height="24" rx="4" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="159" y="313" text-anchor="middle" font-weight="700">× 세율</text><line x1="200" y1="308" x2="222" y2="308" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#capital-gains-tax-ar)"/><text x="228" y="313" font-weight="700">양도소득세</text><text x="8" y="313">세율 적용</text><text x="122" y="338" style="fill:var(--si-general,#5c6b7f)">세율: 보유 기간·자산 종류별로 다름</text><text x="12" y="372">양도차익 = 양도가액 − 취득가액 − 필요경비</text><text x="12" y="406">과세표준 = 양도차익</text><text x="12" y="425">　　　− 장기보유특별공제 − 기본공제</text><text x="12" y="460" font-weight="700">분류과세: 다른 소득과 합산하지 않는다</text><text x="12" y="490" style="fill:var(--si-general,#5c6b7f)">세율·공제 요건은 자주 개정된다</text><text x="12" y="522" style="fill:var(--si-general,#5c6b7f)">막대 길이는 구조를 보이는 가상 비율이다</text></svg>
