<svg class="si si-illus" viewBox="0 0 360 618" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fad-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="fad-t">FAD: 전위 사다리와 복합체 I 우회</title><defs><marker id="fad-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="fad-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="fad-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">FAD의 전자전달계 진입 지점</text><text x="14" y="46" font-weight="700">표준 환원 전위 (V)</text><text x="14" y="70" style="fill:var(--si-general,#5c6b7f)">위가 −, 아래가 +</text><line x1="36" y1="84" x2="36" y2="392" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#fad-ar)"/><line x1="46" y1="100" x2="200" y2="100" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><text x="50" y="93" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">NADH  −0.320 V</text><line x1="46" y1="128" x2="330" y2="128" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3"/><text x="50" y="121" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">FAD  −0.219 V</text><line x1="46" y1="384" x2="330" y2="384" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3"/><text x="76" y="377" font-weight="700">O<tspan dy="0.286em" font-size="70%">2</tspan><tspan dy="-0.2em">  +0.816 V</tspan></text><rect x="130" y="168" width="80" height="38" rx="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="170" y="192" text-anchor="middle" font-weight="700">복합체 I</text><rect x="250" y="168" width="80" height="38" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="290" y="192" text-anchor="middle" font-weight="700">복합체 II</text><rect x="130" y="242" width="200" height="30" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><text x="230" y="262" text-anchor="middle" font-weight="700">유비퀴논</text><line x1="170" y1="100" x2="170" y2="166" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#fad-ar-1)"/><line x1="170" y1="208" x2="170" y2="240" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#fad-ar-1)"/><line x1="290" y1="128" x2="290" y2="166" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6" marker-end="url(#fad-ar-2)"/><line x1="290" y1="208" x2="290" y2="240" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6" marker-end="url(#fad-ar-2)"/><polyline points="130,258 60,258 60,380" style="stroke:currentColor;fill:none" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="60" y1="366" x2="60" y2="380" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#fad-ar)"/><rect x="138" y="288" width="196" height="52" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6" stroke-dasharray="5 4"/><text x="146" y="308">FADH<tspan dy="0.286em" font-size="70%">2</tspan><tspan dy="-0.2em">는 복합체 I을 건너뜀</tspan></text><text x="146" y="330" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">→ P/O가 낮은 이유</text><text x="146" y="355" font-weight="700">P/O  NADH 2.5, FADH<tspan dy="0.286em" font-size="70%">2</tspan><tspan dy="-0.2em"> 1.5</tspan></text><rect x="14" y="404" width="24" height="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><text x="46" y="413">NADH→O<tspan dy="0.286em" font-size="70%">2</tspan><tspan dy="-0.2em">  ΔG°′ ≈ −219 kJ/mol</tspan></text><rect x="14" y="428" width="24" height="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0"/><text x="46" y="437">FAD→O<tspan dy="0.286em" font-size="70%">2</tspan><tspan dy="-0.2em">  ΔG°′ ≈ −200 kJ/mol</tspan></text><text x="14" y="468" font-weight="700">ΔG°′ = −nFΔE°′  (F = 96.5 kJ/(V·mol))</text><text x="14" y="500" font-weight="700">FAD의 세 산화 상태</text><rect x="14" y="530" width="74" height="34" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="51" y="552" text-anchor="middle" font-weight="700">FAD</text><rect x="140" y="530" width="74" height="34" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="177" y="552" text-anchor="middle" font-weight="700">FADH•</text><rect x="266" y="530" width="80" height="34" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="306" y="552" text-anchor="middle" font-weight="700">FADH<tspan dy="0.286em" font-size="70%">2</tspan></text><line x1="92" y1="547" x2="136" y2="547" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#fad-ar)"/><text x="114" y="524" text-anchor="middle">e⁻ 1개</text><line x1="218" y1="547" x2="262" y2="547" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#fad-ar)"/><text x="240" y="524" text-anchor="middle">e⁻ 2개</text><text x="14" y="600" style="fill:var(--si-general,#5c6b7f)">산화형 FAD는 약 450 nm에서 빛을 가장 잘 흡수</text></svg>
