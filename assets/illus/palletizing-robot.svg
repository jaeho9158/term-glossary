<svg class="si si-illus" viewBox="0 0 600 330" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="palletizing-robot-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="palletizing-robot-t">팔레타이징 로봇</title><desc>제품이 높은 곳에서 들어와 층 형성 테이블에서 한 층으로 정렬되고, 로봇 팔 끝의 말단 장치가 이를 집어 팔레트 위에 층층이 쌓는다. 층마다 상자를 엇갈려 쌓는다</desc><defs></defs><rect x="40" y="90" width="150" height="20" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="115" y="58" text-anchor="middle" font-size="11">높은 곳에서 들어오는 제품</text><rect x="60" y="70" width="26" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="110" y="70" width="26" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="155" y="70" width="26" height="20" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="200" y="130" width="130" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="265" y="164" text-anchor="middle" font-size="12">층 형성 테이블</text><rect x="205" y="108" width="32" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="240" y="108" width="32" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="275" y="108" width="32" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><line x1="420" y1="300" x2="420" y2="120" style="stroke:currentColor;fill:none" stroke-width="6"/><line x1="420" y1="120" x2="300" y2="60" style="stroke:currentColor;fill:none" stroke-width="5"/><rect x="280" y="60" width="40" height="14" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="250" y="30" text-anchor="middle" font-size="12">말단 장치(그리퍼)</text><line x1="250" y1="30" x2="300" y2="60" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="300" cy="60" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/><text x="410" y="200" text-anchor="end" font-size="12">로봇 팔</text><rect x="440" y="280" width="140" height="12" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="444" y="256" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="478" y="256" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="512" y="256" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="546" y="256" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="454" y="232" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="488" y="232" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="522" y="232" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="556" y="232" width="20" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="444" y="208" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="478" y="208" width="30" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><rect x="512" y="208" width="30" height="22" style="stroke:var(--si-amber-s,#