" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#acculturation-model-ar)"/><text x="205" y="374" text-anchor="middle">정착국 문화 수용</text><text x="70" y="394" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">낮음</text><text x="340" y="394" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">높음</text><text x="8" y="38" font-weight="700">원문화 유지</text><text x="34" y="78" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">높음</text><text x="34" y="340" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">낮음</text><text x="14" y="424">통합은 더 나은 적응, 주변화는 더 나쁜 적응과</text><text x="14" y="448">연결되는 경향이 있다.</text><text x="14" y="478" style="fill:var(--si-general,#5c6b7f)">베리(2006): 13개국 이민 청소년 7,997명</text><text x="14" y="502" style="fill:var(--si-general,#5c6b7f)">자발적 이주자는 난민보다 스트레스가 약 50% 적다.</text></svg>
