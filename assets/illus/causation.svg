-weight="700">INUS: 불충분하지만 필수인 부분,</text><text x="180" y="408" text-anchor="middle" font-weight="700">그 묶음은 충분하지만 불필요</text><text x="180" y="448" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">예) A 성냥 긋기 · B 산소 · C 마른 재료</text></svg>
