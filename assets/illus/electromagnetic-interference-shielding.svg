<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="electromagnetic-interference-shielding-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="electromagnetic-interference-shielding-t">전자파 차폐: 반사, 흡수, 다중 반사</title><defs><marker id="electromagnetic-interference-shielding-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="electromagnetic-interference-shielding-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="280" y1="186" x2="308" y2="186.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><rect x="230" y="70" width="60" height="180" style="stroke:currentColor;fill:currentColor" stroke-width="2.4" fill-opacity="0.2"/><text x="260" y="60" text-anchor="middle" font-weight="700">차폐판</text><line x1="60" y1="140" x2="230" y2="140" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3" marker-end="url(#electromagnetic-interference-shielding-ar)"/><text x="60" y="126" font-size="12" style="fill:var(--si-accent,#2454ff)">입사파</text><line x1="230" y1="150" x2="90" y2="185" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#electromagnetic-interference-shielding-ar-1)"/><text x="60" y="205" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">반사 (SE<tspan baseline-shift="sub" font-size="72%">R</tspan>)</text><text x="260" y="270" text-anchor="middle" font-size="12" font-weight="700">흡수 (SE<tspan baseline-shift="sub" font-size="72%">A</tspan>): 도체 안에서 줄어듦</text><polyline points="275,128 242,160 278,185 246,215" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" stroke-dasharray="4 3"/><text x="310" y="200" font-size="12">다중 반사 (SE<tspan baseline-shift="sub" font-size="72%">M</tspan>)</text><line x1="290" y1="140" x2="400" y2="140" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.2" opacity="0.55" marker-end="url(#electromagnetic-interference-shielding-ar)"/><text x="410" y="134" font-size="12">투과파(약해짐)</text><text x="60" y="306" font-size="12" style="fill:var(--si-general,#5c6b7f)">SE = SE<tspan baseline-shift="sub" font-size="72%">R</tspan> + SE<tspan baseline-shift="sub" font-size="72%">A</tspan> + SE<tspan baseline-shift="sub" font-size="72%">M</tspan>   (흡수가 충분히 크면 SE<tspan baseline-shift="sub" font-size="72%">M</tspan>은 무시)</text></svg>
