<svg class="si si-illus" viewBox="0 0 360 380" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="accrued-liabilities-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="accrued-liabilities-t">미지급비용: 결산일까지 쌓인 이자를 부채로 인식</title><defs><marker id="accrued-liabilities-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="232" y1="150" x2="242" y2="150" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="30" y1="250" x2="340" y2="250" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#accrued-liabilities-ar)"/><polygon points="46,250 226,250 226,110" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="2.2" fill-opacity="0.25"/><rect x="220" y="110" width="12" height="140" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.75"/><line x1="46" y1="250" x2="46" y2="262" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="226" y1="250" x2="226" y2="262" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="318" y1="250" x2="318" y2="262" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="46" y="286" text-anchor="middle" font-weight="700">차입일</text><text x="226" y="286" text-anchor="middle" font-weight="700">결산일</text><text x="318" y="286" text-anchor="middle" font-weight="700">지급일</text><line x1="46" y1="306" x2="226" y2="306" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#accrued-liabilities-ar)" marker-start="url(#accrued-liabilities-ar)"/><text x="136" y="298" text-anchor="middle">90일</text><text x="14" y="36" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">누적 발생 이자</text><text x="14" y="62" style="fill:var(--si-general,#5c6b7f)">비용은 쌓이지만 현금은 안 나간다</text><text x="244" y="106" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">미지급비용(부채)</text><text x="244" y="128">≈ 147.95달러</text><text x="244" y="150">= 10,000 × 0.06 ×</text><g class="si-rich" font-size="13" ><text x="256.7" y="171.8" text-anchor="middle" font-size="10.4">90</text><line x1="245.5" y1="173.8" x2="267.8" y2="173.8" style="stroke:currentColor" stroke-width="0.8"/><text x="256.7" y="182.8" text-anchor="middle" font-size="10.4">365</text></g><text x="180" y="350" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">가상 예: 원금 10,000달러, 연 6%, 365일 기준</text></svg>
