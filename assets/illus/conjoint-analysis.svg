<svg class="si si-illus" viewBox="0 0 360 470" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="컨조인트 분석: 부분가치 범위가 상대적 중요도가 된다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="conjoint-analysis-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="conjoint-analysis-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="conjoint-analysis-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="14" y="24" font-weight="700">속성별 부분가치의 범위(가상의 예)</text><line x1="22" y1="150" x2="340" y2="150" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 3"/><text x="14" y="46">점: 최고·최저 부분가치(점선은 최저 기준)</text><circle cx="66" cy="150" r="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="66" cy="92.4" r="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><line x1="82" y1="150" x2="82" y2="92.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.1" marker-end="url(#conjoint-analysis-ar)" marker-start="url(#conjoint-analysis-ar)"/><text x="90" y="125.2" font-weight="700" style="fill:var(--si-blue-t,#12305c)">범위 2.4</text><text x="66" y="170" text-anchor="middle" font-weight="700">가격</text><circle cx="166" cy="150" r="5" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6"/><circle cx="166" cy="126" r="5" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6"/><line x1="182" y1="150" x2="182" y2="126" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.1" marker-end="url(#conjoint-analysis-ar-1)" marker-start="url(#conjoint-analysis-ar-1)"/><text x="190" y="142" font-weight="700" style="fill:var(--si-green-t,#14543c)">범위 1.0</text><text x="166" y="170" text-anchor="middle" font-weight="700">배터리</text><circle cx="266" cy="150" r="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="266" cy="135.6" r="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><line x1="282" y1="150" x2="282" y2="135.6" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.1" marker-end="url(#conjoint-analysis-ar-2)" marker-start="url(#conjoint-analysis-ar-2)"/><text x="290" y="146.8" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">범위 0.6</text><text x="266" y="170" text-anchor="middle" font-weight="700">브랜드</text><text x="66" y="80.4" text-anchor="middle">최고</text><text x="14" y="218" font-weight="700">범위 합 4.0을 100%로 본 상대적 중요도</text><rect x="20" y="236" width="192" height="54" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="116" y="258" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">가격</text><text x="116" y="278" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">60%</text><rect x="212" y="236" width="80" height="54" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="252" y="258" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">배터리</text><text x="252" y="278" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">25%</text><rect x="292" y="236" width="48" height="54" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="316" y="258" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">브랜드</text><text x="316" y="278" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">15%</text><text x="180" y="314" text-anchor="middle">범위 합 = 2.4 + 1.0 + 0.6 = 4.0</text><text x="14" y="348" font-weight="700">상대적 중요도 = 속성 범위 ÷ 범위의 합</text><text x="14" y="368" font-weight="700">지불의사액 = 부분가치 차이</text><text x="14" y="388" font-weight="700">÷ 가격 한 단위의 부분가치</text><text x="14" y="422">범위가 큰 속성일수록 중요도가 크다</text><text x="14" y="442">수준 범위를 좁게 잡으면 중요도도 낮아진다</text></svg>
