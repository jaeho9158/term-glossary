<svg class="si si-illus" viewBox="0 0 520 300" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="southern-oscillation-index-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="southern-oscillation-index-t">남방진동지수의 두 관측 지점과 계산</title><defs><marker id="southern-oscillation-index-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="30" y="100" width="460" height="90" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.12"/><text x="260" y="120" text-anchor="middle" font-size="12">적도 태평양(개략도)</text><circle cx="80" cy="145" r="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="80" y="173" text-anchor="middle" font-size="12">다윈(호주, 서쪽)</text><circle cx="440" cy="145" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="440" y="173" text-anchor="middle" font-size="12">타히티(동쪽)</text><line x1="100" y1="80" x2="420" y2="80" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#southern-oscillation-index-ar)"/><text x="260" y="70" text-anchor="middle">기압차 P<tspan baseline-shift="sub" font-size="72%">diff</tspan> = 타히티 − 다윈</text><text x="260" y="230" text-anchor="middle">SOI = 10 × (P<tspan baseline-shift="sub" font-size="72%">diff</tspan> − P<tspan baseline-shift="sub" font-size="72%">diff,av</tspan>) ÷ SD(P<tspan baseline-shift="sub" font-size="72%">diff</tspan>)</text><text x="260" y="256" text-anchor="middle" font-size="12">지속되는 +7 이상: 라니냐 경향 / −7 이하: 엘니뇨 경향(관례)</text><text x="260" y="280" text-anchor="middle" font-size="11">가상 예: P<tspan baseline-shift="sub" font-size="72%">diff</tspan> 4.8 hPa, 평균 3.0, 표준편차 2.0 → SOI = 9</text></svg>
