<svg class="si si-illus" viewBox="0 0 360 768" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="저체중출생아: 체중 기준·조산·성장제한 구분" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="8" y="22" font-weight="700">출생 체중 기준 (재태 주수와 무관)</text><text x="30" y="52" font-weight="700" style="fill:var(--si-blue-t,#12305c)">저체중출생아: 2,500 g 미만</text><rect x="30" y="58" width="193.8" height="16" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.4"/><text x="30" y="106" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">극소저체중: 1,500 g 미만</text><rect x="30" y="112" width="116.3" height="16" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.4"/><text x="30" y="160" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">초극소저체중: 1,000 g 미만</text><rect x="30" y="166" width="77.5" height="16" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.4"/><line x1="30" y1="212" x2="340" y2="212" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="30" y1="212" x2="30" y2="217" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="107.5" y1="212" x2="107.5" y2="217" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="185" y1="212" x2="185" y2="217" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="262.5" y1="212" x2="262.5" y2="217" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="340" y1="212" x2="340" y2="217" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="30" y="236" text-anchor="middle">0</text><text x="185" y="236" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">2,000</text><text x="340" y="236" text-anchor="end">4,000 g</text><line x1="8" y1="254" x2="352" y2="254" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.5"/><text x="8" y="278" font-weight="700">주수와 체중은 따로 잰다: 두 원인이 겹칠 수 있음</text><rect x="44" y="296" width="300" height="180" rx="2" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="44" y="410" width="300" height="66" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="0" fill-opacity="0.18"/><rect x="44" y="296" width="162" height="180" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="0" fill-opacity="0.14"/><line x1="206" y1="296" x2="206" y2="476" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2"/><line x1="44" y1="410" x2="344" y2="410" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.2"/><text x="8" y="390" style="fill:var(--si-general,#5c6b7f)">체중</text><text x="8" y="480" style="fill:var(--si-general,#5c6b7f)">작음</text><text x="8" y="308" style="fill:var(--si-general,#5c6b7f)">큼</text><text x="206" y="498" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">37주</text><text x="44" y="498" style="fill:var(--si-general,#5c6b7f)">짧음</text><text x="344" y="498" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">재태 주수 길다</text><text x="52" y="318" font-weight="700" style="fill:var(--si-blue-t,#12305c)">37주 전 출생</text><text x="52" y="338" font-weight="700" style="fill:var(--si-blue-t,#12305c)">= 조산</text><text x="52" y="400" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">2,500 g</text><text x="52" y="442">조산 + 저체중 겹침</text><text x="216" y="442" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">성장제한</text><line x1="8" y1="534" x2="352" y2="534" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.5"/><text x="8" y="556" font-weight="700">저체중출생아 비율(%)</text><text x="30" y="582" style="fill:var(--si-green-t,#14543c)">동아시아·태평양 약 6%</text><rect x="30" y="588" width="60" height="16" rx="3" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.4"/><text x="30" y="634" style="fill:var(--si-blue-t,#12305c)">전 세계 14.6% (2015)</text><rect x="30" y="640" width="146" height="16" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.4"/><text x="30" y="686" style="fill:var(--si-rose-t,#7d2626)">남아시아 약 28%</text><rect x="30" y="692" width="280" height="16" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.4"/><text x="8" y="752" style="fill:var(--si-general,#5c6b7f)">막대 길이는 비율에 비례한다.</text></svg>
