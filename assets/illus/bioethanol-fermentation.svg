<svg class="si si-illus" viewBox="0 0 360 534" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bioethanol-fermentation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="bioethanol-fermentation-t">바이오에탄올 발효: 글루코스 한 분자의 탄소가 가는 길</title><defs><marker id="bioethanol-fermentation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="bioethanol-fermentation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="16" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">산소 없음(혐기 과정)</text><text x="180" y="41" text-anchor="middle" font-weight="700">글루코스 C<tspan baseline-shift="sub" font-size="92%">6</tspan>H<tspan baseline-shift="sub" font-size="92%">12</tspan>O<tspan baseline-shift="sub" font-size="92%">6</tspan></text><circle cx="125" cy="66" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="147" cy="66" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="169" cy="66" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="191" cy="66" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="213" cy="66" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="235" cy="66" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><line x1="140" y1="80" x2="84" y2="120" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-w