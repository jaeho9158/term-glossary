<svg class="si si-illus" viewBox="0 0 360 610" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chiral-switch-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="chiral-switch-t">키랄 스위치: 라세미체에서 활성이 큰 거울상 이성질체만 골라 다시 개발한다</title><defs><marker id="chiral-switch-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><text x="10" y="20" font-weight="700" style="fill:var(--si-accent,#2454ff)">가상 예시: 라세미체에서 한쪽만 골라낸다</text><text x="80" y="50" text-anchor="middle" font-weight="700">라세미체 100 mg</text><path d="M80,60 H38 A18,18 0 0 0 38,96 H80 Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><path d="M80,60 H122 A18,18 0 0 1 122,96 H80 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="55" y="124" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">활성 50 mg</text><text x="112" y="148" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">활성 낮음 50 mg</text><line x1="55" y1="112" x2="55" y2="98" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><line x1="112" y1="134" x2="112" y2="97" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><line x1="150" y1="78" x2="212" y2="78" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3" marker-end="url(#chiral-switch-ar)"/><text x="181" y="62" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">키랄 스위치</text><text x="262" y="50" text-anchor="middle" font-weight="700">단일 이성질체</text><rect x="226" y="60" width="74" height="36" rx="18" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="263" y="83" text-anchor="middle" fo