troke-width="1.4" marker-end="url(#bending-moment-ar-2)" marker-start="url(#bending-moment-ar-2)"/><text x="26" y="674" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">200 mm</text><text x="272" y="710" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">σ = 15 MPa</text><text x="20" y="780" font-weight="700">σ = M·c/I,  I = bh<tspan baseline-shift="super" font-size="72%">3</tspan>/12 ≈ 6.67×10<tspan baseline-shift="super" font-size="72%">7</tspan> mm<tspan baseline-shift="super" font-size="72%">4</tspan></text><text x="20" y="804" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">최대 모멘트의 위치가 설계의 출발점이다</text></svg>
