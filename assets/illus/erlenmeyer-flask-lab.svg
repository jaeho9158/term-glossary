<svg class="si si-illus" viewBox="0 0 600 370" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erlenmeyer-flask-lab-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="erlenmeyer-flask-lab-t">삼각플라스크</title><desc>평평한 바닥, 원뿔형 몸통, 원통형 목으로 된 삼각플라스크 정면도. 끓는 액체의 증기가 위쪽 벽에서 응축하고, 몸통에 대략적인 눈금이 있다</desc><defs><marker id="erlenmeyer-flask-lab-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><polygon points="186,280 414,280 440,330 160,330" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.18"/><polygon points="270,40 270,120 160,330 440,330 330,120 330,40" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><line x1="202" y1="250" x2="222" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="218" y1="220" x2="238" y2="220" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="234" y1="190" x2="254" y2="190" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><line x1="300" y1="272" x2="300" y2="170" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#erlenmeyer-flask-lab-ar)"/><line x1="320" y1="272" x2="318" y2="140" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#erlenmeyer-flask-lab-ar)"/><circle cx="262" cy="140" r="3" style="stroke:none;fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><circle cx="343" cy="150" r="3" style="stroke:none;fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><circle cx="252" cy="160" r="3" style="stroke:none;fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="360" y="70" font-size="12">원통형 목</text><line x1="356" y1="66" x2="332" y2="66" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="454" y="226" font-size="12">원뿔형 몸통(비스듬한 벽)</text><line x1="456" y1="222" x2="384" y2="222" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="300" y="352" text-anchor="middle" font-size="12">평평한 바닥</text><text x="140" y="200" text-anchor="end" font-size="12">눈금(오차 약 5%)</text><line x1="144" y1="196" x2="216" y2="220" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/><text x="150" y="110" text-anchor="end" font-size="12">증기가 위쪽 벽에서 응축</text><line x1="154" y1="108" x2="249" y2="159" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
