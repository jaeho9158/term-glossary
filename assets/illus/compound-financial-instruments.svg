<svg class="si si-illus" viewBox="0 0 360 526" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="복합금융상품: 잔여접근법의 분리 순서" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="compound-financial-instruments-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="compound-financial-instruments-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-pos,#14543c)"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">복합금융상품: 부채를 먼저 떼고 남는 몫이 자본</text><text x="62" y="46" text-anchor="middle" font-weight="700">발행금액</text><rect x="14" y="60" width="96" height="104" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2" fill-opacity="0.55"/><rect x="14" y="164" width="96" height="156" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2" fill-opacity="0.55"/><text x="62" y="100" text-anchor="middle" font-weight="700">② 자본 요소</text><text x="62" y="122" text-anchor="middle">= 발행금액</text><text x="62" y="144" text-anchor="middle">− 부채 요소</text><text x="62" y="204" text-anchor="middle" font-weight="700">① 부채 요소</text><text x="62" y="226" text-anchor="middle">= 현재가치</text><text x="62" y="248" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(먼저 측정)</text><text x="150" y="46" font-weight="700">미래 현금흐름</text><text x="150" y="68" style="fill:var(--si-general,#5c6b7f)">(전환권 없는 유사 채권)</text><line x1="150" y1="210" x2="346" y2="210" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#compound-financial-instruments-ar)"/><line x1="150" y1="204" x2="150" y2="216" style="stroke:currentColor;fill:no