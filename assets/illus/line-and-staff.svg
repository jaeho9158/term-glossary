="96" width="86" height="34" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="297" y="118" text-anchor="middle" font-weight="700">예산 부서</text><rect x="254" y="150" width="86" height="34" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="297" y="172" text-anchor="middle" font-weight="700">인사 부서</text><line x1="200" y1="47" x2="232" y2="47" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" stroke-dasharray="4 3"/><line x1="232" y1="47" x2="232" y2="167" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" stroke-dasharray="4 3"/><line x1="232" y1="113" x2="254" y2="113" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" stroke-dasharray="4 3"/><line x1="232" y1="167" x2="254" y2="167" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="2" stroke-dasharray="4 3"/><text x="232" y="206" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">참모:</text><text x="232" y="226" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">지원·자문</text><text x="232" y="246" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">(명령권 없음)</text><line x1="20" y1="300" x2="340" y2="300" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><text x="20" y="324">굵은 실선: 명령 계통(위에서 아래로 명령)</text><text x="20" y="346" style="fill:var(--si-violet-s,#9382bd)">점선: 자문 관계(아래 계선으로 가는 선 없음)</text><text x="20" y="376" style="fill:var(--si-rose-s,#c97b7b)">실제로는 참모가 자원 배분 권한으로</text><text x="20" y="396" style="fill:var(--si-rose-s,#c97b7b)">큰 영향력을 행사하기도 한다</text></svg>
