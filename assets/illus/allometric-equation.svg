<svg class="si si-illus" viewBox="0 0 360 640" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="allometric-equation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="allometric-equation-t">상대생장식: 로그 변환 선형 회귀와 역변환 보정</title><defs><marker id="allometric-equation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="14" y="22" font-weight="700">① 로그를 취하면 직선이 된다</text><text x="14" y="48" font-size="14">y = k·x<tspan dy="-0.435em" font-size="92%">a</tspan><tspan dy="0.4em">  →  log y = a·log x + log k</tspan></text><line x1="50" y1="204" x2="340" y2="204" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#allometric-equation-ar)"/><line x1="50" y1="204" x2="50" y2="80" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#allometric-equation-ar)"/><text x="340" y="224" text-anchor="end">log x</text><text x="58" y="92">log y</text><line x1="76" y1="186" x2="322" y2="104" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><line x1="190" y1="145" x2="270" y2="145" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="270" y1="145" x2="270" y2="118" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="230" y="168" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">가로 1</text><text x="280" y="138" style="fill:var(--si-general,#5c6b7f)">세로 a</text><text x="100" y="150" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">기울기 = a</text><text x="14" y="258" font-weight="700">절차: x·y 측정 → 양변 로그 → 선형 회귀</text><text x="14" y="278" font-weight="700">→ 기울기가 a → 식 복원</text><text x="14" y="326" font-weight="700">② 복원한 곡선과 역변환 편향</text><text x="14" y="350" style="fill:var(--si-general,#5c6b7f)">가상 자료: 직경 10~60 cm 나무 40그루</text><line x1="58" y1="500" x2="346" y2="500" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#allometric-equation-ar)"/><line x1="58" y1="500" x2="58" y2="380" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#allometric-equation-ar)"/><text x="346" y="540" text-anchor="end">D (cm)</text><text x="66" y="392">B</text><path d="M58,498.1 C60.3,497.9 67.3,497.3 72,496.8 C76.7,496.3 81.3,495.8 86,495.1 C90.7,494.5 95.3,493.8 100,493.1 C104.7,492.3 109.3,491.5 114,490.6 C118.7,489.7 123.3,488.7 128,487.7 C132.7,486.6 137.3,485.5 142,484.3 C146.7,483.1 151.3,481.8 156,480.5 C160.7,479.1 165.3,477.7 170,476.2 C174.7,474.7 179.3,473.1 184,471.4 C188.7,469.7 193.3,467.9 198,466.1 C202.7,464.2 207.3,462.3 212,460.3 C216.7,458.3 221.3,456.2 226,454 C230.7,451.8 235.3,449.5 240,447.1 C244.7,444.7 249.3,442.3 254,439.7 C258.7,437.2 263.3,434.5 268,431.8 C272.7,429 277.3,426.2 282,423.3 C286.7,420.3 291.3,417.3 296,414.2 C300.7,411.1 305.3,407.9 310,404.6 C314.7,401.2 319.3,397.8 324,394.3 C328.7,390.8 335.7,385.3 338,383.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6"/><line x1="58" y1="500" x2="58" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="58" y="518" text-anchor="middle">10</text><line x1="170" y1="500" x2="170" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="170" y="518" text-anchor="middle">30</text><line x1="338" y1="500" x2="338" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="338" y="518" text-anchor="middle">60</text><circle cx="170" cy="476.2" r="3.5" style="stroke:currentColor;fill:currentColor" stroke-width="0"/><circle cx="170" cy="476.2" r="8" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="68" y="420" font-weight="700">D = 30 cm</text><text x="68" y="442">● 보정 전 433.1</text><text x="68" y="462">○ 보정 후 449.9</text><polyline points="132,416 170,416 170,467.2" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="14" y="548" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">보정 전 값은 평균보다 약 3.7% 낮다</text><text x="14" y="572">보정: 예측값에 e<tspan dy="-0.435em" font-size="92%">s²/2</tspan><tspan dy="0.4em"> = 1.039 곱함</tspan></text><text x="14" y="610" style="fill:var(--si-general,#5c6b7f)">지수 ≈ 2.29(참값 2.4)는 표본 오차로 다르다</text></svg>
