<svg class="si si-illus" viewBox="0 0 600 310" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="아열대 고압대" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>적도(0°)부터 위도 60°까지의 위도-고도 단면. 적도에서 오른 공기가 높은 곳에서 극 쪽으로 가다 위도 약 30°에서 내려와 지상에 고압대를 만들고, 거기서 무역풍은 적도 쪽, 편서풍은 극 쪽으로 불어 나간다</desc><defs><marker id="subtropical-high-pressure-belt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="subtropical-high-pressure-belt-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker><marker id="subtropical-high-pressure-belt-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="subtropical-high-pressure-belt-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="subtropical-high-pressure-belt-ar-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><line x1="40" y1="250" x2="570" y2="250" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><line x1="80" y1="250" x2="80" y2="256" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><text x="80" y="272" text-anchor="middle" font-size="12">0°(적도)</text><line x1="320" y1="250" x2="320" y2="256" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><text x="320" y="272" text-anchor="middle" font-size="12">30°</text><line x1="540" y1="250" x2="540" y2="256" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><text x="540" y="272" text-anchor="middle" font-size="12">60°</text><text x="305" y="292" text-anchor="middle" font-size="12">위도(북반구)</text><line x1="80" y1="230" x2="80" y2="80" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#subtropical-high-pressure-belt-ar)"/><line x1="92" y1="70" x2="308" y2="70" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" marker-end="url(#subtropical-high-pressure-belt-ar-1)"/><line x1="320" y1="80" x2="320" y2="230" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#subtropical-high-pressure-belt-ar-2)"/><line x1="308" y1="202" x2="92" y2="202" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#subtropical-high-pressure-belt-ar-1)"/><text x="200" y="60" text-anchor="middle" font-size="12">고층에서 극 쪽으로 이동</text><text x="90" y="150" font-size="12">상승 기류</text><text x="332" y="140" font-size="12">하강 기류</text><text x="332" y="158" font-size="12">맑고 건조함</text><text x="200" y="150" text-anchor="middle" font-size="12">해들리 순환</text><line x1="304" y1="238" x2="120" y2="238" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.8" marker-end="url(#subtropical-high-pressure-belt-ar-3)"/><text x="200" y="226" text-anchor="middle" font-size="12">무역풍(적도 쪽)</text><line x1="336" y1="238" x2="510" y2="238" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8" marker-end="url(#subtropical-high-pressure-belt-ar-4)"/><text x="430" y="226" text-anchor="middle" font-size="12">편서풍(극 쪽)</text><text x="332" y="184" font-size="12">고압</text><text x="320" y="32" text-anchor="middle" font-size="12">아열대 고압대(약 30°)</text><line x1="320" y1="38" x2="320" y2="56" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" opacity="0.55"/></svg>
