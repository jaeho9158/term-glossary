<svg class="si si-illus" viewBox="0 0 360 516" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glasgow-outcome-scale-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="glasgow-outcome-scale-t">글래스고 결과 척도(GOS)와 좋은 결과 비율</title><defs></defs><text x="20" y="22" font-weight="700">GOS 5범주와 GOS-E 8범주의 대응</text><text x="20" y="50" font-weight="700">GOS(원판, 5범주)</text><rect x="20" y="58" width="40" height="54" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="40" y="90" text-anchor="middle" font-weight="700">사망</text><rect x="60" y="58" width="40" height="54" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="80" y="78" text-anchor="middle" font-weight="700">식물</text><text x="80" y="98" text-anchor="middle" font-weight="700">상태</text><rect x="100" y="58" width="80" height="54" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="140" y="78" text-anchor="middle" font-weight="700">중증</text><text x="140" y="98" text-anchor="middle" font-weight="700">장애</text><rect x="180" y="58" width="80" height="54" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="220" y="78" text-anchor="middle" font-weight="700">중등도</text><text x="220" y="98" text-anchor="middle" font-weight="700">장애</text><rect x="260" y="58" width="80" height="54" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="300" y="78" text-anchor="middle" font-weight="700">좋은</text><text x="300" y="98" text-anchor="middle" font-weight="700">회복</text><text x="20" y="142" font-weight="700">GOS-E(확장형, 8범주)</text><rect x="20" y="150" width="40" height="72" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="40" y="170" text-anchor="middle" font-weight="700">1</text><text x="40" y="194" text-anchor="middle">사망</text><rect x="60" y="150" width="40" height="72" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="80" y="170" text-anchor="middle" font-weight="700">2</text><text x="80" y="192" text-anchor="middle">식물</text><text x="80" y="212" text-anchor="middle">상태</text><rect x="100" y="150" width="40" height="72" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="120" y="170" text-anchor="middle" font-weight="700">3</text><text x="120" y="194" text-anchor="middle">하</text><rect x="140" y="150" width="40" height="72" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.8"/><text x="160" y="170" text-anchor="middle" font-weight="700">4</text><text x="160" y="194" text-anchor="middle">상</text><rect x="180" y="150" width="40" height="72" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="200" y="170" text-anchor="middle" font-weight="700">5</text><text x="200" y="194" text-anchor="middle">하</text><rect x="220" y="150" width="40" height="72" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="240" y="170" text-anchor="middle" font-weight="700">6</text><text x="240" y="194" text-anchor="middle">상</text><rect x="260" y="150" width="40" height="72" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="280" y="170" text-anchor="middle" font-weight="700">7</text><text x="280" y="194" text-anchor="middle">하</text><rect x="300" y="150" width="40" height="72" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="320" y="170" text-anchor="middle" font-weight="700">8</text><text x="320" y="194" text-anchor="middle">상</text><line x1="180" y1="124" x2="180" y2="270" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3" stroke-dasharray="7 4"/><text x="100" y="244" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">1~4: 나쁜 결과</text><text x="260" y="244" text-anchor="middle" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">5~8: 좋은 결과</text><text x="180" y="288" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">이분화 경계</text><text x="20" y="322" font-weight="700">예: 수상 6개월 후 좋은 결과 비율</text><text x="20" y="346" style="fill:var(--si-general,#5c6b7f)">(본문의 가상 예문)</text><line x1="72" y1="356" x2="72" y2="424" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="72" y1="424" x2="72" y2="429" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="72" y="446" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="192" y1="424" x2="192" y2="429" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="192" y="446" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">50</text><line x1="312" y1="424" x2="312" y2="429" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="312" y="446" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">100%</text><line x1="72" y1="424" x2="312" y2="424" style="stroke:currentColor;fill:none" stroke-width="1.4"/><rect x="72" y="362" width="115.2" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="195.2" y="380" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">48%</text><rect x="72" y="394" width="93.6" height="24" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="173.6" y="412" font-weight="700">39%</text><text x="64" y="380" text-anchor="end">중재군</text><text x="64" y="412" text-anchor="end">대조군</text><text x="20" y="478" style="fill:var(--si-general,#5c6b7f)">GCS(글래스고 혼수 척도)는 급성기 의식 수준을</text><text x="20" y="498" style="fill:var(--si-general,#5c6b7f)">재는 별개 도구다.</text></svg>
