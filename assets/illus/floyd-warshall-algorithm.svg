<svg class="si si-illus" viewBox="0 0 360 550" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="플로이드-워셜 알고리즘: 경유지 갱신" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="floyd-warshall-algorithm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker><marker id="floyd-warshall-algorithm-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.85" markerHeight="3.85" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">플로이드-워셜: 경유지 k로 갱신</text><line x1="77" y1="90" x2="283" y2="90" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4" marker-end="url(#floyd-warshall-algorithm-ar)"/><text x="180" y="76" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">직행 d[i][j]</text><line x1="71" y1="102" x2="165" y2="160" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="4" marker-end="url(#floyd-warshall-algorithm-ar-1)"/><line x1="195" y1="160" x2="289" y2="102" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="4" marker-end="url(#floyd-warshall-algorithm-ar-1)"/><circle cx="60" cy="90" r="16" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="60" y="95" text-anchor="middle" font-weight="700" font-style="italic">i</text><circle cx="300" cy="90" r="16" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="300" y="95" text-anchor="middle" font-weight="700" font-style="italic">j</text><circle cx="180" cy="170" r="16" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2"/><text x="180" y="175" text-anchor="middle" font-w