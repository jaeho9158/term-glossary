<svg class="si si-illus" viewBox="0 0 360 576" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일반재와 베블런재의 가격-수요 곡선 비교" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="conspicuous-consumption-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="conspicuous-consumption-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="conspicuous-consumption-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">과시적 소비와 베블런재의 수요</text><line x1="56" y1="296" x2="340" y2="296" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#conspicuous-consumption-ar)"/><line x1="56" y1="296" x2="56" y2="56" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#conspicuous-consumption-ar)"/><text x="340" y="318" text-anchor="end">수요량</text><text x="64" y="66">가격</text><path d="M84 80 C112 196 210 250 324 266" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><path d="M84 272 C190 264 260 200 324 80" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="42" y1="246" x2="42" y2="130" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#conspicuous-consumption-ar)"/><text x="16" y="251">P<tspan dy="0.217em" font-size="92%">1</tspan></text><text x="16" y="135">P<tspan dy="0.217em" font-size="92%">2</tspan></text><line x1="56" y1="246" x2="340" y2="246" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="56" y1="130" x2="340" y2="130" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><circle cx="241" cy="246" r="4.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="102.1" cy="130" r="4.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="177.8" cy="246" r="4.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="294.8" cy="130" r="4.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><line x1="233" y1="234" x2="110.1" y2="234" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#conspicuous-consumption-ar-1)"/><line x1="185.8" y1="142" x2="286.8" y2="142" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.2" marker-end="url(#conspicuous-consumption-ar-2)"/><text x="104" y="70" font-weight="700" style="fill:var(--si-blue-t,#12305c)">일반재</text><text x="330" y="70" text-anchor="end" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">베블런재</text><line x1="16" y1="336" x2="344" y2="336" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="16" y1="360" x2="50" y2="360" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><text x="58" y="365" font-weight="700">일반재(실용적 소비)</text><text x="58" y="385">가격↑ → 수요↓</text><line x1="16" y1="414" x2="50" y2="414" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><text x="58" y="419" font-weight="700">베블런재(과시적 소비)</text><text x="58" y="439">가격↑ → 수요↑: 비쌈 자체가 지위의 신호</text><line x1="16" y1="458" x2="344" y2="458" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="480">대부분의 상품은 가격이 오르면 수요가 줄고,</text><text x="16" y="500">베블런 효과는 특정 조건의 예외다.</text><text x="16" y="520">곡선 모양은 모식이며 눈금 수치는 없다.</text><text x="16" y="556">소스타인 베블런, 《유한계급론》(1899)</text></svg>
