<svg class="si si-illus" viewBox="0 0 640 346" style="max-width:640px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orbital-mechanics-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="orbital-mechanics-t">호만 전이: 저궤도에서 정지궤도로 올리는 두 번의 속도 증가</title><desc>지구를 도는 저궤도 원과 정지궤도 원을 전이 타원이 근지점과 원지점에서 접하며 이어 주는 그림. 근지점에서 2.40 km/s, 원지점에서 1.46 km/s 속도를 더한다.</desc><defs><marker id="orbital-mechanics-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker></defs><line x1="344" y1="120" x2="352" y2="105" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="150" y1="200" x2="144" y2="224.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="346" y1="163" x2="352" y2="176.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="149" y1="156" x2="144" y2="137" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="228" y1="75" x2="228" y2="69" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="389" y1="61" x2="468" y2="61" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="328.2" y1="198.2" x2="468" y2="226.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><text x="20" y="24" font-size="12" font-weight="700">호만 전이: 저궤도 → 정지궤도(모식, 비례 아님)</text><circle cx="290" cy="160" r="140" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><circle cx="290" cy="160" r="54" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.8"/><path d="M344,160 A97,86.9 0 0 0 150,160" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><path d="M344,160 A97,86.9 0 0 1 150,160" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1" stroke-dasharray="6 4" opacity="0.45"/><circle cx="290" cy="160" r="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.35"/><text x="290" y="164" text-anchor="middle" font-size="12">지구</text><line x1="344" y1="160" x2="344" y2="108" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.6" marker-end="url(#orbital-mechanics-ar)"/><line x1="150" y1="160" x2="150" y2="212" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.6" marker-end="url(#orbital-mechanics-ar)"/><circle cx="344" cy="160" r="3.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><circle cx="150" cy="160" r="3.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><text x="354" y="98" font-size="12" font-weight="700">Δv<tspan baseline-shift="sub" font-size="72%">1</tspan> = 2.40 km/s</text><text x="142" y="238" text-anchor="end" font-size="12" font-weight="700">Δv<tspan baseline-shift="sub" font-size="72%">2</tspan> = 1.46 km/s</text><text x="354" y="190" font-size="12">근지점(1차 연소)</text><text x="142" y="130" text-anchor="end" font-size="12">원지점(2차 연소)</text><text x="220" y="62" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">전이 타원</text><text x="470" y="60" font-size="12" font-weight="700">정지궤도</text><text x="470" y="78" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">r = 42,164 km</text><text x="470" y="96" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">원궤도 속도 3.07 km/s</text><text x="470" y="240" font-size="12" font-weight="700">저궤도(고도 400 km)</text><text x="470" y="258" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">r = 6,778 km</text><text x="470" y="276" font-size="11.5" style="fill:var(--si-general,#5c6b7f)">원궤도 속도 7.67 km/s</text><text x="20" y="326" font-size="12" style="fill:var(--si-general,#5c6b7f)">Δv<tspan baseline-shift="sub" font-size="72%">1</tspan> + Δv<tspan baseline-shift="sub" font-size="72%">2</tspan> ≈ 3.85 km/s,  전이 시간(반 타원) ≈ 5.29 h</text></svg>
