<svg class="si si-illus" viewBox="0 0 360 572" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="태도-행동 격차: 구매 의향과 실제 구매" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="12" y="22" font-weight="700">가상의 설문 1,000명 (막대 길이 = 인원)</text><text x="12" y="50">구매 의향 있음 600명</text><rect x="12" y="60" width="45" height="34" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><rect x="57" y="60" width="255" height="34" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="12" y="150">구매 의향 없음 400명</text><rect x="12" y="160" width="10" height="34" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><rect x="22" y="160" width="190" height="34" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="184.5" y="83" text-anchor="middle">510</text><text x="117" y="183" text-anchor="middle">380</text><text x="12" y="116" style="fill:var(--si-green-t,#14543c)">구매 90명 (15%)</text><text x="348" y="116" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">구매 안 함 510명 (85%)</text><text x="12" y="216" style="fill:var(--si-green-t,#14543c)">구매 20명 (5%)</text><text x="348" y="216" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">구매 안 함 380명 (95%)</text><text x="12" y="252" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">의향이 있어도 85%는 구매하지 않음</text><text x="12" y="272" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">= 태도-행동 격차</text><line x1="12" y1="294" x2="348" y2="294" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><circle cx="84" cy="366" r="46" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><path d="M84 366 L84 320 A46 46 0 0 1 129.2 374.6 Z" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="150" y="332" font-weight="700">의도가 설명하는</text><text x="150" y="352" font-weight="700">행동 변량 약 28%</text><text x="150" y="380" style="fill:var(--si-general,#5c6b7f)">(Sheeran, 2002)</text><text x="150" y="412" style="fill:var(--si-general,#5c6b7f)">나머지는 의도로</text><text x="150" y="432" style="fill:var(--si-general,#5c6b7f)">설명되지 않음</text><line x1="12" y1="456" x2="348" y2="456" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="12" y="480" font-weight="700">의도와 행동 사이의 장애물</text><text x="12" y="504">가격 부담, 매장에 물건이 없음,</text><text x="12" y="524">늘 사던 브랜드를 자동으로 집음</text><text x="12" y="552" style="fill:var(--si-general,#5c6b7f)">응답 편향·상황 제약(가격·접근성·습관)</text></svg>
