<svg class="si si-illus" viewBox="0 0 520 300" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="strain-gauge-rosette-analysis-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="strain-gauge-rosette-analysis-t">변형률 게이지 로제트의 배치</title><defs></defs><line x1="75" y1="150" x2="185" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><line x1="91.1" y1="188.9" x2="168.9" y2="111.1" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="5"/><line x1="130" y1="205" x2="130" y2="95" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="5"/><circle cx="130" cy="150" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><line x1="335" y1="150" x2="445" y2="150" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="5"/><line x1="362.5" y1="197.6" x2="417.5" y2="102.4" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="5"/><line x1="417.5" y1="197.6" x2="362.5" y2="102.4" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="5"/><circle cx="390" cy="150" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6"/><text x="130" y="52" text-anchor="middle" font-weight="700">직각형 로제트</text><text x="390" y="52" text-anchor="middle" font-weight="700">델타형 로제트</text><text x="190" y="150" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">a 0°</text><text x="188" y="100" font-size="11" style="fill:var(--si-violet-s,#9382bd)">b 45°</text><text x="138" y="84" font-size="11" style="fill:var(--si-rose-s,#c97b7b)">c 90°</text><text x="450" y="150" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">0°</text><text x="440" y="100" font-size="11" style="fill:var(--si-violet-s,#9382bd)">60°</text><text x="330" y="100" text-anchor="end" font-size="11" style="fill:var(--si-rose-s,#c97b7b)">120°</text><text x="30" y="232" font-size="11">직각형: ε<tspan baseline-shift="sub" font-size="72%">x</tspan> = ε<tspan baseline-shift="sub" font-size="72%">a</tspan>, ε<tspan baseline-shift="sub" font-size="72%">y</tspan> = ε<tspan baseline-shift="sub" font-size="72%">c</tspan>, γ<tspan baseline-shift="sub" font-size="72%">xy</tspan> = 2ε<tspan baseline-shift="sub" font-size="72%">b</tspan> − ε<tspan baseline-shift="sub" font-size="72%">a</tspan> − ε<tspan baseline-shift="sub" font-size="72%">c</tspan></text><text x="30" y="254" font-size="11">가상 측정 ε<tspan baseline-shift="sub" font-size="72%">a</tspan> = 800, ε<tspan baseline-shift="sub" font-size="72%">b</tspan> = 400, ε<tspan baseline-shift="sub" font-size="72%">c</tspan> = −200 με → γ<tspan baseline-shift="sub" font-size="72%">xy</tspan> = 200 με</text><text x="30" y="276" font-size="11">ε<tspan baseline-shift="sub" font-size="72%">1</tspan> = 809.9, ε<tspan baseline-shift="sub" font-size="72%">2</tspan> = −209.9 με, 주축 5.65°(a축에서 반시계)</text></svg>
