<svg class="si si-illus" viewBox="0 0 360 760" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="무산소 대사: ATP 수율과 시간별 에너지원" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="anaerobic-metabolism-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="anaerobic-metabolism-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="anaerobic-metabolism-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="anaerobic-metabolism-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">무산소 대사: 빠르지만 총량이 적다</text><text x="14" y="52" font-weight="700">포도당 1분자당 만드는 ATP</text><text x="14" y="76">무산소 해당(포도당)</text><rect x="20" y="84" width="16" height="16" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="44" y="98" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">2 ATP</text><text x="14" y="122">무산소 해당(글리코겐 출발)</text><rect x="20" y="130" width="24" height="16" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="52" y="144" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">3 ATP</text><text x="14" y="168">발효</text><rect x="20" y="176" width="16" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><rect x="36" y="176" width="24" height="16" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/><text x="68" y="190" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">2~5 ATP</text><text x="14" y="214">유산소 호흡</text><rect x="20" y="222" width="256" height="16" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.8"/><text x="284" y="236" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">약 32 ATP</text><line x1="20" y1="262" x2="276" y2="262" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="20" y1="262" x2="20" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="20" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="84" y1="262" x2="84" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="84" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">8</text><line x1="148" y1="262" x2="148" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="148" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">16</text><line x1="212" y1="262" x2="212" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="212" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">24</text><line x1="276" y1="262" x2="276" y2="267" style="stroke:currentColor;fill:none" stroke-width="1.1"/><text x="276" y="284" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">32</text><text x="148" y="306" text-anchor="middle">ATP(개)</text><text x="14" y="346" font-weight="700">운동 지속 시간별 주된 에너지원</text><rect x="20" y="362" width="100" height="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="120" y="362" width="220" height="26" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6" opacity="0.7"/><rect x="120" y="388" width="220" height="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.2" opacity="0.9"/><line x1="120" y1="352" x2="120" y2="416" style="stroke:currentColor;fill:none" stroke-width="2" stroke-dasharray="6 4"/><line x1="20" y1="408" x2="340" y2="408" style="stroke:currentColor;fill:none" stroke-width="1.3"/><line x1="20" y1="408" x2="20" y2="413" style="stroke:currentColor;fill:none" stroke-width="1.1"/><line x1="340" y1="408" x2="340" y2="413" style="stroke:currentColor;fill:none" stroke-width="1.1"/><line x1="20" y1="402" x2="20" y2="414" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="20" y="430" text-anchor="middle" font-weight="700">0</text><line x1="120" y1="402" x2="120" y2="414" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="120" y="430" text-anchor="middle" font-weight="700">30초</text><line x1="260" y1="402" x2="260" y2="414" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="260" y="430" text-anchor="middle" font-weight="700">4분</text><text x="24" y="380" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">ATP-CP</text><text x="128" y="380" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">유산소 + 해당</text><text x="14" y="458">30초까지는 ATP-CP가 주된 원천이다.</text><text x="14" y="482">30초 뒤에는 유산소와 해당이 함께 기여한다.</text><text x="14" y="506">4분 넘어서도 무산소 사용이 상당할 수 있다</text><text x="14" y="530" style="fill:var(--si-general,#5c6b7f)">(아래 얇은 파란 띠). 눈금 간격은 비례하지 않는다.</text><text x="14" y="580" font-weight="700">크레아틴인산이 인산기를 넘겨 ATP 재생</text><circle cx="60" cy="620" r="22" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="60" y="625" text-anchor="middle" font-weight="700">CP</text><circle cx="100" cy="614" r="7" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="100" y="618" text-anchor="middle" font-weight="700">P</text><circle cx="160" cy="620" r="20" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2"/><text x="160" y="625" text-anchor="middle" font-weight="700">ADP</text><line x1="100" y1="604" x2="138" y2="600" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" marker-end="url(#anaerobic-metabolism-ar-1)"/><line x1="184" y1="620" x2="222" y2="620" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#anaerobic-metabolism-ar)"/><circle cx="262" cy="620" r="24" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="2"/><text x="262" y="625" text-anchor="middle" font-weight="700">ATP</text><text x="14" y="664" font-weight="700">해당과정 끝의 피루브산 분기</text><rect x="14" y="686" width="86" height="30" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="57" y="706" text-anchor="middle">피루브산</text><line x1="100" y1="694" x2="150" y2="684" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#anaerobic-metabolism-ar-2)"/><line x1="100" y1="708" x2="150" y2="728" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2" marker-end="url(#anaerobic-metabolism-ar-3)"/><text x="158" y="688" style="fill:var(--si-rose-s,#c97b7b)">산소 부족: 젖산</text><text x="156" y="732" style="fill:var(--si-green-s,#5b9b83)">산소 충분: 미토콘드리아</text></svg>
