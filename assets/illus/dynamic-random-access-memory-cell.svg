<svg class="si si-illus" viewBox="0 0 520 340" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dynamic-random-access-memory-cell-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="dynamic-random-access-memory-cell-t">1T1C DRAM 셀: 워드라인으로 접근 트랜지스터를 열어 커패시터 전하를 비트라인과 주고받는다</title><defs></defs><line x1="208" y1="224" x2="220" y2="232.8" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="60" y1="70" x2="380" y2="70" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6"/><text x="60" y="58" font-weight="700" style="fill:var(--si-accent,#2454ff)">비트라인(BL)</text><line x1="180" y1="70" x2="180" y2="118" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="130" y="118" width="100" height="56" style="stroke:currentColor;fill:currentColor" stroke-width="2" fill-opacity="0.08"/><text x="180" y="150" text-anchor="middle" font-size="11">접근 트랜지스터</text><line x1="90" y1="146" x2="130" y2="146" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="90" y1="146" x2="90" y2="250" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><text x="90" y="268" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">워드라인(WL)</text><line x1="180" y1="174" x2="180" y2="212" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="154" y1="212" x2="206" y2="212" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="154" y1="224" x2="206" y2="224" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="180" y1="224" x2="180" y2="250" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="160" y1="250" x2="200" y2="250" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="167" y1="257" x2="193" y2="257" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="174" y1="264" x2="186" y2="264" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="222" y="246" font-size="12">저장 커패시터: 전하 있음 = 1, 없음 = 0</text><polygon points="330,48 330,92 376,70" style="stroke:currentColor;fill:var(--si-accent,#2454ff)" stroke-width="2" fill-opacity="0.2"/><text x="353" y="112" text-anchor="middle" font-size="12">감지 증폭기</text><text x="250" y="133" font-size="12">읽기: WL을 켜면 전하가 BL과 나뉘어</text><text x="250" y="154" font-size="12">전압이 조금 변하고, 감지 증폭기가</text><text x="250" y="175" font-size="12">0 또는 1로 판정해 다시 써 넣는다</text><text x="250" y="198" font-size="12" font-weight="700">예(가상 값): (1.2 − 0.6) × 20/(20 + 100)</text><text x="250" y="219" font-size="12" font-weight="700">= 100 mV</text><text x="250" y="300" font-size="11" style="fill:var(--si-general,#5c6b7f)">리프레시: 누설된 전하를 주기적으로 다시 채움</text></svg>
