<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="step-length-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="step-length-t">보장과 활보장(가상 예)</title><defs><marker id="step-length-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="30" y1="40" x2="300" y2="40" style="stroke:currentColor;fill:none" stroke-width="1.2" opacity="0.7" marker-end="url(#step-length-ar)"/><text x="310" y="44" font-size="11">진행 방향</text><line x1="56" y1="104" x2="286" y2="104" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8"/><line x1="56" y1="98" x2="56" y2="110" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8"/><line x1="286" y1="98" x2="286" y2="110" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.8"/><text x="171" y="90" text-anchor="middle" font-size="12" style="fill:var(--si-violet-s,#9382bd)">활보장 = 같은 발이 다시 닿는 거리 = 1.15 m</text><ellipse cx="70" cy="160" rx="22" ry="10" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.35"/><circle cx="56" cy="160" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="70" y="140" text-anchor="middle" font-size="12">왼발</text><ellipse cx="190" cy="160" rx="22" ry="10" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.35"/><circle cx="176" cy="160" r="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="190" y="140" text-anchor="middle" font-size="12">오른발</text><ellipse cx="300" cy="160" rx="22" ry="10" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.35"/><circle cx="286" cy="160" r="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="300" y="140" text-anchor="middle" font-size="12">왼발</text><line x1="56" y1="196" x2="176" y2="196" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8"/><line x1="56" y1="190" x2="56" y2="202" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8"/><line x1="176" y1="190" x2="176" y2="202" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8"/><text x="116" y="216" text-anchor="middle" font-size="11" style="fill:var(--si-rose-s,#c97b7b)">오른발 보장 0.60 m</text><line x1="176" y1="236" x2="286" y2="236" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><line x1="176" y1="230" x2="176" y2="242" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><line x1="286" y1="230" x2="286" y2="242" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8"/><text x="231" y="256" text-anchor="middle" font-size="11" style="fill:var(--si-blue-s,#7f9ac0)">왼발 보장 0.55 m</text><text x="30" y="286" font-size="11">평균 보장 = 1.15 ÷ 2 = 0.575 m</text><text x="30" y="306" font-size="11">분속수 100걸음/분이면 보행 속도 ≈ 0.575 × 100/60 ≈ 0.96 m/s</text></svg>
