<svg class="si si-illus" viewBox="0 0 360 260" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="방풍림 단면: 풍하측 3~5H에서 풍속이 최저이고 약 8H에서 지표 온도가 낮아질 수 있다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="screen-planting-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="screen-planting-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><line x1="320" y1="188" x2="320" y2="173" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><rect x="170" y="56" width="60" height="134" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="0.8" stroke-dasharray="6 4" fill-opacity="0.12"/><line x1="10" y1="190" x2="350" y2="190" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="80" y1="190" x2="80" y2="178" style="stroke:currentColor;fill:none" stroke-width="3"/><ellipse cx="80" cy="175" rx="11" ry="15" style="stroke:currentColor;fill:none" stroke-width="1.8" stroke-dasharray="3 2"/><line x1="58" y1="160" x2="58" y2="190" style="stroke:currentColor;fill:none" stroke-width="1.1" marker-end="url(#screen-planting-ar)" marker-start="url(#screen-planting-ar)"/><text x="44" y="181" text-anchor="end" font-style="italic">H</text><line x1="14" y1="150" x2="44" y2="150" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#screen-planting-ar-1)"/><line x1="14" y1="168" x2="44" y2="168" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#screen-planting-ar-1)"/><text x="34" y="128" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">바람</text><line x1="14" y1="92" x2="346" y2="92" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.8" stroke-dasharray="6 4"/><path d="M14,92 C21.7,92 49.3,90.3 60,92 C70.7,93.7 69.7,97.7 78,102 C86.3,106.3 98,113.7 110,118 C122,122.3 135,125.3 150,128 C165,130.7 185,133.7 200,134 C215,134.3 225,133.3 240,130 C255,126.7 272.3,119 290,114 C307.7,109 336.7,102.3 346,100" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.6"/><text x="200" y="44" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">3~5H에서 풍속 최저</text><text x="300" y="80" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">이후 점차 회복</text><text x="18" y="80" font-size="12" style="fill:var(--si-general,#5c6b7f)">바람이 막히지 않은 풍속</text><line x1="80" y1="190" x2="80" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="80" y="212" text-anchor="middle" font-size="12">0</text><line x1="170" y1="190" x2="170" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="170" y="212" text-anchor="middle" font-size="12">3H</text><line x1="230" y1="190" x2="230" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="230" y="212" text-anchor="middle" font-size="12">5H</text><line x1="320" y1="190" x2="320" y2="196" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="320" y="212" text-anchor="middle" font-size="12">8H</text><text x="250" y="234" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">풍하측 거리(방풍림 높이 H의 배수)</text><text x="300" y="144" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">지표 온도가</text><text x="300" y="166" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">낮아질 수 있음</text></svg>
