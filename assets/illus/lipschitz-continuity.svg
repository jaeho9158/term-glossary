<svg class="si si-illus" viewBox="0 0 360 598" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lipschitz-continuity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="lipschitz-continuity-t">립시츠 연속: 기울기 ±L 쐐기 안에 그래프가 갇힌다</title><defs><marker id="lipschitz-continuity-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="14" y="24" font-weight="700">f(x) = |x| : 쐐기 안에 머문다</text><polygon points="110,150 30,70 30,230" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.3"/><polygon points="110,150 190,70 190,230" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.3"/><line x1="26" y1="150" x2="196" y2="150" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#lipschitz-continuity-ar)"/><line x1="110" y1="236" x2="110" y2="64" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#lipschitz-continuity-ar)"/><polyline points="30,70 110,150 190,70" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><circle cx="110" cy="150" r="4.5" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="206" y="100" font-weight="700" style="fill:var(--si-blue-t,#12305c)">f(x) = |x|</text><text x="206" y="134" font-weight="700">L = 1</text><text x="206" y="170">모든 점에서</text><text x="206" y="190">쐐기 안</text><text x="14" y="264" font-weight="700">f(x) = x½ (제곱근) : [0, 1]에서 쐐기를 뚫는다</text><polygon points="50,450 125,300 200,300 200,450" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.3"/><line x1="44" y1="450" x2="206" y2="450" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#lipschitz-continuity-ar)"/><line x1="50" y1="456" x2="50" y2="332" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" marker-end="url(#lipschitz-continuity-ar)"/><polyline points="50,450 50.4,442.2 51.2,436.3 52.4,431.1 53.8,426.2 55.4,421.6 57.2,417.1 59.2,412.8 61.4,408.6 63.8,404.5 66.3,400.5 69,396.6 71.9,392.7 74.8,389 78,385.2 81.2,381.6 84.6,377.9 88.2,374.4 91.8,370.8 95.6,367.3 99.5,363.8 103.5,360.4 107.6,357 111.9,353.7 116.2,350.3 120.7,347 125.3,343.7 130,340.5 134.8,337.2 139.7,334 144.7,330.8 149.8,327.7 155,324.5 160.3,321.4 165.7,318.3 171.1,315.2 176.7,312.1 182.4,309.1 188.2,306 194,303 200,300" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.2"/><polyline points="50,450 50.4,442.2 51.2,436.3 52.4,431.1 53.8,426.2 55.4,421.6 57.2,417.1 59.2,412.8 61.4,408.6 63.8,404.5 66.3,400.5 69,396.6 71.9,392.7 74.8,389 78,385.2 81.2,381.6 84.6,377.9" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4.6"/><line x1="140" y1="450" x2="140" y2="333.8" style="stroke:currentColor;fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><text x="140" y="472" text-anchor="middle">ε</text><text x="200" y="472" text-anchor="middle">1</text><text x="50" y="472" text-anchor="middle">0</text><text x="112" y="312" text-anchor="end" font-weight="700">L = 2</text><text x="212" y="336" font-weight="700">0과 h 사이 차분몫</text><text x="212" y="358" font-weight="700">h⁻½</text><text x="212" y="382">h = 0.01 → 10</text><text x="212" y="404">h = 0.0001 → 100</text><text x="212" y="426">h = 0.000001</text><text x="236" y="446">→ 1000</text><text x="212" y="490" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">어떤 L로도 가둘 수</text><text x="212" y="510" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">없다</text><text x="14" y="520">[ε, 1]에서는</text><text x="14" y="542">L = ε⁻½/2 로 가둘 수 있다</text><text x="180" y="578" text-anchor="middle" font-weight="700">|f(x) − f(y)| ≤ L·|x − y|</text></svg>
