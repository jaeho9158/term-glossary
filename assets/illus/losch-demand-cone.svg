<svg class="illus" viewBox="0 0 520 340" style="max-width:520px;color:var(--text,#1f2328)" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="뢰쉬의 수요원추: 가격이 오르면 원추가 작아진다" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title>뢰쉬의 수요원추: 가격이 오르면 원추가 작아진다</title><defs><marker id="losch-demand-cone-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs><line x1="408" y1="214.4" x2="426" y2="213" stroke="currentColor" stroke-opacity="0.55" stroke-width="0.8"/><ellipse cx="140" cy="262" rx="126" ry="37.8" fill="currentColor" fill-opacity="0.1" stroke="currentColor"/><polygon points="14,262 266,262 140,118" fill="currentColor" fill-opacity="0.12" style="stroke:var(--accent,#2454ff)" stroke-width="2"/><line x1="140" y1="262" x2="140" y2="118" stroke="currentColor" stroke-dasharray="4 3"/><line x1="140" y1="262" x2="266" y2="262" stroke="currentColor" stroke-dasharray="4 3"/><circle cx="140" cy="262" r="3.5" fill="currentColor"/><text x="203" y="256" text-anchor="middle" font-size="12">R = 9</text><text x="148" y="182.8" font-size="12">H = 90</text><text x="140" y="106" text-anchor="middle">가격 p = 1</text><text x="140" y="312" text-anchor="middle" font-size="12">V = πR<tspan baseline-shift="super" font-size="72%">2</tspan>H/3 ≈ 7634</text><ellipse cx="400" cy="262" rx="70" ry="21" fill="currentColor" fill-opacity="0.1" stroke="currentColor"/><polygon points="330,262 470,262 400,182" fill="currentColor" fill-opacity="0.12" style="stroke:var(--accent,#2454ff)" stroke-width="2"/><line x1="400" y1="262" x2="400" y2="182" stroke="currentColor" stroke-dasharray="4 3"/><line x1="400" y1="262" x2="470" y2="262" stroke="currentColor" stroke-dasharray="4 3"/><circle cx="400" cy="262" r="3.5" fill="currentColor"/><text x="435" y="256" text-anchor="middle" font-size="12">R = 5</text><text x="426" y="206" font-size="12">H = 50</text><text x="400" y="170" text-anchor="middle">가격 p = 5</text><text x="400" y="312" text-anchor="middle" font-size="12">V = πR<tspan baseline-shift="super" font-size="72%">2</tspan>H/3 ≈ 1309</text><text x="20" y="26" font-size="12" style="fill:var(--muted,#57606a)">q(x) = 10 × (10 − p − x),  운송비 t = 1</text><text x="140" y="280" text-anchor="middle" font-size="11">점포</text></svg>