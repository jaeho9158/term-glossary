<svg class="si si-illus" viewBox="0 0 360 366" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auc-pharmacokinetics-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="auc-pharmacokinetics-t">AUC: 농도–시간 곡선 아래 면적(사다리꼴 합과 외삽 꼬리)</title><defs></defs><path d="M50 220 L50 220 L70 84 L70 220 Z" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1" fill-opacity="0.18"/><path d="M70 220 L70 84 L90 50 L90 220 Z" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1" fill-opacity="0.18"/><path d="M90 220 L90 50 L130 118 L130 220 Z" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1" fill-opacity="0.18"/><path d="M130 220 L130 118 L210 186 L210 220 Z" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1" fill-opacity="0.18"/><path d="M210 220 L210 186 L290 206.4 L290 220 Z" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1" fill-opacity="0.18"/><path d="M290 220 L290 206.4 L300 207.87135763751348 L310 209.18353194433072 L320 210.35374465643585 L330 211.39735432357986 L340 212.32805788378744 L340 220 Z" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.35"/><polyline points="290,206.4 300,207.9 310,209.2 320,210.4 330,211.4 340,212.3" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2" stroke-dasharray="4 3"/><line x1="50" y1="220" x2="345" y2="220" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="50" y1="220" x2="50" y2="30" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="50" y1="220" x2="50" y2="226" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="50" y="242" text-anchor="middle">0</text><line x1="70" y1="220" x2="70" y2="226" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="70" y="242" text-anchor="middle">1</text><line x1="90" y1="220" x2="90" y2="226" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="90" y="242" text-anchor="middle">2</text><line x1="130" y1="220" x2="130" y2="226" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="130" y="242" text-anchor="middle">4</text><line x1="210" y1="220" x2="210" y2="226" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="210" y="242" text-anchor="middle">8</text><line x1="290" y1="220" x2="290" y2="226" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="290" y="242" text-anchor="middle">12</text><line x1="44" y1="220" x2="50" y2="220" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="40" y="224" text-anchor="end">0</text><line x1="44" y1="135" x2="50" y2="135" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="40" y="139" text-anchor="end">5</text><line x1="44" y1="50" x2="50" y2="50" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="40" y="54" text-anchor="end">10</text><text x="345" y="242" text-anchor="end">시간(h)</text><text x="56" y="26">혈장 농도(mg/L)</text><path d="M50,220 C53.3,197.3 63.3,112.3 70,84 C76.7,55.7 80,44.3 90,50 C100,55.7 110,95.3 130,118 C150,140.7 183.3,171.3 210,186 C236.7,200.7 276.7,203 290,206.4" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4"/><circle cx="50" cy="220" r="3.2" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="70" cy="84" r="3.2" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="90" cy="50" r="3.2" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="130" cy="118" r="3.2" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="210" cy="186" r="3.2" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><circle cx="290" cy="206.4" r="3.2" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="150" y="66" font-weight="700" style="fill:var(--si-accent,#2454ff)">AUC<tspan baseline-shift="sub" font-size="92%">0–t</tspan></text><text x="150" y="92" style="fill:var(--si-accent,#2454ff)">= 50.6 mg·h/L</text><text x="240" y="140" style="fill:var(--si-amber-s,#d79a2b)">외삽 꼬리</text><text x="240" y="160" style="fill:var(--si-amber-s,#d79a2b)">C<tspan baseline-shift="sub" font-size="92%">last</tspan>/k<tspan baseline-shift="sub" font-size="92%">z</tspan></text><line x1="300" y1="168" x2="310" y2="211" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.2"/><text x="20" y="276">AUC<tspan baseline-shift="sub" font-size="92%">0–∞</tspan> = AUC<tspan baseline-shift="sub" font-size="92%">0–t</tspan> + C<tspan baseline-shift="sub" font-size="92%">last</tspan>/k<tspan baseline-shift="sub" font-size="92%">z</tspan> ≈ 54.1 mg·h/L</text><text x="20" y="300">k<tspan baseline-shift="sub" font-size="92%">z</tspan> ≈ 0.229/h  (외삽 약 6.5%)</text><text x="20" y="328" font-weight="700">CL = 용량 ÷ AUC<tspan baseline-shift="sub" font-size="92%">0–∞</tspan> ≈ 1.85 L/h</text><text x="20" y="350" style="fill:var(--si-general,#5c6b7f)">(정맥 100 mg, 가상 예)</text></svg>
