<svg class="si si-illus" viewBox="0 0 520 340" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전율 고용체 상태도의 액상선과 고상선" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>조성을 가로축, 온도를 세로축으로 두고 액상선이 위, 고상선이 아래에 놓이며 두 선 사이에서 액체와 고체가 공존하는 전율 고용체 상태도의 모식도</desc><defs><marker id="solidus-liquidus-line-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><line x1="70" y1="280" x2="70" y2="30" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" marker-end="url(#solidus-liquidus-line-ar)"/><line x1="70" y1="280" x2="490" y2="280" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" marker-end="url(#solidus-liquidus-line-ar)"/><text x="48" y="40" text-anchor="middle" font-size="12">온도 T</text><text x="280" y="318" text-anchor="middle" font-size="12" font-weight="700">조성</text><text x="70" y="300" text-anchor="middle" font-size="12">성분 A</text><text x="450" y="300" text-anchor="middle" font-size="12">성분 B</text><line x1="450" y1="70" x2="450" y2="280" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="0.8" stroke-dasharray="6 4"/><path d="M70,210 C83.3,203.3 120,184.2 150,170 C180,155.8 216.7,138 250,125 C283.3,112 316.7,101.2 350,92 C383.3,82.8 433.3,73.7 450,70" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><path d="M70,210 C83.3,207.5 120,203.3 150,195 C180,186.7 216.7,173.3 250,160 C283.3,146.7 316.7,130 350,115 C383.3,100 433.3,77.5 450,70" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><text x="150" y="120" text-anchor="middle" font-size="12" font-weight="700">L(액체)</text><text x="250" y="146" text-anchor="middle" font-size="12" font-weight="700">L+α</text><text x="330" y="220" text-anchor="middle" font-size="12" fon