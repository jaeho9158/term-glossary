<svg class="si si-illus" viewBox="0 0 360 502" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="1세대 통화위기모형: 외환보유고가 줄다가 임계 수준에서 투기적 공격으로 붕괴" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="first-generation-currency-crisis-model-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><rect x="50" y="18" width="180" height="46" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4"/><rect x="230" y="18" width="110" height="46" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="140" y="46" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">고정환율 유지</text><text x="285" y="35" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">고정환율 붕괴</text><text x="285" y="55" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">(변동환율)</text><line x1="50" y1="280" x2="346" y2="280" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#first-generation-currency-crisis-model-ar)"/><line x1="50" y1="280" x2="50" y2="84" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#first-generation-currency-crisis-model-ar)"/><text x="58" y="88" font-weight="700">외환보유고</text><text x="340" y="302" text-anchor="end" font-weight="700">시간</text><line x1="50" y1="200" x2="340" y2="200" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.6" stroke-dasharray="6 4"/><text x="340" y="192" text-anchor="end" font-weight="700" style="fill:var(--si-limit,#7d2626)">임계 수준</text><line x1="50" y1="118" x2="230" y2="200" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><line x1="230" y1="200" x2="230" y2="280" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><line x1="230" y1="280" x2="340" y2="280" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><circle cx="230" cy="200" r="5" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1.6"/><line x1="230" y1="64" x2="230" y2="192" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M233,107 L221,124.4 L229.4,124.4 L227,137 L239,119 L230.6,119Z" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1.5"/><text x="248" y="126" font-weight="700" style="fill:var(--si-limit,#7d2626)">투기적 공격</text><text x="62" y="226" style="fill:var(--si-blue-t,#12305c)">재정적자 →</text><text x="62" y="246" style="fill:var(--si-blue-t,#12305c)">통화발행으로</text><text x="62" y="266" style="fill:var(--si-blue-t,#12305c)">점진적 고갈</text><text x="20" y="332" font-weight="700">보유고가 임계 수준에 닿는 순간 공격이 일어난다</text><text x="20" y="364">하락 추세로 붕괴 시점을 미리 예측할 수 있다</text><text x="20" y="402" style="fill:var(--si-general,#5c6b7f)">크루그먼의 국제수지위기 모형:</text><text x="20" y="422" style="fill:var(--si-general,#5c6b7f)">펀더멘털 악화의 결과</text><text x="20" y="462" style="fill:var(--si-limit,#7d2626)">한계: 펀더멘털이 양호한 위기는</text><text x="20" y="482" style="fill:var(--si-limit,#7d2626)">설명하지 못한다 → 2세대 모형</text></svg>
