(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.3"/><circle cx="152" cy="276" r="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.3"/><circle cx="166" cy="276" r="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.3"/><circle cx="180" cy="276" r="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.3"/><circle cx="194" cy="276" r="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.3"/><circle cx="208" cy="276" r="6" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.3"/><circle cx="150" cy="226" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><circle cx="172" cy="226" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><circle cx="194" cy="226" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><line x1="150" y1="234" x2="150" y2="258" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.3" marker-end="url(#chemical-vapor-deposition-ar-1)"/><line x1="172" y1="234" x2="172" y2="258" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.3" marker-end="url(#chemical-vapor-deposition-ar-1)"/><line x1="194" y1="234" x2="194" y2="258" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.3" marker-end="url(#chemical-vapor-deposition-ar-1)"/><circle cx="214" cy="260" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.3"/><line x1="218" y1="254" x2="226" y2="240" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.3" marker-end="url(#chemical-vapor-deposition-ar-2)"/><text x="180" y="320" text-anchor="middle">기판</text><g class="si-marker"><circle cx="128" cy="238" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="128" y="242" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">2</text></g><g class="si-marker"><circle cx="128" cy="282" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="128" y="286" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text></g><g class="si-marker"><circle cx="214" cy="222" r="8" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="214" y="226" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">4</text></g></g><text x="180" y="360" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">기판 표면 확대</text><text x="20" y="392">① 전구체 기체가 흘러 들어온다</text><text x="20" y="412">② 전구체(분홍)가 표면에 흡착·반응한다</text><text x="20" y="432">③ 고체 박막이 쌓인다(초록 원)</text><text x="20" y="452">④ 부산물이 기체 흐름으로 빠진다(파랑)</text><line x1="20" y1="490" x2="340" y2="490" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="514" font-weight="700">LPCVD 다결정 Si</text><text x="20" y="538">25~150 Pa · 600~650 ℃ · 10~20 nm/분</text><text x="20" y="570">예: SiH<tspan dy="0.217em" font-size="92%">4</tspan><tspan dy="-0.2em"> 10 sccm × 30분 = 0.0134 mol</tspan></text><text x="20" y="602" font-weight="700">→ 박막 두께 약 807 nm</text><text x="20" y="630" style="fill:var(--si-general,#5c6b7f)">(Si의 5%만 박막, 밀도 2.33 g/cm<tspan dy="-0.435em" font-size="92%">3</tspan><tspan dy="0.4em">,</tspan></text><text x="20" y="662" style="fill:var(--si-general,#5c6b7f)">면적 100 cm<tspan dy="-0.435em" font-size="92%">2</tspan><tspan dy="0.4em">로 가정)</tspan></text></svg>
