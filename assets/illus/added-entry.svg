roke-width="2"/><line x1="222" y1="227" x2="314" y2="227" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2"/><rect x="20" y="240" width="160" height="30" rx="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="30" y="260" font-weight="400">6XX 주제명</text><line x1="182" y1="255" x2="208" y2="255" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8" marker-end="url(#added-entry-ar-5)"/><rect x="223" y="243" width="125" height="30" rx="2" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1"/><rect x="216" y="240" width="125" height="30" rx="2" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="222" y="254" font-weight="700">주제명 카드</text><line x1="222" y1="262" x2="334" y2="262" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2"/><line x1="222" y1="267" x2="314" y2="267" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="2"/><text x="20" y="296" style="fill:var(--si-general,#5c6b7f)">카드마다 서지 본문은 같고 표목이 다르다</text><line x1="34" y1="322" x2="34" y2="442" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.5"/><circle cx="34" cy="326" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="46" y="330" font-weight="700" style="fill:var(--si-accent,#2454ff)">1876</text><text x="138" y="330">커터, 목록의 목적 제시</text><circle cx="34" cy="352" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="46" y="356" font-weight="700" style="fill:var(--si-accent,#2454ff)">1901~1997</text><text x="138" y="356">미국 의회도서관 인쇄 카드 판매</text><circle cx="34" cy="378" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="46" y="382" font-weight="700" style="fill:var(--si-accent,#2454ff)">1961</text><text x="138" y="382">파리 원칙</text><circle cx="34" cy="404" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="46" y="408" font-weight="700" style="fill:var(--si-accent,#2454ff)">1967</text><text x="138" y="408">영미목록규칙(AACR) 첫 판</text><circle cx="34" cy="430" r="4" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6"/><text x="46" y="434" font-weight="700" style="fill:var(--si-accent,#2454ff)">2015.10</text><text x="138" y="434">OCLC, 마지막 도서관 카드 인쇄</text><text x="20" y="474">어느 기여자에게 부출기입을 줄지는</text><text x="20" y="496">목록 규칙과 도서관 정책이 정한다</text></svg>
