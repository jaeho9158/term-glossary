<svg class="si si-illus" viewBox="0 0 520 320" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thevenins-theorem-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="thevenins-theorem-t">테브난 등가회로(가상 예)</title><defs></defs><text x="110" y="30" text-anchor="middle" font-weight="700">원 회로</text><line x1="40" y1="70" x2="66" y2="70" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="40" y1="70" x2="40" y2="108" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="32" y1="108" x2="48" y2="108" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="36" y1="116" x2="44" y2="116" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="40" y1="116" x2="40" y2="200" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="30" y="114" text-anchor="end" font-size="12">12 V</text><polyline points="66,70 74,70 79,62 89,78 99,62 109,78 114,70 122,70" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="94" y="56" text-anchor="middle" font-size="12">4 Ω</text><line x1="122" y1="70" x2="180" y2="70" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="180" y1="70" x2="180" y2="80" style="stroke:currentColor;fill:none" stroke-width="2"/><polyline points="180,80 180,88 172,93 188,103 172,113 188,123 180,128 180,136" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="196" y="108" font-size="12">6 Ω</text><line x1="180" y1="136" x2="180" y2="200" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="40" y1="200" x2="180" y2="200" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="180" y1="70" x2="230" y2="70" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="180" y1="200" x2="230" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.6"/><circle cx="230" cy="70" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="230" cy="200" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="244" y="135" font-size="11">부하 단자</text><text x="390" y="30" text-anchor="middle" font-weight="700">테브난 등가회로</text><line x1="330" y1="70" x2="356" y2="70" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="330" y1="70" x2="330" y2="108" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="322" y1="108" x2="338" y2="108" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="326" y1="116" x2="334" y2="116" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="330" y1="116" x2="330" y2="200" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="316" y="114" text-anchor="end" font-size="12">V<tspan baseline-shift="sub" font-size="72%">th</tspan> = 7.2 V</text><polyline points="356,70 364,70 369,62 379,78 389,62 399,78 404,70 412,70" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="384" y="53" text-anchor="middle" font-size="12">R<tspan baseline-shift="sub" font-size="72%">th</tspan> = 2.4 Ω</text><line x1="412" y1="70" x2="480" y2="70" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="480" cy="70" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="480" cy="200" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><line x1="330" y1="200" x2="480" y2="200" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="440" y="140" font-size="12">부하 R<tspan baseline-shift="sub" font-size="72%">L</tspan></text><line x1="480" y1="70" x2="480" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="480" y1="180" x2="480" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="260" y="250" text-anchor="middle" font-size="12">V<tspan baseline-shift="sub" font-size="72%">th</tspan> = 12 × 6/(4+6) = 7.2 V (개방 전압)</text><text x="260" y="272" text-anchor="middle" font-size="12">R<tspan baseline-shift="sub" font-size="72%">th</tspan> = 4 ∥ 6 = 2.4 Ω (전압원을 단락한 뒤 단자에서 본 저항)</text><text x="260" y="294" text-anchor="middle" font-size="12">R<tspan baseline-shift="sub" font-size="72%">L</tspan> = R<tspan baseline-shift="sub" font-size="72%">th</tspan> = 2.4 Ω에서 최대 전력 5.40 W</text></svg>
