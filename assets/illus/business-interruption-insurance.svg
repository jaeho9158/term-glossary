<svg class="si si-illus" viewBox="0 0 360 480" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="business-interruption-insurance-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="business-interruption-insurance-t">기업휴지보험: 중단 기간의 이익 상실에서 면책 기간을 뺀 만큼 보상한다</title><defs><marker id="business-interruption-insurance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="10" y="24">월 매출 1억 원 − 변동비 60%</text><text x="10" y="48" font-weight="700">= 월 매출총이익 4,000만 원 (가상)</text><text x="10" y="84" style="fill:var(--si-general,#5c6b7f)">월 매출총이익 (백만 원)</text><line x1="40" y1="250" x2="40" y2="98" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#business-interruption-insurance-ar)"/><line x1="40" y1="250" x2="340" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#business-interruption-insurance-ar)"/><text x="10" y="127">40</text><text x="22" y="255">0</text><rect x="104" y="122" width="32" height="128" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><rect x="136" y="122" width="96" height="128" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><rect x="232" y="122" width="64" height="64" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="264" y="214" text-anchor="middle">절반 회복</text><text x="264" y="236" text-anchor="middle">(20)</text><polyline points="40,122 104,122 104,250 232,250 232,186 296,186 296,122 340,122" style="stroke:currentColor;fill:none" stroke-width="2.6"/><text x="184" y="170" text-anchor="middle" font-weight="700">보상액</text><text x="184" y="194" text-anchor="middle" font-weight="700">80백만 원</text><path d="M106.2,95 L97.4,107.8 L103.6,107.8 L101.8,117 L110.6,103.8 L104.4,103.8Z" style="stroke:currentColor;fill:none" stroke-width="1.5"/><text x="72" y="172" text-anchor="middle">면책</text><text x="72" y="196" text-anchor="middle">보름 −20</text><line x1="98" y1="190" x2="114" y2="190" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="136" y="274" text-anchor="middle">40×1</text><text x="200" y="274" text-anchor="middle">40×1</text><text x="264" y="158" text-anchor="middle">40×0.5</text><text x="104" y="340" text-anchor="middle" font-weight="700">화재 발생</text><text x="296" y="340" text-anchor="middle" font-weight="700">정상 회복</text><line x1="104" y1="252" x2="104" y2="326" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><line x1="296" y1="252" x2="296" y2="326" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="3 3"/><text x="10" y="380">이익 상실 = 40×(1+1+0.5) = 100</text><text x="10" y="404" font-weight="700">보상 = 100 − 면책 20 = 80 (백만 원)</text><text x="10" y="440" font-weight="700" style="fill:var(--si-accent,#2454ff)">보상액 = 그래프 면적</text><text x="10" y="464" style="fill:var(--si-accent,#2454ff)">매출총이익 × 중단 기간에서 면책분을 뺌</text></svg>
