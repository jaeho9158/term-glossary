<svg class="si si-illus" viewBox="0 0 360 410" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A* 알고리즘: 확장 노드 수 비교와 평가 함수 f = g + h" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="26" text-anchor="middle" font-size="14" font-weight="700">같은 격자에서 확장한 노드 수</text><text x="180" y="50" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">세 방법 모두 최단 경로 길이는 16</text><text x="10" y="94">다익스트라</text><rect x="150" y="76" width="168" height="26" rx="3" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><text x="326" y="94" font-size="14" font-weight="700">60</text><text x="10" y="138">A*(맨해튼)</text><rect x="150" y="120" width="70" height="26" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.8"/><text x="228" y="138" font-size="14" font-weight="700">25</text><text x="10" y="182">A*(맨해튼×2)</text><rect x="150" y="164" width="50.4" height="26" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.8"/><text x="208.4" y="182" font-size="14" font-weight="700">18</text><line x1="150" y1="70" x2="150" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.2"/><line x1="10" y1="226" x2="350" y2="226" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="3 4"/><text x="180" y="254" text-anchor="middle" font-size="14" font-weight="700">f(n) = g(n) + h(n)</text><path d="M40,336 C45.8,332 60.8,309.7 75,312 C89.2,314.3 105.8,346 125,350 C144.2,354 179.2,338.3 190,336" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><line x1="190" y1="336" x2="320" y2="320" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.6" stroke-dasharray="7 4"/><circle cx="40" cy="336" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="40" y="320" text-anchor="middle" font-size="14" font-weight="700">S</text><circle cx="190" cy="336" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="190" y="318" text-anchor="middle" font-size="14" font-weight="700">n</text><circle cx="320" cy="320" r="6" style="stroke:currentColor;fill:currentColor" stroke-width="1.6"/><text x="320" y="302" text-anchor="middle" font-size="14" font-weight="700">G</text><text x="115" y="382" text-anchor="middle" style="fill:var(--si-blue-s,#7f9ac0)">g(n): S에서 n까지 실제 비용</text><text x="255" y="360" text-anchor="middle" style="fill:var(--si-amber-s,#d79a2b)">h(n): n에서 G까지</text><text x="255" y="384" text-anchor="middle" style="fill:var(--si-amber-s,#d79a2b)">추정 비용</text></svg>
