<svg class="si si-illus" viewBox="0 0 360 502" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lightship-displacement-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="lightship-displacement-t">경하배수량과 만재 배수량, 무게중심 높이</title><defs></defs><text x="180" y="22" text-anchor="middle" font-weight="700">경하 상태에서 만재 상태로</text><path d="M28,110 H168 L152,220 H44 Z" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="2.2" fill-opacity="0.7"/><rect x="128" y="84" width="30" height="26" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><path d="M14,186 H182 V228 H14 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.35"/><line x1="14" y1="186" x2="182" y2="186" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" stroke-dasharray="6 3"/><path d="M200,110 H340 L324,220 H216 Z" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.2" fill-opacity="0.7"/><rect x="300" y="84" width="30" height="26" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><path d="M186,148 H354 V228 H186 Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.35"/><line x1="186" y1="148" x2="354" y2="148" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" stroke-dasharray="6 3"/><line x1="14" y1="220" x2="346" y2="220" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="14" y="238" style="fill:var(--si-general,#5c6b7f)">K 용골(기준선)</text><rect x="224" y="118" width="92" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="228" y="134">화물</text><rect x="224" y="142" width="92" height="22" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="228" y="158">연료·청수</text><rect x="224" y="166" width="92" height="22" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="228" y="182">밸러스트</text><rect x="302" y="88" width="26" height="18" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="315" y="76" text-anchor="middle">선원</text><line x1="14" y1="148" x2="140" y2="148" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="98" cy="148" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="46" y="136" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">G (KG 8.0 m)</text><circle cx="304" cy="134.5" r="4.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><circle cx="328" cy="138.4" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="98" y="70" text-anchor="middle" font-weight="700">경하 상태</text><text x="270" y="48" text-anchor="middle" font-weight="700">만재 상태</text><text x="98" y="260" text-anchor="middle" font-weight="700">8,000 t</text><text x="270" y="260" text-anchor="middle" font-weight="700">28,000 t</text><text x="180" y="292" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">만재 배수량 = 경하배수량 + 재화중량(DWT)</text><text x="180" y="316" text-anchor="middle" font-weight="700">28,000 t = 8,000 t + 20,000 t</text><text x="180" y="344" text-anchor="middle">(8,000×8.0 + 20,000×9.5) ÷ 28,000 ≈ 9.07 m</text><circle cx="24" cy="378" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="38" y="383" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">합성 G ≈ 9.07 m (만재)</text><circle cx="24" cy="402" r="4.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="38" y="407" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">화물 G 9.5 m</text><text x="180" y="436" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">경하 G는 복원성 계산의 출발점</text><text x="180" y="460" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">경사시험으로 실측, 개조 후 재측정</text><text x="180" y="484" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">해수 1,025 kg/m³ (담수 1,000)</text></svg>
