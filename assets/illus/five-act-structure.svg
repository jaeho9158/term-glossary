<svg class="si si-illus" viewBox="0 0 360 524" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="five-act-structure-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="five-act-structure-t">프라이타크 피라미드: 극의 5단계</title><defs><marker id="five-act-structure-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="five-act-structure-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.85" markerHeight="3.85" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="five-act-structure-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.85" markerHeight="3.85" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-violet-s,#9382bd)"/></marker></defs><line x1="20" y1="272" x2="346" y2="272" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#five-act-structure-ar)"/><line x1="20" y1="272" x2="20" y2="60" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#five-act-structure-ar)"/><text x="30" y="56" font-weight="700">극적 긴장</text><text x="346" y="298" text-anchor="end">극의 진행 (시간)</text><line x1="26" y1="232" x2="84" y2="232" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="4"/><line x1="84" y1="232" x2="176" y2="98" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="4" marker-end="url(#five-act-structure-ar-1)"/><line x1="184" y1="98" x2="252" y2="236" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="4" marker-end="url(#five-act-structure-ar-2)"/><line x1="252" y1="236" x2="338" y2="236" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="4"/><circle cx="180" cy="92" r="7" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="194" y="84" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">전환점</text><g class="si-marker"><circle cx="52" cy="205" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="52" y="209" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">1</text></g><g class="si-marker"><circle cx="98" cy="168" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="98" y="172" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">2</text></g><g class="si-marker"><circle cx="180" cy="62" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="180" y="66" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text></g><g class="si-marker"><circle cx="236" cy="140" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="236" y="144" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">4</text></g><g class="si-marker"><circle cx="296" cy="210" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="296" y="214" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">5</text></g><g class="si-marker"><circle cx="26" cy="330" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="26" y="334" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">1</text></g><text x="46" y="334" font-weight="700">도입 (Einleitung)</text><text x="206" y="334">인물·상황 소개</text><g class="si-marker"><circle cx="26" cy="356" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="26" y="360" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">2</text></g><text x="46" y="360" font-weight="700">상승 (Steigerung)</text><text x="206" y="360">갈등 고조</text><g class="si-marker"><circle cx="26" cy="382" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="26" y="386" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text></g><text x="46" y="386" font-weight="700">절정 (Höhepunkt)</text><text x="206" y="386">전환점</text><g class="si-marker"><circle cx="26" cy="408" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="26" y="412" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">4</text></g><text x="46" y="412" font-weight="700">하강 (Fall/Umkehr)</text><text x="206" y="412">결과 전개</text><g class="si-marker"><circle cx="26" cy="434" r="11" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="26" y="438" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">5</text></g><text x="46" y="438" font-weight="700">파국 (Katastrophe)</text><text x="206" y="438">해결·파국</text><text x="14" y="486">프라이타크 (1863): 5단계는 극의 전개 단계이며</text><text x="14" y="508">막의 수와는 구별된다.</text></svg>
