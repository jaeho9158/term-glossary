ue-s,#7f9ac0)">정맥 AUC 100</text><text x="176" y="440" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">경구 AUC 45</text><text x="180" y="560" text-anchor="middle" font-weight="700">F = 45 ÷ 100 = 0.45 (용량 같음)</text></svg>
