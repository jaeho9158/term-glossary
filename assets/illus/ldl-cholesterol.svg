<svg class="si si-illus" viewBox="0 0 360 524" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ldl-cholesterol-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ldl-cholesterol-t">LDL 콜레스테롤: 계산식과 NCEP ATP III 구간</title><defs><marker id="ldl-cholesterol-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="ldl-cholesterol-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><g class="si-rich" font-size="15"  font-weight="700"><text x="77.6" y="24">LDL-C = TC − HDL-C − </text><text x="270.8" y="16.8" text-anchor="middle" font-size="12">TG</text><line x1="260.6" y1="19.2" x2="280.9" y2="19.2" style="stroke:currentColor" stroke-width="0.9"/><text x="270.8" y="29.5" text-anchor="middle" font-size="12">5</text></g><line x1="30" y1="72" x2="330" y2="72" style="stroke:currentColor;fill:none" stroke-width="1.2" marker-end="url(#ldl-cholesterol-ar)" marker-start="url(#ldl-cholesterol-ar)"/><text x="180" y="58" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">TC 210 mg/dL</text><rect x="30" y="82" width="64.3" height="64" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6" fill-opacity="0.35"/><rect x="94.3" y="82" width="51.4" height="64" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.6" fill-opacity="0.3"/><rect x="145.7" y="82" width="184.3" height="64" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.3"/><text x="62.1" y="105" text-anchor="middle" font-weight="700">HDL-C</text><text x="62.1" y="133" text-anchor="middle">45</text><g class="si-rich" font-size="13"  font-weight="700"><text x="120" y="98.8" text-anchor="middle" font-size="10.4">TG</text><line x1="111" y1="100.8" x2="129" y2="100.8" style="stroke:currentColor" stroke-width="0.8"/><text x="120" y="109.8" text-anchor="middle" font-size="10.4">5</text></g><text x="120" y="133" text-anchor="middle">36</text><text x="237.9" y="105" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">LDL-C</text><text x="237.9" y="133" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">129</text><line x1="120" y1="148" x2="120" y2="168" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2" stroke-dasharray="3 3"/><text x="30" y="184">TG 180 → 180/5 = 36 (VLDL-C 추정)</text><polygon points="30,216 40,196 50,216" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="40" y="214" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">!</text><text x="60" y="214" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">TG ≥ 400이면 식 적용 불가</text><line x1="14" y1="234" x2="346" y2="234" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1" stroke-dasharray="4 4"/><text x="14" y="258" font-size="14" font-weight="700">NCEP ATP III 기준 (mg/dL)</text><rect x="190" y="386" width="60" height="80" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="431" text-anchor="end">&lt;100 적정</text><rect x="190" y="362" width="60" height="24" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="379" text-anchor="end">100~129 정상에 가까움</text><rect x="190" y="338" width="60" height="24" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.35"/><text x="182" y="355" text-anchor="end">130~159 경계 상승</text><rect x="190" y="31