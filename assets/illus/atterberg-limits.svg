<svg class="si si-illus" viewBox="0 0 360 500" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atterberg-limits-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="atterberg-limits-t">애터버그 한계: 함수비 구간과 두 시험</title><defs><marker id="atterberg-limits-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="atterberg-limits-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="18" text-anchor="middle" font-size="14" font-weight="700">애터버그 한계: 함수비로 나눈 흙의 상태</text><text x="14" y="50" style="fill:var(--si-general,#5c6b7f)">함수비(%)가 늘어나는 방향 →</text><rect x="30" y="70" width="70" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="65" y="93" text-anchor="middle" font-weight="700">고체</text><rect x="100" y="70" width="70" height="34" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="135" y="93" text-anchor="middle" font-weight="700">반고체</text><rect x="170" y="70" width="120" height="34" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="230" y="93" text-anchor="middle" font-weight="700">소성</text><rect x="290" y="70" width="56" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="318" y="93" text-anchor="middle" font-weight="700">액체</text><line x1="100" y1="104" x2="100" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="100" y="130" text-anchor="middle" font-weight="700">수축한계</text><line x1="170" y1="104" x2="170" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="170" y="130" text-anchor="middle" font-weight="700">PL 25</text><line x1="290" y1="104" x2="290" y2="112" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="290" y="130" text-anchor="middle" font-weight="700">LL 45</text><line x1="170" y1="142" x2="170" y2="172" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="290" y1="142" x2="290" y2="172" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="170" y1="172" x2="290" y2="172" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2" marker-end="url(#atterberg-limits-ar)" marker-start="url(#atterberg-limits-ar)"/><text x="230" y="198" text-anchor="middle" font-weight="700" style="fill:var(--si-green-t,#14543c)">PI = LL − PL = 20</text><text x="14" y="240" font-weight="700">액성한계(LL) 시험</text><path d="M40 280 L148 280 Q94 352 40 280 Z" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><path d="M40 280 L86 280 L94 306 L102 280 L148 280" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2"/><path d="M86 280 L94 306 L102 280 Z" style="stroke:none;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><line x1="94" y1="372" x2="94" y2="340" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#atterberg-limits-ar-1)"/><text x="94" y="396" text-anchor="middle">홈이 12.7 mm 닫힘</text><text x="94" y="418" text-anchor="middle">25회 타격 기준</text><text x="196" y="240" font-weight="700">소성한계(PL) 시험</text><line x1="236" y1="300" x2="270" y2="300" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="12" opacity="0.9"/><line x1="288" y1="300" x2="340" y2="300" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="12" opacity="0.9"/><polyline points="270,294 274,298 271,302 275,306" style="stroke:currentColor;fill:none" stroke-width="1.4"/><polyline points="288,294 284,298 287,302 283,306" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="226" y1="284" x2="226" y2="316" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#atterberg-limits-ar-1)" marker-start="url(#atterberg-limits-ar-1)"/><text x="212" y="305" text-anchor="end">3.2 mm</text><text x="272" y="352" text-anchor="middle">이 굵기에서</text><text x="272" y="374" text-anchor="middle">부서짐</text><text x="14" y="460" style="fill:var(--si-general,#5c6b7f)">예시값(가상): LL 45, PL 25 → PI 20</text><text x="14" y="482" style="fill:var(--si-general,#5c6b7f)">세립분에만 정의된다</text></svg>
