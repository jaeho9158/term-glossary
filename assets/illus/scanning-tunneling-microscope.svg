<svg class="si si-illus" viewBox="0 0 600 322" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="주사 터널링 현미경의 구조" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>압전 스캐너에 달린 뾰족한 탐침이 시료 표면 원자 위 0.4~0.7 nm 거리에 있고, 탐침과 시료 사이 바이어스 전압으로 터널링 전류가 흐른다. 피드백 회로가 전류를 일정하게 유지하도록 스캐너 높이를 조절한다</desc><defs><marker id="scanning-tunneling-microscope-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="scanning-tunneling-microscope-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="scanning-tunneling-microscope-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><circle cx="80" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="110" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="140" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="170" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="200" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="230" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="260" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="290" cy="262" r="14" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1"/><circle cx="320" cy="262" r="