<svg class="si si-illus" viewBox="0 0 360 340" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시간체계: 같은 사건, 다른 발달 시점" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="chronosystem-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">같은 사건을 몇 살에 겪었나</text><line x1="20" y1="58" x2="346" y2="58" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#chronosystem-ar)"/><text x="346" y="46" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">역사적 시간</text><line x1="40" y1="53" x2="40" y2="63" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="40" y="46" text-anchor="middle">1920</text><line x1="136" y1="53" x2="136" y2="63" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="136" y="46" text-anchor="middle">1928</text><rect x="222" y="70" width="28" height="170" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="236" y="258" text-anchor="middle" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">가계 타격(같은 사건)</text><text x="20" y="96" font-weight="700" style="fill:var(--si-blue-t,#12305c)">오클랜드 표본 · 1920~21년생</text><rect x="40" y="108" width="196" height="16" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" opacity="0.85"/><rect x="236" y="108" width="104" height="16" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1"/><text x="216" y="142" text-anchor="end" style="fill:var(--si-blue-t,#12305c)">이미 많이 자란 뒤 겪음</text><text x="20" y="180" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">버클리 표본 · 1928~29년생</text><rect x="136" y="192" width="100" height="16" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" opacity="0.85"/><rect x="236" y="192" width="104" height="16" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1"/><text x="216" y="226" text-anchor="end" style="fill:var(--si-rose-t,#7d2626)">어릴 때 겪음</text><rect x="20" y="276" width="320" height="54" rx="6" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="180" y="298" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">버클리 표본이 부정적 영향을 더 크게 받음</text><text x="180" y="318" text-anchor="middle">사건 + 겪은 나이(발달 시점) → 발달 영향</text></svg>
