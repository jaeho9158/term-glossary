ke-width="0" fill-opacity="0.2"/><path d="M300 100 Q312 126 300 152" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><line x1="318" y1="100" x2="318" y2="152" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="3.4"/><line x1="140" y1="98" x2="140" y2="108" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><line x1="140" y1="144" x2="140" y2="154" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><line x1="250" y1="98" x2="250" y2="108" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><line x1="250" y1="144" x2="250" y2="154" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2"/><polygon points="34,116 36.4,122.8 43.5,122.9 37.8,127.2 39.9,134.1 34,130 28.1,134.1 30.2,127.2 24.5,122.9 31.6,122.8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><polygon points="250,114 252.9,122 261.4,122.3 254.8,127.5 257.1,135.7 250,131 242.9,135.7 245.2,127.5 238.6,122.3 247.1,122" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1"/><line x1="34" y1="156" x2="34" y2="168" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="20" y="184">점화점</text><line x1="250" y1="156" x2="250" y2="168" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="250" y="184" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">폭굉 전이(DDT) 지점</text><text x="20" y="222">전파 속도·압력이 커진다 (정성적)</text><polygon points="24,235 322,235 322,228 336,242 322,256 322,249 24,249" style="stroke:var(--si-amber-s,#d79a2b);fill:url(#detonation-g0)" stroke-width="1.4" fill-opacity="0.35"/><line x1="20" y1="284" x2="46" y2="284" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3.4"/><text x="54" y="289">화염면</text><line x1="130" y1="284" x2="156" y2="284" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="3.4"/><text x="164" y="289">충격파</text><text x="20" y="322">폭굉에서는 충격파와 화염이 분리되지</text><text x="20" y="342">않고 함께 이동한다.</text><text x="20" y="372" style="fill:var(--si-general,#5c6b7f)">전이 여부·위치는 배관 형상,</text><text x="20" y="392" style="fill:var(--si-general,#5c6b7f)">가스 종류, 농도에 좌우된다.</text></svg>
