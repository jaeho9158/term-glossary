or="middle" font-style="italic" style="fill:var(--si-blue-t,#12305c)">x<tspan dy="0.217em" font-size="92%">2</tspan></text><ellipse cx="180" cy="526" rx="50" ry="34" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="180" y="531" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">잠재변수</text><line x1="62" y1="506" x2="132" y2="518" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#latent-variable-ar)"/><line x1="62" y1="546" x2="132" y2="534" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#latent-variable-ar)"/><text x="250" y="518" style="fill:var(--si-general,#5c6b7f)">지표가 잠재변수를</text><text x="250" y="538" style="fill:var(--si-general,#5c6b7f)">형성, 지표 간</text><text x="250" y="558" style="fill:var(--si-general,#5c6b7f)">상관은 필요 없음</text></svg>
