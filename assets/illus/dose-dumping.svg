<svg class="si si-illus" viewBox="0 0 360 596" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dose-dumping-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="dose-dumping-t">도스덤핑: 서방형 정제가 한꺼번에 방출될 때의 방출량과 혈중농도</title><defs><marker id="dose-dumping-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><ellipse cx="26" cy="26" rx="13" ry="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><line x1="14" y1="26" x2="38" y2="26" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1"/><text x="46" y="31" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">온전한 정제</text><ellipse cx="182" cy="26" rx="13" ry="8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><polyline points="176,18 181,24 177,28 184,34" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.4"/><text x="202" y="31" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">손상·알코올·식사</text><text x="14" y="70" font-weight="700">① 누적 방출량 (가상 예: 100 mg, 12시간)</text><text x="14" y="94" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">1시간 안에 100 mg 방출 → 설계의 약 12배</text><line x1="50" y1="240" x2="340" y2="240" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#dose-dumping-ar)"/><line x1="50" y1="240" x2="50" y2="110" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="44" y="124" text-anchor="end">100</text><text x="44" y="244" text-anchor="end">0</text><line x1="47" y1="120" x2="53" y2="120" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="50" y1="240" x2="50" y2="244" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="50" y="258" text-anchor="middle">0</text><line x1="195" y1="240" x2="195" y2="244" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="195" y="258" text-anchor="middle">6</text><line x1="320" y1="240" x2="320" y2="244" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="320" y="258" text-anchor="middle">12</text><text x="340" y="280" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">시간(h)</text><line x1="50" y1="120" x2="340" y2="120" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" stroke-dasharray="6 4"/><line x1="50" y1="240" x2="320" y2="120" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><path d="M50,240 C51,230 53.7,198.3 56,180 C58.3,161.7 61,140 64,130 C67,120 72.3,121.7 74,120" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><line x1="74" y1="120" x2="340" y2="120" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="330" y="200" text-anchor="end" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">설계 ≈ 8.3 mg/h</text><text x="14" y="316" font-weight="700">② 혈중농도 (모식)</text><line x1="50" y1="450" x2="340" y2="450" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#dose-dumping-ar)"/><line x1="50" y1="450" x2="50" y2="332" style="stroke:currentColor;fill:none" stroke-width="1.4"/><text x="340" y="470" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">시간</text><line x1="50" y1="378" x2="340" y2="378" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4" stroke-dasharray="6 4"/><text x="340" y="372" text-anchor="end" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">독성 역치(수치 없음)</text><path d="M50,450 C58.3,447 83.3,436.3 100,432 C116.7,427.7 128.3,425.3 150,424 C171.7,422.7 205,422 230,424 C255,426 281.7,432.3 300,436 C318.3,439.7 333.3,444.3 340,446" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><path d="M50,450 C53,441.7 61.7,417.3 68,400 C74.3,382.7 81,351 88,346 C95,341 99.7,357.7 110,370 C120.3,382.3 128.3,408.3 150,420 C171.7,431.7 208.3,435.3 240,440 C271.7,444.7 323.3,446.7 340,448" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="116" y="352" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">도스덤핑: 역치를 넘는 피크</text><line x1="14" y1="490" x2="40" y2="490" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4"/><text x="46" y="495">정상 서방형</text><line x1="160" y1="490" x2="186" y2="490" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><text x="192" y="495">도스덤핑</text><text x="14" y="526" style="fill:var(--si-general,#5c6b7f)">Lennernas(2009) 검토: 에탄올과 함께 먹으면</text><text x="14" y="546" style="fill:var(--si-general,#5c6b7f)">한 약물의 최고 혈중농도가 개인 단위 최대 16배</text><text x="14" y="576" style="fill:var(--si-general,#5c6b7f)">수치(100 mg, 12시간)는 가상의 값, 곡선 모양은 모식</text></svg>
