<svg class="si si-illus" viewBox="0 0 360 576" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cross-border-e-commerce-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cross-border-e-commerce-t">해외직구: 면세 기준을 넘으면 세금이 가격 전체에 붙어 실효 비용이 급등</title><defs><marker id="cross-border-e-commerce-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="cross-border-e-commerce-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><line x1="50" y1="250" x2="345" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cross-border-e-commerce-ar)"/><line x1="50" y1="250" x2="50" y2="34" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#cross-border-e-commerce-ar)"/><line x1="50" y1="250" x2="50" y2="255" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="50" y="272" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">0</text><line x1="115" y1="250" x2="115" y2="255" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="115" y="272" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">50</text><line x1="180" y1="250" x2="180" y2="255" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="180" y="272" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">100</text><line x1="310" y1="250" x2="310" y2="255" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="310" y="272" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">200</text><line x1="46" y1="170" x2="50" y2="170" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="42" y="174" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">100</text><line x1="46" y1="90" x2="50" y2="90" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="42" y="94" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">200</text><text x="198" y="294" text-anchor="middle">상품 가격(달러)</text><text x="6" y="24" font-weight="700">실효 비용(달러)</text><line x1="245" y1="40" x2="245" y2="250" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.2" stroke-dasharray="5 4"/><text x="245" y="30" text-anchor="middle" font-weight="700">면세 기준 150달러</text><polyline points="50,250 245,130" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.8"/><polyline points="245,107.4 336,40.9" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.8"/><line x1="237" y1="130" x2="237" y2="109.4" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2" marker-end="url(#cross-border-e-commerce-ar-1)"/><text x="227" y="101.4" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">기준 초과:</text><text x="227" y="121.4" text-anchor="end" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">세금이 붙어 비용 급증</text><circle cx="206" cy="154" r="5" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="196" y="146" text-anchor="end" font-weight="700" style="fill:var(--si-blue-t,#12305c)">A</text><rect x="251" y="111.8" width="14" height="10.2" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.7"/><rect x="251" y="97.9" width="14" height="13.8" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.4" fill-opacity="0.7"/><circle cx="258" cy="122" r="3.5" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><circle cx="258" cy="97.9" r="3.5" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="258" y="146" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">B</text><text x="275" y="117.9" style="fill:var(--si-rose-t,#7d2626)">부가세 17.28</text><line x1="273" y1="111.9" x2="265" y2="105.2" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="0.9"/><circle cx="265" cy="105.2" r="2.6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="275" y="143.9" style="fill:var(--si-amber-t,#7a5210)">관세 12.80</text><line x1="273" y1="137.9" x2="265" y2="117.2" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="0.9"/><circle cx="265" cy="117.2" r="2.6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="14" y="326" style="fill:var(--si-blue-t,#12305c)">A: 120달러 → 합계 120달러(면세)</text><text x="14" y="348" style="fill:var(--si-rose-t,#7d2626)">B: 160 + 관세 12.80 + 부가세 17.28 = 190.08달러</text><text x="14" y="396" font-weight="700">국가별 소액 면세 기준(달러)</text><line x1="30" y1="432" x2="336" y2="432" style="stroke:currentColor;fill:none" stroke-width="2"/><circle cx="57.2" cy="432" r="4.5" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="57.2" y="418" text-anchor="middle">일본 약 71</text><circle cx="93.5" cy="432" r="4.5" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="93.5" y="456" text-anchor="middle">EU 약 166</text><circle cx="287.4" cy="432" r="4.5" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="287.4" y="418" text-anchor="middle">호주 약 673</text><circle cx="336" cy="432" r="4.5" style="stroke:currentColor;fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="342" y="456" text-anchor="end">미국 800</text><text x="14" y="484" style="fill:var(--si-general,#5c6b7f)">미국은 2025년에 면제를 줄임. EU는 2021.7.1에</text><text x="14" y="506" style="fill:var(--si-general,#5c6b7f)">22유로 이하 부가세 면제를 폐지함</text><text x="14" y="538" font-weight="700">면세 기준을 넘는 순간 세금이 가격 전체에 붙음</text><text x="14" y="560" style="fill:var(--si-general,#5c6b7f)">(위 그래프는 가상의 국가 기준)</text></svg>
