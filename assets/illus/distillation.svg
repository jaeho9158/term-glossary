<svg class="si si-illus" viewBox="0 0 520 420" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="distillation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="distillation-t">증류탑의 구조와 온도 기울기</title><desc>아래 가열부에서 올라온 증기가 여러 단을 지나며 위로 갈수록 차가워지고, 꼭대기 응축기에서 응축한 액체 일부가 환류로 탑에 되돌아가며 위쪽과 아래쪽에서 제품을 얻는 증류탑의 모식도</desc><defs><marker id="distillation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="distillation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker><marker id="distillation-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="distillation-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker><marker id="distillation-ar-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="190" y="50" width="100" height="250" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="2" fill-opacity="0.12"/><line x1="190" y1="90" x2="265" y2="90" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><line x1="215" y1="130" x2="290" y2="130" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><line x1="190" y1="170" x2="265" y2="170" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><line x1="215" y1="210" x2="290" y2="210" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><line x1="190" y1="250" x2="265" y2="250" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.4"/><text x="240" y="36" text-anchor="middle" font-size="12" font-weight="700">증류탑</text><rect x="175" y="300" width="130" height="40" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.8" fill-opacity="0.3"/><text x="240" y="325" text-anchor="middle" font-size="12" font-weight="700">가열부</text><line x1="90" y1="190" x2="190" y2="190" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.8" marker-end="url(#distillation-ar)"/><text x="105" y="176" text-anchor="middle" font-size="12">원료 혼합물</text><line x1="290" y1="65" x2="330" y2="65" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.8"/><rect x="330" y="45" width="90" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.8" fill-opacity="0.25"/><text x="375" y="70" text-anchor="middle" font-size="12" font-weight="700">응축기</text><line x1="375" y1="85" x2="375" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6"/><line x1="375" y1="110" x2="290" y2="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" marker-end="url(#distillation-ar-1)"/><text x="333" y="102" text-anchor="middle" font-size="12">환류</text><line x1="420" y1="65" x2="500" y2="65" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.8" marker-end="url(#distillation-ar-2)"/><text x="460" y="48" text-anchor="middle" font-size="12" style="fill:var(--si-green-s,#5b9b83)">위쪽 제품</text><line x1="240" y1="340" x2="240" y2="380" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.8" marker-end="url(#distillation-ar-3)"/><text x="240" y="398" text-anchor="middle" font-size="12" style="fill:var(--si-amber-s,#d79a2b)">아래쪽 제품</text><line x1="340" y1="140" x2="340" y2="290" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#distillation-ar-4)"/><text x="340" y="132" text-anchor="middle" font-size="11">낮은 온도</text><text x="340" y="308" text-anchor="middle" font-size="11">높은 온도</text><text x="80" y="108" text-anchor="middle" font-size="12">단(트레이)</text><line x1="80" y1="108" x2="240" y2="130" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="0.9"/><circle cx="240" cy="130" r="2.6" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-general,#5c6b7f)" stroke-width="1.6"/></svg>
