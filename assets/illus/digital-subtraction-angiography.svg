<svg class="si si-illus" viewBox="0 0 360 432" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="디지털 감산 혈관조영: 주입 전후 영상의 차이" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><rect x="16" y="40" width="92" height="120" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6" fill-opacity="0.9"/><polygon points="44,54 60,50 76,54 72,80 66,110 74,140 60,148 46,140 54,110 48,80" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1" fill-opacity="0.9"/><path d="M64 48 L64 102 L42 132" style="stroke:currentColor;fill:none" stroke-width="3.2"/><path d="M64 102 L88 136" style="stroke:currentColor;fill:none" stroke-width="3.2"/><path d="M64 74 L86 86" style="stroke:currentColor;fill:none" stroke-width="2.2"/><text x="62" y="30" text-anchor="middle" font-weight="700">후 영상(주입 후)</text><rect x="134" y="40" width="92" height="120" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6" fill-opacity="0.9"/><polygon points="162,54 178,50 194,54 190,80 184,110 192,140 178,148 164,140 172,110 166,80" style="stroke:var(--si-general,#5c6b7f);fill:var(--si-bg,#ffffff)" stroke-width="1" fill-opacity="0.9"/><text x="180" y="30" text-anchor="middle" font-weight="700">마스크(주입 전)</text><rect x="252" y="40" width="92" height="120" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6" fill-opacity="0.55"/><path d="M300 48 L300 102 L278 132" style="stroke:currentColor;fill:none" stroke-width="3.2"/><path d="M300 102 L324 136" style="stroke:currentColor;fill:none" stroke-width="3.2"/><path d="M300 74 L322 86" style="stroke:currentColor;fill:none" stroke-width="2.2"/><text x="298" y="30" text-anchor="middle" font-weight="700">감산 결과</text><text x="125" y="106" text-anchor="middle" font-size="20" font-weight="700">−</text><text x="243" y="106" text-anchor="middle" font-size="20" font-weight="700">=</text><text x="178" y="70" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">뼈</text><text x="330" y="62" text-anchor="middle">혈관</text><text x="16" y="184" font-weight="700">I = I₀·exp(−Σμt)</text><text x="16" y="208">예: I₀ = 1000, 연부조직 μt = 0.8, 조영제 μt = 0.3</text><text x="16" y="240">뼈 μt 1.2: 전 135.3, 후 100.3 → 로그 차이 −0.300</text><text x="16" y="264">뼈 μt 2.0: 전 60.8, 후 45.0 → 로그 차이 −0.300</text><text x="16" y="292" font-weight="700" style="fill:var(--si-accent,#2454ff)">뼈 두께와 상관없이 조영제 항만 남는다</text><text x="16" y="332" font-weight="700">움직임이 있으면 잔상이 남는다</text><rect x="16" y="344" width="92" height="70" style="stroke:currentColor;fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.55"/><polygon points="44,354 58,352 70,356 66,378 62,398 48,398 48,378" style="stroke:currentColor;fill:none" stroke-width="1.4"/><polygon points="50,354 64,352 76,356 72,378 68,398 54,398 54,378" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" stroke-dasharray="3 2"/><text x="124" y="368">뼈 가장자리에 잔상</text><text x="124" y="394" style="fill:var(--si-accent,#2454ff)">→ 정합으로 교정</text></svg>
