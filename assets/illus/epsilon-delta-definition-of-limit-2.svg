"36" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#epsilon-delta-definition-of-limit-2-ar)"/><polyline points="54,270 191,270" style="stroke:currentColor;fill:none" stroke-width="2"/><polyline points="201,130 338,130" style="stroke:currentColor;fill:none" stroke-width="2"/><polyline points="156,270 191,270" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="4"/><circle cx="196" cy="270" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-bg,#ffffff)" stroke-width="2"/><circle cx="196" cy="130" r="5" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2"/><text x="338" y="122" text-anchor="end" font-size="12">y = f(x)</text><text x="34" y="99" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">L+ε</text><text x="34" y="134" text-anchor="end" font-size="12" font-weight="700">L=1</text><text x="34" y="169" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">L−ε</text><text x="34" y="274" text-anchor="end" font-size="12" font-weight="700">−1</text><text x="156" y="348" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-blue-t,#12305c)">−δ</text><text x="196" y="348" text-anchor="middle" font-size="12" font-weight="700">0</text><text x="236" y="348" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-blue-t,#12305c)">δ</text><text x="352" y="348" text-anchor="end" font-size="12">x</text><text x="150" y="294" text-anchor="end" font-size="11" style="fill:var(--si-rose-t,#7d2626)">f(x) = −1: 노란 띠 밖</text><text x="190" y="372" text-anchor="middle" font-size="12">f(x) = |x| ÷ x, L = 1, ε = 0.5로 두면</text><text x="190" y="390" text-anchor="middle" font-size="12">δ를 아무리 줄여도 빨간 구간(0 왼쪽)은 띠 밖에 남는다</text><text x="190" y="408" text-anchor="middle" font-size="12">L을 어떻게 잡아도 한쪽이 벗어나므로 극한이 없다</text></svg>
