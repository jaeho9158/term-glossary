<svg class="si si-illus" viewBox="0 0 360 614" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="영속적 이해: 세 층 중 가장 안쪽의 핵심" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="enduring-understanding-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">백워드 설계 1단계: 바라는 결과 정하기</text><ellipse cx="180" cy="236" rx="166" ry="176" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="2" fill-opacity="0.55"/><ellipse cx="180" cy="236" rx="130" ry="120" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2" fill-opacity="0.75"/><ellipse cx="180" cy="236" rx="66" ry="60" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="2.4" fill-opacity="0.45"/><text x="180" y="102" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">알아 둘 만한 것</text><text x="180" y="148" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">알고 할 수 있어야</text><text x="180" y="168" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">하는 것</text><text x="180" y="241" text-anchor="middle" font-weight="700">영속적</text><text x="180" y="261" text-anchor="middle" font-weight="700">이해</text><rect x="40" y="450" width="80" height="28" rx="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4"/><text x="80" y="469" text-anchor="middle">바깥</text><line x1="124" y1="464" x2="146" y2="464" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#enduring-understanding-ar)"/><rect x="150" y="450" width="80" height="28" rx="4" style="stroke:var(--si-violet-s,#9382bd);fill:var(--s