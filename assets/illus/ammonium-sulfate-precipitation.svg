<svg class="si si-illus" viewBox="0 0 360 756" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ammonium-sulfate-precipitation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="ammonium-sulfate-precipitation-t">황산암모늄 침전: 단계적 첨가와 원심분리, 투석</title><defs><marker id="ammonium-sulfate-precipitation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="ammonium-sulfate-precipitation-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-gray-s,#aab6c6)"/></marker></defs><path d="M24 34V87A15 15 0 0 0 54 87V34Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><path d="M24 26V87A15 15 0 0 0 54 87V26" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="78" y="42" font-weight="700">① 차가운 추출액 10 mL</text><text x="78" y="64">+ 포화 황산암모늄 6.67 mL</text><text x="78" y="86">→ 0→40% 포화</text><path d="M24 134V187A15 15 0 0 0 54 187V134Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><path d="M24 126V187A15 15 0 0 0 54 187V126" style="stroke:currentColor;fill:none" stroke-width="1.8"/><ellipse cx="39" cy="195" rx="9" ry="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="78" y="142" font-weight="700">② 원심분리</text><text x="78" y="164">바닥: 0–40% 침전(펠릿)</text><text x="78" y="186">위: 상층액 → 다음 튜브로</text><line x1="66" y1="140" x2="66" y2="232" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#ammonium-sulfate-precipitation-ar)"/><path d="M24 234V287A15 15 0 0 0 54 287V234Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><path d="M24 226V287A15 15 0 0 0 54 287V226" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="78" y="242" font-weight="700">③ 상층액에 16.67 mL 추가</text><text x="78" y="264">→ 40→70% 포화</text><text x="78" y="286">(총 부피 33.3 mL)</text><path d="M24 334V387A15 15 0 0 0 54 387V334Z" style="stroke:none;fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><path d="M24 326V387A15 15 0 0 0 54 387V326" style="stroke:currentColor;fill:none" stroke-width="1.8"/><ellipse cx="39" cy="395" rx="9" ry="5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><text x="78" y="342" font-weight="700">④ 원심분리</text><text x="78" y="364">바닥: 40–70% 침전(펠릿)</text><text x="78" y="386">펠릿을 모아 다음 단계로</text><path d="M8,445.8 L8,482 Q8,492 18,492 L74,492 Q84,492 84,482 L84,445.8Z" style="stroke:none;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.85"/><line x1="8" y1="445.8" x2="84" y2="445.8" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2" stroke-dasharray="5 3"/><path d="M8,426 L8,482 Q8,492 18,492 L74,492 Q84,492 84,482 L84,426" style="stroke:currentColor;fill:none" stroke-width="2"/><rect x="36" y="444" width="24" height="40" rx="10" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><line x1="34" y1="464" x2="16" y2="464" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6" marker-end="url(#ammonium-sulfate-precipitation-ar-1)"/><line x1="62" y1="464" x2="80" y2="464" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6" marker-end="url(#ammonium-sulfate-precipitation-ar-1)"/><text x="96" y="442" font-weight="700">⑤ 펠릿을 소량 완충액에</text><text x="96" y="464">녹여 투석(또는 탈염 컬럼)</text><text x="96" y="486">→ 염 이온이 바깥으로 빠짐</text><line x1="16" y1="514" x2="344" y2="514" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="20" y="536" font-size="14" font-weight="700">염석(salting-out) 원리</text><circle cx="64" cy="590" r="15" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><circle cx="64" cy="590" r="27" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" stroke-dasharray="3 3"/><text x="74" y="638" text-anchor="middle">염 적음: 수화층 두꺼움</text><line x1="116" y1="590" x2="190" y2="590" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#ammonium-sulfate-precipitation-ar)"/><text x="153" y="580" text-anchor="middle" font-weight="700">염 증가</text><circle cx="262" cy="590" r="15" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><circle cx="293" cy="590" r="15" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8"/><circle cx="277" cy="590" r="33" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" stroke-dasharray="3 3"/><text x="250" y="638" text-anchor="middle">수화층 얇아져 뭉침</text><rect x="16" y="652" width="328" height="92" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.2"/><text x="28" y="674" font-size="14" font-weight="700">V<tspan dy="0.217em" font-size="92%">첨가</tspan><tspan dy="-0.2em"> = V × (S</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> − S</tspan><tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">) ÷ (1 − S</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">)</tspan></text><text x="28" y="700">V: 첨가 전 부피, S: 포화도(0~1로 표기)</text><text x="28" y="722">0 °C에서 100% 포화 = 3.9 M</text></svg>
