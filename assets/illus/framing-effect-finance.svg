<svg class="si si-illus" viewBox="0 0 360 740" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="프레이밍 효과: 손실 회피와 표현에 따른 선택률" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="framing-effect-finance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="10" y="18" font-weight="700">전망 이론의 가치함수</text><line x1="20" y1="150" x2="346" y2="150" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#framing-effect-finance-ar)"/><line x1="180" y1="262" x2="180" y2="34" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#framing-effect-finance-ar)"/><path d="M180,150 C181.2,146.3 183.5,134.1 187,127.6 C190.5,121.2 195.2,116.7 201,111.3 C206.8,105.9 213.8,100.6 222,95.2 C230.2,89.9 239.5,84.6 250,79.3 C260.5,74 273.3,68.3 285,63.4 C296.7,58.5 314.2,52.2 320,50" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><path d="M180,150 C179.3,153.7 177.7,164.8 176,172 C174.3,179.2 172.7,186 170,193 C167.3,200 164.5,207.2 160,214 C155.5,220.8 151.3,228 143,234 C134.7,240 115.5,247.3 110,250" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="320" y1="50" x2="180" y2="50" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="110" y1="250" x2="180" y2="250" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.4" stroke-dasharray="5 3"/><circle cx="320" cy="50" r="5" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.6"/><circle cx="110" cy="250" r="5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><line x1="166" y1="150" x2="166" y2="50" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#framing-effect-finance-ar)" marker-start="url(#framing-effect-finance-ar)"/><line x1="166" y1="150" x2="166" y2="250" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#framing-effect-finance-ar)" marker-start="url(#framing-effect-finance-ar)"/><text x="24" y="130" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">손실</text><text x="300" y="172" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">이득</text><text x="186" y="22" font-weight="700">주관적 가치</text><text x="190" y="172">참조점</text><text x="272" y="40" font-weight="700" style="fill:var(--si-green-s,#5b9b83)">+2,000달러</text><text x="20" y="258" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">−1,000달러</text><text x="180" y="292" text-anchor="middle" font-weight="700">점선 높이가 같다: −1,000달러의 고통 ≈</text><text x="180" y="314" text-anchor="middle" font-weight="700">+2,000달러의 기쁨 → 손실 회피 약 2배</text><rect x="20" y="340" width="14" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="40" y="352">이득·긍정 틀</text><rect x="190" y="340" width="14" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="210" y="352">손실·강조 틀</text><text x="20" y="388" font-weight="700">① 질병 시나리오 (600명)</text><text x="20" y="414">‘200명을 구한다’ → A 선택 72%</text><rect x="20" y="420" width="201.6" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="20" y="454">‘400명이 죽는다’ → B 선택 78%</text><rect x="20" y="460" width="218.4" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="20" y="496" font-weight="700">② 박사과정 조기 등록</text><text x="20" y="522">조기 할인 강조 → 등록 67%</text><rect x="20" y="528" width="187.6" height="14" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="20" y="562">연체료 강조 → 등록 93%</text><rect x="20" y="568" width="260.4" height="14" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="20" y="604" font-weight="700">③ 자동 저축 (같은 금액, 단위만 다름)</text><text x="20" y="630">월 150달러 입금 → 가입 7%</text><rect x="20" y="636" width="19.6" height="14" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="20" y="670">하루 5달러 입금 → 가입 30%</text><rect x="20" y="676" width="84" height="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="180" y="722" text-anchor="middle" font-weight="700">내용은 같고 표현만 다르다 → 선택률이 갈린다</text></svg>
