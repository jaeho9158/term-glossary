<svg class="si si-illus" viewBox="0 0 360 722" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="바이오에탄올 생산: 발효의 질량 흐름과 수율 상한" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="bioethanol-production-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="bioethanol-production-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><rect x="6" y="14" width="78" height="32" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="1"/><text x="45" y="35" text-anchor="middle">전처리</text><line x1="85" y1="30" x2="95" y2="30" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#bioethanol-production-ar)"/><rect x="96" y="14" width="78" height="32" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="1"/><text x="135" y="35" text-anchor="middle">당화</text><line x1="175" y1="30" x2="185" y2="30" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#bioethanol-production-ar)"/><rect x="186" y="14" width="78" height="32" rx="6" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="2.4" fill-opacity="0.25"/><text x="225" y="35" text-anchor="middle" font-weight="700">발효</text><line x1="265" y1="30" x2="275" y2="30" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#bioethanol-production-ar)"/><rect x="276" y="14" width="78" height="32" rx="6" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="1"/><text x="315" y="35" text-anchor="middle">증류·탈수</text><text x="135" y="70" text-anchor="middle">셀룰라아제</text><text x="135" y="90" text-anchor="middle">약 50 °C, pH 5</text><text x="135" y="124" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">효소 비용:</text><text x="135" y="144" text-anchor="middle" font-weight="700" style="fill:var(--si-limit,#7d2626)">생산비의 20~40%</text><line x1="225" y1="50" x2="225" y2="174" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#bioethanol-production-ar-1)"/><rect x="12" y="176" width="336" height="316" rx="8" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="1.4"/><text x="26" y="200" font-weight="700" style="fill:var(--si-accent,#2454ff)">발효 단계의 질량 흐름</text><text x="28" y="240" font-weight="700">포도당 180 g</text><rect x="28" y="252" width="40" height="180" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="48" y="454" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">C<tspan dy="0.217em" font-size="92%">6</tspan><tspan dy="-0.2em">H</tspan><tspan dy="0.217em" font-size="92%">12</tspan><tspan dy="-0.2em">O</tspan><tspan dy="0.217em" font-size="92%">6</tspan></text><path d="M68,252 C140,252 170,224 250,224 L250,312 C170,312 140,340 68,340 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><path d="M68,340 L250,340 L250,432 L68,432 Z" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.8" fill-opacity="0.3"/><circle cx="204" cy="208" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><circle cx="222" cy="194" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><circle cx="240" cy="206" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><circle cx="186" cy="216" r="4" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.4"/><text x="260" y="262" font-weight="700" style="fill:var(--si-general,#5c6b7f)">2 CO<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="260" y="284" style="fill:var(--si-general,#5c6b7f)">기포로 빠짐</text><text x="260" y="374" font-weight="700" style="fill:var(--si-accent,#2454ff)">에탄올</text><text x="260" y="394" style="fill:var(--si-accent,#2454ff)">2 C<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">H</tspan><tspan dy="0.217em" font-size="92%">5</tspan><tspan dy="-0.2em">OH</tspan></text><text x="260" y="420" font-weight="700" style="fill:var(--si-accent,#2454ff)">92 g</text><text x="180" y="478" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--si-accent,#2454ff)">이론 수율 ≈ 0.51 g/g</text><text x="180" y="524" text-anchor="middle">질량의 거의 절반이 CO<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">로 빠져서</tspan></text><text x="180" y="552" text-anchor="middle" font-weight="700">수율 상한이 0.51이다</text><line x1="20" y1="566" x2="340" y2="566" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1" opacity="0.6"/><text x="20" y="594" font-weight="700">옥수숫대 가수분해물의 당 구성</text><path d="M62,662 L62,622 A40 40 0 0 1 100.04,674.36 Z" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="1.6" fill-opacity="0.5"/><path d="M62,662 L100.04,674.36 A40 40 0 1 1 62,622 Z" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><text x="120" y="636" font-weight="700" style="fill:var(--si-accent,#2454ff)">자일로스 약 30%</text><text x="120" y="656" style="fill:var(--si-general,#5c6b7f)">옥수숫대 가수분해물의</text><text x="120" y="676" style="fill:var(--si-general,#5c6b7f)">발효 가능한 당 중</text></svg>
