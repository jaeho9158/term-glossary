<svg class="si si-illus" viewBox="0 0 360 606" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일반화가능도 이론: G연구 분산 성분과 D연구 계수" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="generalizability-theory-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="26" font-weight="700">G연구: 분산 성분 비율</text><rect x="20" y="62" width="187.7" height="28" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.4" fill-opacity="0.5"/><rect x="207.7" y="62" width="19.7" height="28" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.4" fill-opacity="0.5"/><rect x="227.4" y="62" width="112.6" height="28" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.5"/><text x="113.8" y="81" text-anchor="middle" font-weight="700">3.333</text><text x="283.7" y="81" text-anchor="middle" font-weight="700">2.0</text><text x="113.8" y="54" text-anchor="middle">σ²<tspan dy="0.217em" font-size="92%">p</tspan><tspan dy="-0.2em"> (사람)</tspan></text><text x="283.7" y="54" text-anchor="middle">σ²<tspan dy="0.217em" font-size="92%">pr,e</tspan><tspan dy="-0.2em"> (잔차)</tspan></text><line x1="217.5" y1="92" x2="217.5" y2="104" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.4"/><text x="217.5" y="122" text-anchor="middle" style="fill:var(--si-amber-s,#d79a2b)">σ²<tspan dy="0.217em" font-size="92%">r</tspan><tspan dy="-0.2em"> (평가자) 0.350</tspan></text><text x="20" y="160" font-weight="700">D연구: 평가자 수 n′에 따른 계수</text><line x1="64" y1="380" x2="344" y2="380" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#generalizability-theory-ar)"/><line x1="64" y1="380" x2="64" y2="186" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#generalizability-theory-ar)"/><line x1="112" y1="380" x2="112" y2="385" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="112" y="402" text-anchor="middle">1</text><line x1="202" y1="380" x2="202" y2="385" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="202" y="402" text-anchor="middle">3</text><line x1="292" y1="380" x2="292" y2="385" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="292" y="402" text-anchor="middle">5</text><text x="344" y="402" text-anchor="end">n′</text><text x="56" y="384" text-anchor="end">0.5</text><text x="56" y="200" text-anchor="end">1.0</text><text x="74" y="198" style="fill:var(--si-general,#5c6b7f)">계수</text><polygon points="112,334 202,257.5 292,235.4 292,241.6 202,265.9 112,348" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0" fill-opacity="0.3"/><polyline points="112,334 202,257.5 292,235.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="6 4"/><polyline points="112,348 202,265.9 292,241.6" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><circle cx="112" cy="334" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><text x="104" y="327" text-anchor="end" style="fill:var(--si-blue-s,#7f9ac0)">.625</text><circle cx="202" cy="257.5" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><text x="194" y="250.5" text-anchor="end" style="fill:var(--si-blue-s,#7f9ac0)">.833</text><circle cx="292" cy="235.4" r="4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><text x="284" y="228.4" text-anchor="end" style="fill:var(--si-blue-s,#7f9ac0)">.893</text><circle cx="112" cy="348" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="120" y="367" style="fill:var(--si-rose-s,#c97b7b)">.587</text><circle cx="202" cy="265.9" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="210" y="284.9" style="fill:var(--si-rose-s,#c97b7b)">.810</text><circle cx="292" cy="241.6" r="4" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><text x="300" y="260.6" style="fill:var(--si-rose-s,#c97b7b)">.876</text><line x1="210" y1="340" x2="236" y2="340" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="242" y="345" style="fill:var(--si-blue-s,#7f9ac0)">Eρ² 상대 서열</text><line x1="210" y1="364" x2="236" y2="364" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2"/><text x="242" y="369" style="fill:var(--si-rose-s,#c97b7b)">Φ 절대 기준</text><text x="20" y="432" style="fill:var(--si-amber-s,#d79a2b)">음영: σ²<tspan dy="0.217em" font-size="92%">r</tspan><tspan dy="-0.2em">의 기여분. Φ는 평가자 엄격도</tspan></text><text x="20" y="468" style="fill:var(--si-amber-s,#d79a2b)">차이 σ²<tspan dy="0.217em" font-size="92%">r</tspan><tspan dy="-0.2em">까지 오차로 포함한다</tspan></text><text x="20" y="512">Eρ² = σ²<tspan dy="0.217em" font-size="92%">p</tspan><tspan dy="-0.2em"> ÷ (σ²</tspan><tspan dy="0.217em" font-size="92%">p</tspan><tspan dy="-0.2em"> + σ²</tspan><tspan dy="0.217em" font-size="92%">pr,e</tspan><tspan dy="-0.2em"> ÷ n′)</tspan></text><text x="20" y="546">Φ = σ²<tspan dy="0.217em" font-size="92%">p</tspan><tspan dy="-0.2em"> ÷ (σ²</tspan><tspan dy="0.217em" font-size="92%">p</tspan><tspan dy="-0.2em"> + (σ²</tspan><tspan dy="0.217em" font-size="92%">r</tspan><tspan dy="-0.2em"> + σ²</tspan><tspan dy="0.217em" font-size="92%">pr,e</tspan><tspan dy="-0.2em">) ÷ n′)</tspan></text><text x="20" y="590" style="fill:var(--si-general,#5c6b7f)">평가자를 늘리면 계수가 오르되 증가폭은 줄어든다</text></svg>
