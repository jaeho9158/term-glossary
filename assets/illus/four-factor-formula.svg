<svg class="si si-illus" viewBox="0 0 360 454" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="four-factor-formula-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="four-factor-formula-t">사인자공식: 한 세대 동안 중성자 수에 네 인자를 차례로 곱한다</title><defs><marker id="four-factor-formula-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-general,#5c6b7f)"/></marker></defs><text x="180" y="32" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">위: 고속 에너지 · 아래: 열에너지</text><line x1="98" y1="84" x2="262" y2="84" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="9"/><line x1="290" y1="98" x2="290" y2="290" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="7"/><line x1="262" y1="304" x2="98" y2="304" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="5"/><line x1="70" y1="290" x2="70" y2="98" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="9"/><polygon points="236,84 220,93 220,75" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="0.5"/><polygon points="290,194 282,180 298,180" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0.5"/><polygon points="124,304 136,297 136,311" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="0.5"/><polygon points="70,194 79,210 61,210" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="0.5"/><rect x="42" y="70" width="56" height="28" rx="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="70" y="89" text-anchor="middle" font-weight="700" font-style="italic">N</text><rect x="262" y="70" width="56" height="28" rx="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="290" y="89" text-anchor="middle" font-weight="700" font-style="italic">εN</text><rect x="262" y="290" width="56" height="28" rx="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="290" y="309" text-anchor="middle" font-weight="700" font-style="italic">εpN</text><rect x="42" y="290" width="56" height="28" rx="6" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="1.6"/><text x="70" y="309" text-anchor="middle" font-weight="700" font-style="italic">εpfN</text><text x="180" y="64" text-anchor="middle" font-weight="700" font-style="italic" style="fill:var(--si-amber-t,#7a5210)">ε</text><text x="304" y="150" font-weight="700" font-style="italic" style="fill:var(--si-blue-t,#12305c)">p</text><text x="180" y="330" text-anchor="middle" font-weight="700" font-style="italic" style="fill:var(--si-green-t,#14543c)">f</text><text x="54" y="150" text-anchor="end" font-weight="700" font-style="italic" style="fill:var(--si-violet-t,#3f2f6b)">η</text><line x1="296" y1="206" x2="326" y2="230" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#four-factor-formula-ar)"/><text x="350" y="252" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">공명흡수</text><line x1="236" y1="310" x2="236" y2="340" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.8" marker-end="url(#four-factor-formula-ar)"/><text x="236" y="362" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">비연료 흡수</text><text x="104" y="124">ε 고속핵분열인자</text><text x="104" y="144">p 공명이탈확률</text><text x="104" y="164">f 열중성자이용률</text><text x="104" y="184">η 재생인자</text><text x="104" y="226" font-size="15" font-weight="700" font-style="italic">k<tspan dy="0.217em" font-size="92%">∞</tspan><tspan dy="-0.2em"> = ηεpf</tspan></text><text x="104" y="250" font-style="italic">= ηεpfN ÷ N</text><text x="20" y="396" style="fill:var(--si-general,#5c6b7f)">굵기는 중성자 수를 뜻하는 모식이다</text><text x="20" y="416" sty