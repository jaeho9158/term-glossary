<svg class="si si-illus" viewBox="0 0 360 756" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fire-tetrahedron-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="fire-tetrahedron-t">화재사면체: 한 면만 빠져도 연소가 무너진다</title><defs><marker id="fire-tetrahedron-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="10" y="22" font-size="14" font-weight="700">연소가 계속되는 사면체</text><polygon points="46,202 221,222 156,102" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2.2" stroke-dasharray="5 4" fill-opacity="0.7"/><polygon points="135,160 40,190 215,210" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><polygon points="135,160 40,190 150,90" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><polygon points="135,160 215,210 150,90" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><path d="M150,92 C136,82 138,64 150,48 C153,62 166,68 162,84 C160,90 155,92 150,92 Z" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><path d="M150,90 C144,84 146,76 150,68 C156,76 156,84 150,90Z" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4"/><text x="10" y="128" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">열</text><line x1="22" y1="132" x2="88" y2="150" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.2"/><circle cx="88" cy="150" r="2.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="10" y="262" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">가연물</text><line x1="48" y1="252" x2="120" y2="215" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.2"/><circle cx="120" cy="215" r="2.5" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6"/><text x="246" y="140" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">산소</text><line x1="244" y1="136" x2="180" y2="160" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2"/><circle cx="180" cy="160" r="2.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="236" y="258" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">연쇄반응</text><line x1="250" y1="244" x2="196" y2="222" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.2"/><circle cx="196" cy="222" r="2.5" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><text x="10" y="292" style="fill:var(--si-general,#5c6b7f)">네 요소가 모두 있어야 연소가 지속된다</text><text x="10" y="322" font-size="14" font-weight="700">한 면을 없애면 연소가 멈춘다</text><polygon points="46,492 221,512 156,392" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="2.2" stroke-dasharray="5 4" fill-opacity="0.7"/><polygon points="135,450 40,480 215,500" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><polygon points="135,450 40,480 150,380" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="2"/><polygon points="235,444 315,494 250,374" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2" stroke-dasharray="5 4" fill-opacity="0.55"/><line x1="165" y1="444" x2="213" y2="444" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.6" marker-end="url(#fire-tetrahedron-ar)"/><polygon points="135,450 215,500 150,380" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.6" stroke-dasharray="4 4"/><text x="272" y="392" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">산소</text><text x="10" y="562" font-weight="700">한 면 제거 → 연소 중단</text><text x="10" y="600" font-size="14" font-weight="700">요소별 소화법</text><rect x="10" y="618" width="20" height="16" rx="3" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6"/><text x="40" y="631" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">가연물</text><text x="112" y="631">→  제거소화</text><rect x="10" y="644" width="20" height="16" rx="3" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="40" y="657" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">산소</text><text x="112" y="657">→  질식소화</text><rect x="10" y="670" width="20" height="16" rx="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="40" y="683" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">열</text><text x="112" y="683">→  냉각소화</text><rect x="10" y="696" width="20" height="16" rx="3" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6" stroke-dasharray="4 3"/><text x="40" y="709" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">연쇄반응</text><text x="112" y="709">→  억제소화(라디칼 차단)</text><text x="10" y="738" style="fill:var(--si-violet-s,#9382bd)">점선 테두리: 삼각형 모델에 추가된 넷째 요소</text></svg>
