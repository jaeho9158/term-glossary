700">4.2 K</text><text x="140" y="190" style="fill:var(--si-general,#5c6b7f)">He-4 욕조</text><rect x="30" y="216" width="100" height="10" rx="2" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.4" fill-opacity="0.5"/><text x="140" y="222" font-weight="700">약 1 K</text><text x="140" y="242" style="fill:var(--si-general,#5c6b7f)">1K 포트</text><line x1="80" y1="70" x2="80" y2="100" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><line x1="80" y1="122" x2="80" y2="152" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><line x1="80" y1="174" x2="80" y2="204" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><line x1="80" y1="226" x2="80" y2="254" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><rect x="44" y="254" width="72" height="32" rx="6" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.6" fill-opacity="0.25"/><text x="80" y="275" text-anchor="middle">증류기</text><line x1="80" y1="286" x2="80" y2="306" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><rect x="44" y="306" width="72" height="26" rx="6" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6" fill-opacity="0.2"/><text x="80" y="324" text-anchor="middle">열교환기</text><line x1="80" y1="332" x2="80" y2="352" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2"/><rect x="26" y="352" width="108" height="34" rx="3" style="stroke:currentColor;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.3"/><rect x="26" y="386" width="108" height="44" rx="6" style="stroke:currentColor;fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6" fill-opacity="0.28"/><line x1="26" y1="386" x2="134" y2="386" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="4"/><line x1="62" y1="360" x2="62" y2="410" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.4" marker-end="url(#dilution-refrigerator-ar)"/><text x="76" y="404" font-weight="700" style="fill:var(--si-navy,#12305c)">흡열</text><text x="146" y="366" style="fill:var(--si-rose-t,#7d2626)">농축상: 거의 순수 ³He</text><text x="146" y="388" font-weight="700" style="fill:var(--si-navy,#12305c)">상분리 경계</text><text x="146" y="410" style="fill:var(--si-blue-t,#12305c)">희석상: ³He 약 6.6%</text><text x="146" y="430" style="fill:var(--si-blue-t,#12305c)">⁴He 약 93.4%</text><text x="80" y="454" text-anchor="middle" font-weight="700">혼합실 10 mK</text><polyline points="116,270 270,270 270,48" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="270" y1="110" x2="270" y2="96" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#dilution-refrigerator-ar-1)"/><polyline points="326,48 326,320 116,320" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><line x1="326" y1="150" x2="326" y2="164" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#dilution-refrigerator-ar-2)"/><polyline points="26,408 12,408 12,270 44,270" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><line x1="12" y1="330" x2="12" y2="300" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#dilution-refrigerator-ar-1)"/><text x="14" y="490">상분리: 약 870 mK 이하에서 일어남</text><text x="14" y="510">도달 최저: 약 2 mK</text><text x="14" y="534" font-weight="700">300 K ÷ 0.010 K = 30,000배 낮은 온도</text><line x1="14" y1="568" x2="50" y2="568" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3"/><text x="58" y="573">증발한 ³He가 펌프로</text><line x1="14" y1="588" x2="50" y2="588" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><text x="58" y="593">돌아오는 ³He (약 3 K로 유입)</text><text x="14" y="624" style="fill:var(--si-general,#5c6b7f)">무냉매형은 예비 냉각단을 펄스관</text><text x="14" y="644" style="fill:var(--si-general,#5c6b7f)">냉각기로 대체한다.</text></svg>
