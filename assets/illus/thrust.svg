<svg class="si si-illus" viewBox="0 0 520 310" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thrust-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="thrust-t">노즐에서 나오는 배기와 추력</title><defs><marker id="thrust-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="thrust-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><polygon points="60,80 150,80 185,122 320,50 320,230 185,158 150,200 60,200" style="stroke:currentColor;fill:var(--si-gray-s,#aab6c6)" stroke-width="2.2" fill-opacity="0.18"/><text x="105" y="140" text-anchor="middle" font-size="12">고온·고압 가스</text><line x1="320" y1="140" x2="420" y2="140" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#thrust-ar)"/><text x="420" y="126" text-anchor="middle" font-size="12">배기 속도 v<tspan baseline-shift="sub" font-size="72%">e</tspan></text><line x1="320" y1="50" x2="320" y2="230" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="312" y="244" text-anchor="middle" font-size="11">노즐 출구 면적 A<tspan baseline-shift="sub" font-size="72%">e</tspan>, 출구 압력 p<tspan baseline-shift="sub" font-size="72%">e</tspan></text><line x1="60" y1="140" x2="20" y2="140" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#thrust-ar-1)"/><text x="40" y="122" text-anchor="middle">추력 F</text><text x="440" y="205" text-anchor="middle" font-size="12">주변 대기 p<tspan baseline-shift="sub" font-size="72%">a</tspan></text><text x="60" y="262" font-size="14">F = ṁ v<tspan baseline-shift="sub" font-size="72%">e</tspan> + (p<tspan baseline-shift="sub" font-size="72%">e</tspan> − p<tspan baseline-shift="sub" font-size="72%">a</tspan>) A<tspan baseline-shift="sub" font-size="72%">e</tspan></text><text x="60" y="294" font-size="11">가상 예: ṁ = 100 kg/s, v<tspan baseline-shift="sub" font-size="72%">e</tspan> = 2,500 m/s, p<tspan baseline-shift="sub" font-size="72%">e</tspan> = p<tspan baseline-shift="sub" font-size="72%">a</tspan> → F = 250 kN</text></svg>
