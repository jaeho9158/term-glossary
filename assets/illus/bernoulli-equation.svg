" y="350">압력수두 </text><text x="99.3" y="343.8" text-anchor="middle" font-size="10.4">p</text><line x1="91.4" y1="345.8" x2="107.3" y2="345.8" style="stroke:currentColor" stroke-width="0.8"/><text x="99.3" y="354.8" text-anchor="middle" font-size="10.4">ρg</text></g><rect x="10" y="362" width="16" height="16" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><g class="si-rich" font-size="13" ><text x="34" y="374">속도수두 </text><text x="99.3" y="367.8" text-anchor="middle" font-size="10.4">v²</text><line x1="91.4" y1="369.8" x2="107.3" y2="369.8" style="stroke:currentColor" stroke-width="0.8"/><text x="99.3" y="378.8" text-anchor="middle" font-size="10.4">2g</text></g><text x="10" y="416" style="fill:var(--si-limit,#7d2626)">지점 2는 관이 좁아 v가 크고 z도 높아,</text><g class="si-rich" font-size="13"  style="fill:var(--si-limit,#7d2626)"><text x="10" y="440">그만큼 </text><text x="62.3" y="433.8" text-anchor="middle" font-size="10.4">p</text><line x1="54.4" y1="435.8" x2="70.3" y2="435.8" style="stroke:var(--si-limit,#7d2626)" stroke-width="0.8"/><text x="62.3" y="444.8" text-anchor="middle" font-size="10.4">ρg</text><text x="71.8" y="440">가 줄어든다.</text></g><text x="10" y="476" font-weight="700">p + ½ρv² + ρgz = 일정</text><text x="10" y="500" style="fill:var(--si-general,#5c6b7f)">정상류·비압축성·비점성, 한 유선 위에서 성립</text></svg>
