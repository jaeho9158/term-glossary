<svg class="si si-illus" viewBox="0 0 360 952" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="desert-climate-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="desert-climate-t">사막 기후(BW): 기온에 따라 달라지는 건조 임계값</title><defs></defs><text x="14" y="22" font-weight="700">기온과 연강수량으로 보는 건조 기후 판정</text><text x="14" y="46" style="fill:var(--si-general,#5c6b7f)">연강수량 (mm)</text><polygon points="74,500 214.4,500 214.4,410" style="stroke:none;fill:var(--si-violet-f,#eae4f4)" stroke-width="0"/><polygon points="214.4,500 292.4,500 292.4,360 214.4,410" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="0"/><polygon points="74,500 292.4,360 292.4,220" style="stroke:none;fill:var(--si-gray-f,#eef1f6)" stroke-width="0"/><line x1="74" y1="500" x2="298.4" y2="500" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="74" y1="500" x2="74" y2="50" style="stroke:currentColor;fill:none" stroke-width="1.8"/><line x1="74" y1="500" x2="74" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="74" y="520" text-anchor="middle">0</text><line x1="113" y1="500" x2="113" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="113" y="520" text-anchor="middle">5</text><line x1="152" y1="500" x2="152" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="152" y="520" text-anchor="middle">10</text><line x1="191" y1="500" x2="191" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="191" y="520" text-anchor="middle">15</text><line x1="230" y1="500" x2="230" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="230" y="520" text-anchor="middle">20</text><line x1="269" y1="500" x2="269" y2="504" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="269" y="520" text-anchor="middle">25</text><line x1="70" y1="400" x2="74" y2="400" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="58" y="404" text-anchor="end">200</text><line x1="70" y1="300" x2="74" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="58" y="304" text-anchor="end">400</text><line x1="70" y1="200" x2="74" y2="200" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="58" y="204" text-anchor="end">600</text><line x1="70" y1="100" x2="74" y2="100" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="58" y="104" text-anchor="end">800</text><text x="298.4" y="564" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">연평균기온 (℃)</text><line x1="74" y1="360" x2="292.4" y2="80" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" opacity="0.55"/><text x="298.4" y="84" font-weight="400" style="fill:var(--si-navy,#12305c)">c=280</text><line x1="74" y1="430" x2="292.4" y2="150" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="1.6" opacity="0.55"/><text x="298.4" y="154" font-weight="400" style="fill:var(--si-navy,#12305c)">c=140</text><line x1="74" y1="500" x2="292.4" y2="220" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2.8" opacity="1"/><text x="298.4" y="224" font-weight="700" style="fill:var(--si-navy,#12305c)">c=0</text><line x1="74" y1="500" x2="292.4" y2="360" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="298.4" y="364" style="fill:var(--si-navy,#12305c)">절반</text><line x1="214.4" y1="500" x2="214.4" y2="410" style="stroke:currentColor;fill:none" stroke-width="1.6" stroke-dasharray="3 3"/><text x="214.4" y="542" text-anchor="middle" font-weight="700">18℃</text><text x="138" y="474" font-weight="700" style="fill:var(--si-violet-s,#9382bd)">BWk</text><text x="138" y="494" style="fill:var(--si-violet-s,#9382bd)">차가운 사막</text><text x="226.9" y="454" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">BWh</text><text x="226.9" y="474" style="fill:var(--si-rose-s,#c97b7b)">뜨거운</text><text x="226.9" y="494" style="fill:var(--si-rose-s,#c97b7b)">사막</text><text x="250.3" y="350" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">스텝 BS</text><rect x="63" y="400" width="6" height="87.5" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="0"/><circle cx="66" cy="285" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="14" y="604" font-weight="700">임계값 = 연평균기온(℃) × 20 + c</text><text x="14" y="624" style="fill:var(--si-general,#5c6b7f)">실선: c별 임계값 (c = 0은 굵은 선)</text><text x="14" y="644" style="fill:var(--si-general,#5c6b7f)">c는 태양고도가 높은 반년에 내리는</text><text x="14" y="664" style="fill:var(--si-general,#5c6b7f)">연강수량 비중으로 정한다.</text><text x="14" y="684">c = 280: 70% 이상</text><text x="14" y="704">c = 140: 30~70%</text><text x="14" y="724">c = 0: 30% 미만</text><text x="14" y="754" font-weight="700">연강수량이 임계값의 절반 미만 → 사막 BW</text><text x="14" y="774">절반~임계값 → 스텝 BS</text><text x="14" y="794" style="fill:var(--si-general,#5c6b7f)">점선: c = 0일 때 임계값의 절반</text><text x="14" y="814" style="fill:var(--si-general,#5c6b7f)">색 영역은 c = 0 기준이다.</text><rect x="14" y="833" width="6" height="13" style="stroke:none;fill:var(--si-amber-s,#d79a2b)" stroke-width="0"/><text x="28" y="844" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">왼쪽 노랑 띠: 사막·건조 지역의</text><text x="14" y="864" font-weight="700" style="fill:var(--si-amber-s,#d79a2b)">연강수량은 대개 25~200 mm</text><circle cx="17" cy="880" r="4.5" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><text x="28" y="884" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">왼쪽 빨간 점: 약 430 mm. 증발산이</text><text x="14" y="904" style="fill:var(--si-rose-s,#c97b7b)">매우 큰 일부 지역은 이 정도도</text><text x="14" y="924" style="fill:var(--si-rose-s,#c97b7b)">건조로 분류한다.</text></svg>
