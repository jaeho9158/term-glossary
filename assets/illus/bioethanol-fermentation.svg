"2"/><circle cx="86" cy="210" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="274" cy="210" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="296" cy="210" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="158" cy="210" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2" stroke-dasharray="3 2"/><circle cx="202" cy="210" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2" stroke-dasharray="3 2"/><text x="158" y="236" text-anchor="middle" font-weight="700">CO<tspan baseline-shift="sub" font-size="92%">2</tspan></text><text x="202" y="236" text-anchor="middle" font-weight="700">CO<tspan baseline-shift="sub" font-size="92%">2</tspan></text><text x="75" y="236" text-anchor="middle">아세트알데하이드</text><text x="285" y="236" text-anchor="middle">아세트알데하이드</text><line x1="75" y1="246" x2="75" y2="282" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.2" marker-end="url(#bioethanol-fermentation-ar)"/><line x1="285" y1="246" x2="285" y2="282" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.2" marker-end="url(#bioethanol-fermentation-ar-1)"/><text x="96" y="268">알코올 탈수소효소</text><circle cx="64" cy="296" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="86" cy="296" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><circle cx="274" cy="296" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><circle cx="296" cy="296" r="9" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="75" y="322" text-anchor="middle" font-weight="700">에탄올</text><text x="75" y="342" text-anchor="middle">C<tspan baseline-shift="sub" font-size="92%">2</tspan>H<tspan baseline-shift="sub" font-size="92%">5</tspan>OH</text><text x="285" y="322" text-anchor="middle" font-weight="700">에탄올</text><text x="285" y="342" text-anchor="middle">C<tspan baseline-shift="sub" font-size="92%">2</tspan>H<tspan baseline-shift="sub" font-size="92%">5</tspan>OH</text><text x="180" y="388" text-anchor="middle" font-weight="700">C<tspan baseline-shift="sub" font-size="92%">6</tspan>H<tspan baseline-shift="sub" font-size="92%">12</tspan>O<tspan baseline-shift="sub" font-size="92%">6</tspan> + 2 ADP + 2 Pi</text><text x="180" y="412" text-anchor="middle" font-size="14" font-weight="700">→ 2 C<tspan baseline-shift="sub" font-size="92%">2</tspan>H<tspan baseline-shift="sub" font-size="92%">5</tspan>OH + 2 CO<tspan baseline-shift="sub" font-size="92%">2</tspan> + 2 ATP</text><text x="180" y="442" text-anchor="middle">글루코스 : 에탄올 : CO<tspan baseline-shift="sub" font-size="92%">2</tspan> : ATP = 1 : 2 : 2 : 2(몰)</text><text x="180" y="468" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">탄소 6개 = 2×2(에탄올) + 2(CO<tspan baseline-shift="sub" font-size="92%">2</tspan>)</text><text x="180" y="498" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">섬유소 원료는 먼저 효소 가수분해(약 50도, pH 5)로</text><text x="180" y="518" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">당을 얻는다.</text></svg>
