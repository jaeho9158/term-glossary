" y="46" text-anchor="middle" font-weight="700" style="fill:var(--si-general,#5c6b7f)">y = f(x)</text><text x="300" y="26" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">기준 곡선</text><text x="60" y="46" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">y = f(−x)</text><text x="300" y="294" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">y = −f(x)</text><text x="60" y="294" text-anchor="middle" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">y = −f(−x)</text><text x="60" y="26" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">y축 대칭</text><text x="300" y="314" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">x축 대칭</text><text x="60" y="314" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">원점 대칭</text><text x="180" y="346" text-anchor="middle" font-weight="700">평행이동 y = f(x − p) + q</text><line x1="30" y1="480" x2="330" y2="480" style="stroke:currentColor;fill:none" stroke-width="1.4"/><line x1="60" y1="368" x2="60" y2="490" style="stroke:currentColor;fill:none" stroke-width="1.4"/><path d="M69,476.4 C71.1,471.6 77.1,457.8 81.6,447.6 C86.1,437.4 91.2,422.4 96,415.2 C100.8,408 105,403.8 110.4,404.4 C115.8,405 122.4,411.6 128.4,418.8 C134.4,426 139.8,438.6 146.4,447.6 C153,456.6 164.4,468.6 168,472.8" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="2.4"/><path d="M145,436.4 C147.1,431.6 153.1,417.8 157.6,407.6 C162.1,397.4 167.2,382.4 172,375.2 C176.8,368 181,363.8 186.4,364.4 C191.8,365 198.4,371.6 204.4,378.8 C210.4,386 215.8,398.6 222.4,407.6 C229,416.6 240.4,428.6 244,432.8" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4"/><circle cx="110.4" cy="404.4" r="3.5" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="0"/><circle cx="186.4" cy="364.4" r="3.5" style="stroke:var(--si-accent,#2454ff);fill:var(--si-accent,#2454ff)" stroke-width="0"/><line x1="110.4" y1="404.4" x2="183.4" y2="404.4" st