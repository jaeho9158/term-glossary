entColor;fill:none" stroke-width="2.4"/><polygon points="289.6,126.8 282.6,131.1 282.6,122.5" style="stroke:currentColor;fill:currentColor" stroke-width="1"/><polyline points="271.2,107 282.6,107" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><polygon points="289.6,107 282.6,111.4 282.6,102.7" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="297.6" y="148.8" font-weight="700">GZ</text><text x="297.6" y="110" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">G'Z</text><text x="251.5" y="129.8" text-anchor="end" font-weight="700" font-style="italic">G</text><text x="261.2" y="104" text-anchor="end" font-weight="700" font-style="italic" style="fill:var(--si-rose-s,#c97b7b)">G'</text><text x="299.6" y="73.3" font-weight="700" font-style="italic">M</text><polyline points="240,152 273,152" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.6"/><polygon points="280,152 273,156.3 273,147.7" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="90" y="20" text-anchor="middle" font-weight="700">직립</text><text x="258" y="20" text-anchor="middle" font-weight="700">경사 φ</text><line x1="14" y1="226" x2="44" y2="226" style="stroke:currentColor;fill:none" stroke-width="1.8"/><text x="52" y="231">GM: 원래 복원 여유</text><line x1="14" y1="250" x2="44" y2="250" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3.2"/><text x="52" y="255">G'M: 줄어든 실효 GM</text><line x1="20" y1="274" x2="44" y2="274" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2" marker-end="url(#free-surface-effect-ar)"/><text x="52" y="279">G→G': 자유표면 보정(FSC)만큼 상승</text><polyline points="14,300 37,300" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.2"/><polygon points="44,300 37,304.3 37,295.7" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1"/><text x="52" y="305">탱크 안: 액체가 낮은 쪽으로 쏠림</text><text x="14" y="340" font-weight="700">GZ = GM · sin φ (복원팔)</text><text x="14" y="362">G'Z가 GZ보다 짧아 복원 능력이 줄어든다</text><text x="14" y="394" font-weight="700">칸막이와 자유표면 효과 (평면도)</text><text x="14" y="416">효과는 탱크 폭<tspan baseline-shift="super" font-size="92%">3</tspan>에 비례한다</text><rect x="14" y="432" width="96" height="48" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.2" fill-opacity="0.6"/><text x="62" y="504" text-anchor="middle" font-weight="700">칸막이 없음</text><text x="62" y="528" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">1</text><rect x="132" y="432" width="96" height="48" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.2" fill-opacity="0.6"/><line x1="132" y1="456" x2="228" y2="456" style="stroke:currentColor;fill:none" stroke-width="2.2"/><text x="180" y="504" text-anchor="middle" font-weight="700">격벽 1개</text><g class="si-rich" font-size="13"  font-weight="700" style="fill:var(--si-rose-s,#c97b7b)"><text x="180" y="521.8" text-anchor="middle" font-size="10.4">1</text><line x1="175.3" y1="523.8" x2="184.7" y2="523.8" style="stroke:var(--si-rose-s,#c97b7b)" stroke-width="0.8"/><text x="180" y="532.8" text-anchor="middle" font-size="10.4">4</text></g><rect x="250" y="432" width="96" height="48" style="stroke:currentColor;fill:var(--si-amber-f,#fdf0d8)" stroke-width="2.2" fill-opacity="0.6"/><line x1="250" y1="448" x2="346" y2="448" style="stroke:currentColor;fill:none" stroke-width="2.2"/><line x1="250" y1="464" x2="346" y2="464" style="stroke:currentColor;fill:none" stroke-width="2.2"/><text x="298" y="504" text-anchor="middle" font-weight="700">격벽 2개</text><g class="si-rich" font-size="13"  font-weight="700" style="fill:var(--si-rose-s,#c97b7b)"><text x="298" y="521.8" text-anchor="middle" font-size="10.4">1</text><line x1="293.3" y1="523.8" x2="302.7" y2="523.8" style="stroke:var(--si-rose-s,#c97b7b)" stroke-width="0.8"/><text x="298" y="532.8" text-anchor="middle" font-size="10.4">9