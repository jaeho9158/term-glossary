<svg class="si si-illus" viewBox="0 0 360 628" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diaphragm-structure-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="diaphragm-structure-t">다이아프램: 슬래브가 횡하중을 벽과 코어에 나눈다</title><defs><marker id="diaphragm-structure-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-green-s,#5b9b83)"/></marker><marker id="diaphragm-structure-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="14" y="24" font-weight="700">① 개구부가 작은 슬래브(평면도)</text><rect x="60" y="70" width="200" height="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><rect x="60" y="62" width="200" height="8" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.5"/><rect x="60" y="180" width="80" height="8" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.5"/><rect x="120" y="108" width="34" height="34" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.5"/><rect x="129" y="117" width="16" height="16" style="stroke:var(--si-navy,#12305c);fill:var(--si-bg,#ffffff)" stroke-width="1.5"/><text x="150" y="56" text-anchor="middle">전단벽</text><text x="137" y="162" text-anchor="middle">코어</text><text x="176" y="203">전단벽</text><line x1="318" y1="66" x2="264" y2="66" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3" marker-end="url(#diaphragm-structure-ar)"/><line x1="170" y1="189" x2="144" y2="189" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3" marker-end="url(#diaphragm-structure-ar)"/><line x1="220" y1="125" x2="156" y2="125" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3" marker-end="url(#diaphragm-structure-ar)"/><line x1="14" y1="100" x2="54" y2="100" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><line x1="14" y1="125" x2="54" y2="125" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><line x1="14" y1="150" x2="54" y2="150" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><line x1="14" y1="175" x2="54" y2="175" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><rect x="74" y="70" width="200" height="110" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="14" y="236" font-weight="700">슬래브는 모양을 유지한 채 이동(강체)</text><text x="14" y="258" style="fill:var(--si-green-s,#5b9b83)">초록 화살표: 강성에 비례한 분배</text><text x="14" y="280" style="fill:var(--si-amber-s,#d79a2b)">주황 화살표: 횡하중(지진력·풍하중)</text><text x="14" y="302" style="fill:var(--si-general,#5c6b7f)">점선: 하중을 받은 뒤의 슬래브 윤곽</text><text x="14" y="368" font-weight="700">② 큰 개구부(계단실·아트리움)가 있을 때</text><rect x="60" y="414" width="200" height="110" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><rect x="60" y="406" width="200" height="8" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.5"/><rect x="60" y="524" width="80" height="8" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.5"/><rect x="86" y="452" width="34" height="34" style="stroke:var(--si-navy,#12305c);fill:var(--si-gray-f,#eef1f6)" stroke-width="2.5"/><rect x="95" y="461" width="16" height="16" style="stroke:var(--si-navy,#12305c);fill:var(--si-bg,#ffffff)" stroke-width="1.5"/><rect x="170" y="444" width="72" height="60" style="stroke:var(--si-navy,#12305c);fill:var(--si-bg,#ffffff)" stroke-width="2"/><text x="150" y="400" text-anchor="middle">전단벽</text><text x="103" y="506" text-anchor="middle">코어</text><text x="176" y="547">전단벽</text><line x1="318" y1="410" x2="264" y2="410" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3" marker-end="url(#diaphragm-structure-ar)"/><line x1="170" y1="533" x2="144" y2="533" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3" marker-end="url(#diaphragm-structure-ar)"/><line x1="166" y1="469" x2="122" y2="469" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3" marker-end="url(#diaphragm-structure-ar)"/><line x1="14" y1="444" x2="54" y2="444" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><line x1="14" y1="469" x2="54" y2="469" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><line x1="14" y1="494" x2="54" y2="494" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><line x1="14" y1="519" x2="54" y2="519" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="2.5" marker-end="url(#diaphragm-structure-ar-1)"/><path d="M 74 414 Q 165 424 274 414 Q 262 469 274 524 Q 165 512 74 524 Z" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="2" stroke-dasharray="6 4"/><text x="206" y="436" text-anchor="middle">개구부</text><text x="14" y="580" font-weight="700">개구부 주변에서 국부 변형이 커진다</text><text x="14" y="602" style="fill:var(--si-rose-s,#c97b7b)">강체 가정이 깨져 유연 다이아프램으로 해석한다</text></svg>
