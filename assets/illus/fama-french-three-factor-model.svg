<svg class="si si-illus" viewBox="0 0 360 636" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="파마-프렌치 3요인 모형: SMB·HML을 만드는 6개 포트폴리오" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="14" y="24" font-weight="700">매년 6월 말 기준 6개 포트폴리오</text><text x="14" y="64" font-weight="700">① SMB: 규모 차이</text><text x="346" y="64" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">B/M 순위</text><text x="110.5" y="88" text-anchor="middle">하위 30%</text><text x="205" y="88" text-anchor="middle">중간 40%</text><text x="299.5" y="88" text-anchor="middle">상위 30%</text><text x="110.5" y="108" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">성장</text><text x="299.5" y="108" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">가치</text><rect x="70" y="118" width="81" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="1"/><text x="110.5" y="143" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">소형·성장</text><rect x="151" y="118" width="108" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="1"/><text x="205" y="143" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">소형·중간</text><rect x="259" y="118" width="81" height="40" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4" fill-opacity="1"/><text x="299.5" y="143" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">소형·가치</text><rect x="70" y="158" width="81" height="40" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4" fill-opacity="1"/><text x="110.5" y="183" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">대형·성장</text><rect x="151" y="158" width="108" height="40" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4" fill-opacity="1"/><text x="205" y="183" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">대형·중간</text><rect x="259" y="158" width="81" height="40" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4" fill-opacity="1"/><text x="299.5" y="183" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">대형·가치</text><text x="14" y="143" font-weight="700">소형</text><text x="14" y="183" font-weight="700">대형</text><text x="14" y="226" font-weight="700">SMB = 소형 3개 평균 − 대형 3개 평균</text><text x="14" y="268" font-weight="700">② HML: 가치 차이</text><text x="346" y="268" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">B/M 순위</text><text x="110.5" y="292" text-anchor="middle">하위 30%</text><text x="205" y="292" text-anchor="middle">중간 40%</text><text x="299.5" y="292" text-anchor="middle">상위 30%</text><text x="110.5" y="312" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">성장</text><text x="299.5" y="312" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">가치</text><rect x="70" y="322" width="81" height="40" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4" fill-opacity="1"/><text x="110.5" y="347" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">소형·성장</text><rect x="151" y="322" width="108" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.5"/><text x="205" y="347" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">소형·중간</text><rect x="259" y="322" width="81" height="40" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4" fill-opacity="1"/><text x="299.5" y="347" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">소형·가치</text><rect x="70" y="362" width="81" height="40" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.4" fill-opacity="1"/><text x="110.5" y="387" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">대형·성장</text><rect x="151" y="362" width="108" height="40" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.4" fill-opacity="0.5"/><text x="205" y="387" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">대형·중간</text><rect x="259" y="362" width="81" height="40" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.4" fill-opacity="1"/><text x="299.5" y="387" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">대형·가치</text><text x="14" y="347" font-weight="700">소형</text><text x="14" y="387" font-weight="700">대형</text><text x="14" y="430" font-weight="700">HML = B/M 높은 2개 평균</text><text x="14" y="450" font-weight="700">− B/M 낮은 2개 평균</text><text x="14" y="474" style="fill:var(--si-general,#5c6b7f)">가운데 열(중간 40%)은 HML 계산에 쓰지 않는다.</text><text x="14" y="514" font-weight="700">세 요인 회귀식</text><text x="14" y="540">R<tspan dy="0.217em" font-size="92%">it</tspan><tspan dy="-0.2em"> − R</tspan><tspan dy="0.217em" font-size="92%">ft</tspan><tspan dy="-0.2em"> = a</tspan><tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em"> + b</tspan><tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em">(R</tspan><tspan dy="0.217em" font-size="92%">Mt</tspan><tspan dy="-0.2em"> − R</tspan><tspan dy="0.217em" font-size="92%">ft</tspan><tspan dy="-0.2em">)</tspan></text><text x="54" y="566">+ s<tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em">·SMB</tspan><tspan dy="0.217em" font-size="92%">t</tspan><tspan dy="-0.2em"> + h</tspan><tspan dy="0.217em" font-size="92%">i</tspan><tspan dy="-0.2em">·HML</tspan><tspan dy="0.217em" font-size="92%">t</tspan><tspan dy="-0.2em"> + e</tspan><tspan dy="0.217em" font-size="92%">it</tspan></text><text x="14" y="598" style="fill:var(--si-general,#5c6b7f)">절편 a: 요인으로 설명되지 않는 알파</text><text x="14" y="618" style="fill:var(--si-general,#5c6b7f)">모형이 잘 맞으면 0에 가깝다.</text></svg>
