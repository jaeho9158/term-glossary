<svg class="si si-illus" viewBox="0 0 360 472" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hyperinflation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="hyperinflation-t">하이퍼인플레이션: 월 50% 복리로 12개월에 129.7배</title><defs></defs><text x="20" y="24" font-weight="700">월 50% 인플레이션이 복리로 쌓일 때 물가 수준</text><line x1="60" y1="300" x2="356" y2="300" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="60" y1="300" x2="60" y2="50" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="60" y="320" text-anchor="middle">0</text><text x="104" y="320" text-anchor="middle">2</text><text x="148" y="320" text-anchor="middle">4</text><text x="192" y="320" text-anchor="middle">6</text><text x="236" y="320" text-anchor="middle">8</text><text x="280" y="320" text-anchor="middle">10</text><text x="324" y="320" text-anchor="middle">12</text><text x="356" y="342" text-anchor="end">(가로축: 개월)</text><polyline points="60,298.2 82,297.3 104,295.9 126,293.9 148,290.9 170,286.3 192,279.5 214,269.2 236,253.9 258,230.8 280,196.2 302,144.3 324,66.5" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4"/><circle cx="60" cy="298.2" r="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><circle cx="82" cy="297.3" r="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><circle cx="104" cy="295.9" r="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><circle cx="126" cy="293.9" r="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><circle cx="148" cy="290.9" r="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="0"/><circle cx="170" cy="286.3" r="3" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke