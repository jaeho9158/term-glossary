<svg class="si si-illus" viewBox="0 0 360 776" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="콜모고로프 공리: 넓이로 보는 확률" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="22" text-anchor="middle" font-weight="700">확률은 전체 넓이가 1인 영역 위의 넓이</text><text x="20" y="50" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">공리: 겹치지 않는 사건</text><rect x="20" y="60" width="320" height="110" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.8" fill-opacity="0.25"/><text x="28" y="80" style="fill:var(--si-violet-t,#3f2f6b)">Ω: P(Ω) = 1 (전체 넓이)</text><circle cx="70" cy="126" r="28" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="70" y="131" text-anchor="middle" font-style="italic" style="fill:var(--si-violet-t,#3f2f6b)">A<tspan dy="0.217em" font-size="92%">1</tspan></text><ellipse cx="150" cy="126" rx="34" ry="26" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="150" y="131" text-anchor="middle" font-style="italic" style="fill:var(--si-violet-t,#3f2f6b)">A<tspan dy="0.217em" font-size="92%">2</tspan></text><rect x="204" y="102" width="62" height="48" rx="10" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="235" y="131" text-anchor="middle" font-style="italic" style="fill:var(--si-violet-t,#3f2f6b)">A<tspan dy="0.217em" font-size="92%">3</tspan></text><text x="300" y="131" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">…</text><text x="20" y="196" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">공리 1  P(A) ≥ 0 (넓이는 음수가 아니다)</text><text x="20" y="216" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">공리 2  P(Ω) = 1</text><text x="20" y="236" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">공리 3  겹치지 않는 사건이면</text><text x="20" y="256" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">P(A<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">∪A</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">∪…) = P(A</tspan><tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">)+P(A</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">)+…</tspan></text><text x="20" y="298" font-weight="700" style="fill:var(--si-gray-t,#44546a)">따라 나오는 식: 덧셈정리</text><rect x="20" y="308" width="320" height="138" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8" fill-opacity="0.35"/><text x="28" y="328" style="fill:var(--si-gray-t,#44546a)">Ω</text><circle cx="130" cy="368" r="45" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6" fill-opacity="0.55"/><circle cx="200" cy="368" r="45" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6" fill-opacity="0.55"/><path d="M165,339.7 A45 45 0 0 1 165,396.3 A45 45 0 0 1 165,339.7 Z" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.4" fill-opacity="0.75"/><text x="108" y="372" text-anchor="middle" font-style="italic" style="fill:var(--si-blue-t,#12305c)">A</text><text x="222" y="372" text-anchor="middle" font-style="italic" style="fill:var(--si-amber-t,#7a5210)">B</text><text x="180" y="436" text-anchor="middle" style="fill:var(--si-violet-t,#3f2f6b)">A∩B: 두 번 세어진다</text><text x="20" y="474" font-weight="700" style="fill:var(--si-gray-t,#44546a)">P(A∪B) = P(A)+P(B) − P(A∩B)</text><text x="20" y="508" font-weight="700" style="fill:var(--si-gray-t,#44546a)">따라 나오는 식: 여사건과 공집합</text><path d="M20,518 L340,518 L340,626 L20,626 Z M138,572 A28 28 0 1 0 82,572 A28 28 0 1 0 138,572 Z" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="0" fill-opacity="0.7"/><rect x="20" y="518" width="320" height="108" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.8"/><circle cx="110" cy="572" r="28" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="110" y="577" text-anchor="middle" font-style="italic" style="fill:var(--si-blue-t,#12305c)">A</text><text x="210" y="552" font-style="italic" style="fill:var(--si-rose-t,#7d2626)">A<tspan dy="-0.435em" font-size="92%">c</tspan></text><text x="236" y="552" style="fill:var(--si-rose-t,#7d2626)">(A 바깥)</text><circle cx="300" cy="590" r="6" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4" stroke-dasharray="2 2"/><text x="300" y="614" text-anchor="middle">∅</text><text x="20" y="656" font-weight="700" style="fill:var(--si-gray-t,#44546a)">P(A<tspan dy="-0.435em" font-size="92%">c</tspan><tspan dy="0.4em">) = 1 − P(A)</tspan></text><text x="20" y="676" font-weight="700" style="fill:var(--si-gray-t,#44546a)">P(∅) = 0 (빈 영역은 넓이가 없다)</text><text x="20" y="716">공리는 확률이 지켜야 할 조건일 뿐,</text><text x="20" y="736">값이나 해석은 정하지 않는다.</text><text x="20" y="756" style="fill:var(--si-general,#5c6b7f)">(콜모고로프, 1933)</text></svg>
