<svg class="si si-illus" viewBox="0 0 520 340" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="옥상녹화 단면에서 방근층의 위치" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><desc>옥상녹화의 층을 식생에서 구조 지지체까지 위에서 아래 순서로 쌓은 단면. 방근층은 배수층 아래, 단열재 위에 있다.</desc><defs><marker id="root-barrier-layer-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><rect x="90" y="40" width="220" height="34" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-s,#5b9b83)" stroke-width="1.2" fill-opacity="0.2"/><text x="200" y="61" text-anchor="middle" font-size="12" font-weight="400">식생</text><rect x="90" y="74" width="220" height="34" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1.2" fill-opacity="0.2"/><text x="200" y="95" text-anchor="middle" font-size="12" font-weight="400">생육 기반</text><rect x="90" y="108" width="220" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.2"/><text x="200" y="129" text-anchor="middle" font-size="12" font-weight="400">여과막</text><rect x="90" y="142" width="220" height="34" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.2" fill-opacity="0.2"/><text x="200" y="163" text-anchor="middle" font-size="12" font-weight="400">배수층</text><rect x="90" y="176" width="220" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="2.4" fill-opacity="0.45"/><text x="200" y="197" text-anchor="middle" font-size="12" font-weight="700">방근층</text><rect x="90" y="210" width="220" height="34" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.2" fill-opacity="0.2"/><text x="200" y="231" text-anchor="middle" font-size="12" font-weight="400">단열재</text><rect x="90" y="244" width="220" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.2"/><text x="200" y="265" text-anchor="middle" font-size="12" font-weight="400">증기 차단층</text><rect x="90" y="278" width="220" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-s,#aab6c6)" stroke-width="1.2" fill-opacity="0.2"/><text x="200" y="299" text-anchor="middle" font-size="12" font-weight="400">구조 지지체</text><text x="200" y="28" text-anchor="middle" font-size="12" font-weight="700">옥상녹화 단면(위에서 아래로)</text><line x1="60" y1="60" x2="60" y2="174" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.8" marker-end="url(#root-barrier-layer-ar)"/><text x="60" y="192" text-anchor="middle" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">뿌리</text><text x="322" y="197" font-size="12" style="fill:var(--si-rose-s,#c97b7b)">뿌리 침투를 막는 층</text></svg>
