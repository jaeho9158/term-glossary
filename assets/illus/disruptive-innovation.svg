<svg class="si si-illus" viewBox="0 0 360 556" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="disruptive-innovation-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="disruptive-innovation-t">파괴적 혁신: 성능 향상이 주류 요구를 넘어서는 교차</title><defs><marker id="disruptive-innovation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><text x="20" y="22" font-weight="700">제품 성능</text><line x1="50" y1="320" x2="50" y2="32" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#disruptive-innovation-ar)"/><line x1="50" y1="320" x2="344" y2="320" style="stroke:currentColor;fill:none" stroke-width="1.6" marker-end="url(#disruptive-innovation-ar)"/><text x="344" y="342" text-anchor="end" font-weight="700">시간</text><polyline points="50,175 330,135" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="30" opacity="0.3"/><line x1="110" y1="198" x2="110" y2="186" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="60" y="214" font-weight="700" style="fill:var(--si-general,#5c6b7f)">주류 고객 요구 성능</text><polyline points="50,260 330,236" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="20" opacity="0.2"/><text x="60" y="300" style="fill:var(--si-blue-s,#7f9ac0)">저가·신규 시장 요구</text><text x="230" y="122" font-weight="700" style="fill:var(--si-limit,#7d2626)">과잉 성능</text><line x1="50" y1="175" x2="330" y2="60" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="3"/><path d="M50,262 C61.7,260.7 96.7,259.3 120,254 C143.3,248.7 168.3,242.7 190,230 C211.7,217.3 231.7,198.3 250,178 C268.3,157.7 286.7,125 300,108 C313.3,91 325,81.3 330,76" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3.4"/><polyline points="279.4,128.6 277,128.1 274.6,128.1 272.3,128.7 270.1,129.9 268.3,131.6 267,133.6 266.2,135.9 266,138.3 266.4,140.8 267.3,143" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><polyline points="272.6,147.4 275,147.9 277.4,147.9 279.7,147.3 281.9,146.1 283.7,144.4 285,142.4 285.8,140.1 286,137.7 285.6,135.2 284.7,133" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><g class="si-marker"><circle cx="66" cy="236" r="10" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="66" y="240" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">1</text></g><g class="si-marker"><circle cx="90" cy="132.6" r="10" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="90" y="136.6" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">2</text></g><g class="si-marker"><circle cx="304" cy="176" r="10" style="fill:var(--si-accent,#2454ff);stroke:none"/><text x="304" y="180" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--si-bg,#ffffff)">3</text></g><line x1="298" y1="168" x2="284" y2="146" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2"/><text x="20" y="376" font-weight="700">① 파괴적 혁신(파랑): 저렴·단순하고</text><text x="20" y="396" font-weight="700">초기 성능은 열등하다.</text><text x="20" y="428" font-weight="700">② 기존 기업(회색): 존속적 혁신으로</text><text x="20" y="448" font-weight="700">점진 개선한다.</text><text x="20" y="480" font-weight="700">③ 성능이 주류 요구를 충족하는 지점(원)에서</text><text x="20" y="500" font-weight="700">기존 기업을 대체한다.</text><text x="20" y="536" style="fill:var(--si-general,#5c6b7f)">획기적 신기술 일반이 아니다(Christensen 1997).</text></svg>
