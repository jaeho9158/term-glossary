<svg class="si si-illus" viewBox="0 0 360 506" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="causal-inference-criteria-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="causal-inference-criteria-t">인과 추론의 세 조건: 시간 순서·공변성·대안 설명 배제</title><defs><marker id="causal-inference-criteria-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="causal-inference-criteria-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="20" y="24" font-weight="700">① 시간적 선행성: 원인이 먼저</text><rect x="20" y="40" width="110" height="40" rx="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.4"/><text x="75" y="64" text-anchor="middle">비(원인)</text><line x1="134" y1="60" x2="226" y2="60" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#causal-inference-criteria-ar)"/><text x="180" y="52" text-anchor="middle">먼저</text><rect x="230" y="36" width="110" height="52" rx="8" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.4"/><text x="285" y="56" text-anchor="middle">우산 판매</text><text x="285" y="76" text-anchor="middle">증가(결과)</text><text x="20" y="112" font-weight="700">② 공변성: 함께 변함</text><line x1="50" y1="140" x2="50" y2="236" style="stroke:currentColor;fill:none" stroke-width="1.6"/><line x1="50" y1="236" x2="200" y2="236" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="58" y="142">우산 판매량</text><text x="125" y="256" text-anchor="middle">비의 양</text><circle cx="68" cy="222" r="3.5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle