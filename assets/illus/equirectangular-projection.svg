<svg class="si si-illus" viewBox="0 0 600 330" style="max-width:600px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="equirectangular-projection-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="equirectangular-projection-t">등장방형도법: 경도·위도를 같은 간격의 직교 격자로 옮김</title><defs></defs><rect x="70" y="50" width="400" height="200" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="136.7" y1="50" x2="136.7" y2="250" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="203.3" y1="50" x2="203.3" y2="250" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="270" y1="50" x2="270" y2="250" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="336.7" y1="50" x2="336.7" y2="250" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="403.3" y1="50" x2="403.3" y2="250" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="70" y1="216.7" x2="470" y2="216.7" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="70" y1="183.3" x2="470" y2="183.3" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="70" y1="150" x2="470" y2="150" style="stroke:currentColor;fill:none" stroke-width="1.6" opacity="0.9"/><line x1="70" y1="116.7" x2="470" y2="116.7" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="70" y1="83.3" x2="470" y2="83.3" style="stroke:currentColor;fill:none" stroke-width="1" opacity="0.4"/><line x1="70" y1="83.3" x2="470" y2="83.3" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3"/><text x="64" y="87.3" text-anchor="end" font-size="12">북위 60°</text><text x="64" y="120.7" text-anchor="end" font-size="12">30°</text><text x="64" y="154" text-anchor="end" font-size="12">적도</text><text x="64" y="187.3" text-anchor="end" font-size="12">남위 30°</text><text x="64" y="220.7" text-anchor="end" font-size="12">60°</text><text x="70" y="268" text-anchor="middle" font-size="12">경도 −180°</text><text x="270" y="268" text-anchor="middle" font-size="12">0°</text><text x="470" y="268" text-anchor="middle" font-size="12">180°</text><text x="478" y="87.3" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">북위 60° 위선</text><g class="si-rich" font-size="13" ><text x="12.1" y="296">위선은 적도와 같은 길이로 그려져, 북위 60°에서 동서 방향이 </text><text x="398.2" y="289.8" text-anchor="middle" font-size="10.4">1</text><line x1="375.8" y1="291.8" x2="420.6" y2="291.8" style="stroke:currentColor" stroke-width="0.8"/><text x="398.2" y="300.8" text-anchor="middle" font-size="10.4">cos 60°</text><text x="422.1" y="296"> = 2배로 늘어난다</text></g></svg>
