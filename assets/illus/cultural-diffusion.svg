<svg class="si si-illus" viewBox="0 0 360 622" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cultural-diffusion-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cultural-diffusion-t">문화전파: 전염·계층(팽창)과 이전</title><defs><marker id="cultural-diffusion-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker></defs><text x="24" y="22" font-weight="700">팽창전파: 발생지에 문화가 남은 채 범위가 넓어진다</text><polyline points="10,38 10,362" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><rect x="18" y="36" width="328" height="160" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="18" y="206" width="328" height="160" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><rect x="18" y="376" width="328" height="160" rx="8" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-bg,#ffffff)" stroke-width="1.2"/><text x="28" y="58" font-weight="700">전염전파</text><circle cx="80" cy="130" r="56" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="80" cy="130" r="30" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="80" cy="130" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2"/><circle cx="118" cy="120" r="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><circle cx="100" cy="164" r="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><circle cx="60" cy="98" r="5" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><circle cx="146" cy="140" r="5" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><circle cx="168" cy="106" r="5" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><circle cx="150" cy="172" r="5" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><text x="190" y="98">인접 지역과</text><text x="190" y="118">접촉하며 차례로</text><text x="190" y="138">퍼진다</text><text x="190" y="168" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">발생지: 문화 유지</text><text x="28" y="228" font-weight="700">계층전파</text><circle cx="56" cy="296" r="15" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="2"/><circle cx="250" cy="272" r="15" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><line x1="72" y1="290" x2="232" y2="274" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2.4" marker-end="url(#cultural-diffusion-ar)"/><circle cx="150" cy="324" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><circle cx="300" cy="318" r="9" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><line x1="62" y1="310" x2="140" y2="322" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#cultural-diffusion-ar)"/><line x1="252" y1="288" x2="293" y2="312" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" marker-end="url(#cultural-diffusion-ar)"/><circle cx="100" cy="256" r="3" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><circle cx="190" cy="306" r="3" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><circle cx="200" cy="246" r="3" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><circle cx="320" cy="276" r="3" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.2"/><text x="28" y="356" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">큰 도시부터, 작은 곳은 나중에</text><text x="28" y="398" font-weight="700">이전전파</text><ellipse cx="70" cy="466" rx="44" ry="32" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><ellipse cx="280" cy="466" rx="44" ry="32" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="2"/><text x="70" y="470" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">출발지</text><text x="280" y="470" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">도착지</text><path d="M124.7,478 L124.7,464.8 Q124.7,461.7 127.6,461.7 L132.4,461.7 Q135.3,461.7 135.3,464.8 L135.3,478Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.5"/><circle cx="130" cy="457.8" r="3.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.5"/><path d="M164.7,478 L164.7,464.8 Q164.7,461.7 167.6,461.7 L172.4,461.7 Q175.3,461.7 175.3,464.8 L175.3,478Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.5"/><circle cx="170" cy="457.8" r="3.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.5"/><path d="M204.7,478 L204.7,464.8 Q204.7,461.7 207.6,461.7 L212.4,461.7 Q215.3,461.7 215.3,464.8 L215.3,478Z" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.5"/><circle cx="210" cy="457.8" r="3.4" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.5"/><line x1="116" y1="496" x2="232" y2="496" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2" marker-end="url(#cultural-diffusion-ar)"/><text x="28" y="526" font-weight="700" style="fill:var(--si-blue-s,#7f9ac0)">사람이 이주하며 문화도 함께 옮겨 간다</text><text x="14" y="560" font-weight="700">실제로는 여러 방식이 함께 나타난다.</text><text x="14" y="582" style="fill:var(--si-general,#5c6b7f)">예: K-POP은 방송·SNS를 타는 계층전파와</text><text x="14" y="602" style="fill:var(--si-general,#5c6b7f)">팬덤 사이의 전염전파가 함께 나타난다.</text></svg>
