<svg class="si si-illus" viewBox="0 0 360 614" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hohmann-transfer-orbit-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="hohmann-transfer-orbit-t">호만 전이궤도: 두 원궤도와 접하는 타원</title><defs><marker id="hohmann-transfer-orbit-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-amber-s,#d79a2b)"/></marker></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">호만 전이: 두 원궤도를 잇는 반 바퀴 타원</text><circle cx="165" cy="175" r="42" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="2"/><circle cx="165" cy="175" r="110" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="2"/><path d="M275 175 A76 68 0 0 1 123 175" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.5"/><path d="M123 175 A76 68 0 0 1 275 175" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3.4"/><circle cx="165" cy="175" r="8" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><text x="165" y="206" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">지구</text><line x1="157" y1="175" x2="123" y2="175" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="207" y1="175" x2="275" y2="175" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="1.4" stroke-dasharray="3 3"/><text x="143" y="154" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">r<tspan dy="0.217em" font-size="92%">1</tspan></text><text x="230" y="154" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">r<tspan dy="0.217em" font-size="92%">2</tspan></text><circle cx="123" cy="175" r="4" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><circle cx="275" cy="175" r="4" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-s,#9382bd)" stroke-width="1.6"/><line x1="110" y1="175" x2="110" y2="133" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#hohmann-transfer-orbit-ar)"/><line x1="288" y1="175" x2="288" y2="217" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#hohmann-transfer-orbit-ar)"/><text x="95" y="134" text-anchor="end" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">Δv<tspan dy="0.217em" font-size="92%">1</tspan></text><text x="296" y="232" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">Δv<tspan dy="0.217em" font-size="92%">2</tspan></text><text x="108" y="206" text-anchor="end" font-weight="700">근지점</text><line x1="108" y1="200" x2="121" y2="179" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><text x="284" y="138" font-weight="700">원지점</text><line x1="300" y1="144" x2="278" y2="171" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1"/><line x1="14" y1="317" x2="40" y2="317" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3"/><text x="48" y="322">출발 원궤도 (반지름 r<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">)</tspan></text><line x1="14" y1="341" x2="40" y2="341" style="stroke:var(--si-green-s,#5b9b83);fill:none" stroke-width="3"/><text x="48" y="346">목표 원궤도 (반지름 r<tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">)</tspan></text><line x1="14" y1="365" x2="40" y2="365" style="stroke:var(--si-violet-s,#9382bd);fill:none" stroke-width="3"/><text x="48" y="370">전이 타원: 반 바퀴만 비행</text><line x1="14" y1="389" x2="40" y2="389" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="3" marker-end="url(#hohmann-transfer-orbit-ar)"/><text x="48" y="394">접선 방향 가속 (Δv<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em">, Δv</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em">)</tspan></text><g class="si-rich" font-size="13"  style="fill:var(--si-general,#5c6b7f)"><text x="14" y="424">a<tspan dy="0.217em" font-size="92%">t</tspan><tspan dy="-0.2em"> = </tspan></text><text x="67.1" y="417.8" text-anchor="middle" font-size="10.4">r<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em"> + r</tspan><tspan dy="0.217em" font-size="92%">2</tspan></text><line x1="46.8" y1="419.8" x2="87.3" y2="419.8" style="stroke:var(--si-general,#5c6b7f)" stroke-width="0.8"/><text x="67.1" y="428.8" text-anchor="middle" font-size="10.4">2</text><text x="88.8" y="424">: 전이 타원의 장반경</text></g><text x="14" y="456" font-weight="700">예: 고도 300 km에서 정지궤도로</text><text x="14" y="480">Δv<tspan dy="0.217em" font-size="92%">1</tspan><tspan dy="-0.2em"> ≈ 2.43 km/s, Δv</tspan><tspan dy="0.217em" font-size="92%">2</tspan><tspan dy="-0.2em"> ≈ 1.47 km/s</tspan></text><text x="14" y="500">합계 ≈ 3.89 km/s, 전이 약 5.3시간</text><text x="14" y="536" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">두 번의 임펄스 전이 중 Δv 합이 최소</text><g class="si-rich" font-size="13"  style="fill:var(--si-general,#5c6b7f)"><text x="23.2" y="555.8" text-anchor="middle" font-size="10.4">r<tspan dy="0.217em" font-size="92%">2</tspan></text><line x1="15.5" y1="557.8" x2="30.9" y2="557.8" style="stroke:var(--si-general,#5c6b7f)" stroke-width="0.8"/><text x="23.2" y="566.8" text-anchor="middle" font-size="10.4">r<tspan dy="0.217em" font-size="92%">1</tspan></text><text x="32.4" y="562">이 11.94를 넘으면 쌍타원이 유리할 수 있고,</text></g><text x="14" y="592" style="fill:var(--si-general,#5c6b7f)">15.58을 넘으면 항상 유리함</text></svg>
