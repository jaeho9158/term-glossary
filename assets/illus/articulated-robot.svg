2"/><circle cx="252.4" cy="119.7" r="6.5" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2"/><circle cx="299.8" cy="147.2" r="6.5" style="stroke:currentColor;fill:var(--si-bg,#ffffff)" stroke-width="2"/><circle cx="285" cy="110" r="7.5" style="stroke:var(--si-limit,#7d2626);fill:var(--si-limit,#7d2626)" stroke-width="1.6"/><text x="208" y="376" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">1</text><text x="128" y="295" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">2</text><text x="129" y="155" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">3</text><text x="250.4" y="107.7" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">4</text><text x="301" y="112" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">5</text><text x="317.8" y="153.2" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">6</text><text x="50" y="236" font-weight="700" style="fill:var(--si-blue-t,#12305c)">팔(위치) 1~3축</text><text x="200" y="92" font-weight="700" style="fill:var(--si-limit,#7d2626)">손목(자세) 4~6축</text><line x1="262" y1="96" x2="282" y2="101" style="stroke:var(--si-limit,#7d2626);fill:none" stroke-width="1.2"/><text x="14" y="86" font-weight="700" style="fill:var(--si-limit,#7d2626)">구면 손목: 세 축이</text><text x="14" y="122" style="fill:var(--si-limit,#7d2626)">(4·6축은 링크 길이 방향 회전)</text><text x="14" y="104" font-weight="700" style="fill:var(--si-limit,#7d2626)">한 점(빨간 점)에서 만남</text><text x="270" y="290" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">같은 손끝, 다른 자세</text><text x="270" y="310" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">(팔꿈치 위/아래)</text><text x="270" y="332" text-anchor="middle" font-weight="700">역기구학 해 최대 8개</text><text x="14" y="26" font-weight="700">모든 관절이 회전관절인 직렬 구조</text><text x="14" y="46">→ 넓은 작업공간, 오차는 관절을 거치며 누적</text></svg>
