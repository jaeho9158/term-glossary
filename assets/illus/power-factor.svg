<svg class="si si-illus" viewBox="0 0 520 275" style="max-width:520px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="역률 삼각형: 유효전력 P, 무효전력 Q, 피상전력 S" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="power-factor-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="power-factor-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker></defs><line x1="332" y1="77.5" x2="340" y2="68.5" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="245" y1="149.5" x2="245" y2="128" class="si-leader" style="stroke:currentColor" stroke-opacity="0.55" stroke-width="0.8"/><line x1="70" y1="207" x2="310" y2="207" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="310" y1="207" x2="310" y2="27" style="stroke:currentColor;fill:none" stroke-width="3"/><line x1="70" y1="207" x2="310" y2="27" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3" marker-end="url(#power-factor-ar)"/><polyline points="298,207 298,195 310,195" style="stroke:currentColor;fill:none" stroke-width="1"/><line x1="70" y1="207" x2="310" y2="128.1" style="stroke:var(--si-rose-s);fill:none" stroke-width="2" stroke-dasharray="6 4"/><line x1="330" y1="128.1" x2="330" y2="27" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#power-factor-ar-1)" marker-start="url(#power-factor-ar-1)"/><path d="M126,207 A56,56 0 0 0 114.8,173.4" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="144.3" y="198.2" text-anchor="middle">φ<tspan dy="0.278em" font-size="72%">1</tspan></text><path d="M166,207 A96,96 0 0 0 161.2,177" style="stroke:currentColor;fill:none" stroke-width="1.6"/><text x="180.6" y="194.3" text-anchor="middle">φ<tspan dy="0.278em" font-size="72%">2</tspan></text><text x="190" y="227" text-anchor="middle" font-size="12">P = 80 kW (유효전력)</text><text x="290" y="170" text-anchor="end" font-size="12">Q = 60 kvar</text><text x="290" y="188.4" text-anchor="end" font-size="12">(무효전력)</text><text x="158" y="95" text-anchor="end" font-size="12" font-weight="700">S = 100 kVA</text><text x="158" y="117" text-anchor="end" font-size="12">(피상전력)</text><text x="342" y="144.1" font-size="12">Q′ = 26.3 kvar</text><text x="342" y="61.5" font-size="12">콘덴서 33.7 kvar</text><text x="212" y="121" font-size="12" style="fill:var(--si-rose-t)">S′ = 84.2 kVA</text><text x="260" y="257" text-anchor="middle" font-size="14" font-weight="700">S<tspan dy="-0.556em" font-size="72%">2</tspan><tspan dy="0.4em"> = P</tspan><tspan dy="-0.556em" font-size="72%">2</tspan><tspan dy="0.4em"> + Q</tspan><tspan dy="-0.556em" font-size="72%">2</tspan><tspan dy="0.4em">,  PF = P ÷ S = cos φ</tspan></text></svg>
