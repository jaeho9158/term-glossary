<svg class="si si-illus" viewBox="0 0 560 352" style="max-width:560px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cosine-similarity-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="cosine-similarity-t">코사인 유사도의 세 가지 경우</title><desc>두 벡터가 같은 방향일 때 +1, 직교할 때 0, 반대 방향일 때 −1이 되는 코사인 유사도를 세 칸의 벡터 그림으로 나타낸 모식도</desc><defs><marker id="cosine-similarity-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker><marker id="cosine-similarity-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker></defs><text x="20" y="20" font-size="12" font-weight="700">두 벡터 사이의 각과 코사인 유사도</text><line x1="100" y1="200" x2="165.8" y2="176.1" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#cosine-similarity-ar)"/><line x1="100" y1="200" x2="212.8" y2="159" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#cosine-similarity-ar-1)"/><circle cx="100" cy="200" r="3.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><text x="161.8" y="166.1" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">A</text><text x="218.8" y="149" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">B</text><text x="100" y="60" text-anchor="middle" font-size="12" font-weight="700">같은 방향(0°)</text><text x="100" y="262" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">cos θ = +1</text><line x1="280" y1="200" x2="374" y2="165.8" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#cosine-similarity-ar)"/><line x1="280" y1="200" x2="245.8" y2="106" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#cosine-similarity-ar-1)"/><circle cx="280" cy="200" r="3.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><text x="387.1" y="165" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">A</text><text x="241" y="96.9" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">B</text><path d="M308.2,189.7 A30,30 0 0 0 269.7,171.8" style="stroke:currentColor;fill:none" stroke-width="1.2"/><text x="284" y="158" font-size="12">θ</text><text x="280" y="60" text-anchor="middle" font-size="12" font-weight="700">직교(90°)</text><text x="280" y="262" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">cos θ = 0</text><line x1="460" y1="200" x2="544.6" y2="169.2" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2.4" marker-end="url(#cosine-similarity-ar)"/><line x1="460" y1="200" x2="375.4" y2="230.8" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="2.4" marker-end="url(#cosine-similarity-ar-1)"/><circle cx="460" cy="200" r="3.5" style="stroke:none;fill:currentColor" stroke-width="1.6"/><text x="551.5" y="168.4" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">A</text><text x="362.3" y="239.6" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-rose-s,#c97b7b)">B</text><text x="460" y="60" text-anchor="middle" font-size="12" font-weight="700">반대 방향(180°)</text><text x="460" y="262" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--si-accent,#2454ff)">cos θ = −1</text><text x="280" y="300" text-anchor="middle">cos θ = A·B / (‖A‖ ‖B‖)</text><text x="280" y="340" text-anchor="middle" font-size="12" style="fill:var(--si-general,#5c6b7f)">벡터의 길이가 달라도 방향이 같으면 +1이다</text></svg>
