<svg class="si si-illus" viewBox="0 0 360 524" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chronosystem-t" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><title id="chronosystem-t">시간체계: 같은 사건, 다른 발달 시점</title><defs><marker id="chronosystem-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="chronosystem-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-blue-s,#7f9ac0)"/></marker><marker id="chronosystem-ar-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-rose-s,#c97b7b)"/></marker><marker id="chronosystem-ar-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-navy,#12305c)"/></marker></defs><text x="346" y="24" text-anchor="end" font-weight="700">역사적 시간(연도)</text><line x1="30" y1="54" x2="346" y2="54" style="stroke:currentColor;fill:none" stroke-width="2" marker-end="url(#chronosystem-ar)"/><line x1="40" y1="50" x2="40" y2="60" style="stroke:currentColor;fill:none" stroke-width="2"/><line x1="136" y1="50" x2="136" y2="60" style="stroke:currentColor;fill:none" stroke-width="2"/><text x="40" y="44" text-anchor="middle">1920</text><text x="136" y="44" text-anchor="middle">1928</text><rect x="215" y="70" width="30" height="232" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="1.6" opacity="0.8"/><line x1="46" y1="86" x2="142" y2="86" style="stroke:currentColor;fill:none" stroke-width="1.4" marker-end="url(#chronosystem-ar)" marker-start="url(#chronosystem-ar)"/><text x="94" y="106" text-anchor="middle" font-weight="700">약 8년</text><text x="14" y="134" font-weight="700" style="fill:var(--si-blue-t,#12305c)">오클랜드 표본 (1920~21년생)</text><line x1="46" y1="160" x2="346" y2="160" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="3" marker-end="url(#chronosystem-ar-1)"/><circle cx="46" cy="160" r="6" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="1.6"/><text x="14" y="244" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">버클리 표본 (1928~29년생)</text><line x1="142" y1="270" x2="346" y2="270" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="3" marker-end="url(#chronosystem-ar-2)"/><circle cx="142" cy="270" r="6" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6"/><line x1="52" y1="182" x2="215" y2="182" style="stroke:var(--si-blue-s,#7f9ac0);fill:none" stroke-width="1.6" marker-end="url(#chronosystem-ar-1)" marker-start="url(#chronosystem-ar-1)"/><text x="134" y="204" text-anchor="middle" style="fill:var(--si-blue-t,#12305c)">사건 때 나이 많음</text><line x1="148" y1="292" x2="215" y2="292" style="stroke:var(--si-rose-s,#c97b7b);fill:none" stroke-width="1.6" marker-end="url(#chronosystem-ar-2)" marker-start="url(#chronosystem-ar-2)"/><text x="14" y="322" style="fill:var(--si-rose-t,#7d2626)">사건 때 어림:</text><text x="14" y="342" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">부정적 영향 더 큼</text><text x="230" y="322" text-anchor="middle" font-weight="700">같은 사건(가계 타격)</text><circle cx="62" cy="428" r="14" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><circle cx="62" cy="428" r="28" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><circle cx="62" cy="428" r="42" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><circle cx="62" cy="428" r="56" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><line x1="6" y1="428" x2="134" y2="428" style="stroke:var(--si-navy,#12305c);fill:none" stroke-width="3.5" marker-end="url(#chronosystem-ar-3)"/><text x="142" y="410">다섯 번째 층이 아니라</text><text x="142" y="430">모든 체계에 걸친</text><text x="142" y="450" font-weight="700">시간 차원</text><text x="180" y="504" text-anchor="middle" font-weight="700">사건 + 발달적 시점 = 발달 영향</text></svg>
