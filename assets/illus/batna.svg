<svg class="si si-illus" viewBox="0 0 360 360" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BATNA: 연봉 수직선 위의 기대가치와 문턱" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs><marker id="batna-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:currentColor"/></marker><marker id="batna-ar-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--si-accent,#2454ff)"/></marker></defs><rect x="30" y="48" width="185" height="92" style="stroke:none;fill:var(--si-rose-f,#fbe4e4)" stroke-width="0" fill-opacity="0.7"/><rect x="215" y="48" width="125" height="92" style="stroke:none;fill:var(--si-green-f,#e3f1ea)" stroke-width="0" fill-opacity="0.7"/><line x1="30" y1="140" x2="344" y2="140" style="stroke:currentColor;fill:none" stroke-width="1.8" marker-end="url(#batna-ar)"/><text x="344" y="170" text-anchor="end" style="fill:var(--si-general,#5c6b7f)">연봉(만 원)</text><circle cx="55" cy="140" r="7" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><circle cx="255" cy="140" r="14" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-s,#7f9ac0)" stroke-width="0"/><line x1="215" y1="44" x2="215" y2="150" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="3.4"/><text x="215" y="20" text-anchor="middle" font-weight="700" style="fill:var(--si-accent,#2454ff)">BATNA 기대가치 4,640</text><line x1="215" y1="26" x2="215" y2="42" style="stroke:var(--si-accent,#2454ff);fill:none" stroke-width="2" marker-end="url(#batna-ar-1)"/><text x="122" y="82" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">제안 &lt; BATNA</text><text x="122" y="101.5" text-anchor="middle" style="fill:var(--si-rose-t,#7d2626)">→ 거절</text><text x="280" y="82" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">제안 ≥ BATNA</text><text x="280" y="101.5" text-anchor="middle" style="fill:var(--si-green-t,#14543c)">→ 합의 검토</text><text x="55" y="190" text-anchor="middle">4,000만</text><text x="55" y="209.5" text-anchor="middle">(확률 0.2)</text><text x="249" y="190" text-anchor="middle">4,800만</text><text x="249" y="209.5" text-anchor="middle">(확률 0.8)</text><polygon points="180,147 174,155 186,155" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-s,#d79a2b)" stroke-width="1"/><line x1="180" y1="155" x2="180" y2="224" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.2"/><text x="180" y="242" text-anchor="middle" style="fill:var(--si-amber-t,#7a5210)">제안 4,500만</text><text x="180" y="284" text-anchor="middle" font-weight="700">0.8 × 4,800 + 0.2 × 4,000 = 4,640</text><text x="180" y="324" text-anchor="middle">결렬 시 독립적으로 택할 수 있는</text><text x="180" y="343.5" text-anchor="middle">최선의 대안(가상의 이직 협상 예)</text></svg>
