ptic-seizure-ar)"/><line x1="180" y1="32" x2="180" y2="136" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><ellipse cx="298" cy="84" rx="40" ry="52" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><path d="M298,32 A40,52 0 0 0 298,136 Z" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.6"/><path d="M298,32 A40,52 0 0 1 298,136 Z" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.6"/><line x1="298" y1="32" x2="298" y2="136" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.4"/><line x1="108" y1="84" x2="134" y2="84" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" marker-end="url(#epileptic-seizure-ar-1)"/><line x1="226" y1="84" x2="252" y2="84" style="stroke:var(--si-general,#5c6b7f);fill:none" stroke-width="1.6" marker-end="url(#epileptic-seizure-ar-1)"/><text x="62" y="164" text-anchor="middle" font-weight="700">① 국소성</text><text x="62" y="186" text-anchor="middle">시작 부위에</text><text x="62" y="208" text-anchor="middle">국한</text><text x="180" y="164" text-anchor="middle" font-weight="700">② 전파·확산</text><text x="180" y="186" text-anchor="middle">같은 반구에서</text><text x="180" y="208" text-anchor="middle">퍼짐</text><text x="298" y="164" text-anchor="middle" font-weight="700">③ 이차성 전신화</text><text x="298" y="186" text-anchor="middle">양쪽 반구로</text><text x="298" y="208" text-anchor="middle">(의식 소실 동반)</text><line x1="10" y1="226" x2="350" y2="226" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><ellipse cx="62" cy="300" rx="40" ry="52" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.8"/><path d="M62,248 A40,52 0 0 0 62,352 Z" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.6"/><path d="M62,248 A40,52 0 0 1 62,352 Z" style="stroke:none;fill:var(--si-rose-s,#c97b7b)" stroke-width="1.6" fill-opacity="0.6"/><line x