<svg class="si si-illus" viewBox="0 0 360 500" style="max-width:360px;color:var(--si-ink,var(--text,#1f2328))" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="약물상호작용 스크리닝: 자료집 간 불일치와 경고 무시율" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13" fill="currentColor"><defs></defs><text x="180" y="20" text-anchor="middle" font-size="14" font-weight="700">약물 상호작용 경고: 합의는 적고 무시는 많다</text><text x="24" y="54" font-weight="700">자료집 4개의 주요 상호작용 406건 (Abarca 외, 2004)</text><rect x="24" y="68" width="223.6" height="54" style="stroke:var(--si-blue-s,#7f9ac0);fill:var(--si-blue-f,#dde5f0)" stroke-width="1.6"/><rect x="247.6" y="68" width="81.4" height="54" style="stroke:var(--si-gray-s,#aab6c6);fill:var(--si-gray-f,#eef1f6)" stroke-width="1.6"/><rect x="329" y="68" width="7" height="54" style="stroke:var(--si-amber-s,#d79a2b);fill:var(--si-amber-f,#fdf0d8)" stroke-width="2"/><text x="135.8" y="90" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">1개 자료집만</text><text x="135.8" y="115" text-anchor="middle" font-weight="700" style="fill:var(--si-blue-t,#12305c)">291건 (71.7%)</text><text x="288.3" y="101" text-anchor="middle" style="fill:var(--si-general,#5c6b7f)">나머지</text><line x1="333" y1="122" x2="333" y2="138" style="stroke:var(--si-amber-s,#d79a2b);fill:none" stroke-width="1.6"/><text x="336" y="156" text-anchor="end" font-weight="700" style="fill:var(--si-amber-t,#7a5210)">4개 모두 공통: 9건 (2.2%)</text><text x="24" y="182" style="fill:var(--si-general,#5c6b7f)">같은 조합이어도 자료집마다 판정이 다름</text><text x="24" y="204" style="fill:var(--si-general,#5c6b7f)">급내상관계수 −0.092</text><line x1="24" y1="224" x2="336" y2="224" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="24" y="254" font-weight="700">중증 경고 100% (Weingart 외, 2003)</text><rect x="24" y="268" width="312" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><rect x="24" y="268" width="278.9" height="34" style="stroke:var(--si-rose-s,#c97b7b);fill:var(--si-rose-f,#fbe4e4)" stroke-width="1.6"/><text x="163.5" y="291" text-anchor="middle" font-weight="700" style="fill:var(--si-rose-t,#7d2626)">무시(override) 89.4%</text><rect x="24" y="318" width="312" height="34" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><rect x="24" y="318" width="113.9" height="34" style="stroke:var(--si-violet-s,#9382bd);fill:var(--si-violet-f,#eae4f4)" stroke-width="1.6"/><text x="145.9" y="341" font-weight="700" style="fill:var(--si-violet-t,#3f2f6b)">의사가 부적절 판단 36.5%</text><line x1="24" y1="372" x2="336" y2="372" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1"/><text x="24" y="402" font-weight="700">전산 DB와 임상의 평가의 겹침 (Roblek 외, 2015)</text><rect x="24" y="416" width="312" height="30" style="stroke:var(--si-gray-s,#aab6c6);fill:none" stroke-width="1.6"/><rect x="24" y="416" width="34.3" height="30" style="stroke:var(--si-green-s,#5b9b83);fill:var(--si-green-f,#e3f1ea)" stroke-width="1.6"/><text x="66.3" y="437" font-weight="700" style="fill:var(--si-green-t,#14543c)">최저 11%</text><text x="24" y="480" style="fill:var(--si-general,#5c6b7f)">경고가 너무 많으면 무시되는 경고 피로가 생김</text></svg>
